<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 - 个人作品集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Portfolio</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="projects.html">项目</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="contact.html" class="active">联系</a></li>
            </ul>
            <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
    </nav>

    <section class="page-header">
        <h1>联系我</h1>
        <p style="color: var(--text-secondary);">期待与您合作</p>
    </section>

    <section>
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">姓名 *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱 *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="subject">主题</label>
                <input type="text" id="subject" name="subject">
            </div>
            <div class="form-group">
                <label for="message">消息 *</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; border: none; cursor: pointer; font-size: 1rem;">发送消息</button>
        </form>

        <div class="contact-info">
            <div>
                <h3>📧 邮箱</h3>
                <p style="color: var(--text-secondary);">hello@example.com</p>
            </div>
            <div>
                <h3>📱 电话</h3>
                <p style="color: var(--text-secondary);">+86 138-0000-0000</p>
            </div>
            <div>
                <h3>📍 地址</h3>
                <p style="color: var(--text-secondary);">中国 · 上海</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Portfolio. All rights reserved.</p>
            <div class="social-links">
                <a href="#">GitHub</a><a href="#">Twitter</a><a href="#">LinkedIn</a>
            </div>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
