<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极简番茄钟</title>
<style>
  :root {
    --bg: #1a1b26;
    --panel: #24283b;
    --text: #c0caf5;
    --muted: #565f89;
    --accent: #f7768e;
    --ok: #9ece6a;
    --warn: #e0af68;
    --btn: #414868;
    --btn-hover: #565f89;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .card {
    width: min(420px, 92vw);
    background: var(--panel);
    border-radius: 16px;
    padding: 32px 28px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #status {
    font-size: .95rem;
    font-weight: 600;
    min-height: 1.4em;
    margin-bottom: 16px;
    color: var(--muted);
  }
  #status.running { color: var(--ok); }
  #status.paused  { color: var(--warn); }
  #status.done    { color: var(--accent); font-size: 1.15rem; }
  #display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.5rem, 12vw, 4.5rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: .04em;
    margin-bottom: 28px;
    color: var(--text);
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--btn);
    color: var(--text);
    transition: background .15s, transform .05s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(.97); }
  button:disabled {
    opacity: .4;
    cursor: not-allowed;
  }
  #btnStart {
    background: var(--ok);
    color: #1a1b26;
  }
  #btnStart:hover { background: #b9d97d; }
  #btnPause {
    background: var(--warn);
    color: #1a1b26;
  }
  #btnPause:hover { background: #ecc48a; }
  .config {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: .9rem;
  }
  .config label { user-select: none; }
  #minutes {
    width: 4.5rem;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--muted);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #minutes:focus {
    outline: none;
    border-color: var(--ok);
  }
  .hint {
    margin-top: 18px;
    font-size: .75rem;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <h1>番茄钟</h1>
  <div id="status" aria-live="polite">就绪</div>
  <div id="display" aria-live="polite">25:00</div>
  <div class="controls">
    <button id="btnStart" type="button">开始</button>
    <button id="btnPause" type="button" disabled>暂停</button>
    <button id="btnReset" type="button">重置</button>
  </div>
  <div class="config">
    <label for="minutes">时长（分钟）</label>
    <input id="minutes" type="number" min="1" max="60" step="1" value="25">
  </div>
  <p class="hint">时长范围 1–60 的正整数。结束后状态文案变为「时间到」，并尝试播放提示音（若浏览器策略禁止，则仅文案提示）。</p>
</div>

<script>
"use strict";

/* ========== 纯逻辑（无 DOM，可被 Node 加载/审查） ========== */

/**
 * 将用户输入归一化为 1–60 的正整数分钟。
 * 无效输入回退到 fallbackMinutes。
 */
function normalizeMinutes(raw, fallbackMinutes) {
  var n = typeof raw === "number" ? raw : parseInt(String(raw).trim(), 10);
  if (!isFinite(n) || !Number.isInteger(n) || n < 1 || n > 60) {
    return fallbackMinutes;
  }
  return n;
}

/**
 * 剩余秒数 → 显示字符串 mm:ss
 * 例如 1500 → "25:00"，65 → "01:05"
 */
function formatTime(totalSeconds) {
  var s = Math.max(0, Math.floor(totalSeconds));
  var m = Math.floor(s / 60);
  var r = s % 60;
  return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
}

/**
 * 番茄钟状态机（纯函数式计时逻辑）。
 * 状态：idle | running | paused | done
 *
 * API:
 *   getState()          → { status, remainingSeconds, durationMinutes }
 *   start()             → 新状态
 *   pause()             → 新状态（仅 running 有效）
 *   reset(minutes?)     → 回到 idle，按当前/指定时长
 *   setDuration(minutes)→ 仅在 idle/done 时可改时长并重置显示
 *   tick()              → 剩余秒 -1；到 0 时 status=done
 */
function createTimer(durationMinutes) {
  var durationMin = normalizeMinutes(durationMinutes, 25);
  var status = "idle";
  var remaining = durationMin * 60;

  function snapshot() {
    return {
      status: status,
      remainingSeconds: remaining,
      durationMinutes: durationMin
    };
  }

  return {
    getState: function () { return snapshot(); },

    start: function () {
      if (status === "done") {
        // 从完成后重新开始一轮：回到满时长 running
        remaining = durationMin * 60;
      }
      if (status === "running") return snapshot();
      status = "running";
      return snapshot();
    },

    pause: function () {
      if (status === "running") status = "paused";
      return snapshot();
    },

    reset: function (minutes) {
      if (minutes !== undefined && minutes !== null) {
        durationMin = normalizeMinutes(minutes, durationMin);
      }
      status = "idle";
      remaining = durationMin * 60;
      return snapshot();
    },

    setDuration: function (minutes) {
      if (status === "running" || status === "paused") {
        return snapshot(); // 计时中不允许改时长
      }
      durationMin = normalizeMinutes(minutes, durationMin);
      status = "idle";
      remaining = durationMin * 60;
      return snapshot();
    },

    tick: function () {
      if (status !== "running") return snapshot();
      if (remaining > 0) remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        status = "done";
      }
      return snapshot();
    }
  };
}

/* Node 环境导出纯逻辑，便于核对 */
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    normalizeMinutes: normalizeMinutes,
    formatTime: formatTime,
    createTimer: createTimer
  };
}

/* ========== DOM 绑定（仅浏览器执行） ========== */

if (typeof document !== "undefined") {
  (function () {
    var DEFAULT_MINUTES = 25;
    var STATUS_TEXT = {
      idle: "就绪",
      running: "计时中",
      paused: "已暂停",
      done: "时间到"
    };

    var displayEl = document.getElementById("display");
    var statusEl = document.getElementById("status");
    var btnStart = document.getElementById("btnStart");
    var btnPause = document.getElementById("btnPause");
    var btnReset = document.getElementById("btnReset");
    var minutesEl = document.getElementById("minutes");

    var timer = createTimer(DEFAULT_MINUTES);
    var intervalId = null;

    function render(state) {
      displayEl.textContent = formatTime(state.remainingSeconds);
      statusEl.textContent = STATUS_TEXT[state.status] || state.status;
      statusEl.className = state.status;
      btnStart.disabled = state.status === "running";
      btnPause.disabled = state.status !== "running";
      if (state.status === "idle" || state.status === "done") {
        minutesEl.disabled = false;
      } else {
        minutesEl.disabled = true;
      }
    }

    function stopTicker() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    function startTicker() {
      stopTicker();
      intervalId = setInterval(function () {
        var state = timer.tick();
        render(state);
        if (state.status === "done") {
          stopTicker();
          beep();
        }
      }, 1000);
    }

    function beep() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
        osc.stop(ctx.currentTime + 0.65);
        osc.onended = function () {
          try { ctx.close(); } catch (e) { /* ignore */ }
        };
      } catch (e) {
        // 浏览器策略或不支持 Web Audio：静默，仅依赖「时间到」文案
      }
    }

    btnStart.addEventListener("click", function () {
      var state = timer.start();
      render(state);
      if (state.status === "running") startTicker();
    });

    btnPause.addEventListener("click", function () {
      var state = timer.pause();
      render(state);
      if (state.status === "paused") stopTicker();
    });

    btnReset.addEventListener("click", function () {
      var mins = normalizeMinutes(minutesEl.value, DEFAULT_MINUTES);
      minutesEl.value = String(mins);
      var state = timer.reset(mins);
      stopTicker();
      render(state);
    });

    minutesEl.addEventListener("change", function () {
      var mins = normalizeMinutes(minutesEl.value, DEFAULT_MINUTES);
      minutesEl.value = String(mins);
      var state = timer.setDuration(mins);
      if (state.status !== "running" && state.status !== "paused") {
        stopTicker();
        render(state);
      }
    });

    // 初始渲染
    minutesEl.value = String(DEFAULT_MINUTES);
    render(timer.getState());
  })();
}
</script>
</body>
</html>
