<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟 · pomodoro-lite</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1c1b18;
      --muted: #6f6a60;
      --line: #d9d2c5;
      --accent: #c45c26;
      --accent-ink: #fff8f2;
      --run: #2f6f4e;
      --done: #a33a2d;
      --err: #a33a2d;
      --shadow: 0 18px 40px rgba(28, 27, 24, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top left, #fffaf1 0%, transparent 45%),
        linear-gradient(180deg, #efe8db 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .shell {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 1.75rem 1.5rem 1.4rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .tag {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .clock {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.4rem, 12vw, 4.4rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.03em;
      margin: 0.4rem 0 0.55rem;
    }
    .clock.done { color: var(--done); }
    .clock.running { color: var(--run); }
    .status {
      text-align: center;
      min-height: 1.4rem;
      font-size: 0.98rem;
      color: var(--muted);
      margin-bottom: 1.35rem;
    }
    .status.done {
      color: var(--done);
      font-weight: 700;
    }
    .status.running { color: var(--run); font-weight: 600; }
    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1.15rem;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #f7f2e8;
      color: var(--ink);
      border-radius: 12px;
      padding: 0.8rem 0.4rem;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: #f0e8d8;
      border-color: #c8bda8;
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.42; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    button.primary:hover:not(:disabled) {
      background: #b04f1f;
      border-color: #b04f1f;
    }
    .config {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.65rem;
      align-items: end;
      padding-top: 1rem;
      border-top: 1px dashed var(--line);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      color: var(--ink);
      padding: 0.68rem 0.75rem;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(196, 92, 38, 0.15);
    }
    .msg {
      min-height: 1.15rem;
      margin-top: 0.55rem;
      font-size: 0.8rem;
      color: var(--err);
    }
    .hint {
      margin-top: 0.9rem;
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--muted);
    }
    code {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 0.92em;
    }
  </style>
</head>
<body>
  <main class="shell" role="application" aria-label="极简番茄钟">
    <header>
      <h1>番茄钟</h1>
      <span class="tag">pomodoro-lite</span>
    </header>

    <div id="time" class="clock" aria-live="polite">25:00</div>
    <div id="status" class="status" aria-live="polite">就绪</div>

    <div class="controls">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button" disabled>暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>

    <div class="config">
      <label>
        时长（分钟，1–60）
        <input id="minutes" type="number" min="1" max="60" step="1" value="25" inputmode="numeric" />
      </label>
      <button id="applyBtn" type="button">应用</button>
    </div>
    <div id="msg" class="msg" role="alert"></div>
    <p class="hint">
      到时状态文案变为「时间到」。尝试 Web Audio 双音提示；若被自动播放策略拦截则静默，文案不受影响。
      无 CDN / 框架 / 外链。核心逻辑在 <code>#core</code>，可用 Node 抽取核对。
    </p>
  </main>

  <script id="core">
    /**
     * Pomodoro core — pure state machine, no DOM.
     * Host injects clock via options.now().
     * Node: extract this script and use module.exports.createPomodoro.
     */
    function createPomodoro(options) {
      const opts = options || {};
      const DEFAULT_MINUTES = 25;
      const MIN_SECONDS = 60;
      const MAX_SECONDS = 3600;

      let totalSeconds = normalizeSeconds(opts.totalSeconds);
      let remaining = totalSeconds;
      let running = false;
      let done = false;
      let anchorMs = null;
      let listeners = [];

      function toInt(value, fallback) {
        const n = Math.floor(Number(value));
        return Number.isFinite(n) ? n : fallback;
      }

      function clampSeconds(value) {
        const n = toInt(value, DEFAULT_MINUTES * 60);
        if (n < MIN_SECONDS) return MIN_SECONDS;
        if (n > MAX_SECONDS) return MAX_SECONDS;
        return n;
      }

      function normalizeSeconds(value) {
        if (value == null) return DEFAULT_MINUTES * 60;
        return clampSeconds(value);
      }

      function nowMs() {
        return typeof opts.now === "function" ? opts.now() : Date.now();
      }

      function snapshot() {
        return {
          totalSeconds: totalSeconds,
          remaining: remaining,
          running: running,
          done: done,
          status: statusText(),
        };
      }

      function statusText() {
        if (done) return "时间到";
        if (running) return "进行中";
        if (remaining === totalSeconds) return "就绪";
        return "已暂停";
      }

      function emit() {
        const snap = snapshot();
        for (let i = 0; i < listeners.length; i += 1) listeners[i](snap);
      }

      function start() {
        if (done || running) return false;
        running = true;
        anchorMs = nowMs();
        emit();
        return true;
      }

      function pause() {
        if (!running) return false;
        settle();
        running = false;
        anchorMs = null;
        emit();
        return true;
      }

      function reset(newTotalSeconds) {
        if (newTotalSeconds != null) {
          totalSeconds = normalizeSeconds(newTotalSeconds);
        }
        remaining = totalSeconds;
        running = false;
        done = false;
        anchorMs = null;
        emit();
        return true;
      }

      /**
       * Apply duration in whole minutes (1–60).
       * Allowed only when idle or paused (not running, not done).
       * Rejects null/undefined/blank/non-numeric; floors fractional numbers.
       */
      function setDuration(minutes) {
        if (running || done) return false;
        if (minutes == null || minutes === "") return false;
        const mins = toInt(minutes, NaN);
        if (!Number.isFinite(mins)) return false;
        totalSeconds = clampSeconds(mins * 60);
        remaining = totalSeconds;
        emit();
        return true;
      }

      function settle() {
        if (anchorMs == null) return;
        const elapsedMs = nowMs() - anchorMs;
        if (elapsedMs < 1000) return;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        anchorMs += elapsedSec * 1000;
        remaining = Math.max(0, remaining - elapsedSec);
        if (remaining <= 0) {
          remaining = 0;
          running = false;
          done = true;
          anchorMs = null;
        }
      }

      /**
       * Advance by wall clock. Returns true only on the completion edge.
       */
      function tick() {
        if (!running || done) return false;
        if (anchorMs == null) {
          anchorMs = nowMs();
          return false;
        }
        const before = remaining;
        settle();
        if (done) {
          emit();
          return before > 0;
        }
        if (remaining !== before) {
          emit();
        }
        return false;
      }

      function onChange(fn) {
        listeners.push(fn);
        return function unsubscribe() {
          listeners = listeners.filter(function (item) { return item !== fn; });
        };
      }

      function format(seconds) {
        const value = seconds == null ? remaining : toInt(seconds, remaining);
        const safe = Math.max(0, value);
        const m = Math.floor(safe / 60);
        const s = safe % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      return {
        start: start,
        pause: pause,
        reset: reset,
        setDuration: setDuration,
        tick: tick,
        onChange: onChange,
        getState: snapshot,
        format: format,
      };
    }

    if (typeof module !== "undefined" && module.exports) {
      module.exports = { createPomodoro: createPomodoro };
    }
  </script>

  <script id="ui">
    (function () {
      const timeEl = document.getElementById("time");
      const statusEl = document.getElementById("status");
      const msgEl = document.getElementById("msg");
      const minutesEl = document.getElementById("minutes");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");
      const applyBtn = document.getElementById("applyBtn");

      let beepOn = true;
      let audioCtx = null;

      function unlockAudio() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) {
            beepOn = false;
            return null;
          }
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        } catch (e) {
          beepOn = false;
          return null;
        }
      }

      function beep() {
        if (!beepOn) return;
        const ctx = unlockAudio();
        if (!ctx) return;
        try {
          const t = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(784, t);
          osc.frequency.setValueAtTime(988, t + 0.16);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.48);
        } catch (e) {
          beepOn = false;
        }
      }

      const pom = createPomodoro({
        totalSeconds: 25 * 60,
        now: function () { return Date.now(); },
      });

      function render(state) {
        timeEl.textContent = pom.format();
        statusEl.textContent = state.status;
        statusEl.classList.toggle("done", state.done);
        statusEl.classList.toggle("running", state.running && !state.done);
        timeEl.classList.toggle("done", state.done);
        timeEl.classList.toggle("running", state.running && !state.done);

        startBtn.disabled = state.running || state.done;
        pauseBtn.disabled = !state.running;
        applyBtn.disabled = state.running || state.done;
        minutesEl.disabled = state.running || state.done;
      }

      pom.onChange(render);
      render(pom.getState());

      setInterval(function () {
        const completed = pom.tick();
        if (completed) beep();
      }, 250);

      startBtn.addEventListener("click", function () {
        msgEl.textContent = "";
        unlockAudio();
        pom.start();
      });

      pauseBtn.addEventListener("click", function () {
        pom.pause();
      });

      resetBtn.addEventListener("click", function () {
        msgEl.textContent = "";
        const mins = Number(String(minutesEl.value).trim());
        if (Number.isInteger(mins) && mins >= 1 && mins <= 60) {
          minutesEl.value = String(mins);
          pom.reset(mins * 60);
        } else {
          const currentMin = Math.floor(pom.getState().totalSeconds / 60);
          minutesEl.value = String(currentMin);
          pom.reset();
          msgEl.textContent = "请输入 1–60 的整数分钟；已按当前时长重置";
        }
      });

      applyBtn.addEventListener("click", function () {
        const raw = String(minutesEl.value).trim();
        const mins = Number(raw);
        const valid = raw !== "" && Number.isInteger(mins) && mins >= 1 && mins <= 60;
        if (!valid) {
          msgEl.textContent = "请输入 1–60 的整数分钟";
          return;
        }
        const ok = pom.setDuration(mins);
        if (!ok) {
          msgEl.textContent = "运行中或已结束后不可改时长，请先重置";
          return;
        }
        msgEl.textContent = "";
        minutesEl.value = String(mins);
      });

      minutesEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") applyBtn.click();
      });

      window.__pomodoro = {
        pom: pom,
        setBeep: function (v) { beepOn = !!v; },
      };
    })();
  </script>
</body>
</html>
