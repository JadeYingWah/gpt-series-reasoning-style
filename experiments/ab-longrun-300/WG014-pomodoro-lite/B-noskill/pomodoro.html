<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟 · pomodoro-lite</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #e85d4c;
      --accent-soft: rgba(232, 93, 76, 0.18);
      --ok: #3ecf8e;
      --border: #2a3548;
      --radius: 16px;
      font-size: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 800px at 50% 20%, #1a2740 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .display {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 4.5rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    .display.done { color: var(--accent); }
    .status {
      text-align: center;
      min-height: 1.5rem;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .status.done {
      color: var(--accent);
      font-weight: 600;
    }
    .status.running { color: var(--ok); }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-bottom: 1.35rem;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #121a27;
      color: var(--text);
      border-radius: 10px;
      padding: 0.75rem 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) {
      background: #1c2838;
      border-color: #3a4a63;
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) {
      background: #f06b5b;
      border-color: #f06b5b;
    }
    .config {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: end;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    input[type="number"] {
      width: 100%;
      background: #121a27;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .hint {
      margin-top: 0.85rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }
    .err {
      color: #ff8f84;
      font-size: 0.8rem;
      min-height: 1.1rem;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <main class="card" role="application" aria-label="番茄钟">
    <h1>番茄钟 · pomodoro-lite</h1>
    <div id="time" class="display" aria-live="polite">25:00</div>
    <div id="status" class="status" aria-live="polite">就绪</div>

    <div class="controls">
      <button id="startBtn" class="primary" type="button">开始</button>
      <button id="pauseBtn" type="button" disabled>暂停</button>
      <button id="resetBtn" type="button">重置</button>
    </div>

    <div class="config">
      <label>
        时长（分钟，1–60）
        <input id="minutes" type="number" min="1" max="60" step="1" value="25" />
      </label>
      <button id="applyBtn" type="button">应用时长</button>
    </div>
    <div id="err" class="err" role="alert"></div>
    <p class="hint">
      结束时状态显示「时间到」。尝试用 Web Audio 播放提示音；若浏览器拦截音频则静默。
      无 CDN / 外链资源。逻辑可在 Node 中用 <code>eval</code> 加载 <code>&lt;script&gt;</code> 核对。
    </p>
  </main>

  <!--
    Core logic is a pure module so it can be extracted and run under Node
    without a DOM. See response.md for the Node harness snippet.
  -->
  <script id="core">
    /**
     * pomodoro core — no DOM, no timers owned here (host injects clock).
     * Public API for Node verification:
     *   createPomodoro({ totalSeconds, now }) -> instance
     */
    function createPomodoro(options) {
      const opts = options || {};
      let totalSeconds = clampInt(opts.totalSeconds, 60, 3600);
      let remaining = totalSeconds;
      let running = false;
      let done = false;
      let lastTickAt = null;
      let listeners = [];

      function clampInt(v, min, max) {
        const n = Math.floor(Number(v));
        if (!Number.isFinite(n)) return 25 * 60;
        if (n < min) return min;
        if (n > max) return max;
        return n;
      }

      function emit() {
        const snap = getState();
        for (let i = 0; i < listeners.length; i++) listeners[i](snap);
      }

      function getState() {
        return {
          totalSeconds: totalSeconds,
          remaining: remaining,
          running: running,
          done: done,
          status: done ? "时间到" : running ? "进行中" : remaining === totalSeconds ? "就绪" : "已暂停",
        };
      }

      function start() {
        if (done) return false;
        if (running) return false;
        running = true;
        lastTickAt = typeof opts.now === "function" ? opts.now() : Date.now();
        emit();
        return true;
      }

      function pause() {
        if (!running) return false;
        // settle remaining using elapsed wall time
        tick();
        running = false;
        lastTickAt = null;
        emit();
        return true;
      }

      function reset(newTotal) {
        if (newTotal != null) {
          totalSeconds = clampInt(newTotal, 60, 3600);
        }
        running = false;
        done = false;
        lastTickAt = null;
        remaining = totalSeconds;
        emit();
        return true;
      }

      /** Set duration while idle; ignored while running or after done unless reset first. */
      function setDuration(minutes) {
        // Floor whole minutes first (spec: 正整数 1–60), then convert to seconds.
        const mins = Math.floor(Number(minutes));
        const secs = clampInt(mins * 60, 60, 3600);
        if (running || done) return false;
        totalSeconds = secs;
        remaining = secs;
        emit();
        return true;
      }

      /**
       * Advance using wall-clock. Returns true if completion edge occurred.
       * Host should call this on an interval while running.
       */
      function tick() {
        if (!running || done) return false;
        const now = typeof opts.now === "function" ? opts.now() : Date.now();
        if (lastTickAt == null) {
          lastTickAt = now;
          return false;
        }
        const elapsedMs = now - lastTickAt;
        if (elapsedMs < 1000) return false;
        const elapsedSec = Math.floor(elapsedMs / 1000);
        lastTickAt += elapsedSec * 1000;
        remaining = Math.max(0, remaining - elapsedSec);
        if (remaining <= 0) {
          remaining = 0;
          running = false;
          done = true;
          lastTickAt = null;
          emit();
          return true;
        }
        emit();
        return false;
      }

      function onChange(fn) {
        listeners.push(fn);
        return function unsubscribe() {
          listeners = listeners.filter(function (x) { return x !== fn; });
        };
      }

      function format() {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      return {
        start: start,
        pause: pause,
        reset: reset,
        setDuration: setDuration,
        tick: tick,
        onChange: onChange,
        getState: getState,
        format: format,
      };
    }

    // CommonJS export for Node harness
    if (typeof module !== "undefined" && module.exports) {
      module.exports = { createPomodoro: createPomodoro };
    }
  </script>

  <script id="ui">
    (function () {
      const coreSrc = document.getElementById("core").textContent;
      // Re-eval not needed — same page global. In Node we extract #core instead.
      const timeEl = document.getElementById("time");
      const statusEl = document.getElementById("status");
      const errEl = document.getElementById("err");
      const minutesEl = document.getElementById("minutes");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");
      const applyBtn = document.getElementById("applyBtn");

      let beepEnabled = true;
      let audioCtx = null;

      function ensureAudio() {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) { beepEnabled = false; return null; }
          if (!audioCtx) audioCtx = new AC();
          if (audioCtx.state === "suspended") audioCtx.resume();
          return audioCtx;
        } catch (e) {
          beepEnabled = false;
          return null;
        }
      }

      function beep() {
        if (!beepEnabled) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        try {
          const t0 = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, t0);
          osc.frequency.setValueAtTime(660, t0 + 0.15);
          gain.gain.setValueAtTime(0.0001, t0);
          gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.45);
        } catch (e) {
          beepEnabled = false;
        }
      }

      const pom = createPomodoro({ totalSeconds: 25 * 60, now: function () { return Date.now(); } });

      function render(state) {
        timeEl.textContent = pom.format();
        statusEl.textContent = state.status;
        statusEl.classList.toggle("done", state.done);
        statusEl.classList.toggle("running", state.running && !state.done);
        timeEl.classList.toggle("done", state.done);

        startBtn.disabled = state.running || state.done;
        pauseBtn.disabled = !state.running;
        // apply allowed only when idle (not running, not done)
        applyBtn.disabled = state.running || state.done;
        minutesEl.disabled = state.running || state.done;
      }

      pom.onChange(render);
      render(pom.getState());

      // Interval drives ticks using wall clock inside core
      setInterval(function () {
        const completed = pom.tick();
        if (completed) beep();
      }, 200);

      startBtn.addEventListener("click", function () {
        errEl.textContent = "";
        ensureAudio(); // unlock audio on user gesture
        pom.start();
      });

      pauseBtn.addEventListener("click", function () {
        pom.pause();
      });

      resetBtn.addEventListener("click", function () {
        errEl.textContent = "";
        // Reset to currently configured minutes (clamped 1–60)
        const mins = parseInt(minutesEl.value, 10);
        if (!Number.isFinite(mins) || mins < 1 || mins > 60) {
          errEl.textContent = "请输入 1–60 的整数分钟";
          minutesEl.value = String(Math.floor(pom.getState().totalSeconds / 60));
        } else {
          minutesEl.value = String(mins);
        }
        pom.reset(parseInt(minutesEl.value, 10));
      });

      applyBtn.addEventListener("click", function () {
        const raw = minutesEl.value.trim();
        const mins = Number(raw);
        const ok = Number.isInteger(mins) && mins >= 1 && mins <= 60;
        if (!ok) {
          errEl.textContent = "请输入 1–60 的整数分钟";
          return;
        }
        errEl.textContent = "";
        const applied = pom.setDuration(mins);
        if (!applied) {
          errEl.textContent = "运行中或已结束时不可改时长，请先重置";
        }
      });

      minutesEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter") applyBtn.click();
      });

      // expose for console debugging
      window.__pomodoro = { pom: pom, setBeep: function (v) { beepEnabled = !!v; } };
    })();
  </script>
</body>
</html>
