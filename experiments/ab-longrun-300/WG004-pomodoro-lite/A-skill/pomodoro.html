<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极简番茄钟</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --fg: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --danger: #9f1239;
    --ok: #166534;
    --pause: #b45309;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 1.5rem;
  }
  main {
    width: min(400px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2rem 1.75rem 1.75rem;
    box-shadow: 0 10px 40px rgba(28, 25, 23, 0.06);
  }
  h1 {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 1.5rem;
  }
  #display {
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: clamp(3.5rem, 12vw, 4.25rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1;
    margin-bottom: 0.75rem;
  }
  #status {
    text-align: center;
    font-size: 0.95rem;
    min-height: 1.4em;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  #status.running { color: var(--ok); }
  #status.paused  { color: var(--pause); }
  #status.done    { color: var(--danger); font-weight: 600; }
  .controls {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  button {
    font: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 1.15rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: #f5f5f4; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover:not(:disabled) {
    background: #115e59;
    border-color: #115e59;
  }
  .config {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .config label { cursor: pointer; }
  #minutes {
    width: 4.25rem;
    font: inherit;
    font-size: 0.95rem;
    padding: 0.35rem 0.45rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    text-align: center;
    background: #fff;
    color: var(--fg);
  }
  #minutes:disabled { opacity: 0.5; background: #f5f5f4; }
  .hint {
    margin-top: 1.25rem;
    text-align: center;
    font-size: 0.75rem;
    color: #a8a29e;
    line-height: 1.55;
  }
  .error {
    margin-top: 0.75rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--danger);
    min-height: 1.2em;
  }
</style>
</head>
<body>
<main>
  <h1>Pomodoro</h1>
  <div id="display" aria-live="polite">25:00</div>
  <div id="status" role="status">就绪</div>

  <div class="controls">
    <button id="btnStart" class="primary" type="button">开始</button>
    <button id="btnPause" type="button" disabled>暂停</button>
    <button id="btnReset" type="button">重置</button>
  </div>

  <div class="config">
    <label for="minutes">时长（分钟）</label>
    <input id="minutes" type="number" min="1" max="60" step="1" value="25"
           inputmode="numeric" aria-describedby="rangeHint">
    <span id="rangeHint">1–60</span>
  </div>
  <div id="errorMsg" class="error" aria-live="polite"></div>

  <p class="hint">
    到时状态显示「时间到」，并尝试播放短提示音。<br>
    浏览器若拒绝自动播放，仅以文案提示。
  </p>
</main>

<script>
"use strict";

/**
 * Pure timer core — no DOM. Verify via Node:
 *   node -e "..."  (see response.md)
 */
function createTimer(totalSeconds, hooks) {
  hooks = hooks || {};
  if (!Number.isInteger(totalSeconds) || totalSeconds < 1) {
    throw new Error("totalSeconds must be a positive integer ≥ 1");
  }
  var remaining = totalSeconds;
  var intervalId = null;
  var running = false;

  function emit() {
    if (typeof hooks.onTick === "function") {
      hooks.onTick(remaining, running);
    }
  }

  function finish() {
    remaining = 0;
    running = false;
    if (intervalId !== null) {
      clearInterval(intervalId);
      intervalId = null;
    }
    emit();
    if (typeof hooks.onComplete === "function") hooks.onComplete();
  }

  return {
    get remaining() { return remaining; },
    get running() { return running; },

    start: function () {
      if (running || remaining <= 0) return false;
      running = true;
      intervalId = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) finish();
        else emit();
      }, 1000);
      emit();
      return true;
    },

    pause: function () {
      if (!running) return false;
      running = false;
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      emit();
      return true;
    },

    reset: function (newTotal) {
      if (newTotal !== undefined) {
        if (!Number.isInteger(newTotal) || newTotal < 1) {
          throw new Error("newTotal must be a positive integer ≥ 1");
        }
        totalSeconds = newTotal;
      }
      running = false;
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      remaining = totalSeconds;
      emit();
      return true;
    }
  };
}

/** Format non-negative integer seconds as MM:SS. */
function formatTime(seconds) {
  if (!Number.isInteger(seconds) || seconds < 0) {
    throw new Error("seconds must be a non-negative integer");
  }
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

/**
 * Parse user minutes: integer in [1, 60].
 * Returns {ok:true, minutes:n} or {ok:false, reason:string}.
 */
function parseMinutes(raw) {
  var text = String(raw == null ? "" : raw).trim();
  if (text === "") return { ok: false, reason: "empty" };
  if (!/^\d+$/.test(text)) return { ok: false, reason: "not-integer" };
  var n = parseInt(text, 10);
  if (n < 1 || n > 60) return { ok: false, reason: "out-of-range" };
  return { ok: true, minutes: n };
}

/* ---------- Browser wiring ---------- */
if (typeof document !== "undefined") {
  var elDisplay = document.getElementById("display");
  var elStatus  = document.getElementById("status");
  var elStart   = document.getElementById("btnStart");
  var elPause   = document.getElementById("btnPause");
  var elReset   = document.getElementById("btnReset");
  var elMinutes = document.getElementById("minutes");
  var elError   = document.getElementById("errorMsg");

  var DEFAULT_MIN = 25;
  var audioCtx = null;

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch (e) {
      return null;
    }
  }

  function beep() {
    var ctx = ensureAudio();
    if (!ctx) return false;
    try {
      if (ctx.state === "suspended") ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      var now = ctx.currentTime;
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
      osc.start(now);
      osc.stop(now + 0.5);
      return true;
    } catch (e) {
      return false;
    }
  }

  function setStatus(text, cls) {
    elStatus.textContent = text;
    elStatus.className = cls || "";
  }

  function setError(msg) {
    elError.textContent = msg || "";
  }

  /** state: idle | running | paused | done */
  function setButtons(state) {
    if (state === "running") {
      elStart.disabled = true;
      elStart.textContent = "开始";
      elPause.disabled = false;
      elMinutes.disabled = true;
    } else if (state === "paused") {
      elStart.disabled = false;
      elStart.textContent = "继续";
      elPause.disabled = true;
      elMinutes.disabled = true;
    } else if (state === "done") {
      elStart.disabled = true;
      elStart.textContent = "开始";
      elPause.disabled = true;
      elMinutes.disabled = false;
    } else {
      elStart.disabled = false;
      elStart.textContent = "开始";
      elPause.disabled = true;
      elMinutes.disabled = false;
    }
  }

  var timer = createTimer(DEFAULT_MIN * 60, {
    onTick: function (remaining, running) {
      elDisplay.textContent = formatTime(remaining);
      if (remaining === 0) {
        setStatus("时间到", "done");
      } else if (running) {
        setStatus("进行中", "running");
      }
    },
    onComplete: function () {
      setStatus("时间到", "done");
      setButtons("done");
      beep();
    }
  });

  elDisplay.textContent = formatTime(DEFAULT_MIN * 60);
  setButtons("idle");

  elStart.addEventListener("click", function () {
    ensureAudio(); // unlock on user gesture
    setError("");
    if (timer.start()) setButtons("running");
  });

  elPause.addEventListener("click", function () {
    if (timer.pause()) {
      setStatus("已暂停", "paused");
      setButtons("paused");
    }
  });

  elReset.addEventListener("click", function () {
    var parsed = parseMinutes(elMinutes.value);
    var mins;
    if (!parsed.ok) {
      setError("请输入 1–60 的整数分钟");
      elMinutes.value = String(DEFAULT_MIN);
      mins = DEFAULT_MIN;
    } else {
      setError("");
      mins = parsed.minutes;
    }
    timer.reset(mins * 60);
    elDisplay.textContent = formatTime(mins * 60);
    setStatus("就绪", "");
    setButtons("idle");
  });

  /**
   * Apply minutes change immediately when idle or done.
   * Running/paused: new length applies only on next 重置.
   */
  function applyMinutesIfIdleOrDone() {
    var parsed = parseMinutes(elMinutes.value);
    if (!parsed.ok) {
      setError("请输入 1–60 的整数分钟");
      return;
    }
    setError("");
    var isDone = elStatus.textContent === "时间到" && elStatus.className === "done";
    var isIdle = !timer.running && !isDone && elStart.textContent === "开始";
    if (isIdle || isDone) {
      var total = parsed.minutes * 60;
      timer.reset(total);
      elDisplay.textContent = formatTime(total);
      setStatus("就绪", "");
      setButtons("idle");
    }
  }

  elMinutes.addEventListener("change", applyMinutesIfIdleOrDone);
}

/* ---------- Node export for logic verification ---------- */
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    createTimer: createTimer,
    formatTime: formatTime,
    parseMinutes: parseMinutes
  };
}
</script>
</body>
</html>
