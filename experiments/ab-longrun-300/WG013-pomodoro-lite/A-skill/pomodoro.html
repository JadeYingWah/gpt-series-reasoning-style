<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #e85d4c;
      --accent-dim: #b84436;
      --ok: #3d9a6a;
      --warn: #d4a017;
      --border: #2a3548;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.5;
    }
    .app {
      width: min(420px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px 28px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }
    .display {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 12vw, 4.2rem);
      font-weight: 650;
      letter-spacing: 0.04em;
      margin: 8px 0 12px;
      color: var(--text);
    }
    .display.done { color: var(--accent); }
    .status {
      text-align: center;
      min-height: 1.5em;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .status.done { color: var(--accent); font-weight: 600; }
    .status.running { color: var(--ok); }
    .status.paused { color: var(--warn); }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #243044;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      min-width: 88px;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent-dim);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-dim); }
    .config {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .config label { display: flex; align-items: center; gap: 8px; }
    .config input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #121a26;
      color: var(--text);
      font: inherit;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    .config input[type="number"]:invalid,
    .config input[type="number"].invalid {
      border-color: var(--accent);
    }
    .hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .hint.error { color: var(--accent); }
  </style>
</head>
<body>
  <main class="app" role="main">
    <h1>极简番茄钟</h1>
    <div id="display" class="display" aria-live="polite">25:00</div>
    <div id="status" class="status" role="status">就绪</div>
    <div class="controls">
      <button id="btnStart" class="primary" type="button">开始</button>
      <button id="btnPause" type="button" disabled>暂停</button>
      <button id="btnReset" type="button">重置</button>
    </div>
    <div class="config">
      <label for="durationInput">
        时长（分钟）
        <input
          id="durationInput"
          type="number"
          min="1"
          max="60"
          step="1"
          value="25"
          inputmode="numeric"
        />
      </label>
    </div>
    <p id="hint" class="hint">请输入 1–60 的正整数；回车或失焦后应用</p>
  </main>

  <script>
    /*
     * Core logic is pure and DOM-free so Node can extract + verify it
     * (see verify-logic.mjs). UI layer is gated on typeof document.
     */

    /* ---------- pure core ---------- */

    var DEFAULT_MINUTES = 25;
    var MIN_MINUTES = 1;
    var MAX_MINUTES = 60;
    var TICK_MS = 200;

    /** @returns {number|null} integer minutes in [1,60], or null if invalid */
    function clampDurationMinutes(value) {
      if (value === '' || value === null || value === undefined) return null;
      var n = Number(value);
      if (!Number.isFinite(n)) return null;
      if (!Number.isInteger(n)) {
        // reject non-integers strictly (task: 正整数)
        return null;
      }
      if (n < MIN_MINUTES || n > MAX_MINUTES) return null;
      return n;
    }

    function minutesToMs(minutes) {
      return minutes * 60 * 1000;
    }

    /**
     * Format remaining ms as mm:ss.
     * ceil so 25:00 stays 25:00 at start and 00:01 shows as 00:01,
     * hitting 00:00 exactly when remainingMs <= 0.
     */
    function formatClock(ms) {
      var totalSec = Math.max(0, Math.ceil(ms / 1000));
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return pad2(m) + ':' + pad2(s);
    }

    function pad2(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function remainingFromEndAt(endAt, now) {
      return Math.max(0, endAt - now);
    }

    function isFinished(remainingMs) {
      return remainingMs <= 0;
    }

    /**
     * Pure state machine for the pomodoro timer.
     * Mutates and returns the same state object for simplicity.
     * status: idle | running | paused | done
     */
    function createPomodoro(initialMinutes) {
      var mins = clampDurationMinutes(initialMinutes);
      if (mins === null) mins = DEFAULT_MINUTES;
      return {
        durationMs: minutesToMs(mins),
        remainingMs: minutesToMs(mins),
        endAt: null,
        status: 'idle'
      };
    }

    function start(state, now) {
      if (state.status === 'running') return state;
      if (state.status === 'done') {
        // restart from configured duration
        state.remainingMs = state.durationMs;
      }
      if (state.remainingMs <= 0) {
        state.remainingMs = state.durationMs;
      }
      state.endAt = now + state.remainingMs;
      state.status = 'running';
      return state;
    }

    function pause(state, now) {
      if (state.status !== 'running') return state;
      state.remainingMs = remainingFromEndAt(state.endAt, now);
      state.endAt = null;
      if (isFinished(state.remainingMs)) {
        state.remainingMs = 0;
        state.status = 'done';
      } else {
        state.status = 'paused';
      }
      return state;
    }

    function reset(state) {
      state.remainingMs = state.durationMs;
      state.endAt = null;
      state.status = 'idle';
      return state;
    }

    /** Advance while running; transitions to done at 0. */
    function tick(state, now) {
      if (state.status !== 'running') return state;
      state.remainingMs = remainingFromEndAt(state.endAt, now);
      if (isFinished(state.remainingMs)) {
        state.remainingMs = 0;
        state.endAt = null;
        state.status = 'done';
      }
      return state;
    }

    /**
     * Apply a new duration.
     * - invalid → { ok:false, state unchanged }
     * - while running → rejected (need pause/reset first) to avoid mid-flight surprise
     * - while idle/paused/done → applied; remaining resets to full new duration
     */
    function setDuration(state, minutesInput) {
      var mins = clampDurationMinutes(minutesInput);
      if (mins === null) {
        return { ok: false, reason: 'invalid', state: state };
      }
      if (state.status === 'running') {
        return { ok: false, reason: 'running', state: state };
      }
      state.durationMs = minutesToMs(mins);
      state.remainingMs = state.durationMs;
      state.endAt = null;
      if (state.status === 'done') {
        // keep done until user starts/resets; display still shows configured value? No —
        // applying a new duration should leave timer ready for the new session.
        state.status = 'idle';
      }
      return { ok: true, minutes: mins, state: state };
    }

    function statusLabel(status) {
      if (status === 'running') return '计时中';
      if (status === 'paused') return '已暂停';
      if (status === 'done') return '时间到';
      return '就绪';
    }

    /** Expose pure API for Node extraction. */
    var PomodoroCore = {
      DEFAULT_MINUTES: DEFAULT_MINUTES,
      MIN_MINUTES: MIN_MINUTES,
      MAX_MINUTES: MAX_MINUTES,
      clampDurationMinutes: clampDurationMinutes,
      minutesToMs: minutesToMs,
      formatClock: formatClock,
      remainingFromEndAt: remainingFromEndAt,
      isFinished: isFinished,
      createPomodoro: createPomodoro,
      start: start,
      pause: pause,
      reset: reset,
      tick: tick,
      setDuration: setDuration,
      statusLabel: statusLabel
    };

    /* ---------- optional beep (Web Audio, no external asset) ---------- */

    function beepOnComplete() {
      try {
        if (typeof window === 'undefined' || !window.AudioContext && !window.webkitAudioContext) {
          return false;
        }
        var Ctx = window.AudioContext || window.webkitAudioContext;
        var ctx = new Ctx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(ctx.destination);
        var t0 = ctx.currentTime;
        gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
        osc.frequency.setValueAtTime(880, t0);
        osc.frequency.setValueAtTime(660, t0 + 0.28);
        osc.start(t0);
        osc.stop(t0 + 0.6);
        osc.onended = function () {
          try { ctx.close(); } catch (e) { /* ignore */ }
        };
        return true;
      } catch (e) {
        return false;
      }
    }

    /* ---------- UI layer ---------- */

    if (typeof document !== 'undefined') {
      (function () {
        var displayEl = document.getElementById('display');
        var statusEl = document.getElementById('status');
        var hintEl = document.getElementById('hint');
        var btnStart = document.getElementById('btnStart');
        var btnPause = document.getElementById('btnPause');
        var btnReset = document.getElementById('btnReset');
        var durationInput = document.getElementById('durationInput');

        var state = createPomodoro(DEFAULT_MINUTES);
        var timerId = null;
        var lastRenderedStatus = null;

        function setHint(msg, isError) {
          hintEl.textContent = msg;
          hintEl.className = isError ? 'hint error' : 'hint';
        }

        function render() {
          displayEl.textContent = formatClock(state.remainingMs);
          statusEl.textContent = statusLabel(state.status);
          displayEl.className = 'display' + (state.status === 'done' ? ' done' : '');
          statusEl.className =
            'status' +
            (state.status === 'done'
              ? ' done'
              : state.status === 'running'
                ? ' running'
                : state.status === 'paused'
                  ? ' paused'
                  : '');

          btnStart.disabled = state.status === 'running';
          btnPause.disabled = state.status !== 'running';
          // duration locked only while running
          durationInput.disabled = state.status === 'running';

          if (state.status === 'done' && lastRenderedStatus !== 'done') {
            beepOnComplete();
          }
          lastRenderedStatus = state.status;
        }

        function stopTicker() {
          if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
          }
        }

        function ensureTicker() {
          if (timerId !== null) return;
          timerId = setInterval(function () {
            if (state.status !== 'running') {
              stopTicker();
              render();
              return;
            }
            tick(state, Date.now());
            render();
            if (state.status === 'done') stopTicker();
          }, TICK_MS);
        }

        btnStart.addEventListener('click', function () {
          start(state, Date.now());
          ensureTicker();
          render();
        });

        btnPause.addEventListener('click', function () {
          pause(state, Date.now());
          render();
        });

        btnReset.addEventListener('click', function () {
          reset(state);
          stopTicker();
          render();
        });

        function applyDurationFromInput() {
          var raw = durationInput.value;
          var result = setDuration(state, raw);
          if (result.ok) {
            durationInput.classList.remove('invalid');
            durationInput.value = String(result.minutes);
            setHint('时长已设为 ' + result.minutes + ' 分钟', false);
            stopTicker();
            render();
          } else if (result.reason === 'running') {
            durationInput.classList.add('invalid');
            setHint('计时中不能改时长，请先暂停或重置', true);
          } else {
            durationInput.classList.add('invalid');
            setHint('无效时长：请输入 1–60 的整数', true);
          }
        }

        durationInput.addEventListener('change', applyDurationFromInput);
        durationInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyDurationFromInput();
          }
        });

        render();
      })();
    }

    // Node CommonJS/ESM interop surface
    if (typeof module !== 'undefined' && module.exports) {
      module.exports = PomodoroCore;
    }
  </script>
</body>
</html>
