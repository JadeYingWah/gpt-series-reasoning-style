<!DOCTYPE html>
<!--
  SVG016-moth-gondola · B-noskill
  Theme: Crescent Canal Night — a luna moth steers a classic Venetian gondola toward the RIGHT.
  Motion self-consistency (also summarized in response.md):
  1. Propulsion: oar #oar-blade strokes (dip-sweep-lift) on the starboard side; water wake
     and ripple particles drift LEFT (translateX positive→negative) while the hull stays
     horizontally fixed — relative motion equals "craft moves right".
  2. Parallax: 3 layers scroll LEFT at different rates (far towers 55s / mid façades+lamps 32s /
     near bridge arch + reeds 16s). Left-scrolling scenery + fixed craft = rightward travel.
  3. Moth appendages relative to hull (not locked):
     - antennae #ant-l / #ant-r : independent sway 2.1s / 2.55s (hull bob 3.4s)
     - four wings #wing-fl/fr/hl/hr : slow flap ±14–18° at 2.35s
     - mid/fore legs grip & re-settle on oar / gunwale 2.85s / 3.7s
     - abdomen pulse / thorax lean 3.05s
  No external resources. Single file.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG016 · Moth Gondolier of the Crescent Canal</title>
<style>
  :root {
    --ink: #0b1020;
    --hull: #1a1430;
    --hull-edge: #3a2f55;
    --gold: #d4a84b;
    --gold-soft: #f0d089;
    --moth-wing: #b8e0a8;
    --moth-wing-vein: #6fa86a;
    --moth-body: #e8d9a8;
    --water-deep: #0a1a32;
    --water-mid: #123050;
    --lamp: #ffd27a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #05070f;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 90% 70% at 70% 20%, #1a2748 0%, transparent 55%),
      linear-gradient(180deg, #0a0e1c 0%, #121a32 42%, #0c1830 78%, #060a14 100%);
  }
  svg#scene {
    width: min(100vw, 1400px);
    height: min(100vh, 820px);
    max-width: 100%;
    max-height: 100%;
    display: block;
    filter: drop-shadow(0 12px 40px rgba(0,0,0,0.55));
  }

  /* ---------- Parallax layers (scroll LEFT) ---------- */
  @keyframes scrollLeftFar   { from { transform: translateX(0); }    to { transform: translateX(-1200px); } }
  @keyframes scrollLeftMid   { from { transform: translateX(0); }    to { transform: translateX(-1200px); } }
  @keyframes scrollLeftNear  { from { transform: translateX(0); }    to { transform: translateX(-1200px); } }

  #plx-far  { animation: scrollLeftFar  55s linear infinite; }
  #plx-mid  { animation: scrollLeftMid  32s linear infinite; }
  #plx-near { animation: scrollLeftNear 16s linear infinite; }

  /* ---------- Water surface shimmer ---------- */
  @keyframes waterSheen {
    0%   { transform: translateX(0); opacity: 0.35; }
    50%  { opacity: 0.55; }
    100% { transform: translateX(-80px); opacity: 0.35; }
  }
  #water-sheen { animation: waterSheen 7s ease-in-out infinite; }

  /* ---------- Hull bob + gentle pitch (forward-facing craft) ---------- */
  @keyframes hullBob {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-7px); }
  }
  @keyframes hullPitch {
    0%, 100% { transform: rotate(-0.6deg); }
    50%      { transform: rotate(0.9deg); }
  }
  #gondola-rig { animation: hullBob 3.4s ease-in-out infinite; }
  #gondola-hull {
    animation: hullPitch 5.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 70%;
  }

  /* ---------- Oar stroke: dip → sweep aft → lift (pushes water LEFT) ---------- */
  @keyframes oarStroke {
    0%   { transform: rotate(-8deg) translateY(0); }
    18%  { transform: rotate(2deg)  translateY(6px); }
    55%  { transform: rotate(18deg) translateY(10px); }
    78%  { transform: rotate(28deg) translateY(2px); }
    100% { transform: rotate(-8deg) translateY(0); }
  }
  #oar-group {
    animation: oarStroke 2.6s cubic-bezier(0.4, 0.05, 0.3, 1) infinite;
    transform-box: fill-box;
    transform-origin: 88% 18%;
  }
  @keyframes oarBladeFlex {
    0%, 100% { transform: scaleX(1) skewX(0deg); }
    40%      { transform: scaleX(0.92) skewX(-6deg); }
    70%      { transform: scaleX(1.05) skewX(4deg); }
  }
  #oar-blade {
    animation: oarBladeFlex 2.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 0% 50%;
  }

  /* ---------- Wake / ripples drift LEFT ---------- */
  @keyframes wakeDriftA {
    0%   { transform: translateX(10px); opacity: 0.0; }
    12%  { opacity: 0.55; }
    100% { transform: translateX(-160px); opacity: 0; }
  }
  @keyframes wakeDriftB {
    0%   { transform: translateX(0); opacity: 0; }
    15%  { opacity: 0.4; }
    100% { transform: translateX(-200px); opacity: 0; }
  }
  .wake-a { animation: wakeDriftA 2.6s ease-out infinite; }
  .wake-b { animation: wakeDriftB 2.6s ease-out infinite; animation-delay: 0.45s; }
  .wake-c { animation: wakeDriftA 2.6s ease-out infinite; animation-delay: 0.9s; }
  .wake-d { animation: wakeDriftB 2.6s ease-out infinite; animation-delay: 1.35s; }

  /* ---------- Moth wings ---------- */
  @keyframes flapFL {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg) translateY(-4px); }
  }
  @keyframes flapFR {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(14deg)  translateY(-3px); }
  }
  @keyframes flapHL {
    0%, 100% { transform: rotate(2deg); }
    50%      { transform: rotate(-18deg) translateY(-2px); }
  }
  @keyframes flapHR {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(17deg)  translateY(-3px); }
  }
  #wing-fl, #wing-fr, #wing-hl, #wing-hr {
    transform-box: fill-box;
    animation-duration: 2.35s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  #wing-fl { transform-origin: 90% 70%; animation-name: flapFL; }
  #wing-fr { transform-origin: 10% 70%; animation-name: flapFR; }
  #wing-hl { transform-origin: 85% 30%; animation-name: flapHL; animation-delay: 0.12s; }
  #wing-hr { transform-origin: 15% 30%; animation-name: flapHR; animation-delay: 0.08s; }

  /* ---------- Antennae ---------- */
  @keyframes antSwayL {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(10deg); }
  }
  @keyframes antSwayR {
    0%, 100% { transform: rotate(5deg); }
    50%      { transform: rotate(-11deg); }
  }
  #ant-l { transform-box: fill-box; transform-origin: 80% 90%; animation: antSwayL 2.1s ease-in-out infinite; }
  #ant-r { transform-box: fill-box; transform-origin: 20% 90%; animation: antSwayR 2.55s ease-in-out infinite; }

  /* ---------- Legs gripping oar / gunwale ---------- */
  @keyframes gripFore {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(-7deg); }
    65%      { transform: rotate(4deg); }
  }
  @keyframes gripMid {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(5deg); }
    75%      { transform: rotate(-3deg); }
  }
  #leg-fore-l, #leg-fore-r, #leg-mid-l, #leg-mid-r {
    transform-box: fill-box;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  #leg-fore-l { transform-origin: 90% 10%; animation: gripFore 2.85s; }
  #leg-fore-r { transform-origin: 10% 10%; animation: gripFore 2.85s; animation-delay: 0.1s; }
  #leg-mid-l  { transform-origin: 90% 10%; animation: gripMid  3.7s; }
  #leg-mid-r  { transform-origin: 10% 10%; animation: gripMid  3.7s; animation-delay: 0.2s; }

  /* ---------- Thorax lean / abdomen pulse ---------- */
  @keyframes thoraxLean {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(3deg) translateY(2px); }
  }
  @keyframes abdomenPulse {
    0%, 100% { transform: scaleX(1) scaleY(1); }
    50%      { transform: scaleX(1.04) scaleY(0.97); }
  }
  #moth-torso {
    transform-box: fill-box;
    transform-origin: 50% 80%;
    animation: thoraxLean 3.05s ease-in-out infinite;
  }
  #moth-abdomen {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: abdomenPulse 3.05s ease-in-out infinite;
  }

  /* ---------- Lantern flicker ---------- */
  @keyframes lampFlicker {
    0%, 100% { opacity: 0.85; }
    40%      { opacity: 1; }
    55%      { opacity: 0.7; }
    70%      { opacity: 0.95; }
  }
  .lamp-glow { animation: lampFlicker 1.7s ease-in-out infinite; }
  .lamp-glow.b { animation-duration: 2.1s; animation-delay: 0.3s; }

  /* ---------- Stars twinkle ---------- */
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.9; }
  }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(3n)  { animation-duration: 2.2s; }
  .star:nth-child(4n)  { animation-duration: 3.8s; animation-delay: 0.6s; }
  .star:nth-child(5n)  { animation-duration: 2.7s; animation-delay: 1.1s; }

  /* ---------- Crescent moon glow ---------- */
  @keyframes moonBreath {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.85; }
  }
  #moon-halo { animation: moonBreath 6s ease-in-out infinite; }

  /* ---------- Fireflies / motes near plane ---------- */
  @keyframes moteFloat {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: 0.7; }
    50%  { transform: translate(-40px, -18px); opacity: 0.9; }
    100% { transform: translate(-90px, -8px); opacity: 0; }
  }
  .mote { animation: moteFloat 5s ease-in-out infinite; }

  /* ---------- Oar drip ---------- */
  @keyframes dripFall {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: 0.8; }
    100% { transform: translateY(28px); opacity: 0; }
  }
  .drip { animation: dripFall 2.6s ease-in infinite; }
</style>
</head>

<div id="stage">
<svg id="scene" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A luna moth gondolier steers a Venetian gondola to the right on a moonlit canal">

  <!-- ========== WATER ========== -->
  <rect x="0" y="500" width="1200" height="200" fill="url(#gWater)"/>
  <!-- horizon line -->
  <rect x="0" y="498" width="1200" height="4" fill="#1a3050" opacity="0.6"/>

  <!-- water sheen / long reflections -->
  <g id="water-sheen" opacity="0.4">
    <ellipse cx="200" cy="540" rx="90" ry="4" fill="#4a7aaa" opacity="0.3"/>
    <ellipse cx="480" cy="560" rx="120" ry="3" fill="#4a7aaa" opacity="0.25"/>
    <ellipse cx="780" cy="545" rx="100" ry="4" fill="#4a7aaa" opacity="0.28"/>

<script>
(function () {
  'use strict';
  // Seamless parallax: clone each tile once at x=+1200 so translateX(0 → -1200) loops.
  function cloneTile(tileId, parentGroupId) {
    var tile = document.getElementById(tileId);
    var parent = document.getElementById(parentGroupId);
    if (!tile || !parent) return;
    var clone = tile.cloneNode(true);
    clone.id = tileId + '-clone';
    clone.setAttribute('transform', 'translate(1200,0)');
    // strip animation classes on nested clones' animated bits is unnecessary —
    // they keep the same phase, which is fine for background tiles.
    parent.appendChild(clone);
  }
  cloneTile('far-tile-a',  'plx-far');
  cloneTile('mid-tile-a',  'plx-mid');
  cloneTile('near-tile-a', 'plx-near');

  // No network. No external deps. Scene is pure SVG + CSS keyframes.
})();
</script>
