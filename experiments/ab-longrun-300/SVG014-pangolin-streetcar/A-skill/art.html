<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pangolin Night Streetcar</title>
<!--
  SVG014 · pangolin driving streetcar, rightward motion
  Single file, no CDN, no network, CSS+JS inline.
  Motion self-consistency: see notes.md (authoritative) and section comments below.
-->
<style>
  :root {
    --sky-top: #0b1630;
    --sky-mid: #1a2f55;
    --sky-low: #3d3a5c;
    --haze: #6b5a72;
    --far-ink: #1b2740;
    --mid-ink: #141e33;
    --near-ink: #0d1424;
    --brick: #3a2840;
    --window-warm: #f0b35a;
    --window-cool: #7ec8c3;
    --car-cream: #f2e4c4;
    --car-vermillion: #c4543a;
    --car-brass: #c9a06a;
    --car-shadow: #8a4a3a;
    --rail-steel: #8a93a4;
    --ground: #1a2030;
    --wet: #2a3550;
    --pango-body: #6b4a2e;
    --pango-scale: #c4a06a;
    --pango-scale-dark: #4a3420;
    --pango-belly: #d8c4a0;
    --glow: #ffb35c;
    --ui-chrome: #1a2238;
    --ui-text: #e8dcc8;
    --ui-muted: #9a8e7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--ui-chrome);
    color: var(--ui-text);
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 1.25rem 0.55rem;
    border-bottom: 1px solid rgba(232, 220, 200, 0.12);
    letter-spacing: 0.04em;
  }
  .masthead h1 {
    font-size: clamp(0.95rem, 1.6vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .masthead .tag {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.72rem;
    color: var(--ui-muted);
    letter-spacing: 0.08em;
  }

  .stage {
    position: relative;
    min-height: 0;
    background: #070d1c;
  }

  .stage svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  footer {
    padding: 0.55rem 1.25rem 0.85rem;
    border-top: 1px solid rgba(232, 220, 200, 0.12);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 0.72rem;
    color: var(--ui-muted);
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  footer kbd {
    font-family: Consolas, "Cascadia Code", monospace;
    background: rgba(232, 220, 200, 0.08);
    border: 1px solid rgba(232, 220, 200, 0.14);
    border-radius: 3px;
    padding: 0 0.35em;
    color: var(--ui-text);
  }

  /* ========== GLOBAL SCENE MOTION ========== */
  /* World scrolls left; streetcar holds a stable x. Wheels rotate CW for rightward travel. */

  @keyframes drift-stars {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  @keyframes drift-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-280px); }
  }
  @keyframes drift-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-520px); }
  }
  @keyframes drift-street {
    from { transform: translateX(0); }
    to   { transform: translateX(-720px); }
  }

  #stars   { animation: drift-stars  28s linear infinite; }
  #far-city{ animation: drift-far    18s linear infinite; }
  #mid-city{ animation: drift-mid    10s linear infinite; }
  #street  { animation: drift-street  6s linear infinite; }

  /* Streetcar body: vertical bob on suspension, independent of wheels */
  @keyframes car-bob {
    0%, 100% { transform: translateY(0); }
    25%      { transform: translateY(-1.6px); }
    50%      { transform: translateY(0.8px); }
    75%      { transform: translateY(-1.1px); }
  }
  #car-body { animation: car-bob 0.72s ease-in-out infinite; }

  /* Pantograph sway opposite to slight pitch */
  @keyframes panto-sway {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-1.2deg); }
    70%      { transform: rotate(0.8deg); }
  }
  #panto { transform-box: fill-box; transform-origin: 50% 100%; animation: panto-sway 1.1s ease-in-out infinite; }

  /* Headlight flicker + glow pulse */
  @keyframes headlight {
    0%, 100% { opacity: 0.92; }
    40%      { opacity: 1; }
    60%      { opacity: 0.88; }
  }
  #headlight-beam { animation: headlight 1.6s ease-in-out infinite; }

  @keyframes lamp-glow {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.85; }
  }
  .lamp-glow { animation: lamp-glow 2.4s ease-in-out infinite; }
  .lamp-glow.d1 { animation-delay: -0.4s; }
  .lamp-glow.d2 { animation-delay: -1.1s; }
  .lamp-glow.d3 { animation-delay: -1.7s; }

  /* ========== PANGOLIN RELATIVE MOTION (not locked to car) ========== */

  /* 1) Head / snout: slow look-around + breath nod — period ≠ car bob */
  @keyframes head-look {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    30%      { transform: rotate(-4deg) translateY(-0.6px); }
    55%      { transform: rotate(2.5deg) translateY(0.4px); }
    80%      { transform: rotate(-1.5deg) translateY(-0.2px); }
  }
  #pango-head {
    transform-box: fill-box;
    transform-origin: 18% 78%; /* neck joint */
    animation: head-look 2.6s ease-in-out infinite;
  }

  /* 2) Front arm (grip on controller): pumps the brass lever */
  @keyframes arm-pump {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(-14deg); }
    55%      { transform: rotate(-10deg); }
  }
  #pango-arm-front {
    transform-box: fill-box;
    transform-origin: 12% 10%;
    animation: arm-pump 1.35s ease-in-out infinite;
  }

  /* Controller lever follows arm (slightly lagged via same keyframes phase) */
  @keyframes lever-shift {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(-10deg); }
    55%      { transform: rotate(-7deg); }
  }
  #controller-lever {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: lever-shift 1.35s ease-in-out infinite;
  }

  /* 3) Tail: classic pangolin counterbalance sway — own frequency */
  @keyframes tail-sway {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(7deg); }
    70%      { transform: rotate(-4deg); }
  }
  #pango-tail {
    transform-box: fill-box;
    transform-origin: 8% 30%;
    animation: tail-sway 1.9s ease-in-out infinite;
  }

  /* 4) Rear claw: occasional plant / shift on footplate */
  @keyframes rear-claw {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    45%      { transform: translateY(-1.2px) rotate(-3deg); }
    70%      { transform: translateY(0) rotate(1deg); }
  }
  #pango-arm-rear {
    transform-box: fill-box;
    transform-origin: 70% 20%;
    animation: rear-claw 2.1s ease-in-out infinite;
  }

  /* 5) Body micro-bounce relative to car floor (scales catch light) */
  @keyframes pango-body-breathe {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-0.7px) scaleY(1.012); }
  }
  #pango-torso {
    transform-box: fill-box;
    transform-origin: 50% 80%;
    animation: pango-body-breathe 1.05s ease-in-out infinite;
  }

  /* Overhead wire spark traveling right→left (relative wind) */
  @keyframes spark-travel {
    0%   { transform: translateX(180px); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateX(-220px); opacity: 0; }
  }
  #spark {
    animation: spark-travel 1.8s linear infinite;
  }

  /* Wet-road reflection shimmer */
  @keyframes wet-shimmer {
    0%, 100% { opacity: 0.18; }
    50%      { opacity: 0.32; }
  }
  #wet-sheen { animation: wet-shimmer 3.2s ease-in-out infinite; }

  /* Rain streaks (subtle) */
  @keyframes rain-fall {
    from { transform: translate(0, -40px); }
    to   { transform: translate(-18px, 720px); }
  }
  #rain { animation: rain-fall 1.15s linear infinite; }

  @media (prefers-reduced-motion: reduce) {
    #stars, #far-city, #mid-city, #street,
    #car-body, #panto, #headlight-beam,
    .lamp-glow, #pango-head, #pango-arm-front,
    #controller-lever, #pango-tail, #pango-arm-rear,
    #pango-torso, #spark, #wet-sheen, #rain {
      animation: none !important;
    }
  }
</style>
</head>
<body>
  <header class="masthead">
    <h1>Pangolin Night Streetcar</h1>
    <span class="tag">SVG014 · route 7 · eastbound</span>
  </header>

  <main class="stage" aria-label="Animated scene of a pangolin driving a vintage streetcar to the right">

        </linearGradient>

        <!-- WHEELS (outside bob so they stay on rail) -->

  <footer>
    <span>Eastbound · wheels clockwise · 3 parallax layers · 5 independent pangolin motions</span>
    <span><kbd>prefers-reduced-motion</kbd> freezes all loops</span>
  </footer>

  <script>
    // Optional: pointer-driven parallax nudge on the far layer (tiny, local, no deps).
    // Kept off under reduced-motion.
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      var stage = document.querySelector('.stage');
      var mid = document.getElementById('mid-city');
      var far = document.getElementById('far-city');
      if (!stage || !mid || !far) return;
      stage.addEventListener('pointermove', function (e) {
        var r = stage.getBoundingClientRect();
        var nx = ((e.clientX - r.left) / r.width - 0.5) * 2; // -1..1
        var ny = ((e.clientY - r.top) / r.height - 0.5) * 2;
        // additive translate via CSS var — does not fight CSS animation (which uses transform on same el)
        // So we only nudge opacity/scale-free filter on a wrapper feel via mid opacity, keep pure.
        // Safer: apply a slight additional translate on a parent-free group using matrix in JS only for far.
        far.style.translate = (nx * 6).toFixed(1) + 'px ' + (ny * 2).toFixed(1) + 'px';
        mid.style.translate = (nx * 3).toFixed(1) + 'px ' + (ny * 1).toFixed(1) + 'px';
      });
      stage.addEventListener('pointerleave', function () {
        far.style.translate = '';
        mid.style.translate = '';
      });
    })();
  </script>
