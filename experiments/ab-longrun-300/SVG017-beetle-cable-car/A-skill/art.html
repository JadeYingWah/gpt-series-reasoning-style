<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>暮光索道 · 甲虫缆车 · SVG017</title>
<!--
  SVG017-beetle-cable-car · A-skill
  方向：暮光金秋峡谷索道（区别于 SVG008 夜雪）
  前进：世界层向左滚动 ⇒ 载具相对 +X（画面右侧）
  滑轮：顺时针 spinCW ↔ 车向右
  附肢：foreleg / midleg / hindleg / antenna / mandible 独立周期
  无外部资源：纯内联 CSS + SVG + 可选 JS
-->
<style>
  :root {
    --void: #1a1030;
    --dusk: #3d2463;
    --rose: #c45c48;
    --amber: #e8a54b;
    --gold: #f0c75e;
    --cream: #f6e7c8;
    --cabin: #8b2e3b;
    --cabin-dark: #5c1c28;
    --brass: #c9a227;
    --brass-dim: #8a7018;
    --beetle: #1f6b4a;
    --beetle-hi: #3db87a;
    --beetle-deep: #0d3d2a;
    --copper: #b87333;
    --ink: #1a1028;
    --leaf-a: #c45c2a;
    --leaf-b: #d4892e;
    --leaf-c: #8b3a1f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
  }

  body {
    display: grid;
    place-items: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .scene-wrap {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
  }

  svg.scene {
    width: 100%;
    height: 100%;
    display: block;
    background: #1a1030;
  }

  /* ========== 视差滚动（世界向左 ⇒ 车向右） ========== */
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  .scroll-sky   { animation: scrollX 60s linear infinite; }
  .scroll-far   { animation: scrollX 32s linear infinite; }
  .scroll-mid   { animation: scrollX 16s linear infinite; }
  .scroll-near  { animation: scrollX 8s  linear infinite; }
  .scroll-cable { animation: scrollX 12s linear infinite; }

  /* ========== 吊舱摇摆 / 悬挂 ========== */
  @keyframes cabinSway {
    0%, 100% { transform: rotate(-1.1deg); }
    50%      { transform: rotate(1.3deg); }
  }
  @keyframes cabinBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(3.5px); }
  }
  #cabin-pivot {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: cabinSway 3.2s ease-in-out infinite;
  }
  #cabin-body {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: cabinBob 2.4s ease-in-out infinite;
  }

  /* ========== 滑轮顺时针（向右前进） ========== */
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .sheave {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: spinCW 1.4s linear infinite;
  }
  .sheave-slow {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: spinCW 2.1s linear infinite;
  }

  /* ========== 甲虫附肢（独立于舱体） ========== */
  @keyframes foreGrab {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    40%      { transform: rotate(8deg) translateY(2px); }
    70%      { transform: rotate(-2deg) translateY(1px); }
  }
  @keyframes midStep {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(12deg); }
  }
  @keyframes hindStep {
    0%, 100% { transform: rotate(9deg); }
    50%      { transform: rotate(-11deg); }
  }
  @keyframes antWave {
    0%, 100% { transform: rotate(-14deg); }
    50%      { transform: rotate(18deg); }
  }
  @keyframes mandible {
    0%, 100% { transform: rotate(0deg); }
    45%      { transform: rotate(-12deg); }
    60%      { transform: rotate(4deg); }
  }
  @keyframes elytraPulse {
    0%, 100% { opacity: 0.92; }
    50%      { opacity: 1; }
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50%      { transform: rotate(2.5deg) translateY(1.5px); }
  }

  .leg-fore {
    transform-box: fill-box;
    transform-origin: 80% 20%;
    animation: foreGrab 1.05s ease-in-out infinite;
  }
  .leg-fore-r { animation-delay: -0.35s; }

  .leg-mid {
    transform-box: fill-box;
    transform-origin: 70% 15%;
    animation: midStep 0.72s ease-in-out infinite;
  }
  .leg-mid-r { animation-delay: -0.36s; }

  .leg-hind {
    transform-box: fill-box;
    transform-origin: 75% 20%;
    animation: hindStep 0.88s ease-in-out infinite;
  }
  .leg-hind-r { animation-delay: -0.44s; }

  .antenna {
    transform-box: fill-box;
    transform-origin: 10% 80%;
    animation: antWave 1.55s ease-in-out infinite;
  }
  .antenna-r { animation-delay: -0.7s; }

  .mandible-l {
    transform-box: fill-box;
    transform-origin: 90% 50%;
    animation: mandible 1.35s ease-in-out infinite;
  }
  .mandible-r {
    transform-box: fill-box;
    transform-origin: 10% 50%;
    animation: mandible 1.35s ease-in-out infinite;
    animation-delay: -0.08s;
  }

  .elytra {
    animation: elytraPulse 2.8s ease-in-out infinite;
  }

  .beetle-head {
    transform-box: fill-box;
    transform-origin: 20% 70%;
    animation: headBob 1.9s ease-in-out infinite;
  }

  /* ========== 环境 ========== */
  @keyframes sunPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.04); }
  }
  #sun-glow {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: sunPulse 5s ease-in-out infinite;
  }

  @keyframes leafDrift {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.6; }
    100% { transform: translate(-180px, 90px) rotate(-120deg); opacity: 0; }
  }
  .leaf {
    animation: leafDrift 7s linear infinite;
  }
  .leaf:nth-child(2) { animation-duration: 9s; animation-delay: -2s; }
  .leaf:nth-child(3) { animation-duration: 6.2s; animation-delay: -4s; }
  .leaf:nth-child(4) { animation-duration: 8.4s; animation-delay: -1s; }
  .leaf:nth-child(5) { animation-duration: 7.6s; animation-delay: -5s; }

  @keyframes headlampFlicker {
    0%, 100% { opacity: 0.55; }
    40%      { opacity: 0.75; }
    60%      { opacity: 0.5; }
  }
  #headlamp-cone {
    animation: headlampFlicker 2.2s ease-in-out infinite;
  }

  @keyframes towerLamp {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
  .tower-lamp {
    animation: towerLamp 2.8s ease-in-out infinite;
  }

  /* ========== reduce-motion ========== */
  @media (prefers-reduced-motion: reduce) {
    .scroll-sky, .scroll-far, .scroll-mid, .scroll-near, .scroll-cable,
    #cabin-pivot, #cabin-body,
    .sheave, .sheave-slow,
    .leg-fore, .leg-mid, .leg-hind,
    .antenna, .mandible-l, .mandible-r,
    .elytra, .beetle-head,
    #sun-glow, .leaf, #headlamp-cone, .tower-lamp {
      animation: none !important;
    }
  }

  /* 小标签 */
  .hud {
    position: fixed;
    left: 14px;
    bottom: 12px;
    color: rgba(246, 231, 200, 0.72);
    font-size: 12px;
    letter-spacing: 0.08em;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .hud strong { color: var(--gold); font-weight: 600; }
</style>
</head>
<body>
<div class="scene-wrap">
<svg class="scene" id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="暮光峡谷中一只甲虫驾驶红铜缆车向右前进">
  <defs>

    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1030"/>
      <stop offset="28%"  stop-color="#3d2463"/>

      <stop offset="0%"   stop-color="#fff3c4" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#f0c75e" stop-opacity="0.85"/>

      <stop offset="100%" stop-color="#e8a54b" stop-opacity="0.2"/>

    <!-- 山 -->
    <linearGradient id="g-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a3a78"/>
      <stop offset="100%" stop-color="#3d2463"/>
    </linearGradient>
    <linearGradient id="g-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b3048"/>
      <stop offset="100%" stop-color="#4a2040"/>
    </linearGradient>
    <linearGradient id="g-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b3a1f"/>
      <stop offset="100%" stop-color="#3a1820"/>
    </linearGradient>

    <!-- 吊舱 -->
    <linearGradient id="g-cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a83a48"/>
      <stop offset="45%"  stop-color="#8b2e3b"/>
      <stop offset="100%" stop-color="#5c1c28"/>
    </linearGradient>
    <linearGradient id="g-cabin-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4a017"/>
      <stop offset="50%"  stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a7018"/>
    </linearGradient>
    <linearGradient id="g-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="50%"  stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a7018"/>
    </linearGradient>
    <linearGradient id="g-window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7fdbff" stop-opacity="0.35"/>
      <stop offset="40%"  stop-color="#e8a54b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a1030" stop-opacity="0.45"/>
    </linearGradient>

    <!-- 甲虫 -->
    <linearGradient id="g-elytra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3db87a"/>
      <stop offset="35%"  stop-color="#1f6b4a"/>
      <stop offset="70%"  stop-color="#0d3d2a"/>
      <stop offset="100%" stop-color="#1a8a5c"/>
    </linearGradient>
    <linearGradient id="g-pronotum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a9a68"/>
      <stop offset="100%" stop-color="#0d3d2a"/>
    </linearGradient>
    <linearGradient id="g-head-bug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a6b48"/>
      <stop offset="100%" stop-color="#0a2e20"/>
    </linearGradient>
    <radialGradient id="g-eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#f6e7c8"/>
      <stop offset="40%"  stop-color="#e8a54b"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </radialGradient>

    <!-- 缆索 -->
    <linearGradient id="g-cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4a3858"/>
      <stop offset="50%"  stop-color="#8a7090"/>
      <stop offset="100%" stop-color="#4a3858"/>
    </linearGradient>

    <filter id="blur-far" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="blur-mid" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ========== 天空底 ========== -->
  <rect width="1200" height="700" fill="url(#g-sky)"/>

  <!-- ========== L0 太阳 / 慢漂云 ========== -->

    <g id="sun-glow">
      <circle cx="920" cy="310" r="110" fill="url(#g-sun)"/>

      </g>

  </g>

  <!-- ========== L1 远山（视差 32s） ========== -->
  <g id="layer-far" filter="url(#blur-far)" opacity="0.85">
    <g class="scroll-far">
      <g transform="translate(0,0)">
        <path d="M0,380 L80,300 L160,340 L240,260 L320,320 L400,240 L480,310 L560,270 L640,330 L720,250 L800,300 L880,230 L960,310 L1040,270 L1120,330 L1200,280 L1200,500 L0,500 Z" fill="url(#g-far)"/>
        <!-- 雪顶/亮脊 -->
        <path d="M240,260 L260,278 L280,268 L300,285 L320,275" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.35"/>
        <path d="M400,240 L420,258 L440,248 L460,265" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.3"/>
        <path d="M880,230 L900,248 L920,238 L940,255" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.35"/>
      </g>
      <g transform="translate(1200,0)">
        <path d="M0,380 L80,300 L160,340 L240,260 L320,320 L400,240 L480,310 L560,270 L640,330 L720,250 L800,300 L880,230 L960,310 L1040,270 L1120,330 L1200,280 L1200,500 L0,500 Z" fill="url(#g-far)"/>
        <path d="M240,260 L260,278 L280,268 L300,285 L320,275" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.35"/>
        <path d="M400,240 L420,258 L440,248 L460,265" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.3"/>
        <path d="M880,230 L900,248 L920,238 L940,255" fill="none" stroke="#c9a0d0" stroke-width="2" opacity="0.35"/>
      </g>

  </g>

  <!-- ========== L2 中景：山脊 + 针叶 + 塔架（视差 16s） ========== -->

    <g class="scroll-mid">

        <g fill="#1b3d28" opacity="0.9">

          <line x1="-30" y1="268" x2="0" y2="330" stroke="#3a2848" stroke-width="3"/>

  <!-- ========== L3 主缆（跟世界，中速） ========== -->
  <g id="layer-cable">
    <g class="scroll-cable">
      <!-- 弧垂主缆，双 tile -->
      <g transform="translate(0,0)">
        <path d="M0,210 Q300,250 600,220 T1200,230" fill="none" stroke="url(#g-cable)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M0,218 Q300,258 600,228 T1200,238" fill="none" stroke="#2a1838" stroke-width="1.2" opacity="0.5"/>

  <!-- ========== 主体：吊舱 + 甲虫（固定中右，表达向右前进） ========== -->
  <g id="car-rig" transform="translate(620, 0)">
    <g id="cabin-pivot">
      <!-- 吊臂 + 夹绳器 + 滑轮 -->
      <g id="hanger">
        <rect x="-6" y="200" width="12" height="38" fill="url(#g-brass)" rx="2"/>
        <!-- 夹绳器 -->
        <rect x="-28" y="188" width="56" height="16" fill="#5a4060" rx="4"/>
        <rect x="-22" y="184" width="44" height="8"  fill="url(#g-brass)" rx="2"/>
        <!-- 双滑轮骑在缆上 -->

<script>
(function () {
  // 轻量增强：不依赖 JS 也能完整播放（CSS 已驱动主体）。
  // JS 仅用于：尊重系统缩放时微调，以及暴露 debug 状态。
  var scene = document.getElementById('scene');
  if (!scene) return;

  // 标记数据属性，便于自动化核对动画层存在
  scene.setAttribute('data-parallax-layers', 'sky,far,mid,cable,near');
  scene.setAttribute('data-beetle-appendages', 'leg-fore,leg-mid,leg-hind,antenna,mandible-l,mandible-r,elytra,beetle-head');
  scene.setAttribute('data-drive-direction', 'right');
  scene.setAttribute('data-sheave-spin', 'cw');

  // 若用户开启减少动态，确保 body 上也打标
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.body.setAttribute('data-reduced-motion', '1');
    }
  } catch (e) { /* noop */ }
})();
</script>
