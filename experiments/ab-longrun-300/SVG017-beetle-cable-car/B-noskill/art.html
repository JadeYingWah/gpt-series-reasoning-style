<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG017 · Beetle Cable Car</title>
<!--
  SVG017-beetle-cable-car · B-noskill
  主题：甲虫驾驶高山缆车朝画面右侧前进
  自洽约定：
    - 顶部主缆上的驱动轮顺时针旋转 → 触点线速度向右 → 车厢向右
    - 三层背景全部 translateX 向左滚动（景物左移 = 观察者右移）
    - 前灯、舱鼻、甲虫朝向均指向 +X（右）
    - 附肢周期与车厢 sway/bob 均不同步
-->
<style>
  :root {
    --ink: #1a1024;
    --cabin: #2a1840;
    --cabin-edge: #c9a44a;
    --shell: #3d1f6e;
    --shell-hi: #8b5cf6;
    --shell-lo: #1e0f3a;
    --limb: #2d1b4e;
    --eye: #7dd3fc;
    --sky-top: #1b0b2e;
    --sky-mid: #5b2148;
    --sky-low: #c45c26;
    --snow: #f5e6d3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0a0612;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── sky wash (static base) ── */
  .sky-rect { fill: url(#skyGrad); }

  /* ── parallax layers ── */
  .layer {
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform;
  }
  .layer-far  { animation: scrollLeft 48s linear infinite; }
  .layer-mid  { animation: scrollLeft 28s linear infinite; }
  .layer-near { animation: scrollLeft 14s linear infinite; }
  .layer-tower{ animation: scrollLeft 9s  linear infinite; }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  /* ── stars / snow motes ── */
  .twinkle-a { animation: twinkle 3.1s ease-in-out infinite; }
  .twinkle-b { animation: twinkle 4.4s ease-in-out infinite 0.7s; }
  .twinkle-c { animation: twinkle 2.6s ease-in-out infinite 1.4s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  .snow-a { animation: snowFall 9s linear infinite; }
  .snow-b { animation: snowFall 13s linear infinite 2s; }
  .snow-c { animation: snowFall 11s linear infinite 4.5s; }
  @keyframes snowFall {
    from { transform: translate(0, -40px); }
    to   { transform: translate(-30px, 780px); }
  }

  /* ── cable car cabin ── */
  .cabin-root {
    animation: cabinSway 3.7s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 600px 118px; /* hanger pivot in viewBox coords */
  }
  @keyframes cabinSway {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.8deg); }
  }

  .cabin-body {
    animation: cabinBob 2.9s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes cabinBob {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(3.5px); }
  }

  /* ── pulley wheels (clockwise = travel right) ── */
  .pulley-wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spinCW 1.6s linear infinite;
  }
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── headlamp cone ── */
  .lamp-beam {
    animation: lampPulse 2.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: left center;
  }
  @keyframes lampPulse {
    0%, 100% { opacity: 0.35; transform: scaleX(1); }
    50%      { opacity: 0.62; transform: scaleX(1.08); }
  }
  .lamp-glow {
    animation: lampFlicker 1.1s ease-in-out infinite;
  }
  @keyframes lampFlicker {
    0%, 100% { opacity: 0.9; }
    40%      { opacity: 1; }
    55%      { opacity: 0.7; }
    70%      { opacity: 0.95; }
  }

  /* ── beetle appendages (independent of cabin) ── */
  .antenna-l {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    animation: antSwayL 2.15s ease-in-out infinite;
  }
  .antenna-r {
    transform-box: fill-box;
    transform-origin: 0% 100%;
    animation: antSwayR 1.75s ease-in-out infinite 0.3s;
  }
  @keyframes antSwayL {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(12deg); }
  }
  @keyframes antSwayR {
    0%, 100% { transform: rotate(10deg); }
    50%      { transform: rotate(-9deg); }
  }

  .foreleg-l {
    transform-box: fill-box;
    transform-origin: 10% 15%;
    animation: stepFore 1.35s ease-in-out infinite;
  }
  .foreleg-r {
    transform-box: fill-box;
    transform-origin: 10% 15%;
    animation: stepForeR 1.35s ease-in-out infinite 0.55s;
  }
  @keyframes stepFore {
    0%, 100% { transform: rotate(0deg); }
    45%      { transform: rotate(-18deg); }
    70%      { transform: rotate(6deg); }
  }
  @keyframes stepForeR {
    0%, 100% { transform: rotate(0deg); }
    45%      { transform: rotate(16deg); }
    70%      { transform: rotate(-5deg); }
  }

  .midleg-l {
    transform-box: fill-box;
    transform-origin: 20% 10%;
    animation: gripWindow 2.4s ease-in-out infinite;
  }
  .midleg-r {
    transform-box: fill-box;
    transform-origin: 20% 10%;
    animation: gripWindowR 2.6s ease-in-out infinite 0.4s;
  }
  @keyframes gripWindow {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(5deg) translateY(2px); }
  }
  @keyframes gripWindowR {
    0%, 100% { transform: rotate(4deg) translateY(1px); }
    50%      { transform: rotate(-4deg) translateY(-1px); }
  }

  .beetle-head {
    transform-box: fill-box;
    transform-origin: 30% 70%;
    animation: headScan 3.4s ease-in-out infinite;
  }
  @keyframes headScan {
    0%, 100% { transform: rotate(-4deg); }
    40%      { transform: rotate(5deg); }
    70%      { transform: rotate(1deg); }
  }

  .beetle-torso {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: torsoBreathe 2.05s ease-in-out infinite;
  }
  @keyframes torsoBreathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50%      { transform: scaleY(1.03) translateY(-2px); }
  }

  .elytra-shimmer {
    animation: shimmer 4.8s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.45; }
  }

  /* ── hanging cable tension rod micro-swing ── */
  .hanger-rod {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: rodPendulum 3.7s ease-in-out infinite;
  }
  @keyframes rodPendulum {
    0%, 100% { transform: rotate(1.6deg); }
    50%      { transform: rotate(-1.8deg); }
  }

  /* ── steam / exhaust from cabin bottom ── */
  .puff {
    animation: puffRise 3.2s ease-out infinite;
    transform-box: fill-box;
  }
  .puff:nth-child(2) { animation-delay: 1.05s; }
  .puff:nth-child(3) { animation-delay: 2.1s; }
  @keyframes puffRise {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.6); }
    100% { opacity: 0;    transform: translate(-50px,-40px) scale(1.8); }
  }

  /* ── vignette overlay ── */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(8,4,16,0.55) 100%);
  }

  /* ── HUD label ── */
  .hud {
    position: absolute;
    left: 18px;
    bottom: 16px;
    color: rgba(245,230,211,0.55);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    user-select: none;
    z-index: 2;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
<svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="甲虫驾驶缆车在黄昏山谷中向右行驶">
  <defs>
    <!-- sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#12081f"/>
      <stop offset="35%" stop-color="#2a1240"/>
      <stop offset="62%" stop-color="#6b2a4a"/>
      <stop offset="82%" stop-color="#c45c26"/>
      <stop offset="100%" stop-color="#e8a04a"/>
    </linearGradient>

    <!-- sun disc glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ff9a3c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>

    <!-- mountain fills -->
    <linearGradient id="mtFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2d6b"/>
      <stop offset="100%" stop-color="#2a1848"/>
    </linearGradient>
    <linearGradient id="mtMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1f55"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0c0618"/>
    </linearGradient>

    <!-- cabin body -->
    <linearGradient id="cabinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2d7a"/>
      <stop offset="45%" stop-color="#2d1848"/>
      <stop offset="100%" stop-color="#1a0c30"/>
    </linearGradient>
    <linearGradient id="cabinRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d4bb8"/>
      <stop offset="100%" stop-color="#2a1840"/>
    </linearGradient>

    <!-- beetle shell -->
    <radialGradient id="elytraGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%"  stop-color="#a78bfa"/>
      <stop offset="35%" stop-color="#6d28d9"/>
      <stop offset="70%" stop-color="#3b0f73"/>
      <stop offset="100%" stop-color="#1a0538"/>
    </radialGradient>
    <linearGradient id="thoraxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <!-- lamp beam -->
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#ffe08a" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#ffb347" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>

    <!-- window glass -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#c4b5fd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════ SKY ═══════════ -->
  <rect class="sky-rect" x="0" y="0" width="1200" height="700"/>
  <circle cx="860" cy="430" r="180" fill="url(#sunGlow)"/>
  <circle cx="860" cy="430" r="42" fill="#ffd88a" opacity="0.85"/>

  <!-- stars (far, static-ish) -->
  <g fill="#f5e6d3">
    <circle class="twinkle-a" cx="80"  cy="48"  r="1.2"/>
    <circle class="twinkle-b" cx="210" cy="90"  r="1.0"/>
    <circle class="twinkle-c" cx="340" cy="36"  r="1.4"/>
    <circle class="twinkle-a" cx="470" cy="110" r="0.9"/>
    <circle class="twinkle-b" cx="560" cy="55"  r="1.1"/>
    <circle class="twinkle-c" cx="720" cy="28"  r="1.3"/>
    <circle class="twinkle-a" cx="900" cy="70"  r="1.0"/>
    <circle class="twinkle-b" cx="1050" cy="40" r="1.5"/>
    <circle class="twinkle-c" cx="1150" cy="95" r="1.1"/>
    <circle class="twinkle-a" cx="150" cy="150" r="0.8"/>
    <circle class="twinkle-b" cx="640" cy="140" r="0.9"/>
    <circle class="twinkle-c" cx="980" cy="130" r="1.0"/>
  </g>

  <!-- ═══════════ FAR MOUNTAINS (48s) ═══════════ -->
  <g class="layer layer-far">
    <g id="far-tile">
      <path fill="url(#mtFar)" opacity="0.55" d="
        M0,420 L80,300 L140,360 L220,250 L300,340 L380,220 L460,310
        L540,200 L620,320 L700,240 L780,330 L860,210 L940,300
        L1020,250 L1100,340 L1180,270 L1200,290 L1200,700 L0,700 Z"/>
      <!-- snow caps -->
      <path fill="#e8d5c4" opacity="0.35" d="M210,250 L230,270 L250,255 L220,280 Z"/>
      <path fill="#e8d5c4" opacity="0.3" d="M530,200 L555,230 L575,210 L545,235 Z"/>
      <path fill="#e8d5c4" opacity="0.32" d="M850,210 L875,240 L895,220 L860,245 Z"/>
      <path fill="#e8d5c4" opacity="0.28" d="M1010,250 L1030,275 L1050,255 L1025,280 Z"/>
    </g>
    <use href="#far-tile" x="1200"/>
  </g>

  <!-- ═══════════ MID MOUNTAINS + PINES (28s) ═══════════ -->
  <g class="layer layer-mid">
    <g id="mid-tile">
      <path fill="url(#mtMid)" d="
        M0,500 L60,420 L120,470 L200,360 L280,450 L360,340 L450,430
        L540,320 L630,420 L720,350 L800,440 L900,310 L1000,420
        L1080,360 L1200,450 L1200,700 L0,700 Z"/>
      <!-- pine silhouettes on mid ridge -->
      <g fill="#0f0820" opacity="0.85">
        <path d="M90,470 L100,430 L110,470 Z"/>
        <path d="M95,445 L100,420 L105,445 Z"/>
        <path d="M170,455 L185,400 L200,455 Z"/>
        <path d="M177,420 L185,395 L193,420 Z"/>
        <path d="M310,440 L322,390 L334,440 Z"/>
        <path d="M316,405 L322,382 L328,405 Z"/>
        <path d="M520,430 L538,365 L556,430 Z"/>
        <path d="M528,385 L538,355 L548,385 Z"/>
        <path d="M740,445 L755,395 L770,445 Z"/>
        <path d="M747,410 L755,388 L763,410 Z"/>
        <path d="M980,420 L1000,350 L1020,420 Z"/>
        <path d="M990,370 L1000,340 L1010,370 Z"/>
      </g>
      <!-- warm cabin lights on mid slope -->
      <g fill="#f59e0b" opacity="0.55">
        <rect x="240" y="460" width="4" height="3" rx="0.5"/>
        <rect x="248" y="462" width="3" height="2.5" rx="0.5"/>
        <rect x="600" y="435" width="4" height="3" rx="0.5"/>
        <rect x="610" y="438" width="3" height="2.5" rx="0.5"/>
        <rect x="1050" y="430" width="4" height="3" rx="0.5"/>
      </g>
    </g>
    <use href="#mid-tile" x="1200"/>
  </g>

  <!-- ═══════════ NEAR FOREST / ROCKS (14s) ═══════════ -->
  <g class="layer layer-near">
    <g id="near-tile">
      <path fill="url(#mtNear)" d="
        M0,560 L40,520 L90,550 L150,490 L220,540 L300,480 L380,530
        L460,470 L560,530 L660,460 L760,520 L860,450 L960,520
        L1060,470 L1140,530 L1200,500 L1200,700 L0,700 Z"/>
      <!-- big near pines -->
      <g fill="#070310">
        <path d="M70,560 L110,420 L150,560 Z"/>
        <path d="M85,480 L110,400 L135,480 Z"/>
        <path d="M95,440 L110,390 L125,440 Z"/>
        <rect x="105" y="540" width="10" height="30"/>

        <path d="M400,540 L450,370 L500,540 Z"/>
        <path d="M418,460 L450,350 L482,460 Z"/>
        <path d="M430,400 L450,330 L470,400 Z"/>
        <rect x="444" y="520" width="12" height="40"/>

        <path d="M900,550 L955,360 L1010,550 Z"/>
        <path d="M920,450 L955,340 L990,450 Z"/>
        <path d="M935,385 L955,320 L975,385 Z"/>
        <rect x="948" y="530" width="14" height="40"/>
      </g>
      <!-- boulder -->
      <ellipse cx="680" cy="560" rx="55" ry="28" fill="#12081c"/>
      <ellipse cx="700" cy="548" rx="28" ry="14" fill="#1c1030" opacity="0.7"/>
    </g>
    <use href="#near-tile" x="1200"/>
  </g>

  <!-- ═══════════ SUPPORT TOWERS (9s) ═══════════ -->
  <g class="layer layer-tower">
    <g id="tower-tile">
      <!-- tower A -->
      <g transform="translate(180,0)">
        <rect x="-6" y="200" width="12" height="400" fill="#1a1028"/>
        <rect x="-40" y="190" width="80" height="14" rx="3" fill="#2d1b4e"/>
        <rect x="-28" y="204" width="56" height="6" fill="#c9a44a" opacity="0.5"/>
        <circle cx="-32" cy="197" r="8" fill="#0a0612" stroke="#8b5cf6" stroke-width="2"/>
        <circle cx="32"  cy="197" r="8" fill="#0a0612" stroke="#8b5cf6" stroke-width="2"/>
        <line x1="0" y1="204" x2="0" y2="600" stroke="#0a0612" stroke-width="2" opacity="0.5"/>
      </g>
      <!-- tower B -->
      <g transform="translate(720,0)">
        <rect x="-5" y="230" width="10" height="370" fill="#1a1028"/>
        <rect x="-34" y="220" width="68" height="12" rx="3" fill="#2d1b4e"/>
        <rect x="-22" y="232" width="44" height="5" fill="#c9a44a" opacity="0.45"/>
        <circle cx="-26" cy="226" r="7" fill="#0a0612" stroke="#8b5cf6" stroke-width="1.8"/>
        <circle cx="26"  cy="226" r="7" fill="#0a0612" stroke="#8b5cf6" stroke-width="1.8"/>
      </g>
      <!-- tower C -->
      <g transform="translate(1120,0)">
        <rect x="-5" y="180" width="10" height="420" fill="#1a1028"/>
        <rect x="-36" y="170" width="72" height="13" rx="3" fill="#2d1b4e"/>
        <rect x="-24" y="183" width="48" height="5" fill="#c9a44a" opacity="0.5"/>
        <circle cx="-28" cy="176" r="7" fill="#0a0612" stroke="#8b5cf6" stroke-width="1.8"/>
        <circle cx="28"  cy="176" r="7" fill="#0a0612" stroke="#8b5cf6" stroke-width="1.8"/>
      </g>
    </g>
    <use href="#tower-tile" x="1200"/>
  </g>

  <!-- ═══════════ MAIN CABLE (static, spans scene) ═══════════ -->
  <g id="cable-system">
    <!-- thick main cable -->
    <path d="M0,130 Q300,148 600,118 T1200,140"
          fill="none" stroke="#0a0612" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,130 Q300,148 600,118 T1200,140"
          fill="none" stroke="#4a3568" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <!-- return cable lower -->
    <path d="M0,175 Q300,190 600,165 T1200,185"
          fill="none" stroke="#0a0612" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- ═══════════ CABLE CAR + BEETLE ═══════════ -->
  <g id="car-tilt">
  <g id="car-group" class="cabin-root">

    <!-- hanger rod from cable to cabin roof -->
    <g class="hanger-rod">
      <rect x="594" y="118" width="12" height="52" rx="3" fill="#3d2a62"/>
      <rect x="596" y="118" width="8" height="52" fill="#6d4bb8" opacity="0.35"/>
      <!-- grip assembly on cable -->
      <rect x="575" y="108" width="50" height="16" rx="4" fill="#2d1b4e"/>
      <rect x="580" y="110" width="40" height="4" fill="#c9a44a" opacity="0.6"/>

      <!-- drive / guide pulley (clockwise → travel right) -->
      <!-- outer g holds SVG translate; inner g carries CSS spin (avoids transform override) -->
      <g transform="translate(600,118)">
        <g class="pulley-wheel">
          <circle r="14" fill="#1a1028" stroke="#8b5cf6" stroke-width="2.5"/>
          <circle r="5"  fill="#c9a44a"/>
          <!-- spoke markers so rotation is visible -->
          <line x1="0" y1="-12" x2="0" y2="-4" stroke="#c9a44a" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="0" x2="4" y2="0" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="0" y1="12" x2="0" y2="4" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-12" y1="0" x2="-4" y2="0" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
          <!-- eccentric yellow dot: clockwise sweep confirms direction -->
          <circle cx="0" cy="-9" r="2.5" fill="#fbbf24"/>
        </g>
      </g>
    </g>

    <!-- cabin body with bob -->

<script>
(function () {
  'use strict';
  // Seamless tile cloning for parallax layers already done via <use href="#…-tile" x="1200"/>.
  // Optional pointer micro-tilt on the cabin (enhancement, not required for compliance).
  var car = document.getElementById('car-tilt');
  if (!car) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var target = 0, current = 0, raf = null;

  function onMove(e) {
    var x = e.clientX / window.innerWidth; // 0..1
    target = (x - 0.5) * 4; // -2..2 deg extra tilt
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick() {
    current += (target - current) * 0.08;
    car.style.transform = 'rotate(' + current.toFixed(3) + 'deg)';
    if (Math.abs(target - current) > 0.01) {
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
    }
  }

  window.addEventListener('pointermove', onMove, { passive: true });
})();
</script>
