<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moth Gondola · SVG012</title>
<!--
  几何/运动自洽说明 (self-consistency notes):
  1. 推进：侧置双叶螺旋桨（#prop-a / #prop-b）绕自身轴心连续旋转；
     叶片相位差 180°，旋转方向与画面右侧前进一致（从左侧看为顺时针推力感）。
     尾部喷流粒子向左发射，速度与右移一致。
  2. 载具：gondola 船体 + 吊舱结构整体以轻微 bob（上下）+ pitch（俯仰）漂浮，
     不做水平锁死平移；水平位移由背景层视差表达“前进”。
  3. moth 附肢相对运动（至少 2 处）：
     a) 前足握住舵杆，舵杆绕支点摇摆，前足/前臂跟随舵杆但有独立小弧；
     b) 触角左右摆动，相位与舵杆/身体 bob 不同；
     c) 双翅缓慢扇动，与船体 bob 异步；
     d) 中足偶尔调整姿势（独立 keyframe）。
     moth 躯干仅做轻微呼吸/倾斜，非全身锁死平移。
  4. 背景至少 2 层视差：
     L1 远山/城郭 silhouette（最慢）
     L2 中景云带 + 浮岛（中速）
     L3 近景萤火/尘粒/枝影（最快）
     三层用不同 translate 速度与循环周期。
-->
<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a1f4a;
    --sky-low: #3d2a5c;
    --horizon: #c45c48;
    --gold: #f0c75e;
    --moon: #f5e6c8;
    --moth-body: #7ecf9a;
    --moth-wing: #b8e6c8;
    --hull: #2a1f3d;
    --hull-trim: #d4a84b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b1026;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }
  #stage {
    width: 100vw; height: 100vh;
    display: block;
  }
  svg { width: 100%; height: 100%; display: block; }
  .credit {
    position: fixed; right: 12px; bottom: 8px;
    color: rgba(240,199,94,0.45);
    font-size: 11px; letter-spacing: 0.08em;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="35%" stop-color="#1a1f4a"/>
      <stop offset="70%" stop-color="#3d2a5c"/>
      <stop offset="92%" stop-color="#8b3d5a"/>
      <stop offset="100%" stop-color="#c45c48"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f0c75e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0c75e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#f0a040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f0a040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3568"/>
      <stop offset="50%" stop-color="#2a1f3d"/>
      <stop offset="100%" stop-color="#1a1228"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4f5e0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7ecf9a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3a8f6a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wingGradL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4f5e0" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8fd4a8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a8f6a" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2850"/>
      <stop offset="100%" stop-color="#1a1838"/>
    </linearGradient>
    <linearGradient id="midCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a5a8a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3d2a5c" stop-opacity="0.15"/>
    </linearGradient>
    <!-- filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurFar" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blurMid" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <!-- reusable star -->
    <circle id="starPt" r="1.1" fill="#f5e6c8"/>
  </defs>

  <!-- ========== SKY ========== -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>

  <!-- stars (static layer, slight twinkle via CSS on groups) -->
  <g id="stars" opacity="0.85">
    <circle cx="80" cy="40" r="1.2" fill="#fff"/>
    <circle cx="160" cy="90" r="0.8" fill="#f5e6c8"/>
    <circle cx="240" cy="30" r="1.0" fill="#fff"/>
    <circle cx="320" cy="70" r="0.7" fill="#d4c8f0"/>
    <circle cx="410" cy="25" r="1.3" fill="#fff"/>
    <circle cx="500" cy="55" r="0.9" fill="#f5e6c8"/>
    <circle cx="580" cy="100" r="0.6" fill="#fff"/>
    <circle cx="670" cy="35" r="1.1" fill="#d4c8f0"/>
    <circle cx="750" cy="80" r="0.8" fill="#fff"/>
    <circle cx="840" cy="20" r="1.0" fill="#f5e6c8"/>
    <circle cx="920" cy="60" r="0.7" fill="#fff"/>
    <circle cx="1000" cy="40" r="1.2" fill="#d4c8f0"/>
    <circle cx="1080" cy="90" r="0.9" fill="#fff"/>
    <circle cx="1140" cy="25" r="0.8" fill="#f5e6c8"/>
    <circle cx="130" cy="140" r="0.6" fill="#fff"/>
    <circle cx="290" cy="120" r="0.9" fill="#d4c8f0"/>
    <circle cx="450" cy="110" r="0.5" fill="#fff"/>
    <circle cx="620" cy="150" r="0.8" fill="#f5e6c8"/>
    <circle cx="790" cy="130" r="0.6" fill="#fff"/>
    <circle cx="950" cy="145" r="1.0" fill="#d4c8f0"/>
    <circle cx="1100" cy="120" r="0.7" fill="#fff"/>
  </g>
  <style>
    #stars circle { animation: twinkle 3.5s ease-in-out infinite; }
    #stars circle:nth-child(odd) { animation-duration: 4.2s; animation-delay: 0.4s; }
    #stars circle:nth-child(3n) { animation-duration: 2.8s; animation-delay: 1.1s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>

  <!-- moon -->
  <g id="moon">
    <circle cx="980" cy="110" r="70" fill="url(#moonGlow)"/>
    <circle cx="980" cy="110" r="36" fill="#f5e6c8"/>
    <circle cx="995" cy="100" r="8" fill="#e0d0a8" opacity="0.5"/>
    <circle cx="968" cy="125" r="5" fill="#e0d0a8" opacity="0.4"/>
    <circle cx="990" cy="130" r="3" fill="#e0d0a8" opacity="0.35"/>
  </g>

  <!-- ========== LAYER 1: far hills / city (slowest parallax) ========== -->
  <g id="parallax-far" filter="url(#blurFar)">
    <g id="far-tile">
      <!-- distant mountain silhouette, width 1200, looped -->
      <path d="M0 420
               L80 380 L140 400 L200 350 L280 390 L340 340 L400 370
               L480 320 L560 360 L620 300 L700 350 L780 310 L860 360
               L920 330 L1000 370 L1080 340 L1140 365 L1200 350
               L1200 700 L0 700 Z" fill="url(#farHill)" opacity="0.9"/>
      <!-- tiny distant towers -->
      <g fill="#1e1c40" opacity="0.85">
        <rect x="180" y="330" width="8" height="50"/>
        <rect x="188" y="318" width="3" height="12"/>
        <rect x="420" y="345" width="10" height="40"/>
        <rect x="424" y="332" width="2" height="14"/>
        <rect x="720" y="325" width="7" height="55"/>
        <rect x="726" y="312" width="2" height="14"/>
        <rect x="1020" y="340" width="9" height="45"/>
      </g>
      <!-- faint windows -->
      <g fill="#f0c75e" opacity="0.35">
        <rect x="182" y="345" width="2" height="3"/>
        <rect x="185" y="355" width="2" height="3"/>
        <rect x="423" y="355" width="2" height="3"/>
        <rect x="722" y="340" width="2" height="3"/>
        <rect x="722" y="350" width="2" height="3"/>
      </g>
    </g>
  </g>

  <!-- ========== LAYER 2: mid clouds + floating isles (medium parallax) ========== -->
  <g id="parallax-mid" filter="url(#blurMid)">
    <g id="mid-tile">
      <!-- long cloud banks -->
      <ellipse cx="150" cy="380" rx="120" ry="28" fill="url(#midCloud)"/>
      <ellipse cx="220" cy="370" rx="90" ry="22" fill="url(#midCloud)"/>
      <ellipse cx="500" cy="400" rx="160" ry="32" fill="url(#midCloud)"/>
      <ellipse cx="580" cy="385" rx="100" ry="24" fill="url(#midCloud)"/>
      <ellipse cx="900" cy="370" rx="140" ry="30" fill="url(#midCloud)"/>
      <ellipse cx="980" cy="360" rx="80" ry="20" fill="url(#midCloud)"/>
      <!-- floating isle left -->
      <g transform="translate(100,300)">
        <ellipse cx="40" cy="20" rx="55" ry="18" fill="#2d4a3a"/>
        <path d="M0 22 Q40 55 80 22 Z" fill="#1a2e24"/>
        <path d="M30 8 L38 -15 L42 8 Z" fill="#3a6a4a"/>
        <rect x="36" y="-18" width="4" height="8" fill="#5a8a6a"/>
        <circle cx="38" cy="-20" r="5" fill="#4a9a6a" opacity="0.7"/>
      </g>
      <!-- floating isle right -->
      <g transform="translate(700,320)">
        <ellipse cx="50" cy="18" rx="65" ry="16" fill="#2d4a3a"/>
        <path d="M5 20 Q50 48 95 20 Z" fill="#1a2e24"/>
        <path d="M45 5 L55 -22 L60 5 Z" fill="#3a6a4a"/>
        <path d="M60 8 L68 -10 L72 8 Z" fill="#2a5a3a"/>
        <circle cx="55" cy="-24" r="6" fill="#4a9a6a" opacity="0.65"/>
      </g>
      <!-- soft mist band -->
      <path d="M0 450 Q300 430 600 450 T1200 445 L1200 480 L0 480 Z"
            fill="#3d2a5c" opacity="0.35"/>
    </g>
  </g>

  <!-- ========== MAIN SUBJECT: moth piloting gondola ========== -->
  <!-- The craft itself does not translate in X (parallax sells motion);
       it bobs/pitches in place. -->
  <g id="craft-root" transform="translate(600,400)">
    <!-- craft group for bob + pitch -->
    <g id="craft-body">

      <!-- ---- thruster wash / wake (leftward = forward-right) ---- -->
      <g id="wake" opacity="0.55">
        <g class="wake-p" style="--d:0s">
          <ellipse cx="-130" cy="10" rx="18" ry="4" fill="#c45c48" opacity="0.5"/>
        </g>
        <g class="wake-p" style="--d:0.35s">
          <ellipse cx="-150" cy="18" rx="14" ry="3" fill="#f0c75e" opacity="0.35"/>
        </g>
        <g class="wake-p" style="--d:0.7s">
          <ellipse cx="-140" cy="4" rx="20" ry="3.5" fill="#8b3d5a" opacity="0.4"/>
        </g>
      </g>

      <!-- ---- suspension cables / balloon hint (gondola-lift feel) ---- -->
      <g id="suspension" opacity="0.5">
        <line x1="-40" y1="-90" x2="-20" y2="-10" stroke="#d4a84b" stroke-width="1.2"/>
        <line x1="40" y1="-90" x2="20" y2="-10" stroke="#d4a84b" stroke-width="1.2"/>
        <line x1="0" y1="-95" x2="0" y2="-12" stroke="#d4a84b" stroke-width="1"/>
        <!-- faint balloon envelope above -->
        <ellipse cx="0" cy="-120" rx="70" ry="32" fill="#3d2a5c" opacity="0.45"/>
        <ellipse cx="-10" cy="-128" rx="40" ry="14" fill="#5a4078" opacity="0.25"/>
      </g>

      <!-- ---- gondola hull ---- -->
      <g id="hull">
        <!-- main boat body, prow to the right -->
        <path id="hull-main"
              d="M-110,0
                 C-115,12 -100,28 -70,32
                 L70,32
                 C100,30 118,18 125,0
                 C128,-6 120,-10 110,-8
                 L-90,-8
                 C-105,-8 -108,-4 -110,0 Z"
              fill="url(#hullGrad)" stroke="#d4a84b" stroke-width="1.5"/>
        <!-- ornamental prow (right-facing ferro) -->
        <path id="prow"
              d="M110,-8
                 C130,-20 145,-5 150,8
                 C140,4 128,2 118,0
                 L110,-2 Z"
              fill="#d4a84b" opacity="0.9"/>
        <path d="M145,-2 L155,-18 L152,-2 L148,4 Z" fill="#f0c75e"/>
        <!-- stern curl (left) -->
        <path d="M-110,0 C-125,-15 -120,-35 -105,-40
                 C-112,-28 -115,-12 -108,-2 Z"
              fill="#d4a84b" opacity="0.85"/>
        <!-- gold trim lines -->
        <path d="M-90,-4 L108,-4" stroke="#d4a84b" stroke-width="1" opacity="0.7" fill="none"/>
        <path d="M-70,20 L90,20" stroke="#8a6a30" stroke-width="1" opacity="0.5" fill="none"/>
        <!-- cabin / canopy -->
        <path d="M-30,-8 L-25,-38 L35,-38 L40,-8 Z"
              fill="#1a1228" stroke="#d4a84b" stroke-width="1.2"/>
        <path d="M-25,-38 Q5,-52 35,-38" fill="#2a1f3d" stroke="#d4a84b" stroke-width="1"/>
        <!-- canopy window glow -->
        <ellipse cx="5" cy="-25" rx="14" ry="10" fill="#f0c75e" opacity="0.25"/>
        <!-- side lanterns -->
        <g id="lantern-l" transform="translate(-70,-2)">
          <circle r="18" fill="url(#lanternGlow)"/>
          <rect x="-4" y="-10" width="8" height="14" rx="2" fill="#3a2810" stroke="#d4a84b" stroke-width="0.8"/>
          <circle cy="-3" r="3" fill="#ffe9a0"/>
          <line x1="0" y1="-10" x2="0" y2="-16" stroke="#d4a84b" stroke-width="0.8"/>
        </g>
        <g id="lantern-r" transform="translate(85,0)">
          <circle r="16" fill="url(#lanternGlow)"/>
          <rect x="-3.5" y="-9" width="7" height="12" rx="2" fill="#3a2810" stroke="#d4a84b" stroke-width="0.8"/>
          <circle cy="-3" r="2.5" fill="#ffe9a0"/>
          <line x1="0" y1="-9" x2="0" y2="-14" stroke="#d4a84b" stroke-width="0.8"/>
        </g>
      </g>

      <!-- ---- side-mounted twin propellers (thrusters) ---- -->
      <!-- prop A: near side, lower -->
      <g id="prop-a-mount" transform="translate(-55,22)">
        <rect x="-6" y="-4" width="10" height="8" rx="2" fill="#4a3568" stroke="#d4a84b" stroke-width="0.6"/>
        <g id="prop-a" transform="translate(-10,0)">
          <g id="prop-a-blades">
            <ellipse cx="0" cy="-12" rx="3" ry="12" fill="#a8d8c0" opacity="0.75"/>
            <ellipse cx="0" cy="12" rx="3" ry="12" fill="#a8d8c0" opacity="0.55"/>
          </g>
          <circle r="3.5" fill="#d4a84b"/>
          <circle r="1.5" fill="#3a2810"/>
        </g>
      </g>
      <!-- prop B: far side hint, offset phase -->
      <g id="prop-b-mount" transform="translate(-55,-2)">
        <rect x="-5" y="-3" width="8" height="6" rx="1.5" fill="#3a2a50" stroke="#8a6a30" stroke-width="0.5" opacity="0.7"/>
        <g id="prop-b" transform="translate(-9,0)">
          <g id="prop-b-blades">
            <ellipse cx="0" cy="-10" rx="2.5" ry="10" fill="#8fc8b0" opacity="0.55"/>
            <ellipse cx="0" cy="10" rx="2.5" ry="10" fill="#8fc8b0" opacity="0.4"/>
          </g>
          <circle r="2.8" fill="#8a6a30"/>
        </g>
      </g>

      <!-- ---- tiller / steering oar (right side, forward) ---- -->
      <g id="tiller-pivot" transform="translate(50,-4)">
        <g id="tiller">
          <line x1="0" y1="0" x2="55" y2="18" stroke="#c4a060" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="55" y2="18" stroke="#8a6a30" stroke-width="1.5" stroke-linecap="round"/>
          <!-- oar blade -->
          <ellipse cx="62" cy="22" rx="12" ry="6" fill="#d4a84b" transform="rotate(18 62 22)"/>
        </g>
      </g>

      <!-- ========== MOTH PILOT ========== -->
      <!-- moth sits in / on the canopy, leaning forward-right -->
      <g id="moth" transform="translate(5,-55)">

        <!-- abdomen / body (torso) — slight independent tilt/breath -->
        <g id="moth-torso">
          <!-- body -->
          <ellipse cx="0" cy="8" rx="7" ry="16" fill="#5a9a72"/>
          <ellipse cx="1" cy="4" rx="5" ry="10" fill="#7ecf9a"/>
          <!-- fuzzy thorax -->
          <ellipse cx="0" cy="-6" rx="8" ry="9" fill="#6ab080"/>
          <ellipse cx="0" cy="-7" rx="6" ry="7" fill="#8fd4a8" opacity="0.7"/>
          <!-- head -->
          <circle cx="2" cy="-18" r="7" fill="#7ecf9a"/>
          <circle cx="2" cy="-18" r="5.5" fill="#9ae0b8"/>
          <!-- eyes -->
          <ellipse cx="6" cy="-19" rx="2.2" ry="2.6" fill="#1a2820"/>
          <ellipse cx="-2" cy="-19" rx="2" ry="2.4" fill="#1a2820"/>
          <circle cx="6.6" cy="-19.6" r="0.7" fill="#d4f5e0"/>
          <circle cx="-1.5" cy="-19.6" r="0.6" fill="#d4f5e0"/>
          <!-- proboscis hint -->
          <path d="M5,-15 Q10,-12 8,-8" fill="none" stroke="#4a8a60" stroke-width="1"/>
          <!-- wing scale spots on thorax -->
          <circle cx="-3" cy="-5" r="1.2" fill="#3a6a4a" opacity="0.5"/>
          <circle cx="3" cy="-3" r="1" fill="#3a6a4a" opacity="0.5"/>

          <!-- ---- ANTENNAE (relative motion #2) ---- -->
          <g id="antennae">
            <g id="ant-l">
              <path d="M0,-23 C-6,-32 -14,-38 -20,-42"
                    fill="none" stroke="#5a9a72" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M-20,-42 C-18,-38 -16,-36 -14,-34"
                    fill="none" stroke="#5a9a72" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
              <!-- feathered pectinations -->
              <path d="M-6,-30 L-10,-36 M-10,-34 L-14,-40 M-14,-37 L-17,-42"
                    stroke="#6ab080" stroke-width="0.7" fill="none"/>
            </g>
            <g id="ant-r">
              <path d="M4,-23 C10,-33 16,-40 22,-45"
                    fill="none" stroke="#5a9a72" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M22,-45 C20,-41 18,-39 16,-37"
                    fill="none" stroke="#5a9a72" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
              <path d="M10,-32 L14,-38 M14,-36 L18,-43 M18,-40 L21,-45"
                    stroke="#6ab080" stroke-width="0.7" fill="none"/>
            </g>
          </g>

          <!-- ---- WINGS (relative motion — flap) ---- -->
          <!-- far/hind wing left -->
          <g id="wing-hl" transform="translate(-4,-4)">
            <path d="M0,0
                     C-20,-8 -45,-5 -55,10
                     C-50,22 -30,28 -10,22
                     C-4,14 0,8 0,0 Z"
                  fill="url(#wingGradL)" stroke="#3a8f6a" stroke-width="0.8"/>
            <path d="M-8,4 C-22,6 -38,10 -46,16" fill="none" stroke="#3a8f6a" stroke-width="0.5" opacity="0.6"/>
            <ellipse cx="-38" cy="14" rx="4" ry="2.5" fill="none" stroke="#2a6a4a" stroke-width="0.6" opacity="0.7"/>
          </g>
          <!-- near/fore wing left -->
          <g id="wing-fl" transform="translate(-3,-10)">
            <path d="M0,0
                     C-12,-22 -28,-32 -42,-28
                     C-48,-16 -40,-2 -22,6
                     C-10,8 -2,6 0,0 Z"
                  fill="url(#wingGrad)" stroke="#3a8f6a" stroke-width="0.9"/>
            <path d="M-6,-2 C-16,-14 -28,-22 -36,-24" fill="none" stroke="#3a8f6a" stroke-width="0.5" opacity="0.55"/>
            <ellipse cx="-32" cy="-18" rx="5" ry="3" fill="none" stroke="#2a6a4a" stroke-width="0.6" opacity="0.75"/>
            <circle cx="-32" cy="-18" r="1.2" fill="#2a6a4a" opacity="0.4"/>
          </g>
          <!-- far/hind wing right -->
          <g id="wing-hr" transform="translate(4,-4)">
            <path d="M0,0
                     C18,-6 42,-2 52,12
                     C46,24 26,28 8,22
                     C2,14 0,8 0,0 Z"
                  fill="url(#wingGradL)" stroke="#3a8f6a" stroke-width="0.8" opacity="0.85"/>
            <ellipse cx="36" cy="14" rx="4" ry="2.5" fill="none" stroke="#2a6a4a" stroke-width="0.6" opacity="0.65"/>
          </g>
          <!-- near/fore wing right (partially toward viewer) -->
          <g id="wing-fr" transform="translate(3,-10)">
            <path d="M0,0
                     C10,-20 24,-30 38,-26
                     C44,-14 36,0 20,6

<style>
/* ========== ANIMATION ========== */

/* --- L1 far parallax: slowest, long period --- */
#parallax-far {
  animation: parallaxFar 48s linear infinite;
}
@keyframes parallaxFar {
  from { transform: translateX(0); }
  to   { transform: translateX(-1200px); }
}

/* --- L2 mid parallax --- */
#parallax-mid {
  animation: parallaxMid 28s linear infinite;
}
@keyframes parallaxMid {
  from { transform: translateX(0); }
  to   { transform: translateX(-1200px); }
}

/* --- L3 near parallax: fastest --- */
#parallax-near {
  animation: parallaxNear 14s linear infinite;
}
@keyframes parallaxNear {
  from { transform: translateX(0); }
  to   { transform: translateX(-1200px); }
}

/* craft bob + slight pitch (NOT full-body lock; no X translation) */
#craft-body {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation:
    craftBob 3.2s ease-in-out infinite,
    craftPitch 5.1s ease-in-out infinite;
}
@keyframes craftBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
@keyframes craftPitch {
  0%, 100% { transform: rotate(-1.5deg); }
  50%      { transform: rotate(2deg); }
}

/* propellers — spin; direction consistent with rightward thrust */
#prop-a-blades {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: spinProp 0.45s linear infinite;
}
#prop-b-blades {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  animation: spinProp 0.45s linear infinite reverse; /* opposite blade pair phase feel */
}
@keyframes spinProp {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* wake particles stream LEFT (craft goes RIGHT) */
.wake-p {
  animation: wakeStream 1.1s linear infinite;
  animation-delay: var(--d);
}
@keyframes wakeStream {
  0%   { transform: translate(20px, 0); opacity: 0.7; }
  100% { transform: translate(-120px, 8px); opacity: 0; }
}

/* antennae sway — different period from bob/pitch */
#ant-l {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: antL 2.3s ease-in-out infinite;
}
#ant-r {
  transform-box: fill-box;
  transform-origin: 0% 100%;
  animation: antR 2.7s ease-in-out infinite;
}
@keyframes antL {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(-12deg); }
}
@keyframes antR {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(10deg); }
}

/* wing flap — slow luna-moth beat, independent of hull */
#wing-fl {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: wingFL 2.4s ease-in-out infinite;
}
#wing-fr {
  transform-box: fill-box;
  transform-origin: 0% 100%;
  animation: wingFR 2.4s ease-in-out infinite;
}
#wing-hl {
  transform-box: fill-box;
  transform-origin: 100% 100%;
  animation: wingHL 2.4s ease-in-out infinite;
  animation-delay: 0.12s;
}
#wing-hr {
  transform-box: fill-box;
  transform-origin: 0% 100%;
  animation: wingHR 2.4s ease-in-out infinite;
  animation-delay: 0.12s;
}
@keyframes wingFL {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  50%      { transform: rotate(-18deg) scaleY(0.92); }
}
@keyframes wingFR {
  0%, 100% { transform: rotate(0deg) scaleY(1); }
  50%      { transform: rotate(16deg) scaleY(0.92); }
}
@keyframes wingHL {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(-10deg); }
}
@keyframes wingHR {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(8deg); }
}

/* tiller steering swing */
#tiller {
  transform-box: fill-box;
  transform-origin: 0% 50%;
  animation: tillerSwing 2.8s ease-in-out infinite;
}
@keyframes tillerSwing {
  0%, 100% { transform: rotate(0deg); }
  35%      { transform: rotate(-8deg); }
  70%      { transform: rotate(6deg); }
}

/* fore-leg grips follow tiller with extra lag arc (relative to torso) */
#fore-l-grip {
  transform-box: fill-box;
  transform-origin: 0% 0%;
  animation: gripL 2.8s ease-in-out infinite;
}
#fore-r-grip {
  transform-box: fill-box;
  transform-origin: 0% 0%;
  animation: gripR 2.8s ease-in-out infinite;
  animation-delay: 0.15s;
}
@keyframes gripL {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  35%      { transform: translate(2px, -3px) rotate(-4deg); }
  70%      { transform: translate(-2px, 2px) rotate(3deg); }
}
@keyframes gripR {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  35%      { transform: translate(1px, -2px) rotate(-3deg); }
  70%      { transform: translate(-1px, 2px) rotate(2deg); }
}

/* mid legs micro-adjust (independent) */
#leg-mid-l {
  transform-box: fill-box;
  transform-origin: 100% 50%;
  animation: midLegL 4.0s ease-in-out infinite;
}
#leg-mid-r {
  transform-box: fill-box;
  transform-origin: 0% 50%;
  animation: midLegR 3.6s ease-in-out infinite;
}
@keyframes midLegL {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(-6deg); }
}
@keyframes midLegR {
  0%, 100% { transform: rotate(0deg); }
  50%      { transform: rotate(5deg); }
}

/* torso breath / lean — small, not locked translation */
#moth-torso {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: torsoBreath 3.0s ease-in-out infinite;
}
@keyframes torsoBreath {
  0%, 100% { transform: rotate(0deg) scale(1); }
  50%      { transform: rotate(-2.5deg) scale(1.02); }
}

/* lantern flicker */
#lantern-l, #lantern-r {
  animation: flicker 2.1s ease-in-out infinite;
}
#lantern-r { animation-delay: 0.7s; }
@keyframes flicker {
  0%, 100% { opacity: 1; }
  40%      { opacity: 0.75; }
  60%      { opacity: 0.95; }
  80%      { opacity: 0.7; }
}

/* ornament pendulum */
#ornament {
  transform-box: fill-box;
  transform-origin: 50% 0%;
  animation: ornamentSwing 2.6s ease-in-out infinite;
}
@keyframes ornamentSwing {
  0%, 100% { transform: rotate(-4deg); }
  50%      { transform: rotate(5deg); }
}

/* firefly motes drift */
.mote {
  animation: moteDrift 6s ease-in-out infinite;
}
.mote:nth-child(2n) { animation-duration: 7.5s; animation-delay: 1s; }
.mote:nth-child(3n) { animation-duration: 5.2s; animation-delay: 0.5s; }
@keyframes moteDrift {
  0%, 100% { transform: translate(0, 0); opacity: 0.5; }
  50%      { transform: translate(-12px, -18px); opacity: 1; }
}
</style>

<script>
/* Lightweight runtime assist:
   - duplicate far/mid/near tiles so seamless 1200px CSS translate loops work
   - no external resources, no network
*/
(function () {
  function cloneTile(tileId, parentSelector, count) {
    var tile = document.getElementById(tileId);
    if (!tile) return;
    var parent = tile.parentNode;
    for (var i = 1; i < count; i++) {
      var c = tile.cloneNode(true);
      c.removeAttribute('id');
      c.setAttribute('transform', 'translate(' + (1200 * i) + ',0)');
      parent.insertBefore(c, tile.nextSibling);
    }
  }
  // 2 tiles each → 2400px strip; CSS animates -1200px then resets
  cloneTile('far-tile', null, 2);
  cloneTile('mid-tile', null, 2);
  cloneTile('near-tile', null, 2);

  // Extend parallax containers width-wise via nested scale is unnecessary;
  // SVG overflow is visible; clones sit at x=1200.
})();
</script>
