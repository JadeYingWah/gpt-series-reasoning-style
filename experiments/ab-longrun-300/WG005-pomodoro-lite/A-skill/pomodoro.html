<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极简番茄钟</title>
<style>
  :root {
    --bg: #f6f1ea;
    --ink: #1c1917;
    --muted: #78716c;
    --accent: #c2410c;
    --accent-soft: #fed7aa;
    --card: #fffdf9;
    --border: #e7e0d5;
    --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .card {
    width: min(420px, calc(100vw - 32px));
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow: 0 10px 30px rgba(28, 25, 23, 0.06);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.25rem;
    letter-spacing: 0.02em;
  }
  .sub {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .display {
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.2rem, 12vw, 4.2rem);
    font-weight: 650;
    letter-spacing: 0.04em;
    text-align: center;
    line-height: 1.1;
    margin: 8px 0 6px;
  }
  .status {
    text-align: center;
    min-height: 1.4em;
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 18px;
  }
  .status.is-done {
    color: var(--accent);
    font-weight: 600;
  }
  .status.is-running {
    color: var(--ok);
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    border-radius: 10px;
    padding: 12px 8px;
    font: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #faf7f2; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .config {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: end;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input[type="number"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fff;
  }
  input[type="number"]:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
  }
  .hint {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.5;
  }
  .error {
    margin: 10px 0 0;
    color: #b91c1c;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>
<main class="card" aria-label="极简番茄钟">
  <h1>极简番茄钟</h1>
  <p class="sub">专注 25 分钟，休息一下。</p>

  <div id="display" class="display" role="timer" aria-live="polite">25:00</div>
  <div id="status" class="status">就绪</div>

  <div class="controls">
    <button id="startBtn" class="primary" type="button">开始</button>
    <button id="pauseBtn" type="button" disabled>暂停</button>
    <button id="resetBtn" type="button">重置</button>
  </div>

  <div class="config">
    <label>
      时长（分钟，1–60）
      <input id="minutesInput" type="number" min="1" max="60" step="1" value="25" inputmode="numeric">
    </label>
    <button id="applyBtn" type="button">应用时长</button>
  </div>
  <p id="errorMsg" class="error" aria-live="polite"></p>
  <p class="hint">结束时状态变为「时间到」，并尝试播放一声短促 beep（需浏览器允许音频）。无外链、无框架。</p>
</main>

<script>
/**
 * 极简番茄钟核心逻辑（可被源码审查或 Node 抽取核对）。
 * 状态机：idle / running / paused / done
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) {
    module.exports = factory();
  } else {
    root.PomodoroCore = factory();
  }
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  var MIN_MINUTES = 1;
  var MAX_MINUTES = 60;

  function pad2(n) {
    n = Math.floor(Math.abs(n));
    return n < 10 ? "0" + n : String(n);
  }

  function formatClock(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return pad2(m) + ":" + pad2(s);
  }

  /** 解析用户输入的分钟数：必须是 1–60 的正整数（允许 "25" / "25.0" 这类整数值）。 */
  function parseMinutes(raw) {
    if (raw === null || raw === undefined) return { ok: false, error: "请输入时长" };
    var text = String(raw).trim();
    if (text === "") return { ok: false, error: "请输入时长" };
    if (!/^\d+(\.\d+)?$/.test(text)) return { ok: false, error: "时长须为数字" };
    var n = Number(text);
    if (!isFinite(n)) return { ok: false, error: "时长无效" };
    if (!Number.isInteger(n)) return { ok: false, error: "时长须为正整数" };
    if (n < MIN_MINUTES || n > MAX_MINUTES) {
      return { ok: false, error: "时长须在 " + MIN_MINUTES + "–" + MAX_MINUTES + " 分钟" };
    }
    return { ok: true, minutes: n, seconds: n * 60 };
  }

  /**
   * createTimer(options)
   * options: {
   *   initialSeconds?: number,
   *   now?: () => number,          // 可注入时钟，默认 Date.now
   *   onTick?: (view) => void,
   *   onComplete?: (view) => void
   * }
   */
  function createTimer(options) {
    options = options || {};
    var now = options.now || function () { return Date.now(); };
    var onTick = options.onTick || function () {};
    var onComplete = options.onComplete || function () {};

    var durationSeconds = Math.max(0, Math.floor(options.initialSeconds != null ? options.initialSeconds : 25 * 60));
    var remainingSeconds = durationSeconds;
    var status = "idle"; // idle | running | paused | done
    var intervalId = null;
    var endAtMs = 0; // running 时的目标结束墙钟时间

    function snapshot() {
      return {
        status: status,
        remainingSeconds: remainingSeconds,
        durationSeconds: durationSeconds,
        display: formatClock(remainingSeconds)
      };
    }

    function clearTick() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    function settleToDone() {
      remainingSeconds = 0;
      status = "done";
      clearTick();
      var view = snapshot();
      onComplete(view);
      return view;
    }

    function tick() {
      if (status !== "running") return snapshot();
      var msLeft = endAtMs - now();
      if (msLeft <= 0) return settleToDone();
      remainingSeconds = Math.ceil(msLeft / 1000);
      var view = snapshot();
      onTick(view);
      return view;
    }

    function start() {
      if (status === "running") return snapshot();
      if (status === "done") {
        // 完成后再次开始：重置为完整时长
        remainingSeconds = durationSeconds;
      }
      if (remainingSeconds <= 0) {
        remainingSeconds = durationSeconds;
      }
      status = "running";
      endAtMs = now() + remainingSeconds * 1000;
      clearTick();
      intervalId = setInterval(tick, 250);
      var view = snapshot();
      onTick(view);
      return view;
    }

    function pause() {
      if (status !== "running") return snapshot();
      tick(); // 先按墙钟对齐剩余时间
      if (status === "done") return snapshot();
      clearTick();
      status = "paused";
      var view = snapshot();
      onTick(view);
      return view;
    }

    function reset() {
      clearTick();
      remainingSeconds = durationSeconds;
      status = "idle";
      var view = snapshot();
      onTick(view);
      return view;
    }

    function setDurationMinutes(raw) {
      var parsed = parseMinutes(raw);
      if (!parsed.ok) return { ok: false, error: parsed.error };
      clearTick();
      durationSeconds = parsed.seconds;
      remainingSeconds = durationSeconds;
      status = "idle";
      var view = snapshot();
      view.ok = true;
      view.minutes = parsed.minutes;
      onTick(view);
      return view;
    }

    function getState() {
      return snapshot();
    }

    function destroy() {
      clearTick();
    }

    return {
      start: start,
      pause: pause,
      reset: reset,
      setDurationMinutes: setDurationMinutes,
      getState: getState,
      destroy: destroy,
      parseMinutes: parseMinutes,
      formatClock: formatClock
    };
  }

  return {
    MIN_MINUTES: MIN_MINUTES,
    MAX_MINUTES: MAX_MINUTES,
    pad2: pad2,
    formatClock: formatClock,
    parseMinutes: parseMinutes,
    createTimer: createTimer
  };
});

/* ---------- 浏览器 UI 绑定（Node 环境下不执行） ---------- */
(function () {
  if (typeof document === "undefined") return;

  var core = window.PomodoroCore;
  var displayEl = document.getElementById("display");
  var statusEl = document.getElementById("status");
  var startBtn = document.getElementById("startBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var resetBtn = document.getElementById("resetBtn");
  var minutesInput = document.getElementById("minutesInput");
  var applyBtn = document.getElementById("applyBtn");
  var errorMsg = document.getElementById("errorMsg");

  var STATUS_TEXT = {
    idle: "就绪",
    running: "进行中",
    paused: "已暂停",
    done: "时间到"
  };

  function beep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      var t0 = ctx.currentTime;
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
      osc.start(t0);
      osc.stop(t0 + 0.5);
      osc.onended = function () {
        try { ctx.close(); } catch (e) { /* ignore */ }
      };
    } catch (e) {
      // 音频失败不影响计时
    }
  }

  function render(view) {
    displayEl.textContent = view.display;
    statusEl.textContent = STATUS_TEXT[view.status] || view.status;
    statusEl.classList.toggle("is-done", view.status === "done");
    statusEl.classList.toggle("is-running", view.status === "running");
    startBtn.disabled = view.status === "running";
    pauseBtn.disabled = view.status !== "running";
    startBtn.textContent = view.status === "paused" ? "继续" : (view.status === "done" ? "再来一轮" : "开始");
  }

  var timer = core.createTimer({
    initialSeconds: 25 * 60,
    onTick: render,
    onComplete: function (view) {
      render(view);
      beep();
    }
  });

  startBtn.addEventListener("click", function () {
    errorMsg.textContent = "";
    timer.start();
  });
  pauseBtn.addEventListener("click", function () {
    timer.pause();
  });
  resetBtn.addEventListener("click", function () {
    errorMsg.textContent = "";
    timer.reset();
  });
  applyBtn.addEventListener("click", function () {
    var result = timer.setDurationMinutes(minutesInput.value);
    if (result && result.ok === false) {
      errorMsg.textContent = result.error || "时长无效";
      return;
    }
    errorMsg.textContent = "";
  });

  minutesInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") applyBtn.click();
  });

  render(timer.getState());
})();
</script>
</body>
</html>
