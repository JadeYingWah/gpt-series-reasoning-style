<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Heron Zeppelin — Dusk Flight</title>
<!--
  自洽说明 / Geometry & Motion Consistency
  ========================================
  1) 推进器循环与前进方向一致
     - 右侧主螺旋桨 #prop-r 沿 Z 轴顺时针旋转（viewBox 中从右侧观察，
       右侧推进器应顺时针才产生向右推力，符合画面朝右前进）。
     - 左侧副螺旋桨 #prop-l 同相位顺时针。
     - 螺旋桨动画周期 0.28s，持续旋转，不与机身 bob 同步锁死。

  2) Heron 至少 2 处肢体/附肢相对载具独立运动
     - #heron-neck：颈部 1.8s 摇摆（rotate -6deg~+5deg），原点在颈部根部。
     - #heron-wing-front：前翼 1.1s 抬降（操纵杆/理羽），相对 gondola 独立。
     - #heron-leg-dangle：双腿 2.4s 吊挂晃动，相对 gondola 独立。
     - #heron-head 在 neck 子级上再叠 2.9s 微转（双重非同步）。
     - 以上均以 transform-origin 锚定关节，全身不锁死平移。

  3) 背景至少 2 层视差 / 景深
     - Layer Far   #bg-stars + #bg-mtn：极慢水平漂移 + 星光闪烁（最远）。
     - Layer Mid   #bg-cloud-a / #bg-cloud-b：中速云带，不同 speed 与 opacity。
     - Layer Near  #bg-wisp / #bg-particles：近景雾丝与粒子，最快。
     - 主体 #zeppelin-rig：机身 bob + 微 pitch，相对背景静止（世界系前进）。
     - 云层用 translateX(-20%) 循环，营造向右前进的相对运动。

  4) 车轮/履带不适用（飞行器）；推进器循环已覆盖「循环动画与前进方向一致」。
-->
<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a2744;
    --sky-low: #3d2a4a;
    --sky-horizon: #c45c3e;
    --sky-glow: #f0a35e;
    --gold: #d4a84b;
    --gold-deep: #8a6a28;
    --hull: #e8d5a3;
    --hull-shade: #b8956a;
    --wood: #5c3a28;
    --wood-light: #8b5e3c;
    --heron-body: #6b7c93;
    --heron-belly: #c5d0dc;
    --heron-beak: #e8a838;
    --heron-crest: #2a3548;
    --heron-eye: #f5e6a0;
    --cloud-a: #2a3550;
    --cloud-b: #3d4a68;
    --mtn-far: #141c30;
    --mtn-near: #1c2840;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050810;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1400px;
    max-height: 900px;
  }

  svg.scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- 背景视差层 ---------- */
  #layer-stars {
    animation: stars-drift 90s linear infinite;
  }
  @keyframes stars-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-40px); }
  }

  .star-twinkle {
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .star-twinkle:nth-child(odd) { animation-duration: 4.1s; animation-delay: -1.2s; }
  .star-twinkle:nth-child(3n)  { animation-duration: 2.6s; animation-delay: -0.7s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  #layer-mtn {
    animation: mtn-drift 120s linear infinite;
  }
  @keyframes mtn-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-60px); }
  }

  #layer-cloud-far {
    animation: cloud-far 80s linear infinite;
  }
  @keyframes cloud-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-20%); }
  }

  #layer-cloud-mid {
    animation: cloud-mid 48s linear infinite;
  }
  @keyframes cloud-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-28%); }
  }

  #layer-wisp {
    animation: wisp 28s linear infinite;
  }
  @keyframes wisp {
    from { transform: translateX(0); }
    to   { transform: translateX(-36%); }
  }

  #layer-particles {
    animation: particles 14s linear infinite;
  }
  @keyframes particles {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---------- 齐柏林飞艇主体 ---------- */
  #zeppelin-rig {
    transform-origin: 640px 380px;
    animation:
      zeppelin-bob 3.6s ease-in-out infinite,
      zeppelin-pitch 5.2s ease-in-out infinite;
  }
  @keyframes zeppelin-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes zeppelin-pitch {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-1.2deg); }
    70%      { transform: rotate(0.8deg); }
  }

  /* 螺旋桨：右侧观察顺时针 → 向右推力 */
  #prop-r {
    transform-origin: 1118px 372px;
    animation: prop-spin 0.28s linear infinite;
  }
  #prop-l {
    transform-origin: 180px 372px;
    animation: prop-spin 0.28s linear infinite;
  }
  @keyframes prop-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 尾鳍轻微飘动 */
  .tail-fin {
    animation: tail-flick 2.8s ease-in-out infinite;
  }
  .tail-fin.f2 { animation-delay: -0.9s; }
  .tail-fin.f3 { animation-delay: -1.7s; }
  @keyframes tail-flick {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(3.5deg); }
  }

  /* 吊舱微摆（相对气囊） */
  #gondola-group {
    transform-origin: 640px 500px;
    animation: gondola-swing 4.4s ease-in-out infinite;
  }
  @keyframes gondola-swing {
    0%, 100% { transform: rotate(0.4deg); }
    50%      { transform: rotate(-0.7deg); }
  }

  /* ---------- Heron 肢体独立运动 ---------- */

  /* 颈：相对 gondola 摇摆 */
  #heron-neck {
    transform-origin: 560px 448px;
    animation: neck-sway 1.8s ease-in-out infinite;
  }
  @keyframes neck-sway {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(6deg); }
  }

  /* 头：在 neck 上再叠一层微转 */
  #heron-head {
    transform-origin: 520px 390px;
    animation: head-turn 2.9s ease-in-out infinite;
  }
  @keyframes head-turn {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-4deg); }
    75%      { transform: rotate(3deg); }
  }

  /* 前翼（操纵 / 理羽） */
  #heron-wing-front {
    transform-origin: 575px 470px;
    animation: wing-flap 1.1s ease-in-out infinite;
  }
  @keyframes wing-flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-18deg); }
  }

  /* 后翼/覆羽轻颤 */
  #heron-wing-back {
    transform-origin: 600px 475px;
    animation: wing-back 1.7s ease-in-out infinite;
  }
  @keyframes wing-back {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(4deg) translateY(2px); }
  }

  /* 双腿吊挂晃动 */
  #heron-leg-dangle {
    transform-origin: 590px 510px;
    animation: leg-swing 2.4s ease-in-out infinite;
  }
  @keyframes leg-swing {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(5deg); }
  }

  /* 羽冠飘动 */
  #heron-crest {
    transform-origin: 530px 388px;
    animation: crest-flutter 1.4s ease-in-out infinite;
  }
  @keyframes crest-flutter {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(6deg); }
  }

  /* 眨眼 */
  #heron-eye-lid {
    animation: blink 4.5s step-end infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    94%, 96%      { transform: scaleY(1); }
  }

  /* 舱灯脉冲 */
  .cabin-light {
    animation: light-pulse 2.2s ease-in-out infinite;
  }
  .cabin-light.l2 { animation-delay: -0.8s; }
  @keyframes light-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* 推进尾流 */
  .thrust-stream {
    animation: thrust-flow 0.55s linear infinite;
    opacity: 0.45;
  }
  @keyframes thrust-flow {
    0%   { transform: translateX(0) scaleX(1); opacity: 0.5; }
    100% { transform: translateX(-30px) scaleX(0.4); opacity: 0; }
  }

  /* 罗盘指针 */
  #compass-needle {
    transform-origin: 655px 530px;
    animation: compass-wobble 3.8s ease-in-out infinite;
  }
  @keyframes compass-wobble {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(10deg); }
  }

  /* 地面速度线（近景） */
  .speed-line {
    animation: speed 1.6s linear infinite;
  }
  .speed-line.s2 { animation-duration: 1.1s; animation-delay: -0.4s; }
  .speed-line.s3 { animation-duration: 2.0s; animation-delay: -0.9s; }
  @keyframes speed {
    0%   { transform: translateX(80px); opacity: 0; }
    20%  { opacity: 0.35; }
    100% { transform: translateX(-120px); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
<svg class="scene" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A heron piloting a zeppelin flying to the right at dusk">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1026"/>
      <stop offset="35%"  stop-color="#1a2744"/>
      <stop offset="62%"  stop-color="#3d2a4a"/>
      <stop offset="82%"  stop-color="#c45c3e"/>
      <stop offset="100%" stop-color="#f0a35e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="72%" r="40%">
      <stop offset="0%"   stop-color="#ffd28a" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#f0a35e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0a35e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hullShine" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#fff6d8" stop-opacity="0.7"/>
      <stop offset="55%"  stop-color="#e8d5a3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8a6a28" stop-opacity="0.25"/>
    </radialGradient>
    <linearGradient id="gondolaWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8b5e3c"/>
      <stop offset="50%"  stop-color="#5c3a28"/>
      <stop offset="100%" stop-color="#3a2216"/>
    </linearGradient>
    <linearGradient id="heronBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8a9bb0"/>
      <stop offset="45%"  stop-color="#6b7c93"/>
      <stop offset="100%" stop-color="#4a5a70"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ========== LAYER 0: 天空 ========== -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  <rect width="1280" height="720" fill="url(#sunGlow)"/>

  <!-- ========== LAYER FAR: 星空 ========== -->
  <g id="layer-stars" fill="#f5f0e0">
    <circle class="star-twinkle" cx="80"  cy="48"  r="1.2"/>
    <circle class="star-twinkle" cx="160" cy="90"  r="0.9"/>
    <circle class="star-twinkle" cx="240" cy="36"  r="1.4"/>
    <circle class="star-twinkle" cx="320" cy="110" r="0.8"/>
    <circle class="star-twinkle" cx="400" cy="55"  r="1.1"/>
    <circle class="star-twinkle" cx="480" cy="28"  r="1.3"/>
    <circle class="star-twinkle" cx="560" cy="95"  r="0.7"/>
    <circle class="star-twinkle" cx="640" cy="42"  r="1.0"/>
    <circle class="star-twinkle" cx="720" cy="78"  r="1.5"/>
    <circle class="star-twinkle" cx="800" cy="30"  r="0.9"/>
    <circle class="star-twinkle" cx="880" cy="100" r="1.2"/>
    <circle class="star-twinkle" cx="960" cy="50"  r="0.8"/>
    <circle class="star-twinkle" cx="1040" cy="72" r="1.3"/>
    <circle class="star-twinkle" cx="1120" cy="38" r="1.0"/>
    <circle class="star-twinkle" cx="1200" cy="88" r="0.7"/>
    <circle class="star-twinkle" cx="130"  cy="150" r="0.6"/>
    <circle class="star-twinkle" cx="500"  cy="140" r="0.9"/>
    <circle class="star-twinkle" cx="900"  cy="130" r="0.8"/>
    <circle class="star-twinkle" cx="1100" cy="160" r="1.1"/>
  </g>

  <!-- ========== LAYER FAR: 远山剪影 ========== -->
  <g id="layer-mtn" opacity="0.85">
    <path d="M0 520 L80 440 L160 490 L240 400 L340 470 L420 420 L520 500 L600 430 L700 480 L780 410 L880 470 L960 430 L1060 490 L1140 420 L1280 500 L1280 720 L0 720 Z"
          fill="#141c30"/>
    <path d="M0 560 L100 500 L200 540 L300 480 L420 530 L540 470 L660 520 L780 460 L900 530 L1020 490 L1140 540 L1280 500 L1280 720 L0 720 Z"
          fill="#1c2840" opacity="0.9"/>
  </g>

  <!-- ========== LAYER MID: 远云 ========== -->
  <g id="layer-cloud-far" opacity="0.45" fill="#2a3550">
    <ellipse cx="100" cy="200" rx="120" ry="28"/>
    <ellipse cx="380" cy="250" rx="90" ry="22"/>
    <ellipse cx="700" cy="180" rx="140" ry="30"/>
    <ellipse cx="1050" cy="230" rx="100" ry="24"/>
    <!-- 重复一份保证无缝循环 -->
    <ellipse cx="1580" cy="200" rx="120" ry="28"/>
    <ellipse cx="1860" cy="250" rx="90" ry="22"/>
  </g>

  <!-- ========== LAYER MID: 中云 ========== -->
  <g id="layer-cloud-mid" opacity="0.55" fill="#3d4a68">
    <ellipse cx="180" cy="320" rx="150" ry="36"/>
    <ellipse cx="240" cy="300" rx="90" ry="24"/>
    <ellipse cx="560" cy="290" rx="130" ry="32"/>
    <ellipse cx="920" cy="340" rx="160" ry="40"/>
    <ellipse cx="1100" cy="310" rx="80" ry="22"/>
    <!-- 无缝 -->
    <ellipse cx="1700" cy="320" rx="150" ry="36"/>
    <ellipse cx="1760" cy="300" rx="90" ry="24"/>
  </g>

  <!-- ========== LAYER NEAR: 雾丝 ========== -->
  <g id="layer-wisp" opacity="0.22" fill="#e8c9a0" filter="url(#softBlur)">
    <ellipse cx="200" cy="580" rx="200" ry="20"/>
    <ellipse cx="600" cy="610" rx="260" ry="18"/>
    <ellipse cx="1000" cy="590" rx="180" ry="22"/>
    <ellipse cx="1480" cy="580" rx="200" ry="20"/>
    <ellipse cx="1880" cy="610" rx="260" ry="18"/>
  </g>

  <!-- ========== 主体：齐柏林飞艇 + 苍鹭 ========== -->
  <g id="zeppelin-rig">

    <!-- 推进尾流 -->
    <g opacity="0.5">
      <line class="thrust-stream" x1="80" y1="365" x2="140" y2="365" stroke="#f0a35e" stroke-width="2"/>
      <line class="thrust-stream" x1="70" y1="372" x2="130" y2="372" stroke="#f0a35e" stroke-width="1.5" style="animation-delay:-0.2s"/>
      <line class="thrust-stream" x1="85" y1="379" x2="145" y2="379" stroke="#f0a35e" stroke-width="1.5" style="animation-delay:-0.35s"/>
    </g>

    <!-- 气囊主体 -->
    <ellipse cx="640" cy="380" rx="420" ry="110" fill="#e8d5a3"/>
    <ellipse cx="640" cy="380" rx="420" ry="110" fill="url(#hullShine)"/>
    <!-- 气囊水平筋线 -->
    <ellipse cx="640" cy="380" rx="400" ry="90" fill="none" stroke="#c4a870" stroke-width="1" opacity="0.5"/>
    <line x1="240" y1="380" x2="1040" y2="380" stroke="#c4a870" stroke-width="1.2" opacity="0.45"/>
    <path d="M250 340 Q640 310 1030 340" fill="none" stroke="#c4a870" stroke-width="1" opacity="0.35"/>
    <path d="M250 420 Q640 450 1030 420" fill="none" stroke="#c4a870" stroke-width="1" opacity="0.35"/>
    <!-- 气囊金色包边 -->
    <ellipse cx="640" cy="380" rx="420" ry="110" fill="none" stroke="#d4a84b" stroke-width="3"/>
    <!-- 顶部脊线 -->
    <path d="M300 320 Q640 280 980 320" fill="none" stroke="#d4a84b" stroke-width="2" opacity="0.6"/>

    <!-- 装饰环带 -->
    <path d="M480 280 Q470 380 480 480" fill="none" stroke="#8a6a28" stroke-width="2" opacity="0.4"/>
    <path d="M800 280 Q810 380 800 480" fill="none" stroke="#8a6a28" stroke-width="2" opacity="0.4"/>

    <!-- 侧舷徽章 -->
    <circle cx="720" cy="380" r="28" fill="none" stroke="#d4a84b" stroke-width="2"/>
    <text x="720" y="386" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a6a28" font-weight="bold">HZ</text>

    <!-- 尾鳍组（左侧，因朝右飞） -->
    <g class="tail-fin f1" style="transform-origin:240px 380px">
      <path d="M220 380 L140 300 L160 380 Z" fill="#d4a84b" stroke="#8a6a28" stroke-width="1.5"/>
    </g>
    <g class="tail-fin f2" style="transform-origin:240px 380px">
      <path d="M220 380 L140 460 L160 380 Z" fill="#c49a3e" stroke="#8a6a28" stroke-width="1.5"/>
    </g>
    <g class="tail-fin f3" style="transform-origin:240px 380px">
      <path d="M220 380 L150 380 L220 360 L220 400 Z" fill="#b8892e" stroke="#8a6a28" stroke-width="1.2"/>
    </g>

    <!-- 左侧推进器 -->
    <g>
      <rect x="155" y="365" width="30" height="14" rx="3" fill="#5c3a28" stroke="#3a2216" stroke-width="1"/>
      <g id="prop-l">
        <ellipse cx="150" cy="372" rx="6" ry="28" fill="#d4a84b" opacity="0.85"/>
        <ellipse cx="150" cy="372" rx="28" ry="6" fill="#c49a3e" opacity="0.85"/>
        <circle cx="150" cy="372" r="5" fill="#5c3a28"/>
      </g>
    </g>

    <!-- 右侧推进器 -->
    <g>
      <rect x="1095" y="365" width="30" height="14" rx="3" fill="#5c3a28" stroke="#3a2216" stroke-width="1"/>
      <g id="prop-r">
        <ellipse cx="1130" cy="372" rx="6" ry="28" fill="#d4a84b" opacity="0.85"/>
        <ellipse cx="1130" cy="372" rx="28" ry="6" fill="#c49a3e" opacity="0.85"/>
        <circle cx="1130" cy="372" r="5" fill="#5c3a28"/>
      </g>
    </g>

    <!-- 吊缆 -->
    <line x1="560" y1="470" x2="580" y2="510" stroke="#5c3a28" stroke-width="2.5"/>
    <line x1="720" y1="470" x2="700" y2="510" stroke="#5c3a28" stroke-width="2.5"/>
    <line x1="640" y1="478" x2="640" y2="510" stroke="#5c3a28" stroke-width="2"/>

    <!-- ========== 吊舱 + 苍鹭 ========== -->
    <g id="gondola-group">

      <!-- 吊舱船体 -->
      <path d="M540 510 Q540 560 640 568 Q740 560 740 510 Z" fill="url(#gondolaWood)" stroke="#3a2216" stroke-width="2"/>
      <!-- 船舷木板 -->
      <path d="M550 525 Q640 535 730 525" fill="none" stroke="#8b5e3c" stroke-width="1" opacity="0.6"/>
      <path d="M548 540 Q640 552 732 540" fill="none" stroke="#8b5e3c" stroke-width="1" opacity="0.5"/>
      <!-- 船头装饰（朝右） -->
      <path d="M740 510 Q760 520 755 540 Q748 530 740 525 Z" fill="#d4a84b" stroke="#8a6a28" stroke-width="1"/>
      <!-- 舷窗 -->
      <circle class="cabin-light" cx="580" cy="535" r="8" fill="#f0d78c" stroke="#8a6a28" stroke-width="1.5" opacity="0.8"/>
      <circle class="cabin-light l2" cx="700" cy="535" r="8" fill="#f0d78c" stroke="#8a6a28" stroke-width="1.5" opacity="0.8"/>
      <!-- 驾驶台栏杆 -->
      <line x1="560" y1="510" x2="720" y2="510" stroke="#8b5e3c" stroke-width="3"/>
      <line x1="575" y1="500" x2="575" y2="512" stroke="#8b5e3c" stroke-width="2"/>
      <line x1="640" y1="498" x2="640" y2="512" stroke="#8b5e3c" stroke-width="2"/>
      <line x1="705" y1="500" x2="705" y2="512" stroke="#8b5e3c" stroke-width="2"/>

      <!-- 仪表罗盘 -->
