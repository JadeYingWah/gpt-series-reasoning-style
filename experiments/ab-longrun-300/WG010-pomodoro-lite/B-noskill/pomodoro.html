<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --card: #25262b;
      --text: #f8f9fa;
      --muted: #868e96;
      --accent: #ff6b6b;
      --ok: #51cf66;
      --warn: #fcc419;
      --border: #373a40;
      --radius: 12px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2.5rem;
      width: min(92vw, 380px);
      text-align: center;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    #display {
      font-variant-numeric: tabular-nums;
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    #status {
      min-height: 1.4em;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    #status.running { color: var(--ok); }
    #status.paused  { color: var(--warn); }
    #status.done    { color: var(--accent); font-weight: 600; }
    .controls {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    button {
      font: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      min-width: 4.5rem;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    .config {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .config label { display: flex; align-items: center; gap: 0.4rem; }
    #minutes {
      width: 4.2rem;
      font: inherit;
      font-size: 0.95rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    #minutes:disabled { opacity: 0.45; }
    #apply {
      min-width: auto;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>番茄钟</h1>
    <div id="display" aria-live="polite">25:00</div>
    <div id="status" role="status">就绪</div>

    <div class="controls">
      <button id="startPause" class="primary" type="button">开始</button>
      <button id="reset" type="button">重置</button>
    </div>

    <div class="config">
      <label for="minutes">时长（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" value="25" />
      <button id="apply" type="button">应用</button>
    </div>

    <p class="hint">1–60 正整数 · 结束时显示「时间到」并尝试播放提示音</p>
  </main>

  <script>
    "use strict";

    /* ---------- pure core (Node-checkable, no DOM) ---------- */
    const PomodoroCore = {
      /** Validate and normalize minutes. Returns integer 1..60 or null. */
      parseMinutes(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return null;
        if (!Number.isInteger(n)) return null;
        if (n < 1 || n > 60) return null;
        return n;
      },

      /** Format remaining seconds as M:SS or MM:SS (no hours). */
      format(seconds) {
        const s = Math.max(0, Math.floor(seconds));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      },

      /**
       * Create a timer controller.
       * @param {number} minutes - duration in minutes (1..60)
       * @param {{onTick?: Function, onDone?: Function, now?: Function}} hooks
       */
      create(minutes, hooks = {}) {
        const totalSeconds = minutes * 60;
        const now = hooks.now || (() => Date.now());
        let remaining = totalSeconds;
        let running = false;
        let endAt = null; // absolute ms when remaining hits 0
        let intervalId = null;

        function tick() {
          if (!running) return;
          remaining = Math.max(0, Math.ceil((endAt - now()) / 1000));
          if (hooks.onTick) hooks.onTick(remaining);
          if (remaining <= 0) {
            running = false;
            endAt = null;
            if (intervalId !== null) {
              clearInterval(intervalId);
              intervalId = null;
            }
            if (hooks.onDone) hooks.onDone();
          }
        }

        return {
          get remaining() { return remaining; },
          get running() { return running; },
          get totalSeconds() { return totalSeconds; },

          start() {
            if (running || remaining <= 0) return false;
            running = true;
            endAt = now() + remaining * 1000;
            tick();
            if (running && intervalId === null) {
              intervalId = setInterval(tick, 250);
            }
            return true;
          },

          pause() {
            if (!running) return false;
            remaining = Math.max(0, Math.ceil((endAt - now()) / 1000));
            running = false;
            endAt = null;
            if (intervalId !== null) {
              clearInterval(intervalId);
              intervalId = null;
            }
            if (hooks.onTick) hooks.onTick(remaining);
            return true;
          },

          reset() {
            if (intervalId !== null) {
              clearInterval(intervalId);
              intervalId = null;
            }
            running = false;
            endAt = null;
            remaining = totalSeconds;
            if (hooks.onTick) hooks.onTick(remaining);
            return remaining;
          },

          destroy() {
            if (intervalId !== null) {
              clearInterval(intervalId);
              intervalId = null;
            }
            running = false;
          },
        };
      },
    };

    /* Expose for Node source extraction / tests */
    if (typeof module !== "undefined" && module.exports) {
      module.exports = PomodoroCore;
    }
    if (typeof window !== "undefined") {
      window.PomodoroCore = PomodoroCore;
    }

    /* ---------- DOM wiring (browser only) ---------- */
    (function bootstrap() {
      if (typeof document === "undefined") return;

      const $ = (id) => document.getElementById(id);
      const display = $("display");
      const statusEl = $("status");
      const startPauseBtn = $("startPause");
      const resetBtn = $("reset");
      const minutesInput = $("minutes");
      const applyBtn = $("apply");

      let minutes = PomodoroCore.parseMinutes(minutesInput.value) || 25;
      minutesInput.value = String(minutes);

      let timer = null;
      let finished = false;

      function beep() {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return false;
          const ctx = new Ctx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(ctx.destination);
          const t = ctx.currentTime;
          osc.start(t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
          osc.stop(t + 0.65);
          osc.onended = () => {
            try { ctx.close(); } catch (_) { /* ignore */ }
          };
          return true;
        } catch (_) {
          return false;
        }
      }

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      }

      function render(remaining) {
        display.textContent = PomodoroCore.format(remaining);
      }

      function createTimer() {
        if (timer) timer.destroy();
        finished = false;
        timer = PomodoroCore.create(minutes, {
          onTick: (remaining) => {
            render(remaining);
          },
          onDone: () => {
            finished = true;
            setStatus("时间到", "done");
            startPauseBtn.textContent = "开始";
            startPauseBtn.disabled = true;
            minutesInput.disabled = false;
            applyBtn.disabled = false;
            beep();
          },
        });
        render(timer.remaining);
      }

      function setConfigEnabled(enabled) {
        minutesInput.disabled = !enabled;
        applyBtn.disabled = !enabled;
      }

      startPauseBtn.addEventListener("click", () => {
        if (!timer || finished) return;
        if (timer.running) {
          timer.pause();
          startPauseBtn.textContent = "开始";
          setStatus("已暂停", "paused");
          setConfigEnabled(true);
        } else {
          const started = timer.start();
          if (started) {
            startPauseBtn.textContent = "暂停";
            setStatus("进行中", "running");
            setConfigEnabled(false);
          }
        }
      });

      resetBtn.addEventListener("click", () => {
        createTimer();
        startPauseBtn.textContent = "开始";
        startPauseBtn.disabled = false;
        setStatus("就绪", "");
        setConfigEnabled(true);
      });

      applyBtn.addEventListener("click", () => {
        const parsed = PomodoroCore.parseMinutes(minutesInput.value);
        if (parsed === null) {
          setStatus("请输入 1–60 的正整数", "paused");
          minutesInput.value = String(minutes);
          return;
        }
        minutes = parsed;
        createTimer();
        startPauseBtn.textContent = "开始";
        startPauseBtn.disabled = false;
        setStatus("就绪 · 已设为 " + minutes + " 分钟", "");
        setConfigEnabled(true);
      });

      minutesInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applyBtn.click();
      });

      createTimer();
    })();
  </script>
</body>
</html>
