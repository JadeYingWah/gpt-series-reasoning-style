<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>番茄钟</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #5b8def;
      --ok: #3dd68c;
      --warn: #f5a524;
      --done: #f07178;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.25rem, 12vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      margin: 16px 0 12px;
    }
    #status {
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 1.4em;
      margin-bottom: 28px;
    }
    #status.done { color: var(--done); font-weight: 600; }
    #status.running { color: var(--ok); }
    #status.paused { color: var(--warn); }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      border: 1px solid var(--border);
      background: #232833;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      min-width: 88px;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .config {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .config input {
      width: 72px;
      font: inherit;
      text-align: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
    }
    .config input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }
    .hint {
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>番茄钟</h1>
    <div id="display" aria-live="polite">25:00</div>
    <div id="status">就绪</div>
    <div class="controls">
      <button type="button" id="btnStart" class="primary">开始</button>
      <button type="button" id="btnPause">暂停</button>
      <button type="button" id="btnReset">重置</button>
    </div>
    <div class="config">
      <label for="minutes">时长（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" value="25" inputmode="numeric">
      <button type="button" id="btnApply">应用</button>
    </div>
    <p class="hint">范围 1–60 的正整数；应用后重置为该时长</p>
  </main>
  <script>
  (function () {
    'use strict';

    var MIN_MINUTES = 1;
    var MAX_MINUTES = 60;
    var DEFAULT_MINUTES = 25;
    var TICK_MS = 200;

    var display = document.getElementById('display');
    var statusEl = document.getElementById('status');
    var btnStart = document.getElementById('btnStart');
    var btnPause = document.getElementById('btnPause');
    var btnReset = document.getElementById('btnReset');
    var minutesInput = document.getElementById('minutes');
    var btnApply = document.getElementById('btnApply');

    var totalMs = DEFAULT_MINUTES * 60 * 1000;
    var remainingMs = totalMs;
    var running = false;
    var finished = false;
    var timerId = null;
    var endAt = 0;
    var audioCtx = null;

    function pad(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function formatMs(ms) {
      if (ms < 0) ms = 0;
      var totalSec = Math.ceil(ms / 1000);
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return pad(m) + ':' + pad(s);
    }

    function parseMinutes(raw) {
      raw = String(raw).trim();
      if (!/^\d+$/.test(raw)) return { ok: false, reason: 'not positive integer' };
      var n = parseInt(raw, 10);
      if (n < MIN_MINUTES || n > MAX_MINUTES) {
        return { ok: false, reason: 'out of range ' + MIN_MINUTES + '-' + MAX_MINUTES };
      }
      return { ok: true, n: n };
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function stopTicker() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function updateButtons() {
      btnStart.disabled = running || finished;
      btnPause.disabled = !running;
    }

    function render() {
      display.textContent = formatMs(remainingMs);
      updateButtons();
    }

    function beep() {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended' && audioCtx.resume) {
          audioCtx.resume();
        }
        var t0 = audioCtx.currentTime;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.5);
      } catch (e) {
        // beep optional
      }
    }

    function finish() {
      stopTicker();
      running = false;
      finished = true;
      remainingMs = 0;
      setStatus('时间到', 'done');
      render();
      beep();
    }

    function tick() {
      if (!running) return;
      remainingMs = endAt - Date.now();
      if (remainingMs <= 0) {
        remainingMs = 0;
        finish();
        return;
      }
      render();
    }

    function start() {
      if (running || finished) return;
      running = true;
      endAt = Date.now() + remainingMs;
      setStatus('进行中', 'running');
      render();
      stopTicker();
      timerId = setInterval(tick, TICK_MS);
    }

    function pause() {
      if (!running) return;
      remainingMs = endAt - Date.now();
      if (remainingMs < 0) remainingMs = 0;
      running = false;
      stopTicker();
      if (remainingMs <= 0) {
        finish();
        return;
      }
      setStatus('已暂停', 'paused');
      render();
    }

    function reset() {
      stopTicker();
      running = false;
      finished = false;
      remainingMs = totalMs;
      endAt = 0;
      setStatus('就绪', '');
      render();
    }

    function applyDuration() {
      var parsed = parseMinutes(minutesInput.value);
      if (!parsed.ok) {
        minutesInput.value = String(Math.round(totalMs / 60000));
        setStatus('请输入 1–60 的正整数', 'paused');
        return;
      }
      totalMs = parsed.n * 60 * 1000;
      reset();
    }

    btnStart.addEventListener('click', start);
    btnPause.addEventListener('click', pause);
    btnReset.addEventListener('click', reset);
    btnApply.addEventListener('click', applyDuration);
    minutesInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') applyDuration();
    });

    minutesInput.value = String(DEFAULT_MINUTES);
    reset();

    window.PomodoroLite = {
      MIN_MINUTES: MIN_MINUTES,
      MAX_MINUTES: MAX_MINUTES,
      DEFAULT_MINUTES: DEFAULT_MINUTES,
      formatMs: formatMs,
      parseMinutes: parseMinutes,
      getState: function () {
        return {
          totalMs: totalMs,
          remainingMs: remainingMs,
          running: running,
          finished: finished,
          timerId: timerId,
          display: display.textContent,
          status: statusEl.textContent,
          statusClass: statusEl.className,
          startDisabled: btnStart.disabled,
          pauseDisabled: btnPause.disabled
        };
      }
    };
  })();
  </script>
</body>
</html>
