<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG009 · Dolphin Trolleybus</title>
<style>
  /* ===== tokens ===== */
  :root {
    --sky-deep: #0b1e3a;
    --sky-mid: #1a3a5c;
    --horizon: #e07a5f;
    --sea: #0e4d5c;
    --bus-teal: #2a9d8f;
    --bus-cream: #f4e4c1;
    --bus-dark: #1b6b63;
    --dolphin: #4a90a4;
    --dolphin-belly: #c5dde8;
    --dolphin-dark: #2f6a7c;
    --wire: #9aa8b5;
    --lamp: #f4d35e;
    --ink: #0a1628;
    --building-far: #152a45;
    --building-mid: #1e3d5c;
    --road: #1a2838;
    --road-line: #f4e4c1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-deep);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  svg#scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ===== HUD ===== */
  #hud {
    position: absolute;
    left: 16px;
    top: 14px;
    z-index: 10;
    color: var(--bus-cream);
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.55);
  }
  #hud .route {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  #hud .title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  /* ===== prefers-reduced-motion ===== */
  @media (prefers-reduced-motion: reduce) {
    .spin-wheel, .bob-bus, .flap-flipper, .pump-tail,
    .nod-head, .spout, .pole-sway, .lamp-pulse, .speed-line {
      animation: none !important;
    }
  }

  /* ===== core motion ===== */
  @keyframes spin-wheel {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes bob-bus {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(3.5px); }
  }
  @keyframes flap-flipper {
    0%, 100% { transform: rotate(8deg); }
    50%      { transform: rotate(-18deg); }
  }
  @keyframes pump-tail {
    0%, 100% { transform: rotate(-6deg) translateY(0); }
    50%      { transform: rotate(10deg) translateY(4px); }
  }
  @keyframes nod-head {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(3deg); }
  }
  @keyframes spout {
    0%       { opacity: 0; transform: scale(0.4) translateY(0); }
    15%      { opacity: 0.85; }
    70%      { opacity: 0.35; transform: scale(1.15) translateY(-10px); }
    100%     { opacity: 0; transform: scale(1.3) translateY(-16px); }
  }
  @keyframes pole-sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.5deg); }
  }
  @keyframes lamp-pulse {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }
  @keyframes speed-line {
    0%   { transform: translateX(0); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.35; }
    100% { transform: translateX(-420px); opacity: 0; }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 0.95; }
  }

  .spin-wheel { animation: spin-wheel 2.4s linear infinite; transform-origin: center; transform-box: fill-box; }
  .bob-bus    { animation: bob-bus 1.6s ease-in-out infinite; }
  .flap-flipper { animation: flap-flipper 1.1s ease-in-out infinite; transform-origin: 12% 30%; transform-box: fill-box; }
  .pump-tail  { animation: pump-tail 1.35s ease-in-out infinite; transform-origin: 85% 40%; transform-box: fill-box; }
  .nod-head   { animation: nod-head 2.1s ease-in-out infinite; transform-origin: 50% 80%; transform-box: fill-box; }
  .spout      { animation: spout 2.8s ease-out infinite; transform-origin: center bottom; transform-box: fill-box; }
  .pole-sway  { animation: pole-sway 1.6s ease-in-out infinite; transform-origin: bottom center; transform-box: fill-box; }
  .lamp-pulse { animation: lamp-pulse 2.2s ease-in-out infinite; }
  .speed-line { animation: speed-line 1.4s linear infinite; }
  .twinkle    { animation: twinkle 3s ease-in-out infinite; }
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="route">LINE 09 · HARBOR LOOP</div>
    <div class="title">Dolphin Trolleybus</div>
  </div>

  <!--
    SVG009-dolphin-trolleybus
    Motion consistency (see notes.md):
      - Forward = screen-right. World layers scroll left.
      - Wheels spin clockwise (rightward roll).
      - Dolphin appendages: flippers + tail + head have independent phases vs bus body bob.
      - Parallax layers: L0 sky(static) L1 far skyline L2 mid poles/buildings L3 road L4 foreground.
    No external resources.
  -->
  <svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img"
       aria-label="A dolphin driving a teal trolleybus to the right along a dusk harbor road">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#0b1e3a"/>
        <stop offset="45%" stop-color="#1a3a5c"/>
        <stop offset="78%" stop-color="#c45c48"/>
        <stop offset="100%" stop-color="#e07a5f"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a6a78"/>
        <stop offset="100%" stop-color="#0e4d5c"/>
      </linearGradient>
      <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3ec4b0"/>
        <stop offset="55%" stop-color="#2a9d8f"/>
        <stop offset="100%" stop-color="#1b6b63"/>
      </linearGradient>
      <linearGradient id="dolphinBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6aafc0"/>
        <stop offset="50%" stop-color="#4a90a4"/>
        <stop offset="100%" stop-color="#2f6a7c"/>
      </linearGradient>
      <linearGradient id="lampGlow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#f4d35e" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#f4d35e" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="moonGrad" cx="40%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#fff6d8"/>
        <stop offset="70%" stop-color="#f0e0a8"/>
        <stop offset="100%" stop-color="#d4c080"/>
      </radialGradient>
      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="busWindowClip">
        <rect x="0" y="0" width="210" height="70" rx="6"/>
      </clipPath>
    </defs>

    <!-- ========== L0 · SKY ========== -->
    <g id="layer-sky">
      <rect x="0" y="0" width="1280" height="520" fill="url(#skyGrad)"/>
      <!-- moon -->
      <circle cx="1080" cy="110" r="36" fill="url(#moonGrad)" filter="url(#softGlow)"/>
      <circle cx="1092" cy="100" r="30" fill="#0b1e3a" opacity="0.18"/>
      <!-- stars -->
      <g fill="#f4e4c1">
        <circle class="twinkle" cx="80"  cy="40"  r="1.4" style="animation-delay:0s"/>
        <circle class="twinkle" cx="180" cy="90"  r="1.1" style="animation-delay:0.6s"/>
        <circle class="twinkle" cx="320" cy="30"  r="1.6" style="animation-delay:1.2s"/>
        <circle class="twinkle" cx="460" cy="70"  r="1.0" style="animation-delay:0.3s"/>
        <circle class="twinkle" cx="620" cy="45"  r="1.3" style="animation-delay:1.8s"/>
        <circle class="twinkle" cx="760" cy="95"  r="1.1" style="animation-delay:0.9s"/>
        <circle class="twinkle" cx="900" cy="28"  r="1.5" style="animation-delay:2.1s"/>
        <circle class="twinkle" cx="1020" cy="55" r="1.0" style="animation-delay:1.5s"/>
        <circle class="twinkle" cx="1180" cy="40" r="1.2" style="animation-delay:0.4s"/>
        <circle class="twinkle" cx="250" cy="140" r="0.9" style="animation-delay:2.4s"/>
        <circle class="twinkle" cx="540" cy="120" r="1.1" style="animation-delay:1.1s"/>
        <circle class="twinkle" cx="850" cy="150" r="0.8" style="animation-delay:1.7s"/>
      </g>
    </g>

    <!-- ========== L1 · FAR SKYLINE (parallax 0.15) ========== -->
    <g id="layer-far" opacity="0.9">
      <g id="far-scroll">
        <!-- repeated skyline tile width=1280 -->
        <g fill="var(--building-far)">
          <rect x="0"   y="300" width="70"  height="220"/>
          <rect x="80"  y="260" width="50"  height="260"/>
          <rect x="140" y="320" width="90"  height="200"/>
          <rect x="240" y="240" width="40"  height="280"/>
          <rect x="290" y="290" width="75"  height="230"/>
          <rect x="380" y="210" width="55"  height="310"/>
          <rect x="450" y="270" width="100" height="250"/>
          <rect x="560" y="230" width="45"  height="290"/>
          <rect x="620" y="300" width="80"  height="220"/>
          <rect x="710" y="250" width="60"  height="270"/>
          <rect x="790" y="280" width="95"  height="240"/>
          <rect x="900" y="200" width="50"  height="320"/>
          <rect x="960" y="265" width="70"  height="255"/>
          <rect x="1040" y="235" width="85" height="285"/>
          <rect x="1140" y="290" width="55" height="230"/>
          <rect x="1210" y="250" width="70" height="270"/>
          <!-- windows -->
          <g fill="#f4d35e" opacity="0.35">
            <rect x="90"  y="280" width="6" height="8"/><rect x="102" y="280" width="6" height="8"/>
            <rect x="90"  y="300" width="6" height="8"/><rect x="110" y="320" width="6" height="8"/>
            <rect x="395" y="230" width="6" height="8"/><rect x="408" y="250" width="6" height="8"/>
            <rect x="915" y="220" width="6" height="8"/><rect x="928" y="250" width="6" height="8"/>
            <rect x="1055" y="255" width="6" height="8"/><rect x="1070" y="280" width="6" height="8"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ========== L2 · MID BUILDINGS + CATENARY POLES (parallax 0.40) ========== -->
    <g id="layer-mid">
      <g id="mid-scroll">
        <g fill="var(--building-mid)">
          <rect x="-20" y="360" width="120" height="160"/>
          <rect x="110" y="340" width="90"  height="180"/>
          <rect x="220" y="380" width="140" height="140"/>
          <rect x="380" y="350" width="80"  height="170"/>
          <rect x="480" y="370" width="110" height="150"/>
          <rect x="610" y="335" width="95"  height="185"/>
          <rect x="720" y="375" width="130" height="145"/>
          <rect x="870" y="345" width="85"  height="175"/>
          <rect x="970" y="365" width="120" height="155"/>
          <rect x="1110" y="340" width="100" height="180"/>
          <!-- lit windows -->
          <g fill="#f4d35e" opacity="0.45">
            <rect x="20"  y="380" width="10" height="12"/><rect x="40" y="400" width="10" height="12"/>
            <rect x="130" y="360" width="10" height="12"/><rect x="150" y="390" width="10" height="12"/>
            <rect x="250" y="400" width="10" height="12"/><rect x="280" y="420" width="10" height="12"/>
            <rect x="400" y="370" width="10" height="12"/><rect x="500" y="390" width="10" height="12"/>
            <rect x="630" y="355" width="10" height="12"/><rect x="650" y="385" width="10" height="12"/>
            <rect x="750" y="395" width="10" height="12"/><rect x="890" y="365" width="10" height="12"/>
            <rect x="990" y="385" width="10" height="12"/><rect x="1130" y="360" width="10" height="12"/>
          </g>
        </g>
        <!-- catenary poles every 320px -->
        <g stroke="var(--wire)" stroke-width="4" fill="none">
          <line x1="60"  y1="200" x2="60"  y2="520"/>
          <line x1="380" y1="200" x2="380" y2="520"/>
          <line x1="700" y1="200" x2="700" y2="520"/>
          <line x1="1020" y1="200" x2="1020" y2="520"/>
        </g>
        <g fill="var(--wire)">
          <rect x="30" y="195" width="60" height="8" rx="2"/>
          <rect x="350" y="195" width="60" height="8" rx="2"/>
          <rect x="670" y="195" width="60" height="8" rx="2"/>
          <rect x="990" y="195" width="60" height="8" rx="2"/>
        </g>
      </g>
      <!-- overhead contact wires (static relative to bus layer visually; long span) -->
      <line x1="0" y1="208" x2="1280" y2="208" stroke="var(--wire)" stroke-width="2.5"/>
      <line x1="0" y1="218" x2="1280" y2="218" stroke="var(--wire)" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- ========== L3 · SEA + ROAD ========== -->
    <g id="layer-road">
      <!-- sea strip behind seawall -->
      <rect x="0" y="480" width="1280" height="50" fill="url(#seaGrad)" opacity="0.85"/>
      <path d="M0 500 Q40 494 80 500 T160 500 T240 500 T320 500 T400 500 T480 500 T560 500 T640 500 T720 500 T800 500 T880 500 T960 500 T1040 500 T1120 500 T1200 500 T1280 500"
            fill="none" stroke="#3a9aaa" stroke-width="1.5" opacity="0.4"/>
      <!-- seawall -->
      <rect x="0" y="520" width="1280" height="18" fill="#2a3848"/>
      <rect x="0" y="528" width="1280" height="10" fill="#1a2838"/>
      <!-- road -->
      <rect x="0" y="538" width="1280" height="182" fill="var(--road)"/>
      <!-- center dashes scrolling via mid? keep in road scroll group -->
      <g id="road-scroll">
        <g stroke="var(--road-line)" stroke-width="4" stroke-dasharray="36 28" opacity="0.7">
          <line x1="0" y1="630" x2="1280" y2="630"/>
        </g>
        <g fill="#2a3848">
          <rect x="0" y="538" width="1280" height="6"/>
        </g>
      </g>
    </g>

    <!-- ========== TROLLEYBUS + DOLPHIN (bobbing group) ========== -->
    <!-- Z-order: poles → bus body → dolphin (driver) → glass → wheels -->
    <g id="bus-root" transform="translate(430, 360)">
      <g class="bob-bus">

        <!-- headlight cones -->
        <polygon class="lamp-pulse" points="330,118 520,90 520,150" fill="url(#lampGlow)"/>

        <!-- trolley poles (behind body) -->
        <g class="pole-sway" style="animation-delay:0s">
          <line x1="200" y1="18" x2="248" y2="-142" stroke="#6a7885" stroke-width="5" stroke-linecap="round"/>
          <circle cx="250" cy="-148" r="7" fill="#c0c8d0" stroke="#5a6875" stroke-width="2"/>
          <g filter="url(#softGlow)" opacity="0.85">
            <circle cx="250" cy="-152" r="3" fill="#f4d35e"/>
            <path d="M250 -158 L253 -150 L248 -152 Z" fill="#fff6d8"/>
          </g>
        </g>
        <g class="pole-sway" style="animation-delay:0.4s">
          <line x1="250" y1="18" x2="292" y2="-138" stroke="#6a7885" stroke-width="5" stroke-linecap="round"/>
          <circle cx="294" cy="-144" r="7" fill="#c0c8d0" stroke="#5a6875" stroke-width="2"/>
          <g filter="url(#softGlow)" opacity="0.85">
            <circle cx="294" cy="-148" r="3" fill="#f4d35e"/>
          </g>
        </g>

        <!-- ===== TROLLEYBUS BODY (solid first) ===== -->
        <rect x="0" y="40" width="340" height="110" rx="18" fill="url(#busBody)"
              stroke="#0f4a44" stroke-width="2.5"/>
        <rect x="8" y="36" width="324" height="16" rx="6" fill="var(--bus-cream)"/>
        <rect x="0" y="128" width="340" height="22" rx="6" fill="var(--bus-dark)"/>
        <rect x="10" y="100" width="320" height="8" fill="var(--bus-cream)" opacity="0.55"/>

        <!-- destination sign (rear) -->
        <rect x="14" y="48" width="128" height="28" rx="4" fill="#0a1628"/>
        <text x="78" y="68" text-anchor="middle" fill="#f4d35e"
              font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700"
              letter-spacing="1.5">09 HARBOR</text>

        <!-- window openings (darker recess so dolphin reads inside) -->
        <rect x="55" y="56" width="70" height="52" rx="5" fill="#0d3d3a"/>
        <rect x="140" y="56" width="48" height="52" rx="5" fill="#0d3d3a"/>
        <!-- large driver bay: side + windshield open to the front -->
        <path d="M200 50 L328 56 Q338 58 338 72 L338 122 Q338 130 328 130 L200 130 Q194 130 194 122 L194 58 Q194 50 200 50 Z"
              fill="#0d3d3a"/>

        <!-- door -->
        <rect x="140" y="70" width="36" height="70" rx="3" fill="#1a8a7e"
              stroke="#0f4a44" stroke-width="1.5" opacity="0.95"/>
        <line x1="158" y1="72" x2="158" y2="138" stroke="#0f4a44" stroke-width="1.2"/>

        <!-- ===== DOLPHIN DRIVER (front cabin, independent limbs) ===== -->
        <!-- Side-profile dolphin facing RIGHT; head at windshield, flukes rearward -->
        <g id="dolphin" transform="translate(220, 48) scale(0.86)">
          <!-- rear tail stock + horizontal flukes (pumps) -->
          <g class="pump-tail">
            <path d="M-5 50 L-28 46" fill="none" stroke="var(--dolphin-dark)" stroke-width="10" stroke-linecap="round"/>
            <path d="M-28 46 Q-55 28 -68 22 Q-52 42 -58 58 Q-48 50 -28 50 Z"
                  fill="var(--dolphin)" stroke="var(--dolphin-dark)" stroke-width="1.5"/>
            <path d="M-28 50 Q-50 62 -64 74 Q-46 60 -30 54 Z"
                  fill="var(--dolphin-dark)" opacity="0.9"/>
          </g>
          <!-- fusiform body -->
          <path d="M-8 48
                   Q0 28 28 26
                   Q60 24 88 36
                   Q110 42 122 48
                   Q110 54 88 60
                   Q60 68 28 66
                   Q0 64 -8 48 Z"
                fill="url(#dolphinBody)" stroke="var(--dolphin-dark)" stroke-width="1.6"/>
          <!-- pale belly -->
          <path d="M5 56 Q30 66 70 62 Q100 58 118 50 Q100 62 70 66 Q30 70 5 56 Z"
                fill="var(--dolphin-belly)" opacity="0.95"/>
          <!-- falcate dorsal fin -->
          <path d="M28 28 Q40 4 58 18 Q48 26 32 30 Z"
                fill="var(--dolphin)" stroke="var(--dolphin-dark)" stroke-width="1.3"/>
          <!-- head cluster (nods) -->
          <g class="nod-head">
            <!-- melon -->
            <path d="M72 34 Q95 30 108 40 Q98 48 78 48 Q68 42 72 34 Z"
                  fill="url(#dolphinBody)" stroke="var(--dolphin-dark)" stroke-width="1.3"/>
            <!-- long beak / rostrum -->
            <path d="M100 40 Q128 38 148 46 Q128 52 100 50 Z"
                  fill="var(--dolphin)" stroke="var(--dolphin-dark)" stroke-width="1.3"/>
            <!-- mouth line -->
            <path d="M108 50 Q128 54 146 48" fill="none" stroke="var(--dolphin-dark)" stroke-width="1.5" stroke-linecap="round"/>
            <!-- eye -->
            <ellipse cx="96" cy="40" rx="5" ry="5.5" fill="#0a1628"/>
            <circle cx="97.5" cy="38.2" r="1.7" fill="#fff"/>
            <!-- blowhole -->
            <ellipse cx="82" cy="30" rx="4" ry="2.4" fill="var(--dolphin-dark)"/>
            <!-- spout -->
            <g class="spout">
              <path d="M82 28 Q78 12 74 2 Q82 12 83 4 Q86 12 90 2 Q86 12 82 28 Z"
                    fill="#c5dde8" opacity="0.75"/>
              <circle cx="74" cy="0" r="2.2" fill="#e8f4fa" opacity="0.65"/>
              <circle cx="90" cy="-2" r="1.6" fill="#e8f4fa" opacity="0.55"/>
            </g>
          </g>
          <!-- near pectoral flipper (steering) -->
          <g class="flap-flipper">
            <path d="M48 58 Q42 82 28 96 Q46 80 58 64 Z"
                  fill="var(--dolphin)" stroke="var(--dolphin-dark)" stroke-width="1.3"/>
          </g>
          <!-- far pectoral flipper -->
          <g class="flap-flipper" style="animation-delay:0.28s; opacity:0.65">
            <path d="M60 56 Q70 74 82 86 Q68 72 56 60 Z"
                  fill="var(--dolphin-dark)"/>
          </g>
          <!-- driver cap -->
          <path d="M70 24 Q86 10 104 22 L100 30 Q86 16 72 32 Z" fill="#e07a5f" stroke="#b85a40" stroke-width="1"/>
          <circle cx="104" cy="22" r="3.2" fill="#f4d35e"/>
        </g>

        <!-- steering wheel under near flipper -->
        <g transform="translate(268, 108)">
          <ellipse rx="16" ry="6" fill="none" stroke="#c0c8d0" stroke-width="3" opacity="0.75"/>
          <line x1="-16" y1="0" x2="16" y2="0" stroke="#c0c8d0" stroke-width="2" opacity="0.6"/>
        </g>

        <!-- ===== GLASS OVERLAY (on top of dolphin) ===== -->
        <rect x="55" y="56" width="70" height="52" rx="5" fill="#7ec8d4" opacity="0.16"
              stroke="#0f4a44" stroke-width="1.5"/>
        <rect x="140" y="56" width="48" height="52" rx="5" fill="#7ec8d4" opacity="0.14"
              stroke="#0f4a44" stroke-width="1.5"/>
        <path d="M200 50 L328 56 Q338 58 338 72 L338 122 Q338 130 328 130 L200 130 Q194 130 194 122 L194 58 Q194 50 200 50 Z"
              fill="#7ec8d4" opacity="0.18" stroke="#0f4a44" stroke-width="1.5"/>
        <!-- windshield glare -->
        <path d="M210 58 L280 64 L268 100 L210 94 Z" fill="#ffffff" opacity="0.07"/>

        <!-- headlights -->
        <circle class="lamp-pulse" cx="328" cy="100" r="8" fill="#f4d35e" filter="url(#softGlow)"/>
        <circle class="lamp-pulse" cx="328" cy="122" r="5" fill="#f4d35e" opacity="0.8"/>
        <circle cx="6" cy="118" r="4" fill="#e07a5f" opacity="0.85"/>

        <!-- wheel arches -->
        <path d="M55 140 Q90 118 125 140" fill="none" stroke="#0f4a44" stroke-width="3"/>
        <path d="M220 140 Q255 118 290 140" fill="none" stroke="#0f4a44" stroke-width="3"/>

        <!-- ===== WHEELS (clockwise for rightward motion) ===== -->
        <!-- rear wheel -->
        <g transform="translate(90, 148)">
          <circle r="28" fill="#1a2838" stroke="#0a1628" stroke-width="3"/>
          <g class="spin-wheel">
            <circle r="16" fill="none" stroke="#9aa8b5" stroke-width="3"/>
            <line x1="-16" y1="0" x2="16" y2="0" stroke="#9aa8b5" stroke-width="3"/>
            <line x1="0" y1="-16" x2="0" y2="16" stroke="#9aa8b5" stroke-width="3"/>
            <circle r="5" fill="#c0c8d0"/>
          </g>
        </g>
        <!-- front wheel -->
        <g transform="translate(255, 148)">
          <circle r="28" fill="#1a2838" stroke="#0a1628" stroke-width="3"/>
          <g class="spin-wheel" style="animation-delay:0.15s">
            <circle r="16" fill="none" stroke="#9aa8b5" stroke-width="3"/>
            <line x1="-16" y1="0" x2="16" y2="0" stroke="#9aa8b5" stroke-width="3"/>
            <line x1="0" y1="-16" x2="0" y2="16" stroke="#9aa8b5" stroke-width="3"/>
            <circle r="5" fill="#c0c8d0"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ========== L4 · FOREGROUND (parallax 1.55) ========== -->
    <g id="layer-fg">
      <g id="fg-scroll" opacity="0.22">
        <g stroke="#0a1628" stroke-width="5" stroke-linecap="round">
          <line x1="40" y1="180" x2="40" y2="720"/>
          <line x1="280" y1="160" x2="280" y2="720"/>
          <line x1="520" y1="190" x2="520" y2="720"/>
          <line x1="760" y1="170" x2="760" y2="720"/>
          <line x1="1000" y1="185" x2="1000" y2="720"/>
          <line x1="1240" y1="165" x2="1240" y2="720"/>
        </g>
      </g>
      <!-- speed streaks -->
      <g id="speed-lines" fill="none" stroke="#c5dde8" stroke-width="1.5" stroke-linecap="round">
        <line class="speed-line" x1="1400" y1="300" x2="1280" y2="300" style="animation-delay:0s"/>
        <line class="speed-line" x1="1400" y1="360" x2="1260" y2="360" style="animation-delay:0.35s"/>
        <line class="speed-line" x1="1400" y1="420" x2="1290" y2="420" style="animation-delay:0.7s"/>
        <line class="speed-line" x1="1400" y1="480" x2="1270" y2="480" style="animation-delay:1.05s"/>
      </g>
    </g>
  </svg>
</div>

<script>
(function () {
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) {
    // static pose: stop JS parallax too
    return;
  }

  // Scroll offsets (world moves left => bus appears to go right)
  var farX = 0, midX = 0, roadX = 0, fgX = 0;
  var last = performance.now();

  // px per second at reference viewport width 1280
  var BASE_SPEED = 90;
  var SPEED_FAR = 0.15;
  var SPEED_MID = 0.40;
  var SPEED_ROAD = 1.00;
  var SPEED_FG  = 1.55;

  var farEl  = document.getElementById("far-scroll");
  var midEl  = document.getElementById("mid-scroll");
  var roadEl = document.getElementById("road-scroll");
  var fgEl   = document.getElementById("fg-scroll");

  var NS = "http://www.w3.org/2000/svg";
  var TILE = 1280;

  // Seamless loop: clone current children once, offset by TILE
  function duplicateTile(el) {
    if (!el) return;
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + TILE + ",0)");
    var kids = Array.prototype.slice.call(el.childNodes);
    for (var i = 0; i < kids.length; i++) {
      g.appendChild(kids[i].cloneNode(true));
    }
    el.appendChild(g);
  }
  duplicateTile(farEl);
  duplicateTile(midEl);
  duplicateTile(roadEl);
  duplicateTile(fgEl);

  function tileWidth() { return TILE; }

  function wrap(v, w) {
    // keep value in (-w, 0]
    while (v <= -w) v += w;
    while (v > 0) v -= w;
    return v;
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    var w = tileWidth();
    farX  = wrap(farX  - BASE_SPEED * SPEED_FAR  * dt, w);
    midX  = wrap(midX  - BASE_SPEED * SPEED_MID  * dt, w);
    roadX = wrap(roadX - BASE_SPEED * SPEED_ROAD * dt, w);
    fgX   = wrap(fgX   - BASE_SPEED * SPEED_FG   * dt, w);

    if (farEl)  farEl.setAttribute("transform",  "translate(" + farX.toFixed(2) + ",0)");
    if (midEl)  midEl.setAttribute("transform",  "translate(" + midX.toFixed(2) + ",0)");
    if (roadEl) roadEl.setAttribute("transform", "translate(" + roadX.toFixed(2) + ",0)");
    if (fgEl)   fgEl.setAttribute("transform",   "translate(" + fgX.toFixed(2) + ",0)");

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
