<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Octopus Excavator · SVG001</title>
<!--
  SVG001-octopus-excavator — self-contained scene notes
  Forward direction: +X (画面右侧)
  Track/crawler animation: dashoffset decreasing → belt surface moves rightward relative to chassis, consistent with vehicle advancing right.
  Drive sprocket / idler wheels: CSS rotate + (clockwise) when moving right.
  Octopus relative motion (not locked to chassis):
    (1) arm-ctrl-L / arm-ctrl-R — tentacles gripping joysticks, independent lag/phase
    (2) arm-hang / arm-wave — free tentacles outside cab, different period & amplitude
    (3) head bob + eye blink — micro motion vs vehicle bob
    (4) boom/bucket dig cycle — machine limb separate from body
  Parallax layers (far → near):
    L0 sky gradient + stars, L1 far hills, L2 mid industrial skyline, L3 ground + tracks contact
  No external resources. All CSS/JS/SVG inline.
-->
<style>
  :root {
    --sky-top: #0b1d36;
    --sky-mid: #163a5f;
    --sky-bot: #1f5f7a;
    --hill-far: #0e2a45;
    --hill-mid: #143d5c;
    --city: #0a2238;
    --ground: #1a1410;
    --ground-line: #3d2e22;
    --hazard: #ffc857;
    --body-orange: #e87a2a;
    --body-dark: #b85518;
    --body-light: #f4a54a;
    --cabin-glass: #7ec8e8;
    --octo-skin: #d94d7a;
    --octo-dark: #a32d55;
    --octo-light: #f07a9a;
    --accent-cyan: #3de0ff;
    --accent-amber: #ffc857;
    --dust: #c4a574;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050b14;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  svg#scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- TRACK / CRAWLER ---------- */
  .track-belt {
    fill: none;
    stroke: #2a2a2a;
    stroke-width: 14;
    stroke-linecap: butt;
  }
  .track-tread {
    fill: none;
    stroke: #4a4a4a;
    stroke-width: 10;
    stroke-dasharray: 8 6;
    animation: tread-scroll 0.55s linear infinite;
  }
  @keyframes tread-scroll {
    to { stroke-dashoffset: -14; }
  }
  .track-tread-inner {
    fill: none;
    stroke: #1a1a1a;
    stroke-width: 4;
    stroke-dasharray: 3 5;
    animation: tread-scroll-slow 0.55s linear infinite;
  }
  @keyframes tread-scroll-slow {
    to { stroke-dashoffset: -8; }
  }

  /* wheels rotate clockwise for rightward motion */
  .wheel-spin {
    animation: wheel-cw 1.1s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes wheel-cw {
    to { transform: rotate(360deg); }
  }

  /* ---------- VEHICLE BOB ---------- */
  .vehicle-bob {
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ---------- BOOM / BUCKET DIG CYCLE ---------- */
  .boom-group {
    animation: boom-dig 3.6s ease-in-out infinite;
    transform-origin: 520px 310px;
    transform-box: view-box;
  }
  @keyframes boom-dig {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-18deg); }
    50%  { transform: rotate(8deg); }
    75%  { transform: rotate(-6deg); }
    100% { transform: rotate(0deg); }
  }
  .stick-group {
    animation: stick-curl 3.6s ease-in-out infinite;
    transform-origin: 700px 200px;
    transform-box: view-box;
  }
  @keyframes stick-curl {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(25deg); }
    55%  { transform: rotate(-10deg); }
    100% { transform: rotate(0deg); }
  }
  .bucket-group {
    animation: bucket-curl 3.6s ease-in-out infinite;
    transform-origin: 820px 280px;
    transform-box: view-box;
  }
  @keyframes bucket-curl {
    0%   { transform: rotate(0deg); }
    35%  { transform: rotate(40deg); }
    60%  { transform: rotate(-15deg); }
    100% { transform: rotate(0deg); }
  }

  /* ---------- OCTOPUS LIMBS (independent of chassis) ---------- */
  .arm-ctrl-L {
    animation: arm-ctrl-l 1.3s ease-in-out infinite;
    transform-origin: 430px 250px;
    transform-box: view-box;
  }
  @keyframes arm-ctrl-l {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    40% { transform: rotate(-8deg) translateY(2px); }
    70% { transform: rotate(4deg) translateY(-1px); }
  }
  .arm-ctrl-R {
    animation: arm-ctrl-r 1.55s ease-in-out infinite;
    transform-origin: 470px 250px;
    transform-box: view-box;
  }
  @keyframes arm-ctrl-r {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(10deg); }
    65% { transform: rotate(-5deg); }
  }
  .arm-hang {
    animation: arm-hang 2.1s ease-in-out infinite;
    transform-origin: 410px 270px;
    transform-box: view-box;
  }
  @keyframes arm-hang {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(14deg); }
  }
  .arm-wave {
    animation: arm-wave 1.7s ease-in-out infinite;
    transform-origin: 490px 265px;
    transform-box: view-box;
  }
  @keyframes arm-wave {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    30% { transform: rotate(-18deg) scaleY(1.05); }
    60% { transform: rotate(8deg) scaleY(0.97); }
  }
  .arm-tuck {
    animation: arm-tuck 2.8s ease-in-out infinite;
    transform-origin: 445px 280px;
    transform-box: view-box;
  }
  @keyframes arm-tuck {
    0%, 100% { transform: rotate(0deg); }
    45% { transform: rotate(-6deg); }
  }

  .octo-head {
    animation: head-bob 1.8s ease-in-out infinite;
    transform-origin: 450px 230px;
    transform-box: view-box;
  }
  @keyframes head-bob {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(1px, -3px); }
  }

  .eye-lid {
    animation: blink 4.2s ease-in-out infinite;
  }
  .eye-lid-b {
    animation: blink 4.2s ease-in-out infinite;
    animation-delay: 0.08s;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    95%, 97% { transform: scaleY(1); }
  }

  /* ---------- PARALLAX DRIFT (CSS + JS hybrid) ---------- */
  .layer-far  { animation: drift-far 80s linear infinite; }
  .layer-mid  { animation: drift-mid 40s linear infinite; }
  .layer-near { animation: drift-near 18s linear infinite; }
  @keyframes drift-far  { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  @keyframes drift-mid  { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  @keyframes drift-near { from { transform: translateX(0); } to { transform: translateX(-200px); } }

  /* dust puffs */
  .dust {
    animation: dust-rise 2.2s ease-out infinite;
    opacity: 0;
  }
  .dust:nth-child(1) { animation-delay: 0s; }
  .dust:nth-child(2) { animation-delay: 0.4s; }
  .dust:nth-child(3) { animation-delay: 0.8s; }
  .dust:nth-child(4) { animation-delay: 1.2s; }
  .dust:nth-child(5) { animation-delay: 1.6s; }
  @keyframes dust-rise {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.6); }
    100% { opacity: 0;    transform: translate(-40px,-28px) scale(1.6); }
  }

  /* exhaust / bubbles */
  .bubble {
    animation: bubble-up 3s ease-in infinite;
    opacity: 0;
  }
  @keyframes bubble-up {
    0%   { opacity: 0.7; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0;   transform: translate(10px,-50px) scale(1.3); }
  }

  /* warning light */
  .warn-lamp {
    animation: lamp-flash 0.9s steps(1) infinite;
  }
  @keyframes lamp-flash {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.15; }
  }

  /* ground scroll to reinforce forward motion */
  .ground-marks {
    animation: ground-scroll 1.1s linear infinite;
  }
  @keyframes ground-scroll {
    to { transform: translateX(-60px); }
  }

  .hud {
    position: absolute;
    left: 16px;
    top: 14px;
    color: #9fd7ef;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(61, 224, 255, 0.4);
  }
  .hud strong { color: var(--accent-cyan); font-weight: 600; }

  .title-chip {
    position: absolute;
    right: 18px;
    bottom: 16px;
    color: #ffc857;
    font-size: 11px;
    letter-spacing: 0.14em;
    opacity: 0.7;
    pointer-events: none;
  }
</style>

<script>
(function () {
  "use strict";

  // Optional: slight JS-enhanced parallax on pointer for depth feel.
  // Pure enhancement; scene already animates via CSS alone.
  var svg = document.getElementById("scene");
  if (!svg) return;

  var far = svg.querySelectorAll(".layer-far");
  var mid = svg.querySelectorAll(".layer-mid");
  var near = svg.querySelectorAll(".layer-near");

  var mx = 0, my = 0, tx = 0, ty = 0;

  function onMove(e) {
    var r = svg.getBoundingClientRect();
    mx = ((e.clientX - r.left) / r.width - 0.5) * 2;
    my = ((e.clientY - r.top) / r.height - 0.5) * 2;
  }

  window.addEventListener("mousemove", onMove, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches[0]) onMove(e.touches[0]);
  }, { passive: true });

  function tick() {
    tx += (mx - tx) * 0.06;
    ty += (my - ty) * 0.06;

    // Offset multipliers: farther layers move less
    var fX = tx * -6, fY = ty * -3;
    var mX = tx * -14, mY = ty * -6;
    var nX = tx * -28, nY = ty * -10;

    far.forEach(function (el) { el.style.translate = fX + "px " + fY + "px"; });
    mid.forEach(function (el) { el.style.translate = mX + "px " + mY + "px"; });
    near.forEach(function (el) { el.style.translate = nX + "px " + nY + "px"; });

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Self-check in console (for response.md evidence)
  var checks = {
    svg: !!document.getElementById("scene"),
    octopus: !!document.getElementById("octopus"),
    excavator: !!document.getElementById("excavator"),
    tracks: !!document.getElementById("tracks"),
    boom: !!document.getElementById("boom"),
    animatedArms: document.querySelectorAll(".arm-ctrl-L,.arm-ctrl-R,.arm-hang,.arm-wave,.arm-tuck").length,
    parallaxLayers: document.querySelectorAll(".layer-far,.layer-mid,.layer-near").length,
    externalScripts: document.querySelectorAll("script[src]").length,
    externalLinks: document.querySelectorAll("link[href]").length,
    externalImages: document.querySelectorAll("image[href],img[src]").length
  };
  console.info("[SVG001 self-check]", checks);
  window.__SVG001_CHECKS__ = checks;
})();
</script>
