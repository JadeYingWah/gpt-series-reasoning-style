<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seahorse Cableway · 海马索道</title>
<style>
  :root {
    --sky-top: #0b1d36;
    --sky-mid: #1a4a6e;
    --sky-low: #2f7fa8;
    --horizon: #f0a060;
    --cable: #c9a46a;
    --cabin: #8b3a3a;
    --cabin-deep: #5c2424;
    --gold: #e8c56a;
    --seahorse: #2ec4b6;
    --seahorse-dark: #1a8a80;
    --belly: #f6e7a8;
    --accent: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #061018;
    font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  svg#scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* vignette */
  #stage::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,8,16,0.55) 100%);
  }
  .hud {
    position: absolute;
    left: 16px; bottom: 14px;
    z-index: 5;
    color: rgba(240, 230, 200, 0.72);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    user-select: none;
  }
  .hud strong { color: var(--gold); font-weight: 600; }

  /* —— CSS limb animations (independent of cabin translation) —— */
  @keyframes finL {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(28deg); }
  }
  @keyframes finR {
    0%, 100% { transform: rotate(10deg); }
    50%      { transform: rotate(-22deg); }
  }
  @keyframes tailWave {
    0%   { transform: rotate(0deg) translateX(0); }
    25%  { transform: rotate(8deg) translateX(-2px); }
    50%  { transform: rotate(0deg) translateX(0); }
    75%  { transform: rotate(-10deg) translateX(2px); }
    100% { transform: rotate(0deg) translateX(0); }
  }
  @keyframes crownBob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-3px) rotate(6deg); }
  }
  @keyframes snoutPulse {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(1.06); }
  }
  @keyframes leverRock {
    0%, 100% { transform: rotate(-18deg); }
    50%      { transform: rotate(22deg); }
  }
  @keyframes wheelSpin {
    to { transform: rotate(360deg); }
  }
  @keyframes gripPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
  @keyframes lanternGlow {
    0%, 100% { opacity: 0.55; r: 14; }
    50%      { opacity: 1; r: 18; }
  }
  @keyframes bubbleRise {
    0%   { transform: translate(0, 0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.85; }
    100% { transform: translate(18px, -90px) scale(1.15); opacity: 0; }
  }

  .fin-left  { transform-box: fill-box; transform-origin: 85% 20%; animation: finL 1.1s ease-in-out infinite; }
  .fin-right { transform-box: fill-box; transform-origin: 10% 30%; animation: finR 0.95s ease-in-out infinite; }
  .tail      { transform-box: fill-box; transform-origin: 0% 30%;  animation: tailWave 1.6s ease-in-out infinite; }
  .crown     { transform-box: fill-box; transform-origin: 50% 100%; animation: crownBob 1.3s ease-in-out infinite; }
  .snout     { transform-box: fill-box; transform-origin: 0% 50%;   animation: snoutPulse 0.7s ease-in-out infinite; }
  .lever     { transform-box: fill-box; transform-origin: 50% 100%; animation: leverRock 0.85s ease-in-out infinite; }
  .grip-roller { transform-box: fill-box; transform-origin: 50% 50%; animation: wheelSpin 0.55s linear infinite; }
  .guide-wheel { transform-box: fill-box; transform-origin: 50% 50%; animation: wheelSpin 0.4s linear infinite; }
  .lantern-core { animation: gripPulse 1.4s ease-in-out infinite; }
  .bubble { transform-box: fill-box; transform-origin: 50% 100%; }
  .b1 { animation: bubbleRise 2.8s ease-out infinite; }
  .b2 { animation: bubbleRise 3.4s ease-out 0.7s infinite; }
  .b3 { animation: bubbleRise 3.1s ease-out 1.4s infinite; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="海马驾驶索道车厢朝右前进">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#071528"/>
        <stop offset="35%" stop-color="#123a5c"/>
        <stop offset="62%" stop-color="#2a6f96"/>
        <stop offset="82%" stop-color="#d4874a"/>
        <stop offset="100%" stop-color="#f0a060"/>
      </linearGradient>
      <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff2c8"/>
        <stop offset="100%" stop-color="#ff8a4a"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a6a7a"/>
        <stop offset="100%" stop-color="#0a2838"/>
      </linearGradient>
      <linearGradient id="cabinWood" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a84848"/>
        <stop offset="100%" stop-color="#5c2424"/>
      </linearGradient>
      <linearGradient id="cabinRoof" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e8c56a"/>
        <stop offset="100%" stop-color="#a07830"/>
      </linearGradient>
      <linearGradient id="shBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1a8a80"/>
        <stop offset="55%" stop-color="#2ec4b6"/>
        <stop offset="100%" stop-color="#5eead4"/>
      </linearGradient>
      <linearGradient id="poleGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6a5040"/>
        <stop offset="40%" stop-color="#8a6a52"/>
        <stop offset="100%" stop-color="#4a3428"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.9"/>
        <stop offset="55%" stop-color="#ff9a50" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ff9a50" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff1a8" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#ffb040" stop-opacity="0"/>
      </radialGradient>
      <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>
      <filter id="tinyBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2"/>
      </filter>
      <pattern id="cableTwist" width="18" height="4" patternUnits="userSpaceOnUse">
        <rect width="18" height="4" fill="#a88858"/>
        <rect width="6" height="4" fill="#6a5030" opacity="0.55"/>
      </pattern>
    </defs>

    <!-- ========== L0: sky ========== -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>

    <!-- sun (far) -->
    <g id="sun">
      <circle cx="1180" cy="520" r="140" fill="url(#sunGlow)"/>
      <circle cx="1180" cy="520" r="52" fill="url(#sunGrad)"/>
    </g>

    <!-- ========== L1: far mountains / clouds (slow parallax) ========== -->
    <g id="layer-far" opacity="0.55">
      <!-- distant ridge A -->
      <path fill="#1a3a58" d="M-200,560 L80,420 L220,480 L380,360 L520,440 L700,340 L860,430 L1040,350 L1200,420 L1400,340 L1700,480 L1700,900 L-200,900 Z"/>
      <!-- distant ridge B -->
      <path fill="#16324a" d="M-100,600 L140,480 L300,530 L480,440 L640,520 L820,430 L1000,510 L1180,450 L1380,520 L1700,460 L1700,900 L-100,900 Z"/>
      <!-- soft clouds -->
      <g fill="#7eb8d8" opacity="0.35">
        <ellipse cx="200" cy="180" rx="90" ry="22"/>
        <ellipse cx="250" cy="168" rx="50" ry="16"/>
        <ellipse cx="160" cy="172" rx="40" ry="12"/>
        <ellipse cx="900" cy="140" rx="110" ry="24"/>
        <ellipse cx="960" cy="128" rx="60" ry="16"/>
        <ellipse cx="1400" cy="200" rx="80" ry="18"/>
        <ellipse cx="1450" cy="190" rx="45" ry="12"/>
      </g>
      <!-- far cable ghost (very distant line suggestion) -->
      <path d="M-200,280 Q400,250 800,260 T1700,240" stroke="#4a6a80" stroke-width="2" fill="none" opacity="0.4"/>
    </g>

    <!-- ========== L2: mid hills + mid clouds ========== -->
    <g id="layer-mid" opacity="0.85">
      <path fill="#0e4a52" d="M-150,640 C100,540 250,580 400,520 C550,460 700,540 850,500 C1000,460 1150,530 1300,490 C1450,450 1600,520 1750,500 L1750,900 L-150,900 Z"/>
      <path fill="#0a3a42" d="M-100,700 C150,620 350,680 520,620 C700,560 880,660 1050,610 C1220,560 1400,640 1750,600 L1750,900 L-100,900 Z"/>
      <!-- mid cloud band -->
      <g fill="#9ecfe0" opacity="0.28">
        <ellipse cx="480" cy="220" rx="120" ry="28"/>
        <ellipse cx="540" cy="205" rx="70" ry="18"/>
        <ellipse cx="430" cy="210" rx="50" ry="14"/>
        <ellipse cx="1100" cy="260" rx="100" ry="22"/>
        <ellipse cx="1150" cy="250" rx="55" ry="14"/>
      </g>
    </g>

    <!-- ========== water / bottom gradient ========== -->
    <rect x="0" y="720" width="1600" height="180" fill="url(#seaGrad)" opacity="0.85"/>
    <!-- water sparkle lines -->
    <g id="sparkles" stroke="#7ee8e0" stroke-width="1" opacity="0.35" fill="none">
      <path d="M40,760 h60 M200,780 h40 M420,750 h80 M700,790 h50 M980,755 h70 M1280,775 h55 M1500,765 h60"/>
    </g>

    <!-- ========== L3: cable towers (mid-deep, also translate) ========== -->
    <g id="layer-towers">
      <!-- Tower 1 -->
      <g class="tower" transform="translate(180,0)">
        <rect x="-14" y="280" width="28" height="520" fill="url(#poleGrad)"/>
        <rect x="-22" y="280" width="44" height="14" rx="3" fill="#5a4030"/>
        <!-- cross arm -->
        <rect x="-70" y="300" width="140" height="12" rx="3" fill="#6a5040"/>
        <rect x="-50" y="270" width="10" height="40" fill="#7a5a48"/>
        <rect x="40" y="270" width="10" height="40" fill="#7a5a48"/>
        <!-- pulley wheels on tower -->
        <g transform="translate(-45, 312)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <g transform="translate(45, 312)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <!-- guy wires -->
        <line x1="-14" y1="400" x2="-80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <line x1="14" y1="400" x2="80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <!-- decorative lantern -->
        <circle cx="0" cy="250" r="10" fill="#e8c56a" class="lantern-core"/>
        <circle cx="0" cy="250" r="18" fill="url(#lampGlow)"/>
      </g>
      <!-- Tower 2 -->
      <g class="tower" transform="translate(780,0)">
        <rect x="-14" y="240" width="28" height="560" fill="url(#poleGrad)"/>
        <rect x="-22" y="240" width="44" height="14" rx="3" fill="#5a4030"/>
        <rect x="-70" y="260" width="140" height="12" rx="3" fill="#6a5040"/>
        <rect x="-50" y="230" width="10" height="40" fill="#7a5a48"/>
        <rect x="40" y="230" width="10" height="40" fill="#7a5a48"/>
        <g transform="translate(-45, 272)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <g transform="translate(45, 272)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <line x1="-14" y1="360" x2="-80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <line x1="14" y1="360" x2="80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <circle cx="0" cy="210" r="10" fill="#e8c56a" class="lantern-core"/>
        <circle cx="0" cy="210" r="18" fill="url(#lampGlow)"/>
      </g>
      <!-- Tower 3 -->
      <g class="tower" transform="translate(1380,0)">
        <rect x="-14" y="300" width="28" height="500" fill="url(#poleGrad)"/>
        <rect x="-22" y="300" width="44" height="14" rx="3" fill="#5a4030"/>
        <rect x="-70" y="320" width="140" height="12" rx="3" fill="#6a5040"/>
        <rect x="-50" y="290" width="10" height="40" fill="#7a5a48"/>
        <rect x="40" y="290" width="10" height="40" fill="#7a5a48"/>
        <g transform="translate(-45, 332)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <g transform="translate(45, 332)">
          <circle r="16" fill="#3a2a20" stroke="#c9a46a" stroke-width="3"/>
          <circle r="5" fill="#c9a46a"/>
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#c9a46a" stroke-width="2"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#c9a46a" stroke-width="2"/>
        </g>
        <line x1="-14" y1="420" x2="-80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <line x1="14" y1="420" x2="80" y2="800" stroke="#4a3830" stroke-width="2"/>
        <circle cx="0" cy="270" r="10" fill="#e8c56a" class="lantern-core"/>
        <circle cx="0" cy="270" r="18" fill="url(#lampGlow)"/>
      </g>
    </g>

    <!-- main cable (long, spans world; world scrolls) -->
    <g id="layer-cable">
      <path id="cablePath"
        d="M-400,318 Q200,300 400,310 Q700,320 900,305 Q1200,290 1600,300 Q2000,310 2400,295"
        fill="none" stroke="url(#cableTwist)" stroke-width="5" stroke-linecap="round"/>
      <path d="M-400,326 Q200,308 400,318 Q700,328 900,313 Q1200,298 1600,308 Q2000,318 2400,303"
        fill="none" stroke="#3a2a18" stroke-width="2" opacity="0.5"/>
      <!-- return cable (lower) -->
      <path d="M-400,520 Q400,530 900,515 T2400,525"
        fill="none" stroke="#6a5038" stroke-width="3" opacity="0.45"/>
    </g>

    <!-- ========== cabin + seahorse (main subject, moves right on cable) ========== -->
    <g id="cabin-rig">
      <!-- hanger arm from cable to cabin roof -->
      <g id="hanger">
        <!-- grip assembly on cable -->
        <g transform="translate(0, 302)">
          <rect x="-28" y="-10" width="56" height="18" rx="4" fill="#4a3830" stroke="#c9a46a" stroke-width="1.5"/>
          <!-- spinning grip rollers (forward motion = spin) -->
          <g transform="translate(-16, 0)">
            <g class="grip-roller">
              <circle r="11" fill="#2a2018" stroke="#e8c56a" stroke-width="2.5"/>
              <line x1="-7" y1="0" x2="7" y2="0" stroke="#e8c56a" stroke-width="2"/>
              <line x1="0" y1="-7" x2="0" y2="7" stroke="#e8c56a" stroke-width="2"/>
            </g>
          </g>
          <g transform="translate(16, 0)">
            <g class="grip-roller">
              <circle r="11" fill="#2a2018" stroke="#e8c56a" stroke-width="2.5"/>
              <line x1="-7" y1="0" x2="7" y2="0" stroke="#e8c56a" stroke-width="2"/>
              <line x1="0" y1="-7" x2="0" y2="7" stroke="#e8c56a" stroke-width="2"/>
            </g>
          </g>
        </g>
        <!-- vertical hanger -->
        <rect x="-6" y="310" width="12" height="90" fill="#5a4838"/>
        <rect x="-14" y="310" width="28" height="8" rx="2" fill="#c9a46a"/>
        <!-- swivel -->
        <circle cx="0" cy="400" r="8" fill="#e8c56a" stroke="#6a5030" stroke-width="2"/>
      </g>

      <!-- cabin body (local origin ~ cable grip) -->
      <g id="cabin" transform="translate(0, 400)">
        <!-- roof -->
        <path d="M-95,0 Q0,-38 95,0 L85,12 Q0,-18 -85,12 Z" fill="url(#cabinRoof)" stroke="#6a5030" stroke-width="2"/>
        <!-- roof fin / prow ornament facing RIGHT -->
        <path d="M85,-8 Q120,-22 138,-4 Q118,4 88,2 Z" fill="#e8c56a" stroke="#a07830" stroke-width="1.5"/>
        <circle cx="132" cy="-6" r="5" fill="#ff6b6b"/>

        <!-- cabin shell -->
        <path d="M-90,8
                 L-90,120
                 Q-90,145 -60,148
                 L60,148
                 Q90,145 90,120
                 L90,8
                 Q0,-12 -90,8 Z"
              fill="url(#cabinWood)" stroke="#3a1818" stroke-width="3"/>
        <!-- side panel highlight -->
        <path d="M-75,20 L-75,125 Q-75,138 -55,140 L-40,140 L-40,20 Q0,4 -40,20 Z"
              fill="#c45a5a" opacity="0.35"/>
        <!-- front (right) windshield -->
        <path d="M40,22 L82,22 Q86,22 86,28 L86,110 Q86,116 82,116 L40,116 Q36,116 36,110 L36,28 Q36,22 40,22 Z"
              fill="#1a4a5a" stroke="#c9a46a" stroke-width="2.5" opacity="0.9"/>
        <!-- side window -->
        <path d="M-68,30 L20,30 Q24,30 24,36 L24,100 Q24,106 20,106 L-68,106 Q-72,106 -72,100 L-72,36 Q-72,30 -68,30 Z"
              fill="#2a6a7a" stroke="#c9a46a" stroke-width="2.5"/>
        <!-- window mullion -->
        <line x1="-24" y1="30" x2="-24" y2="106" stroke="#c9a46a" stroke-width="2"/>
        <!-- window reflection -->
        <path d="M-60,38 L-40,38 L-20,98 L-40,98 Z" fill="#9ee8f0" opacity="0.18"/>

        <!-- door seam (facing viewer) -->
        <line x1="20" y1="20" x2="20" y2="140" stroke="#3a1818" stroke-width="2" opacity="0.5"/>

        <!-- headlamp facing RIGHT (direction of travel) -->
        <g transform="translate(90, 70)">
          <rect x="-4" y="-10" width="18" height="20" rx="3" fill="#e8c56a" stroke="#6a5030" stroke-width="1.5"/>
          <ellipse cx="18" cy="0" rx="10" ry="12" fill="#fff1a8" opacity="0.85"/>
          <ellipse cx="22" cy="0" rx="28" ry="20" fill="url(#lampGlow)" opacity="0.7"/>
        </g>

        <!-- rear lantern (red, left side) -->
        <circle cx="-90" cy="50" r="8" fill="#ff4444" opacity="0.9"/>
        <circle cx="-90" cy="50" r="14" fill="#ff6b6b" opacity="0.25"/>

        <!-- undercarriage -->
        <rect x="-70" y="148" width="140" height="14" rx="4" fill="#3a2a20"/>
        <!-- small guide wheels under cabin (spin with travel) -->
        <g transform="translate(-40, 170)">
          <g class="guide-wheel">
            <circle r="14" fill="#2a2018" stroke="#c9a46a" stroke-width="3"/>
            <line x1="-8" y1="0" x2="8" y2="0" stroke="#c9a46a" stroke-width="2"/>
            <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a46a" stroke-width="2"/>
          </g>
        </g>
        <g transform="translate(0, 170)">
          <g class="guide-wheel">
            <circle r="14" fill="#2a2018" stroke="#c9a46a" stroke-width="3"/>
            <line x1="-8" y1="0" x2="8" y2="0" stroke="#c9a46a" stroke-width="2"/>
            <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a46a" stroke-width="2"/>
          </g>
        </g>
        <g transform="translate(40, 170)">
          <g class="guide-wheel">
            <circle r="14" fill="#2a2018" stroke="#c9a46a" stroke-width="3"/>
            <line x1="-8" y1="0" x2="8" y2="0" stroke="#c9a46a" stroke-width="2"/>
            <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a46a" stroke-width="2"/>
          </g>
        </g>

        <!-- decorative side stripe -->
        <path d="M-88,125 Q0,140 88,125" fill="none" stroke="#e8c56a" stroke-width="3" opacity="0.7"/>

        <!-- ===== SEAHORSE PILOT (facing RIGHT) ===== -->
        <!-- sits behind side window, operating controls -->
        <g id="seahorse" transform="translate(-8, 28)">
          <!-- dorsal fin / crown -->
          <g class="crown" transform="translate(18, 8)">
            <path d="M0,18 Q-4,4 2,-10 Q6,2 10,14 Q6,20 0,18 Z"
                  fill="#5eead4" stroke="#1a8a80" stroke-width="1.5"/>
            <path d="M8,16 Q12,0 16,-8 Q18,6 16,16 Z"
                  fill="#2ec4b6" stroke="#1a8a80" stroke-width="1.2"/>
            <circle cx="2" cy="-8" r="3" fill="#e8c56a"/>

<script>
(function () {
  "use strict";

  // ---- world state: continuous rightward travel along the cable ----
  const SPEED = 42;            // px / s of world scroll (cabin advances)
  const CABIN_X0 = -200;       // start (slightly left of center)
  const CABIN_X1 = 1800;       // wrap point
  const WRAP = CABIN_X1 - CABIN_X0;

  // parallax depths (background slower, foreground faster)
  const P_FAR   = 0.12;
  const P_MID   = 0.28;
  const P_TOWER = 0.55;
  const P_CABLE = 0.55;  // cable + towers same depth (they're the infrastructure)
  const P_FG    = 0.95;  // foreground nearly 1:1, slight lead

  const cabinRig = document.getElementById("cabin-rig");
  const layerFar  = document.getElementById("layer-far");
  const layerMid  = document.getElementById("layer-mid");
  const layerTowers = document.getElementById("layer-towers");
  const layerCable  = document.getElementById("layer-cable");
  const layerFg   = document.getElementById("layer-fg");
  const sparkles  = document.getElementById("sparkles");

  // cabin hangs with a slight pendulum sway (does NOT lock body to pure translation)
  let t = 0;
  let last = performance.now();

  // For infinite loop: track world offset and apply modulo to repeating layers
  let world = 0;

  // Cable y as a gentle function of x (matches the SVG path roughly)
  function cableY(x) {
    // gentle undulation ~300±14
    return 305 + Math.sin((x + world * P_CABLE) * 0.0022) * 10;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += dt;
    world += SPEED * dt;

    // --- cabin travels RIGHT across the screen ---
    let cabX = CABIN_X0 + ((world * 1.0) % WRAP);
    // hang on cable
    const cy = cableY(cabX);
    // pendulum: small roll + vertical bob (sway relative to cable attachment)
    const sway = Math.sin(t * 1.15) * 4.5;
    const bob  = Math.sin(t * 2.3) * 2.2;
    cabinRig.setAttribute(
      "transform",
      "translate(" + cabX.toFixed(2) + "," + (cy + bob).toFixed(2) + ") rotate(" + sway.toFixed(2) + ")"
    );

    // --- parallax layers scroll LEFT (as cabin moves right) ---
    // far: very slow
    const oxFar = -((world * P_FAR) % 400);
    layerFar.setAttribute("transform", "translate(" + oxFar.toFixed(2) + ",0)");

    const oxMid = -((world * P_MID) % 500);
    layerMid.setAttribute("transform", "translate(" + oxMid.toFixed(2) + ",0)");

    // towers + cable: mid-fast; wrap a large tile
    const oxT = -((world * P_TOWER) % 600);
    layerTowers.setAttribute("transform", "translate(" + oxT.toFixed(2) + ",0)");
    layerCable.setAttribute("transform", "translate(" + oxT.toFixed(2) + ",0)");

    // foreground: fastest
    const oxFg = -((world * P_FG) % 350);
    layerFg.setAttribute("transform", "translate(" + oxFg.toFixed(2) + ",0)");

    // sparkles drift
    if (sparkles) {
      const oxS = -((world * 0.4) % 200);
      sparkles.setAttribute("transform", "translate(" + oxS.toFixed(2) + ",0)");
    }

    requestAnimationFrame(frame);
  }

  // kick off
  requestAnimationFrame(frame);

  // expose a tiny self-check hook for the harness (no network)
  window.__SEAHORSE_CABLEWAY__ = {
    version: "1.0",
    direction: "right",
    layers: ["far", "mid", "towers+cable", "fg"],
    limbAnimations: ["fin-left", "fin-right", "tail", "crown", "snout", "lever", "grip-roller", "guide-wheel"],
    speed: SPEED
  };
})();
</script>
