<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seahorse Cableway · 生物发光索道</title>
<!--
  SVG015 · seahorse driving cableway, advancing to the right
  Direction: deep-sea bioluminescent coral canyon cableway
  Motion model: world scrolls LEFT (relative wind) ⇒ vehicle advances RIGHT
  Parallax: far ridge 0.25x · mid towers 0.55x · near reef 1.0x
  Pulley wheels rotate clockwise (leftward cable under grip = rightward car)
  Seahorse relative motion: pectoral fins + tail curl independent of cabin
-->
<style>
  :root {
    --void:   #06141f;
    --abyss:  #0c2740;
    --lagoon: #146b7a;
    --coral:  #e86a54;
    --gold:   #e8b84b;
    --pearl:  #f4e9d8;
    --kelp:   #1b4d3e;
    --glow:   #7fdbff;
    --shell:  #d4a574;
    --shell-d:#8b5a3c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── reduced motion ─────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .scroll-far,
    .scroll-mid,
    .scroll-near,
    .wheel,
    .fin-l,
    .fin-r,
    .tail-wave,
    .crest-sway,
    .bob,
    .bubble,
    .plankton,
    .rope-glow {
      animation: none !important;
    }
  }

  /* ── parallax scroll groups (duplicated tiles inside SVG) ── */
  .scroll-far  { animation: scrollX 28s linear infinite; }
  .scroll-mid  { animation: scrollX 14s linear infinite; }
  .scroll-near { animation: scrollX 7s  linear infinite; }

  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  /* ── gondola gentle cabin bob (relative to cable, not world) ── */
  .bob {
    animation: cabinBob 2.4s ease-in-out infinite;
    transform-origin: 600px 220px;
  }
  @keyframes cabinBob {
    0%, 100% { transform: rotate(-1.2deg) translateY(0px); }
    50%      { transform: rotate(1.4deg)  translateY(3px); }
  }

  /* ── pulley wheels: clockwise for rightward advance ── */
  .wheel {
    transform-origin: center;
    transform-box: fill-box;
    animation: spinCW 1.1s linear infinite;
  }
  @keyframes spinCW {
    to { transform: rotate(360deg); }
  }

  /* ── seahorse body micro-bob inside cabin ── */
  .seahorse-bob {
    animation: seahorseBob 2.4s ease-in-out infinite;
    transform-origin: 610px 270px;
  }
  @keyframes seahorseBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  /* ── independent pectoral fins ── */
  .fin-r {
    transform-origin: 618px 268px;
    transform-box: fill-box;
    animation: finFlapR 0.9s ease-in-out infinite;
  }
  .fin-l {
    transform-origin: 602px 268px;
    transform-box: fill-box;
    animation: finFlapL 1.15s ease-in-out infinite;
  }
  @keyframes finFlapR {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50%      { transform: rotate(22deg) scale(0.92); }
  }
  @keyframes finFlapL {
    0%, 100% { transform: rotate(10deg) scale(1); }
    50%      { transform: rotate(-18deg) scale(0.9); }
  }

  /* ── independent tail curl wave ── */
  .tail-wave {
    transform-origin: 600px 300px;
    transform-box: fill-box;
    animation: tailCurl 1.8s ease-in-out infinite;
  }
  @keyframes tailCurl {
    0%, 100% { transform: rotate(-6deg) scaleX(1); }
    50%      { transform: rotate(10deg) scaleX(0.94); }
  }

  /* ── crest sway ── */
  .crest-sway {
    transform-origin: 630px 248px;
    transform-box: fill-box;
    animation: crestSway 1.6s ease-in-out infinite;
  }
  @keyframes crestSway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(6deg); }
  }

  /* ── ambient particles (near layer extras) ── */
  .bubble {
    animation: rise 6s ease-in infinite;
  }
  .bubble:nth-child(2n) { animation-duration: 8s; animation-delay: -2s; }
  .bubble:nth-child(3n) { animation-duration: 5s; animation-delay: -4s; }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    15%  { opacity: 0.7; }
    100% { transform: translateY(-220px) translateX(-40px); opacity: 0; }
  }

  .plankton {
    animation: drift 9s linear infinite;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-180px); }
  }

  .rope-glow {
    animation: pulseGlow 2.2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.95; }
  }

  .ui-caption {
    position: absolute;
    left: 1.25rem;
    bottom: 1.25rem;
    color: var(--pearl);
    opacity: 0.72;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  .ui-caption strong {
    color: var(--glow);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage" aria-label="Seahorse riding a cableway to the right">
<svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Seahorse Cableway</title>
  <desc id="desc">A seahorse pilots a brass gondola along a bioluminescent deep-sea cableway, advancing to the right past parallax coral canyon layers.</desc>

  <defs>
    <!-- water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0c2740"/>
      <stop offset="45%"  stop-color="#0a3048"/>
      <stop offset="100%" stop-color="#06141f"/>
    </linearGradient>
    <radialGradient id="lumenRad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#7fdbff" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#146b7a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06141f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cableGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3a5a6a"/>
      <stop offset="50%"  stop-color="#9bb8c4"/>
      <stop offset="100%" stop-color="#3a5a6a"/>
    </linearGradient>
    <linearGradient id="cabinBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0c96a"/>
      <stop offset="45%"  stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#b8862a"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7fdbff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#146b7a" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a6a72"/>
      <stop offset="100%" stop-color="#0e3a44"/>
    </linearGradient>
    <linearGradient id="seahorseBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0a878"/>
      <stop offset="50%"  stop-color="#d4784a"/>
      <stop offset="100%" stop-color="#a84838"/>
    </linearGradient>
    <linearGradient id="seahorseBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f4e9d8"/>
      <stop offset="100%" stop-color="#d4b896"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7fdbff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e86a54" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ══════════ BACKGROUND BASE ══════════ -->
  <rect width="1200" height="700" fill="url(#waterGrad)"/>
  <rect width="1200" height="700" fill="url(#lumenRad)"/>

  <!-- ══════════ LAYER 1 · FAR ridge (parallax 0.25x) ══════════ -->
  <g class="scroll-far" opacity="0.55">
    <!-- tile A -->
    <g>
      <path d="M0 420 L80 300 L160 380 L240 260 L320 360 L400 280 L480 400 L560 320 L640 390 L720 300 L800 410 L880 310 L960 380 L1040 290 L1120 370 L1200 340 L1200 700 L0 700 Z"
            fill="#0a3040"/>
      <path d="M40 420 L90 340 L130 400 L180 310 L230 390 L280 350 L340 410"
            fill="none" stroke="#146b7a" stroke-width="2" opacity="0.35"/>
      <!-- distant coral fans -->
      <ellipse cx="120" cy="400" rx="28" ry="50" fill="#1b4d3e" opacity="0.4"/>
      <ellipse cx="400" cy="390" rx="36" ry="60" fill="#1b4d3e" opacity="0.35"/>
      <ellipse cx="720" cy="400" rx="30" ry="48" fill="#1b4d3e" opacity="0.4"/>
      <ellipse cx="1000" cy="385" rx="40" ry="55" fill="#1b4d3e" opacity="0.3"/>
    </g>
    <!-- tile B (duplicate for seamless loop, offset 1200) -->
    <g transform="translate(1200,0)">
      <path d="M0 420 L80 300 L160 380 L240 260 L320 360 L400 280 L480 400 L560 320 L640 390 L720 300 L800 410 L880 310 L960 380 L1040 290 L1120 370 L1200 340 L1200 700 L0 700 Z"
            fill="#0a3040"/>
      <path d="M40 420 L90 340 L130 400 L180 310 L230 390 L280 350 L340 410"
            fill="none" stroke="#146b7a" stroke-width="2" opacity="0.35"/>
      <ellipse cx="120" cy="400" rx="28" ry="50" fill="#1b4d3e" opacity="0.4"/>
      <ellipse cx="400" cy="390" rx="36" ry="60" fill="#1b4d3e" opacity="0.35"/>
      <ellipse cx="720" cy="400" rx="30" ry="48" fill="#1b4d3e" opacity="0.4"/>
      <ellipse cx="1000" cy="385" rx="40" ry="55" fill="#1b4d3e" opacity="0.3"/>
    </g>
  </g>

  <!-- ══════════ LAYER 2 · MID towers + mid coral (parallax 0.55x) ══════════ -->
  <g class="scroll-mid">
    <!-- tile A -->
    <g>
      <!-- cable tower 1 -->
      <g transform="translate(180,0)">
        <rect x="-10" y="280" width="20" height="320" fill="url(#towerGrad)"/>
        <rect x="-36" y="270" width="72" height="14" rx="3" fill="#2a6a72"/>
        <rect x="-28" y="250" width="8" height="30" fill="#1a4a52"/>
        <rect x="20" y="250" width="8" height="30" fill="#1a4a52"/>
        <circle cx="-24" cy="262" r="5" fill="#7fdbff" class="rope-glow" filter="url(#softGlow)"/>
        <circle cx="24" cy="262" r="5" fill="#7fdbff" class="rope-glow" filter="url(#softGlow)"/>
        <!-- ladder rungs -->
        <line x1="-6" y1="320" x2="6" y2="320" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="360" x2="6" y2="360" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="400" x2="6" y2="400" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="440" x2="6" y2="440" stroke="#0e3a44" stroke-width="2"/>
      </g>
      <!-- mid coral cluster -->
      <path d="M40 520 C60 460 90 470 100 520 C110 470 140 450 155 520 L155 620 L40 620 Z"
            fill="#146b7a" opacity="0.7"/>
      <circle cx="90" cy="480" r="10" fill="#e86a54" opacity="0.55"/>
      <circle cx="130" cy="495" r="7" fill="#e86a54" opacity="0.4"/>
      <!-- mid coral 2 -->
      <path d="M380 500 C400 430 440 440 455 500 C470 440 510 420 520 500 L520 620 L380 620 Z"
            fill="#1b4d3e" opacity="0.65"/>
      <circle cx="430" cy="450" r="12" fill="#7fdbff" opacity="0.35" filter="url(#softGlow)"/>
      <!-- mid coral 3 -->
      <path d="M620 510 C645 440 690 450 705 510 C720 450 760 435 775 510 L775 620 L620 620 Z"
            fill="#146b7a" opacity="0.6"/>
      <circle cx="680" cy="460" r="9" fill="#e86a54" opacity="0.5"/>
    </g>
    <!-- tile B -->
    <g transform="translate(1200,0)">
      <g transform="translate(180,0)">
        <rect x="-10" y="280" width="20" height="320" fill="url(#towerGrad)"/>
        <rect x="-36" y="270" width="72" height="14" rx="3" fill="#2a6a72"/>
        <rect x="-28" y="250" width="8" height="30" fill="#1a4a52"/>
        <rect x="20" y="250" width="8" height="30" fill="#1a4a52"/>
        <circle cx="-24" cy="262" r="5" fill="#7fdbff" class="rope-glow" filter="url(#softGlow)"/>
        <circle cx="24" cy="262" r="5" fill="#7fdbff" class="rope-glow" filter="url(#softGlow)"/>
        <line x1="-6" y1="320" x2="6" y2="320" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="360" x2="6" y2="360" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="400" x2="6" y2="400" stroke="#0e3a44" stroke-width="2"/>
        <line x1="-6" y1="440" x2="6" y2="440" stroke="#0e3a44" stroke-width="2"/>
      </g>
      <path d="M40 520 C60 460 90 470 100 520 C110 470 140 450 155 520 L155 620 L40 620 Z"
            fill="#146b7a" opacity="0.7"/>
      <circle cx="90" cy="480" r="10" fill="#e86a54" opacity="0.55"/>
      <circle cx="130" cy="495" r="7" fill="#e86a54" opacity="0.4"/>
      <path d="M380 500 C400 430 440 440 455 500 C470 440 510 420 520 500 L520 620 L380 620 Z"
            fill="#1b4d3e" opacity="0.65"/>
      <circle cx="430" cy="450" r="12" fill="#7fdbff" opacity="0.35" filter="url(#softGlow)"/>
      <path d="M620 510 C645 440 690 450 705 510 C720 450 760 435 775 510 L775 620 L620 620 Z"
            fill="#146b7a" opacity="0.6"/>
      <circle cx="680" cy="460" r="9" fill="#e86a54" opacity="0.5"/>
    </g>
  </g>

  <!-- ══════════ CABLE (fixed span across scene) ══════════ -->
  <!-- cable sits at y=200; slight sag between towers via path -->
  <path d="M0 205 Q300 218 600 205 Q900 192 1200 205"
        fill="none" stroke="url(#cableGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M0 205 Q300 218 600 205 Q900 192 1200 205"
        fill="none" stroke="#7fdbff" stroke-width="1" opacity="0.35" class="rope-glow"/>

  <!-- ══════════ GONDOLA GROUP (center-right, faces right) ══════════ -->
  <g class="bob">
    <!-- hanging arm / grip -->
    <g>
      <!-- vertical hanger -->
      <rect x="592" y="200" width="16" height="52" rx="3" fill="#c9a227"/>
      <rect x="596" y="204" width="8" height="44" fill="#e8b84b" opacity="0.6"/>
      <!-- grip head -->
      <rect x="575" y="192" width="50" height="18" rx="4" fill="#8a7020"/>
      <rect x="580" y="188" width="40" height="8" rx="2" fill="#c9a227"/>

      <!-- pulley wheels on cable — clockwise rotation = rightward advance -->
      <g class="wheel">
        <circle cx="585" cy="200" r="10" fill="#2a3a44" stroke="#9bb8c4" stroke-width="2"/>
        <line x1="585" y1="192" x2="585" y2="208" stroke="#7fdbff" stroke-width="1.5"/>
        <line x1="577" y1="200" x2="593" y2="200" stroke="#7fdbff" stroke-width="1.5"/>
      </g>
      <g class="wheel" style="animation-delay: -0.35s">
        <circle cx="615" cy="200" r="10" fill="#2a3a44" stroke="#9bb8c4" stroke-width="2"/>
        <line x1="615" y1="192" x2="615" y2="208" stroke="#7fdbff" stroke-width="1.5"/>
        <line x1="607" y1="200" x2="623" y2="200" stroke="#7fdbff" stroke-width="1.5"/>
      </g>
    </g>

    <!-- cabin -->
    <g>
      <!-- roof -->
      <path d="M540 252 L600 232 L660 252 L655 258 L545 258 Z" fill="#c9a227"/>
      <ellipse cx="600" cy="246" rx="8" ry="4" fill="#7fdbff" opacity="0.5" filter="url(#softGlow)"/>

      <!-- main body -->
      <path d="M548 258 L652 258 L648 348 Q600 368 552 348 Z" fill="url(#cabinBody)" stroke="#8b6914" stroke-width="2"/>

      <!-- open front window (right-facing) showing seahorse -->
      <path d="M575 270 L640 270 L636 335 Q600 348 578 335 Z"
            fill="url(#glassGrad)" stroke="#7fdbff" stroke-width="1.5" opacity="0.95"/>

      <!-- side railing -->
      <line x1="555" y1="310" x2="575" y2="310" stroke="#8b6914" stroke-width="3"/>
      <line x1="555" y1="290" x2="575" y2="290" stroke="#8b6914" stroke-width="2"/>

      <!-- ornamental coral trim -->
      <circle cx="556" cy="275" r="4" fill="#e86a54"/>
      <circle cx="644" cy="275" r="4" fill="#e86a54"/>
      <path d="M548 265 Q540 280 548 295" fill="none" stroke="#e86a54" stroke-width="2"/>

      <!-- bottom skid / bumper -->
      <path d="M555 348 Q600 368 645 348 L645 356 Q600 376 555 356 Z" fill="#8b6914"/>
      <circle cx="600" cy="362" r="5" fill="#7fdbff" opacity="0.6" filter="url(#softGlow)"/>

      <!-- destination plate -->
      <rect x="580" y="260" width="40" height="10" rx="2" fill="#0c2740"/>
      <text x="600" y="268" text-anchor="middle" font-size="7" fill="#7fdbff" font-family="Segoe UI, sans-serif">REEF</text>
    </g>

    <!-- ══════════ SEAHORSE (driver, facing RIGHT) ══════════ -->
    <g class="seahorse-bob">
      <!-- dorsal fin (on back = left side when facing right) — independent -->
      <g class="fin-l">
        <path d="M590 265 Q575 280 578 305 Q588 295 595 285 Z"
              fill="url(#finGrad)" opacity="0.85"/>
      </g>

      <!-- tail (curled under, independent wave) -->
      <g class="tail-wave">
        <path d="M600 300
                 C600 315 595 328 585 335
                 C575 342 565 340 560 332
                 C556 325 560 318 568 320
                 C574 322 576 328 572 332"
              fill="none" stroke="url(#seahorseBody)" stroke-width="11"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- tail ridges -->
        <path d="M600 308 C598 318 594 326 586 332"
              fill="none" stroke="#a84838" stroke-width="1.5" opacity="0.6"/>
        <circle cx="570" cy="330" r="3" fill="#e86a54" opacity="0.7"/>
      </g>

      <!-- body core -->
      <ellipse cx="612" cy="285" rx="16" ry="24" fill="url(#seahorseBody)"/>
      <!-- belly plates -->
      <ellipse cx="618" cy="285" rx="9" ry="20" fill="url(#seahorseBelly)"/>
      <line x1="614" y1="270" x2="622" y2="270" stroke="#b8956a" stroke-width="1"/>
      <line x1="613" y1="278" x2="623" y2="278" stroke="#b8956a" stroke-width="1"/>
      <line x1="613" y1="286" x2="623" y2="286" stroke="#b8956a" stroke-width="1"/>
      <line x1="614" y1="294" x2="622" y2="294" stroke="#b8956a" stroke-width="1"/>
      <!-- body spots -->
      <circle cx="605" cy="278" r="2" fill="#f4e9d8" opacity="0.45"/>
      <circle cx="603" cy="290" r="1.5" fill="#f4e9d8" opacity="0.35"/>

      <!-- neck + head (facing right) -->
      <path d="M620 268 C628 258 638 252 648 250"
            fill="none" stroke="url(#seahorseBody)" stroke-width="10"
            stroke-linecap="round"/>
      <!-- snout -->
      <path d="M648 250 L668 248 L668 254 L648 256 Z"
            fill="url(#seahorseBody)" stroke="#a84838" stroke-width="0.5"/>
      <ellipse cx="668" cy="251" rx="3" ry="2.5" fill="#8b3a2a"/>

      <!-- head bulb -->
      <ellipse cx="642" cy="250" rx="12" ry="11" fill="url(#seahorseBody)"/>

      <!-- eye -->
      <circle cx="646" cy="248" r="4.5" fill="#f4e9d8"/>
      <circle cx="647" cy="248" r="2.5" fill="#0c2740"/>
      <circle cx="648" cy="247" r="1" fill="#7fdbff"/>

      <!-- crest / coronet — independent sway -->
      <g class="crest-sway">
        <path d="M632 240 L634 228 L638 238 L642 224 L646 236 L650 226 L652 240"
              fill="none" stroke="#e86a54" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="634" cy="228" r="2" fill="#7fdbff" filter="url(#softGlow)"/>
        <circle cx="642" cy="224" r="2.2" fill="#e86a54"/>
        <circle cx="650" cy="226" r="2" fill="#7fdbff" filter="url(#softGlow)"/>
      </g>

      <!-- pectoral fin (front, visible) — independent flap -->
      <g class="fin-r">
        <path d="M620 270 Q638 262 645 275 Q632 278 620 278 Z"
              fill="url(#finGrad)" opacity="0.9"/>
        <path d="M622 272 Q634 268 640 274" fill="none" stroke="#f4e9d8" stroke-width="0.8" opacity="0.5"/>
      </g>

      <!-- tiny gripping hand on cabin rail -->
      <path d="M598 292 Q590 295 588 302" fill="none" stroke="url(#seahorseBody)"
            stroke-width="4" stroke-linecap="round"/>
      <circle cx="588" cy="304" r="3" fill="#d4784a"/>
    </g>
  </g>

  <!-- ══════════ LAYER 3 · NEAR reef foreground (parallax 1.0x) ══════════ -->
  <g class="scroll-near" opacity="0.9">
    <!-- tile A -->
    <g>
      <!-- left foreground kelp -->
      <path d="M0 520 C40 480 30 560 60 530 C90 500 70 580 100 560 L100 700 L0 700 Z"
            fill="#0e3a44"/>
      <path d="M20 540 C35 500 50 560 70 530" fill="none" stroke="#1b4d3e" stroke-width="3"/>
      <!-- coral mound -->
