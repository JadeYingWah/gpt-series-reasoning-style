<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otter Ferry — Captain Nib</title>
<style>
  :root {
    --sky-top: #0b1d3a;
    --sky-mid: #1a4a7a;
    --sky-low: #3d7ea6;
    --horizon: #f0a060;
    --sun: #ffd27a;
    --water-far: #1a5a7a;
    --water-mid: #0f4a66;
    --water-near: #0a3550;
    --water-foam: #8ec8e0;
    --ferry-hull: #6b3a2a;
    --ferry-hull-dark: #4a261c;
    --ferry-deck: #c4a06a;
    --ferry-white: #f2e8d5;
    --ferry-red: #c0392b;
    --ferry-window: #7ec8e8;
    --otter-fur: #8b5a3c;
    --otter-fur-dark: #6b4228;
    --otter-belly: #d4a574;
    --otter-nose: #2c1810;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-top);
    font-family: Georgia, "Times New Roman", serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    cursor: default;
  }

  svg#scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- title plate ---------- */
  .title-plate {
    position: absolute;
    top: 18px;
    left: 22px;
    color: #f5e6c8;
    text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    pointer-events: none;
    z-index: 5;
  }
  .title-plate h1 {
    font-size: clamp(18px, 2.4vw, 28px);
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  .title-plate p {
    margin-top: 4px;
    font-size: clamp(11px, 1.2vw, 14px);
    opacity: 0.85;
    letter-spacing: 0.04em;
  }

  /* ---------- caption ---------- */
  .caption {
    position: absolute;
    bottom: 16px;
    right: 22px;
    color: #c8e0f0;
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0.7;
    pointer-events: none;
    z-index: 5;
    text-align: right;
  }

  /* =========================================================
     PARALLAX LAYERS (CSS translateX loops — rightward travel)
     Scene "moves left" so the ferry appears to travel right.
     Speeds: sky slowest → foreground waves fastest.
     ========================================================= */

  /* Far clouds — slowest drift */
  @keyframes drift-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  .layer-far-clouds {
    animation: drift-far 90s linear infinite;
  }

  /* Distant islands — medium-slow */
  @keyframes drift-islands {
    from { transform: translateX(0); }
    to   { transform: translateX(-900px); }
  }
  .layer-islands {
    animation: drift-islands 48s linear infinite;
  }

  /* Mid water surface detail */
  @keyframes drift-water-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-600px); }
  }
  .layer-water-mid {
    animation: drift-water-mid 22s linear infinite;
  }

  /* Near water / foreground waves — fastest */
  @keyframes drift-water-near {
    from { transform: translateX(0); }
    to   { transform: translateX(-480px); }
  }
  .layer-water-near {
    animation: drift-water-near 14s linear infinite;
  }

  /* Sea sparkle dots — medium */
  @keyframes drift-sparkle {
    from { transform: translateX(0); }
    to   { transform: translateX(-720px); }
  }
  .layer-sparkle {
    animation: drift-sparkle 28s linear infinite;
  }

  /* ---------- ferry hull gentle bob (whole ship) ---------- */
  @keyframes ferry-bob {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(6px, -5px) rotate(0.6deg); }
    50%  { transform: translate(12px, 1px) rotate(0deg); }
    75%  { transform: translate(6px, 4px) rotate(-0.5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  #ferry-root {
    animation: ferry-bob 4.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 70%;
  }

  /* ---------- propeller spin (forward = rightward, so spin CW) ---------- */
  @keyframes prop-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #propeller {
    animation: prop-spin 0.45s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  /* wake churn behind ferry */
  @keyframes wake-churn {
    0%   { opacity: 0.35; transform: scaleX(1) translateX(0); }
    50%  { opacity: 0.7;  transform: scaleX(1.08) translateX(-4px); }
    100% { opacity: 0.35; transform: scaleX(1) translateX(0); }
  }
  #wake {
    animation: wake-churn 1.1s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 100% 50%;
  }

  /* small puff from funnel */
  @keyframes puff-rise {
    0%   { opacity: 0.55; transform: translate(0, 0) scale(0.6); }
    70%  { opacity: 0.25; transform: translate(-28px, -48px) scale(1.35); }
    100% { opacity: 0;    transform: translate(-40px, -70px) scale(1.6); }
  }
  .puff {
    animation: puff-rise 2.4s ease-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  .puff:nth-child(2) { animation-delay: 0.8s; }
  .puff:nth-child(3) { animation-delay: 1.6s; }

  /* =========================================================
     OTTER — independent limb / body motion (NOT locked to ferry)
     ========================================================= */

  /* body bob relative to deck */
  @keyframes otter-body-bob {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-3.5px) rotate(-1.2deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  #otter-body {
    animation: otter-body-bob 2.1s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 80%;
  }

  /* head look-around */
  @keyframes otter-head {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(-4deg); }
    55%  { transform: rotate(2deg); }
    80%  { transform: rotate(-1.5deg); }
    100% { transform: rotate(0deg); }
  }
  #otter-head {
    animation: otter-head 3.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 90%;
  }

  /* left arm on wheel — steering micro-motions */
  @keyframes otter-arm-wheel {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-7deg); }
    50%  { transform: rotate(4deg); }
    75%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
  }
  #otter-arm-wheel {
    animation: otter-arm-wheel 2.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 80% 20%; /* shoulder joint */
  }

  /* right arm free — waving / pointing ahead */
  @keyframes otter-arm-free {
    0%   { transform: rotate(10deg); }
    20%  { transform: rotate(-28deg); }
    40%  { transform: rotate(-18deg); }
    60%  { transform: rotate(-32deg); }
    80%  { transform: rotate(-8deg); }
    100% { transform: rotate(10deg); }
  }
  #otter-arm-free {
    animation: otter-arm-free 2.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 15% 20%; /* shoulder */
  }

  /* whisker twitch */
  @keyframes whisker-twitch {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    40%      { transform: rotate(1.5deg) translateY(-0.4px); }
    70%      { transform: rotate(-1deg) translateY(0.3px); }
  }
  #otter-whiskers {
    animation: whisker-twitch 1.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 10% 50%;
  }

  /* tail sway — independent of body */
  @keyframes otter-tail {
    0%   { transform: rotate(0deg); }
    50%  { transform: rotate(12deg); }
    100% { transform: rotate(0deg); }
  }
  #otter-tail {
    animation: otter-tail 1.9s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 100% 40%; /* base of tail at rump */
  }

  /* ear flick */
  @keyframes ear-flick {
    0%, 85%, 100% { transform: rotate(0deg); }
    88% { transform: rotate(-8deg); }
    92% { transform: rotate(4deg); }
    96% { transform: rotate(0deg); }
  }
  #otter-ear-l { animation: ear-flick 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
  #otter-ear-r { animation: ear-flick 3.1s ease-in-out infinite; animation-delay: 0.15s; transform-box: fill-box; transform-origin: 50% 90%; }

  /* captain cap brim flutter */
  @keyframes cap-flutter {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }
  #cap-brim {
    animation: cap-flutter 2.3s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 20% 60%;
  }

  /* ship's wheel slow turn — independent of propeller */
  @keyframes wheel-turn {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #ships-wheel {
    animation: wheel-turn 6s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  /* flag flutter */
  @keyframes flag-wave {
    0%   { d: path("M0,0 Q8,-3 16,0 T32,0 L32,10 Q24,12 16,10 T0,10 Z"); }
    50%  { d: path("M0,0 Q8,2 16,0 T32,1 Q24,8 16,8 T0,10 Z"); }
    100% { d: path("M0,0 Q8,-3 16,0 T32,0 L32,10 Q24,12 16,10 T0,10 Z"); }
  }
  #flag {
    animation: flag-wave 1.4s ease-in-out infinite;
  }

  /* sun pulse subtle */
  @keyframes sun-glow {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(1.04); }
  }
  #sun-glow {
    animation: sun-glow 5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  /* bird wing flap */
  @keyframes wing-flap {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.35); }
  }
  .bird-wing {
    animation: wing-flap 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .bird-wing.delay { animation-delay: 0.35s; }

  @keyframes bird-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1100px); }
  }
  .layer-birds {
    animation: bird-drift 36s linear infinite;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="title-plate">
    <h1>OTTER FERRY</h1>
    <p>Captain Nib · eastbound · dusk run</p>
  </div>
  <div class="caption">parallax 4 layers · prop + wheel + limbs independent</div>

  <!--
    GEOMETRY / MOTION SELF-CONSISTENCY (also in notes.md)
    ─────────────────────────────────────────────────────
    1. Forward direction is RIGHT. All scroll layers translate LEFT
       so the ferry appears to advance rightward across water.
    2. Propeller spins clockwise (CSS rotate 0→360deg), matching
       a rightward drive for a stern-mounted screw pushing water
       aft (left of the hull). Wake churns behind (left).
    3. Ship's wheel turns slowly, independent of propeller phase.
    4. Otter has ≥2 independent motions vs the ferry hull:
         · #otter-arm-wheel  — shoulder-rotated steering arm
         · #otter-arm-free   — free arm pointing ahead (opposite phase)
         · #otter-head       — look-around rotation
         · #otter-tail       — rear sway
         · #otter-body-bob   — body bob at different period than ferry-bob
         · ears / whiskers   — micro-twitches
       None of these are the same transform as #ferry-root.
    5. Parallax depths (back → front):
         sky + far clouds  (90s)  → islands (48s) → sparkles (28s)
         → mid water (22s) → near water (14s). Five independent layers.
    6. No external resources: pure inline SVG + CSS keyframes.
  -->

  <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- sky gradient -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0b1d3a"/>
        <stop offset="35%"  stop-color="#1a4a7a"/>
        <stop offset="62%"  stop-color="#3d7ea6"/>
        <stop offset="78%"  stop-color="#c4785a"/>
        <stop offset="88%"  stop-color="#f0a060"/>
        <stop offset="100%" stop-color="#f5c07a"/>
      </linearGradient>

      <!-- water gradients -->
      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#2a7a9a"/>
        <stop offset="40%"  stop-color="#1a5a7a"/>
        <stop offset="100%" stop-color="#0a3550"/>
      </linearGradient>

      <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#8b4a32"/>
        <stop offset="55%"  stop-color="#6b3a2a"/>
        <stop offset="100%" stop-color="#3d1e14"/>
      </linearGradient>

      <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4b87a"/>
        <stop offset="100%" stop-color="#a88850"/>
      </linearGradient>

      <linearGradient id="otterFur" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#9b6a4c"/>
        <stop offset="100%" stop-color="#6b4228"/>
      </linearGradient>

      <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff5d0"/>
        <stop offset="45%"  stop-color="#ffd27a"/>
        <stop offset="100%" stop-color="#f0a060" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="funnelGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#d04830"/>
        <stop offset="50%"  stop-color="#a03020"/>
        <stop offset="100%" stop-color="#701810"/>
      </linearGradient>

      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="12" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- ========== SKY (static base) ========== -->
    <rect width="1200" height="420" fill="url(#skyGrad)"/>

    <!-- sun -->
    <circle id="sun-glow" cx="920" cy="300" r="90" fill="url(#sunGrad)" opacity="0.45"/>
    <circle cx="920" cy="300" r="36" fill="#ffd27a"/>
    <circle cx="920" cy="300" r="28" fill="#fff0b8" opacity="0.7"/>

    <!-- ========== LAYER 1: FAR CLOUDS (slowest) ========== -->
    <g class="layer-far-clouds" opacity="0.55">
      <!-- two tile-widths for seamless loop: content spans 0–2400, animate −1200 -->
      <g fill="#e8d0b0" opacity="0.7">
        <ellipse cx="140" cy="90" rx="70" ry="18"/>
        <ellipse cx="180" cy="82" rx="50" ry="14"/>
        <ellipse cx="100" cy="95" rx="40" ry="12"/>

        <ellipse cx="480" cy="60" rx="90" ry="16"/>
        <ellipse cx="530" cy="52" rx="55" ry="12"/>
        <ellipse cx="430" cy="68" rx="45" ry="11"/>

        <ellipse cx="820" cy="110" rx="65" ry="15"/>
        <ellipse cx="860" cy="102" rx="40" ry="10"/>

        <ellipse cx="1100" cy="70" rx="80" ry="17"/>
        <ellipse cx="1150" cy="62" rx="50" ry="12"/>
        <!-- second tile -->
        <ellipse cx="1340" cy="90" rx="70" ry="18"/>
        <ellipse cx="1380" cy="82" rx="50" ry="14"/>
        <ellipse cx="1300" cy="95" rx="40" ry="12"/>
        <ellipse cx="1680" cy="60" rx="90" ry="16"/>
        <ellipse cx="1730" cy="52" rx="55" ry="12"/>
        <ellipse cx="1630" cy="68" rx="45" ry="11"/>
        <ellipse cx="2020" cy="110" rx="65" ry="15"/>
        <ellipse cx="2060" cy="102" rx="40" ry="10"/>
        <ellipse cx="2300" cy="70" rx="80" ry="17"/>
        <ellipse cx="2350" cy="62" rx="50" ry="12"/>
      </g>
    </g>

    <!-- stars in upper sky -->
    <g fill="#f5e6c8" opacity="0.55">
      <circle cx="80" cy="40" r="1.2"/>
      <circle cx="200" cy="70" r="0.9"/>
      <circle cx="320" cy="30" r="1.1"/>
      <circle cx="500" cy="55" r="0.8"/>
      <circle cx="640" cy="25" r="1.3"/>
      <circle cx="760" cy="48" r="0.9"/>
      <circle cx="980" cy="35" r="1.0"/>
      <circle cx="1120" cy="60" r="1.2"/>
    </g>

    <!-- ========== LAYER 2: DISTANT ISLANDS ========== -->
    <g class="layer-islands">
      <!-- tile width 900, animate −900 -->
      <g>
        <!-- island 1 -->
        <path d="M40,400 Q80,340 140,355 Q190,320 240,360 Q280,345 310,400 Z" fill="#1a3a4a"/>
        <path d="M90,400 Q120,365 160,370 Q195,350 230,400 Z" fill="#152e3c"/>
        <!-- little lighthouse -->
        <rect x="200" y="330" width="8" height="28" fill="#2a4a5a"/>
        <rect x="198" y="322" width="12" height="10" fill="#c0392b"/>
        <circle cx="204" cy="324" r="2" fill="#ffd27a" opacity="0.9"/>

        <!-- island 2 -->
        <path d="M400,400 Q460,330 540,350 Q600,315 670,360 Q720,345 760,400 Z" fill="#1a3a4a"/>
        <path d="M480,400 Q520,360 580,365 Q630,345 690,400 Z" fill="#152e3c"/>

        <!-- island 3 smaller -->
        <path d="M820,400 Q870,355 930,370 Q970,355 1000,400 Z" fill="#1a3a4a"/>

        <!-- second tile for seamless loop (offset +900) -->
        <path d="M940,400 Q980,340 1040,355 Q1090,320 1140,360 Q1180,345 1210,400 Z" fill="#1a3a4a"/>
        <path d="M990,400 Q1020,365 1060,370 Q1095,350 1130,400 Z" fill="#152e3c"/>
        <rect x="1100" y="330" width="8" height="28" fill="#2a4a5a"/>
        <rect x="1098" y="322" width="12" height="10" fill="#c0392b"/>
        <circle cx="1104" cy="324" r="2" fill="#ffd27a" opacity="0.9"/>

        <path d="M1300,400 Q1360,330 1440,350 Q1500,315 1570,360 Q1620,345 1660,400 Z" fill="#1a3a4a"/>
        <path d="M1380,400 Q1420,360 1480,365 Q1530,345 1590,400 Z" fill="#152e3c"/>
        <path d="M1720,400 Q1770,355 1830,370 Q1870,355 1900,400 Z" fill="#1a3a4a"/>
      </g>
    </g>

    <!-- ========== BIRDS (mid-depth, own drift) ========== -->
    <g class="layer-birds" opacity="0.7">
      <g transform="translate(200,180)">
        <path class="bird-wing" d="M0,0 Q-8,-8 -16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q8,-8 16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(240,195)">
        <path class="bird-wing" d="M0,0 Q-6,-6 -12,-3" stroke="#1a2a3a" stroke-width="1.3" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q6,-6 12,-3" stroke="#1a2a3a" stroke-width="1.3" fill="none"/>
      </g>
      <g transform="translate(680,140)">
        <path class="bird-wing" d="M0,0 Q-7,-7 -14,-3" stroke="#1a2a3a" stroke-width="1.4" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q7,-7 14,-3" stroke="#1a2a3a" stroke-width="1.4" fill="none"/>
      </g>
      <g transform="translate(1100,160)">
        <path class="bird-wing" d="M0,0 Q-8,-8 -16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q8,-8 16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
      </g>
      <!-- second tile -->
      <g transform="translate(1400,180)">
        <path class="bird-wing" d="M0,0 Q-8,-8 -16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q8,-8 16,-4" stroke="#1a2a3a" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(1440,195)">
        <path class="bird-wing" d="M0,0 Q-6,-6 -12,-3" stroke="#1a2a3a" stroke-width="1.3" fill="none"/>
        <path class="bird-wing delay" d="M0,0 Q6,-6 12,-3" stroke="#1a2a3a" stroke-width="1.3" fill="none"/>
      </g>
    </g>

    <!-- ========== WATER BASE ========== -->
    <rect y="380" width="1200" height="320" fill="url(#waterGrad)"/>

    <!-- horizon glow line -->
    <rect y="378" width="1200" height="4" fill="#f0a060" opacity="0.35"/>

    <!-- ========== LAYER 3: MID WATER ripples ========== -->
    <g class="layer-water-mid" opacity="0.45">
      <g stroke="#5a9ab0" stroke-width="1.5" fill="none" stroke-linecap="round">
        <!-- tile 600 -->
        <path d="M30,430 Q50,425 70,430"/>
        <path d="M150,450 Q175,444 200,450"/>
        <path d="M280,420 Q310,415 340,420"/>
        <path d="M400,460 Q430,454 460,460"/>
        <path d="M500,435 Q530,430 560,435"/>
        <path d="M80,480 Q110,474 140,480"/>
        <path d="M220,490 Q250,485 280,490"/>
        <path d="M360,475 Q390,470 420,475"/>
        <path d="M480,500 Q510,495 540,500"/>
        <!-- tile +600 -->
        <path d="M630,430 Q650,425 670,430"/>
        <path d="M750,450 Q775,444 800,450"/>
        <path d="M880,420 Q910,415 940,420"/>
        <path d="M1000,460 Q1030,454 1060,460"/>
        <path d="M1100,435 Q1130,430 1160,435"/>
        <path d="M680,480 Q710,474 740,480"/>
        <path d="M820,490 Q850,485 880,490"/>
        <path d="M960,475 Q990,470 1020,475"/>
        <path d="M1080,500 Q1110,495 1140,500"/>
      </g>
    </g>

    <!-- ========== LAYER 4: SPARKLES ========== -->
    <g class="layer-sparkle" opacity="0.55">
      <g fill="#b8e0f0">
        <circle cx="100" cy="440" r="1.5"/>
        <circle cx="250" cy="470" r="1.2"/>
        <circle cx="400" cy="430" r="1.8"/>
        <circle cx="550" cy="500" r="1.3"/>
        <circle cx="700" cy="455" r="1.6"/>
        <circle cx="850" cy="480" r="1.1"/>
        <circle cx="180" cy="520" r="1.4"/>
        <circle cx="330" cy="540" r="1.2"/>
        <circle cx="500" cy="530" r="1.5"/>
        <circle cx="650" cy="560" r="1.0"/>
        <!-- tile +720 -->
        <circle cx="820" cy="440" r="1.5"/>
        <circle cx="970" cy="470" r="1.2"/>
        <circle cx="1120" cy="430" r="1.8"/>
        <circle cx="1270" cy="500" r="1.3"/>
        <circle cx="1420" cy="455" r="1.6"/>
        <circle cx="1570" cy="480" r="1.1"/>
        <circle cx="900" cy="520" r="1.4"/>
        <circle cx="1050" cy="540" r="1.2"/>
        <circle cx="1220" cy="530" r="1.5"/>
      </g>
    </g>

    <!-- ========== FERRY + OTTER (main subject, center-ish) ========== -->
    <g id="ferry-root" transform="translate(380, 340)">
      <!-- WAKE behind (to the LEFT of hull) -->
      <g id="wake" transform="translate(-40, 95)">
        <ellipse cx="-40" cy="0" rx="55" ry="10" fill="#8ec8e0" opacity="0.4"/>
        <ellipse cx="-90" cy="4" rx="40" ry="7" fill="#8ec8e0" opacity="0.28"/>
        <ellipse cx="-130" cy="8" rx="28" ry="5" fill="#8ec8e0" opacity="0.18"/>
        <path d="M-10,-4 Q-40,8 -80,4" stroke="#a8d8e8" stroke-width="2" fill="none" opacity="0.5"/>
        <path d="M-15,6 Q-50,14 -95,10" stroke="#a8d8e8" stroke-width="1.5" fill="none" opacity="0.35"/>
      </g>

      <!-- HULL -->
      <g id="hull">
        <!-- main body -->
        <path d="M-160,60
                 Q-155,100 -120,115
                 L140,115
                 Q170,110 175,80
                 L175,55
                 Q100,70 0,70
                 Q-80,70 -160,60 Z"
              fill="url(#hullGrad)"/>
        <!-- waterline stripe -->
        <path d="M-155,78 Q-80,90 0,90 Q80,90 170,78 L168,88 Q80,100 0,100 Q-80,100 -152,88 Z"
              fill="#2a1810" opacity="0.5"/>
        <!-- red boot-top -->
        <path d="M-150,95 Q-75,108 0,108 Q75,108 165,95 L162,108 Q75,120 0,120 Q-75,120 -148,108 Z"
              fill="#8b2a1a"/>
        <!-- deck -->
        <path d="M-145,58 Q-70,68 0,68 Q70,68 160,58 L158,52 Q70,62 0,62 Q-70,62 -143,52 Z"
              fill="url(#deckGrad)"/>
        <!-- bow rail -->
        <path d="M155,50 L175,40 L175,50" fill="none" stroke="#c8a868" stroke-width="2"/>
        <line x1="160" y1="48" x2="160" y2="58" stroke="#c8a868" stroke-width="1.5"/>
        <line x1="168" y1="44" x2="168" y2="54" stroke="#c8a868" stroke-width="1.5"/>
        <!-- stern rail -->
        <line x1="-150" y1="50" x2="-150" y2="60" stroke="#c8a868" stroke-width="1.5"/>
        <line x1="-140" y1="52" x2="-140" y2="60" stroke="#c8a868" stroke-width="1.5"/>
        <path d="M-155,52 L-160,44 L-150,48" fill="none" stroke="#c8a868" stroke-width="1.5"/>
      </g>

      <!-- WHEELHOUSE (white cabin) -->
      <g id="wheelhouse">
        <rect x="-30" y="-10" width="100" height="70" rx="4" fill="url(#hullGrad)" opacity="0.3"/>
        <rect x="-25" y="-15" width="90" height="70" rx="3" fill="#f2e8d5"/>
        <!-- window band -->
        <rect x="-18" y="-5" width="76" height="28" rx="2" fill="#7ec8e8"/>
        <rect x="-18" y="-5" width="76" height="28" rx="2" fill="#b0e0f0" opacity="0.3"/>
        <!-- window mullions -->
        <line x1="0" y1="-5" x2="0" y2="23" stroke="#d8c8a8" stroke-width="2"/>
        <line x1="22" y1="-5" x2="22" y2="23" stroke="#d8c8a8" stroke-width="2"/>
        <line x1="44" y1="-5" x2="44" y2="23" stroke="#d8c8a8" stroke-width="2"/>
        <!-- cabin door -->
        <rect x="-20" y="35" width="18" height="20" rx="1" fill="#8b5a3c"/>
        <circle cx="-5" cy="45" r="1.5" fill="#d4a040"/>
        <!-- roof overhang -->
        <path d="M-30,-15 L100,-15 L95,-22 L-25,-22 Z" fill="#c0392b"/>
        <rect x="-25" y="-22" width="90" height="8" rx="2" fill="#a03020"/>
      </g>

      <!-- FUNNEL -->
      <g id="funnel">
        <rect x="20" y="-55" width="22" height="45" rx="3" fill="url(#funnelGrad)"/>
        <rect x="18" y="-55" width="26" height="8" rx="2" fill="#2a1810"/>
        <!-- gold band -->
        <rect x="20" y="-30" width="22" height="5" fill="#d4a040"/>
        <!-- puffs -->
        <g transform="translate(31,-58)">
          <circle class="puff" cx="0" cy="0" r="8" fill="#c8c0b0" opacity="0.4"/>
          <circle class="puff" cx="0" cy="0" r="7" fill="#b8b0a0" opacity="0.35"/>
          <circle class="puff" cx="0" cy="0" r="6" fill="#d0c8b8" opacity="0.3"/>
        </g>
      </g>

      <!-- FLAG on mast -->
      <g id="mast-flag" transform="translate(70,-22)">
        <line x1="0" y1="0" x2="0" y2="-40" stroke="#6b4228" stroke-width="2.5"/>
        <path id="flag" d="M0,-38 Q8,-41 16,-38 T32,-38 L32,-28 Q24,-26 16,-28 T0,-28 Z" fill="#e74c3c"/>
        <circle cx="0" cy="-40" r="2" fill="#d4a040"/>
      </g>

      <!-- SHIP'S WHEEL -->
      <g id="wheel-mount" transform="translate(48, 38)">
        <rect x="-2" y="-8" width="4" height="16" fill="#6b4228"/>
        <g id="ships-wheel">
          <circle cx="0" cy="0" r="14" fill="none" stroke="#8b5a3c" stroke-width="3"/>
          <circle cx="0" cy="0" r="4" fill="#a07040"/>
          <!-- spokes -->
          <line x1="0" y1="-14" x2="0" y2="-4" stroke="#8b5a3c" stroke-width="2"/>
          <line x1="0" y1="4" x2="0" y2="14" stroke="#8b5a3c" stroke-width="2"/>
          <line x1="-14" y1="0" x2="-4" y2="0" stroke="#8b5a3c" stroke-width="2"/>
          <line x1="4" y1="0" x2="14" y2="0" stroke="#8b5a3c" stroke-width="2"/>
          <line x1="-10" y1="-10" x2="-3" y2="-3" stroke="#8b5a3c" stroke-width="1.8"/>
          <line x1="10" y1="10" x2="3" y2="3" stroke="#8b5a3c" stroke-width="1.8"/>
          <line x1="10" y1="-10" x2="3" y2="-3" stroke="#8b5a3c" stroke-width="1.8"/>
          <line x1="-10" y1="10" x2="-3" y2="3" stroke="#8b5a3c" stroke-width="1.8"/>
        </g>
      </g>

      <!-- LIFE RING on cabin side -->
      <g transform="translate(-8, 40)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#e74c3c" stroke-width="3"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#f2e8d5" stroke-width="1.5" stroke-dasharray="4 6"/>
      </g>

      <!-- PROPELLER (stern, left side — spins CW for rightward drive) -->
      <g id="prop-mount" transform="translate(-165, 95)">
        <!-- shaft -->
        <rect x="0" y="-2" width="14" height="4" fill="#4a4038"/>
        <g id="propeller">
          <circle cx="0" cy="0" r="3" fill="#8a8070"/>
          <!-- 3 blades -->
          <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#a09888" transform="rotate(0)"/>
          <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#a09888" transform="rotate(120)"/>
          <ellipse cx="0" cy="-10" rx="3.5" ry="9" fill="#a09888" transform="rotate(240)"/>
        </g>
        <!-- splash at prop -->
        <ellipse cx="-6" cy="4" rx="12" ry="4" fill="#8ec8e0" opacity="0.5"/>
      </g>

      <!-- ===== OTTER CAPTAIN ===== -->
      <g id="otter-root" transform="translate(48, -5)">
        <!-- body (bobbing independently) -->
        <g id="otter-body">
          <!-- tail (behind, independent sway) -->
          <g id="otter-tail" transform="translate(-22, 38)">
            <path d="M0,0 Q-20,8 -38,4 Q-42,10 -30,14 Q-12,18 0,12 Z" fill="url(#otterFur)"/>
            <path d="M-8,2 Q-20,6 -30,5" stroke="#5a3520" stroke-width="1" fill="none" opacity="0.5"/>
          </g>

          <!-- torso -->
          <ellipse cx="0" cy="28" rx="22" ry="28" fill="url(#otterFur)"/>
          <!-- belly -->
          <ellipse cx="4" cy="32" rx="14" ry="18" fill="#d4a574"/>
          <!-- chest fur tuft -->
          <ellipse cx="8" cy="22" rx="6" ry="5" fill="#e0b888" opacity="0.6"/>

          <!-- LEFT ARM on wheel (shoulder at top-right of body) -->
          <g id="otter-arm-wheel" transform="translate(14, 18)">
            <!-- upper arm + forearm toward wheel -->
            <path d="M0,0 Q12,6 22,14 Q26,18 22,20 Q14,16 0,8 Z" fill="#8b5a3c"/>
            <!-- paw on wheel -->
            <ellipse cx="24" cy="18" rx="6" ry="5" fill="#a07048"/>
            <!-- claws -->
            <circle cx="26" cy="15" r="1" fill="#2c1810"/>
            <circle cx="28" cy="17" r="1" fill="#2c1810"/>
            <circle cx="27" cy="20" r="1" fill="#2c1810"/>
          </g>

          <!-- RIGHT ARM free (points ahead = right) -->
          <g id="otter-arm-free" transform="translate(-8, 16)">
            <path d="M0,0 Q-6,12 -4,24 Q-2,28 2,26 Q4,16 4,4 Z" fill="#8b5a3c"/>
            <ellipse cx="0" cy="28" rx="5" ry="4.5" fill="#a07048"/>
            <circle cx="-2" cy="30" r="1" fill="#2c1810"/>
            <circle cx="1" cy="31" r="1" fill="#2c1810"/>
            <circle cx="3" cy="29" r="1" fill="#2c1810"/>
          </g>

          <!-- hind feet on deck -->
          <ellipse cx="-6" cy="52" rx="9" ry="5" fill="#6b4228"/>
          <ellipse cx="10" cy="52" rx="9" ry="5" fill="#6b4228"/>
          <!-- toes -->
          <circle cx="-12" cy="54" r="1.5" fill="#5a3520"/>
          <circle cx="-6" cy="55" r="1.5" fill="#5a3520"/>
          <circle cx="0" cy="54" r="1.5" fill="#5a3520"/>
          <circle cx="4" cy="55" r="1.5" fill="#5a3520"/>
          <circle cx="10" cy="55" r="1.5" fill="#5a3520"/>
          <circle cx="16" cy="54" r="1.5" fill="#5a3520"/>

          <!-- HEAD (independent look-around) -->
          <g id="otter-head" transform="translate(6, -8)">
            <!-- skull -->
            <ellipse cx="0" cy="0" rx="18" ry="16" fill="url(#otterFur)"/>
            <!-- muzzle -->
            <ellipse cx="10" cy="6" rx="12" ry="9" fill="#d4a574"/>
            <!-- nose -->
            <ellipse cx="18" cy="4" rx="4" ry="3" fill="#2c1810"/>
            <ellipse cx="17" cy="3" rx="1.5" ry="1" fill="#555" opacity="0.5"/>
            <!-- mouth -->
            <path d="M14,8 Q16,11 18,8" stroke="#2c1810" stroke-width="1" fill="none"/>

            <!-- eyes -->
            <g id="otter-eyes">
              <ellipse cx="6" cy="-2" rx="3.2" ry="3.5" fill="#1a1008"/>
              <circle cx="7" cy="-3" r="1.2" fill="#f5e6c8"/>
              <ellipse cx="-6" cy="-1" rx="2.8" ry="3.2" fill="#1a1008"/>
              <circle cx="-5" cy="-2" r="1" fill="#f5e6c8"/>
            </g>

            <!-- ears -->
            <g id="otter-ear-l">
              <ellipse cx="-12" cy="-12" rx="5" ry="4.5" fill="#6b4228"/>
              <ellipse cx="-12" cy="-12" rx="2.5" ry="2.2" fill="#c48860"/>
            </g>
            <g id="otter-ear-r">
              <ellipse cx="4" cy="-14" rx="5" ry="4.5" fill="#6b4228"/>
              <ellipse cx="4" cy="-14" rx="2.5" ry="2.2" fill="#c48860"/>
            </g>

            <!-- whiskers -->
            <g id="otter-whiskers" stroke="#f5e6c8" stroke-width="0.8" opacity="0.85">
              <line x1="14" y1="6" x2="30" y2="2"/>
              <line x1="14" y1="8" x2="30" y2="8"/>
              <line x1="14" y1="10" x2="28" y2="14"/>
              <line x1="8" y1="7" x2="-6" y2="4"/>
              <line x1="8" y1="9" x2="-4" y2="10"/>
            </g>

            <!-- CAPTAIN CAP -->
            <g id="cap">
              <ellipse cx="-2" cy="-14" rx="16" ry="8" fill="#1a3a5a"/>
              <ellipse cx="-2" cy="-18" rx="12" ry="7" fill="#2a5a7a"/>
              <rect x="-4" y="-22" width="8" height="6" rx="2" fill="#c0392b"/>
              <g id="cap-brim">
                <path d="M-18,-12 Q-2,-8 14,-12 L14,-10 Q-2,-6 -18,-10 Z" fill="#0f2a3a"/>
              </g>
              <!-- gold badge -->
              <circle cx="-2" cy="-20" r="2.5" fill="#d4a040"/>
            </g>
          </g>
        </g>
      </g>

      <!-- deck cargo crates (add character) -->
      <g transform="translate(-100, 40)">
        <rect x="0" y="0" width="22" height="16" rx="1" fill="#8b6a40"/>
        <line x1="0" y1="8" x2="22" y2="8" stroke="#6b4a28" stroke-width="1"/>
        <line x1="11" y1="0" x2="11" y2="16" stroke="#6b4a28" stroke-width="1"/>
        <rect x="18" y="4" width="16" height="12" rx="1" fill="#7a5a38"/>
        <line x1="18" y1="10" x2="34" y2="10" stroke="#5a4020" stroke-width="1"/>
      </g>

      <!-- rope coil -->
      <g transform="translate(-130, 52)">
        <ellipse cx="0" cy="0" rx="8" ry="4" fill="none" stroke="#c8a868" stroke-width="1.5"/>
        <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="none" stroke="#c8a868" stroke-width="1.2"/>
      </g>
    </g>

    <!-- ========== LAYER 5: NEAR WATER / FOREGROUND waves (fastest) ========== -->
    <g class="layer-water-near">
      <g fill="none" stroke-linecap="round">
        <!-- large foreground wave shapes, tile 480 -->
        <path d="M-20,620 Q40,600 100,620 T220,620 T340,620 T460,620" stroke="#0d4058" stroke-width="18" opacity="0.55"/>
        <path d="M-20,650 Q60,630 140,650 T300,650 T460,650" stroke="#0a3550" stroke-width="22" opacity="0.65"/>
        <path d="M-20,680 Q50,665 120,680 T260,680 T400,680 T540,680" stroke="#082a40" stroke-width="20" opacity="0.7"/>
        <!-- foam crests -->
        <path d="M40,615 Q50,610 60,615" stroke="#8ec8e0" stroke-width="2" opacity="0.4"/>
        <path d="M180,645 Q195,638 210,645" stroke="#8ec8e0" stroke-width="2" opacity="0.35"/>
        <path d="M320,675 Q340,668 360,675" stroke="#8ec8e0" stroke-width="2" opacity="0.3"/>
        <!-- second tile +480 -->
        <path d="M460,620 Q520,600 580,620 T700,620 T820,620 T940,620" stroke="#0d4058" stroke-width="18" opacity="0.55"/>
        <path d="M460,650 Q540,630 620,650 T780,650 T940,650" stroke="#0a3550" stroke-width="22" opacity="0.65"/>
        <path d="M460,680 Q530,665 600,680 T740,680 T880,680 T1020,680" stroke="#082a40" stroke-width="20" opacity="0.7"/>
        <path d="M520,615 Q530,610 540,615" stroke="#8ec8e0" stroke-width="2" opacity="0.4"/>
        <path d="M660,645 Q675,638 690,645" stroke="#8ec8e0" stroke-width="2" opacity="0.35"/>
        <path d="M800,675 Q820,668 840,675" stroke="#8ec8e0" stroke-width="2" opacity="0.3"/>
      </g>
    </g>

    <!-- ambient vignette -->
    <rect width="1200" height="700" fill="url(#skyGrad)" opacity="0" pointer-events="none"/>
  </svg>
</div>
</body>
</html>
