<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Otter Ferry — 水獭摆渡</title>
<style>
  :root {
    --sky-high: #0f2a3a;
    --sky-mid: #1e4d5c;
    --sky-low: #c46b4a;
    --horizon: #e8a87c;
    --sun: #f4d35e;
    --water-far: #0a2830;
    --water-mid: #143d48;
    --water-near: #0d2b33;
    --foam: #9ec4c8;
    --hull: #a84828;
    --hull-dark: #6e2e18;
    --deck: #d4b483;
    --deck-dark: #a88b5c;
    --cabin: #f0e6d3;
    --cabin-trim: #2a4a52;
    --otter-fur: #5c3a22;
    --otter-dark: #3d2414;
    --otter-belly: #c9a07a;
    --otter-nose: #1a1008;
    --flag: #e85d4c;
    --lantern: #ffcc66;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-high);
  }

  body {
    display: flex;
    align-items: stretch;
    justify-content: center;
  }

  .scene-wrap {
    width: 100%;
    height: 100%;
    position: relative;
  }

  svg#ferry-scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── parallax layers: translate loops of duplicated strip ── */
  @keyframes drift-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }
  @keyframes drift-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }
  @keyframes drift-near {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  .layer-far  { animation: drift-far  80s linear infinite; }
  .layer-mid  { animation: drift-mid  36s linear infinite; }
  .layer-near { animation: drift-near 14s linear infinite; }

  /* water shimmer bands */
  @keyframes shimmer {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 0.45; }
  }
  .shimmer-a { animation: shimmer 4.2s ease-in-out infinite; }
  .shimmer-b { animation: shimmer 5.8s ease-in-out infinite 1.1s; }
  .shimmer-c { animation: shimmer 3.4s ease-in-out infinite 0.6s; }

  /* ferry hull bob + slight pitch (facing right) */
  @keyframes ferry-bob {
    0%   { transform: translate(0, 0)    rotate(0deg); }
    25%  { transform: translate(8px, -6px) rotate(-1.2deg); }
    50%  { transform: translate(16px, 2px)  rotate(0deg); }
    75%  { transform: translate(8px, -4px)  rotate(1.0deg); }
    100% { transform: translate(0, 0)    rotate(0deg); }
  }
  .ferry-rig {
    animation: ferry-bob 6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 80%;
  }

  /* paddle wheel: clockwise when viewed from stern → propels right */
  @keyframes spin-paddle {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .paddle-wheel {
    animation: spin-paddle 1.6s linear infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  /* smoke puffs rising & drifting LEFT (relative wind of forward motion) */
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(0.4); opacity: 0.7; }
    40%  { opacity: 0.5; }
    100% { transform: translate(-70px, -90px) scale(1.6); opacity: 0; }
  }
  .puff-1 { animation: puff 3.2s ease-out infinite; }
  .puff-2 { animation: puff 3.2s ease-out infinite 1.1s; }
  .puff-3 { animation: puff 3.2s ease-out infinite 2.15s; }

  /* otter body micro-bob independent of ferry (breathing + balance) */
  @keyframes otter-torso {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .otter-torso {
    animation: otter-torso 1.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  /* arm on wheel: small steering oscillation, phase-offset from ferry */
  @keyframes steer-arm {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(8deg); }
  }
  .arm-steer {
    animation: steer-arm 2.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 80% 20%;
  }

  /* free arm waving: larger independent swing */
  @keyframes wave-arm {
    0%   { transform: rotate(20deg); }
    25%  { transform: rotate(-35deg); }
    50%  { transform: rotate(15deg); }
    75%  { transform: rotate(-28deg); }
    100% { transform: rotate(20deg); }
  }
  .arm-wave {
    animation: wave-arm 1.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 10% 15%;
  }

  /* tail sway: slow, opposite phase to torso */
  @keyframes tail-sway {
    0%, 100% { transform: rotate(8deg); }
    50%      { transform: rotate(-12deg); }
  }
  .otter-tail {
    animation: tail-sway 2.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 0% 40%;
  }

  /* head look-around (subtle) */
  @keyframes head-look {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-5deg); }
    70%      { transform: rotate(4deg); }
  }
  .otter-head {
    animation: head-look 3.8s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 90%;
  }

  /* ear twitch */
  @keyframes ear-twitch {
    0%, 85%, 100% { transform: rotate(0deg); }
    88%           { transform: rotate(-18deg); }
    92%           { transform: rotate(6deg); }
  }
  .ear-l {
    animation: ear-twitch 4.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 80% 80%;
  }
  .ear-r {
    animation: ear-twitch 4.5s ease-in-out infinite 0.3s;
    transform-box: fill-box;
    transform-origin: 20% 80%;
  }

  /* flag flutter */
  @keyframes flag-flap {
    0%, 100% { transform: skewY(0deg) scaleX(1); }
    50%      { transform: skewY(4deg) scaleX(0.88); }
  }
  .flag {
    animation: flag-flap 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 0% 50%;
  }

  /* lantern glow pulse */
  @keyframes lantern-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
  .lantern-glow {
    animation: lantern-pulse 2.8s ease-in-out infinite;
  }

  /* wake foam strips */
  @keyframes wake-slide {
    from { transform: translateX(0); opacity: 0.85; }
    to   { transform: translateX(60px); opacity: 0; }
  }
  .wake-1 { animation: wake-slide 1.8s linear infinite; }
  .wake-2 { animation: wake-slide 1.8s linear infinite 0.45s; }
  .wake-3 { animation: wake-slide 1.8s linear infinite 0.9s; }
  .wake-4 { animation: wake-slide 1.8s linear infinite 1.35s; }

  /* birds far away */
  @keyframes bird-glide {
    from { transform: translateX(0); }
    to   { transform: translateX(-40px); }
  }
  .bird-flock {
    animation: bird-glide 12s ease-in-out infinite alternate;
  }

  /* caption fade-in once */
  @keyframes caption-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 0.85; transform: translateY(0); }
  }
  .caption {
    animation: caption-in 1.4s ease-out 0.6s both;
  }

  /* reduced motion: freeze non-essential */
  @media (prefers-reduced-motion: reduce) {
    .layer-far, .layer-mid, .layer-near,
    .shimmer-a, .shimmer-b, .shimmer-c,
    .puff-1, .puff-2, .puff-3,
    .bird-flock,
    .wake-1, .wake-2, .wake-3, .wake-4 { animation: none; }
    .ferry-rig, .otter-torso, .arm-steer, .arm-wave,
    .otter-tail, .otter-head, .ear-l, .ear-r,
    .paddle-wheel, .flag, .lantern-glow {
      animation-duration: 8s;
      animation-iteration-count: 1;
    }
  }
</style>
</head>
<body>
<div class="scene-wrap">
<svg id="ferry-scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只水獭驾着渡船在黄昏水面朝右航行">
  <defs>
    <!-- sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f2a3a"/>
      <stop offset="45%"  stop-color="#1e4d5c"/>
      <stop offset="78%"  stop-color="#c46b4a"/>
      <stop offset="100%" stop-color="#e8a87c"/>
    </linearGradient>
    <!-- water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a5060"/>
      <stop offset="40%"  stop-color="#0f3540"/>
      <stop offset="100%" stop-color="#071c22"/>
    </linearGradient>
    <!-- sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#f4d35e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8a87c" stop-opacity="0"/>
    </radialGradient>
    <!-- cabin window warm light -->
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffcc66" stop-opacity="0"/>
    </radialGradient>
    <!-- soft cloud filter -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <filter id="heavyBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ═══════════════ SKY ═══════════════ -->
  <rect x="0" y="0" width="800" height="320" fill="url(#skyGrad)"/>

  <!-- sun -->
  <circle cx="620" cy="250" r="90" fill="url(#sunGlow)"/>
  <circle cx="620" cy="250" r="28" fill="#ffe08a" opacity="0.95"/>

  <!-- far clouds (slowest parallax) -->
  <g class="layer-far" opacity="0.55">
    <g filter="url(#softBlur)">
      <!-- strip repeated every 800 for seamless loop: original + copy -->
      <ellipse cx="120" cy="70" rx="70" ry="18" fill="#2a5566"/>
      <ellipse cx="160" cy="62" rx="50" ry="14" fill="#2a5566"/>
      <ellipse cx="400" cy="90" rx="90" ry="16" fill="#356070"/>
      <ellipse cx="450" cy="82" rx="55" ry="12" fill="#356070"/>
      <ellipse cx="700" cy="55" rx="60" ry="14" fill="#2a5566"/>
      <!-- seamless second copy -->
      <ellipse cx="920" cy="70" rx="70" ry="18" fill="#2a5566"/>
      <ellipse cx="960" cy="62" rx="50" ry="14" fill="#2a5566"/>
      <ellipse cx="1200" cy="90" rx="90" ry="16" fill="#356070"/>
      <ellipse cx="1250" cy="82" rx="55" ry="12" fill="#356070"/>
      <ellipse cx="1500" cy="55" rx="60" ry="14" fill="#2a5566"/>
    </g>
  </g>

  <!-- distant birds -->
  <g class="bird-flock" opacity="0.4">
    <path d="M180 120 q6 -6 12 0" stroke="#0a2030" stroke-width="1.5" fill="none"/>
    <path d="M200 128 q5 -5 10 0" stroke="#0a2030" stroke-width="1.3" fill="none"/>
    <path d="M195 112 q4 -4 8 0" stroke="#0a2030" stroke-width="1.2" fill="none"/>
    <path d="M520 100 q6 -6 12 0" stroke="#0a2030" stroke-width="1.5" fill="none"/>
    <path d="M538 108 q5 -5 10 0" stroke="#0a2030" stroke-width="1.3" fill="none"/>
  </g>

  <!-- ═══════════════ FAR HILLS (parallax layer 1) ═══════════════ -->
  <g class="layer-far" opacity="0.7">
    <path d="M0 280
             Q80 230 160 260
             Q240 220 320 255
             Q400 225 480 250
             Q560 230 640 258
             Q720 235 800 265
             L800 320 L0 320 Z"
          fill="#1a3d48"/>
    <!-- seamless copy -->
    <path d="M800 280
             Q880 230 960 260
             Q1040 220 1120 255
             Q1200 225 1280 250
             Q1360 230 1440 258
             Q1520 235 1600 265
             L1600 320 L800 320 Z"
          fill="#1a3d48"/>
  </g>

  <!-- ═══════════════ MID ISLANDS (parallax layer 2) ═══════════════ -->
  <g class="layer-mid" opacity="0.85">
    <!-- island A + trees -->
    <ellipse cx="100" cy="300" rx="90" ry="22" fill="#0e3540"/>
    <path d="M70 300 L78 250 L86 300 Z" fill="#0a2a32"/>
    <path d="M88 300 L98 235 L108 300 Z" fill="#0c3038"/>
    <path d="M108 300 L115 255 L122 300 Z" fill="#0a2a32"/>
    <!-- island B + lighthouse hint -->
    <ellipse cx="380" cy="295" rx="55" ry="16" fill="#0e3540"/>
    <rect x="375" y="250" width="8" height="48" fill="#0a2a32"/>
    <rect x="373" y="246" width="12" height="8" rx="1" fill="#1a4050"/>
    <circle cx="379" cy="242" r="3" fill="#ffcc66" opacity="0.7"/>
    <!-- island C -->
    <ellipse cx="650" cy="305" rx="110" ry="20" fill="#0e3540"/>
    <path d="M620 305 L630 260 L640 305 Z" fill="#0a2a32"/>
    <path d="M645 305 L658 245 L671 305 Z" fill="#0c3038"/>
    <path d="M675 305 L682 265 L689 305 Z" fill="#0a2a32"/>

    <!-- seamless copies (offset +800) -->
    <ellipse cx="900" cy="300" rx="90" ry="22" fill="#0e3540"/>
    <path d="M870 300 L878 250 L886 300 Z" fill="#0a2a32"/>
    <path d="M888 300 L898 235 L908 300 Z" fill="#0c3038"/>
    <path d="M908 300 L915 255 L922 300 Z" fill="#0a2a32"/>
    <ellipse cx="1180" cy="295" rx="55" ry="16" fill="#0e3540"/>
    <rect x="1175" y="250" width="8" height="48" fill="#0a2a32"/>
    <rect x="1173" y="246" width="12" height="8" rx="1" fill="#1a4050"/>
    <circle cx="1179" cy="242" r="3" fill="#ffcc66" opacity="0.7"/>
    <ellipse cx="1450" cy="305" rx="110" ry="20" fill="#0e3540"/>
    <path d="M1420 305 L1430 260 L1440 305 Z" fill="#0a2a32"/>
    <path d="M1445 305 L1458 245 L1471 305 Z" fill="#0c3038"/>
    <path d="M1475 305 L1482 265 L1489 305 Z" fill="#0a2a32"/>
  </g>

  <!-- ═══════════════ WATER ═══════════════ -->
  <rect x="0" y="310" width="800" height="190" fill="url(#waterGrad)"/>

  <!-- sun reflection strip on water -->
  <rect x="580" y="310" width="80" height="190" fill="#e8a87c" opacity="0.12"/>
  <rect x="600" y="310" width="40" height="120" fill="#ffe08a" opacity="0.08"/>

  <!-- near water ripple bands (fastest parallax) -->
  <g class="layer-near">
    <path d="M0 340 Q40 336 80 340 T160 340 T240 340 T320 340 T400 340 T480 340 T560 340 T640 340 T720 340 T800 340"
          stroke="#1a5565" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M0 370 Q50 365 100 370 T200 370 T300 370 T400 370 T500 370 T600 370 T700 370 T800 370"
          stroke="#1a5565" stroke-width="1.2" fill="none" opacity="0.3"/>
    <path d="M0 410 Q45 404 90 410 T180 410 T270 410 T360 410 T450 410 T540 410 T630 410 T720 410 T810 410"
          stroke="#0f3a45" stroke-width="1.4" fill="none" opacity="0.4"/>
    <path d="M0 450 Q55 444 110 450 T220 450 T330 450 T440 450 T550 450 T660 450 T770 450 T880 450"
          stroke="#0f3a45" stroke-width="1.1" fill="none" opacity="0.35"/>
    <!-- seamless second copy of ripples -->
    <path d="M800 340 Q840 336 880 340 T960 340 T1040 340 T1120 340 T1200 340 T1280 340 T1360 340 T1440 340 T1520 340 T1600 340"
          stroke="#1a5565" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M800 370 Q850 365 900 370 T1000 370 T1100 370 T1200 370 T1300 370 T1400 370 T1500 370 T1600 370"
          stroke="#1a5565" stroke-width="1.2" fill="none" opacity="0.3"/>
    <path d="M800 410 Q845 404 890 410 T980 410 T1070 410 T1160 410 T1250 410 T1340 410 T1430 410 T1520 410 T1610 410"
          stroke="#0f3a45" stroke-width="1.4" fill="none" opacity="0.4"/>
    <path d="M800 450 Q855 444 910 450 T1020 450 T1130 450 T1240 450 T1350 450 T1460 450 T1570 450 T1680 450 T1790 450"
          stroke="#0f3a45" stroke-width="1.1" fill="none" opacity="0.35"/>
  </g>

  <!-- shimmer highlights -->
  <g opacity="0.5">
    <rect class="shimmer-a" x="100" y="355" width="40" height="2" rx="1" fill="#9ec4c8"/>
    <rect class="shimmer-b" x="300" y="390" width="55" height="2" rx="1" fill="#9ec4c8"/>
    <rect class="shimmer-c" x="500" y="340" width="35" height="2" rx="1" fill="#b8d4d8"/>
    <rect class="shimmer-a" x="700" y="420" width="48" height="2" rx="1" fill="#9ec4c8"/>
    <rect class="shimmer-b" x="200" y="450" width="30" height="2" rx="1" fill="#9ec4c8"/>
  </g>

  <!-- ═══════════════ WAKE (behind ferry, trails left = motion right) ═══════════════ -->
  <g transform="translate(280, 400)">
    <ellipse class="wake-1" cx="-20" cy="8"  rx="28" ry="5" fill="#9ec4c8" opacity="0.5"/>
    <ellipse class="wake-2" cx="-55" cy="14" rx="35" ry="4" fill="#9ec4c8" opacity="0.4"/>
    <ellipse class="wake-3" cx="-90" cy="10" rx="40" ry="3.5" fill="#9ec4c8" opacity="0.3"/>
    <ellipse class="wake-4" cx="-130" cy="16" rx="45" ry="3" fill="#9ec4c8" opacity="0.25"/>
  </g>

  <!-- ═══════════════ FERRY RIG ═══════════════ -->
  <!-- positioned so hull sits ~y=340-420, bow faces RIGHT -->
  <g class="ferry-rig" transform="translate(280, 320)">

    <!-- smoke stack puffs (drift left = vessel moves right) -->
    <g transform="translate(-15, -20)">
      <circle class="puff-1" cx="0"  cy="0"  r="8"  fill="#4a6a72" opacity="0.5"/>
      <circle class="puff-2" cx="0"  cy="0"  r="8"  fill="#4a6a72" opacity="0.5"/>
      <circle class="puff-3" cx="0"  cy="0"  r="8"  fill="#4a6a72" opacity="0.5"/>
    </g>

    <!-- ── hull (bow pointed right, stern square left) ── -->
    <path d="M-110 90
             L-110 55
             L-90 50
             L80 50
             Q115 50 130 70
             Q140 82 135 90
             L100 95
             L-90 95 Z"
          fill="#a84828"/>
    <!-- hull dark keel -->
    <path d="M-100 95 L100 95 L90 105 L-90 105 Z" fill="#6e2e18"/>
    <!-- hull stripe -->
    <path d="M-105 72 L125 72 L128 78 L-105 78 Z" fill="#d4b483" opacity="0.55"/>
    <!-- deck -->
    <path d="M-100 50 L85 50 L85 42 L-95 42 Z" fill="#d4b483"/>
    <path d="M-100 42 L85 42 L85 38 L-100 38 Z" fill="#a88b5c"/>

    <!-- bow rail (right side) -->
    <line x1="85" y1="38" x2="125" y2="55" stroke="#6e2e18" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="85" y1="28" x2="120" y2="48" stroke="#6e2e18" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="38" x2="85" y2="28" stroke="#6e2e18" stroke-width="2" stroke-linecap="round"/>
    <line x1="125" y1="55" x2="120" y2="48" stroke="#6e2e18" stroke-width="1.5" stroke-linecap="round"/>

    <!-- cabin -->
    <rect x="-40" y="0"  width="70" height="38" rx="3" fill="#f0e6d3"/>
    <rect x="-40" y="0"  width="70" height="6"  rx="2" fill="#2a4a52"/>
    <!-- cabin roof overhang -->
    <rect x="-48" y="-8" width="86" height="10" rx="2" fill="#2a4a52"/>
    <rect x="-48" y="-8" width="86" height="3"  rx="1" fill="#1a3540"/>

    <!-- cabin windows (warm glow) -->
    <rect x="-30" y="12" width="18" height="16" rx="2" fill="#ffcc66"/>
    <rect x="-8"  y="12" width="18" height="16" rx="2" fill="#ffcc66"/>
    <rect x="-30" y="12" width="18" height="16" rx="2" fill="url(#winGlow)" opacity="0.4"/>
    <rect x="-8"  y="12" width="18" height="16" rx="2" fill="url(#winGlow)" opacity="0.4"/>
    <!-- window mullions -->
    <line x1="-21" y1="12" x2="-21" y2="28" stroke="#2a4a52" stroke-width="1"/>
    <line x1="1"   y1="12" x2="1"   y2="28" stroke="#2a4a52" stroke-width="1"/>

    <!-- smokestack -->
    <rect x="-55" y="-28" width="14" height="28" rx="2" fill="#2a4a52"/>
    <rect x="-58" y="-32" width="20" height="6"  rx="1" fill="#1a3540"/>
    <rect x="-55" y="-18" width="14" height="3"  fill="#e85d4c"/>

    <!-- lantern on cabin roof -->
    <g transform="translate(20, -8)">
      <rect x="-3" y="-10" width="6" height="10" rx="1" fill="#6e2e18"/>
      <circle class="lantern-glow" cx="0" cy="-12" r="7" fill="url(#winGlow)"/>
      <circle cx="0" cy="-12" r="3.5" fill="#ffcc66"/>
    </g>

    <!-- flag pole + flag (aft/left, so flag trails left = motion right) -->
    <line x1="-95" y1="38" x2="-95" y2="-25" stroke="#6e2e18" stroke-width="2.5" stroke-linecap="round"/>
    <g class="flag">
      <path d="M-95 -25 L-125 -18 L-95 -10 Z" fill="#e85d4c"/>
      <path d="M-95 -25 L-125 -18 L-95 -10 Z" fill="#f4d35e" opacity="0.3"/>
    </g>

    <!-- ── paddle wheel (stern / left side) ── -->
    <!-- spins clockwise → water pushed left → thrust right ✓ -->
    <g class="paddle-wheel" transform="translate(-95, 72)">
      <circle r="22" fill="none" stroke="#6e2e18" stroke-width="3"/>
      <circle r="4"  fill="#6e2e18"/>
      <!-- 6 paddles -->
      <rect x="-2" y="-22" width="4" height="10" rx="1" fill="#a84828"/>
      <rect x="-2" y="12"  width="4" height="10" rx="1" fill="#a84828"/>
      <rect x="-22" y="-2" width="10" height="4" rx="1" fill="#a84828"/>
      <rect x="12"  y="-2" width="10" height="4" rx="1" fill="#a84828"/>
      <!-- diagonal paddles via rotated group -->
      <g transform="rotate(45)">
        <rect x="-2" y="-22" width="4" height="10" rx="1" fill="#8b3a20"/>
        <rect x="-2" y="12"  width="4" height="10" rx="1" fill="#8b3a20"/>
      </g>
      <g transform="rotate(-45)">
        <rect x="-2" y="-22" width="4" height="10" rx="1" fill="#8b3a20"/>
        <rect x="-2" y="12"  width="4" height="10" rx="1" fill="#8b3a20"/>
      </g>
      <!-- spokes -->
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#6e2e18" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="22"  stroke="#6e2e18" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-22" y2="0" stroke="#6e2e18" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="22" y2="0"  stroke="#6e2e18" stroke-width="1.5"/>
    </g>
    <!-- paddle wheel housing (partial cover) -->
    <path d="M-120 50 L-120 78 Q-95 95 -70 78 L-70 50"
          fill="none" stroke="#6e2e18" stroke-width="3"/>

    <!-- wheelhouse / steering wheel (forward cabin deck, open) -->
    <g transform="translate(45, 10)">
      <!-- small standing platform -->
      <rect x="-18" y="20" width="36" height="6" rx="1" fill="#a88b5c"/>
      <!-- steering wheel -->
      <circle cx="0" cy="0" r="14" fill="none" stroke="#6e2e18" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="2.5" fill="#6e2e18"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#6e2e18" stroke-width="2"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#6e2e18" stroke-width="2"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#6e2e18" stroke-width="1.5"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#6e2e18" stroke-width="1.5"/>
      <!-- wheel pedestal -->
      <rect x="-3" y="14" width="6" height="8" fill="#6e2e18"/>
    </g>

    <!-- ═══════════════ OTTER ═══════════════ -->
    <!-- standing on deck at wheel, body left of wheel, facing RIGHT -->
    <g class="otter-torso" transform="translate(18, -8)">

      <!-- TAIL (behind / left, independent sway) -->
      <g class="otter-tail" transform="translate(-18, 28)">
        <path d="M0 0
                 Q-20 8 -40 2
                 Q-55 -2 -65 10
                 Q-58 16 -45 12
                 Q-30 8 -12 10
                 Z"
              fill="#5c3a22"/>
        <path d="M-50 6 Q-58 4 -64 10" stroke="#3d2414" stroke-width="1" fill="none" opacity="0.5"/>
      </g>

      <!-- BODY / torso -->
      <ellipse cx="0" cy="28" rx="16" ry="22" fill="#5c3a22"/>
      <!-- belly patch -->
      <ellipse cx="4" cy="30" rx="9" ry="14" fill="#c9a07a"/>
      <!-- fur texture hints -->
      <path d="M-8 18 Q-4 22 -6 28" stroke="#3d2414" stroke-width="0.8" fill="none" opacity="0.4"/>
      <path d="M-6 35 Q-2 40 -4 46" stroke="#3d2414" stroke-width="0.8" fill="none" opacity="0.4"/>

      <!-- LEGS (short, on deck) -->
      <ellipse cx="-6" cy="50" rx="5" ry="4" fill="#3d2414"/>
      <ellipse cx="8"  cy="50" rx="5" ry="4" fill="#3d2414"/>

      <!-- ── ARM: STEERING (attached to wheel, oscillates) ── -->
      <g class="arm-steer" transform="translate(12, 16)">
        <!-- upper arm reaching forward-right toward wheel -->
        <path d="M0 0 Q10 4 18 8" stroke="#5c3a22" stroke-width="6" stroke-linecap="round" fill="none"/>
        <!-- paw on wheel -->
        <ellipse cx="20" cy="10" rx="4.5" ry="3.5" fill="#3d2414"/>
      </g>

      <!-- ── ARM: WAVING (free, large independent swing) ── -->
      <g class="arm-wave" transform="translate(-10, 14)">
        <!-- raised waving arm -->
        <path d="M0 0 Q-6 -12 -4 -22" stroke="#5c3a22" stroke-width="5.5" stroke-linecap="round" fill="none"/>
        <!-- paw -->
        <ellipse cx="-4" cy="-24" rx="4" ry="3.5" fill="#3d2414"/>
        <!-- little claws -->
        <line x1="-6" y1="-27" x2="-7" y2="-29" stroke="#1a1008" stroke-width="0.8"/>
        <line x1="-4" y1="-27" x2="-4" y2="-30" stroke="#1a1008" stroke-width="0.8"/>
        <line x1="-2" y1="-27" x2="-1" y2="-29" stroke="#1a1008" stroke-width="0.8"/>
      </g>

      <!-- HEAD (subtle look-around) -->
      <g class="otter-head" transform="translate(2, 2)">
        <!-- neck -->
        <ellipse cx="0" cy="8" rx="7" ry="6" fill="#5c3a22"/>
        <!-- skull -->
        <ellipse cx="2" cy="0" rx="12" ry="10" fill="#5c3a22"/>
        <!-- muzzle -->
        <ellipse cx="12" cy="3" rx="7" ry="5.5" fill="#5c3a22"/>
        <ellipse cx="14" cy="4" rx="5" ry="3.5" fill="#c9a07a"/>
        <!-- nose -->
        <ellipse cx="18" cy="3" rx="2.5" ry="2" fill="#1a1008"/>
        <!-- eyes -->
        <circle cx="6" cy="-2" r="2.2" fill="#1a1008"/>
        <circle cx="6.6" cy="-2.6" r="0.7" fill="#ffffff" opacity="0.7"/>
        <!-- cheek blush -->
        <ellipse cx="8" cy="5" rx="3" ry="1.5" fill="#c46b4a" opacity="0.35"/>

        <!-- EARS (twitch independently) -->
        <g class="ear-l">
          <ellipse cx="-4" cy="-9" rx="3.5" ry="4" fill="#5c3a22"/>
          <ellipse cx="-4" cy="-8" rx="2" ry="2.2" fill="#c9a07a"/>
        </g>
        <g class="ear-r">
          <ellipse cx="8" cy="-10" rx="3.5" ry="4" fill="#5c3a22"/>
          <ellipse cx="8" cy="-9" rx="2" ry="2.2" fill="#c9a07a"/>
        </g>

        <!-- whiskers -->
        <line x1="16" y1="2"  x2="26" y2="0"  stroke="#1a1008" stroke-width="0.6" opacity="0.5"/>
        <line x1="16" y1="4"  x2="26" y2="5"  stroke="#1a1008" stroke-width="0.6" opacity="0.5"/>
        <line x1="16" y1="6"  x2="25" y2="9"  stroke="#1a1008" stroke-width="0.6" opacity="0.5"/>

        <!-- captain's cap -->
        <ellipse cx="1" cy="-8" rx="10" ry="4" fill="#2a4a52"/>
        <rect x="-8" y="-14" width="18" height="7" rx="2" fill="#2a4a52"/>
        <rect x="-8" y="-14" width="18" height="2.5" rx="1" fill="#1a3540"/>
        <!-- cap badge -->
        <circle cx="1" cy="-11" r="2" fill="#f4d35e"/>
      </g>
    </g>
  </g>

  <!-- ═══════════════ FOREGROUND WATER DETAIL ═══════════════ -->
  <!-- slight dark vignette at bottom -->
  <rect x="0" y="440" width="800" height="60" fill="#071c22" opacity="0.35"/>

  <!-- ═══════════════ CAPTION ═══════════════ -->
  <g class="caption" transform="translate(24, 468)">
    <text font-family="Georgia, 'Times New Roman', serif"
          font-size="13" fill="#9ec4c8" letter-spacing="2">
      OTTER FERRY · 水獭摆渡
    </text>
    <text y="16" font-family="Georgia, 'Times New Roman', serif"
          font-size="10" fill="#9ec4c8" opacity="0.55" letter-spacing="1.5">
      heading east at dusk
    </text>
  </g>
</svg>
</div>
</body>
</html>
