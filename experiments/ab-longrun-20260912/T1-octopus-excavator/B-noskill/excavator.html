<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>章鱼开挖掘机 · Night Yard Run</title>
<!--
  GEOMETRY / VELOCITY NOTES (self-contained; mirrored in notes.md)

  1) Track loop speed vs vehicle speed
     ---------------------------------------------------------------
     Let vehicle ground speed be v (px/s, to the RIGHT).
     Let track contact patch be a closed loop (two semicircles + two straights).
     Outer loop length of one track belt:
         L = 2*S + 2*PI*R
         S = straight length between sprocket centers = 160 (px, scene units)
         R = sprocket radius = 34 (px)
         => L = 2*160 + 2*PI*34 = 320 + 213.63 = 533.63 px
     For rolling without slip on the ground:
         belt surface speed relative to the track frame = v
         (belt "moves" rearward relative to chassis at speed v)
     Therefore tread animation must complete one full loop (L px) in time
         T_loop = L / v
     We set vehicle speed v = 48 px/s (scene-space; also used for ground scroll).
         T_loop = 533.63 / 48 ≈ 11.117 s
     CSS uses:
         animation-duration: 11.117s;
         animation-timing-function: linear;
     Sprocket angular speed:
         omega = v / R = 48 / 34 ≈ 1.412 rad/s  (≈ 80.9 deg/s)
         => sprocket spin period = 2*PI*R / v = 213.63/48 ≈ 4.45 s
     Ground gravel / shadow scroll uses the same v (48 px/s) so the
     contact patch is consistent: vehicle advances 48 px while the belt
     tread graphic advances 48 px along its loop.

  2) Tentacles vs mechanical arm (relative motion)
     ---------------------------------------------------------------
     Mechanical arm: boom lift omega_b ≈ 0.55 rad/s (period ≈ 11.4 s)
                    stick curl  omega_s ≈ 0.90 rad/s (period ≈ 7.0 s)
                    bucket curl omega_k ≈ 1.40 rad/s (period ≈ 4.5 s)
     Octopus tentacles (4 visible):
         T1 (front-left reach)   phase 0.00, amp 8°,  period 2.8 s
         T2 (grip steering wheel) phase 0.33, amp 5°,  period 3.4 s
         T3 (brace on chassis)    phase 0.66, amp 6°,  period 2.1 s
         T4 (wave/rear curl)      phase 0.15, amp 12°, period 1.9 s
     None of these share a period or phase with boom/stick/bucket, so
     tentacle and arm motion is NOT phase-locked. Additionally, T2
     "steering grip" is constrained to a smaller amplitude around the
     wheel while T1/T4 free-wave — different kinematic constraints.

  3) Parallax (≥ 2 layers, we use 4)
     ---------------------------------------------------------------
     Layer  P (parallax factor)  scroll speed = P * v
     sky    0.00 (static, only slow cloud drift 2 px/s)
     far    0.12  → 5.76 px/s   distant gantries / cranes
     mid    0.35  → 16.8 px/s   warehouses / containers / lamp posts
     near   0.75  → 36.0 px/s   fence, rubble, oil drums
     ground 1.00  → 48.0 px/s   road gravel marks (matches vehicle v)

  Style: night industrial yard, ink+rust palette on deep slate.
  No external fonts/CDN. Single file. Double-click to open.
-->
<style>
  :root {
    --ink: #0c1116;
    --slate: #141c24;
    --slate-2: #1b2630;
    --steel: #2a3744;
    --rust: #c45c26;
    --rust-deep: #8a3a14;
    --amber: #f0a04b;
    --cream: #f3e6d0;
    --sea: #3d8f8a;
    --sea-bright: #5ec4b8;
    --sea-deep: #1f5c58;
    --bone: #e8dcc8;
    --dust: #6b5a48;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #070b0f;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse 120% 80% at 50% 100%, #1a2430 0%, #0c1218 45%, #070b0f 100%);
    overflow: hidden;
  }

  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---- HUD ---- */
  #hud {
    position: absolute;
    left: 18px; top: 16px;
    color: var(--cream);
    opacity: 0.85;
    letter-spacing: 0.08em;
    user-select: none;
    pointer-events: none;
    z-index: 10;
  }
  #hud .tag {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--amber);
    border-left: 3px solid var(--rust);
    padding-left: 8px;
    margin-bottom: 6px;
  }
  #hud h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  #hud .sub {
    font-size: 11px;
    opacity: 0.65;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index: 5;
  }

  /* ============================
     KEYFRAMES
     ============================ */

  /* Belt tread loop via stroke-dashoffset on a CLOSED path of length L.
     Shifting dashoffset by exactly -L on a closed path is always seamless
     (pattern wraps once around the belt). L = 2*160 + 2*π*34 = 533.63 px
     T_loop = L/v = 533.63/48 ≈ 11.117 s */
  @keyframes belt-dash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -533.63; }
  }

  /* Ground gravel near-bottom scroll */
  @keyframes ground-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-480px); }
  }

  /* Parallax layers: each tile pattern is 480px wide */
  @keyframes far-scroll  { from { transform: translateX(0);} to { transform: translateX(-57.6px);} }
  @keyframes mid-scroll  { from { transform: translateX(0);} to { transform: translateX(-168px);} }
  @keyframes near-scroll { from { transform: translateX(0);} to { transform: translateX(-360px);} }

  /* Clouds very slow */
  @keyframes cloud-drift { from { transform: translateX(0);} to { transform: translateX(-24px);} }

  /* Mechanical arm — independent periods, NOT locked to tentacles */
  @keyframes boom-lift {
    0%   { transform: rotate(-4deg); }
    40%  { transform: rotate(10deg); }
    70%  { transform: rotate(6deg); }
    100% { transform: rotate(-4deg); }
  }
  @keyframes stick-curl {
    0%   { transform: rotate(18deg); }
    35%  { transform: rotate(-12deg); }
    65%  { transform: rotate(-4deg); }
    100% { transform: rotate(18deg); }
  }
  @keyframes bucket-curl {
    0%   { transform: rotate(-8deg); }
    30%  { transform: rotate(22deg); }
    55%  { transform: rotate(10deg); }
    100% { transform: rotate(-8deg); }
  }

  /* Tentacles — four independent phases/periods */
  @keyframes tent-wave-1 {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(-10deg); }
  }
  @keyframes tent-wave-2 {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(6deg); }
  }
  @keyframes tent-wave-3 {
    0%,100% { transform: rotate(-2deg); }
    40%     { transform: rotate(7deg); }
    70%     { transform: rotate(1deg); }
  }
  @keyframes tent-wave-4 {
    0%,100% { transform: rotate(0deg); }
    35%     { transform: rotate(14deg); }
    70%     { transform: rotate(-6deg); }
  }

  /* Mantle breathing */
  @keyframes mantle-breathe {
    0%,100% { transform: scaleY(1) translateY(0); }
    50%     { transform: scaleY(1.04) translateY(-2px); }
  }

  /* Head slight bob relative to chassis (vehicle bounce) */
  @keyframes chassis-bounce {
    0%,100% { transform: translateY(0); }
    25%     { transform: translateY(-1.5px); }
    50%     { transform: translateY(0.5px); }
    75%     { transform: translateY(-1px); }
  }

  /* Dust puffs from tracks */
  @keyframes dust-puff {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.6); }
    100% { opacity: 0;    transform: translate(-40px,-18px) scale(1.6); }
  }

  /* Headlight flicker */
  @keyframes lamp-flicker {
    0%,100% { opacity: 0.92; }
    47%     { opacity: 0.92; }
    48%     { opacity: 0.55; }
    49%     { opacity: 0.95; }
    72%     { opacity: 0.88; }
    73%     { opacity: 0.7; }
  }

  /* Smoke from exhaust */
  @keyframes smoke-rise {
    0%   { opacity: 0.35; transform: translate(0,0) scale(0.5); }
    50%  { opacity: 0.2;  transform: translate(-18px,-28px) scale(1.1); }
    100% { opacity: 0;    transform: translate(-36px,-50px) scale(1.7); }
  }

  /* ---- Apply animations ---- */

  .belt-tread {
    animation: belt-dash 11.117s linear infinite;
  }
  .ground-gravel {
    animation: ground-scroll 10s linear infinite;
  }
  .layer-far  { animation: far-scroll  83.33s linear infinite; } /* 480/5.76 */
  .layer-mid  { animation: mid-scroll  28.57s linear infinite; } /* 480/16.8 */
  .layer-near { animation: near-scroll 13.33s linear infinite; } /* 480/36 */
  .layer-cloud { animation: cloud-drift 20s linear infinite; }

  /* Arm / tentacle / mantle motion is driven by SVG SMIL animateTransform
     inside nested translate() groups so pivots stay exact (CSS transform-origin
     on nested SVG is viewport-relative and easy to get wrong). CSS keyframes
     above document the intended angles for readability. */
  .chassis-bob { animation: chassis-bounce 0.85s ease-in-out infinite; }

  .dust-p1 { animation: dust-puff 0.9s ease-out infinite; }
  .dust-p2 { animation: dust-puff 0.9s ease-out infinite; animation-delay: -0.3s; }
  .dust-p3 { animation: dust-puff 0.9s ease-out infinite; animation-delay: -0.6s; }

  .lamp-glow { animation: lamp-flicker 5s ease-in-out infinite; }

  .smoke-1 { animation: smoke-rise 2.2s ease-out infinite; }
  .smoke-2 { animation: smoke-rise 2.2s ease-out infinite; animation-delay: -0.7s; }
  .smoke-3 { animation: smoke-rise 2.2s ease-out infinite; animation-delay: -1.4s; }

  /* subtle scan / grain overlay via CSS only */
  #grain {
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.06;
    z-index: 6;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(255,255,255,0.4) 1px,
      rgba(255,255,255,0.4) 2px
    );
    mix-blend-mode: overlay;
  }
</style>
</head>

            <circle cx="400" cy="268" r="2" fill="#1a4a48"/>
            <path d="M 394 270 Q 400 264 406 270" fill="none" stroke="#5ec4b8" stroke-width="1.5" opacity="0.5"/>

          <!-- TENTACLE 3 (brace on cab floor) — pivot (428,286), period 2.1s, amp 6° -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="-2 428 286; 7 428 286; 1 428 286; -2 428 286"
              keyTimes="0;0.4;0.7;1" dur="2.1s" repeatCount="indefinite"/>
            <path d="M 428 286 C 432 295, 440 302, 450 305 C 460 308, 465 302, 458 298"

          <!-- Hard hat -->
          <g id="hardhat">

    <!-- Foreground vignette dust near bottom -->
    <ellipse cx="200" cy="500" rx="180" ry="30" fill="#0c1116" opacity="0.35"/>

  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script>
/*
 * JS layer: live readout of geometric consistency + optional debug toggles.
 * The primary motion is pure CSS (no external deps). JS only:
 *  1) validates that the declared constants match the CSS animation durations
 *  2) paints a tiny canvas "consistency strip" showing relative periods
 *  3) exposes window.__geo for automated checks / human curiosity
 */
(function () {
  'use strict';

  // ----- Declared geometry (must stay in sync with CSS + SVG comments) -----
  var GEO = {
    v: 48,                 // vehicle ground speed px/s
    S: 160,                // track straight length between sprocket centers
    R: 34,                 // sprocket radius used for rolling loop length
    // L = 2*S + 2*PI*R
    get L() { return 2 * this.S + 2 * Math.PI * this.R; },
    get T_loop() { return this.L / this.v; },
    get omega_sprocket() { return this.v / this.R; },
    get T_sprocket() { return (2 * Math.PI * this.R) / this.v; },
    parallax: {
      far:  0.12,
      mid:  0.35,
      near: 0.75,
      ground: 1.00
    },
    // Independent periods (seconds) — tentacles vs arm
    periods: {
      boom: 11.4,
      stick: 7.0,
      bucket: 4.5,
      tent1: 2.8,
      tent2: 3.4,
      tent3: 2.1,
      tent4: 1.9
    }
  };

  // Round-trip check
  function nearlyEqual(a, b, eps) { return Math.abs(a - b) <= (eps || 0.05); }

  var expectedBelt = GEO.T_loop;          // 11.117...
  var cssBelt = 11.117;                   // hard-coded in CSS .belt-tread
  var expectedSprocket = GEO.T_sprocket;  // 4.451...
  var cssSprocket = 4.451;

  var checks = [];
  checks.push({
    name: 'belt loop duration ≈ L/v',
    ok: nearlyEqual(expectedBelt, cssBelt, 0.02),
    expected: expectedBelt.toFixed(4) + 's',
    actual: cssBelt + 's'
  });
  checks.push({
    name: 'sprocket period ≈ 2πR/v',
    ok: nearlyEqual(expectedSprocket, cssSprocket, 0.02),
    expected: expectedSprocket.toFixed(4) + 's',
    actual: cssSprocket + 's'
  });

  // Parallax speeds
  var parallaxSpeeds = {};
  Object.keys(GEO.parallax).forEach(function (k) {
    parallaxSpeeds[k] = GEO.parallax[k] * GEO.v;
  });

  // Period coprimality / non-lock check: gcd of tentacle periods vs arm periods
  function gcd2(a, b) { return b ? gcd2(b, a - Math.floor(b) * 0 + (b === 0 ? 0 : 0)) : a; }
  // simpler: check no exact integer ratio within tolerance
  function locked(p1, p2) {
    var r = p1 / p2;
    return nearlyEqual(r, Math.round(r), 0.02);
  }
  var armP = [GEO.periods.boom, GEO.periods.stick, GEO.periods.bucket];
  var tentP = [GEO.periods.tent1, GEO.periods.tent2, GEO.periods.tent3, GEO.periods.tent4];
  var anyLocked = false;
  armP.forEach(function (a) {
    tentP.forEach(function (t) {
      if (locked(a, t)) anyLocked = true;
    });
  });
  checks.push({
    name: 'tentacle periods NOT phase-locked to arm',
    ok: !anyLocked,
    expected: 'no integer ratio',
    actual: anyLocked ? 'LOCKED (bad)' : 'independent'
  });

  // Paint a tiny consistency strip in a hidden canvas (also proves canvas is used)
  var cv = document.createElement('canvas');
  cv.width = 240; cv.height = 36;
  cv.style.cssText = 'position:absolute;right:16px;top:16px;opacity:0.7;z-index:10;';
  var ctx = cv.getContext('2d');
  // bg
  ctx.fillStyle = 'rgba(12,17,22,0.75)';
  ctx.fillRect(0, 0, 240, 36);
  // bars for each period (normalized)
  var all = armP.concat(tentP);
  var maxP = Math.max.apply(null, all);
  all.forEach(function (p, i) {
    var w = (p / maxP) * 200;
    var y = 4 + i * 4;
    ctx.fillStyle = i < 3 ? '#c45c26' : '#3d8f8a';
    ctx.fillRect(8, y, w, 3);
  });
  ctx.fillStyle = '#f3e6d0';
  ctx.font = '9px sans-serif';
  ctx.fillText('periods', 200, 14);
  document.getElementById('stage').appendChild(cv);

  // Live readout
  var readout = document.getElementById('readout');
  function tick() {
    var t = (performance.now() / 1000).toFixed(1);
    readout.textContent =
      'v=' + GEO.v + 'px/s  L=' + GEO.L.toFixed(2) + 'px  T_loop=' + GEO.T_loop.toFixed(3) +
      's  ω_sprocket=' + GEO.omega_sprocket.toFixed(3) + 'rad/s  t=' + t + 's';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Expose for harness verification
  window.__geo = {
    GEO: GEO,
    checks: checks,
    parallaxSpeeds: parallaxSpeeds,
    css: { belt: cssBelt, sprocket: cssSprocket }
  };

  // Console summary
  console.log('[octo-excavator] geometry checks:');
  checks.forEach(function (c) {
    console.log((c.ok ? '  OK  ' : '  FAIL') + ' ' + c.name + '  expected=' + c.expected + ' actual=' + c.actual);
  });
  console.log('[octo-excavator] parallax speeds:', parallaxSpeeds);
  console.log('[octo-excavator] window.__geo ready');
})();
</script>
</body>
