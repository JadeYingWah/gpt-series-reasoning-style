<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .calc {
    width: min(340px, 94vw);
    background: #111827;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
  }
  .display {
    background: #0b1220;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    overflow: hidden;
  }
  .hist {
    color: #64748b;
    font-size: 15px;
    min-height: 20px;
    white-space: nowrap;
    overflow-x: auto;
  }
  .main {
    color: #f8fafc;
    font-size: 34px;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.2;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 16px 0;
    font-size: 20px;
    background: #1f2937;
    color: #e2e8f0;
    cursor: pointer;
    font-family: inherit;
    transition: filter .1s, transform .05s;
  }
  button:hover { filter: brightness(1.25); }
  button:active, button.pressed { transform: scale(.96); filter: brightness(1.4); }
  .fn { background: #334155; }
  .op { background: #3730a3; }
  .eq { background: #4f46e5; grid-row: span 2; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="hist" id="history"></div>
      <div class="main" id="main">0</div>
    </div>
    <div class="keys">
      <button data-key="C" class="fn">C</button>
      <button data-key="back" class="fn">⌫</button>
      <button data-key="/" class="op">÷</button>
      <button data-key="*" class="op">×</button>
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="-" class="op">−</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="+" class="op">+</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="=" class="eq">=</button>
      <button data-key="0" class="zero">0</button>
      <button data-key=".">.</button>
    </div>
  </div>
<script>
(function () {
  'use strict';
  var mainEl = document.getElementById('main');
  var histEl = document.getElementById('history');

  var OPS = {
    '+': function (a, b) { return a + b; },
    '-': function (a, b) { return a - b; },
    '*': function (a, b) { return a * b; },
    '/': function (a, b) { return a / b; }
  };
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  var display = '0';   // 当前显示的字符串
  var acc = null;      // 累加器（第一个操作数）
  var op = null;       // 待执行的运算符
  var fresh = true;    // 下一次数字输入是否开始新数
  var err = false;     // 错误状态（如除以 0）

  function fmt(n) {
    if (!isFinite(n)) return null;
    return parseFloat(n.toPrecision(12)).toString();
  }
  function render(hist) {
    mainEl.textContent = display;
    histEl.textContent = hist || '';
  }
  function clearAll() {
    display = '0'; acc = null; op = null; fresh = true; err = false;
    render('');
  }
  function showError() {
    err = true; display = '不能除以 0';
    acc = null; op = null; fresh = true;
    render('');
  }
  function inputDigit(d) {
    if (err) { // 错误后按数字直接重新开始
      display = d; acc = null; op = null; fresh = false; err = false;
      render(); return;
    }
    if (fresh) {
      display = d; fresh = false;
    } else {
      var digits = display.replace('-', '').replace('.', '').length;
      if (d === '0' && display === '0') { render(); return; }
      if (digits >= 15) { render(); return; }
      display = (display === '0') ? d : display + d;
    }
    render();
  }
  function inputDot() {
    if (err) return;
    if (fresh) { display = '0.'; fresh = false; render(); return; }
    if (display.indexOf('.') === -1) { display += '.'; }
    render();
  }
  function setOperator(o) {
    if (err) return;
    if (op !== null && !fresh) { // 链式运算：先算前一步
      var a = acc, b = parseFloat(display);
      var r = OPS[op](a, b);
      if (!isFinite(r)) { showError(); return; }
      acc = r; display = fmt(r);
    } else if (acc === null) { // 首次输入运算符
      acc = parseFloat(display);
    } else { // 连续按运算符：仅更换运算符
      op = o; render(fmt(acc) + ' ' + SYM[o]); return;
    }
    op = o; fresh = true;
    render(fmt(acc) + ' ' + SYM[o]);
  }
  function equals() {
    if (err || op === null || acc === null) return;
    var b = fresh ? acc : parseFloat(display); // "5 +" 后按 = 视为 5+5
    var r = OPS[op](acc, b);
    if (!isFinite(r)) { showError(); return; }
    var hist = fmt(acc) + ' ' + SYM[op] + ' ' + fmt(b) + ' =';
    display = fmt(r);
    acc = null; op = null; fresh = true;
    render(hist);
  }
  function backspace() {
    if (err || fresh) return;
    display = (display.length > 1) ? display.slice(0, -1) : '0';
    if (display === '-' || display === '-0') display = '0';
    render();
  }
  function handle(action) {
    if (action === 'C') { clearAll(); return; }
    if (action === 'back') { backspace(); return; }
    if (action === '=') { equals(); return; }
    if ('+-*/'.indexOf(action) > -1) { setOperator(action); return; }
    if (action === '.') { inputDot(); return; }
    if (/^[0-9]$/.test(action)) inputDigit(action);
  }

  // 鼠标：点击按钮执行；阻止 mousedown 默认聚焦，避免 Enter 误触发按钮
  var btns = document.querySelectorAll('button');
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener('click', function () { handle(b.getAttribute('data-key')); });
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  // 键盘：与鼠标行为一致
  var KEYMAP = {
    'Enter': '=', '=': '=', 'Backspace': 'back',
    'Escape': 'C', 'Delete': 'C', 'c': 'C', 'C': 'C',
    '.': '.', ',': '.'
  };
  document.addEventListener('keydown', function (e) {
    var k = e.key, action;
    if (/^[0-9]$/.test(k)) action = k;
    else if ('+-*/'.indexOf(k) > -1 && k.length === 1) action = k;
    else if (KEYMAP[k]) action = KEYMAP[k];
    else return;
    e.preventDefault();
    handle(action);
    var btn = document.querySelector('button[data-key="' + action + '"]');
    if (btn) {
      btn.classList.add('pressed');
      setTimeout(function () { btn.classList.remove('pressed'); }, 120);
    }
  });

  render('');
})();
</script>
</body>
</html>
