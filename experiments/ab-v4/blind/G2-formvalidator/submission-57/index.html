<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册表单 - 表单校验演示</title>
<style>
  :root {
    --error-color: #b42318;
    --error-shadow: rgba(180, 35, 24, .10);
    --success-color: #067647;
    --success-border: #17b26a;
    --success-bg: #ecfdf3;
    --success-border-soft: #abefc6;
    --border: #d0d5dd;
    --text: #101828;
    --label: #344054;
    --muted: #667085;
    --focus: #84caff;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, Arial, sans-serif;
    background: #f6f8fb;
    color: var(--text);
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .08);
    height: fit-content;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .desc { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--label); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    background: #fff;
    color: var(--text);
  }
  input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(76, 164, 255, .18); }
  .hint { font-size: 13px; margin: 6px 0 0; min-height: 18px; line-height: 18px; color: var(--muted); }
  .field.error input { border-color: var(--error-color); box-shadow: 0 0 0 3px var(--error-shadow); }
  .field.error .hint { color: var(--error-color); font-weight: 500; }
  .field.success input { border-color: var(--success-border); }
  .field.success .hint { color: var(--success-color); }
  .actions { margin-top: 24px; }
  button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #1570ef;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #175cd3; }
  button:focus-visible { outline: 2px solid #1570ef; outline-offset: 2px; }
  .banner {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--success-bg);
    border: 1px solid var(--success-border-soft);
    color: var(--success-color);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
  }
  .banner[hidden] { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>注册表单</h1>
  <p class="desc">字段失焦即时校验，提交时全量校验；全部通过后可提交。</p>
  <form id="form" novalidate>
    <div class="field" id="email-field">
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" aria-describedby="email-hint">
      <p class="hint" id="email-hint" aria-live="polite"></p>
    </div>
    <div class="field" id="phone-field">
      <label for="phone">手机号</label>
      <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="13800138000" aria-describedby="phone-hint">
      <p class="hint" id="phone-hint" aria-live="polite"></p>
    </div>
    <div class="field" id="password-field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="至少 8 位，含字母与数字" aria-describedby="password-hint">
      <p class="hint" id="password-hint" aria-live="polite"></p>
    </div>
    <div class="actions">
      <button type="submit" id="submit-btn">提交</button>
    </div>
  </form>
  <div class="banner" id="banner" role="status" hidden></div>
</main>
<script>
'use strict';
(function () {
  function fail(msg) { return { ok: false, msg: msg }; }
  function pass(msg) { return { ok: true, msg: msg }; }

  function validateEmail(raw) {
    var v = raw.trim();
    if (!v) return fail('邮箱不能为空');
    if (/\s/.test(v)) return fail('邮箱不能包含空格或换行');
    if (v.length > 254) return fail('邮箱过长：不能超过 254 个字符（当前 ' + v.length + ' 个）');
    var parts = v.split('@');
    if (parts.length !== 2) return fail('邮箱格式不正确：需包含且仅包含一个 @（例如 name@example.com）');
    var local = parts[0];
    var domain = parts[1];
    if (!local) return fail('邮箱格式不正确：@ 之前缺少内容');
    if (local.length > 64) return fail('邮箱 @ 之前的部分过长：不能超过 64 个字符');
    if (!/^[A-Za-z0-9._%+-]+$/.test(local)) return fail('邮箱 @ 之前含不支持的字符：仅允许字母、数字及 . _ % + -');
    if (!domain) return fail('邮箱格式不正确：@ 之后缺少域名');
    if (!/^[A-Za-z0-9.-]+$/.test(domain)) return fail('邮箱域名含不支持的字符');
    var domainOk = /^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$/.test(domain)
      && /\.[A-Za-z]{2,}$/.test(domain);
    if (!domainOk) return fail('邮箱域名格式不正确（例如 example.com）');
    return pass('✓ 邮箱格式正确');
  }

  function validatePhone(raw) {
    var v = raw.trim();
    if (!v) return fail('手机号不能为空');
    if (/\s/.test(v)) return fail('手机号不能包含空格');
    if (!/^\d+$/.test(v)) return fail('手机号只能包含数字（检测到非法字符）');
    if (v.length > 11) return fail('手机号超长：应为 11 位数字（当前 ' + v.length + ' 位）');
    if (v.length < 11) return fail('手机号位数不足：应为 11 位数字（当前 ' + v.length + ' 位）');
    if (!/^1[3-9]/.test(v)) return fail('手机号格式不正确：应以 1 开头，第 2 位为 3-9');
    return pass('✓ 手机号格式正确');
  }

  function validatePassword(raw) {
    var v = raw;
    if (!v) return fail('密码不能为空');
    if (v.length > 64) return fail('密码过长：不能超过 64 个字符（当前 ' + v.length + ' 个）');
    if (v.length < 8) return fail('密码长度不足：至少 8 位（当前 ' + v.length + ' 位）');
    var hasLetter = /[A-Za-z]/.test(v);
    var hasDigit = /\d/.test(v);
    if (!hasLetter && !hasDigit) return fail('密码必须同时包含字母和数字（当前两者都缺少）');
    if (!hasLetter) return fail('密码缺少字母：必须同时包含字母和数字');
    if (!hasDigit) return fail('密码缺少数字：必须同时包含字母和数字');
    return pass('✓ 密码可用（≥8 位，含字母与数字；允许特殊字符）');
  }

  var FIELDS = [
    { id: 'email', validate: validateEmail },
    { id: 'phone', validate: validatePhone },
    { id: 'password', validate: validatePassword }
  ];

  var form = document.getElementById('form');
  var banner = document.getElementById('banner');
  var touched = {};

  function applyResult(id, result) {
    var input = document.getElementById(id);
    var field = document.getElementById(id + '-field');
    var hint = document.getElementById(id + '-hint');
    field.classList.toggle('error', !result.ok);
    field.classList.toggle('success', result.ok);
    input.setAttribute('aria-invalid', result.ok ? 'false' : 'true');
    hint.textContent = result.msg;
  }

  function hideBanner() {
    banner.hidden = true;
    banner.textContent = '';
  }

  FIELDS.forEach(function (f) {
    var input = document.getElementById(f.id);
    touched[f.id] = false;
    input.addEventListener('blur', function () {
      touched[f.id] = true;
      applyResult(f.id, f.validate(input.value));
    });
    input.addEventListener('input', function () {
      hideBanner();
      if (touched[f.id]) applyResult(f.id, f.validate(input.value));
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var firstInvalid = null;
    FIELDS.forEach(function (f) {
      var input = document.getElementById(f.id);
      touched[f.id] = true;
      var result = f.validate(input.value);
      applyResult(f.id, result);
      if (!result.ok && !firstInvalid) firstInvalid = input;
    });
    if (firstInvalid) {
      hideBanner();
      firstInvalid.focus();
    } else {
      banner.textContent = '提交成功：邮箱、手机号、密码均校验通过（本地演示，未发送任何数据）';
      banner.hidden = false;
    }
  });
})();
</script>
</body>
</html>
