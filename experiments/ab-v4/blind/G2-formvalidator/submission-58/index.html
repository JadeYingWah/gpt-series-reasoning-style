<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表单校验组件</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .form-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,.08);
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
  }
  h1 { font-size: 20px; color: #2c3e50; text-align: center; margin-bottom: 28px; }
  .field { margin-bottom: 22px; }
  label { display: block; font-size: 14px; color: #34495e; margin-bottom: 8px; font-weight: 500; }
  input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 15px;
    color: #333;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  input:focus { border-color: #409eff; box-shadow: 0 0 0 3px rgba(64,158,255,.12); }
  input.error { border-color: #e74c3c; }
  input.error:focus { box-shadow: 0 0 0 3px rgba(231,76,60,.12); }
  input.success { border-color: #2ecc71; }
  input.success:focus { box-shadow: 0 0 0 3px rgba(46,204,113,.12); }
  .msg { display: none; font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .msg.show { display: block; }
  .msg.error { color: #e74c3c; }
  .msg.success { color: #27ae60; }
  button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 8px;
    background: #409eff;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s;
    margin-top: 6px;
  }
  button:hover { background: #337ecc; }
  .form-success {
    display: none;
    margin-top: 18px;
    padding: 12px 16px;
    background: #eafaf1;
    border: 1px solid #2ecc71;
    border-radius: 8px;
    color: #27ae60;
    font-size: 14px;
    text-align: center;
  }
  .form-success.show { display: block; }
</style>
</head>
<body>
<form class="form-card" id="validateForm" novalidate>
  <h1>表单校验演示</h1>

  <div class="field">
    <label for="email">邮箱</label>
    <input type="email" id="email" name="email" placeholder="如 name@example.com" autocomplete="off" aria-describedby="emailMsg">
    <div class="msg" id="emailMsg" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="phone">手机号</label>
    <input type="tel" id="phone" name="phone" placeholder="11 位手机号" autocomplete="off" aria-describedby="phoneMsg">
    <div class="msg" id="phoneMsg" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="password">密码</label>
    <input type="password" id="password" name="password" placeholder="至少 8 位，含字母和数字" autocomplete="new-password" aria-describedby="passwordMsg">
    <div class="msg" id="passwordMsg" aria-live="polite"></div>
  </div>

  <button type="submit">提交</button>
  <div class="form-success" id="formSuccess" role="status">提交成功：全部字段校验通过</div>
</form>

<script>
(function () {
  'use strict';
  /*==VALIDATORS-BEGIN==*/
  function validateEmail(raw) {
    var v = (raw == null) ? '' : String(raw);
    if (v.trim() === '') return { ok: false, msg: '邮箱不能为空' };
    if (v.length > 254) return { ok: false, msg: '邮箱长度不能超过 254 个字符（当前 ' + v.length + ' 个）' };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      return { ok: false, msg: '邮箱格式不正确，应形如 name@example.com（不含空格，@ 后需有域名）' };
    }
    return { ok: true, msg: '邮箱格式正确' };
  }

  function validatePhone(raw) {
    var v = (raw == null) ? '' : String(raw);
    if (v.trim() === '') return { ok: false, msg: '手机号不能为空' };
    if (/\D/.test(v)) return { ok: false, msg: '手机号只能包含数字，不能含有空格、加号或其他字符' };
    if (v.length < 11) return { ok: false, msg: '手机号应为 11 位数字，当前 ' + v.length + ' 位' };
    if (v.length > 11) return { ok: false, msg: '手机号不能超过 11 位（当前 ' + v.length + ' 位）' };
    if (!/^1[3-9]\d{9}$/.test(v)) return { ok: false, msg: '手机号格式不正确，应以 1 开头且第 2 位为 3-9' };
    return { ok: true, msg: '手机号格式正确' };
  }

  function validatePassword(raw) {
    var v = (raw == null) ? '' : String(raw);
    if (v === '') return { ok: false, msg: '密码不能为空' };
    if (v.length < 8) return { ok: false, msg: '密码至少 8 位（当前 ' + v.length + ' 位），且需同时包含字母和数字' };
    if (v.length > 64) return { ok: false, msg: '密码不能超过 64 个字符（当前 ' + v.length + ' 个）' };
    if (!/[A-Za-z]/.test(v)) return { ok: false, msg: '密码需同时包含字母和数字：当前缺少字母' };
    if (!/\d/.test(v)) return { ok: false, msg: '密码需同时包含字母和数字：当前缺少数字' };
    return { ok: true, msg: '密码符合要求' };
  }
  /*==VALIDATORS-END==*/

  var form = document.getElementById('validateForm');
  var successBox = document.getElementById('formSuccess');
  var fields = [
    { input: document.getElementById('email'), msg: document.getElementById('emailMsg'), validate: validateEmail },
    { input: document.getElementById('phone'), msg: document.getElementById('phoneMsg'), validate: validatePhone },
    { input: document.getElementById('password'), msg: document.getElementById('passwordMsg'), validate: validatePassword }
  ];

  function render(field, result) {
    field.msg.textContent = result.msg;
    field.msg.className = 'msg show ' + (result.ok ? 'success' : 'error');
    field.input.classList.toggle('success', result.ok);
    field.input.classList.toggle('error', !result.ok);
    field.input.setAttribute('aria-invalid', result.ok ? 'false' : 'true');
  }

  function clearState(field) {
    field.msg.textContent = '';
    field.msg.className = 'msg';
    field.input.classList.remove('success', 'error');
    field.input.removeAttribute('aria-invalid');
  }

  function checkField(field) {
    var result = field.validate(field.input.value);
    render(field, result);
    return result.ok;
  }

  fields.forEach(function (field) {
    field.touched = false;
    field.input.addEventListener('blur', function () {
      field.touched = true;
      checkField(field);
    });
    field.input.addEventListener('input', function () {
      successBox.classList.remove('show');
      if (field.touched) checkField(field);
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    successBox.classList.remove('show');
    var allOk = true;
    var firstBad = null;
    fields.forEach(function (field) {
      field.touched = true;
      var ok = checkField(field);
      if (!ok && allOk) { allOk = false; firstBad = field.input; }
      else if (!ok) { allOk = false; }
    });
    if (allOk) {
      successBox.classList.add('show');
    } else if (firstBad) {
      firstBad.focus();
    }
  });
})();
</script>
</body>
</html>
