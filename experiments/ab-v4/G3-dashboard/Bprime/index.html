<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 年度销售数据看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: #f2f5f9; color: #1e293b;
    padding: 28px 20px 40px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; color: #0f172a; }
  .sub { color: #64748b; font-size: 13px; margin-top: 6px; }
  .filters { margin: 22px 0 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    border: 1px solid #cbd5e1; background: #fff; color: #334155;
    padding: 8px 16px; border-radius: 999px; font-size: 14px;
    cursor: pointer; transition: all .15s;
  }
  .filters button:hover { border-color: #2563eb; color: #2563eb; }
  .filters button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    background: #fff; border-radius: 12px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
  }
  .card .label { font-size: 13px; color: #64748b; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 8px; color: #0f172a; }
  .card .unit { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .chart-card {
    margin-top: 16px; background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
  }
  .chart-card h2 { font-size: 15px; color: #475569; margin-bottom: 12px; font-weight: 600; }
  #chart svg { width: 100%; height: auto; display: block; }
  footer { margin-top: 16px; font-size: 12px; color: #94a3b8; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2025 年度销售数据看板</h1>
    <p class="sub">数据单位：万元 · 示例数据（演示用）</p>
  </header>

  <section class="filters" id="filters" role="group" aria-label="按季度筛选">
    <button type="button" data-scope="all" class="active" aria-pressed="true">全年</button>
    <button type="button" data-scope="q1" aria-pressed="false">Q1（1-3月）</button>
    <button type="button" data-scope="q2" aria-pressed="false">Q2（4-6月）</button>
    <button type="button" data-scope="q3" aria-pressed="false">Q3（7-9月）</button>
    <button type="button" data-scope="q4" aria-pressed="false">Q4（10-12月）</button>
  </section>

  <section class="cards" aria-label="汇总指标">
    <div class="card">
      <div class="label">销售总额</div>
      <div class="value" id="kpi-total">--</div>
      <div class="unit">万元</div>
    </div>
    <div class="card">
      <div class="label">月均销售额</div>
      <div class="value" id="kpi-avg">--</div>
      <div class="unit">万元 / 月</div>
    </div>
    <div class="card">
      <div class="label">峰值月</div>
      <div class="value" id="kpi-peak">--</div>
      <div class="unit" id="kpi-peak-note"></div>
    </div>
  </section>

  <section class="chart-card" aria-label="销售趋势图">
    <h2 id="chart-title">月度销售趋势</h2>
    <div id="chart"></div>
  </section>

  <footer>单文件静态页面，无外部依赖；图表由内联 SVG 自绘。数据为编造的演示数据。</footer>
</div>

<script>
(function () {
  'use strict';

  // 内联数据：2025 年 12 个月销售额（万元）
  var DATA = [
    { m: '1月',  v: 128, q: 1 },
    { m: '2月',  v: 92,  q: 1 },
    { m: '3月',  v: 145, q: 1 },
    { m: '4月',  v: 156, q: 2 },
    { m: '5月',  v: 171, q: 2 },
    { m: '6月',  v: 133, q: 2 },
    { m: '7月',  v: 188, q: 3 },
    { m: '8月',  v: 205, q: 3 },
    { m: '9月',  v: 149, q: 3 },
    { m: '10月', v: 167, q: 4 },
    { m: '11月', v: 230, q: 4 },
    { m: '12月', v: 264, q: 4 }
  ];

  var SCOPES = {
    all: { label: '全年',        qs: [1, 2, 3, 4] },
    q1:  { label: 'Q1 · 1-3月',  qs: [1] },
    q2:  { label: 'Q2 · 4-6月',  qs: [2] },
    q3:  { label: 'Q3 · 7-9月',  qs: [3] },
    q4:  { label: 'Q4 · 10-12月', qs: [4] }
  };

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function fmt(n) {
    // 保留最多 1 位小数，整数位加千分位
    var s = Math.round(n * 10) / 10;
    var i = Math.floor(s);
    var d = Math.round((s - i) * 10);
    var is = String(i).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return d ? is + '.' + d : is;
  }

  function el(name, attrs) {
    var node = document.createElementNS(SVG_NS, name);
    for (var k in attrs) {
      if (Object.prototype.hasOwnProperty.call(attrs, k)) {
        node.setAttribute(k, attrs[k]);
      }
    }
    return node;
  }

  function drawChart(rows) {
    var box = document.getElementById('chart');
    box.innerHTML = '';

    var W = 840, H = 340, L = 64, R = 16, T = 28, B = 40;
    var pw = W - L - R, ph = H - T - B;

    var maxV = 0, i;
    for (i = 0; i < rows.length; i++) {
      if (rows[i].v > maxV) maxV = rows[i].v;
    }
    var yMax = Math.ceil(maxV / 50) * 50;
    var peakV = maxV;

    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
      'aria-label': '月度销售额柱状图' });

    // 网格线与 Y 轴刻度（5 档）
    for (i = 0; i <= 4; i++) {
      var gy = T + ph * (1 - i / 4);
      var gv = yMax * i / 4;
      svg.appendChild(el('line', {
        x1: L, y1: gy, x2: W - R, y2: gy,
        stroke: '#e2e8f0', 'stroke-width': 1
      }));
      var yLabel = el('text', {
        x: L - 10, y: gy + 4, 'text-anchor': 'end',
        'font-size': 12, fill: '#94a3b8'
      });
      yLabel.textContent = fmt(gv);
      svg.appendChild(yLabel);
    }

    // 柱、数值标签、月份标签
    var n = rows.length;
    var band = pw / n;
    var barW = Math.min(band * 0.55, 48);
    for (i = 0; i < n; i++) {
      var r = rows[i];
      var h = ph * (r.v / yMax);
      var x = L + band * i + (band - barW) / 2;
      var y = T + ph - h;
      var isPeak = r.v === peakV;

      var rect = el('rect', {
        x: x, y: y, width: barW, height: Math.max(h, 2), rx: 4,
        fill: isPeak ? '#f59e0b' : '#3b82f6'
      });
      var tip = document.createElementNS(SVG_NS, 'title');
      tip.textContent = r.m + '：' + fmt(r.v) + ' 万元' + (isPeak ? '（峰值）' : '');
      rect.appendChild(tip);
      svg.appendChild(rect);

      var vLabel = el('text', {
        x: x + barW / 2, y: y - 6, 'text-anchor': 'middle',
        'font-size': 12, fill: '#334155', 'font-weight': 600
      });
      vLabel.textContent = fmt(r.v);
      svg.appendChild(vLabel);

      var mLabel = el('text', {
        x: x + barW / 2, y: T + ph + 24, 'text-anchor': 'middle',
        'font-size': 12, fill: '#64748b'
      });
      mLabel.textContent = r.m;
      svg.appendChild(mLabel);
    }

    box.appendChild(svg);
  }

  function setScope(key) {
    var meta = SCOPES[key];
    if (!meta) return;

    var rows = [];
    var i;
    for (i = 0; i < DATA.length; i++) {
      if (meta.qs.indexOf(DATA[i].q) >= 0) rows.push(DATA[i]);
    }

    var total = 0, peak = rows[0];
    for (i = 0; i < rows.length; i++) {
      total += rows[i].v;
      if (rows[i].v > peak.v) peak = rows[i];
    }
    var avg = total / rows.length;

    document.getElementById('kpi-total').textContent = fmt(total);
    document.getElementById('kpi-avg').textContent = fmt(avg);
    document.getElementById('kpi-peak').textContent = peak.m;
    document.getElementById('kpi-peak-note').textContent = fmt(peak.v) + ' 万元';
    document.getElementById('chart-title').textContent = '月度销售趋势（' + meta.label + '）';

    drawChart(rows);
  }

  function setActive(key) {
    var btns = document.querySelectorAll('#filters button');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-scope') === key;
      btns[i].classList.toggle('active', on);
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    var key = btn.getAttribute('data-scope');
    setActive(key);
    setScope(key);
  });

  setActive('all');
  setScope('all');
})();
</script>
</body>
</html>
