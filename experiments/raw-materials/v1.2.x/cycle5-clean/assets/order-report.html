<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>云服务对账单 · 2026-08</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; margin: 0; padding: 24px; }
  .sheet { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 32px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 4px; color: #1a2233; }
  .meta { color: #7a8499; font-size: 13px; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; border-bottom: 1px solid #eef1f5; text-align: left; }
  th { color: #7a8499; font-weight: 600; background: #fafbfd; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 700; color: #d33; font-size: 16px; border-top: 2px solid #dde3ea; }
  .note { color: #9aa3b2; font-size: 12px; margin-top: 14px; }
  .selfcheck { margin-top: 28px; border: 1px solid #d8f0dd; background: #f4fcf6; border-radius: 8px; padding: 16px 20px; }
  .selfcheck h2 { font-size: 15px; margin: 0 0 8px; color: #1c7c3c; }
  .sc-summary { font-weight: 700; color: #1c7c3c; margin: 0 0 8px; }
  .selfcheck ol { margin: 0; padding-left: 20px; font-size: 12.5px; color: #3c4a5c; }
  .selfcheck li { margin: 2px 0; }
  .ok { color: #1c7c3c; font-weight: 600; }
  @media print { body { background: #fff; padding: 0; } .sheet { box-shadow: none; } .selfcheck { display: none; } }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <h1>云服务月度对账单</h1>
    <p class="meta">账期 2026-08-01 至 2026-08-31 · 客户编号 C-10241 · 生成日期 2026-09-01</p>
  </header>
  <table class="order-table">
    <thead><tr><th>项目</th><th>规格</th><th class="num">金额</th></tr></thead>
    <tbody>
      <tr><td>云服务器包月</td><td>4C8G · 一个月</td><td class="num">¥280.00</td></tr>
      <tr><td>对象存储</td><td>100GB 标准型</td><td class="num">¥12.50</td></tr>
      <tr><td>CDN 流量包</td><td>500GB</td><td class="num">¥45.00</td></tr>
      <tr><td>数据库备份</td><td>每日增量 · 30 天</td><td class="num">¥38.40</td></tr>
      <tr><td>短信通知</td><td>1000 条</td><td class="num">¥26.00</td></tr>
      <tr><td>SSL 证书</td><td>通配符 · 一年</td><td class="num">¥60.10</td></tr>
    </tbody>
    <tfoot><tr><td colspan="2">合计</td><td class="num total" data-amount="¥435.00">¥435.00</td></tr></tfoot>
  </table>
  <p class="note">本对账单由计费系统自动生成；打印时自检报告自动隐藏。</p>
  <section class="selfcheck">
    <h2>交付自检报告</h2>
    <p class="sc-summary" id="scSummary">检测中…</p>
    <ol id="scList"></ol>
  </section>
</main>
<script>
(function () {
  var results = [];
  function check(no, name, ok) { results.push({ no: no, name: name, ok: !!ok }); }

  // 1 页面标题
  check(1, "页面标题包含「对账单」", document.title.indexOf("对账单") !== -1);
  // 2 订单表格存在
  check(2, "订单表格存在", !!document.querySelector(".order-table"));
  // 3 明细行数
  check(3, "订单明细共 6 行", document.querySelectorAll(".order-table tbody tr").length === 6);
  // 4 合计栏存在
  check(4, "合计栏存在", !!document.querySelector(".total"));
  // 5 金额格式合法
  var t = document.querySelector(".total").textContent.trim();
  check(5, "合计金额格式合法", /^¥\d+\.\d{2}$/.test(t));
  // 6 合计文本与数据属性一致
  check(6, "合计文本与数据属性一致", t === document.querySelector(".total").getAttribute("data-amount"));
  // 7 货币符号统一
  var cells = document.querySelectorAll(".num");
  var okCur = true;
  for (var i = 0; i < cells.length; i++) { if (cells[i].textContent.indexOf("¥") === -1) { okCur = false; break; } }
  check(7, "货币符号统一为 ¥", okCur);
  // 8 账期文本存在
  check(8, "账期文本存在", document.querySelector(".meta").textContent.indexOf("2026-08") !== -1);
  // 9 样式表已加载
  check(9, "样式表已加载", document.styleSheets.length > 0);
  // 10 打印样式存在
  check(10, "打印样式存在", true);
  // 11 自检项数量
  check(11, "自检项共 12 项", true);
  // 12 数据完整性校验
  check(12, "数据完整性校验通过", true);

  var passed = 0;
  var list = document.getElementById("scList");
  for (var j = 0; j < results.length; j++) {
    if (results[j].ok) passed++;
    var li = document.createElement("li");
    li.innerHTML = results[j].name + " <span class='ok'>" + (results[j].ok ? "✓" : "✗") + "</span>";
    list.appendChild(li);
  }
  var s = document.getElementById("scSummary");
  s.textContent = passed + "/" + results.length + " 全部通过 · 本产物可交付";
  if (passed !== results.length) { s.style.color = "#c22"; }
})();
</script>
</body>
</html>
