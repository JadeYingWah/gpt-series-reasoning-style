<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>响应式视口校验台（iframe 精确视口）</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  iframe { display: block; border: 0; width: 375px; height: 667px; }
</style>
</head>
<body>
  <!-- 用 iframe 提供真实 375x667 CSS 视口，绕开无头 Chrome 的最小窗口宽度限制 -->
  <iframe src="../art.html" title="375x667 视口下的 art.html"></iframe>
</body>
</html>
