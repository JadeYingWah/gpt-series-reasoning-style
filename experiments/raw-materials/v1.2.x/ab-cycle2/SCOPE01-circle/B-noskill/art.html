<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圆</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10131a;
  }
  /* 画布随视口等比缩放，圆始终居中且保持正圆 */
  figure {
    margin: 0;
    width: min(80vmin, 640px);
    aspect-ratio: 1 / 1;
    line-height: 0;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <figure>
    <svg viewBox="0 0 200 200" role="img" aria-label="一个圆">
      <defs>
        <radialGradient id="fill" cx="38%" cy="32%" r="72%">
          <stop offset="0%" stop-color="#8fd3ff"/>
          <stop offset="100%" stop-color="#2f6bff"/>
        </radialGradient>
      </defs>
      <!-- 圆心 (100,100)，半径 80 -->
      <circle cx="100" cy="100" r="80" fill="url(#fill)"/>
    </svg>
  </figure>
</body>
</html>
