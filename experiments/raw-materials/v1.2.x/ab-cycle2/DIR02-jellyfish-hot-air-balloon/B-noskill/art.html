<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水母坐热气球 · Jellyfish in a Hot-Air Balloon</title>
<style>
  /* ========== 1. 基础与自适应 ========== */
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 95% at 50% 6%,#eaf7ff 0%,#c8e6fc 36%,#a9d4f3 66%,#d3eafa 100%);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  /* 舞台等比缩放：宽度同时受视口宽、视口高、上限三重约束，始终居中 */
  .stage{width:min(96vw,1100px,132vh)}
  svg{display:block;width:100%;height:auto}

  /* ========== 2. 视差云层：四层同距离不同时长 => 四种速度 ========== */
  .layer{will-change:transform}
  .layer-far  {animation:pan-far   64s linear infinite}
  .layer-mid  {animation:pan-mid   36s linear infinite}
  .layer-near {animation:pan-near  19s linear infinite}
  .layer-front{animation:pan-front 12s linear infinite}
  @keyframes pan-far  {from{transform:translateX(0)}to{transform:translateX(-900px)}}
  @keyframes pan-mid  {from{transform:translateX(0)}to{transform:translateX(-900px)}}
  @keyframes pan-near {from{transform:translateX(0)}to{transform:translateX(-900px)}}
  @keyframes pan-front{from{transform:translateX(0)}to{transform:translateX(-900px)}}
  /* ========== 3. 载具：热气球总成 ========== */
  .sway{animation:sway 12s ease-in-out infinite}
  .bob {animation:bob   8s ease-in-out infinite}
  .env {transform-box:view-box;transform-origin:450px 264px;animation:rock 9s ease-in-out infinite}
  .pennant{transform-box:view-box;transform-origin:547px 176px;animation:pennant 3.3s ease-in-out infinite}
  .flame{transform-box:view-box;transform-origin:450px 293px;animation:flick .42s ease-in-out infinite alternate}
  .halo {animation:pulse2 3.2s ease-in-out infinite}
  @keyframes sway{0%{transform:translateX(-13px)}50%{transform:translateX(13px)}100%{transform:translateX(-13px)}}
  @keyframes bob {0%{transform:translateY(0)}50%{transform:translateY(-17px)}100%{transform:translateY(0)}}
  @keyframes rock{0%{transform:rotate(-1.8deg)}50%{transform:rotate(1.6deg)}100%{transform:rotate(-1.8deg)}}
  @keyframes pennant{0%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-4deg)}}
  @keyframes flick{0%{transform:scale(1,1);opacity:.95}100%{transform:scale(.8,1.18);opacity:.68}}
  @keyframes pulse2{0%{opacity:.35}50%{opacity:.8}100%{opacity:.35}}

  /* ========== 4. 主体：水母（钟体 + 7 条触手，多周期） ========== */
  .bell{transform-box:view-box;transform-origin:450px 400px;animation:bellPulse 3.6s ease-in-out infinite}
  .eye {transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s ease-in-out infinite}
  .tent{transform-box:view-box;animation:tentA 3s ease-in-out infinite}
  .tent.b{animation-name:tentB}
  @keyframes bellPulse{0%{transform:scale(1,1)}50%{transform:scale(1.055,.93)}100%{transform:scale(1,1)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  @keyframes tentA{0%{transform:rotate(-5deg)}50%{transform:rotate(5.5deg)}100%{transform:rotate(-5deg)}}
  @keyframes tentB{0%{transform:rotate(4.5deg)}50%{transform:rotate(-6deg)}100%{transform:rotate(4.5deg)}}

  /* ========== 5. 点缀：飞鸟 / 星点 / 风痕 ========== */
  .birds{animation:birdDrift 26s linear infinite}
  .bird {transform-box:fill-box;transform-origin:50% 50%;animation:flap 1.1s ease-in-out infinite}
  .tw   {transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.2s ease-in-out infinite}
  .tw.s {animation-duration:3.1s}
  .streak{animation:streak 2.8s linear infinite}
  @keyframes birdDrift{from{transform:translateX(330px)}to{transform:translateX(-1250px)}}
  @keyframes flap{0%{transform:scaleY(1)}50%{transform:scaleY(.38)}100%{transform:scaleY(1)}}
  @keyframes twinkle{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
  @keyframes streak{0%{opacity:0;transform:translateX(0)}30%{opacity:.45}100%{opacity:0;transform:translateX(-90px)}}
</style>
</head>
<body>
<main class="stage">
<svg viewBox="0 0 900 620" role="img" aria-labelledby="ttl dsc" preserveAspectRatio="xMidYMid meet">
  <title id="ttl">水母坐热气球</title>
  <desc id="dsc">一只水母坐在热气球的柳条吊篮里，钟体与触手以不同周期搏动摆动；气球向左前方徐行，四层云以不同速度反向漂移形成视差。</desc>

  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2fbff"/><stop offset=".48" stop-color="#c7e6fc"/><stop offset="1" stop-color="#a6d2f1"/>
    </linearGradient>
    <linearGradient id="gEnv" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffb6c9"/><stop offset=".42" stop-color="#ff7fa4"/><stop offset="1" stop-color="#d6507f"/>
    </linearGradient>
    <linearGradient id="gGore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3f8" stop-opacity=".95"/><stop offset="1" stop-color="#ffdbe8" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="gBasket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d59d5f"/><stop offset="1" stop-color="#8a5828"/>
    </linearGradient>
    <radialGradient id="gBell" cx=".38" cy=".26" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".99"/><stop offset=".5" stop-color="#cdeeff" stop-opacity=".82"/><stop offset="1" stop-color="#83c6ee" stop-opacity=".4"/>
    </radialGradient>
    <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff9f43"/><stop offset="1" stop-color="#ff6b6b" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#dceeff" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="gHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".8"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="fHaze" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="clipBasket"><rect x="398" y="410" width="104" height="76" rx="14"/></clipPath>

    <!-- 云层图案：每条横向重复两次（相隔 900），实现无缝循环 -->
    <g id="cloudFar" opacity=".5">
      <ellipse cx="120" cy="112" rx="58" ry="20" fill="url(#gCloud)"/>
      <ellipse cx="168" cy="104" rx="40" ry="16" fill="url(#gCloud)"/>
      <ellipse cx="330" cy="176" rx="70" ry="22" fill="url(#gCloud)"/>
      <ellipse cx="382" cy="168" rx="44" ry="17" fill="url(#gCloud)"/>
      <ellipse cx="600" cy="96"  rx="62" ry="21" fill="url(#gCloud)"/>
      <ellipse cx="652" cy="88"  rx="38" ry="15" fill="url(#gCloud)"/>
      <ellipse cx="800" cy="150" rx="54" ry="19" fill="url(#gCloud)"/>
    </g>
    <g id="cloudMid" opacity=".82">
      <ellipse cx="180" cy="272" rx="90" ry="30" fill="url(#gCloud)"/>
      <ellipse cx="246" cy="260" rx="58" ry="22" fill="url(#gCloud)"/>
      <ellipse cx="300" cy="276" rx="44" ry="17" fill="url(#gCloud)"/>
      <ellipse cx="560" cy="336" rx="96" ry="31" fill="url(#gCloud)"/>
      <ellipse cx="642" cy="324" rx="60" ry="22" fill="url(#gCloud)"/>
      <ellipse cx="820" cy="252" rx="70" ry="24" fill="url(#gCloud)"/>
    </g>
    <g id="cloudSea">
      <rect x="0" y="600" width="900" height="20" fill="#eaf6ff" opacity=".85"/>
      <ellipse cx="60"  cy="596" rx="150" ry="48" fill="url(#gCloud)"/>
      <ellipse cx="960" cy="596" rx="150" ry="48" fill="url(#gCloud)"/>
      <ellipse cx="250" cy="604" rx="140" ry="44" fill="url(#gCloud)"/>
      <ellipse cx="430" cy="592" rx="160" ry="52" fill="url(#gCloud)"/>
      <ellipse cx="620" cy="606" rx="150" ry="46" fill="url(#gCloud)"/>
      <ellipse cx="790" cy="594" rx="130" ry="42" fill="url(#gCloud)"/>
      <ellipse cx="-110" cy="594" rx="130" ry="42" fill="url(#gCloud)"/>
    </g>
    <g id="wispSet" opacity=".5">
      <ellipse cx="150" cy="618" rx="230" ry="66" fill="#ffffff"/>
      <ellipse cx="610" cy="626" rx="250" ry="70" fill="#ffffff"/>
    </g>
  </defs>
  <!-- ===== 天空 ===== -->
  <rect width="900" height="620" fill="url(#gSky)"/>

  <!-- ===== L1 远景云（最慢：900px / 64s = 14.1 px/s）===== -->
  <g class="layer layer-far" aria-hidden="true"><use href="#cloudFar"/><use href="#cloudFar" x="900"/></g>

  <!-- ===== L2 中景云（900px / 36s = 25 px/s）===== -->
  <g class="layer layer-mid" aria-hidden="true"><use href="#cloudMid"/><use href="#cloudMid" x="900"/></g>

  <!-- ===== 飞鸟：自身振翅 1.1s，整体 26s 横穿（比中景云更快，所以更近）===== -->
  <g class="birds" aria-hidden="true">
    <g transform="translate(700,150)"><g class="bird"><path d="M-14,0 C-9,-8 -4,-9 0,-1 C4,-9 9,-8 14,0" fill="none" stroke="#6d90ad" stroke-width="2.6" stroke-linecap="round"/></g></g>
    <g transform="translate(762,124)"><g class="bird" style="animation-delay:-.28s"><path d="M-11,0 C-7,-6 -3,-7 0,-1 C3,-7 7,-6 11,0" fill="none" stroke="#6d90ad" stroke-width="2.2" stroke-linecap="round"/></g></g>
    <g transform="translate(648,178)"><g class="bird" style="animation-delay:-.6s"><path d="M-9,0 C-6,-5 -2,-6 0,-1 C2,-6 6,-5 9,0" fill="none" stroke="#6d90ad" stroke-width="2" stroke-linecap="round"/></g></g>
  </g>

  <!-- ===== L3 近景云海（900px / 19s = 47.4 px/s）===== -->
  <g class="layer layer-near" aria-hidden="true"><use href="#cloudSea"/><use href="#cloudSea" x="900"/></g>

  <!-- 气球背后的暖光 -->
  <circle class="halo" cx="450" cy="300" r="250" fill="url(#gHalo)"/>
  <!-- ================= 热气球总成 ================= -->
  <!-- 静态基础倾角 -6°：顶部朝左前倾（顺行进方向），吊篮因拖曳略滞后 -->
  <g id="rig" transform="rotate(-6 450 360)">
   <g class="sway">
    <g class="bob">

    <!-- 吊索：上端被球体遮住，下端接吊篮上沿 -->
    <g fill="none" stroke="#8a5c30" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M352,192 L398,412"/><path d="M548,192 L502,412"/>
      <path d="M400,262 L432,412"/><path d="M500,262 L468,412"/>
    </g>

    <!-- 球体（绕球颈 450,264 微幅摇摆） -->
    <g class="env">
      <path d="M450,17 C545,17 562,105 562,160 C562,215 505,246 472,268 L428,268 C395,246 338,215 338,160 C338,105 355,17 450,17 Z" fill="url(#gEnv)" stroke="#c04a76" stroke-width="2"/>
      <g fill="none" stroke="url(#gGore)" stroke-width="7" stroke-linecap="round" opacity=".55">
        <path d="M450,20 L450,264"/>
        <path d="M450,20 C410,60 384,150 418,252"/>
        <path d="M450,20 C490,60 516,150 482,252"/>
        <path d="M450,20 C374,60 338,128 346,192"/>
        <path d="M450,20 C526,60 562,128 554,192"/>
      </g>
      <ellipse cx="398" cy="110" rx="30" ry="48" fill="#ffffff" opacity=".3" transform="rotate(-22 398 110)"/>
      <ellipse cx="520" cy="96"  rx="16" ry="24" fill="#ffffff" opacity=".18" transform="rotate(18 520 96)"/>
      <!-- 风向旗：向右侧（后方）飘，说明气球朝左飞 -->
      <g class="pennant">
        <path d="M546,168 C584,162 614,166 642,156 C616,180 584,186 546,188 Z" fill="#ffd166" stroke="#dfa52b" stroke-width="1.5"/>
      </g>
    </g>

    <!-- 球颈 / 燃烧器 / 火焰 -->
    <path d="M434,266 L466,266 L458,286 L442,286 Z" fill="#b8577f"/>
    <rect x="441" y="284" width="18" height="9" rx="3" fill="#6f5236"/>
    <ellipse class="halo" cx="450" cy="306" rx="26" ry="17" fill="url(#gHalo)"/>
    <g class="flame">
      <path d="M450,292 C457,298 459,306 450,313 C441,306 443,298 450,292 Z" fill="url(#gFlame)"/>
    </g>
    <!-- 吊篮上沿（先画，中间会被钟体遮住，两侧露出成为篮口） -->
    <rect x="390" y="404" width="120" height="14" rx="7" fill="#b07a44" stroke="#6f4a22" stroke-width="2"/>

    <!-- ===== 主体：水母钟体（绕篮口 450,400 呼吸搏动 3.6s）===== -->
    <g class="bell">
      <path d="M398,364 A52,46 0 0 1 502,364 C502,392 480,410 450,410 C420,410 398,392 398,364 Z"
            fill="url(#gBell)" stroke="#79bfe6" stroke-width="2"/>
      <ellipse cx="466" cy="330" rx="26" ry="16" fill="#ffffff" opacity=".45" transform="rotate(-18 466 330)"/>
      <circle cx="416" cy="336" r="4" fill="#ffffff" opacity=".5"/>
      <circle cx="438" cy="340" r="2.5" fill="#ffffff" opacity=".35"/>
      <circle cx="490" cy="356" r="3" fill="#ffffff" opacity=".4"/>
      <!-- 面部统一朝左（行进方向） -->
      <g class="eye"><ellipse cx="424" cy="352" rx="6.5" ry="7.5" fill="#2b4a63"/><circle cx="422" cy="348.5" r="2.2" fill="#fff"/></g>
      <g class="eye"><ellipse cx="457" cy="339" rx="5" ry="6" fill="#2b4a63"/><circle cx="455" cy="336" r="1.7" fill="#fff"/></g>
      <ellipse cx="411" cy="368" rx="9" ry="5.5" fill="#ff9bb3" opacity=".55"/>
      <ellipse cx="471" cy="352" rx="7" ry="4.5" fill="#ff9bb3" opacity=".4"/>
      <path d="M424,372 q8,7 17,2" fill="none" stroke="#2b4a63" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- 吊篮壁 + 柳条 -->
    <rect x="398" y="410" width="104" height="76" rx="14" fill="url(#gBasket)" stroke="#6f4a22" stroke-width="2"/>
    <g clip-path="url(#clipBasket)" fill="none" stroke="#7d4f24" stroke-width="1.6" opacity=".45">
      <path d="M414,410 L414,486"/><path d="M432,410 L432,486"/><path d="M450,410 L450,486"/><path d="M468,410 L468,486"/><path d="M486,410 L486,486"/>
      <path d="M398,430 L502,430"/><path d="M398,452 L502,452"/><path d="M398,474 L502,474"/>
    </g>

    <!-- ===== 附肢：7 条触手，各自独立周期（2.6 / 2.9 / 3.3 / 3.9 / 4.2 / 4.7 / 5.2 s）===== -->
    <g fill="none" stroke="#bfe6ff" stroke-width="3" stroke-linecap="round" opacity=".82">
      <path class="tent" style="transform-origin:406px 382px;animation-duration:4.7s;animation-delay:-.6s" d="M406,382 C382,410 358,434 346,466 C336,494 344,524 332,556"/>
      <path class="tent b" style="transform-origin:416px 396px;animation-duration:3.9s;animation-delay:-.3s" d="M416,396 C404,432 406,464 396,494 C388,522 398,546 390,572"/>
      <path class="tent" style="transform-origin:436px 408px;animation-duration:2.6s" d="M436,408 C428,440 436,466 426,498 C418,524 428,548 420,574"/>
      <path class="tent b" style="transform-origin:466px 408px;animation-duration:3.3s;animation-delay:-.9s" d="M466,408 C474,440 466,466 476,498 C484,524 474,548 482,574"/>
      <path class="tent" style="transform-origin:484px 396px;animation-duration:5.2s;animation-delay:-.4s" d="M484,396 C496,432 494,464 504,494 C512,522 502,546 510,572"/>
      <path class="tent b" style="transform-origin:494px 382px;animation-duration:4.2s;animation-delay:-1.2s" d="M494,382 C518,410 542,434 554,466 C564,494 556,524 568,556"/>
      <path class="tent" style="transform-origin:450px 410px;animation-duration:2.9s;animation-delay:-.8s" d="M450,410 C448,444 458,472 448,504 C440,532 452,554 444,580"/>
    </g>
    </g>
   </g>
  </g>

  <!-- ===== L4 前景雾云（最快：900px / 12s = 75 px/s，压在气球之前）===== -->
  <g class="layer layer-front" filter="url(#fHaze)" aria-hidden="true"><use href="#wispSet"/><use href="#wispSet" x="900"/></g>

  <!-- 星点闪烁（2.2s / 3.1s 两档） -->
  <g fill="#fffbe0" aria-hidden="true">
    <circle class="tw" cx="300" cy="176" r="3.4"/>
    <circle class="tw s" cx="628" cy="118" r="2.6"/>
    <circle class="tw" cx="268" cy="432" r="2.8" style="animation-delay:-.7s"/>
    <circle class="tw s" cx="660" cy="392" r="3" style="animation-delay:-1.4s"/>
    <circle class="tw" cx="192" cy="300" r="2.2" style="animation-delay:-1.9s"/>
    <circle class="tw s" cx="700" cy="248" r="2.4" style="animation-delay:-.5s"/>
  </g>

  <!-- 风痕：从气球右后方掠过，指示向左行进（2.8s） -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
    <path class="streak" d="M596,232 L648,232"/>
    <path class="streak" style="animation-delay:-.9s" d="M604,300 L664,300"/>
    <path class="streak" style="animation-delay:-1.8s" d="M592,368 L640,368"/>
  </g>
</svg>
</main>
</body>
</html>
