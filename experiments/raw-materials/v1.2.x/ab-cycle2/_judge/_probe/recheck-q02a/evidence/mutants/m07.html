<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打砖块 · Breakout</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141a2e; --line:#26304d; --ink:#e8ecf8;
    --muted:#8b96b8; --accent:#4cc2ff; --warn:#ffcc66; --bad:#ff6b81; --ok:#57e08a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 800px at 50% -10%,#1a2340 0%,var(--bg) 60%);
    color:var(--ink); font:14px/1.5 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #app{width:min(840px,100%); display:flex; flex-direction:column; gap:10px}
  #hud{
    display:flex; flex-wrap:wrap; gap:8px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  }
  .hud-item{display:flex; align-items:baseline; gap:6px; min-width:0}
  .hud-label{color:var(--muted); font-size:12px}
  .hud-value{font-variant-numeric:tabular-nums; font-weight:600}
  #score.bump{animation:bump .18s ease-out}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:var(--ok)}100%{transform:scale(1)}}
  .hud-item.grow{flex:1 1 120px; min-width:0}
  #levelName{
    display:inline-block; max-width:24ch; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; vertical-align:bottom;
  }
  #stateValue[data-s="running"]{color:var(--ok)}
  #stateValue[data-s="paused"]{color:var(--warn)}
  #stateValue[data-s="over"]{color:var(--bad)}
  #stateValue[data-s="win"]{color:var(--accent)}
  #stageWrap{
    position:relative; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#070a14;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  #stageWrap.damage{animation:shake .3s ease-out, dmg .3s ease-out}
  @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
  @keyframes dmg{0%{border-color:var(--bad);box-shadow:0 0 0 2px rgba(255,107,129,.5)}100%{border-color:var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45)}}
  canvas{display:block; width:100%; height:auto; touch-action:none; cursor:none}
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    background:rgba(6,9,18,.68); backdrop-filter:blur(2px);
  }
  .overlay[hidden]{display:none}
  .overlay h1{margin:0; font-size:26px; letter-spacing:.5px}
  .overlay p{margin:0; color:var(--muted); max-width:42ch}
  button{
    margin-top:6px; padding:10px 20px; font:600 15px/1 inherit; color:#04121f;
    background:linear-gradient(180deg,#7fd8ff,#3ab6f0); border:0; border-radius:999px;
    cursor:pointer; box-shadow:0 6px 18px rgba(60,180,240,.35);
  }
  button:hover{filter:brightness(1.08)}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
  #help{color:var(--muted); font-size:12.5px}
  #notice{color:var(--warn); font-size:12.5px; min-height:1.2em}
  #notice:empty{display:none}
  .kbd{
    display:inline-block; padding:1px 6px; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:5px; background:#1b2438; color:var(--ink); font-size:11.5px;
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-item"><span class="hud-label">分数</span><span id="score" class="hud-value" aria-live="polite" aria-atomic="true">0</span></div>
    <div class="hud-item"><span class="hud-label">生命</span><span id="lives" class="hud-value">3</span></div>
    <div class="hud-item grow"><span class="hud-label">关卡</span><span id="levelName" class="hud-value" title="">—</span></div>
    <div class="hud-item"><span class="hud-label">状态</span><span id="stateValue" class="hud-value" data-s="held">待发球</span></div>
    <div class="hud-item"><span class="hud-label">FPS</span><span id="fps" class="hud-value">–</span></div>
  </header>
  <div id="stageWrap">
    <canvas id="stage" width="800" height="600" aria-label="打砖块游戏画面" role="img"></canvas>
    <div id="overlay" class="overlay" hidden>
      <h1 id="ovTitle">打砖块</h1>
      <p id="ovText"></p>
      <button id="ovBtn" type="button">开始</button>
    </div>
  </div>
  <div id="notice"></div>
  <footer id="help">
    <span class="kbd">←</span> <span class="kbd">→</span> 或 <span class="kbd">A</span> <span class="kbd">D</span> 移动挡板 ·
    鼠标 / 触摸移动挡板 · <span class="kbd">空格</span> 发球 · <span class="kbd">空格</span> 或 <span class="kbd">P</span> 暂停/继续 · <span class="kbd">R</span> 重开
  </footer>
</div>
<script>
(function () {
  'use strict';

  /* ============================== 常量与默认数据 ============================== */
  var W = 800, H = 600;
  var FIXED = 1 / 120;              // 固定物理步长（秒），保证跨帧确定性
  var MAX_SUBSTEPS = 5;

  var FIELD = { left: 40, right: 760, top: 70, gap: 6, brickH: 26 };
  var PADDLE_Y = 560, PADDLE_H = 14, PADDLE_SPEED = 620;
  var BALL_R = 8, BALL_MAX_SPEED = 900;

  var DEFAULT_LAYOUT = [
    '1111111111',
    '1111111111',
    '0222222220',
    '0222222220',
    '0033333300',
    '0000330000'
  ];

  var DEFAULTS = {
    title: '基础关',
    lives: 3,
    cols: 10,
    rows: 6,
    brickHP: 1,
    basePoints: 10,
    paddleWidth: 110,
    ballSpeed: 380,
    layout: DEFAULT_LAYOUT
  };

  // 每个字段的可接受区间：非法值一律钳制或回退，绝不抛异常
  var LIMITS = {
    lives:       [1, 9],
    cols:        [1, 20],
    rows:        [1, 14],
    brickHP:     [1, 5],
    basePoints:  [1, 1000],
    paddleWidth: [40, 400],
    ballSpeed:   [120, BALL_MAX_SPEED]
  };

  var MAX_TITLE_LEN = 24;           // 关卡名显示上限（超长截断加省略号）
  var MAX_BRICKS = 20 * 14;         // 砖块总数硬上限
  var ROW_COLORS = ['#ff7a7a', '#ffb347', '#ffe66d', '#7ce08a', '#5cc8ff', '#b58cff'];

  /* ============================== 工具函数（纯函数，无副作用） ============================== */
  function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }

  function toFinite(v, fallback, lo, hi) {
    var n = v;
    if (typeof n === 'string') { n = n.trim(); if (n === '') return fallback; n = Number(n); }
    if (typeof n !== 'number' || !isFinite(n)) return fallback;
    return clamp(n, lo, hi);
  }

  function toInt(v, fallback, lo, hi) {
    var n = toFinite(v, NaN, lo, hi);
    if (!isFinite(n)) return fallback;
    return clamp(Math.round(n), lo, hi);
  }

  // 文本消毒：非字符串一律回退；剥离控制字符；超长截断
  function toText(v, fallback, maxLen) {
    if (v === null || v === undefined) return fallback;
    var t = typeof v;
    if (t === 'object' || t === 'function' || t === 'boolean') return fallback;
    var s = String(v).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim();
    if (s.length === 0) return fallback;
    return s;
  }

  function num(v, fallback) {
    var n = typeof v === 'string' ? Number(v.trim()) : v;
    return (typeof n === 'number' && isFinite(n)) ? n : fallback;
  }

  /* ============================== 配置解析与消毒 ============================== */
  // 返回 { config, issues[] }；任何非法输入都降级为 issue 文本，不抛异常
  function sanitizeConfig(raw) {
    var issues = [];
    var cfg = {
      title: DEFAULTS.title,
      lives: DEFAULTS.lives,
      cols: DEFAULTS.cols,
      rows: DEFAULTS.rows,
      brickHP: DEFAULTS.brickHP,
      basePoints: DEFAULTS.basePoints,
      paddleWidth: DEFAULTS.paddleWidth,
      ballSpeed: DEFAULTS.ballSpeed,
      layout: null
    };
    if (raw === null || raw === undefined || typeof raw !== 'object' || raw instanceof Array) {
      if (raw !== null && raw !== undefined) issues.push('配置不是对象，已回退默认关卡');
      cfg.layout = DEFAULT_LAYOUT.slice();
      return { config: cfg, issues: issues };
    }

    function pick(key) {
      var def = DEFAULTS[key], lim = LIMITS[key], got = raw[key];
      var val = (key === 'lives' || key === 'cols' || key === 'rows' ||
                 key === 'brickHP' || key === 'basePoints')
        ? toInt(got, def, lim[0], lim[1])
        : toFinite(got, def, lim[0], lim[1]);
      if (got !== undefined && num(got, NaN) !== val) {
        issues.push('字段 ' + key + ' 取值非法/越界，已修正为 ' + val);
      }
      return val;
    }

    cfg.lives = pick('lives');
    cfg.cols = pick('cols');
    cfg.rows = pick('rows');
    cfg.brickHP = pick('brickHP');
    cfg.basePoints = pick('basePoints');
    cfg.paddleWidth = pick('paddleWidth');
    cfg.ballSpeed = pick('ballSpeed');

    var titleRaw = raw.title;
    cfg.title = toText(titleRaw, DEFAULTS.title, MAX_TITLE_LEN);
    if (typeof titleRaw === 'string' && titleRaw.length > MAX_TITLE_LEN) {
      issues.push('关卡名超长（' + titleRaw.length + ' 字符），已截断显示');
    } else if (titleRaw !== undefined && typeof titleRaw !== 'string') {
      issues.push('关卡名非字符串，已回退');
    }

    // layout：接受字符串数组；逐行清洗为 0/1..9 的等宽行
    var layout = null, rawLayout = raw.layout;
    if (typeof rawLayout === 'string') rawLayout = rawLayout.split('\n');
    if (rawLayout instanceof Array) {
      layout = [];
      for (var i = 0; i < rawLayout.length && layout.length < cfg.rows; i++) {
        var row = rawLayout[i];
        if (typeof row !== 'string' && typeof row !== 'number') continue;
        var s = String(row).replace(/\s+/g, '');
        if (!/^[0-9]*$/.test(s)) { s = s.replace(/[^0-9]/g, ''); issues.push('第 ' + (i + 1) + ' 行关卡数据含非法字符，已剔除'); }
        if (s.length === 0) continue;
        if (s.length > cfg.cols) { s = s.slice(0, cfg.cols); issues.push('第 ' + (i + 1) + ' 行超宽，已截断到 ' + cfg.cols + ' 列'); }
        while (s.length < cfg.cols) s += '0';
        layout.push(s);
      }
    } else if (rawLayout !== undefined) {
      issues.push('layout 不是数组，已回退默认关卡');
    }

    if (!layout) {
      layout = DEFAULT_LAYOUT.slice();
    } else {
      var alive = 0;
      for (var r = 0; r < layout.length; r++) {
        for (var c = 0; c < layout[r].length; c++) if (layout[r].charAt(c) !== '0') alive++;
      }
      if (alive === 0) { issues.push('关卡为空（无任何砖块），已回退默认关卡'); layout = DEFAULT_LAYOUT.slice(); }
    }
    if (layout.length > cfg.rows) layout = layout.slice(0, cfg.rows);
    cfg.layout = layout;
    return { config: cfg, issues: issues };
  }

  // 从 URL 读取 ?cfg=<json>；解码/解析失败均回退
  function readUrlConfig(search) {
    var issues = [], raw = null;
    try {
      var m = /[?&]cfg=([^&#]*)/.exec(search || '');
      if (m && m[1]) {
        var text = decodeURIComponent(m[1]);
        raw = JSON.parse(text);
      }
    } catch (err) {
      issues.push('URL 配置无法解析（' + (err && err.name ? err.name : 'Error') + '），已回退默认关卡');
      raw = null;
    }
    var res = sanitizeConfig(raw);
    return { config: res.config, issues: issues.concat(res.issues) };
  }

  /* ============================== DOM ============================== */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var wrapEl = document.getElementById('stageWrap');
  var scoreEl = document.getElementById('score');
  var livesEl = document.getElementById('lives');
  var nameEl = document.getElementById('levelName');
  var stateEl = document.getElementById('stateValue');
  var fpsEl = document.getElementById('fps');
  var noticeEl = document.getElementById('notice');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');

  /* ============================== 游戏状态 ============================== */
  var cfg = DEFAULTS;
  var bricks = [];              // 对象池：重开时复用，不重新分配
  var brickPool = [];
  var bricksAlive = 0;
  var state = 'held';           // held | running | paused | over | win
  var resumeState = 'held';
  var score = 0, lives = 0, shownScore = -1;
  var issues = [];

  var paddle = { x: W / 2, w: DEFAULTS.paddleWidth, y: PADDLE_Y, h: PADDLE_H };
  var ball = { x: W / 2, y: 0, r: BALL_R, vx: 0, vy: 0, speed: DEFAULTS.ballSpeed };
  var keys = { left: false, right: false };
  var paddleGlow = 0, damageFlash = 0, winPulse = 0;
  var events = 0;               // 已发生的关键事件计数（测试可观测）

  /* ============================== 关卡构建（复用对象池） ============================== */
  function buildBricks() {
    var cols = cfg.cols, rows = cfg.layout.length;
    var total = Math.min(rows * cols, MAX_BRICKS);
    var bw = (FIELD.right - FIELD.left - FIELD.gap * (cols - 1)) / cols;
    var idx = 0;
    for (var r = 0; r < rows; r++) {
      var rowStr = cfg.layout[r] || '';
      for (var c = 0; c < cols; c++) {
        if (idx >= total) break;
        var code = c < rowStr.length ? rowStr.charAt(c) : '0';
        var hp = code === '0' ? 0 : toInt(code, 1, 1, LIMITS.brickHP[1]);
        if (hp <= 0) continue;
        var b = brickPool[idx];
        if (!b) { b = { x: 0, y: 0, w: 0, h: 0, hp: 0, maxHP: 0, points: 0, alive: false, flash: 0, row: 0 }; brickPool[idx] = b; }
        b.x = FIELD.left + c * (bw + FIELD.gap);
        b.y = FIELD.top + r * (FIELD.brickH + FIELD.gap);
        b.w = bw; b.h = FIELD.brickH;
        b.maxHP = hp; b.hp = hp;
        b.points = cfg.basePoints * (rows - r);
        b.alive = true; b.flash = 0; b.row = r;
        bricks[idx] = b;
        idx++;
      }
    }
    bricks.length = idx;
    brickPool.length = Math.max(brickPool.length, idx);
    bricksAlive = idx;
  }

  function resetBall() {
    ball.r = BALL_R;
    ball.x = paddle.x;
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
    ball.speed = cfg.ballSpeed;
  }

  function resetGame() {
    cfg = cfg;                       // 保持不变
    paddle.w = cfg.paddleWidth;
    paddle.x = W / 2;
    score = 0; lives = cfg.lives;
    shownScore = -1;
    buildBricks();
    resetBall();
    paddleGlow = damageFlash = winPulse = 0;
    hideOverlay();
    if (bricksAlive === 0) {           // 极端兜底：无砖块也必须有可玩状态
      cfg.layout = DEFAULT_LAYOUT.slice();
      cfg.cols = 10; cfg.rows = 6;
      buildBricks();
    }
    setState('held');
    syncHud();
    updateNotice();
  }

  function launch() {
    if (state === 'held') {
      var ang = (-60 + Math.random() * 120) * Math.PI / 180;   // 出发角上限 ±60°
      ball.vx = Math.sin(ang) * ball.speed;
      ball.vy = -Math.abs(Math.cos(ang) * ball.speed);
      setState('running');
    }
  }

  function loseLife() {
    events++;
    lives--;
    damageFlash = 1;
    restartClass(wrapEl, 'damage');
    if (lives <= 0) {
      setState('over');
      showOverlay('游戏结束', '本局得分 ' + score + ' 分 · 还剩 ' + bricksAlive + ' 块砖未击碎。', '重新开始');
      syncHud();
      return;
    }
    resetBall();
    setState('held');
    syncHud();
  }

  function setState(next) {
    if (next === 'paused') resumeState = state;
    state = next;
    stateEl.setAttribute('data-s', next);
    stateEl.textContent = ({ held: '待发球', running: '进行中', paused: '已暂停', over: '游戏结束', win: '通关' })[next] || next;
  }

  /* ============================== 物理 ============================== */
  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  }

  function stepPhysics(dt) {
    if (state !== 'running') return;

    // 键盘推动挡板
    if (keys.left && !keys.right) paddle.x -= PADDLE_SPEED * dt;
    else if (keys.right && !keys.left) paddle.x += PADDLE_SPEED * dt;
    paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

    // 子步进：单步位移不超过半径，避免高速穿透
    var travel = Math.abs(ball.vx) + Math.abs(ball.vy);
    var needed = travel * dt / (ball.r * 0.5);
    var steps = clamp(Math.ceil(needed), 1, MAX_SUBSTEPS * 4);
    var sub = dt / steps;
    for (var i = 0; i < steps; i++) {
      if (state !== 'running') break;
      subStep(sub);
    }
  }

  function subStep(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 左右墙
    if (ball.x - ball.r < 0) { ball.x = ball.r; if (ball.vx < 0) { ball.vx = -ball.vx; events++; } }
    else if (ball.x + ball.r > W) { ball.x = W - ball.r; if (ball.vx > 0) { ball.vx = -ball.vx; events++; } }
    // 顶墙
    if (ball.y - ball.r < 0) { ball.y = ball.r; if (ball.vy < 0) { ball.vy = -ball.vy; events++; } }

    // 掉出底部
    if (ball.y - ball.r > H) { loseLife(); return; }

    // 挡板：仅当球向下运动且真实相交时反向
    if (ball.vy > 0 && circleHitsRect(ball.x, ball.y, ball.r, paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h)) {
      var rel = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
      var ang = rel * (Math.PI / 3);
      ball.vx = Math.sin(ang) * ball.speed;
      ball.vy = -Math.abs(Math.cos(ang) * ball.speed);
      ball.y = paddle.y - ball.r - 0.01;
      paddleGlow = 1; events++;
    }

    // 砖块：每个子步最多命中一块
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (!circleHitsRect(ball.x, ball.y, ball.r, b.x, b.y, b.w, b.h)) continue;

      var oL = (ball.x + ball.r) - b.x;
      var oR = (b.x + b.w) - (ball.x - ball.r);
      var oT = (ball.y + ball.r) - b.y;
      var oB = (b.y + b.h) - (ball.y - ball.r);
      var minX = oL < oR ? oL : oR;
      var minY = oT < oB ? oT : oB;
      if (minX < minY) {                       // 从左右侧撞入 → 水平反向
        ball.vx = -ball.vx;
        ball.x += (oL < oR) ? -minX : minX;
      } else {                                 // 从上下侧撞入 → 垂直反向
        ball.vy = -ball.vy;
        ball.y += (oT < oB) ? -minY : minY;
      }
      b.flash = 1;
      b.hp -= 1;
      events++;
      if (b.hp <= 0) {
        b.alive = false;
        bricksAlive--;
        score += b.points;
        ball.speed = Math.min(BALL_MAX_SPEED, ball.speed * 1.02);
        onScoreChanged();
        if (bricksAlive <= 0) {
          setState('win');
          showOverlay('通关！', '关卡「' + cfg.title + '」全部击碎，得分 ' + score + ' 分。', '再玩一次');
          syncHud();
        }
      }
      break;
    }
  }

  function holdBall() {
    ball.x = clamp(paddle.x, ball.r, W - ball.r);
    ball.y = paddle.y - ball.r - 1;
    ball.vx = 0; ball.vy = 0;
  }

  function onScoreChanged() {
    events++;
    restartClass(scoreEl, 'bump');
  }

  function restartClass(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;              // 强制重排以重播动画（仅在得分/受伤等低频事件触发）
    el.classList.add(cls);
  }

  /* ============================== 渲染 ============================== */
  function render() {
    ctx.clearRect(0, 0, W, H);

    // 背景网格
    ctx.strokeStyle = 'rgba(76,194,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 0; gx <= W; gx += 40) { ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, H); }
    for (var gy = 0; gy <= H; gy += 40) { ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); }
    ctx.stroke();

    // 砖块
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      var base = ROW_COLORS[b.row % ROW_COLORS.length];
      ctx.fillStyle = base;
      ctx.globalAlpha = b.maxHP > 1 ? (0.55 + 0.45 * (b.hp / b.maxHP)) : 1;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.75 * b.flash) + ')';
        roundRect(b.x, b.y, b.w, b.h, 5);
        ctx.fill();
      }
    }

    // 挡板
    var glow = paddleGlow;
    ctx.fillStyle = glow > 0 ? 'rgb(' + Math.round(120 + 135 * glow) + ',255,' + Math.round(220 - 60 * glow) + ')' : '#7fd8ff';
    roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // 球
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,220,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r - 1.5, 0, Math.PI * 2);
    ctx.stroke();

    // 受击红闪（覆盖层）
    if (damageFlash > 0) {
      ctx.fillStyle = 'rgba(255,107,129,' + (0.28 * damageFlash) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 待发球提示
    if (state === 'held') {
      ctx.fillStyle = 'rgba(232,236,248,0.85)';
      ctx.font = '600 18px "Segoe UI",system-ui,"Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按 空格 或 点击画面 发球', W / 2, H - 90);
      ctx.textAlign = 'start';
    }
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  /* ============================== HUD ============================== */
  function syncHud() {
    if (score !== shownScore) { scoreEl.textContent = String(score); shownScore = score; }
    livesEl.textContent = String(lives);
    nameEl.textContent = cfg.title;
    nameEl.title = cfg.title;
  }

  function updateNotice() {
    noticeEl.textContent = issues.length ? ('配置已回退/修正：' + issues.join('；')) : '';
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.hidden = false;
    try { ovBtn.focus({ preventScroll: true }); } catch (e) { ovBtn.focus(); }
  }
  function hideOverlay() { overlay.hidden = true; }

  /* ============================== 主循环 ============================== */
  var lastTs = 0, acc = 0, frames = 0, fpsAccum = 0, fpsShown = 0, rafId = 0;

  function decay(dt) {
    if (paddleGlow > 0) paddleGlow = Math.max(0, paddleGlow - dt * 4);
    if (damageFlash > 0) damageFlash = Math.max(0, damageFlash - dt * 2.5);
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 5);
    }
  }

  function frame(ts) {
    rafId = requestAnimationFrame(frame);
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.25) dt = 0.25;          // 切后台回来不追帧、不爆炸

    frames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      var f = Math.round(frames / fpsAccum);
      if (f !== fpsShown) { fpsShown = f; fpsEl.textContent = String(f); }
      frames = 0; fpsAccum = 0;
    }

    if (state === 'running') {
      acc += dt;
      var n = 0;
      while (acc >= FIXED && n < MAX_SUBSTEPS * 4) { stepPhysics(FIXED); acc -= FIXED; n++; }
      if (acc > FIXED * 20) acc = 0;
      if (state !== 'running') acc = 0;
    } else if (state === 'held') {
      holdBall();
      acc = 0;
    } else {
      acc = 0;
    }

    decay(dt);
    render();
  }

  /* ============================== 输入 ============================== */
  function canvasX(clientX) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return paddle.x;
    return clamp((clientX - rect.left) * (W / rect.width), 0, W);
  }

  function movePaddleTo(x) {
    paddle.x = clamp(x, paddle.w / 2, W - paddle.w / 2);
    if (state === 'held') holdBall();
  }

  function onPointerMove(e) { movePaddleTo(canvasX(e.clientX)); }
  function onPointerDown(e) {
    movePaddleTo(canvasX(e.clientX));
    if (state === 'held') launch();
  }

  function onKeyDown(e) {
    var code = e.key || '';
    var k = code.length === 1 ? code.toLowerCase() : code;
    if (k === 'ArrowLeft' || k === 'a') { keys.left = true; e.preventDefault(); if (state === 'held') launch(); return; }
    if (k === 'ArrowRight' || k === 'd') { keys.right = true; e.preventDefault(); if (state === 'held') launch(); return; }
    if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') {
      e.preventDefault();
      if (state === 'held') { launch(); return; }
      if (state === 'running') { setState('paused'); showOverlay('已暂停', '按 空格 / P 或点击下方按钮继续。', '继续'); return; }
      if (state === 'paused') { resume(); return; }
      return;
    }
    if (k === 'r' || k === 'R') { e.preventDefault(); resetGame(); return; }
    if (k === 'Enter' && (state === 'over' || state === 'win')) { resetGame(); return; }
  }

  function onKeyUp(e) {
    var code = e.key || '';
    var k = code.length === 1 ? code.toLowerCase() : code;
    if (k === 'ArrowLeft' || k === 'a') keys.left = false;
    if (k === 'ArrowRight' || k === 'd') keys.right = false;
  }

  function onBlur() { keys.left = false; keys.right = false; }

  function resume() {
    if (state !== 'paused') return;
    hideOverlay();
    setState(resumeState === 'paused' ? 'running' : resumeState);
  }

  function onOverlayBtn() {
    if (state === 'paused') { resume(); return; }
    if (state === 'held') { hideOverlay(); launch(); return; }   // 开局遮罩：点「开始游戏」即刻发球
    resetGame();                       // over / win → 真正重开
  }

  // 监听器只在初始化时绑定一次；重开不重复注册
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', onBlur);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerdown', onPointerDown);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) onOverlayBtn(); });
  ovBtn.addEventListener('click', onOverlayBtn);

  /* ============================== 启动 ============================== */
  var boot = readUrlConfig(location.search);
  cfg = boot.config;
  issues = boot.issues;
  resetGame();
  showOverlay('打砖块', '击碎全部 ' + bricksAlive + ' 块砖得分；球掉出底部扣 1 条命。空格发球，P 暂停。', '开始游戏');
  stateEl.textContent = '待发球';
  rafId = requestAnimationFrame(frame);

  /* ============================== 测试与诊断接口（同一物理代码路径） ============================== */
  window.__breakout = {
    version: '1.0.0',
    // 手动推进物理：使用与主循环完全相同的 stepPhysics 路径，结果确定可复算
    simulate: function (ms) {
      var steps = Math.max(0, Math.round(num(ms, 0) / 1000 / FIXED));
      for (var i = 0; i < steps; i++) stepPhysics(FIXED);
      return this.getState();
    },
    getState: function () {
      return {
        state: state,
        score: score,
        lives: lives,
        levelTitle: cfg.title,
        bricksAlive: bricksAlive,
        brickCount: bricks.length,
        brickArrayLength: bricks.length,
        poolLength: brickPool.length,
        ball: { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, r: ball.r, speed: ball.speed },
        paddle: { x: paddle.x, w: paddle.w, y: paddle.y },
        events: events,
        issues: issues.slice()
      };
    },
    bricks: function () {
      var out = [], i;
      for (i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        out.push({ x: b.x, y: b.y, w: b.w, h: b.h, hp: b.hp, maxHP: b.maxHP, points: b.points, alive: b.alive, row: b.row });
      }
      return out;
    },
    setBall: function (x, y, vx, vy) {
      ball.x = num(x, ball.x); ball.y = num(y, ball.y);
      ball.vx = num(vx, 0); ball.vy = num(vy, 0);
      ball.speed = Math.max(1, Math.hypot(ball.vx, ball.vy) || cfg.ballSpeed);
      if (state === 'held') setState('running');
      return this.getState();
    },
    setPaddle: function (x) { movePaddleTo(num(x, paddle.x)); return this.getState(); },
    launch: function () { launch(); return this.getState(); },
    pause: function () { if (state === 'running' || state === 'held') { setState('paused'); showOverlay('已暂停', '按 空格 / P 或点击下方按钮继续。', '继续'); } return this.getState(); },
    resume: function () { resume(); return this.getState(); },
    restart: function () { resetGame(); return this.getState(); },
    key: function (keyName, down) {
      var ev = { key: keyName, preventDefault: function () {} };
      if (down === false) onKeyUp(ev); else onKeyDown(ev);
      return this.getState();
    },
    // 供内存/帧稳定性核验
    stats: function () {
      return { brickPoolLength: brickPool.length, brickArrayLength: bricks.length, issues: issues.length, events: events, heap: (performance && performance.memory) ? performance.memory.usedJSHeapSize : null };
    },
    applyConfig: function (raw) {
      var res = sanitizeConfig(raw);
      cfg = res.config;
      issues = res.issues;
      resetGame();
      return { ok: true, issues: issues.slice(), state: this.getState() };
    },
    fromUrl: function (search) { return readUrlConfig(search); }
  };
})();
</script>
</body>
</html>
