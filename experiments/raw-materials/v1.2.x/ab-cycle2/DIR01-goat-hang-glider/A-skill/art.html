<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山羊驾滑翔机 · Goat Hang-Glider</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#2b2a58;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}

  /* ---- 非旋转类效果：CSS @keyframes（7 组） ---- */
  @keyframes twinkleA{0%,100%{opacity:.10}50%{opacity:.95}}
  @keyframes twinkleB{0%,100%{opacity:.90}50%{opacity:.18}}
  @keyframes twinkleC{0%,100%{opacity:.25}45%{opacity:1}70%{opacity:.35}}
  @keyframes cloudShimmer{0%,100%{opacity:.90}50%{opacity:1}}
  @keyframes wingGlow{0%,100%{opacity:.10}50%{opacity:.46}}
  @keyframes vortexGlow{0%,100%{opacity:.18}50%{opacity:.62}}
  @keyframes birdDrift{from{transform:translateX(0)}to{transform:translateX(-240px)}}

  .tw1{animation:twinkleA 2.0s linear infinite}
  .tw2{animation:twinkleB 2.7s linear infinite}
  .tw3{animation:twinkleC 3.3s linear infinite}
  .shimmer{animation:cloudShimmer 9s ease-in-out infinite}
  .wingglow{animation:wingGlow 6s ease-in-out infinite}
  .vortexglow{animation:vortexGlow 2.5s ease-in-out infinite}
  .birds{animation:birdDrift 7s linear infinite}

  #hud{position:fixed;left:10px;top:10px;z-index:9;display:none;
       font:12px/1.55 ui-monospace,Consolas,monospace;color:#eaf0ff;
       background:rgba(8,10,24,.78);border:1px solid rgba(190,210,255,.28);
       border-radius:8px;padding:8px 11px;white-space:pre;pointer-events:none}
</style>
</head>
<body>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"

  <title id="ttl">山羊驾驶悬挂滑翔机</title>
  <desc id="dsc">黄昏山谷上，一只山羊悬吊在三角翼悬挂滑翔机的吊带与操纵架之间滑翔；
        翼尖拖出涡流飘带，背景共四层视差（远雪山 / 中云带 / 近山脊 / 前景草坡），

  <!-- ⑤ 主角：山羊 + 悬挂滑翔机（局部原点 = 吊点；机头朝右，全部视差层向左） -->

<div id="hud"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     确定性滑翔仿真
     因果链：摆腿(1.2s) → 重心位移 → 俯仰(6.0s，领先 90°) → 升力 →
             高度(6.0s, sin) → 相机高度 → 四层地速（层基速 1:2.5:6:10 同步缩放）
     爬升段（cos>0）机头仰起；下降段机头低垂。飞得越高，地景掠过越慢。
     ============================================================ */
  var CFG = {
    T: 6.0,          // 滑翔浮沉周期 (s)
    BOB: 26,         // 高度振幅 (px)
    PITCH: 6,        // 俯仰振幅 (deg)
    CAM_BETA: 0.35,  // 高度 → 地速耦合系数
    LEG_RATIO: 5,    // 附肢 : 载具 频率比 = 6.0 / 1.2
    DT: 1 / 60,      // 固定仿真步长 (s)
    TILE: 1200,      // 视差贴片宽 (px) = 视口宽 → 无缝循环
    LAYERS: [
      { id: "lyr-far",  dur: 30, base: 40  },  //  1× —— 远雪山
      { id: "lyr-mid",  dur: 12, base: 100 },  // 2.5× —— 中云带
      { id: "lyr-near", dur: 5,  base: 240 },  //  6× —— 近山脊
      { id: "lyr-fore", dur: 3,  base: 400 }   // 10× —— 前景草坡
    ]
  };
  var W = 2 * Math.PI / CFG.T;
  var GX = 600, GY = 265;
  var svg = document.getElementById("stage");
  var glider = document.getElementById("glider");

  function wrap(d) { return -(((d % CFG.TILE) + CFG.TILE) % CFG.TILE); }

  /* 闭式解：dist(t) = base · [ t − β(1−cos ωt)/ω ]，由 sin 型高度积分得来 */
  function stateAt(t) {
    var s = Math.sin(W * t), c = Math.cos(W * t);
    var alt = CFG.BOB * s;
    var pitch = CFG.PITCH * c;
    var vfac = 1 - CFG.CAM_BETA * s;
    var layers = CFG.LAYERS.map(function (L) {
      var dist = L.base * (t - CFG.CAM_BETA * (1 - c) / W);
      return { id: L.id, dur: L.dur, base: L.base, speed: L.base * vfac, dist: dist, dx: wrap(dist) };
    });
    return { t: t, alt: alt, pitch: pitch, vfac: vfac, layers: layers };
  }

  /* 定步长数值积分（与闭式解互为独立实现，用于复算比对） */
  function stateNumeric(t) {
    var n = Math.round(t / CFG.DT), acc = CFG.LAYERS.map(function () { return 0; });
    for (var i = 0; i < n; i++) {
      var vf = 1 - CFG.CAM_BETA * Math.sin(W * i * CFG.DT);
      for (var j = 0; j < CFG.LAYERS.length; j++) acc[j] += CFG.LAYERS[j].base * vf * CFG.DT;
    }
    return acc;
  }

  function verify(t) {
    var closed = stateAt(t).layers.map(function (L) { return L.dist; });
    var num = stateNumeric(t);
    var err = closed.map(function (v, i) { return Math.abs(v - num[i]); });
    return { t: t, closed: closed, numeric: num, absErr: err, maxErr: Math.max.apply(null, err) };
  }

  function apply(t) {
    var s = stateAt(t);
    glider.setAttribute("transform",
      "translate(" + GX + "," + (GY - s.alt).toFixed(4) + ") rotate(" + (-s.pitch).toFixed(4) + ")");
    for (var i = 0; i < s.layers.length; i++) {
      document.getElementById(s.layers[i].id)
        .setAttribute("transform", "translate(" + s.layers[i].dx.toFixed(3) + ",0)");
    }
    return s;
  }

  /* ---------- 时间轴：实时播放 / 冻结任意帧 ---------- */
  var frozen = null, t0 = null, last = null;

  function cssAnims() {
    if (!document.getAnimations) return [];
    return document.getAnimations().filter(function (a) {
      var n = a.constructor && a.constructor.name;
      return n === "CSSAnimation" || n === "CSSTransition";
    });
  }

  function freeze(t) {
    frozen = t; last = t;
    try { svg.pauseAnimations(); } catch (e) {}
    cssAnims().forEach(function (a) { try { a.pause(); a.currentTime = t * 1000; } catch (e) {} });
    apply(t);
  }
  function resume() {
    frozen = null; t0 = null;
    try { svg.unpauseAnimations(); } catch (e) {}
    cssAnims().forEach(function (a) { try { a.play(); } catch (e) {} });
  }

  var hudEl = document.getElementById("hud"), hudOn = false;
  function hudText(s) {
    var lines = ["t=" + s.t.toFixed(3) + "s   alt=" + s.alt.toFixed(2) + "px   pitch=" +
                 s.pitch.toFixed(2) + "deg   groundFactor=" + s.vfac.toFixed(3)];
    s.layers.forEach(function (L) {
      lines.push("  " + L.id + "  dur=" + L.dur + "s  v=" + L.speed.toFixed(1) +
                 "px/s  dx=" + L.dx.toFixed(1));
    });
    return lines.join("\n");
  }
  function hud(s) { if (hudOn) hudEl.textContent = hudText(s); }

  function frame(ts) {
    if (t0 === null) t0 = ts;
    var t = (frozen !== null) ? frozen : (ts - t0) / 1000;
    if (frozen === null) last = t;
    hud(apply(t));
    requestAnimationFrame(frame);
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "d") {
      hudOn = !hudOn;
      hudEl.style.display = hudOn ? "block" : "none";
      if (hudOn) hud(stateAt(frozen === null ? (last || 0) : frozen));
    } else if (k === " ") {
      e.preventDefault();
      if (frozen === null) freeze(last || 0); else resume();
    } else if (k === "arrowright" && frozen !== null) {
      e.preventDefault(); freeze(frozen + CFG.DT);
    } else if (k === "arrowleft" && frozen !== null) {
      e.preventDefault(); freeze(Math.max(0, frozen - CFG.DT));
    }
  });

  window.GLIDE = {
    params: CFG,
    stateAt: stateAt,
    stateNumeric: stateNumeric,
    verify: verify,
    apply: apply,
    freeze: freeze,
    resume: resume,
    isFrozen: function () { return frozen !== null; }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
