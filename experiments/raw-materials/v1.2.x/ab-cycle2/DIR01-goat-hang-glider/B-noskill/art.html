<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山羊驾滑翔机 · Goat on a Hang Glider</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    position:fixed;inset:0;
    background:linear-gradient(#123a5e 0%,#2f7ba8 28%,#79b6d8 52%,#bcdcea 72%,#f0d3a4 86%,#f6c07d 100%);
  }
  #stage{display:block;width:100%;height:100%}

  /* ============================================================
     视差层：四层，纵向位移一律 1200 用户单位，周期 48/24/12/6 s
     速度比 8 : 4 : 2 : 1（远慢近快）
     ============================================================ */
  .lyr{animation-timing-function:linear;animation-iteration-count:infinite;animation-direction:normal}
  .ly-far{animation-name:driftFar;animation-duration:48s}
  .ly-mid{animation-name:driftMid;animation-duration:24s}
  .ly-near{animation-name:driftNear;animation-duration:12s}
  .ly-ground{animation-name:driftGround;animation-duration:6s}
  @keyframes driftFar   {from{transform:translateX(0)}      to{transform:translateX(-1200px)}}
  @keyframes driftMid   {from{transform:translateX(0)}      to{transform:translateX(-1200px)}}
  @keyframes driftNear  {from{transform:translateX(0)}      to{transform:translateX(-1200px)}}
  @keyframes driftGround{from{transform:translateX(0)}      to{transform:translateX(-1200px)}}

  /* ============================================================
     载具（滑翔机）：整机浮沉 4.8s，机翼绕悬挂点翻滚 3.4s
     ============================================================ */
  .glider{animation:glideBob 4.8s ease-in-out infinite}
  @keyframes glideBob{
    0%  {transform:translate(0,0)}
    50% {transform:translate(-10px,-18px)}
    100%{transform:translate(0,0)}
  }

  /* 所有绕非原点旋转的部件：以 viewBox 用户坐标写死枢轴 */
  .pv{transform-box:view-box}

  .wing-g{transform-box:view-box;transform-origin:642px 282px;
          animation:wingRoll 3.4s ease-in-out infinite}
  @keyframes wingRoll{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}

  .pennant-g{transform-box:view-box;transform-origin:557px 130px;
          animation:pennantFlap 0.90s ease-in-out infinite}
  @keyframes pennantFlap{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(10deg)}}

  /* 骑手（山羊）整体绕吊带下端摆荡，与机翼反相且异频 */
  .pilot-g{transform-box:view-box;transform-origin:642px 300px;
          animation:pilotSwing 2.6s ease-in-out infinite}
  @keyframes pilotSwing{0%,100%{transform:rotate(1.8deg)}50%{transform:rotate(-1.8deg)}}

  .head-g{transform-box:view-box;transform-origin:712px 346px;
          animation:headNod 2.8s ease-in-out infinite}
  @keyframes headNod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3.2deg)}}

  .ear-n{transform-box:view-box;transform-origin:794px 366px;
          animation:earFlapNear 0.62s ease-in-out infinite}
  @keyframes earFlapNear{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}
  .ear-f{transform-box:view-box;transform-origin:790px 358px;
          animation:earFlapFar 0.74s ease-in-out infinite}
  @keyframes earFlapFar{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-8deg)}}

  .beard-g{transform-box:view-box;transform-origin:832px 391px;
          animation:beardWave 0.52s ease-in-out infinite}
  @keyframes beardWave{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-7deg)}}

  .tail-g{transform-box:view-box;transform-origin:562px 332px;
          animation:tailWag 0.86s ease-in-out infinite}
  @keyframes tailWag{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}

  /* 附肢：前肢轻握操纵杆（小幅），后肢自由踢蹬（大幅），四条腿各自异频 */
  .leg-fn{transform-box:view-box;transform-origin:694px 352px;
          animation:legFrontNear 0.95s ease-in-out infinite}
  @keyframes legFrontNear{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}
  .leg-ff{transform-box:view-box;transform-origin:700px 346px;
          animation:legFrontFar 1.15s ease-in-out infinite}
  @keyframes legFrontFar{0%,100%{transform:rotate(3.5deg)}50%{transform:rotate(-3.5deg)}}
  .leg-hn{transform-box:view-box;transform-origin:578px 352px;
          animation:legHindNear 1.28s ease-in-out infinite}
  @keyframes legHindNear{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
  .leg-hf{transform-box:view-box;transform-origin:584px 346px;
          animation:legHindFar 1.46s ease-in-out infinite}
  @keyframes legHindFar{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}

  /* 背景生物与光晕 */
  .sun-g{transform-box:view-box;transform-origin:958px 146px;
          animation:sunPulse 7s ease-in-out infinite}
  @keyframes sunPulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.10);opacity:1}}

  .birds{animation:birdDrift 30s linear infinite}
  @keyframes birdDrift{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
  .bird-a{transform-box:view-box;transform-origin:240px 152px;
          animation:birdFlapA 1.10s ease-in-out infinite}
  @keyframes birdFlapA{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.32)}}
  .bird-b{transform-box:view-box;transform-origin:186px 194px;
          animation:birdFlapB 0.86s ease-in-out infinite}
  @keyframes birdFlapB{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  @media (prefers-reduced-motion:reduce){
    .lyr,.glider,.wing-g,.pennant-g,.pilot-g,.head-g,.ear-n,.ear-f,
    .beard-g,.tail-g,.leg-fn,.leg-ff,.leg-hn,.leg-hf,.sun-g,.birds,
    .bird-a,.bird-b{animation-duration:0.001s}
  }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只山羊驾驶三角翼滑翔机在夕照云海上飞行">
  <defs>
    <!-- 天空 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#123a5e"/>
      <stop offset="0.28" stop-color="#2f7ba8"/>
      <stop offset="0.52" stop-color="#79b6d8"/>
      <stop offset="0.72" stop-color="#bcdcea"/>
      <stop offset="0.86" stop-color="#f0d3a4"/>
      <stop offset="1"    stop-color="#f6c07d"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0"    stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe6a8" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>

    <!-- 伞布 -->
    <linearGradient id="sailGrad" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef5fb"/>
      <stop offset="1"   stop-color="#c6d9e9"/>
    </linearGradient>

    <!-- 云朵拼件 -->
    <g id="cSm" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="42" ry="16"/>
      <circle cx="-16" cy="-8" r="17"/>
      <circle cx="14"  cy="-11" r="21"/>
      <circle cx="40"  cy="-2"  r="13"/>
    </g>
    <g id="cBg" fill="#ffffff">
      <ellipse cx="0"   cy="0"   rx="70" ry="24"/>
      <circle  cx="-30" cy="-14" r="27"/>
      <circle  cx="16"  cy="-20" r="34"/>
      <circle  cx="58"  cy="-7"  r="22"/>
      <circle  cx="-62" cy="-2"  r="18"/>
    </g>

    <!-- 背景植被拼件 -->
    <g id="tree">
      <path d="M0,-34 L13,0 L-13,0 Z"/>
      <rect x="-2.5" y="-2" width="5" height="9"/>
    </g>
    <g id="bush">
      <ellipse cx="0"   cy="0" rx="26" ry="14"/>
      <ellipse cx="-18" cy="6" rx="18" ry="10"/>
      <ellipse cx="20"  cy="5" rx="16" ry="9"/>
    </g>

    <!-- ========== 视差层内容：宽度严格占满 [0,1200]，两端等高以便无缝平铺 ========== -->
    <!-- 第 1 层（最远，48s）：远山剪影 + 高空薄云 -->
    <g id="farSet">
      <path d="M0,700 L0,546 L82,468 L152,522 L242,432 L332,528 L422,472 L518,548 L618,456
               L702,532 L798,478 L882,548 L978,462 L1078,540 L1148,500 L1200,546 L1200,700 Z"
            fill="#8fb6cf" opacity="0.55"/>
      <use href="#cSm" x="152"  y="196" opacity="0.55"/>
      <use href="#cSm" x="470"  y="146" opacity="0.45"/>
      <use href="#cSm" x="768"  y="212" opacity="0.50"/>
      <use href="#cSm" x="1018" y="160" opacity="0.42"/>
    </g>

    <!-- 第 2 层（24s）：中景云团 + 远丘 -->
    <g id="midSet">
      <path d="M0,700 L0,590 Q150,506 300,578 Q450,650 600,566 Q750,482 900,568 Q1050,656 1200,590
               L1200,700 Z" fill="#7fa9bd" opacity="0.72"/>
      <use href="#cBg" x="236"  y="150" opacity="0.72"/>
      <use href="#cBg" x="706"  y="184" opacity="0.60"/>
      <use href="#cBg" x="1024" y="228" opacity="0.70"/>
    </g>

    <!-- 第 3 层（12s）：近山 + 树 -->
    <g id="nearSet">
      <path d="M0,700 L0,632 Q120,558 260,622 Q400,686 540,614 Q680,542 820,618 Q960,694 1100,628
               Q1160,596 1200,632 L1200,700 Z" fill="#4e8a63"/>
      <g fill="#356b4c">
        <use href="#tree" x="112" y="600"/>
        <use href="#tree" x="150" y="594"/>
        <use href="#tree" x="188" y="598"/>
        <use href="#tree" x="250" y="624"/>
        <use href="#tree" x="636" y="592"/>
        <use href="#tree" x="680" y="583"/>
        <use href="#tree" x="724" y="590"/>
        <use href="#tree" x="1084" y="632"/>
      </g>
    </g>

    <!-- 第 4 层（最近，6s）：前景土坡与灌木 -->
    <g id="groundSet">
      <path d="M0,700 L0,676 Q100,628 220,668 Q340,708 460,658 Q580,612 700,662 Q820,708 940,652
               Q1060,602 1200,676 L1200,700 Z" fill="#2c5c42"/>
      <g fill="#20452f">
        <use href="#bush" x="79"   y="656"/>
        <use href="#bush" x="196"  y="664"/>
        <use href="#bush" x="340"  y="689"/>
        <use href="#bush" x="580"  y="640"/>
        <use href="#bush" x="820"  y="686"/>
        <use href="#bush" x="904"  y="670"/>
        <use href="#bush" x="1065" y="637"/>
      </g>
    </g>
  </defs>

  <!-- ============================ 天空 ============================ -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#sky)"/>

  <g class="sun-g">
    <circle cx="958" cy="146" r="126" fill="url(#sunGlow)"/>
    <circle cx="958" cy="146" r="40"  fill="#fff8e0"/>
  </g>

  <!-- ========================= 视差背景层 ========================= -->
  <g class="lyr ly-far"><use href="#farSet"/><use href="#farSet" x="1200"/></g>
  <g class="lyr ly-mid"><use href="#midSet"/><use href="#midSet" x="1200"/></g>

  <!-- 飞鸟：自带 30s 漂移，与云层速度不同 -->
  <g class="birds">
    <g class="bird-a">
      <path d="M226,146 Q233,138 240,150 Q247,138 254,146" fill="none"
            stroke="#2f4a5e" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>
    <g class="bird-b">
      <path d="M176,190 Q181,184 186,192 Q191,184 196,190" fill="none"
            stroke="#2f4a5e" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
    </g>
    <g class="bird-a" transform="translate(1200,0)">
      <path d="M226,146 Q233,138 240,150 Q247,138 254,146" fill="none"
            stroke="#2f4a5e" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    </g>
    <g class="bird-b" transform="translate(1200,0)">
      <path d="M176,190 Q181,184 186,192 Q191,184 196,190" fill="none"
            stroke="#2f4a5e" stroke-width="2.4" stroke-linecap="round" opacity="0.75"/>
    </g>
  </g>

  <g class="lyr ly-near"><use href="#nearSet"/><use href="#nearSet" x="1200"/></g>
  <g class="lyr ly-ground"><use href="#groundSet"/><use href="#groundSet" x="1200"/></g>

  <!-- ====================== 滑翔机 + 山羊 ====================== -->
  <g class="glider">

    <!-- ---------- 载具：三角翼 ---------- -->
    <g class="wing-g">
      <!-- 龙骨（被伞布遮住下缘，只作结构交代） -->
      <path d="M890,300 Q640,290 400,250" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round"/>
      <!-- 龙骨立柱 -->
      <path d="M557,272 L557,128" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round"/>
      <!-- 立柱上拉索 -->
      <path d="M557,131 L888,299" fill="none" stroke="#6d8698" stroke-width="1.8" opacity="0.9"/>
      <!-- 伞布 -->
      <path d="M890,300 Q600,150 270,148 Q330,215 400,250 Q640,290 890,300 Z"
            fill="url(#sailGrad)" stroke="#20455f" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- 翼肋 -->
      <g fill="none" stroke="#9fb6c8" stroke-width="1.7" opacity="0.85">
        <path d="M712,288 L676,211"/>
        <path d="M800,294 L772,246"/>
      </g>
      <!-- 前缘管 -->
      <path d="M890,300 Q600,150 270,148" fill="none" stroke="#d2452f" stroke-width="6" stroke-linecap="round"/>
      <circle cx="890" cy="300" r="7" fill="#20455f"/>
      <!-- 风旗（迎风后掠） -->
      <g class="pennant-g">
        <path d="M557,128 L500,140 L557,152 Z" fill="#d2452f"/>
      </g>
      <!-- 操纵架（A 形架） -->
      <g fill="none" stroke="#35566e" stroke-width="6" stroke-linecap="round">
        <path d="M830,297 L762,430"/>
        <path d="M830,297 L900,430"/>
        <path d="M756,430 L906,430"/>
      </g>
    </g>

    <!-- ---------- 骑手：山羊（俯卧悬挂，面朝右，与机头同向） ---------- -->
    <g class="pilot-g">
      <!-- 吊带 -->
      <path d="M642,282 L658,316" fill="none" stroke="#6b7d8c" stroke-width="4" stroke-linecap="round"/>

      <!-- 远侧后肢（在身体之后） -->
      <g class="leg-hf">
        <path d="M584,346 L524,384 L482,410" fill="none" stroke="#a89275"
              stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="478" cy="410" rx="9" ry="7" fill="#4a3f33"/>
      </g>
      <!-- 远侧前肢 -->
      <g class="leg-ff">
        <path d="M700,346 L746,384 L790,418" fill="none" stroke="#a89275"
              stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="794" cy="421" rx="9" ry="7" fill="#4a3f33"/>
      </g>

      <!-- 尾巴（翘起并带穗） -->
      <g class="tail-g">
        <path d="M572,322 C548,308 524,296 504,288" fill="none" stroke="#e6ded0"
              stroke-width="11" stroke-linecap="round"/>
        <path d="M508,290 C494,278 484,274 476,276 C486,284 492,292 494,300 Z"
              fill="#cfc3ae" stroke="#3a3226" stroke-width="1.5" stroke-linejoin="round"/>
      </g>

      <!-- 躯干 + 颈部：合成单条闭合轮廓，避免两段描边产生接缝 -->
      <path d="M566,316 C586,311 660,314 686,318 C714,322 740,322 792,342 L788,388
               C744,384 706,378 686,372 L578,370 C556,368 546,350 552,336
               C556,322 560,317 566,316 Z"
            fill="#f4eee2" stroke="#3a3226" stroke-width="2.6" stroke-linejoin="round"/>

      <!-- 近侧后肢 -->
      <g class="leg-hn">
        <path d="M576,356 L512,392 L466,414" fill="none" stroke="#c9b393"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="462" cy="415" rx="10" ry="7.5" fill="#4a3f33"/>
      </g>
      <!-- 近侧前肢 -->
      <g class="leg-fn">
        <path d="M694,352 L740,392 L782,422" fill="none" stroke="#c9b393"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="786" cy="426" rx="10" ry="7.5" fill="#4a3f33"/>
      </g>

      <!-- 头部：低头前伸的飞行姿态；双角向上后掠，双耳为扁平后贴叶形 -->
      <g class="head-g">
        <!-- 远侧角（基部粗、尖端细，向上后掠） -->
        <path d="M800,334 C788,316 772,308 754,304 C772,310 784,326 792,346 Z"
              fill="#d3c0a0" stroke="#3a3226" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 远侧耳 -->
        <path d="M792,352 C776,351 762,355 753,362 C750,366 753,370 759,369
                 C774,364 785,361 794,360 Z"
              fill="#b9a68a" stroke="#3a3226" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 头骨 + 钝吻 -->
        <path d="M784,342 C798,336 812,340 820,348 C834,350 844,356 852,362
                 C860,367 861,377 852,381 L836,383 C830,391 818,395 806,393
                 C790,395 778,388 778,372 Z"
              fill="#f4eee2" stroke="#3a3226" stroke-width="2.6" stroke-linejoin="round"/>
        <!-- 鼻孔与嘴线 -->
        <path d="M854,368 C858,371 858,375 854,377" fill="none"
              stroke="#3a3226" stroke-width="1.6" opacity="0.6"/>
        <path d="M850,381 L830,382" fill="none" stroke="#3a3226"
              stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        <!-- 近侧角 -->
        <path d="M808,344 C796,328 780,318 764,314 C780,322 792,340 800,354 Z"
              fill="#f0e4cc" stroke="#3a3226" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 近侧耳 -->
        <path d="M796,360 C778,359 762,364 752,371 C748,375 751,381 758,379
                 C774,374 787,370 798,369 Z"
              fill="#cdbb9d" stroke="#3a3226" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- 山羊胡 -->
        <g class="beard-g">
          <path d="M832,391 C836,404 830,416 820,422 C826,408 824,398 820,393 Z"
                fill="#8a7a63" stroke="#3a3226" stroke-width="1.5" stroke-linejoin="round"/>
        </g>
        <!-- 眼 -->
        <ellipse cx="812" cy="358" rx="5.5" ry="6" fill="#1b2b38"/>
        <circle cx="814" cy="356" r="1.8" fill="#ffffff" opacity="0.9"/>
      </g>
    </g>
  </g>
</svg>
</body>
</html>
