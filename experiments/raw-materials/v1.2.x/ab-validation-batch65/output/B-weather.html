<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市天气时光机 · City Weather Time Machine</title>
<style>
/* ========== 全局重置与基础 ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ui-bg: rgba(15, 20, 35, 0.72);
  --ui-border: rgba(255, 255, 255, 0.12);
  --ui-text: #e8ecf4;
  --ui-text-dim: rgba(232, 236, 244, 0.55);
  --accent: #5bb8ff;
  --accent-glow: rgba(91, 184, 255, 0.4);
  --radius: 14px;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #0a0e1a;
  color: var(--ui-text);
  user-select: none;
  -webkit-user-select: none;
}

/* ========== 场景容器 ========== */
#scene {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* 所有 canvas 绝对定位叠加 */
#scene canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* 层级 z-index */
#skyCanvas    { z-index: 1; }
#starCanvas   { z-index: 2; }
#celestialCanvas { z-index: 3; }
#cloudCanvas  { z-index: 4; }
#fogCanvas    { z-index: 5; }
#particleCanvas { z-index: 6; }
#cityCanvas   { z-index: 7; }
#groundCanvas { z-index: 8; }
#glowCanvas   { z-index: 9; pointer-events: none; }

/* ========== 顶部标题栏 ========== */
#topBar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 28px;
  pointer-events: none;
}

#topBar .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

#topBar .brand-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 20px var(--accent-glow);
}

#topBar .brand-text h1 {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

#topBar .brand-text p {
  font-size: 11px;
  color: var(--ui-text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
}

#topBar .clock {
  font-size: 32px;
  font-weight: 200;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  pointer-events: auto;
}

#topBar .clock .sec {
  font-size: 18px;
  color: var(--ui-text-dim);
  margin-left: 2px;
}

/* ========== 信息面板（左侧） ========== */
#infoPanel {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  width: 220px;
  background: var(--ui-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--ui-border);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
}

#infoPanel .panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--ui-text-dim);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#infoPanel .panel-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--ui-border);
}

.weather-main {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}

.weather-icon {
  font-size: 42px;
  line-height: 1;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}

.weather-temp {
  font-size: 44px;
  font-weight: 200;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.weather-temp .unit {
  font-size: 20px;
  color: var(--ui-text-dim);
  vertical-align: super;
}

.weather-desc {
  font-size: 14px;
  color: var(--ui-text-dim);
  margin-top: 4px;
}

.metrics {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.metric .label {
  color: var(--ui-text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}

.metric .label .ico {
  font-size: 14px;
  width: 18px;
  text-align: center;
}

.metric .value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ========== 天气选择器（右侧） ========== */
#weatherSelector {
  position: absolute;
  right: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.weather-btn {
  width: 56px; height: 56px;
  border-radius: 14px;
  border: 1px solid var(--ui-border);
  background: var(--ui-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--ui-text);
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}

.weather-btn:hover {
  transform: scale(1.08);
  border-color: var(--accent);
  box-shadow: 0 4px 20px var(--accent-glow);
}

.weather-btn.active {
  background: linear-gradient(135deg, rgba(91,184,255,0.25), rgba(139,92,246,0.25));
  border-color: var(--accent);
  box-shadow: 0 0 24px var(--accent-glow), inset 0 0 12px rgba(91,184,255,0.15);
}

.weather-btn .tooltip {
  position: absolute;
  right: calc(100% + 12px);
  top: 50%;
  transform: translateY(-50%);
  background: rgba(10,14,26,0.9);
  border: 1px solid var(--ui-border);
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.weather-btn:hover .tooltip {
  opacity: 1;
}

/* ========== 底部控制栏 ========== */
#controlBar {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  width: min(680px, calc(100% - 56px));
  background: var(--ui-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--ui-border);
  border-radius: var(--radius);
  padding: 18px 24px 16px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
}

/* 时间刻度 */
.time-ticks {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
  padding: 0 2px;
}

.time-ticks span {
  font-size: 10px;
  color: var(--ui-text-dim);
  font-variant-numeric: tabular-nums;
  transition: color 0.2s;
}

.time-ticks span.active-tick {
  color: var(--accent);
  font-weight: 600;
}

/* 滑块容器 */
.slider-container {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
}

/* 播放按钮 */
#playBtn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--ui-border);
  background: rgba(91,184,255,0.15);
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}

#playBtn:hover {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 0 20px var(--accent-glow);
  transform: scale(1.05);
}

/* 自定义滑块 */
.slider-wrap {
  flex: 1;
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,0.1);
  outline: none;
  cursor: pointer;
  position: relative;
  z-index: 2;
}

/* 滑块已填充部分 - 通过 JS 动态设置背景 */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: grab;
  box-shadow: 0 2px 12px var(--accent-glow);
  transition: transform 0.15s;
}

input[type="range"]::-webkit-slider-thumb:active {
  cursor: grabbing;
  transform: scale(1.2);
}

input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--accent);
  cursor: grab;
  box-shadow: 0 2px 12px var(--accent-glow);
}

/* 速度控制 */
.speed-control {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.speed-control label {
  font-size: 11px;
  color: var(--ui-text-dim);
}

.speed-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--ui-border);
  background: transparent;
  color: var(--ui-text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  font-variant-numeric: tabular-nums;
}

.speed-btn:hover {
  color: var(--ui-text);
  border-color: var(--ui-text-dim);
}

.speed-btn.active {
  background: rgba(91,184,255,0.2);
  border-color: var(--accent);
  color: var(--accent);
}

/* ========== 昼夜指示徽章 ========== */
#dayNightBadge {
  position: absolute;
  top: 90px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 6px 18px;
  border-radius: 20px;
  background: var(--ui-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--ui-border);
  font-size: 12px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all var(--transition);
}

#dayNightBadge .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  transition: background 0.5s, box-shadow 0.5s;
}

/* ========== 加载提示 ========== */
#loading {
  position: fixed;
  inset: 0;
  background: #0a0e1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: opacity 0.6s;
}

#loading.hide {
  opacity: 0;
  pointer-events: none;
}

#loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

#loading p {
  margin-top: 16px;
  font-size: 13px;
  color: var(--ui-text-dim);
  letter-spacing: 2px;
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  #infoPanel {
    width: 180px;
    padding: 16px 14px;
    left: 14px;
  }
  .weather-temp { font-size: 34px; }
  .weather-icon { font-size: 34px; }
  #weatherSelector { right: 14px; }
  .weather-btn { width: 46px; height: 46px; font-size: 20px; }
  #controlBar { bottom: 14px; padding: 14px 16px 12px; }
  #topBar { padding: 14px 16px; }
  #topBar .clock { font-size: 24px; }
}

@media (max-width: 560px) {
  #infoPanel { display: none; }
  #weatherSelector {
    top: auto;
    bottom: 100px;
    right: 50%;
    transform: translateX(50%);
    flex-direction: row;
  }
}
</style>
</head>
<body>

<!-- 加载屏 -->
<div id="loading">
  <div class="spinner"></div>
  <p>正在启动时光机…</p>
</div>

<!-- 主场景 -->
<div id="scene">
  <canvas id="skyCanvas"></canvas>
  <canvas id="starCanvas"></canvas>
  <canvas id="celestialCanvas"></canvas>
  <canvas id="cloudCanvas"></canvas>
  <canvas id="fogCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>
  <canvas id="cityCanvas"></canvas>

  <canvas id="glowCanvas"></canvas>
</div>

<!-- 顶部栏 -->
<div id="topBar">
  <div class="brand">
    <div class="brand-icon">⏳</div>
    <div class="brand-text">
      <h1>城市天气时光机</h1>
      <p>City Weather Time Machine</p>
    </div>

  <div class="clock" id="clockDisplay">
    12:00<span class="sec" id="clockSec">:00</span>

</div>

<!-- 昼夜徽章 -->
<div id="dayNightBadge">
  <span class="dot" id="dnDot"></span>
  <span id="dnText">正午</span>
</div>

<!-- 左侧信息面板 -->
<div id="infoPanel">
  <div class="panel-title">实时气象</div>
  <div class="weather-main">
    <div class="weather-icon" id="weatherIcon">☀️</div>
    <div>
      <div class="weather-temp"><span id="tempValue">22</span><span class="unit">°C</span></div>
      <div class="weather-desc" id="weatherDesc">晴朗</div>

  </div>
  <div class="metrics">
    <div class="metric">
      <span class="label"><span class="ico">💧</span>湿度</span>

    <div class="metric">
      <span class="label"><span class="ico">🌬️</span>风速</span>

      <span class="label"><span class="ico">👁️</span>能见度</span>
      <span class="value" id="visValue">15 km</span>
    </div>
    <div class="metric">
      <span class="label"><span class="ico">📊</span>气压</span>

</div>

<!-- 右侧天气选择器 -->
<div id="weatherSelector">
  <button class="weather-btn active" data-weather="sunny" title="晴朗">
    ☀️<span class="tooltip">晴朗</span>
  </button>
  <button class="weather-btn" data-weather="cloudy" title="多云">
    ⛅<span class="tooltip">多云</span>
  </button>
  <button class="weather-btn" data-weather="rainy" title="降雨">
    🌧️<span class="tooltip">降雨</span>
  </button>
  <button class="weather-btn" data-weather="snowy" title="降雪">
    🌨️<span class="tooltip">降雪</span>
  </button>
  <button class="weather-btn" data-weather="foggy" title="雾天">
    🌫️<span class="tooltip">雾天</span>
  </button>
</div>

<!-- 底部控制栏 -->
<div id="controlBar">
  <div class="time-ticks" id="timeTicks">
    <span data-hour="0">00:00</span>
    <span data-hour="4">04:00</span>
    <span data-hour="6">06:00</span>
    <span data-hour="8">08:00</span>
    <span data-hour="12">12:00</span>
    <span data-hour="16">16:00</span>

    <span data-hour="20">20:00</span>
    <span data-hour="24">24:00</span>
  </div>
  <div class="slider-container">
    <button id="playBtn" title="播放/暂停">▶</button>
    <div class="slider-wrap">
      <input type="range" id="timeSlider" min="0" max="1440" value="720" step="1">

    <div class="speed-control">
      <label>速度</label>
      <button class="speed-btn" data-speed="1">1x</button>
      <button class="speed-btn active" data-speed="5">5x</button>
      <button class="speed-btn" data-speed="20">20x</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   城市天气时光机 — 核心引擎
   架构：多层 Canvas 叠加 + requestAnimationFrame 渲染循环
   ================================================================ */

(function() {
'use strict';

/* ========== 工具函数 ========== */

// 颜色插值：在两个 hex 颜色之间线性插值
function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(r1 + (r2-r1)*t);
  const g = Math.round(g1 + (g2-g1)*t);
  const b = Math.round(b1 + (b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

// 多色标插值：给定色标数组 [{pos, color}]，返回 pos 处颜色
function gradientColor(stops, pos) {
  if (pos <= stops[0].pos) return stops[0].color;
  if (pos >= stops[stops.length-1].pos) return stops[stops.length-1].color;
  for (let i = 0; i < stops.length-1; i++) {
    if (pos >= stops[i].pos && pos <= stops[i+1].pos) {
      const t = (pos - stops[i].pos) / (stops[i+1].pos - stops[i].pos);
      return lerpColor(stops[i].color, stops[i+1].color, t);
    }
  }
  return stops[stops.length-1].color;
}

// 数值钳制
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// 线性插值
function lerp(a, b, t) { return a + (b - a) * t; }

// 平滑步进（用于过渡）
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

// 随机数
function rand(min, max) { return Math.random() * (max - min) + min; }

// 高斯近似随机
function randGaussian() {
  return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
}

/* ========== 全局状态 ========== */

const state = {
  time: 720,           // 当前分钟数 0-1440
  targetTime: 720,     // 目标时间（平滑过渡）
  weather: 'sunny',    // 当前天气
  targetWeather: 'sunny',
  weatherBlend: 1,     // 天气过渡 0->1
  playing: false,
  speed: 5,            // 播放速度倍率
  width: 0,
  height: 0,
  dpr: 1,
  frame: 0,
};

/* ========== 天空颜色配置（按小时的色标） ========== */
// 每个天气有自己的天空色标，按 24 小时定义关键帧

const SKY_PRESETS = {
  sunny: {
    top: [
      {pos:0,  color:'#050816'},
      {pos:4,  color:'#0a1028'},

      {pos:7.5,color:'#6b8cc9'},
      {pos:9,  color:'#4a90d9'},
      {pos:12, color:'#2e7fd4'},
      {pos:15, color:'#3a85d0'},
      {pos:17, color:'#5a8fc0'},
      {pos:18, color:'#c47a5a'},
      {pos:19, color:'#8a4a6a'},
      {pos:20, color:'#3a2a5a'},
      {pos:21, color:'#151a3a'},
      {pos:24, color:'#050816'},
    ],
    bottom: [
      {pos:0,  color:'#0d1225'},
      {pos:4,  color:'#141a35'},
      {pos:5.5,color:'#4a3a5a'},
      {pos:6.5,color:'#d4856a'},
      {pos:7.5,color:'#e8b080'},
      {pos:9,  color:'#a8c8e8'},

      {pos:18, color:'#e89060'},

      {pos:20, color:'#4a3060'},

      {pos:24, color:'#0d1225'},
    ]
  },
  cloudy: {
    top: [
      {pos:0,  color:'#0a0d18'},
      {pos:5,  color:'#151828'},
      {pos:7,  color:'#3a3d4d'},
      {pos:9,  color:'#5a5d6d'},
      {pos:12, color:'#6a6d7d'},

    ],
    bottom: [
      {pos:0,  color:'#12151f'},

      {pos:9,  color:'#8a8590'},
      {pos:12, color:'#9a95a0'},
      {pos:15, color:'#95909a'},
      {pos:17, color:'#807580'},
      {pos:19, color:'#554a55'},
      {pos:21, color:'#252530'},
      {pos:24, color:'#12151f'},
    ]
  },

/* ========== 天气元数据 ========== */

const WEATHER_META = {
  sunny:  { icon: '☀️', desc: '晴朗',   baseTemp: 24, humidity: 40, wind: 2.5, visibility: 20 },
  cloudy: { icon: '⛅', desc: '多云',   baseTemp: 20, humidity: 60, wind: 3.5, visibility: 12 },
  rainy:  { icon: '🌧️', desc: '小雨',   baseTemp: 16, humidity: 85, wind: 4.5, visibility: 5 },
  snowy:  { icon: '🌨️', desc: '小雪',   baseTemp: -2, humidity: 75, wind: 3.0, visibility: 3 },
  foggy:  { icon: '🌫️', desc: '大雾',   baseTemp: 14, humidity: 95, wind: 1.0, visibility: 0.5 },
};

/* ========== Canvas 初始化 ========== */

const canvases = {};
const ctxs = {};
const canvasIds = ['sky','star','celestial','cloud','fog','particle','city','ground','glow'];

function initCanvases() {
  canvasIds.forEach(id => {
    canvases[id] = document.getElementById(id + 'Canvas');
    ctxs[id] = canvases[id].getContext('2d');
  });
  resize();
  window.addEventListener('resize', resize);
}

function resize() {
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  state.width = window.innerWidth;
  state.height = window.innerHeight;
  canvasIds.forEach(id => {
    canvases[id].width = state.width * state.dpr;
    canvases[id].height = state.height * state.dpr;
    canvases[id].style.width = state.width + 'px';
    canvases[id].style.height = state.height + 'px';
    ctxs[id].setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
  });
  buildCity();
  buildStars();
  initParticles();
}

/* ========== 星星系统 ========== */

let stars = [];
function buildStars() {
  stars = [];
  const count = Math.floor((state.width * state.height) / 6000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: rand(0, state.width),
      y: rand(0, state.height * 0.65),
      size: rand(0.4, 1.8),
      twinkleSpeed: rand(0.5, 2.5),
      twinkleOffset: rand(0, Math.PI * 2),
      brightness: rand(0.4, 1.0),
    });
  }
}

/* ========== 城市剪影系统 ========== */

let cityBuildings = [];
let cityBuildingsFar = [];

function buildCity() {
  cityBuildings = [];
  cityBuildingsFar = [];
  const groundY = state.height * 0.78;

  // 远景建筑（更暗、更小）
  let x = -20;
  while (x < state.width + 40) {
    const w = rand(30, 70);
    const h = rand(60, 160);
    cityBuildingsFar.push({
      x, y: groundY - h, w, h,
      windows: generateWindows(w, h, 0.3),
    });
    x += w + rand(2, 8);
  }

  // 近景建筑
  x = -30;
  while (x < state.width + 60) {
    const w = rand(40, 90);
    const h = rand(100, 280);
    const hasAntenna = Math.random() > 0.7;
    const antennaH = hasAntenna ? rand(15, 40) : 0;
    cityBuildings.push({
      x, y: groundY - h, w, h,
      antennaH,
      windows: generateWindows(w, h, 0.55),
      roofType: Math.floor(rand(0, 3)),
    });
    x += w + rand(3, 12);
  }
}

function generateWindows(bw, bh, density) {
  const windows = [];
  const cols = Math.max(2, Math.floor(bw / 14));
  const rows = Math.max(3, Math.floor(bh / 18));
  const padX = (bw - cols * 8) / (cols + 1);
  const padY = (bh - rows * 10) / (rows + 1);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() < density) {
        windows.push({
          x: padX + c * (8 + padX),
          y: padY + r * (10 + padY),
          w: 8, h: 10,
          lit: Math.random() > 0.4,
          flicker: rand(0, 1),
        });
      }
    }
  }
  return windows;
}

/* ========== 粒子系统（雨/雪） ========== */

let particles = [];
const MAX_PARTICLES = 400;

function initParticles() {
  particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push(createParticle(true));
  }
}

function createParticle(randomY) {
  return {
    x: rand(-50, state.width + 50),
    y: randomY ? rand(-state.height, state.height) : rand(-100, -10),
    vx: 0, vy: 0,
    size: 0,
    opacity: 0,
    type: 'rain',
    wobble: rand(0, Math.PI * 2),
    wobbleSpeed: rand(1, 3),
  };
}

function updateParticles(dt) {
  const weather = state.weather;
  const isRain = weather === 'rainy';
  const isSnow = weather === 'snowy';
  const active = isRain || isSnow;

  const targetCount = isRain ? 300 : (isSnow ? 200 : 0);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (i < targetCount) {
      if (isRain) {
        p.type = 'rain';
        p.vx = -1.5 + state.wind * 0.3;
        p.vy = rand(12, 18);
        p.size = rand(1, 2);
        p.opacity = lerp(p.opacity, rand(0.3, 0.7), 0.1);
      } else {
        p.type = 'snow';
        p.wobble += p.wobbleSpeed * dt;
        p.vx = Math.sin(p.wobble) * 1.2 + state.wind * 0.2;
        p.vy = rand(1.5, 3.5);
        p.size = rand(1.5, 4);
        p.opacity = lerp(p.opacity, rand(0.5, 0.9), 0.1);
      }
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;

      // 重置
      if (p.y > state.height + 20 || p.x < -80 || p.x > state.width + 80) {
        p.x = rand(-50, state.width + 50);
        p.y = rand(-100, -10);
      }
    } else {
      p.opacity = lerp(p.opacity, 0, 0.05);
    }
  }
}

/* ========== 云朵系统 ========== */

let clouds = [];
function initClouds() {
  clouds = [];
  for (let i = 0; i < 12; i++) {
    clouds.push({
      x: rand(0, state.width),
      y: rand(state.height * 0.08, state.height * 0.4),
      scale: rand(0.6, 1.8),
      speed: rand(0.1, 0.4),
      opacity: rand(0.3, 0.7),
      puffs: Math.floor(rand(3, 7)),
    });
  }
}

function updateClouds(dt) {
  const weather = state.weather;
  const cloudFactor = weather === 'sunny' ? 0.3 :
                      weather === 'cloudy' ? 1.0 :
                      weather === 'rainy' ? 1.2 :
                      weather === 'snowy' ? 0.9 :
                      weather === 'foggy' ? 0.5 : 0.5;

  clouds.forEach(c => {
    c.x += c.speed * (1 + state.wind * 0.1) * dt * 60;
    if (c.x > state.width + 200 * c.scale) {
      c.x = -200 * c.scale;
      c.y = rand(state.height * 0.08, state.height * 0.4);
    }
    c.targetOpacity = c.opacity * cloudFactor;
  });
}

/* ========== 气象数据计算 ========== */

function computeWeatherData() {
  const hour = state.time / 60;
  const meta = WEATHER_META[state.weather];

  // 温度日变化曲线：最低在5点，最高在15点
  const tempCurve = Math.sin((hour - 9) / 24 * Math.PI * 2);
  const tempVariation = tempCurve * 5; // ±5度
  const temp = meta.baseTemp + tempVariation + randGaussian() * 0.3;

  // 湿度：夜间高，白天低
  const humidityCurve = -Math.sin((hour - 9) / 24 * Math.PI * 2) * 10;
  const humidity = clamp(meta.humidity + humidityCurve, 10, 100);

  // 风速：白天稍大
  const windVariation = Math.sin((hour - 6) / 12 * Math.PI) * 1.5;
  const wind = Math.max(0, meta.wind + windVariation + randGaussian() * 0.5);

  // 体感温度
  const feels = temp - wind * 0.3 + (humidity > 70 ? (temp - 20) * 0.15 : 0);

  // 能见度
  const visibility = meta.visibility;

  // 气压
  const pressure = 1013 + (meta.baseTemp - 15) * -0.5 + randGaussian() * 2;

  return {
    temp: Math.round(temp * 10) / 10,
    humidity: Math.round(humidity),
    wind: Math.round(wind * 10) / 10,
    feels: Math.round(feels * 10) / 10,
    visibility,
    pressure: Math.round(pressure),
  };
}

/* ========== 昼夜判断 ========== */

function getDayNightInfo() {
  const hour = state.time / 60;
  if (hour >= 5 && hour < 6.5) return { text: '黎明', dot: '#ffa94d', isNight: 0.5 };
  if (hour >= 6.5 && hour < 8) return { text: '日出', dot: '#ffd43b', isNight: 0.2 };
  if (hour >= 8 && hour < 11) return { text: '上午', dot: '#51cf66', isNight: 0 };
  if (hour >= 11 && hour < 13) return { text: '正午', dot: '#ffd43b', isNight: 0 };
  if (hour >= 13 && hour < 16) return { text: '下午', dot: '#69db7c', isNight: 0 };
  if (hour >= 16 && hour < 17.5) return { text: '黄昏', dot: '#ffa94d', isNight: 0.3 };
  if (hour >= 17.5 && hour < 19) return { text: '日落', dot: '#ff6b6b', isNight: 0.6 };
  if (hour >= 19 && hour < 21) return { text: '傍晚', dot: '#845ef7', isNight: 0.8 };
  return { text: '深夜', dot: '#4dabf7', isNight: 1 };
}

// 夜晚程度 0-1（用于星星、窗户灯光等）
function getNightFactor() {
  const hour = state.time / 60;
  // 日出 6:00-7:30 过渡，日落 17:30-19:00 过渡
  if (hour >= 7.5 && hour <= 17.5) return 0;
  if (hour >= 6 && hour < 7.5) return 1 - (hour - 6) / 1.5;
  if (hour > 17.5 && hour <= 19) return (hour - 17.5) / 1.5;
  return 1;
}

/* ========== 渲染函数 ========== */

// 1. 天空渐变
function renderSky() {
  const ctx = ctxs.sky;
  const w = state.width, h = state.height;
  const hour = state.time / 60;

  const preset = SKY_PRESETS[state.weather];
  const topColor = gradientColor(preset.top, hour);
  const bottomColor = gradientColor(preset.bottom, hour);

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, topColor);
  grad.addColorStop(0.6, lerpColor(topColor, bottomColor, 0.5));
  grad.addColorStop(1, bottomColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

// 2. 星星
function renderStars() {
  const ctx = ctxs.star;
  ctx.clearRect(0, 0, state.width, state.height);
  const nightFactor = getNightFactor();
  if (nightFactor < 0.05) return;

  // 雾天/雨天降低星星可见度
  const weatherFactor = state.weather === 'sunny' ? 1 :
                        state.weather === 'cloudy' ? 0.3 :
                        state.weather === 'foggy' ? 0.1 : 0;
  const alpha = nightFactor * weatherFactor;
  if (alpha < 0.02) return;

  const t = state.frame * 0.016;
  stars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.twinkleOffset);
    ctx.globalAlpha = alpha * s.brightness * twinkle;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// 3. 太阳/月亮
function renderCelestial() {
  const ctx = ctxs.celestial;
  ctx.clearRect(0, 0, state.width, state.height);
  const hour = state.time / 60;
  const w = state.width, h = state.height;
  const groundY = h * 0.78;

  // 太阳：6:00 升起，18:00 落下
  const isDay = hour >= 5.5 && hour <= 18.5;
  // 月亮：18:00 升起，6:00 落下
  const isNight = hour <= 5.5 || hour >= 18.5;

  if (isDay && state.weather !== 'foggy') {
    // 太阳位置：弧线轨迹
    const t = clamp((hour - 5.5) / 13, 0, 1);
    const angle = Math.PI * t; // 0 到 PI
    const cx = w * 0.1 + (w * 0.8) * t;
    const cy = groundY - Math.sin(angle) * (h * 0.55) - 20;

    // 太阳光晕
    const sunGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
    const sunAlpha = state.weather === 'sunny' ? 0.4 : 0.15;
    sunGlow.addColorStop(0, `rgba(255, 230, 150, ${sunAlpha})`);
    sunGlow.addColorStop(0.3, `rgba(255, 200, 100, ${sunAlpha * 0.5})`);
    sunGlow.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(cx - 130, cy - 130, 260, 260);

    // 太阳本体
    const sunSize = state.weather === 'sunny' ? 32 : 24;
    const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunSize);
    sunGrad.addColorStop(0, '#fff8e0');
    sunGrad.addColorStop(0.6, '#ffdd70');
    sunGrad.addColorStop(1, '#ffaa30');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, sunSize, 0, Math.PI * 2);
    ctx.fill();
  }

  if (isNight && (state.weather === 'sunny' || state.weather === 'cloudy')) {
    // 月亮位置
    let moonT;
    if (hour >= 18.5) {
      moonT = (hour - 18.5) / 11.5;
    } else {
      moonT = (hour + 5.5) / 11.5;
    }
    moonT = clamp(moonT, 0, 1);
    const angle = Math.PI * moonT;
    const cx = w * 0.1 + (w * 0.8) * moonT;
    const cy = groundY - Math.sin(angle) * (h * 0.5) - 20;

    // 月亮光晕
    const moonGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
    const moonAlpha = state.weather === 'sunny' ? 0.25 : 0.1;
    moonGlow.addColorStop(0, `rgba(200, 210, 240, ${moonAlpha})`);
    moonGlow.addColorStop(1, 'rgba(200, 210, 240, 0)');
    ctx.fillStyle = moonGlow;
    ctx.fillRect(cx - 90, cy - 90, 180, 180);

    // 月亮本体（带环形山阴影）
    const moonSize = 26;
    ctx.fillStyle = '#e8eaf0';
    ctx.beginPath();
    ctx.arc(cx, cy, moonSize, 0, Math.PI * 2);
    ctx.fill();

    // 环形山
    ctx.fillStyle = 'rgba(180, 185, 200, 0.5)';
    ctx.beginPath();
    ctx.arc(cx - 6, cy - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 5, cy + 6, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + 2, cy - 8, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 4. 云朵
function renderClouds() {
  const ctx = ctxs.cloud;
  ctx.clearRect(0, 0, state.width, state.height);
  const nightFactor = getNightFactor();

  clouds.forEach(c => {
    const alpha = (c.targetOpacity !== undefined ? c.targetOpacity : c.opacity);
    if (alpha < 0.02) return;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.globalAlpha = alpha;

    // 云朵颜色：白天白，夜晚暗
    const cloudLight = lerp(240, 100, nightFactor);
    const baseColor = `rgb(${cloudLight},${cloudLight},${cloudLight + 5})`;

    // 雨天云更暗
    if (state.weather === 'rainy') {
      ctx.fillStyle = `rgb(${cloudLight * 0.5},${cloudLight * 0.52},${cloudLight * 0.58})`;
    } else if (state.weather === 'snowy') {
      ctx.fillStyle = `rgb(${cloudLight * 0.75},${cloudLight * 0.77},${cloudLight * 0.82})`;
    } else {
      ctx.fillStyle = baseColor;
    }

    // 绘制蓬松云朵（多个圆叠加）
    for (let i = 0; i < c.puffs; i++) {
      const px = (i - c.puffs / 2) * 22;
      const py = Math.sin(i * 1.5) * 8;
      const pr = 22 + Math.sin(i * 2.3) * 8;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    // 底部椭圆连接
    ctx.beginPath();
    ctx.ellipse(0, 8, c.puffs * 14, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

// 5. 雾
function renderFog() {
  const ctx = ctxs.fog;
  ctx.clearRect(0, 0, state.width, state.height);
  if (state.weather !== 'foggy') return;

  const w = state.width, h = state.height;
  const t = state.frame * 0.005;

  // 多层雾
  for (let layer = 0; layer < 3; layer++) {
    const yBase = h * (0.4 + layer * 0.15);
    const layerAlpha = 0.12 + layer * 0.05;
    const speed = 0.3 + layer * 0.2;

    ctx.fillStyle = `rgba(200, 205, 215, ${layerAlpha})`;
    ctx.beginPath();
    ctx.moveTo(0, yBase);

    for (let x = 0; x <= w; x += 20) {
      const y = yBase + Math.sin(x * 0.008 + t * speed + layer) * 25
                      + Math.sin(x * 0.02 + t * speed * 1.5) * 12;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();
  }

  // 整体雾霭
  const fogGrad = ctx.createLinearGradient(0, h * 0.3, 0, h);
  fogGrad.addColorStop(0, 'rgba(180, 185, 195, 0)');
  fogGrad.addColorStop(0.5, 'rgba(180, 185, 195, 0.15)');
  fogGrad.addColorStop(1, 'rgba(180, 185, 195, 0.3)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, 0, w, h);
}

// 6. 粒子（雨/雪）
function renderParticles() {
  const ctx = ctxs.particle;
  ctx.clearRect(0, 0, state.width, state.height);

  particles.forEach(p => {
    if (p.opacity < 0.02) return;
    ctx.globalAlpha = p.opacity;

    if (p.type === 'rain') {
      // 雨滴：斜线
      ctx.strokeStyle = 'rgba(180, 210, 240, 0.8)';
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + p.vx * 1.5, p.y + p.vy * 1.2);
      ctx.stroke();
    } else {
      // 雪花：圆点
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

// 7. 城市剪影
function renderCity() {
  const ctx = ctxs.city;
  ctx.clearRect(0, 0, state.width, state.height);
  const w = state.width, h = state.height;
  const groundY = h * 0.78;
  const nightFactor = getNightFactor();

  // 远景建筑
  const farLight = lerp(35, 15, nightFactor);
  ctx.fillStyle = `rgb(${farLight},${farLight + 2},${farLight + 8})`;
  cityBuildingsFar.forEach(b => {
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  // 近景建筑
  const nearLight = lerp(25, 8, nightFactor);
  const buildingColor = `rgb(${nearLight},${nearLight + 1},${nearLight + 5})`;

  cityBuildings.forEach(b => {
    // 建筑主体
    ctx.fillStyle = buildingColor;
    ctx.fillRect(b.x, b.y, b.w, b.h);

    // 屋顶细节
    if (b.roofType === 1) {
      // 平顶加设备
      ctx.fillRect(b.x + b.w * 0.2, b.y - 8, b.w * 0.25, 8);
      ctx.fillRect(b.x + b.w * 0.55, b.y - 5, b.w * 0.2, 5);
    } else if (b.roofType === 2) {
      // 阶梯顶
      ctx.fillRect(b.x + b.w * 0.15, b.y - 12, b.w * 0.7, 12);
      ctx.fillRect(b.x + b.w * 0.3, b.y - 20, b.w * 0.4, 8);
    }

    // 天线
    if (b.antennaH > 0) {
      ctx.strokeStyle = buildingColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w / 2, b.y);
      ctx.lineTo(b.x + b.w / 2, b.y - b.antennaH);
      ctx.stroke();
      // 天线顶端红灯（夜间闪烁）
      if (nightFactor > 0.3) {
        const blink = Math.sin(state.frame * 0.05 + b.x) > 0.3;
        if (blink) {
          ctx.fillStyle = 'rgba(255, 60, 60, 0.9)';
          ctx.beginPath();
          ctx.arc(b.x + b.w / 2, b.y - b.antennaH, 3, 0, Math.PI * 2);
          ctx.fill();
          // 光晕
          ctx.fillStyle = 'rgba(255, 60, 60, 0.2)';
          ctx.beginPath();
          ctx.arc(b.x + b.w / 2, b.y - b.antennaH, 8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 窗户
    b.windows.forEach(win => {
      const wx = b.x + win.x;
      const wy = b.y + win.y;

      if (win.lit && nightFactor > 0.1) {
        // 亮灯窗户
        const flicker = 0.85 + 0.15 * Math.sin(state.frame * 0.02 + win.flicker * 10);
        const lightAlpha = nightFactor * flicker;
        // 窗户光
        ctx.fillStyle = `rgba(255, 220, 140, ${lightAlpha})`;
        ctx.fillRect(wx, wy, win.w, win.h);
      } else {
        // 暗窗户
        const darkAlpha = 0.3 + nightFactor * 0.2;
        ctx.fillStyle = `rgba(60, 70, 90, ${darkAlpha})`;
        ctx.fillRect(wx, wy, win.w, win.h);
      }
    });
  });
}

// 8. 地面
function renderGround() {
  const ctx = ctxs.ground;
  ctx.clearRect(0, 0, state.width, state.height);
  const w = state.width, h = state.height;
  const groundY = h * 0.78;
  const nightFactor = getNightFactor();

  // 地面基础
  let groundColor;
  if (state.weather === 'snowy') {
    const g = lerp(220, 160, nightFactor);
    groundColor = `rgb(${g},${g + 2},${g + 8})`;
  } else if (state.weather === 'rainy') {
    const g = lerp(40, 20, nightFactor);
    groundColor = `rgb(${g},${g + 2},${g + 8})`;
  } else {
    const g = lerp(35, 15, nightFactor);
    groundColor = `rgb(${g},${g + 1},${g + 5})`;
  }

  ctx.fillStyle = groundColor;
  ctx.fillRect(0, groundY, w, h - groundY);

  // 雨天：湿地反射
  if (state.weather === 'rainy') {
    const reflectGrad = ctx.createLinearGradient(0, groundY, 0, h);
    reflectGrad.addColorStop(0, 'rgba(100, 130, 170, 0.15)');
    reflectGrad.addColorStop(1, 'rgba(60, 80, 110, 0.05)');
    ctx.fillStyle = reflectGrad;
    ctx.fillRect(0, groundY, w, h - groundY);

    // 水洼高光
    for (let i = 0; i < 8; i++) {
      const px = (i / 8) * w + Math.sin(state.frame * 0.02 + i) * 30;
      const py = groundY + 15 + (i % 3) * 20;
      ctx.fillStyle = 'rgba(150, 180, 220, 0.08)';
      ctx.beginPath();
      ctx.ellipse(px, py, 40 + Math.sin(i) * 20, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 雪天：积雪
  if (state.weather === 'snowy') {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let x = 0; x <= w; x += 15) {
      const y = groundY - 3 + Math.sin(x * 0.05) * 2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w, groundY + 10);
    ctx.lineTo(0, groundY + 10);
    ctx.closePath();
    ctx.fill();
  }

  // 地面与建筑交界线
  ctx.fillStyle = `rgba(0,0,0,${0.3 + nightFactor * 0.2})`;
  ctx.fillRect(0, groundY - 1, w, 2);
}

// 9. 光晕/氛围光
function renderGlow() {
  const ctx = ctxs.glow;
  ctx.clearRect(0, 0, state.width, state.height);
  const w = state.width, h = state.height;
  const hour = state.time / 60;
  const groundY = h * 0.78;

  // 日出/日落地平线光
  if ((hour >= 5.5 && hour <= 8) || (hour >= 16.5 && hour <= 19.5)) {
    let intensity, color;
    if (hour >= 5.5 && hour <= 8) {
      intensity = 1 - Math.abs(hour - 6.75) / 1.25;
      color = '255, 160, 80';
    } else {
      intensity = 1 - Math.abs(hour - 18) / 1.5;
      color = '255, 120, 80';
    }
    intensity = clamp(intensity, 0, 1);

    if (state.weather === 'sunny' || state.weather === 'cloudy') {
      const glowGrad = ctx.createRadialGradient(w/2, groundY, 0, w/2, groundY, w * 0.6);
      glowGrad.addColorStop(0, `rgba(${color}, ${intensity * 0.25})`);
      glowGrad.addColorStop(0.5, `rgba(${color}, ${intensity * 0.1})`);
      glowGrad.addColorStop(1, `rgba(${color}, 0)`);
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, w, h);
    }
  }

  // 夜间城市光污染
  const nightFactor = getNightFactor();
  if (nightFactor > 0.3 && state.weather !== 'foggy') {
    const cityGlow = ctx.createRadialGradient(w/2, groundY, 0, w/2, groundY, w * 0.5);
    cityGlow.addColorStop(0, `rgba(255, 180, 100, ${nightFactor * 0.06})`);
    cityGlow.addColorStop(1, 'rgba(255, 180, 100, 0)');
    ctx.fillStyle = cityGlow;
    ctx.fillRect(0, 0, w, h);
  }

  //  vignette 暗角
  const vigGrad = ctx.createRadialGradient(w/2, h/2, h * 0.3, w/2, h/2, h * 0.8);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, `rgba(0,0,0,${0.25 + nightFactor * 0.15})`);
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, w, h);
}

/* ========== UI 更新 ========== */

let lastDataUpdate = 0;
function updateUI() {
  // 时钟
  const hour = Math.floor(state.time / 60);
  const min = Math.floor(state.time % 60);
  const sec = Math.floor((state.time % 1) * 60);
  document.getElementById('clockDisplay').innerHTML =
    `${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}` +
    `<span class="sec">:${String(sec).padStart(2,'0')}</span>`;

  // 昼夜徽章
  const dn = getDayNightInfo();
  document.getElementById('dnText').textContent = dn.text;
  const dot = document.getElementById('dnDot');
  dot.style.background = dn.dot;
  dot.style.boxShadow = `0 0 8px ${dn.dot}`;

  // 时间刻度高亮
  document.querySelectorAll('.time-ticks span').forEach(el => {
    const h = parseInt(el.dataset.hour);
    el.classList.toggle('active-tick', Math.abs(hour - h) < 1);
  });

  // 气象数据（每 10 帧更新一次，避免抖动）
  if (state.frame - lastDataUpdate > 10) {
    lastDataUpdate = state.frame;
    const data = computeWeatherData();
    const meta = WEATHER_META[state.weather];

    document.getElementById('tempValue').textContent = data.temp;
    document.getElementById('humidityValue').textContent = data.humidity + '%';
    document.getElementById('windValue').textContent = data.wind + ' m/s';
    document.getElementById('feelsValue').textContent = data.feels + '°C';
    document.getElementById('visValue').textContent = data.visibility >= 1 ? data.visibility + ' km' : (data.visibility * 1000) + ' m';
    document.getElementById('pressureValue').textContent = data.pressure + ' hPa';
    document.getElementById('weatherIcon').textContent = meta.icon;
    document.getElementById('weatherDesc').textContent = meta.desc;
  }

  // 滑块填充色
  const slider = document.getElementById('timeSlider');
  const pct = (state.time / 1440) * 100;
  slider.style.background = `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, rgba(255,255,255,0.1) ${pct}%, rgba(255,255,255,0.1) 100%)`;
}

/* ========== 主循环 ========== */

let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  state.frame++;

  // 播放模式：自动推进时间
  if (state.playing) {
    state.time += dt * state.speed * 10; // 每秒推进 speed*10 分钟
    if (state.time >= 1440) state.time -= 1440;
    document.getElementById('timeSlider').value = Math.floor(state.time);
  } else {
    // 平滑过渡到目标时间
    state.time = lerp(state.time, state.targetTime, 0.15);
  }

  // 更新天气数据中的风速（供粒子使用）
  const meta = WEATHER_META[state.weather];
  state.wind = meta.wind;

  // 更新子系统
  updateParticles(dt);
  updateClouds(dt);

  // 渲染各层
  renderSky();
  renderStars();
  renderCelestial();
  renderClouds();
  renderFog();
  renderParticles();
  renderCity();
  renderGround();
  renderGlow();

  // 更新 UI
  updateUI();

  requestAnimationFrame(loop);
}

/* ========== 事件绑定 ========== */

function bindEvents() {
  const slider = document.getElementById('timeSlider');
  const playBtn = document.getElementById('playBtn');

  // 时间滑块
  slider.addEventListener('input', (e) => {
    state.playing = false;
    playBtn.textContent = '▶';
    state.targetTime = parseInt(e.target.value);
    state.time = state.targetTime; // 拖动时即时响应
  });

  // 播放/暂停
  playBtn.addEventListener('click', () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? '⏸' : '▶';
  });

  // 速度按钮
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.speed = parseInt(btn.dataset.speed);
    });
  });

  // 天气选择
  document.querySelectorAll('.weather-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.weather = btn.dataset.weather;
    });
  });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      playBtn.click();
    }
    if (e.code === 'ArrowLeft') {
      state.targetTime = Math.max(0, state.targetTime - 10);
      state.playing = false;
      playBtn.textContent = '▶';
      slider.value = state.targetTime;
    }
    if (e.code === 'ArrowRight') {
      state.targetTime = Math.min(1440, state.targetTime + 10);
      state.playing = false;
      playBtn.textContent = '▶';
      slider.value = state.targetTime;
    }
    // 数字键切换天气
    const weatherKeys = ['1','2','3','4','5'];
    const weatherTypes = ['sunny','cloudy','rainy','snowy','foggy'];
    const idx = weatherKeys.indexOf(e.key);
    if (idx >= 0) {
      document.querySelector(`.weather-btn[data-weather="${weatherTypes[idx]}"]`).click();
    }
  });

  // 点击场景切换播放（非 UI 区域）
  document.getElementById('scene').addEventListener('click', (e) => {
    // 只有点击非控制区域才触发
    if (e.target.tagName === 'CANVAS') {
      playBtn.click();
    }
  });
}

/* ========== 启动 ========== */

function init() {
  initCanvases();
  initClouds();
  initParticles();
  bindEvents();

  // 隐藏加载屏
  setTimeout(() => {
    document.getElementById('loading').classList.add('hide');
  }, 400);

  // 启动渲染循环
  requestAnimationFrame(loop);
}

// DOM 就绪后启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
