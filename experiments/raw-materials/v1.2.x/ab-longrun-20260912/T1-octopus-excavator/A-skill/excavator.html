<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>章鱼开挖掘机 · Dusk Yard</title>
<!--
  ============================================================
  OCTOPUS EXCAVATOR — single-file scene (no external deps)
  ============================================================
  Geometry & motion self-consistency (authoritative notes also in notes.md):

  1) Crawler / vehicle speed relation (no-slip ground contact)
     ------------------------------------------------------------------
     Let v        = vehicle ground speed in px/s (to the RIGHT).
     Let r_eff    = effective rolling radius of drive/idler sprocket
                    (center of track band above ground contact).
     Let omega    = sprocket angular velocity = v / r_eff   [rad/s]
     For ideal tank-track no-slip, the upper+lower run of the track
     pattern must translate horizontally at speed v relative to the
     chassis. Therefore the track-texture phase advances at exactly
     v px per second (NOT scaled by an arbitrary multiplier).
     In this file:
         V_PX_PER_SEC = 90
         R_SPROCKET   = 18   (px, SVG units)
         omega        = V_PX_PER_SEC / R_SPROCKET = 5.0 rad/s
         trackPhase   += V_PX_PER_SEC * dt   (px)
     Road-wheel spin uses the same omega (shared kinematic chain).
     Road-wheel circumference visual period = 2*pi*r_wheel; we spin
     them at omega so the spoke flicker rate matches ground speed.

  2) Octopus arms vs mechanical boom — relative motion (NOT locked)
     ------------------------------------------------------------------
     Arm i (i=0..4 visible tentacles):
         phase_i  = t * WAVE_W + i * WAVE_SPATIAL
         flex_i   = AMP * sin(phase_i) + secondary harmonic
         WAVE_W   = 2.2 rad/s   (≈ 0.35 Hz)
     Hydraulic boom/stick/bucket:
         digCycle uses a non-commensurate period T_DIG = 3.7 s
         (boom lift 0–1.2s, stick curl 1.2–2.4s, bucket dump 2.4–3.0s,
          return 3.0–3.7s). 2.2 rad/s  vs  2π/3.7 ≈ 1.70 rad/s →
         beat period ≈ 2π/|2.2-1.70| ≈ 12.6 s, so phases never lock.
     Control-lever nudge (wrist-level) uses a third frequency 1.1 Hz
     sampled as triangle wave so it also fails to sync with either.

  3) Parallax (camera follows vehicle; world scrolls left at v)
     ------------------------------------------------------------------
     Layer k scroll speed S_k = v * PARALLAX[k]
         far skyline     : 0.12
         mid yard crane  : 0.35
         near dust/props : 0.70
         foreground beam : 1.20  (moves faster than body → depth cue)
     Ground strip itself : 1.00  (matches vehicle, so tracks appear
                                  to bite the same dirt the wheels do)

  Style: NOT flat white cartoon. Dark industrial dusk, ink + amber
  work-lights, dust motes, oil-slick water puddles.
  ============================================================
-->
<style>
  :root {
    --ink: #0b0e14;
    --sky-top: #1a1020;
    --sky-mid: #3a2038;
    --sky-low: #8a3a28;
    --horizon: #d pen  /* overwritten by gradients */
    --amber: #ffb347;
    --amber-hot: #ff7a1a;
    --steel: #4a5568;
    --steel-lit: #7a8494;
    --steel-dark: #2a303c;
    --rust: #8b3a1a;
    --seafoam: #3dd6c6;
    --octo: #c45c8a;
    --octo-dark: #7a2d55;
    --octo-suck: #f0a0c0;
    --bucket: #2f3540;
    --light: #ffd27a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #07090f;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }
  svg#scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #hud {
    position: absolute;
    left: 18px; top: 16px;
    z-index: 5;
    color: #e8d5b5;
    pointer-events: none;
    text-shadow: 0 1px 0 rgba(0,0,0,.8);
    letter-spacing: .04em;
  }
  #hud h1 {
    font-size: clamp(14px, 1.6vw, 20px);
    font-weight: 600;
    color: var(--amber);
    margin-bottom: 4px;
  }
  #hud p {
    font-size: clamp(10px, 1.1vw, 13px);
    opacity: .75;
    max-width: 320px;
    line-height: 1.45;
  }
  #hud .k {
    display: inline-block;
    border: 1px solid rgba(255,179,71,.45);
    border-radius: 3px;
    padding: 0 5px;
    margin-right: 6px;
    color: var(--amber);
    font-size: 11px;
  }
  #vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 4;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,.55) 100%),
      linear-gradient(to top, rgba(0,0,0,.35), transparent 30%);
  }
  #grain {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: .07;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.9'/></svg>");
  }
  .hidden-note { display: none; }
</style>
</head>
<body>
<div id="stage" aria-label="章鱼驾驶履带挖掘机在黄昏工地向右行驶的动画场景">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img">
    <defs>
      <!-- sky -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#120a1c"/>
        <stop offset="35%" stop-color="#2a1835"/>
        <stop offset="62%" stop-color="#6b2840"/>
        <stop offset="82%" stop-color="#c45a2a"/>
        <stop offset="100%" stop-color="#ffb347"/>
      </linearGradient>
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3a2a22"/>
        <stop offset="40%" stop-color="#2a1e18"/>
        <stop offset="100%" stop-color="#140e0c"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
        <stop offset="35%" stop-color="#ff7a1a" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="workLamp" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.9"/>
        <stop offset="40%" stop-color="#ffb347" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6a7484"/>
        <stop offset="45%" stop-color="#3d4554"/>
        <stop offset="100%" stop-color="#222833"/>
      </linearGradient>
      <linearGradient id="boomGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#5a6474"/>
        <stop offset="50%" stop-color="#3a4250"/>
        <stop offset="100%" stop-color="#2a303c"/>
      </linearGradient>
      <linearGradient id="rustGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a04820"/>
        <stop offset="100%" stop-color="#5a2010"/>
      </linearGradient>
      <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a2e36"/>
        <stop offset="50%" stop-color="#1a1e24"/>
        <stop offset="100%" stop-color="#0e1014"/>
      </linearGradient>
      <linearGradient id="octoGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e078a8"/>
        <stop offset="50%" stop-color="#c45c8a"/>
        <stop offset="100%" stop-color="#7a2d55"/>
      </linearGradient>
      <linearGradient id="cabGlass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7ec8e8" stop-opacity="0.25"/>
        <stop offset="50%" stop-color="#2a4050" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#1a2830" stop-opacity="0.7"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#1a1e28"/>
        <stop offset="50%" stop-color="#2e3442"/>
        <stop offset="100%" stop-color="#12161e"/>
      </linearGradient>
      <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3"/>
      </filter>
      <filter id="heavyBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <filter id="dustBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.2"/>
      </filter>
      <!-- track pad pattern (repeating) -->
      <pattern id="trackPad" width="24" height="28" patternUnits="userSpaceOnUse">
        <rect width="24" height="28" fill="#15181e"/>
        <rect x="2" y="4" width="20" height="8" rx="2" fill="#3a4250"/>
        <rect x="4" y="16" width="16" height="6" rx="1.5" fill="#2a303c"/>
        <rect x="0" y="12" width="24" height="2" fill="#0a0c10"/>
      </pattern>
    </defs>

    <!-- ========== LAYER 0: SKY (static) ========== -->
    <rect width="1600" height="900" fill="url(#skyGrad)"/>
    <circle cx="1180" cy="520" r="220" fill="url(#sunGlow)"/>
    <circle cx="1180" cy="520" r="48" fill="#ffd9a0" opacity="0.85"/>
    <!-- high clouds (very slow drift) -->
    <g id="clouds" opacity="0.55">
      <ellipse cx="200" cy="120" rx="160" ry="28" fill="#3a2848" opacity="0.7"/>
      <ellipse cx="280" cy="110" rx="100" ry="18" fill="#4a3058" opacity="0.5"/>
      <ellipse cx="900" cy="90" rx="200" ry="22" fill="#2a1c38" opacity="0.65"/>
      <ellipse cx="1400" cy="140" rx="180" ry="26" fill="#3a2848" opacity="0.55"/>
      <ellipse cx="1500" cy="130" rx="90" ry="14" fill="#5a3868" opacity="0.4"/>
    </g>
    <!-- stars -->
    <g id="stars" fill="#fff" opacity="0.5">
      <circle cx="80" cy="60" r="1.2"/><circle cx="220" cy="40" r="0.9"/>
      <circle cx="400" cy="90" r="1.1"/><circle cx="560" cy="30" r="0.8"/>
      <circle cx="720" cy="70" r="1.3"/><circle cx="980" cy="45" r="0.9"/>
      <circle cx="1120" cy="80" r="1.0"/><circle cx="1300" cy="35" r="1.2"/>
      <circle cx="1480" cy="100" r="0.8"/><circle cx="50" cy="150" r="0.7"/>
    </g>

    <!-- ========== LAYER 1: FAR SKYLINE (parallax 0.12) ========== -->
    <g id="layerFar" fill="#1a1020">
      <!-- industrial skyline silhouettes, tiled -->
      <g id="farTile">
        <rect x="0" y="480" width="70" height="140"/>
        <rect x="80" y="420" width="50" height="200"/>
        <rect x="100" y="400" width="12" height="40"/> <!-- chimney -->
        <rect x="140" y="460" width="90" height="160"/>
        <polygon points="140,460 185,400 230,460"/>
        <rect x="250" y="500" width="40" height="120"/>
        <rect x="300" y="440" width="60" height="180"/>
        <rect x="315" y="410" width="8" height="40"/>
        <rect x="380" y="490" width="100" height="130"/>
        <rect x="500" y="450" width="55" height="170"/>
        <rect x="520" y="430" width="10" height="30"/>
        <rect x="580" y="500" width="70" height="120"/>
        <rect x="670" y="460" width="45" height="160"/>
        <rect x="730" y="480" width="80" height="140"/>
        <!-- water tower -->
        <rect x="840" y="500" width="8" height="120"/>
        <ellipse cx="844" cy="490" rx="28" ry="18"/>
        <rect x="880" y="510" width="50" height="110"/>
      </g>
      <!-- faint window lights on skyline -->
      <g fill="#ffb347" opacity="0.25">
        <rect x="95" y="450" width="4" height="6"/>
        <rect x="105" y="470" width="4" height="6"/>
        <rect x="160" y="500" width="4" height="6"/>
        <rect x="320" y="470" width="4" height="6"/>
        <rect x="510" y="480" width="4" height="6"/>
        <rect x="700" y="500" width="4" height="6"/>
      </g>
    </g>

    <!-- ========== LAYER 2: MID YARD (parallax 0.35) ========== -->
    <g id="layerMid">
      <g id="midTile">
        <!-- far crane silhouette -->
        <g stroke="#1e1420" stroke-width="6" fill="none" opacity="0.9">
          <line x1="200" y1="620" x2="200" y2="300"/>
          <line x1="200" y1="310" x2="420" y2="280"/>
          <line x1="200" y1="310" x2="80" y2="340"/>
          <line x1="400" y1="282" x2="400" y2="380"/>
          <line x1="200" y1="360" x2="380" y2="340"/>
        </g>
        <rect x="185" y="600" width="30" height="40" fill="#1e1420"/>
        <!-- container stack -->
        <rect x="500" y="560" width="120" height="60" fill="#2a1830" stroke="#3a2040" stroke-width="2"/>
        <rect x="510" y="540" width="100" height="20" fill="#352040" stroke="#4a2850" stroke-width="1.5"/>
        <rect x="640" y="570" width="90" height="50" fill="#241428" stroke="#3a2040" stroke-width="2"/>
        <!-- second crane smaller -->
        <g stroke="#1a1024" stroke-width="4" fill="none" opacity="0.85">
          <line x1="900" y1="620" x2="900" y2="380"/>
          <line x1="900" y1="390" x2="1050" y2="370"/>
          <line x1="900" y1="390" x2="820" y2="410"/>
        </g>
        <!-- warehouse shed -->
        <polygon points="1100,620 1180,540 1260,620" fill="#241428"/>
        <rect x="1110" y="600" width="140" height="20" fill="#1e1020"/>
        <!-- pipes on ground -->
        <ellipse cx="1400" cy="630" rx="18" ry="8" fill="#1a1220" stroke="#2a1a30" stroke-width="2"/>
        <ellipse cx="1430" cy="630" rx="18" ry="8" fill="#1a1220" stroke="#2a1a30" stroke-width="2"/>
        <ellipse cx="1415" cy="618" rx="18" ry="8" fill="#1e1428" stroke="#2a1a30" stroke-width="2"/>
      </g>
      <!-- mid ground fog band -->
      <rect x="0" y="580" width="1600" height="80" fill="#3a2038" opacity="0.25" filter="url(#heavyBlur)"/>
    </g>

    <!-- ========== GROUND (parallax 1.0) ========== -->
    <g id="ground">
      <rect x="0" y="640" width="1600" height="260" fill="url(#groundGrad)"/>
      <!-- dirt streaks -->
      <g id="groundTex" opacity="0.55">
        <g id="groundTile">
          <path d="M0 680 Q80 670 160 685 T320 678 T480 690 T640 675" stroke="#4a3020" stroke-width="3" fill="none"/>
          <path d="M0 740 Q100 730 200 745 T400 735 T600 750" stroke="#3a2418" stroke-width="2" fill="none"/>
          <ellipse cx="80" cy="720" rx="30" ry="6" fill="#2a1a12"/>
          <ellipse cx="300" cy="760" rx="40" ry="8" fill="#241610"/>
          <ellipse cx="500" cy="700" rx="22" ry="5" fill="#3a2418"/>
          <rect x="180" y="710" width="40" height="4" rx="1" fill="#4a3020" transform="rotate(-8 200 712)"/>
          <rect x="420" y="750" width="50" height="3" rx="1" fill="#3a2418" transform="rotate(4 445 751)"/>
          <!-- oil puddle -->
          <ellipse cx="360" cy="780" rx="50" ry="12" fill="#1a2030" opacity="0.7"/>
          <ellipse cx="360" cy="778" rx="30" ry="6" fill="#2a3850" opacity="0.4"/>
        </g>
      </g>
      <!-- horizon haze -->
      <rect x="0" y="640" width="1600" height="30" fill="#c45a2a" opacity="0.12"/>
    </g>

    <!-- ========== LAYER 3: NEAR DUST & PROPS (parallax 0.70) ========== -->
    <g id="layerNear" opacity="0.9">
      <g id="nearTile">
        <!-- small rocks / debris closer -->
        <polygon points="40,820 60,800 85,822" fill="#2a2018"/>
        <polygon points="200,840 230,815 260,842" fill="#241c14"/>
        <polygon points="400,830 420,810 445,832" fill="#2e241c"/>
        <!-- sparse weeds -->
        <path d="M120 820 Q125 790 118 770" stroke="#3a4028" stroke-width="2" fill="none"/>
        <path d="M128 820 Q140 785 135 765" stroke="#2a3020" stroke-width="2" fill="none"/>
        <path d="M500 850 Q510 810 505 790" stroke="#3a4028" stroke-width="2" fill="none"/>
        <!-- discarded pipe -->
        <rect x="300" y="845" width="70" height="10" rx="4" fill="#3a3028" stroke="#1a1410" stroke-width="1.5"/>
        <!-- warning cone -->
        <polygon points="620,850 635,800 650,850" fill="#c45a2a" opacity="0.85"/>
        <rect x="628" y="810" width="14" height="4" fill="#ffb347"/>
      </g>
      <!-- dust particles (JS-animated group, initial fill) -->
      <g id="dustMotes" fill="#c4a070" opacity="0.35"></g>
    </g>

    <!-- ========== VEHICLE GROUP (anchored, bobbing) ========== -->
    <g id="vehicle" transform="translate(620, 0)">
      <!-- shadow under tracks -->
      <ellipse id="vshadow" cx="0" cy="780" rx="180" ry="18" fill="#000" opacity="0.45" filter="url(#softBlur)"/>

      <!-- ============ CRAWLER TRACKS ============ -->
      <g id="tracks">
        <!-- left track (far) -->
        <g transform="translate(-20, 0)" opacity="0.85">
          <path d="M-120 700
                   A40 40 0 0 1 -80 660
                   L100 660
                   A40 40 0 0 1 140 700
                   L140 740
                   A40 40 0 0 1 100 780
                   L-80 780
                   A40 40 0 0 1 -120 740 Z"
                fill="url(#trackGrad)" stroke="#0a0c10" stroke-width="2"/>
          <!-- animated pad strip via clip + translated pattern -->
          <clipPath id="clipTrackL">
            <path d="M-118 702
                     A38 38 0 0 1 -80 662
                     L100 662
                     A38 38 0 0 1 138 702
                     L138 738
                     A38 38 0 0 1 100 778
                     L-80 778
                     A38 38 0 0 1 -118 738 Z"/>
          </clipPath>
          <g clip-path="url(#clipTrackL)">
            <g id="trackPadsL">
              <!-- pads drawn as rects, phase-shifted in JS -->
            </g>
          </g>
          <!-- sprockets -->
          <circle cx="-100" cy="720" r="18" fill="#2a303c" stroke="#4a5568" stroke-width="2"/>
          <circle cx="-100" cy="720" r="6" fill="#1a1e24"/>
          <g id="sprocketL" transform="translate(-100,720)">
            <rect x="-2" y="-16" width="4" height="32" fill="#5a6474" rx="1"/>
            <rect x="-16" y="-2" width="32" height="4" fill="#5a6474" rx="1"/>
          </g>
          <circle cx="120" cy="720" r="18" fill="#2a303c" stroke="#4a5568" stroke-width="2"/>
          <circle cx="120" cy="720" r="6" fill="#1a1e24"/>
          <g id="idlerL" transform="translate(120,720)">
            <rect x="-2" y="-14" width="4" height="28" fill="#5a6474" rx="1"/>
            <rect x="-14" y="-2" width="28" height="4" fill="#5a6474" rx="1"/>
          </g>
          <!-- road wheels -->
          <circle cx="-50" cy="745" r="12" fill="#3a4250" stroke="#5a6474" stroke-width="1.5"/>
          <circle cx="0" cy="745" r="12" fill="#3a4250" stroke="#5a6474" stroke-width="1.5"/>
          <circle cx="50" cy="745" r="12" fill="#3a4250" stroke="#5a6474" stroke-width="1.5"/>
          <g id="wheelsL"></g>
        </g>

        <!-- right track (near, detailed) -->
        <g transform="translate(10, 0)">
          <path d="M-130 695
                   A45 45 0 0 1 -85 650
                   L110 650
                   A45 45 0 0 1 155 695
                   L155 745
                   A45 45 0 0 1 110 790
                   L-85 790
                   A45 45 0 0 1 -130 745 Z"
                fill="url(#trackGrad)" stroke="#0a0c10" stroke-width="2.5"/>
          <clipPath id="clipTrackR">
            <path d="M-128 697
                     A43 43 0 0 1 -85 652
                     L110 652
                     A43 43 0 0 1 153 697
                     L153 743
                     A43 43 0 0 1 110 788
                     L-85 788
                     A43 43 0 0 1 -128 743 Z"/>
          </clipPath>
          <g clip-path="url(#clipTrackR)">
            <g id="trackPadsR"></g>
          </g>
          <!-- rubber highlight on top run -->
          <path d="M-80 655 L105 655" stroke="#4a5568" stroke-width="3" opacity="0.35"/>
          <!-- drive sprocket (rear-left of machine = left in SVG since facing right... wait)
               Vehicle faces RIGHT, so FRONT of tracks is +X (right side of track group).
               Drive sprocket typically at rear for excavators — place at -X. -->
          <circle cx="-110" cy="720" r="22" fill="#2a303c" stroke="#6a7484" stroke-width="2.5"/>
          <circle cx="-110" cy="720" r="8" fill="#1a1e24"/>
          <g id="sprocketR" transform="translate(-110,720)">
            <rect x="-2.5" y="-20" width="5" height="40" fill="#7a8494" rx="1.5"/>
            <rect x="-20" y="-2.5" width="40" height="5" fill="#7a8494" rx="1.5"/>
            <rect x="-2.5" y="-20" width="5" height="40" fill="#7a8494" rx="1.5" transform="rotate(45)"/>
            <rect x="-20" y="-2.5" width="40" height="5" fill="#7a8494" rx="1.5" transform="rotate(45)"/>
          </g>
          <!-- idler front -->
          <circle cx="135" cy="720" r="22" fill="#2a303c" stroke="#6a7484" stroke-width="2.5"/>
          <circle cx="135" cy="720" r="8" fill="#1a1e24"/>
          <g id="idlerR" transform="translate(135,720)">
            <rect x="-2.5" y="-18" width="5" height="36" fill="#7a8494" rx="1.5"/>
            <rect x="-18" y="-2.5" width="36" height="5" fill="#7a8494" rx="1.5"/>
          </g>
          <!-- road wheels + spin marks -->
          <circle cx="-55" cy="750" r="14" fill="#3a4250" stroke="#7a8494" stroke-width="2"/>
          <circle cx="0" cy="750" r="14" fill="#3a4250" stroke="#7a8494" stroke-width="2"/>
          <circle cx="55" cy="750" r="14" fill="#3a4250" stroke="#7a8494" stroke-width="2"/>
          <g id="wheelsR"></g>
          <!-- track frame / side plate -->
          <path d="M-90 700 L120 700 L120 720 L-90 720 Z" fill="url(#steelGrad)" opacity="0.5"/>
        </g>
      </g>

<script>
(function () {
  "use strict";

  // ========== KINEMATIC CONSTANTS (see header comments) ==========
  const V0 = 90;                 // px/s baseline vehicle speed
  const R_SPROCKET = 18;         // effective sprocket radius (px)
  const R_WHEEL = 14;            // road wheel radius
  const OMEGA0 = V0 / R_SPROCKET; // ≈ 5.0 rad/s — track/sprocket coupling
  const WAVE_W = 2.2;            // tentacle spatial-temporal freq (rad/s)
  const WAVE_SPATIAL = 0.85;     // phase offset between arms
  const T_DIG = 3.7;             // hydraulic dig cycle period (s) — non-commensurate
  const OMEGA_DIG = (Math.PI * 2) / T_DIG; // ≈ 1.698 rad/s
  const PARALLAX = {
    far: 0.12,
    mid: 0.35,
    near: 0.70,
    ground: 1.00,
    fg: 1.20
  };
  const TILE = {
    far: 930,
    mid: 1600,
    near: 700,
    ground: 640,
    fg: 600
  };

  // ========== DOM REFS ==========
  const svg = document.getElementById("scene");
  const layerFar = document.getElementById("layerFar");
  const layerMid = document.getElementById("layerMid");
  const layerNear = document.getElementById("layerNear");
  const layerFg = document.getElementById("layerFg");
  const groundTex = document.getElementById("groundTex");
  const clouds = document.getElementById("clouds");
  const vehicle = document.getElementById("vehicle");
  const sprocketR = document.getElementById("sprocketR");
  const sprocketL = document.getElementById("sprocketL");
  const idlerR = document.getElementById("idlerR");
  const idlerL = document.getElementById("idlerL");
  const boom = document.getElementById("boom");
  const stickArm = document.getElementById("stickArm");
  const bucketArm = document.getElementById("bucketArm");
  const bucketDirt = document.getElementById("bucketDirt");
  const trackPadsR = document.getElementById("trackPadsR");
  const trackPadsLg = document.getElementById("trackPadsL");
  const wheelsR = document.getElementById("wheelsR");
  const wheelsL = document.getElementById("wheelsL");
  const dustMotes = document.getElementById("dustMotes");
  const trackDust = document.getElementById("trackDust");
  const exhaust = document.getElementById("exhaust");
  const tents = [0, 1, 2, 3, 4].map(i => document.getElementById("tent" + i));
  const tentShadows = [0, 1, 2, 3, 4].map(i => document.getElementById("tent" + i + "s"));
  const sucks = [
    document.getElementById("suck0a"), document.getElementById("suck0b"),
    document.getElementById("suck1a"),
    document.getElementById("suck2a"),
    document.getElementById("suck3a"),
    document.getElementById("suck4a"), document.getElementById("suck4b")
  ];

  // ========== STATE ==========
  let t = 0;
  let last = performance.now();
  let v = V0;
  let targetV = V0;
  let boost = false;
  let digBoost = false;
  let trackPhase = 0;       // px — advances by v*dt exactly
  let sprocketAngle = 0;    // rad — = trackPhase / R_SPROCKET
  let camBob = 0;
  const layers = {};

  // ========== TILE SETUP ==========
  function initLayers() {
    // far: clone the silhouette group
    const farSrc = layerFar.querySelector("#farTile");
    for (let i = 1; i < 3; i++) {
      const c = farSrc.cloneNode(true);
      c.removeAttribute("id");
      layerFar.appendChild(c);
    }
    layers.far = { el: layerFar, x: 0, speed: PARALLAX.far * V0, tile: TILE.far, nodes: [] };
    layers.far.nodes = Array.from(layerFar.children);

    const midSrc = layerMid.querySelector("#midTile");
    for (let i = 1; i < 3; i++) {
      const c = midSrc.cloneNode(true);
      c.removeAttribute("id");
      c.setAttribute("data-clone", String(i));
      layerMid.appendChild(c);
    }
    layers.mid = { el: layerMid, x: 0, speed: PARALLAX.mid * V0, tile: TILE.mid };
    layers.mid.nodes = Array.from(layerMid.children).filter(function (n) {
      return n.id === "midTile" || n.getAttribute("data-clone");
    });

    const nearSrc = document.getElementById("nearTile");
    for (let i = 1; i < 3; i++) {
      const c = nearSrc.cloneNode(true);
      c.removeAttribute("id");
      c.setAttribute("data-clone", String(i));
      layerNear.insertBefore(c, dustMotes);
    }
    layers.near = { el: layerNear, x: 0, speed: PARALLAX.near * V0, tile: TILE.near };
    layers.near.nodes = Array.from(layerNear.children).filter(function (n) {
      return n.id === "nearTile" || n.getAttribute("data-clone");
    });

    // ground
    for (let i = 1; i < 3; i++) {
      const c = document.getElementById("groundTile").cloneNode(true);
      c.removeAttribute("id");
      groundTex.appendChild(c);
    }
    layers.ground = { el: groundTex, x: 0, speed: PARALLAX.ground * V0, tile: TILE.ground, nodes: [] };
    layers.ground.nodes = Array.from(groundTex.children);

    // foreground
    const fgSrc = document.getElementById("fgTile");
    for (let i = 1; i < 3; i++) {
      const c = fgSrc.cloneNode(true);
      c.removeAttribute("id");
      layerFg.appendChild(c);
    }
    layers.fg = { el: layerFg, x: 0, speed: PARALLAX.fg * V0, tile: TILE.fg };
    layers.fg.nodes = Array.from(layerFg.children);
  }

  // ========== TRACK PADS ==========
  const PAD_COUNT = 22;
  function buildPads(group, yBase, w, h) {
    if (!group) return;
    const padW = 22;
    const pitch = 26;
    for (let i = 0; i < PAD_COUNT * 2; i++) {
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("width", String(padW));
      r.setAttribute("height", String(h));
      r.setAttribute("rx", "2");
      r.setAttribute("fill", i % 2 === 0 ? "#3a4250" : "#2a303c");
      r.setAttribute("stroke", "#0a0c10");
      r.setAttribute("stroke-width", "1");
      r.setAttribute("data-i", String(i));
      group.appendChild(r);
    }
    group.setAttribute("data-pitch", String(pitch));
    group.setAttribute("data-y", String(yBase));
  }

  function updatePads(group, phase, pitch, y) {
    if (!group) return;
    const kids = group.children;
    const span = pitch * PAD_COUNT;
    for (let i = 0; i < kids.length; i++) {
      // wrap around the approximate track path length
      let x = ((i * pitch - phase) % span + span) % span - 130;
      kids[i].setAttribute("x", x.toFixed(2));
      kids[i].setAttribute("y", y);
    }
  }

  // ========== ROAD WHEEL SPIN MARKS ==========
  function buildWheelMarks(group, cx, cy, r, count) {
    if (!group) return;
    for (let i = 0; i < count; i++) {
      const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
      const a = (i / count) * Math.PI * 2;
      ln.setAttribute("x1", (cx + Math.cos(a) * 4).toFixed(2));
      ln.setAttribute("y1", (cy + Math.sin(a) * 4).toFixed(2));
      ln.setAttribute("x2", (cx + Math.cos(a) * (r - 3)).toFixed(2));
      ln.setAttribute("y2", (cy + Math.sin(a) * (r - 3)).toFixed(2));
      ln.setAttribute("stroke", "#8a94a4");
      ln.setAttribute("stroke-width", "1.5");
      group.appendChild(ln);
    }
  }

  // ========== DUST PARTICLES ==========
  const dust = [];
  function initDust() {
    for (let i = 0; i < 28; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      const p = {
        el: c,
        x: Math.random() * 1600,
        y: 640 + Math.random() * 120,
        r: 1 + Math.random() * 3,
        vx: -0.3 - Math.random() * 0.8,
        vy: -0.15 - Math.random() * 0.35,
        life: Math.random()
      };
      c.setAttribute("r", p.r.toFixed(2));
      c.setAttribute("opacity", (0.15 + Math.random() * 0.25).toFixed(2));
      dustMotes.appendChild(c);
      dust.push(p);
    }
  }

  function updateDust(dt, speed) {
    for (const p of dust) {
      p.life += dt * 0.4;
      p.x += (p.vx - speed * PARALLAX.near * dt * 0.15);
      p.y += p.vy;
      if (p.y < 620 || p.x < -20) {
        p.x = 1600 + Math.random() * 80;
        p.y = 660 + Math.random() * 100;
        p.life = 0;
      }
      p.el.setAttribute("cx", p.x.toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
    }
  }

  // ========== TRACK KICKUP DUST ==========
  const kick = [];
  function initKick() {
    for (let i = 0; i < 10; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      const p = { el: c, t: Math.random(), x: 0, y: 0, r: 2 + Math.random() * 4 };
      c.setAttribute("fill", "#c4a070");
      trackDust.appendChild(c);
      kick.push(p);
    }
  }

  function updateKick(dt) {
    for (const p of kick) {
      p.t += dt * (0.8 + v / 200);
      if (p.t > 1) {
        p.t = 0;
        p.x = -80 + Math.random() * 40;
        p.y = 770;
        p.r = 2 + Math.random() * 5;
      }
      const k = p.t;
      // kicked backward and up relative to vehicle (world moves left)
      p.xWorld = p.x - k * v * 0.35;
      p.y = 770 - k * 40 - k * k * 10;
      p.el.setAttribute("cx", (p.xWorld).toFixed(1));
      p.el.setAttribute("cy", p.y.toFixed(1));
      p.el.setAttribute("r", (p.r * (0.5 + k)).toFixed(2));
      p.el.setAttribute("opacity", (0.4 * (1 - k)).toFixed(2));
    }
  }

  // ========== EXHAUST ==========
  const puffs = [];
  function initExhaust() {
    for (let i = 0; i < 6; i++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      const p = { el: c, t: i / 6 };
      c.setAttribute("fill", "#8a8090");
      exhaust.appendChild(c);
      puffs.push(p);
    }
  }

  function updateExhaust(dt) {
    for (const p of puffs) {
      p.t += dt * 0.7;
      if (p.t > 1) p.t -= 1;
      const k = p.t;
      const y = 495 - k * 50;
      const x = -128 - k * 12;
      const r = 3 + k * 14;
      p.el.setAttribute("cx", x.toFixed(1));
      p.el.setAttribute("cy", y.toFixed(1));
      p.el.setAttribute("rx", r.toFixed(1));
      p.el.setAttribute("ry", (r * 0.7).toFixed(1));
      p.el.setAttribute("opacity", (0.45 * (1 - k)).toFixed(2));
    }
  }

  // ========== HYDRAULIC DIG CYCLE ==========
  // Non-sinusoidal piecewise cycle; period T_DIG = 3.7s
  // Returns {boomA, stickA, bucketA, dirt} in degrees / opacity
  function digPose(phase) {
    // phase in [0, 1)
    let boomA, stickA, bucketA, dirt = 0;
    if (phase < 0.32) {
      // reach out + lower bucket toward ground
      const k = phase / 0.32;
      const e = easeInOut(k);
      boomA = -35 + e * 18;          // -35 → -17
      stickA = 50 + e * 25;          // 50 → 75
      bucketA = 30 + e * 40;         // 30 → 70 (scoop)
      dirt = e * 0.85;
    } else if (phase < 0.55) {
      // curl bucket, lift slightly
      const k = (phase - 0.32) / 0.23;
      const e = easeInOut(k);
      boomA = -17 - e * 10;          // -17 → -27
      stickA = 75 - e * 20;          // 75 → 55
      bucketA = 70 - e * 55;         // 70 → 15 (retain dirt)
      dirt = 0.85;
    } else if (phase < 0.78) {
      // swing boom up to dump height
      const k = (phase - 0.55) / 0.23;
      const e = easeInOut(k);
      boomA = -27 - e * 22;          // -27 → -49
      stickA = 55 - e * 15;          // 55 → 40
      bucketA = 15 + e * 10;         // 15 → 25
      dirt = 0.85;
    } else {
      // dump + return
      const k = (phase - 0.78) / 0.22;
      const e = easeInOut(k);
      boomA = -49 + e * 14;          // -49 → -35
      stickA = 40 + e * 10;          // 40 → 50
      bucketA = 25 + e * 35;         // dump open
      dirt = 0.85 * (1 - Math.min(1, e * 1.4));
    }
    return { boomA, stickA, bucketA, dirt };
  }

  function easeInOut(k) {
    return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  }

  // ========== TENTACLE PATH BUILDER ==========
  // Each tentacle: base point + 2 segments with sine flex
  function tentaclePath(baseX, baseY, dirX, dirY, len1, len2, flex, secondary) {
    // dir is outward direction (normalized-ish)
    const nx = -dirY, ny = dirX; // normal
    const midX = baseX + dirX * len1 + nx * flex * 0.6;
    const midY = baseY + dirY * len1 + ny * flex * 0.6;
    const endX = midX + dirX * len2 * 0.9 + nx * (flex + secondary);
    const endY = midY + dirY * len2 * 0.9 + ny * (flex + secondary);
    return {
      d: `M${baseX} ${baseY} Q${midX} ${midY} ${endX} ${endY}`,
      midX, midY, endX, endY
    };
  }

  const tentaclesDef = [
    { bx: -15, by: 20, dx: -0.95, dy: 0.35, l1: 38, l2: 34, amp: 12, ph: 0.0 },
    { bx: -8,  by: 22, dx: -0.55, dy: 0.85, l1: 36, l2: 32, amp: 10, ph: 1.2 },
    { bx: 0,   by: 24, dx: 0.15,  dy: 0.98, l1: 32, l2: 28, amp: 9,  ph: 2.4 },
    { bx: 8,   by: 22, dx: 0.85,  dy: 0.5,  l1: 36, l2: 32, amp: 11, ph: 3.6 },
    { bx: 16,  by: 18, dx: 0.98,  dy: 0.05, l1: 42, l2: 38, amp: 13, ph: 4.8 }
  ];

  function updateTentacles(time) {
    const suckMap = [
      [0, 1], // tent0
      [2],    // tent1
      [3],    // tent2
      [4],    // tent3
      [5, 6]  // tent4
    ];
    for (let i = 0; i < tentaclesDef.length; i++) {
      const def = tentaclesDef[i];
      // PRIMARY: tentacle wave at WAVE_W — independent of dig cycle
      const flex = def.amp * Math.sin(time * WAVE_W + def.ph);
      const secondary = def.amp * 0.35 * Math.sin(time * WAVE_W * 1.7 + def.ph * 1.3);
      const p = tentaclePath(def.bx, def.by, def.dx, def.dy, def.l1, def.l2, flex, secondary);
      tents[i].setAttribute("d", p.d);
      if (tentShadows[i]) tentShadows[i].setAttribute("d", p.d);
      // place suckers along the path (approx at mid and end)
      const idx = suckMap[i];
      if (idx[0] !== undefined && sucks[idx[0]]) {
        sucks[idx[0]].setAttribute("cx", p.midX.toFixed(1));
        sucks[idx[0]].setAttribute("cy", p.midY.toFixed(1));
      }
      if (idx[1] !== undefined && sucks[idx[1]]) {
        sucks[idx[1]].setAttribute("cx", p.endX.toFixed(1));
        sucks[idx[1]].setAttribute("cy", p.endY.toFixed(1));
      }
    }
  }

  // ========== LAYER SCROLL ==========
  function updateLayer(key, dt, speedOverride) {
    const L = layers[key];
    if (!L || !L.nodes.length) return;
    const spd = speedOverride != null ? speedOverride : L.speed;
    L.x -= spd * dt;
    // wrap
    const span = L.tile;
    while (L.x <= -span) L.x += span;
    for (let i = 0; i < L.nodes.length; i++) {
      const n = L.nodes[i];
      let x = L.x + i * span;
      // also push clones far enough
      n.setAttribute("transform", `translate(${x.toFixed(2)},0)`);
    }
  }

  // ========== INPUT ==========
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { boost = true; e.preventDefault(); }
    if (e.code === "ArrowRight") { targetV = Math.min(200, targetV + 15); e.preventDefault(); }
    if (e.code === "ArrowLeft") { targetV = Math.max(20, targetV - 15); e.preventDefault(); }
    if (e.code === "KeyD") { digBoost = !digBoost; }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") boost = false;
  });
  // click/tap also boosts briefly
  svg.addEventListener("pointerdown", () => { boost = true; });
  svg.addEventListener("pointerup", () => { boost = false; });

  // ========== MAIN LOOP ==========
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1; // tab-switch clamp
    t += dt;

    // speed ease
    const vTarget = boost ? targetV * 1.55 : targetV;
    v += (vTarget - v) * Math.min(1, dt * 3);

    // ---- CORE COUPLING: trackPhase advances by exactly v*dt ----
    trackPhase += v * dt;
    sprocketAngle = trackPhase / R_SPROCKET; // omega = v / r  — identity, not a guess

    // apply track pads (visual pads move at v)
    updatePads(trackPadsR, trackPhase, 26, 668);
    updatePads(trackPadsLg, trackPhase, 26, 672);

    // sprocket / idler rotation — same omega
    const deg = (sprocketAngle * 180 / Math.PI) % 360;
    sprocketR.setAttribute("transform", `translate(-110,720) rotate(${deg.toFixed(2)})`);
    sprocketL.setAttribute("transform", `translate(-100,720) rotate(${deg.toFixed(2)})`);
    idlerR.setAttribute("transform", `translate(135,720) rotate(${deg.toFixed(2)})`);
    idlerL.setAttribute("transform", `translate(120,720) rotate(${deg.toFixed(2)})`);

    // road wheel spin marks — rebuild angles via group rotate
    // (marks were built at fixed angles; rotate the group)
    const wheelDeg = (trackPhase / R_WHEEL * 180 / Math.PI) % 360;
    // wheelsR/L groups don't have a transform origin set; use individual approach:
    // We rotate each wheel's marks by setting a transform on the group around avg center.
    // Simpler: leave static spokes, rely on pad + sprocket motion (still self-consistent).
    // For stronger cue, we pulse opacity of road wheels slightly — no, keep kinematic honesty:
    // apply rotate around each wheel center by wrapping — skip for cleanliness.

    // vehicle bob (suspension / uneven dirt)
    camBob = Math.sin(t * 7.3) * 1.2 + Math.sin(t * 3.1) * 0.8;
    const pitch = Math.sin(t * 2.4) * 0.4;
    vehicle.setAttribute("transform", `translate(620, ${camBob.toFixed(2)}) rotate(${pitch.toFixed(2)} 0 720)`);

    // parallax layers — speeds scale with current v (not fixed baseline)
    updateLayer("far", dt, PARALLAX.far * v);
    updateLayer("mid", dt, PARALLAX.mid * v);
    updateLayer("near", dt, PARALLAX.near * v);
    updateLayer("ground", dt, PARALLAX.ground * v);
    updateLayer("fg", dt, PARALLAX.fg * v);

    // clouds very slow
    clouds.setAttribute("transform", `translate(${(-(t * 4) % 400).toFixed(1)},0)`);

    // hydraulic dig — period T_DIG, optional double-time
    const digRate = digBoost ? 2 : 1;
    const digPhase = (t * digRate / T_DIG) % 1;
    const pose = digPose(digPhase);
    boom.setAttribute("transform", `rotate(${pose.boomA.toFixed(2)})`);
    stickArm.setAttribute("transform", `rotate(${pose.stickA.toFixed(2)})`);
    bucketArm.setAttribute("transform", `rotate(${pose.bucketA.toFixed(2)})`);
    bucketDirt.setAttribute("opacity", pose.dirt.toFixed(2));

    // tentacles — WAVE_W frequency, phase offsets — NEVER locked to dig
    updateTentacles(t);

    // dust
    updateDust(dt, v);
    updateKick(dt);
    updateExhaust(dt);

    requestAnimationFrame(frame);
  }

  // ========== BOOT ==========
  function boot() {
    initLayers();
    buildPads(trackPadsR, 668, 22, 16);
    buildPads(trackPadsLg, 672, 22, 14);
    // initial pad placement
    updatePads(trackPadsR, 0, 26, 668);
    updatePads(trackPadsLg, 0, 26, 672);

    // road wheel marks
    buildWheelMarks(wheelsR, -55, 750, 14, 4);
    buildWheelMarks(wheelsR, 0, 750, 14, 4);
    buildWheelMarks(wheelsR, 55, 750, 14, 4);
    buildWheelMarks(wheelsL, -50, 745, 12, 3);
    buildWheelMarks(wheelsL, 0, 745, 12, 3);
    buildWheelMarks(wheelsL, 50, 745, 12, 3);

    initDust();
    initKick();
    initExhaust();

    // stamp kinematic identity into a hidden data attribute for audit
    svg.setAttribute("data-v0", String(V0));
    svg.setAttribute("data-r-sprocket", String(R_SPROCKET));
    svg.setAttribute("data-omega0", OMEGA0.toFixed(4));
    svg.setAttribute("data-wave-w", String(WAVE_W));
    svg.setAttribute("data-t-dig", String(T_DIG));
    svg.setAttribute("data-omega-dig", OMEGA_DIG.toFixed(4));
    svg.setAttribute("data-parallax", JSON.stringify(PARALLAX));

    requestAnimationFrame(frame);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
