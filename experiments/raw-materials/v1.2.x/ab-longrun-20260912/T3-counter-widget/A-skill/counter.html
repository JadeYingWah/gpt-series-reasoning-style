<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>计数器</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --text: #e7ecf3;
    --muted: #8b9bb4;
    --accent: #3d8bfd;
    --accent-dim: #1e4d8c;
    --danger: #f07178;
    --ok: #7fd99a;
    --border: #2a3648;
    --disabled-bg: #243044;
    --disabled-text: #5a6a80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .card {
    width: min(360px, calc(100vw - 32px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px 24px;
    text-align: center;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  #value {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    margin-bottom: 8px;
    transition: color 0.15s ease, transform 0.12s ease;
  }
  #value.at-max { color: var(--danger); }
  #value.at-min { color: var(--danger); }
  #value.bump { transform: scale(1.06); }
  #status {
    min-height: 20px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  #status.warn { color: var(--danger); }
  .row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 16px;
  }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--accent-dim);
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    min-width: 72px;
    transition: background 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-text);
    border-color: var(--border);
    cursor: not-allowed;
    opacity: 0.85;
  }
  button.secondary {
    background: transparent;
    color: var(--muted);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--border);
    color: var(--text);
  }
  .step-field {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .step-field label { user-select: none; }
  #step {
    width: 72px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #step:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #step.invalid {
    border-color: var(--danger);
    outline-color: var(--danger);
  }
  #step-error {
    min-height: 16px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--danger);
  }
  .meta {
    margin-top: 18px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    word-break: break-all;
  }
</style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">Counter</h1>
    <div id="value" aria-live="polite">0</div>
    <div id="status"></div>
    <div class="row">
      <button type="button" id="btn-minus" aria-label="减">−</button>
      <button type="button" id="btn-plus" aria-label="加">+</button>
      <button type="button" id="btn-reset" class="secondary" aria-label="重置">重置</button>
    </div>
    <div class="step-field">
      <label for="step">步长</label>
      <input id="step" type="number" min="1" step="1" value="1" inputmode="numeric" />
    </div>
    <div id="step-error"></div>
    <p class="meta">
      范围 −99 ~ 99 · localStorage key:<br />
      <code>counter-widget.v1</code>
    </p>
  </main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "counter-widget.v1";
  var MIN = -99;
  var MAX = 99;
  var DEFAULT_STEP = 1;

  var state = { value: 0, step: DEFAULT_STEP };

  var elValue = document.getElementById("value");
  var elStatus = document.getElementById("status");
  var elStep = document.getElementById("step");
  var elStepError = document.getElementById("step-error");
  var btnPlus = document.getElementById("btn-plus");
  var btnMinus = document.getElementById("btn-minus");
  var btnReset = document.getElementById("btn-reset");

  function clamp(n, lo, hi) {
    return Math.min(hi, Math.max(lo, n));
  }

  /** Parse user step input. Returns {ok, step, message} */
  function parseStep(raw) {
    var s = String(raw == null ? "" : raw).trim();
    if (s === "") {
      return { ok: false, step: DEFAULT_STEP, message: "步长不能为空" };
    }
    if (!/^\d+$/.test(s)) {
      return { ok: false, step: DEFAULT_STEP, message: "步长必须是正整数" };
    }
    var n = parseInt(s, 10);
    if (!isFinite(n) || n < 1) {
      return { ok: false, step: DEFAULT_STEP, message: "步长必须 ≥ 1" };
    }
    // Keep within a sane range so one click cannot jump past bounds weirdly.
    if (n > MAX) {
      return { ok: false, step: DEFAULT_STEP, message: "步长不能超过 99" };
    }
    return { ok: true, step: n, message: "" };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { value: 0, step: DEFAULT_STEP };
      var data = JSON.parse(raw);
      var v = typeof data.value === "number" && isFinite(data.value) ? data.value : 0;
      var st = typeof data.step === "number" && isFinite(data.step) && data.step >= 1 && data.step <= MAX
        ? Math.floor(data.step)
        : DEFAULT_STEP;
      return { value: clamp(Math.round(v), MIN, MAX), step: st };
    } catch (e) {
      return { value: 0, step: DEFAULT_STEP };
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        value: state.value,
        step: state.step
      }));
    } catch (e) {
      // Private mode / quota — silent fail is acceptable for this widget.
    }
  }

  function canAdd() {
    return state.value + state.step <= MAX;
  }

  function canSub() {
    return state.value - state.step >= MIN;
  }

  function setStatus(msg, isWarn) {
    elStatus.textContent = msg || "";
    elStatus.className = isWarn ? "warn" : "";
  }

  function render(opts) {
    opts = opts || {};
    elValue.textContent = String(state.value);
    elValue.classList.toggle("at-max", state.value >= MAX);
    elValue.classList.toggle("at-min", state.value <= MIN);

    var addOk = canAdd();
    var subOk = canSub();
    btnPlus.disabled = !addOk;
    btnMinus.disabled = !subOk;
    btnPlus.title = addOk ? "" : "已达上限 99";
    btnMinus.title = subOk ? "" : "已达下限 −99";

    if (state.value >= MAX) {
      setStatus("已达上限 99", true);
    } else if (state.value <= MIN) {
      setStatus("已达下限 −99", true);
    } else if (!opts.keepStatus) {
      setStatus("", false);
    }

    if (opts.bump) {
      elValue.classList.add("bump");
      setTimeout(function () {
        elValue.classList.remove("bump");
      }, 120);
    }
  }

  function commit(nextValue, opts) {
    state.value = clamp(Math.round(nextValue), MIN, MAX);
    save();
    render(opts);
  }

  function onPlus() {
    if (!canAdd()) {
      setStatus("已达上限 99，无法再加", true);
      return;
    }
    commit(state.value + state.step, { bump: true });
  }

  function onMinus() {
    if (!canSub()) {
      setStatus("已达下限 −99，无法再减", true);
      return;
    }
    commit(state.value - state.step, { bump: true });
  }

  function onReset() {
    commit(0, { bump: true });
    setStatus("已重置为 0", false);
  }

  function onStepInput() {
    var parsed = parseStep(elStep.value);
    if (!parsed.ok) {
      elStep.classList.add("invalid");
      elStepError.textContent = parsed.message;
      // Keep last valid step in state; do not change counter behavior.
      return;
    }
    elStep.classList.remove("invalid");
    elStepError.textContent = "";
    state.step = parsed.step;
    save();
    render({ keepStatus: true });
  }

  function onStepBlur() {
    // Snap display back to the last valid step if invalid.
    var parsed = parseStep(elStep.value);
    if (!parsed.ok) {
      elStep.value = String(state.step);
      elStep.classList.remove("invalid");
      elStepError.textContent = "";
    }
  }

  // --- boot ---
  var initial = load();
  state.value = initial.value;
  state.step = initial.step;
  elStep.value = String(state.step);

  btnPlus.addEventListener("click", onPlus);
  btnMinus.addEventListener("click", onMinus);
  btnReset.addEventListener("click", onReset);
  elStep.addEventListener("input", onStepInput);
  elStep.addEventListener("change", onStepInput);
  elStep.addEventListener("blur", onStepBlur);

  render();

  // Expose pure helpers for offline tests (non-enumerable-ish global; harmless in browser).
  window.__counterTest = {
    MIN: MIN,
    MAX: MAX,
    STORAGE_KEY: STORAGE_KEY,
    parseStep: parseStep,
    clamp: clamp,
    getState: function () { return { value: state.value, step: state.step }; },
    canAdd: canAdd,
    canSub: canSub
  };
})();
</script>
</body>
</html>
