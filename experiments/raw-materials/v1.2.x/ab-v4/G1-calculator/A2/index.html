<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1e26;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .calc {
    width: 320px;
    background: #272a36;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .screen {
    background: #1c1e26;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    text-align: right;
    overflow: hidden;
  }
  .screen .expr {
    min-height: 1.3em;
    font-size: .95rem;
    color: #8b90a5;
    white-space: nowrap;
  }
  .screen .main {
    font-size: 2.4rem;
    font-weight: 600;
    color: #f2f3f7;
    line-height: 1.25;
    word-break: break-all;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 56px;
    gap: 10px;
  }
  button {
    border: 0;
    border-radius: 10px;
    font-size: 1.25rem;
    font-family: inherit;
    background: #343850;
    color: #e8eaf2;
    cursor: pointer;
    transition: background .12s, transform .06s;
  }
  button:hover { background: #404465; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid #7c8cff; outline-offset: 2px; }
  .fn { background: #2c2f40; color: #b7bccf; font-size: 1.15rem; }
  .op { background: #3b3f63; color: #aab1ff; }
  .eq { background: #5a63e8; color: #fff; grid-row: span 2; }
  .eq:hover { background: #6a72f0; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
<main class="calc" aria-label="计算器">
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="main" id="display" aria-live="polite">0</div>
  </div>
  <div class="keys" id="keys">
    <button type="button" class="fn" data-k="C" aria-label="清除">C</button>
    <button type="button" class="fn" data-k="back" aria-label="退格">⌫</button>
    <button type="button" class="op" data-k="/" aria-label="除">÷</button>
    <button type="button" class="op" data-k="*" aria-label="乘">×</button>
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" class="op" data-k="-" aria-label="减">−</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" class="op" data-k="+" aria-label="加">+</button>
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" class="eq" data-k="=" aria-label="等于">=</button>
    <button type="button" class="zero" data-k="0">0</button>
    <button type="button" data-k=".">.</button>
  </div>
</main>
<script>
(function () {
  'use strict';

  var display = document.getElementById('display');
  var exprEl = document.getElementById('expr');
  var keysEl = document.getElementById('keys');

  var entry = '0';     // 当前输入（字符串，逐字符累积，仅在计算时转数字）
  var acc = null;      // 累加器（已算出的中间值/结果）
  var op = null;       // 待执行的运算符
  var typing = false;  // 上次运算后是否正在输入新数字
  var error = false;   // 除零等错误态
  var doneExpr = '';   // 等号后展示的完整算式

  var OPS = {
    '+': function (a, b) { return a + b; },
    '-': function (a, b) { return a - b; },
    '*': function (a, b) { return a * b; },
    '/': function (a, b) { return a / b; }
  };
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  // 修剪浮点噪声：0.1+0.2 → 0.3，且不产生尾随零
  function fmt(n) {
    if (!isFinite(n)) return 'Error';
    return String(parseFloat(n.toPrecision(12)));
  }

  function render() {
    display.textContent = error ? 'Error' : entry;
    if (doneExpr) { exprEl.textContent = doneExpr; return; }
    exprEl.textContent = (acc !== null && op) ? fmt(acc) + ' ' + SYM[op] : '';
  }

  function reset() {
    entry = '0'; acc = null; op = null; typing = false; error = false; doneExpr = '';
  }

  function setError() {
    error = true; op = null; acc = null; typing = false;
    display.textContent = 'Error';
  }

  function inputDigit(d) {
    if (error) reset();
    doneExpr = '';
    if (!typing) {
      entry = (d === '.') ? '0.' : d;
      typing = true;
    } else if (d === '.') {
      if (entry.indexOf('.') === -1) entry += '.';  // 防多个小数点
    } else {
      if (entry === '0') entry = d;                 // 防前导零
      else if (entry.replace(/[^0-9]/g, '').length < 15) entry += d;
    }
    render();
  }

  function calc(a, b, o) { return OPS[o](a, b); }

  function inputOp(next) {
    if (error) return;
    doneExpr = '';
    if (typing) {
      var v = Number(entry);
      acc = (acc !== null && op) ? calc(acc, v, op) : v;
      if (!isFinite(acc)) { setError(); return; }
      entry = fmt(acc);
      typing = false;
    } else if (acc === null) {
      acc = Number(entry);  // 开局直接按运算符：以当前显示值 0 为左操作数
    }
    op = next;              // 未输入新数字时连按仅替换运算符
    render();
  }

  function equals() {
    if (error || acc === null || op === null) return;
    doneExpr = fmt(acc) + ' ' + SYM[op] + ' ' + entry + ' =';
    var r = calc(acc, Number(entry), op);
    if (!isFinite(r)) { setError(); return; }   // 显式除零/溢出检查
    entry = fmt(r);
    acc = r; op = null; typing = false;
    render();
  }

  function backspace() {
    if (error) return;
    doneExpr = '';
    typing = true;                       // 结果/中间值也可退格编辑
    if (/[eE]/.test(entry)) return;      // 指数形式不逐字编辑
    entry = entry.slice(0, -1);
    if (entry === '' || entry === '-') entry = '0';
    render();
  }

  function clearAll() { reset(); render(); }

  function press(k) {
    if (k === 'C') clearAll();
    else if (k === 'back') backspace();
    else if (k === '=') equals();
    else if (k === '+' || k === '-' || k === '*' || k === '/') inputOp(k);
    else inputDigit(k);
  }

  // 按钮点击：容器上单一委托监听器
  keysEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-k]');
    if (!btn) return;
    press(btn.getAttribute('data-k'));
  });

  // 键盘输入：与按钮共用同一 press() 入口，行为一致
  document.addEventListener('keydown', function (e) {
    var k = e.key, mapped = null;
    if (k >= '0' && k <= '9') mapped = k;
    else if (k === '.') mapped = '.';
    else if (k === '+' || k === '-' || k === '*' || k === '/') mapped = k;
    else if (k === 'Enter' || k === '=') mapped = '=';
    else if (k === 'Escape') mapped = 'C';
    else if (k === 'Backspace') mapped = 'back';
    if (mapped) { e.preventDefault(); press(mapped); }
  });

  render();
})();
</script>
</body>
</html>
