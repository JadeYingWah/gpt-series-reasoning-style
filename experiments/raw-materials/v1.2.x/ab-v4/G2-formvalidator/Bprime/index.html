<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表单校验组件</title>
<style>
  :root {
    --err: #d93025;
    --ok: #188038;
    --line: #dadce0;
    --line-focus: #1a73e8;
    --text: #202124;
    --muted: #5f6368;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f4;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
    padding: 28px 32px 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .req { color: var(--err); }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    background: #fff;
  }
  input:focus { border-color: var(--line-focus); box-shadow: 0 0 0 2px rgba(26, 115, 232, .18); }
  .field.invalid input { border-color: var(--err); }
  .field.invalid input:focus { box-shadow: 0 0 0 2px rgba(217, 48, 37, .18); }
  .field.valid input { border-color: var(--ok); }
  .msg {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.5;
    min-height: 18px;
  }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  button {
    width: 100%;
    padding: 11px 0;
    font-size: 15px;
    color: #fff;
    background: #1a73e8;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover { background: #1765cc; }
  button:active { background: #145ca8; }
  #form-status {
    margin: 14px 0 0;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  #form-status.err { color: var(--err); font-weight: 600; }
  #form-status.ok { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <h1>注册表单</h1>
  <p class="sub">失焦即时校验 · 提交时全量校验 · 密码需 ≥8 位且含字母与数字</p>
  <form id="reg-form" novalidate>
    <div class="field" id="email-field">
      <label for="email">邮箱 <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="email" name="email" inputmode="email" autocomplete="email"
             placeholder="name@example.com" aria-required="true" aria-describedby="email-msg">
      <p class="msg" id="email-msg" role="alert" hidden></p>
    </div>
    <div class="field" id="phone-field">
      <label for="phone">手机号 <span class="req" aria-hidden="true">*</span></label>
      <input type="text" id="phone" name="phone" inputmode="numeric" autocomplete="tel"
             placeholder="13800138000" aria-required="true" aria-describedby="phone-msg">
      <p class="msg" id="phone-msg" role="alert" hidden></p>
    </div>
    <div class="field" id="password-field">
      <label for="password">密码 <span class="req" aria-hidden="true">*</span></label>
      <input type="password" id="password" name="password" autocomplete="new-password"
             placeholder="至少 8 位，须含字母和数字" aria-required="true" aria-describedby="password-msg">
      <p class="msg" id="password-msg" role="alert" hidden></p>
    </div>
    <button type="submit" id="submit-btn">提交</button>
    <p id="form-status" role="status"></p>
  </form>
</main>
<script>
(function () {
  'use strict';

  // 注意：输入框刻意不设 maxlength，超长输入由校验逻辑给出明确反馈
  var MAX_EMAIL = 254;
  var MAX_PASSWORD = 64;
  var EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/;

  var validators = {
    email: function (raw) {
      var v = String(raw).trim();
      if (!v) return { ok: false, msg: '邮箱不能为空' };
      if (/\s/.test(v)) return { ok: false, msg: '邮箱不能包含空格或特殊空白字符' };
      if (v.length > MAX_EMAIL) {
        return { ok: false, msg: '邮箱过长：不能超过 ' + MAX_EMAIL + ' 个字符（当前 ' + v.length + ' 个）' };
      }
      if (!EMAIL_RE.test(v)) return { ok: false, msg: '邮箱格式不正确，应形如 name@example.com' };
      return { ok: true, msg: '邮箱格式正确' };
    },
    phone: function (raw) {
      var v = String(raw).trim();
      if (!v) return { ok: false, msg: '手机号不能为空' };
      if (/\D/.test(v)) return { ok: false, msg: '手机号只能包含数字，不能含有字母、空格或特殊字符' };
      if (v.length !== 11) {
        return { ok: false, msg: '手机号应为 11 位数字（当前 ' + v.length + ' 位）' };
      }
      if (!/^1[3-9]/.test(v)) return { ok: false, msg: '手机号应以 1 开头，第 2 位为 3-9' };
      return { ok: true, msg: '手机号格式正确' };
    },
    password: function (raw) {
      var v = String(raw);
      if (!v) return { ok: false, msg: '密码不能为空' };
      if (v.length > MAX_PASSWORD) {
        return { ok: false, msg: '密码过长：不能超过 ' + MAX_PASSWORD + ' 个字符（当前 ' + v.length + ' 个）' };
      }
      if (v.length < 8) {
        return { ok: false, msg: '密码长度至少 8 位（当前 ' + v.length + ' 位）' };
      }
      if (!/[A-Za-z]/.test(v)) return { ok: false, msg: '密码必须包含至少一个字母' };
      if (!/\d/.test(v)) return { ok: false, msg: '密码必须包含至少一个数字' };
      return { ok: true, msg: '密码符合要求' };
    }
  };

  var NAMES = ['email', 'phone', 'password'];
  var touched = {};

  function fieldEl(name) { return document.getElementById(name + '-field'); }
  function inputEl(name) { return document.getElementById(name); }
  function msgEl(name) { return document.getElementById(name + '-msg'); }

  function render(name, result) {
    var input = inputEl(name);
    var msg = msgEl(name);
    var field = fieldEl(name);
    if (result.ok) {
      field.classList.remove('invalid');
      field.classList.add('valid');
      input.setAttribute('aria-invalid', 'false');
      msg.textContent = '\u2713 ' + result.msg;
      msg.classList.remove('err');
      msg.classList.add('ok');
    } else {
      field.classList.remove('valid');
      field.classList.add('invalid');
      input.setAttribute('aria-invalid', 'true');
      msg.textContent = result.msg;
      msg.classList.remove('ok');
      msg.classList.add('err');
    }
    msg.hidden = false;
  }

  function validate(name, show) {
    var result = validators[name](inputEl(name).value);
    if (show) render(name, result);
    return result;
  }

  NAMES.forEach(function (name) {
    var input = inputEl(name);
    input.addEventListener('blur', function () {
      touched[name] = true;
      validate(name, true);
    });
    input.addEventListener('input', function () {
      // 首次失焦后转为实时校验，修正输入时错误即时消除
      if (touched[name]) validate(name, true);
    });
  });

  var form = document.getElementById('reg-form');
  var status = document.getElementById('form-status');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var firstInvalid = null;
    var badCount = 0;
    NAMES.forEach(function (name) {
      touched[name] = true;
      var result = validate(name, true);
      if (!result.ok) {
        badCount++;
        if (!firstInvalid) firstInvalid = inputEl(name);
      }
    });
    if (badCount > 0) {
      status.textContent = '提交失败：表单有 ' + badCount + ' 处错误，请修正后重试。';
      status.classList.remove('ok');
      status.classList.add('err');
      if (firstInvalid) firstInvalid.focus();
      return;
    }
    status.classList.remove('err');
    status.classList.add('ok');
    status.textContent = '提交成功：邮箱、手机号、密码均校验通过。';
  });
})();
</script>
</body>
</html>
