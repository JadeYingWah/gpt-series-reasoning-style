<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox Tram · SVG002</title>
<style>
  :root {
    --sky-top: #1a1040;
    --sky-mid: #4a2060;
    --sky-low: #c45a3a;
    --tram-body: #c43c2c;
    --tram-dark: #8a2818;
    --tram-cream: #f2e6c8;
    --tram-window: #7ec8e3;
    --fox-fur: #e87830;
    --fox-dark: #b84810;
    --fox-light: #f5d9b0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0820;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    display: block;
  }

  /* ---- Parallax layers via CSS transform (driven by JS) ---- */
  .layer { will-change: transform; }

  /* ---- Wheel spin: clockwise on screen = rolling rightward ---- */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .wheel-spin {
    animation: spin 0.9s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* ---- Fox limbs: independent of tram body bob ---- */
  @keyframes earTwitch {
    0%, 100% { transform: rotate(0deg); }
    8%       { transform: rotate(-14deg); }
    16%      { transform: rotate(6deg); }
    24%      { transform: rotate(0deg); }
    55%      { transform: rotate(-8deg); }
    65%      { transform: rotate(0deg); }
  }

  @keyframes armSteer {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(10deg); }
  }

  @keyframes tailSwish {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(18deg); }
  }

  @keyframes headBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  @keyframes bodyBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(1.2px); }
  }

  @keyframes pawWave {
    0%, 100% { transform: rotate(0deg); }
    30%      { transform: rotate(-25deg); }
    60%      { transform: rotate(8deg); }
  }

  .ear-left  { animation: earTwitch 2.4s ease-in-out infinite; transform-origin: 8px 20px; transform-box: fill-box; }
  .ear-right { animation: earTwitch 2.4s ease-in-out infinite 0.3s; transform-origin: 8px 20px; transform-box: fill-box; }
  .fox-head  { animation: headBob 1.1s ease-in-out infinite; }
  .fox-arm   { animation: armSteer 1.1s ease-in-out infinite; transform-origin: 4px 4px; transform-box: fill-box; }
  .fox-tail  { animation: tailSwish 1.6s ease-in-out infinite; transform-origin: 100% 50%; transform-box: fill-box; }
  .fox-paw   { animation: pawWave 2.0s ease-in-out infinite; transform-origin: 50% 10%; transform-box: fill-box; }
  .tram-body-bob { animation: bodyBob 0.9s ease-in-out infinite; }

  /* ---- Steam puffs ---- */
  @keyframes puff {
    0%   { opacity: 0.7; transform: translate(0,0) scale(0.4); }
    50%  { opacity: 0.4; transform: translate(-40px,-30px) scale(1.1); }
    100% { opacity: 0;   transform: translate(-80px,-55px) scale(1.6); }
  }
  .puff { animation: puff 2.2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  .puff:nth-child(2) { animation-delay: 0.55s; }
  .puff:nth-child(3) { animation-delay: 1.1s; }
  .puff:nth-child(4) { animation-delay: 1.65s; }

  /* ---- Pole spark ---- */
  @keyframes spark {
    0%, 100% { opacity: 0.3; r: 2; }
    50%      { opacity: 1;   r: 4; }
  }
  .spark { animation: spark 0.35s steps(2) infinite; }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A fox driving a red tram to the right at dusk">

  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a1040"/>
      <stop offset="45%"  stop-color="#4a2060"/>
      <stop offset="78%"  stop-color="#c45a3a"/>
      <stop offset="100%" stop-color="#e89a40"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#ff9a30" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6040" stop-opacity="0"/>
    </radialGradient>

    <!-- Far hills -->
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a2060"/>
      <stop offset="100%" stop-color="#2a1848"/>
    </linearGradient>

    <!-- Mid hills -->
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a3060"/>
      <stop offset="100%" stop-color="#3a2048"/>
    </linearGradient>

    <!-- Near ground -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a3028"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>

    <!-- Tram body -->
    <linearGradient id="tramBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e04830"/>
      <stop offset="55%"  stop-color="#c43c2c"/>
      <stop offset="100%" stop-color="#8a2818"/>
    </linearGradient>

    <!-- Tram roof -->
    <linearGradient id="tramRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f2e6c8"/>
      <stop offset="100%" stop-color="#d0c090"/>
    </linearGradient>

    <!-- Window glass -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#a8d8f0"/>
      <stop offset="50%"  stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#5098b8"/>
    </linearGradient>

    <!-- Fox fur -->
    <linearGradient id="foxFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f09040"/>
      <stop offset="60%"  stop-color="#e87830"/>
      <stop offset="100%" stop-color="#c05010"/>
    </linearGradient>

    <!-- Star filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Steam blur -->
    <filter id="puffBlur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Track sleeper pattern -->
    <pattern id="sleepers" x="0" y="0" width="60" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="4" width="48" height="12" rx="2" fill="#3a2818"/>
      <rect x="4" y="6" width="40" height="3" fill="#5a4030" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- ===================== LAYER 0: SKY ===================== -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#fff8d0" filter="url(#softGlow)" opacity="0.85">
    <circle cx="80"  cy="40"  r="1.4"/>
    <circle cx="200" cy="90"  r="1.0"/>
    <circle cx="340" cy="30"  r="1.6"/>
    <circle cx="480" cy="70"  r="1.1"/>
    <circle cx="620" cy="25"  r="1.3"/>
    <circle cx="760" cy="55"  r="1.0"/>
    <circle cx="900" cy="35"  r="1.5"/>
    <circle cx="1040" cy="80" r="1.2"/>
    <circle cx="1150" cy="45" r="1.0"/>
    <circle cx="150" cy="130" r="0.9"/>
    <circle cx="420" cy="110" r="1.1"/>
    <circle cx="700" cy="100" r="0.8"/>
    <circle cx="980" cy="120" r="1.0"/>
  </g>

  <!-- Moon -->
  <g transform="translate(980, 90)">
    <circle cx="0" cy="0" r="28" fill="#f8f0d0" opacity="0.9"/>
    <circle cx="8" cy="-4" r="22" fill="url(#skyGrad)" opacity="0.35"/>
  </g>

  <!-- Sun low on horizon -->
  <circle cx="320" cy="480" r="90" fill="url(#sunGlow)"/>
  <circle cx="320" cy="480" r="32" fill="#ffe08a" opacity="0.85"/>

  <!-- ===================== LAYER 1: FAR PARALLAX ===================== -->
  <g id="layerFar" class="layer">
    <!-- Distant skyline / hills -->
    <path fill="url(#hillFar)" opacity="0.9"
      d="M-400,480 L-350,420 L-280,440 L-200,380 L-120,410 L-40,360 L40,390 L120,340
         L200,370 L280,320 L360,360 L440,330 L520,380 L600,340 L680,370 L760,320
         L840,360 L920,330 L1000,370 L1080,340 L1160,380 L1240,350 L1320,390
         L1400,360 L1480,400 L1560,370 L1600,400 L1600,520 L-400,520 Z"/>

    <!-- Far trees / poles silhouette -->
    <g fill="#2a1848" opacity="0.85">
      <!-- repeating telegraph poles -->
      <g transform="translate(-200,0)">
        <rect x="18" y="340" width="6" height="140" rx="2"/>
        <rect x="5"  y="350" width="32" height="5" rx="1"/>
        <rect x="8"  y="365" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(60,0)">
        <rect x="18" y="350" width="6" height="130" rx="2"/>
        <rect x="5"  y="360" width="32" height="5" rx="1"/>
        <rect x="8"  y="375" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(320,0)">
        <rect x="18" y="345" width="6" height="135" rx="2"/>
        <rect x="5"  y="355" width="32" height="5" rx="1"/>
        <rect x="8"  y="370" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(580,0)">
        <rect x="18" y="350" width="6" height="130" rx="2"/>
        <rect x="5"  y="360" width="32" height="5" rx="1"/>
        <rect x="8"  y="375" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(840,0)">
        <rect x="18" y="342" width="6" height="138" rx="2"/>
        <rect x="5"  y="352" width="32" height="5" rx="1"/>
        <rect x="8"  y="367" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(1100,0)">
        <rect x="18" y="348" width="6" height="132" rx="2"/>
        <rect x="5"  y="358" width="32" height="5" rx="1"/>
        <rect x="8"  y="373" width="26" height="4" rx="1"/>
      </g>
      <g transform="translate(1360,0)">
        <rect x="18" y="350" width="6" height="130" rx="2"/>
        <rect x="5"  y="360" width="32" height="5" rx="1"/>
        <rect x="8"  y="375" width="26" height="4" rx="1"/>
      </g>
      <!-- distant bush clumps -->
      <ellipse cx="100" cy="470" rx="40" ry="18"/>
      <ellipse cx="160" cy="475" rx="28" ry="14"/>
      <ellipse cx="450" cy="468" rx="50" ry="20"/>
      <ellipse cx="720" cy="472" rx="35" ry="16"/>
      <ellipse cx="980" cy="465" rx="55" ry="22"/>
      <ellipse cx="1250" cy="470" rx="40" ry="18"/>
    </g>
  </g>

  <!-- ===================== LAYER 2: MID PARALLAX ===================== -->
  <g id="layerMid" class="layer">
    <path fill="url(#hillMid)" opacity="0.95"
      d="M-400,520 L-320,470 L-240,490 L-160,450 L-80,475 L0,440 L80,465 L160,430
         L240,460 L320,425 L400,455 L480,430 L560,460 L640,435 L720,455 L800,420
         L880,450 L960,430 L1040,455 L1120,435 L1200,460 L1280,440 L1360,465
         L1440,445 L1520,470 L1600,450 L1600,560 L-400,560 Z"/>

    <!-- Mid-layer trees -->
    <g fill="#3a2048">
      <!-- tree helper shapes -->
      <g transform="translate(50,0)">
        <rect x="18" y="400" width="10" height="70" fill="#2a1810"/>
        <ellipse cx="23" cy="390" rx="28" ry="35"/>
        <ellipse cx="10" cy="405" rx="18" ry="22"/>
        <ellipse cx="38" cy="400" rx="16" ry="20"/>
      </g>
      <g transform="translate(280,0)">
        <rect x="20" y="395" width="12" height="75" fill="#2a1810"/>
        <ellipse cx="26" cy="380" rx="34" ry="42"/>
        <ellipse cx="8"  cy="400" rx="20" ry="26"/>
        <ellipse cx="46" cy="395" rx="22" ry="28"/>
      </g>
      <g transform="translate(560,0)">
        <rect x="16" y="405" width="9"  height="65" fill="#2a1810"/>
        <ellipse cx="20" cy="395" rx="24" ry="30"/>
        <ellipse cx="5"  cy="410" rx="14" ry="18"/>
      </g>
      <g transform="translate(820,0)">
        <rect x="22" y="390" width="13" height="80" fill="#2a1810"/>
        <ellipse cx="28" cy="372" rx="38" ry="48"/>
        <ellipse cx="6"  cy="398" rx="22" ry="28"/>
        <ellipse cx="52" cy="392" rx="24" ry="30"/>
      </g>
      <g transform="translate(1120,0)">
        <rect x="18" y="400" width="10" height="70" fill="#2a1810"/>
        <ellipse cx="23" cy="388" rx="30" ry="38"/>
        <ellipse cx="4"  cy="408" rx="16" ry="20"/>
      </g>
      <g transform="translate(1400,0)">
        <rect x="20" y="395" width="12" height="75" fill="#2a1810"/>
        <ellipse cx="26" cy="378" rx="36" ry="44"/>
        <ellipse cx="6"  cy="400" rx="20" ry="24"/>
      </g>
    </g>

    <!-- Overhead catenary wires (mid layer) -->
    <g stroke="#1a1030" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M-400,200 Q0,185 400,200 T1200,200 T2000,200"/>
      <path d="M-400,215 Q0,205 400,215 T1200,215 T2000,215"/>
    </g>
    <!-- Support poles for wires -->
    <g fill="#2a1830">
      <rect x="100" y="180" width="8" height="300" rx="2"/>
      <rect x="480" y="185" width="8" height="295" rx="2"/>
      <rect x="860" y="178" width="8" height="302" rx="2"/>
      <rect x="1240" y="182" width="8" height="298" rx="2"/>
      <!-- crossbars -->
      <rect x="85"  y="190" width="38" height="6" rx="1"/>
      <rect x="465" y="195" width="38" height="6" rx="1"/>
      <rect x="845" y="188" width="38" height="6" rx="1"/>
      <rect x="1225" y="192" width="38" height="6" rx="1"/>
    </g>
  </g>

  <!-- ===================== LAYER 3: NEAR GROUND + TRACKS ===================== -->
  <g id="layerNear" class="layer">
    <!-- Ground -->
    <rect x="-200" y="500" width="1800" height="220" fill="url(#groundGrad)"/>

    <!-- Track bed -->
    <rect x="-200" y="545" width="1800" height="50" fill="#3a2818"/>
    <!-- Sleepers -->
    <rect x="-200" y="550" width="1800" height="30" fill="url(#sleepers)"/>
    <!-- Rails -->
    <rect x="-200" y="548" width="1800" height="5"  fill="#8a8070" rx="2"/>
    <rect x="-200" y="572" width="1800" height="5"  fill="#8a8070" rx="2"/>
    <rect x="-200" y="548" width="1800" height="2"  fill="#c0b8a0" opacity="0.6"/>

    <!-- Near grass tufts / ground detail -->
    <g fill="#4a3828">
      <ellipse cx="40"  cy="610" rx="20" ry="8"/>
      <ellipse cx="180" cy="620" rx="14" ry="6"/>
      <ellipse cx="400" cy="615" rx="22" ry="7"/>
      <ellipse cx="700" cy="625" rx="16" ry="6"/>
      <ellipse cx="950" cy="612" rx="18" ry="7"/>
      <ellipse cx="1150" cy="622" rx="20" ry="8"/>
    </g>
    <!-- Foreground weeds (closest, slight motion blur feel via opacity) -->
    <g fill="#2a1810" opacity="0.7">
      <path d="M30,640 Q35,600 28,580 Q40,600 38,640Z"/>
      <path d="M55,645 Q50,605 58,585 Q48,610 52,645Z"/>
      <path d="M200,648 Q205,610 198,590 Q210,615 205,648Z"/>
      <path d="M500,642 Q495,605 503,585 Q492,610 498,642Z"/>
      <path d="M800,650 Q808,612 800,592 Q812,615 806,650Z"/>
      <path d="M1050,645 Q1045,608 1052,588 Q1042,612 1048,645Z"/>
    </g>
  </g>

  <!-- ===================== TRAM + FOX (vehicle frame) ===================== -->
  <g id="tramGroup" transform="translate(520, 320)">

    <!-- ===== TRAM BODY (bobbing) ===== -->
    <g class="tram-body-bob">

      <!-- Pantograph / pole to wire -->
      <g stroke="#605040" stroke-width="4" fill="none" stroke-linecap="round">
        <line x1="200" y1="-40" x2="180" y2="-110"/>
        <line x1="180" y1="-110" x2="160" y2="-140"/>
      </g>
      <!-- Pole head contact shoe -->
      <rect x="145" y="-148" width="36" height="10" rx="3" fill="#806050"/>
      <!-- Spark at contact -->
      <circle class="spark" cx="163" cy="-148" r="3" fill="#ffe060" filter="url(#softGlow)"/>

      <!-- Main body -->
      <rect x="0" y="-40" width="380" height="120" rx="12" fill="url(#tramBody)"/>
      <!-- Cream belt line -->
      <rect x="0" y="-8" width="380" height="18" fill="url(#tramRoof)" opacity="0.9"/>
      <!-- Dark underframe -->
      <rect x="10" y="60" width="360" height="22" rx="4" fill="#2a1810"/>
      <!-- Front skirt / bumper -->
      <path d="M370,20 L400,20 L405,50 L370,50 Z" fill="#a03020"/>
      <rect x="378" y="28" width="22" height="8" rx="2" fill="#e8c060"/>
      <!-- Headlight -->
      <circle cx="390" cy="0" r="10" fill="#fff8c0" filter="url(#softGlow)"/>
      <circle cx="390" cy="0" r="5"  fill="#fffef0"/>

      <!-- Roof -->
      <rect x="-8" y="-58" width="396" height="24" rx="10" fill="url(#tramRoof)"/>
      <rect x="10" y="-62" width="360" height="10" rx="4" fill="#c0b080"/>

      <!-- Chimney / steam stack (rear-left of tram roof) -->
      <rect x="30" y="-80" width="22" height="28" rx="3" fill="#4a3830"/>
      <rect x="26" y="-86" width="30" height="10" rx="3" fill="#5a4838"/>
      <!-- Steam puffs -->
      <g filter="url(#puffBlur)">
        <circle class="puff" cx="40"  cy="-90" r="10" fill="#e8e0d0" opacity="0.5"/>
        <circle class="puff" cx="40"  cy="-90" r="8"  fill="#d0c8b8" opacity="0.5"/>
        <circle class="puff" cx="40"  cy="-90" r="12" fill="#e0d8c8" opacity="0.4"/>
        <circle class="puff" cx="40"  cy="-90" r="7"  fill="#c8c0b0" opacity="0.5"/>
      </g>

      <!-- Side windows (driver cabin is leftmost / rear; fox faces RIGHT so cabin is front-right) -->
      <!-- Rear passenger windows -->
      <rect x="30"  y="-30" width="50" height="40" rx="4" fill="url(#glass)" stroke="#6a5040" stroke-width="2"/>
      <rect x="95"  y="-30" width="50" height="40" rx="4" fill="url(#glass)" stroke="#6a5040" stroke-width="2"/>
      <rect x="160" y="-30" width="50" height="40" rx="4" fill="url(#glass)" stroke="#6a5040" stroke-width="2"/>
      <!-- Window reflection streaks -->
      <g stroke="#fff" stroke-width="2" opacity="0.25" fill="none">
        <line x1="36" y1="-24" x2="48" y2="-2"/>
        <line x1="101" y1="-24" x2="113" y2="-2"/>
        <line x1="166" y1="-24" x2="178" y2="-2"/>
      </g>

      <!-- Driver cabin window (front-right) -->
      <rect x="230" y="-32" width="90" height="48" rx="5" fill="url(#glass)" stroke="#6a5040" stroke-width="2.5"/>
      <line x1="275" y1="-32" x2="275" y2="16" stroke="#6a5040" stroke-width="2"/>

      <!-- Cabin door lines -->
      <line x1="220" y1="-38" x2="220" y2="70" stroke="#8a2818" stroke-width="1.5" opacity="0.6"/>

      <!-- Route board -->
      <rect x="330" y="-28" width="40" height="16" rx="2" fill="#f8f0d0"/>
      <text x="350" y="-15" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2a1830">B·02</text>

      <!-- Side stripe / number -->
      <text x="100" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e8c060" opacity="0.8">TRAM 7</text>

      <!-- Fenders over wheels -->
      <path d="M20,80 Q50,55 80,80" fill="none" stroke="#2a1810" stroke-width="6" stroke-linecap="round"/>
      <path d="M260,80 Q290,55 320,80" fill="none" stroke="#2a1810" stroke-width="6" stroke-linecap="round"/>
      <path d="M330,80 Q350,60 370,80" fill="none" stroke="#2a1810" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- end tram-body-bob -->

    <!-- ===== WHEELS (spin independent of body bob — mounted on truck) ===== -->
    <!-- Rear bogie -->
    <g>
      <!-- axle bar -->
      <rect x="20" y="78" width="340" height="8" fill="#1a1010"/>
      <!-- Wheel 1 (rear) -->
      <g class="wheel-spin" style="animation-duration: 0.85s;">
        <circle cx="50" cy="95" r="28" fill="#2a2020" stroke="#504030" stroke-width="3"/>
        <circle cx="50" cy="95" r="8"  fill="#806040"/>
        <!-- spokes — rotation direction: clockwise → vehicle moves RIGHT -->
        <line x1="50" y1="70"  x2="50" y2="120" stroke="#605040" stroke-width="3"/>
        <line x1="25" y1="95"  x2="75" y2="95"  stroke="#605040" stroke-width="3"/>
        <line x1="32" y1="77"  x2="68" y2="113" stroke="#605040" stroke-width="2.5"/>
        <line x1="32" y1="113" x2="68" y2="77"  stroke="#605040" stroke-width="2.5"/>
        <!-- tread marks to show spin -->
        <circle cx="50" cy="72" r="2" fill="#c0a060"/>
        <circle cx="50" cy="118" r="2" fill="#c0a060"/>
        <circle cx="27" cy="95" r="2" fill="#c0a060"/>
        <circle cx="73" cy="95" r="2" fill="#c0a060"/>
      </g>
      <!-- Wheel 2 (mid-rear) -->
      <g class="wheel-spin" style="animation-duration: 0.85s;">

<script>
/**
 * Parallax engine
 * Forward motion = +X (tram faces right). Background layers scroll LEFT
 * at different rates so the tram appears to advance rightward.
 *
 * Speeds (px/s at full frame width 1200):
 *   far  ≈ 30 px/s   (distant poles / hills)
 *   mid  ≈ 80 px/s   (trees / catenary)
 *   near ≈ 160 px/s  (track bed detail / weeds)
 * Wheel angular speed is coordinated so tread ≈ ground speed.
 */
(function () {
  const layerFar  = document.getElementById('layerFar');
  const layerMid  = document.getElementById('layerMid');
  const layerNear = document.getElementById('layerNear');
  if (!layerFar || !layerMid || !layerNear) return;

  // Parallax factors (relative to a nominal vehicle speed of 1.0)
  const speed = 1.0;          // overall speed multiplier
  const vFar  = 0.18 * speed; // slowest
  const vMid  = 0.50 * speed;
  const vNear = 1.00 * speed; // closest to vehicle speed

  // Each layer is authored wide enough to tile; we scroll by translating X
  // and wrap using modulo of the pattern width.
  // Far poles repeat every 260px in the authored SVG; mid trees ~270px.
  const wrapFar  = 260;
  const wrapMid  = 270;
  const wrapNear = 400;

  let x = 0;                 // virtual distance traveled
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    // Nominal: 200 virtual px per second
    x += 200 * dt;

    const xf = -((x * vFar)  % wrapFar);
    const xm = -((x * vMid)  % wrapMid);
    const xn = -((x * vNear) % wrapNear);

    layerFar.setAttribute('transform',  'translate(' + xf.toFixed(2) + ',0)');
    layerMid.setAttribute('transform',  'translate(' + xm.toFixed(2) + ',0)');
    layerNear.setAttribute('transform', 'translate(' + xn.toFixed(2) + ',0)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/**
 * Self-consistency notes (also mirrored in notes.md):
 *
 * 1. Wheel rotation direction: CSS `@keyframes spin` is 0→360deg
 *    (clockwise on screen). For a vehicle on the ground moving RIGHT,
 *    the contact point moves left relative to the hub, so clockwise
 *    spin is correct.
 *
 * 2. Wheel period 0.85s. Wheel radius 28px. Circumference ≈ 176px.
 *    Implied linear speed ≈ 176/0.85 ≈ 207 px/s. Near-layer scroll
 *    uses vNear=1.0 × 200 px/s ≈ 200 px/s — matched within ~3%.
 *
 * 3. Fox relative motion (not locked to tram):
 *    a) Ears twitch on their own 2.4s cycle (earTwitch).
 *    b) Arms steer on 1.1s cycle (armSteer), phase-offset L/R.
 *    c) Tail swishes on 1.6s cycle (tailSwish) — large excursion.
 *    d) Head bobs on 1.1s cycle, offset from tram bodyBob 0.9s.
 *    e) Raised paw waves on 2.0s cycle (pawWave).
 *    Tram body itself bobs at 0.9s — different periods guarantee
 *    non-rigid coupling.
 *
 * 4. Parallax: three layers (far hills/poles, mid trees/wires,
 *    near track/weeds) scroll at 0.18 / 0.50 / 1.00 × vehicle speed
 *    via rAF. Steam puffs drift opposite travel direction.
 *
 * 5. Travel direction: tram faces right (+X). Pantograph leans
 *    slightly back, headlight on the right face, snout points right,
 *    motion lines trail to the left, track sleepers scroll leftward.
 */
</script>
