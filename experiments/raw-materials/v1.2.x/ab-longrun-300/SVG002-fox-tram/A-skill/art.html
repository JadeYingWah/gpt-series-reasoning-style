<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>夜班电车 · Night Tram — Fox Driver</title>
<!--
  SVG002-fox-tram · single-file HTML/SVG
  Direction: twilight night-tram, film-still atmosphere (adventurous pick)
  Geometry & motion notes also live in notes.md
-->
<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a2744;
    --sky-low: #3d4a6b;
    --horizon: #6b5a4e;
    --moon: #f0e6c8;
    --city-far: #1c2438;
    --city-mid: #243048;
    --city-near: #2a3550;
    --tram-body: #8b2e2e;
    --tram-cream: #e8d9b0;
    --tram-dark: #2a1a14;
    --window-glow: #f0c060;
    --window-cool: #7ec8e3;
    --rail: #5a6478;
    --tie: #3a2a1c;
    --ballast: #2a2830;
    --fox-orange: #d4782a;
    --fox-light: #f0c090;
    --fox-dark: #8a4018;
    --fox-belly: #f5e6c8;
    --cap-navy: #1a2840;
    --scarf: #c45c48;
    --sparks: #ffe08a;
    --pole: #1a1c24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--sky-top);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Georgia", "Songti SC", serif;
  }

  .stage {
    width: min(100vw, 1400px);
    height: min(100vh, 780px);
    position: relative;
  }

  svg#scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- infinite scroll helpers (SVG transform) ---------- */
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-200px); }
  }
  @keyframes scroll-left-slow {
    from { transform: translateX(0); }
    to   { transform: translateX(-100px); }
  }
  @keyframes scroll-left-fast {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }

  /* Layer speeds: far 0.25×, mid 0.6×, near 1.4× relative to track 1.0× */
  #layer-stars   { animation: scroll-left-slow 48s linear infinite; }
  #layer-city-far{ animation: scroll-left-slow 36s linear infinite; }
  #layer-city-mid{ animation: scroll-left      18s linear infinite; }
  #layer-poles   { animation: scroll-left-fast 7s  linear infinite; }
  #layer-track   { animation: scroll-left      9s  linear infinite; }

  /* ---------- wheel rotation: clockwise = forward (to the right) ---------- */
  @keyframes spin-cw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-cw 0.9s linear infinite;
  }
  .wheel-spin-rear { animation-duration: 0.9s; animation-delay: -0.22s; }
  .wheel-spin-front { animation-duration: 0.9s; }

  /* ---------- fox limbs / appendages relative to cab ---------- */
  @keyframes head-bob {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    30%      { transform: translate(0.4px, -1.2px) rotate(-1.5deg); }
    60%      { transform: translate(-0.2px, 0.6px) rotate(1deg); }
  }
  @keyframes ear-twitch {
    0%, 70%, 100% { transform: rotate(0deg); }
    78%           { transform: rotate(-12deg); }
    86%           { transform: rotate(4deg); }
  }
  @keyframes ear-twitch-r {
    0%, 55%, 100% { transform: rotate(0deg); }
    62%           { transform: rotate(10deg); }
    70%           { transform: rotate(-3deg); }
  }
  @keyframes tail-sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(10deg); }
  }
  @keyframes scarf-flutter {
    0%, 100% { transform: translate(0, 0) skewY(0deg); }
    25%      { transform: translate(2px, 1px) skewY(-4deg); }
    50%      { transform: translate(4px, -1px) skewY(3deg); }
    75%      { transform: translate(1px, 2px) skewY(-2deg); }
  }
  @keyframes arm-pull {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-8deg); }
    70%      { transform: rotate(4deg); }
  }
  @keyframes body-breathe {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.2px); }
  }

  #fox-head-group {
    transform-box: fill-box;
    transform-origin: 60% 90%;
    animation: head-bob 2.4s ease-in-out infinite;
  }
  #fox-ear-l {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: ear-twitch 3.1s ease-in-out infinite;
  }
  #fox-ear-r {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: ear-twitch-r 2.7s ease-in-out infinite;
  }
  #fox-tail {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: tail-sway 1.8s ease-in-out infinite;
  }
  #fox-scarf {
    transform-box: fill-box;
    transform-origin: 20% 20%;
    animation: scarf-flutter 1.4s ease-in-out infinite;
  }
  #fox-arm {
    transform-box: fill-box;
    transform-origin: 90% 20%;
    animation: arm-pull 2.1s ease-in-out infinite;
  }
  #fox-body {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: body-breathe 2.0s ease-in-out infinite;
  }

  /* pantograph spark flicker */
  @keyframes spark {
    0%, 100% { opacity: 0; }
    4%       { opacity: 1; }
    8%       { opacity: 0.2; }
    12%      { opacity: 0.9; }
    18%      { opacity: 0; }
  }
  #panto-spark { animation: spark 3.7s linear infinite; }

  /* window lamp pulse */
  @keyframes lamp {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }
  .window-lamp { animation: lamp 3.2s ease-in-out infinite; }

  /* headlight beam soft pulse */
  @keyframes beam {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.55; }
  }
  #headlight-beam { animation: beam 2.8s ease-in-out infinite; }

  /* smoke trails up and slightly REARWARD (-x): tram faces +x */
  @keyframes smoke {
    0%   { opacity: 0.55; transform: translate(0,0) scale(1); }
    100% { opacity: 0;    transform: translate(-22px,-48px) scale(1.8); }
  }
  .smoke-puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: smoke 3.5s ease-out infinite;
  }
  .smoke-p2 { animation-delay: 1.1s; }
  .smoke-p3 { animation-delay: 2.2s; }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce) {
    #layer-stars, #layer-city-far, #layer-city-mid,
    #layer-poles, #layer-track,
    .wheel-spin, #fox-head-group, #fox-ear-l, #fox-ear-r,
    #fox-tail, #fox-scarf, #fox-arm, #fox-body,
    #panto-spark, .window-lamp, #headlight-beam, .smoke-puff {
      animation: none !important;
    }
  }

  /* title card */
  .title-card {
    position: absolute;
    left: 1.2rem;
    top: 1rem;
    color: #e8dcc0;
    letter-spacing: 0.18em;
    font-size: clamp(0.65rem, 1.4vw, 0.85rem);
    text-transform: uppercase;
    opacity: 0.72;
    pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }
  .title-card small {
    display: block;
    margin-top: 0.25rem;
    letter-spacing: 0.08em;
    text-transform: none;
    font-size: 0.72em;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="title-card">
    Night Tram · Route 07
    <small>fox conductor bound east</small>
  </div>

  <!--
    VIEWBOX 1200 × 700
    Parallax factor notes:
      stars    ≈ 0.10× track speed  (period 48s / 100px)
      city-far ≈ 0.25×              (period 36s / 100px)
      city-mid ≈ 0.50×              (period 18s / 200px)
      poles    ≈ 1.25×              (period 7s  / 400px)
      track    ≈ 1.00×              (period 9s  / 200px)
    Tram sits mid-frame facing RIGHT (+x). Wheels spin CW.
    Fox: head bob + ear twitch + tail sway + scarf flutter + arm reach
         (all relative to cab, not pure translation lock).
  -->
  <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"
       xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="A fox driving a night tram toward the right, with parallax city skyline">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#070b1c"/>
        <stop offset="38%"  stop-color="#121a36"/>
        <stop offset="72%"  stop-color="#2a3554"/>
        <stop offset="100%" stop-color="#4a4558"/>
      </linearGradient>
      <linearGradient id="cityFade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d1428" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#0d1428" stop-opacity="0.85"/>
      </linearGradient>
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#f5ecd0" stop-opacity="0.95"/>
        <stop offset="40%"  stop-color="#e8d8a8" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#e8d8a8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="windowWarm" cx="30%" cy="40%" r="70%">
        <stop offset="0%"   stop-color="#ffe090"/>
        <stop offset="55%"  stop-color="#f0b050"/>
        <stop offset="100%" stop-color="#c07030"/>
      </radialGradient>
      <linearGradient id="tramBodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#a83a32"/>
        <stop offset="45%"  stop-color="#8b2e2e"/>
        <stop offset="100%" stop-color="#5a1c1c"/>
      </linearGradient>
      <linearGradient id="creamBand" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#f2e6c4"/>
        <stop offset="100%" stop-color="#d4c49a"/>
      </linearGradient>
      <linearGradient id="foxFur" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"   stop-color="#e08a38"/>
        <stop offset="55%"  stop-color="#d4782a"/>
        <stop offset="100%" stop-color="#a85420"/>
      </linearGradient>
      <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#ffe8a0" stop-opacity="0.55"/>
        <stop offset="55%"  stop-color="#ffd060" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#ffd060" stop-opacity="0"/>
      </linearGradient>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- ========== SKY ========== -->

    <g id="layer-stars">

        <circle cx="350" cy="170" r="1.0"/><circle cx="480" cy="190" r="1.4"/>
        <circle cx="580" cy="210" r="0.9"/><circle cx="720" cy="175" r="1.2"/>

        <!-- second tile copy offset +1200 for seamless -->

        <circle cx="1400" cy="36"  r="1.4"/><circle cx="1480" cy="120" r="1.0"/>
        <circle cx="1560" cy="55"  r="0.8"/><circle cx="1640" cy="100" r="1.3"/>

        <circle cx="1880" cy="60"  r="1.5"/><circle cx="1960" cy="95"  r="0.9"/>
        <circle cx="2040" cy="40"  r="1.2"/><circle cx="2260" cy="70" r="1.0"/>
        <circle cx="2340" cy="130" r="1.3"/><circle cx="1230" cy="160" r="0.8"/>
        <circle cx="1350" cy="180" r="1.1"/><circle cx="1450" cy="200" r="0.7"/>
        <circle cx="1550" cy="170" r="1.0"/><circle cx="1680" cy="190" r="1.4"/>
        <circle cx="1780" cy="210" r="0.9"/><circle cx="1920" cy="175" r="1.2"/>
        <circle cx="2080" cy="200" r="0.8"/><circle cx="2220" cy="185" r="1.1"/>
      </g>
      <!-- keep moon static by placing a second moon outside the animated group? -->
      <!-- Moon is inside animated group so it will drift slowly — intentional parallax. -->
    </g>

    <!-- ========== LAYER 2: far city skyline ========== -->

        <rect x="0"   y="320" width="70"  height="160"/>
        <rect x="70"  y="280" width="50"  height="200"/>
        <rect x="120" y="300" width="90"  height="180"/>

        <rect x="1085" y="305" width="4" height="5"/>
      </g>
    </g>

    <!-- ========== LAYER 4: near poles / catenary infrastructure ========== -->
    <g id="layer-poles">
      <!-- overhead wire (fixed visual, poles scroll) -->
      <g stroke="#0e1018" stroke-width="2.5" fill="none" opacity="0.9">
        <!-- poles at x = 80, 480, 880, 1280 (tile 400) -->

      </g>

    <!-- ========== THE TRAM ========== -->
    <!--

      Wheels: rear cx=420, front cx=780, cy=530, r=28
    -->
    <g id="tram">
      <!-- pantograph (rear-center of roof) -->
      <g id="pantograph" stroke="#2a3040" stroke-width="3" fill="none">
        <line x1="560" y1="250" x2="500" y2="175"/>

      </g>
      <!-- spark at contact point -->
      <g id="panto-spark" filter="url(#tinyGlow)">
        <circle cx="560" cy="168" r="3" fill="#fff0a0"/>
        <circle cx="552" cy="162" r="1.5" fill="#ffe080"/>
        <circle cx="570" cy="160" r="1.2" fill="#ffe080"/>
      </g>

      <!-- roof -->
      <path d="M360 260 Q360 240 390 238 L780 238 Q820 240 830 260 L830 270 L360 270 Z"
            fill="#2a1a14"/>
      <rect x="370" y="255" width="440" height="10" fill="#3a2820"/>
      <!-- roof vent -->
      <rect x="500" y="232" width="50" height="12" rx="2" fill="#1a1210"/>
      <!-- chimney + smoke -->
      <rect x="400" y="220" width="16" height="22" fill="#1a1210"/>
      <g class="smoke-puff" opacity="0.5">
        <circle cx="408" cy="215" r="6" fill="#8a90a0"/>
      </g>
      <g class="smoke-puff smoke-p2" opacity="0.45">
        <circle cx="408" cy="215" r="5" fill="#8a90a0"/>
      </g>
      <g class="smoke-puff smoke-p3" opacity="0.4">
        <circle cx="408" cy="215" r="7" fill="#8a90a0"/>
      </g>

      <!-- main body -->
      <path d="M360 270 L360 470 Q360 490 380 490 L800 490 Q830 490 840 470 L840 270 Z"
            fill="url(#tramBodyGrad)"/>
      <!-- cream belt line -->
      <rect x="360" y="340" width="480" height="36" fill="url(#creamBand)"/>

            fill="url(#windowWarm)" opacity="0.9"/>

      <!-- headlight beam -->

            d="M890 370 L1100 320 L1100 440 L890 390 Z"
            fill="url(#beamGrad)"/>

      <!-- side windows (passenger) -->
      <g class="window-lamp">
        <rect x="390" y="285" width="55" height="45" rx="3" fill="url(#windowWarm)" opacity="0.92"/>
        <rect x="460" y="285" width="55" height="45" rx="3" fill="url(#windowWarm)" opacity="0.88"/>

        <rect x="600" y="285" width="55" height="45" rx="3" fill="url(#windowWarm)" opacity="0.85"/>
        <rect x="670" y="285" width="55" height="45" rx="3" fill="url(#windowWarm)" opacity="0.9"/>
        <rect x="740" y="285" width="55" height="45" rx="3" fill="url(#windowWarm)" opacity="0.87"/>
      </g>
      <!-- window mullions -->
      <g stroke="#3a1818" stroke-width="2">
        <line x1="390" y1="285" x2="390" y2="330"/>
        <line x1="445" y1="285" x2="445" y2="330"/>
        <line x1="460" y1="285" x2="460" y2="330"/>
        <line x1="515" y1="285" x2="515" y2="330"/>

        <line x1="795" y1="285" x2="795" y2="330"/>

        <rect x="600" y="285" width="55" height="45" rx="3"/>
        <rect x="670" y="285" width="55" height="45" rx="3"/>
        <rect x="740" y="285" width="55" height="45" rx="3"/>

      <!-- driver cab window (front-left of nose, larger) -->
      <rect x="790" y="280" width="48" height="55" rx="4" fill="url(#windowWarm)" opacity="0.95"/>

      <g>
        <circle cx="780" cy="530" r="30" fill="#1a1410"/>
        <circle cx="780" cy="530" r="26" fill="#2a2830"/>
        <g class="wheel-spin wheel-spin-front">
          <circle cx="780" cy="530" r="22" fill="none" stroke="#4a5060" stroke-width="3"/>

          <line x1="760" y1="530" x2="800" y2="530" stroke="#5a6478" stroke-width="2.5"/>
          <line x1="766" y1="516" x2="794" y2="544" stroke="#5a6478" stroke-width="2"/>

          <circle cx="780" cy="530" r="6" fill="#6a7488"/>
          <circle cx="780" cy="530" r="3" fill="#3a4050"/>

      <!-- ========== FOX DRIVER ========== -->
      <!--
        Fox sits in the front cab, visible through the cab window / open side.
        Position: roughly x 790-860, y 300-400, seated facing RIGHT (same as tram).
        Appendages animating relative to cab:
          1. head bob + ear twitch
          2. tail sway (behind body)
          3. scarf flutter
          4. arm reach toward controls
      -->
      <g id="fox" transform="translate(800, 300)">
        <!-- tail (behind body, sways) -->
        <g id="fox-tail" transform="translate(8, 55)">
          <path d="M0 0 Q-30 -20 -50 -50 Q-55 -60 -45 -62 Q-35 -55 -25 -30 Q-15 -10 0 8 Z"

          <path d="M-48 -55 Q-40 -40 -30 -20 Q-22 -8 -8 2 Q-5 4 -2 2 Q-18 -10 -28 -30 Q-38 -48 -48 -55 Z"

        </g>

            <path d="M10 34 Q20 48 18 68 Q22 70 26 66 Q26 48 18 34 Z" fill="#a84838"/>
          </g>

          <!-- arm reaching to controller -->
          <g id="fox-arm">
            <path d="M38 42 Q55 48 62 58" stroke="#d4782a" stroke-width="7"
                  stroke-linecap="round" fill="none"/>
            <!-- paw -->
            <circle cx="64" cy="60" r="5" fill="#8a4018"/>
          </g>

          <!-- head group: bob + ears -->
          <g id="fox-head-group" transform="translate(30, 18)">
            <!-- head shape -->
            <ellipse cx="12" cy="14" rx="16" ry="14" fill="url(#foxFur)"/>
            <!-- cheeks / snout -->
            <ellipse cx="24" cy="18" rx="10" ry="8" fill="#f0c090"/>
            <ellipse cx="30" cy="20" rx="5" ry="4" fill="#f5e6c8"/>
            <!-- nose -->
            <ellipse cx="33" cy="19" rx="3" ry="2.5" fill="#2a1810"/>
            <!-- eye -->
            <ellipse cx="18" cy="12" rx="3.2" ry="3.5" fill="#1a1010"/>
            <circle cx="19" cy="11" r="1.2" fill="#f0e0c0"/>
            <!-- smile line -->
            <path d="M28 22 Q31 24 34 22" stroke="#8a4018" stroke-width="1" fill="none"/>

            <!-- ear left (back) -->
            <g id="fox-ear-l">
              <path d="M2 6 L-4 -14 L12 2 Z" fill="#d4782a"/>
              <path d="M2 4 L-2 -8 L8 2 Z" fill="#f0c090"/>
            </g>
            <!-- ear right (front) -->
            <g id="fox-ear-r">
              <path d="M16 2 L22 -16 L28 4 Z" fill="#d4782a"/>
              <path d="M18 2 L22 -10 L26 4 Z" fill="#f0c090"/>
            </g>

            <!-- conductor cap -->
            <path d="M-2 4 Q12 -6 28 4 L28 8 Q12 2 -2 8 Z" fill="#1a2840"/>
            <ellipse cx="13" cy="5" rx="16" ry="4" fill="#0e1828"/>
            <rect x="6" y="-2" width="14" height="4" rx="1" fill="#c4a050"/>
            <!-- cap brim -->
            <path d="M20 6 Q36 8 38 12 Q30 10 20 8 Z" fill="#0e1828"/>
          </g>
        </g>
      </g>

      <!-- controller stick near fox arm -->
      <line x1="862" y1="360" x2="862" y2="390" stroke="#2a1810" stroke-width="4"/>
      <circle cx="862" cy="358" r="4" fill="#3a2820"/>

      <!-- bell -->
      <ellipse cx="520" cy="248" rx="10" ry="8" fill="#c4a050" opacity="0.85"/>
      <rect x="517" y="240" width="6" height="8" fill="#8a7040"/>
    </g>

    <!-- ========== FOREGROUND vignette ========== -->

    <rect x="0" y="600" width="1200" height="100" fill="#05060c" opacity="0.45"/>
