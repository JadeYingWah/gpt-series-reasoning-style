<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #eaeaea;
      --accent: #e94560;
      --muted: #888;
      --ok: #0f3460;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      width: min(92vw, 360px);
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      text-transform: uppercase;
    }
    #display {
      font-variant-numeric: tabular-nums;
      font-size: 3.5rem;
      font-weight: 300;
      letter-spacing: .06em;
      line-height: 1;
      margin-bottom: .5rem;
    }
    #status {
      font-size: .95rem;
      color: var(--muted);
      min-height: 1.4em;
      margin-bottom: 1.5rem;
    }
    #status.done { color: var(--accent); font-weight: 600; }
    .controls {
      display: flex;
      gap: .6rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    button {
      font: inherit;
      font-size: .9rem;
      padding: .55rem 1.1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--ok);
      color: var(--text);
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button.primary { background: var(--accent); }
    .config {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      font-size: .85rem;
      color: var(--muted);
    }
    .config label { cursor: pointer; }
    #minutes {
      width: 3.2rem;
      font: inherit;
      font-size: .9rem;
      text-align: center;
      padding: .3rem .2rem;
      border: 1px solid var(--muted);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
    }
    #minutes:disabled { opacity: .35; }
    .hint {
      margin-top: 1rem;
      font-size: .72rem;
      color: var(--muted);
      opacity: .7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>番茄钟</h1>
    <div id="display" aria-live="polite">25:00</div>
    <div id="status" role="status">就绪</div>
    <div class="controls">
      <button id="btnStart" class="primary" type="button">开始</button>
      <button id="btnPause" type="button" disabled>暂停</button>
      <button id="btnReset" type="button">重置</button>
    </div>
    <div class="config">
      <label for="minutes">时长（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" value="25" />
      <button id="btnApply" type="button">应用</button>
    </div>
    <p class="hint">无外链 / 无框架 · 音效：Web Audio 短提示音</p>
  </div>

  <script>
    (function () {
      'use strict';

      var DEFAULT_MINUTES = 25;
      var MIN_MINUTES = 1;
      var MAX_MINUTES = 60;

      var state = {
        totalMs: DEFAULT_MINUTES * 60 * 1000,
        remainingMs: DEFAULT_MINUTES * 60 * 1000,
        running: false,
        finished: false,
        timerId: null,
        endAt: 0
      };

      var elDisplay = document.getElementById('display');
      var elStatus = document.getElementById('status');
      var elMinutes = document.getElementById('minutes');
      var btnStart = document.getElementById('btnStart');
      var btnPause = document.getElementById('btnPause');
      var btnReset = document.getElementById('btnReset');
      var btnApply = document.getElementById('btnApply');

      function pad(n) {
        return (n < 10 ? '0' : '') + n;
      }

      function formatMs(ms) {
        if (ms < 0) ms = 0;
        var totalSec = Math.ceil(ms / 1000);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return pad(m) + ':' + pad(s);
      }

      function setStatus(text, done) {
        elStatus.textContent = text;
        if (done) elStatus.classList.add('done');
        else elStatus.classList.remove('done');
      }

      function render() {
        elDisplay.textContent = formatMs(state.remainingMs);
        btnStart.disabled = state.running || state.finished;
        btnPause.disabled = !state.running;
        elMinutes.disabled = state.running;
        btnApply.disabled = state.running;
      }

      function beep() {
        try {
          var ctx = new (window.AudioContext || window.webkitAudioContext)();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
          osc.stop(ctx.currentTime + 0.6);
          osc.onended = function () {
            try { ctx.close(); } catch (e) { /* ignore */ }
          };
        } catch (e) {
          /* 静音环境或不支持 Web Audio 时静默失败 */
        }
      }

      function tick() {
        var now = Date.now();
        state.remainingMs = state.endAt - now;
        if (state.remainingMs <= 0) {
          state.remainingMs = 0;
          state.running = false;
          state.finished = true;
          clearInterval(state.timerId);
          state.timerId = null;
          setStatus('时间到', true);
          render();
          beep();
          return;
        }
        elDisplay.textContent = formatMs(state.remainingMs);
      }

      function start() {
        if (state.running || state.finished) return;
        state.running = true;
        state.endAt = Date.now() + state.remainingMs;
        setStatus('进行中', false);
        state.timerId = setInterval(tick, 200);
        render();
      }

      function pause() {
        if (!state.running) return;
        clearInterval(state.timerId);
        state.timerId = null;
        state.remainingMs = state.endAt - Date.now();
        if (state.remainingMs < 0) state.remainingMs = 0;
        state.running = false;
        setStatus('已暂停', false);
        render();
      }

      function reset() {
        clearInterval(state.timerId);
        state.timerId = null;
        state.running = false;
        state.finished = false;
        state.remainingMs = state.totalMs;
        state.endAt = 0;
        setStatus('就绪', false);
        render();
      }

      function applyDuration() {
        var raw = elMinutes.value.trim();
        var n = parseInt(raw, 10);
        if (!/^\d+$/.test(raw) || n < MIN_MINUTES || n > MAX_MINUTES) {
          setStatus('请输入 ' + MIN_MINUTES + '–' + MAX_MINUTES + ' 的正整数', false);
          elMinutes.value = String(Math.round(state.totalMs / 60000));
          return;
        }
        state.totalMs = n * 60 * 1000;
        reset();
        setStatus('已设为 ' + n + ' 分钟', false);
      }

      btnStart.addEventListener('click', start);
      btnPause.addEventListener('click', pause);
      btnReset.addEventListener('click', reset);
      btnApply.addEventListener('click', applyDuration);
      elMinutes.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') applyDuration();
      });

      render();
    })();
  </script>
</body>
</html>
