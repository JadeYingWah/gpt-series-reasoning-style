<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极简番茄钟</title>
<style>
  :root {
    --bg: #f4f1ea;
    --fg: #1a1a1a;
    --muted: #666;
    --card: #fff;
    --accent: #c45c26;
    --accent-hover: #a34a1c;
    --ok: #2d6a4f;
    --done: #9b2226;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  .card {
    background: var(--card);
    padding: 2.5rem 2rem;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
    width: min(420px, 92vw);
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: .12em;
    margin-bottom: 1.5rem;
    color: var(--muted);
    text-transform: uppercase;
  }
  #display {
    font-size: 4.5rem;
    font-variant-numeric: tabular-nums;
    font-weight: 300;
    letter-spacing: .04em;
    line-height: 1;
    margin-bottom: .75rem;
    font-family: "SF Mono", Consolas, monospace;
  }
  #status {
    font-size: .95rem;
    min-height: 1.4em;
    margin-bottom: 1.75rem;
    color: var(--muted);
  }
  #status.running { color: var(--ok); }
  #status.paused  { color: var(--accent); }
  #status.done    { color: var(--done); font-weight: 600; }
  .controls {
    display: flex;
    gap: .6rem;
    justify-content: center;
    margin-bottom: 1.75rem;
  }
  button {
    font: inherit;
    font-size: .95rem;
    padding: .55rem 1.2rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #e8e4db;
    color: var(--fg);
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: #d9d3c6; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: #fff;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .config {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    font-size: .9rem;
    color: var(--muted);
  }
  .config label { cursor: pointer; }
  #minutes {
    width: 4.5rem;
    font: inherit;
    font-size: .95rem;
    padding: .35rem .5rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    text-align: center;
    background: #fafafa;
  }
  .hint {
    margin-top: 1.25rem;
    font-size: .75rem;
    color: #999;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="card">
  <h1>Pomodoro</h1>
  <div id="display" aria-live="polite">25:00</div>
  <div id="status" role="status">就绪</div>

  <div class="controls">
    <button id="btnStart" class="primary" type="button">开始</button>
    <button id="btnPause" type="button" disabled>暂停</button>
    <button id="btnReset" type="button">重置</button>
  </div>

  <div class="config">
    <label for="minutes">时长（分钟）</label>
    <input id="minutes" type="number" min="1" max="60" step="1" value="25">
    <span>1–60</span>
  </div>

  <p class="hint">
    结束时状态变为「时间到」，并尝试播放短提示音（需用户曾与页面交互）。<br>
    若浏览器拒绝音频，仅以文案提示。
  </p>
</main>

<script>
"use strict";

/** Pure timer core — no DOM. Testable via Node. */
function createTimer(totalSeconds, onTick, onComplete) {
  if (!Number.isInteger(totalSeconds) || totalSeconds < 1) {
    throw new Error("totalSeconds must be a positive integer");
  }
  let remaining = totalSeconds;
  let intervalId = null;
  let running = false;

  function emit() {
    if (onTick) onTick(remaining, running);
  }

  return {
    get remaining() { return remaining; },
    get running() { return running; },

    start() {
      if (running) return false;
      if (remaining <= 0) return false;
      running = true;
      intervalId = setInterval(function () {
        remaining -= 1;
        if (remaining <= 0) {
          remaining = 0;
          running = false;
          clearInterval(intervalId);
          intervalId = null;
          emit();
          if (onComplete) onComplete();
        } else {
          emit();
        }
      }, 1000);
      emit();
      return true;
    },

    pause() {
      if (!running) return false;
      running = false;
      clearInterval(intervalId);
      intervalId = null;
      emit();
      return true;
    },

    reset(newTotal) {
      if (newTotal !== undefined) {
        if (!Number.isInteger(newTotal) || newTotal < 1) {
          throw new Error("newTotal must be a positive integer");
        }
        totalSeconds = newTotal;
      }
      running = false;
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      remaining = totalSeconds;
      emit();
      return true;
    },

    destroy() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      running = false;
    }
  };
}

function formatTime(seconds) {
  if (!Number.isInteger(seconds) || seconds < 0) {
    throw new Error("seconds must be a non-negative integer");
  }
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/** Parse user minutes input: integer 1–60 only. Returns null if invalid. */
function parseMinutes(raw) {
  const n = Number(String(raw).trim());
  if (!Number.isInteger(n)) return null;
  if (n < 1 || n > 60) return null;
  return n;
}

/* ---------- DOM wiring (browser only) ---------- */
if (typeof document !== "undefined") {
  const elDisplay = document.getElementById("display");
  const elStatus  = document.getElementById("status");
  const elStart   = document.getElementById("btnStart");
  const elPause   = document.getElementById("btnPause");
  const elReset   = document.getElementById("btnReset");
  const elMinutes = document.getElementById("minutes");

  let audioCtx = null;

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      return audioCtx;
    } catch (e) {
      return null;
    }
  }

  function beep() {
    const ctx = ensureAudio();
    if (!ctx) return false;
    try {
      if (ctx.state === "suspended") ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.value = 0.0001;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.5);
      return true;
    } catch (e) {
      return false;
    }
  }

  function setStatus(text, cls) {
    elStatus.textContent = text;
    elStatus.className = cls || "";
  }

  function setButtons(state) {
    // state: idle | running | paused | done
    if (state === "running") {
      elStart.disabled = true;
      elPause.disabled = false;
      elMinutes.disabled = true;
    } else if (state === "paused") {
      elStart.disabled = false;
      elStart.textContent = "继续";
      elPause.disabled = true;
      elMinutes.disabled = true;
    } else if (state === "done") {
      elStart.disabled = true;
      elStart.textContent = "开始";
      elPause.disabled = true;
      elMinutes.disabled = false;
    } else {
      elStart.disabled = false;
      elStart.textContent = "开始";
      elPause.disabled = true;
      elMinutes.disabled = false;
    }
  }

  const timer = createTimer(
    25 * 60,
    function (remaining, running) {
      elDisplay.textContent = formatTime(remaining);
      if (remaining === 0) {
        setStatus("时间到", "done");
      } else if (running) {
        setStatus("进行中", "running");
      }
    },
    function () {
      setStatus("时间到", "done");
      setButtons("done");
      beep();
    }
  );

  elDisplay.textContent = formatTime(25 * 60);
  setButtons("idle");

  elStart.addEventListener("click", function () {
    ensureAudio(); // unlock audio on user gesture
    if (timer.start()) setButtons("running");
  });

  elPause.addEventListener("click", function () {
    if (timer.pause()) {
      setStatus("已暂停", "paused");
      setButtons("paused");
    }
  });

  elReset.addEventListener("click", function () {
    const mins = parseMinutes(elMinutes.value);
    const total = (mins !== null ? mins : 25) * 60;
    if (mins === null) elMinutes.value = "25";
    timer.reset(total);
    elDisplay.textContent = formatTime(total);
    setStatus("就绪", "");
    setButtons("idle");
  });

  elMinutes.addEventListener("change", function () {
    const mins = parseMinutes(elMinutes.value);
    if (mins === null) {
      elMinutes.value = "25";
      if (!timer.running && timer.remaining === parseMinutes("25") * 60) {
        /* already 25 */
      } else if (!timer.running) {
        /* leave timer as-is until reset */
      }
    } else if (!timer.running && !elStart.disabled) {
      // idle or done: apply immediately
      const total = mins * 60;
      timer.reset(total);
      elDisplay.textContent = formatTime(total);
      setStatus("就绪", "");
      setButtons("idle");
    }
    // while running/paused: apply only on next 重置
  });
}

/* ---------- Node export for source/logic verification ---------- */
if (typeof module !== "undefined" && module.exports) {
  module.exports = { createTimer, formatTime, parseMinutes };
}
</script>
</body>
</html>
