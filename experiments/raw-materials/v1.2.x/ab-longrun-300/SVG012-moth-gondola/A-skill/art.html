<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moth × Gondola · Night Canal</title>
<style>
  /* ── Scene shell ─────────────────────────────────────────── */
  :root {
    --ink: #0b1026;
    --deep: #121a3a;
    --mid: #1c2752;
    --moon: #f4e7c3;
    --gold: #d4a84b;
    --brass: #b8863a;
    --hull: #1a1210;
    --hull-hi: #3d2a1c;
    --moth-body: #c9b896;
    --moth-fuzz: #e8dcc0;
    --wing-a: #9bc48a;
    --wing-b: #6fa86a;
    --wing-c: #c8e6b8;
    --water: #0a1630;
    --water-hi: #1e3a6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #070b1c 0%, #121a3a 42%, #1a2450 68%, #0a1630 100%);
  }

  /* ── Parallax layers (3+) ────────────────────────────────── */
  .layer {
    position: absolute; inset: 0;
    pointer-events: none;
    will-change: transform;
  }
  .layer-stars  { z-index: 1; animation: drift-far 120s linear infinite; }
  .layer-moon   { z-index: 2; animation: drift-mid 80s linear infinite; }
  .layer-shore  { z-index: 3; animation: drift-near 48s linear infinite; }
  .layer-mist   { z-index: 4; animation: drift-mist 36s linear infinite; opacity: .55; }

  @keyframes drift-far  { from { transform: translateX(0); } to { transform: translateX(-6%); } }
  @keyframes drift-mid  { from { transform: translateX(0); } to { transform: translateX(-10%); } }
  @keyframes drift-near { from { transform: translateX(0); } to { transform: translateX(-16%); } }
  @keyframes drift-mist { from { transform: translateX(0); } to { transform: translateX(-22%); } }

  /* Stars drawn as box-shadows for density without DOM spam */
  .starfield {
    position: absolute; top: 8%; left: 5%;
    width: 2px; height: 2px; border-radius: 50%;
    background: transparent;
    box-shadow:
      40px 20px 0 0 #fff8, 120px 80px 0 0 #ffe9a8, 200px 30px 0 0 #fff,
      280px 100px 0 0 #cde, 360px 10px 0 0 #fff8, 420px 70px 0 0 #ffd,
      500px 40px 0 0 #fff, 580px 110px 0 0 #eef, 640px 25px 0 0 #ffe9a8aa,
      720px 90px 0 0 #fff, 800px 15px 0 0 #cde, 880px 60px 0 0 #fff8,
      960px 100px 0 0 #ffd, 1040px 35px 0 0 #fff, 1120px 85px 0 0 #eef,
      1200px 50px 0 0 #ffe9a8, 1280px 15px 0 0 #fff8, 1360px 95px 0 0 #cde,
      1440px 40px 0 0 #fff, 1520px 70px 0 0 #ffd, 80px 140px 0 0 #fff,
      160px 180px 0 0 #ffe9a8aa, 240px 160px 0 0 #cde, 320px 200px 0 0 #fff8,
      400px 150px 0 0 #fff, 480px 190px 0 0 #ffd, 560px 170px 0 0 #eef,
      640px 210px 0 0 #fff, 720px 155px 0 0 #ffe9a8, 800px 185px 0 0 #fff8,
      880px 165px 0 0 #cde, 960px 205px 0 0 #fff, 1040px 145px 0 0 #ffd,
      1120px 175px 0 0 #eef, 1200px 195px 0 0 #fff, 1280px 150px 0 0 #ffe9a8aa,
      1360px 180px 0 0 #cde, 1440px 160px 0 0 #fff8, 1520px 200px 0 0 #fff,
      200px 50px 0 0 #fff, 600px 5px 0 0 #ffd, 900px 90px 0 0 #eef,
      1300px 70px 0 0 #fff, 70px 220px 0 0 #cde, 500px 230px 0 0 #fff8,
      1000px 220px 0 0 #ffe9a8, 1400px 230px 0 0 #fff;
    animation: twinkle 4.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }

  .moon {
    position: absolute; top: 10%; right: 14%;
    width: min(14vw, 120px); height: min(14vw, 120px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8e0 0%, var(--moon) 45%, #c9b07a 100%);
    box-shadow: 0 0 60px 18px rgba(244, 231, 195, .35), 0 0 120px 40px rgba(244, 231, 195, .12);
  }
  .moon::after {
    content: ""; position: absolute; inset: 18% 22% auto auto;
    width: 18%; height: 18%; border-radius: 50%;
    background: rgba(160, 140, 90, .25);
  }

  .cloud {
    position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 60%, rgba(90, 110, 170, .45), rgba(40, 55, 110, .1) 70%, transparent);
  }
  .cloud.c1 { width: 280px; height: 70px; top: 18%; left: 8%; }
  .cloud.c2 { width: 360px; height: 90px; top: 28%; left: 48%; opacity: .7; }
  .cloud.c3 { width: 220px; height: 60px; top: 14%; left: 72%; opacity: .55; }
  .cloud.c4 { width: 300px; height: 80px; top: 36%; left: 22%; opacity: .4; }

  .shore {
    position: absolute; bottom: 28%; left: 0; width: 200%; height: 22%;
    background:
      radial-gradient(ellipse 12% 80% at 8% 100%, #0d1428 0%, transparent 70%),
      radial-gradient(ellipse 10% 90% at 22% 100%, #101830 0%, transparent 70%),
      radial-gradient(ellipse 14% 70% at 38% 100%, #0c1224 0%, transparent 70%),
      radial-gradient(ellipse 11% 85% at 55% 100%, #0e1630 0%, transparent 70%),
      radial-gradient(ellipse 13% 75% at 72% 100%, #0b1226 0%, transparent 70%),
      radial-gradient(ellipse 10% 90% at 88% 100%, #10182e 0%, transparent 70%),
      radial-gradient(ellipse 12% 80% at 104% 100%, #0d1428 0%, transparent 70%),
      radial-gradient(ellipse 10% 90% at 118% 100%, #101830 0%, transparent 70%),
      radial-gradient(ellipse 14% 70% at 134% 100%, #0c1224 0%, transparent 70%),
      radial-gradient(ellipse 11% 85% at 150% 100%, #0e1630 0%, transparent 70%);
    opacity: .9;
  }
  .lamp {
    position: absolute; bottom: 30%;
    width: 6px; height: 6px; border-radius: 50%;
    background: #ffd27a;
    box-shadow: 0 0 12px 4px rgba(255, 210, 122, .55), 0 0 28px 10px rgba(255, 180, 80, .2);
  }

  .mist-band {
    position: absolute; left: -10%; width: 120%; height: 18%;
    bottom: 32%;
    background: linear-gradient(90deg, transparent, rgba(140, 160, 210, .12), transparent 60%, rgba(160, 170, 220, .1), transparent);
    filter: blur(8px);
  }

  /* ── Water surface ───────────────────────────────────────── */
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
    z-index: 5;
    background: linear-gradient(180deg, #122048 0%, var(--water) 40%, #060c1c 100%);
    overflow: hidden;
  }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0 40px,
      rgba(100, 140, 220, .08) 40px 42px,
      transparent 42px 90px,
      rgba(180, 200, 255, .05) 90px 92px
    );
    animation: water-scroll 14s linear infinite;
  }
  @keyframes water-scroll { from { transform: translateX(0); } to { transform: translateX(-180px); } }

  .ripple {
    position: absolute; height: 2px; border-radius: 50%;
    background: linear-gradient(90deg, transparent, rgba(180, 210, 255, .35), transparent);
    animation: ripple-slide 6s linear infinite;
  }
  @keyframes ripple-slide {
    from { transform: translateX(20vw) scaleX(.6); opacity: 0; }
    15%  { opacity: .8; }
    85%  { opacity: .5; }
    to   { transform: translateX(-30vw) scaleX(1.4); opacity: 0; }
  }

  /* ── Vehicle (SVG stage) ─────────────────────────────────── */
  .vehicle-wrap {
    position: absolute;
    z-index: 10;
    left: 0; top: 42%;
    width: min(56vw, 640px);
    animation: sail-right 18s linear infinite;
    filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .45));
  }
  @keyframes sail-right {
    from { transform: translateX(-15vw); }
    to   { transform: translateX(105vw); }
  }
  .vehicle-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* Hull bob (independent of moth parts) */
  .hull-group { animation: hull-bob 3.2s ease-in-out infinite; transform-origin: 50% 70%; }
  @keyframes hull-bob {
    0%, 100% { transform: translateY(0) rotate(-0.6deg); }
    50%      { transform: translateY(-4px) rotate(0.8deg); }
  }

  /* Paddle wheel — clockwise when facing right → stern thrust */
  .paddle-wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheel-spin 1.4s linear infinite;
  }
  @keyframes wheel-spin { to { transform: rotate(360deg); } }

  /* Moth wing flap — NOT locked to hull */
  .wing-l, .wing-r {
    transform-box: fill-box;
  }
  .wing-l { transform-origin: 100% 20%; animation: flap-l 0.9s ease-in-out infinite; }
  .wing-r { transform-origin: 0% 20%;  animation: flap-r 0.9s ease-in-out infinite; }
  @keyframes flap-l {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(-14deg) scaleY(0.88); }
  }
  @keyframes flap-r {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    50%      { transform: rotate(14deg) scaleY(0.88); }
  }

  /* Antennae sway — relative motion #2 */
  .antenna {
    transform-box: fill-box;
    transform-origin: 0% 100%;
  }
  .antenna.a-l { animation: ant-l 1.7s ease-in-out infinite; }
  .antenna.a-r { animation: ant-r 1.55s ease-in-out infinite; }
  @keyframes ant-l {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(8deg); }
  }
  @keyframes ant-r {
    0%, 100% { transform: rotate(5deg); }
    50%      { transform: rotate(-7deg); }
  }

  /* Steering arm + oar — relative motion #3 */
  .steer-arm {
    transform-box: fill-box;
    transform-origin: 15% 20%;
    animation: steer 2.4s ease-in-out infinite;
  }
  @keyframes steer {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(7deg); }
  }

  /* Legs grip slight counter-bob vs hull */
  .legs {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg-bob 3.2s ease-in-out infinite reverse;
  }
  @keyframes leg-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(2px); }
  }

  /* Lantern glow pulse */
  .lantern-glow { animation: glow-pulse 2.8s ease-in-out infinite; }
  @keyframes glow-pulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  /* Near foreground particles (depth layer) */
  .particles { z-index: 20; }
  .spark {
    position: absolute;
    width: 4px; height: 4px; border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 8px 2px rgba(255, 230, 160, .6);
    animation: spark-float linear infinite;
    opacity: 0;
  }
  @keyframes spark-float {
    0%   { transform: translate(0, 0) scale(.6); opacity: 0; }
    15%  { opacity: .85; }
    85%  { opacity: .4; }
    100% { transform: translate(-40vw, -12vh) scale(1.1); opacity: 0; }
  }

  /* Title plaque */
  .plaque {
    position: absolute; z-index: 30;
    left: 50%; bottom: 4%;
    transform: translateX(-50%);
    color: rgba(244, 231, 195, .72);
    letter-spacing: .28em;
    font-size: clamp(10px, 1.4vw, 14px);
    text-transform: uppercase;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(0,0,0,.8);
  }
  .plaque small {
    display: block; margin-top: .35em;
    letter-spacing: .12em;
    font-size: .75em;
    opacity: .65;
    text-transform: none;
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Parallax L1: stars -->
  <div class="layer layer-stars" aria-hidden="true">
    <div class="starfield"></div>
  </div>

  <!-- Parallax L2: moon + mid clouds -->
  <div class="layer layer-moon" aria-hidden="true">
    <div class="moon"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <!-- Parallax L3: distant shore + lamps -->
  <div class="layer layer-shore" aria-hidden="true">
    <div class="shore"></div>
    <div class="lamp" style="left:12%"></div>
    <div class="lamp" style="left:27%; bottom:31%"></div>
    <div class="lamp" style="left:44%"></div>
    <div class="lamp" style="left:61%; bottom:30.5%"></div>
    <div class="lamp" style="left:78%"></div>
    <div class="lamp" style="left:91%; bottom:31%"></div>
  </div>

  <!-- Parallax L4: mist -->
  <div class="layer layer-mist" aria-hidden="true">
    <div class="cloud c4"></div>
    <div class="mist-band"></div>
  </div>

  <!-- Water -->
  <div class="water" aria-hidden="true">
    <div class="ripple" style="top:18%; width:120px; animation-delay:0s"></div>
    <div class="ripple" style="top:34%; width:180px; animation-delay:1.4s"></div>
    <div class="ripple" style="top:52%; width:90px;  animation-delay:2.8s"></div>
    <div class="ripple" style="top:68%; width:150px; animation-delay:0.7s"></div>
    <div class="ripple" style="top:40%; width:200px; animation-delay:3.5s"></div>
  </div>

  <!-- Foreground particles (depth cue in front of vehicle) -->
  <div class="layer particles" aria-hidden="true">
    <div class="spark" style="left:90%; top:55%; animation-duration:11s; animation-delay:0s"></div>
    <div class="spark" style="left:85%; top:48%; animation-duration:13s; animation-delay:2s"></div>
    <div class="spark" style="left:95%; top:62%; animation-duration:10s; animation-delay:4s"></div>
    <div class="spark" style="left:88%; top:40%; animation-duration:12s; animation-delay:6s"></div>
    <div class="spark" style="left:92%; top:70%; animation-duration:14s; animation-delay:1s"></div>
    <div class="spark" style="left:80%; top:58%; animation-duration:11.5s; animation-delay:3.2s"></div>
  </div>

  <!-- ── Main subject: moth piloting gondola, facing RIGHT ── -->
  <div class="vehicle-wrap" role="img" aria-label="一只飞蛾驾驶着贡多拉，沿运河向右航行">
    <svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3d2a1c"/>
          <stop offset="45%" stop-color="#1a1210"/>
          <stop offset="100%" stop-color="#0a0706"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f0d078"/>
          <stop offset="50%" stop-color="#d4a84b"/>
          <stop offset="100%" stop-color="#8a6420"/>
        </linearGradient>
        <linearGradient id="wingGradL" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d4eec4"/>
          <stop offset="40%" stop-color="#9bc48a"/>
          <stop offset="100%" stop-color="#5a8f58"/>
        </linearGradient>
        <linearGradient id="wingGradR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d4eec4"/>
          <stop offset="40%" stop-color="#9bc48a"/>
          <stop offset="100%" stop-color="#5a8f58"/>
        </linearGradient>
        <radialGradient id="eyeGrad" cx="40%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#5a3a20"/>
          <stop offset="100%" stop-color="#1a0e08"/>
        </radialGradient>
        <radialGradient id="lanternGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff2c0"/>
          <stop offset="60%" stop-color="#ffc85a"/>
          <stop offset="100%" stop-color="#c07020" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- ══ GONDOLA HULL GROUP (bobs) ══ -->
      <g class="hull-group">

        <!-- Wake foam under hull -->
        <ellipse cx="280" cy="232" rx="200" ry="10" fill="#6a90c8" opacity=".15"/>
        <ellipse cx="340" cy="236" rx="140" ry="6" fill="#8ab0e0" opacity=".1"/>

        <!-- Hull body — classic gondola silhouette, bow RIGHT -->
        <path d="M 80 175
                 C 90 195, 110 210, 160 218
                 L 420 222
                 C 480 220, 520 205, 545 185
                 C 560 172, 575 168, 600 175
                 C 575 195, 540 215, 480 228
                 L 160 230
                 C 100 226, 70 205, 60 185
                 C 65 178, 72 175, 80 175 Z"
              fill="url(#hullGrad)" stroke="#0a0706" stroke-width="1.5"/>

        <!-- Hull rim / gunwale gold line -->
        <path d="M 85 178 C 100 168, 140 162, 220 160
                 L 430 162
                 C 500 165, 545 175, 595 172"
              fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

        <!-- Decorative side scrollwork -->
        <path d="M 200 185 Q 230 175 260 185 T 320 185 T 380 185 T 440 185"
              fill="none" stroke="#d4a84b" stroke-width="1.2" opacity=".55"/>
        <path d="M 210 195 Q 240 188 270 195 T 330 195 T 390 195 T 450 195"
              fill="none" stroke="#8a6420" stroke-width="1" opacity=".4"/>

        <!-- Seat / cushion -->
        <ellipse cx="300" cy="168" rx="55" ry="14" fill="#4a2030" stroke="#2a1018" stroke-width="1"/>
        <ellipse cx="300" cy="166" rx="48" ry="10" fill="#6a3048" opacity=".8"/>

        <!-- Stern rise (left) -->
        <path d="M 70 178 C 55 160, 50 140, 58 120
                 C 62 140, 70 155, 85 170"
              fill="url(#hullGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

        <!-- Ferro — prow ornament (right bow) -->
        <g class="ferro">
          <path d="M 595 172 L 620 155 L 615 168 L 635 160 L 610 180 L 625 185 L 600 188"
                fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>
          <circle cx="618" cy="158" r="2.5" fill="#f0d078"/>
        </g>

        <!-- Stern lantern -->
        <g transform="translate(95, 145)">
          <line x1="0" y1="0" x2="0" y2="-22" stroke="#8a6420" stroke-width="2"/>
          <ellipse class="lantern-glow" cx="0" cy="-28" rx="14" ry="14" fill="url(#lanternGrad)"/>
          <rect x="-5" y="-34" width="10" height="12" rx="2" fill="#c07020" stroke="#f0d078" stroke-width="1"/>
          <circle cx="0" cy="-28" r="3" fill="#fff2c0"/>
        </g>

        <!-- ══ PADDLE WHEEL (stern-mid, left of center) ══ -->
        <g transform="translate(155, 200)">
          <!-- wheel housing hint -->
          <rect x="-28" y="-8" width="8" height="28" rx="2" fill="#2a1a10" opacity=".5"/>
          <g class="paddle-wheel">
            <!-- rim -->
            <circle cx="0" cy="0" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
            <circle cx="0" cy="0" r="22" fill="none" stroke="#8a6420" stroke-width="1.5" opacity=".7"/>
            <!-- spokes -->
            <line x1="0" y1="0" x2="0" y2="-24" stroke="#b8863a" stroke-width="2"/>
            <line x1="0" y1="0" x2="0" y2="24"  stroke="#b8863a" stroke-width="2"/>
            <line x1="0" y1="0" x2="24" y2="0"  stroke="#b8863a" stroke-width="2"/>
            <line x1="0" y1="0" x2="-24" y2="0" stroke="#b8863a" stroke-width="2"/>
            <line x1="0" y1="0" x2="17" y2="-17" stroke="#b8863a" stroke-width="1.5"/>
            <line x1="0" y1="0" x2="-17" y2="17" stroke="#b8863a" stroke-width="1.5"/>
            <line x1="0" y1="0" x2="17" y2="17"  stroke="#b8863a" stroke-width="1.5"/>
            <line x1="0" y1="0" x2="-17" y2="-17" stroke="#b8863a" stroke-width="1.5"/>
            <!-- paddles (buckets) at rim — rotation drives water aft -->
            <rect x="-3" y="-32" width="6" height="10" rx="1" fill="#3d2a1c" stroke="#d4a84b" stroke-width=".8"/>
            <rect x="-3" y="22"  width="6" height="10" rx="1" fill="#3d2a1c" stroke="#d4a84b" stroke-width=".8"/>
            <rect x="22" y="-3"  width="10" height="6" rx="1" fill="#3d2a1c" stroke="#d4a84b" stroke-width=".8"/>
            <rect x="-32" y="-3" width="10" height="6" rx="1" fill="#3d2a1c" stroke="#d4a84b" stroke-width=".8"/>
            <!-- hub -->
            <circle cx="0" cy="0" r="5" fill="url(#goldGrad)"/>
            <circle cx="0" cy="0" r="2" fill="#1a1210"/>
          </g>
          <!-- splash arcs under wheel (static hint of thrust) -->
          <path d="M -20 30 Q -10 36 0 32 Q 12 38 22 30" fill="none" stroke="#8ab0e0" stroke-width="1.5" opacity=".45"/>
        </g>

        <!-- ══ MOTH PILOT ══ -->
        <g class="moth-pilot" transform="translate(295, 95)">

          <!-- WINGS (behind body) — independent flap -->
          <!-- Left wing (viewer's left / moth's right) -->
          <g class="wing-l">
            <path d="M 0 20
                     C -30 5, -70 -5, -95 15
                     C -110 28, -105 55, -80 70
                     C -60 80, -35 75, -15 55
                     C -5 45, 0 32, 0 20 Z"
                  fill="url(#wingGradL)" stroke="#3d6b3a" stroke-width="1.2" opacity=".92"/>
            <!-- hindwing with tail -->
            <path d="M -5 35
                     C -25 45, -45 60, -50 85
                     C -52 100, -40 115, -28 108
                     C -18 100, -12 75, -8 50 Z"
                  fill="url(#wingGradL)" stroke="#3d6b3a" stroke-width="1" opacity=".85"/>
            <!-- eyespot -->
            <ellipse cx="-55" cy="35" rx="12" ry="8" fill="#c8e6b8" stroke="#4a7a48" stroke-width="1"/>
            <ellipse cx="-55" cy="35" rx="6" ry="4" fill="#5a3a20"/>
            <ellipse cx="-54" cy="34" rx="2" ry="1.5" fill="#f0e0c0" opacity=".7"/>
            <!-- wing veins -->
            <path d="M -5 22 L -70 20 M -5 28 L -75 40 M -5 34 L -60 55"
                  fill="none" stroke="#4a7a48" stroke-width=".7" opacity=".5"/>
          </g>

          <!-- Right wing (viewer's right / moth's left) -->
          <g class="wing-r">
            <path d="M 0 20
                     C 30 5, 70 -5, 95 15
                     C 110 28, 105 55, 80 70
                     C 60 80, 35 75, 15 55
                     C 5 45, 0 32, 0 20 Z"
                  fill="url(#wingGradR)" stroke="#3d6b3a" stroke-width="1.2" opacity=".92"/>
            <path d="M 5 35
                     C 25 45, 45 60, 50 85
                     C 52 100, 40 115, 28 108
                     C 18 100, 12 75, 8 50 Z"
                  fill="url(#wingGradR)" stroke="#3d6b3a" stroke-width="1" opacity=".85"/>
            <ellipse cx="55" cy="35" rx="12" ry="8" fill="#c8e6b8" stroke="#4a7a48" stroke-width="1"/>
            <ellipse cx="55" cy="35" rx="6" ry="4" fill="#5a3a20"/>
            <ellipse cx="54" cy="34" rx="2" ry="1.5" fill="#f0e0c0" opacity=".7"/>
            <path d="M 5 22 L 70 20 M 5 28 L 75 40 M 5 34 L 60 55"
                  fill="none" stroke="#4a7a48" stroke-width=".7" opacity=".5"/>
          </g>

          <!-- Legs gripping gunwale -->
          <g class="legs">
            <!-- far legs -->
            <path d="M -8 42 L -18 58 L -14 68" fill="none" stroke="#a09070" stroke-width="2" stroke-linecap="round"/>

            <!-- near legs -->
            <path d="M -4 48 L -12 66 L -8 78" fill="none" stroke="#c9b896" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M 10 48 L 18 66 L 14 78" fill="none" stroke="#c9b896" stroke-width="2.2" stroke-linecap="round"/>
            <!-- front pair will join steering arm -->

          <!-- Abdomen -->
          <ellipse cx="0" cy="48" rx="9" ry="16" fill="#b8a888" stroke="#8a7a60" stroke-width="1"/>
          <ellipse cx="0" cy="44" rx="7" ry="6" fill="#c9b896" opacity=".5"/>

          <!-- Thorax (fuzzy) -->
          <ellipse cx="0" cy="28" rx="12" ry="14" fill="#e8dcc0" stroke="#b8a888" stroke-width="1"/>
          <ellipse cx="-3" cy="24" rx="5" ry="5" fill="#f5ecd8" opacity=".6"/>
          <ellipse cx="4" cy="30" rx="4" ry="4" fill="#f5ecd8" opacity=".45"/>

          <!-- Head -->
          <circle cx="0" cy="12" r="10" fill="#d8c8a8" stroke="#a09070" stroke-width="1"/>

          <ellipse cx="-6" cy="11" rx="4.5" ry="5" fill="url(#eyeGrad)"/>

          <ellipse cx="-5" cy="10" rx="1.5" ry="1.2" fill="#fff" opacity=".5"/>
          <ellipse cx="7" cy="10" rx="1.5" ry="1.2" fill="#fff" opacity=".5"/>
          <!-- palps / proboscis hint -->
          <path d="M -2 18 Q 0 24 2 18" fill="none" stroke="#a09070" stroke-width="1.2"/>

          <!-- Antennae — bipectinate, independent sway -->
          <g class="antenna a-l">
            <path d="M -4 5 C -12 -5, -22 -14, -28 -22"
                  fill="none" stroke="#b8863a" stroke-width="1.8" stroke-linecap="round"/>
            <!-- feathery branches -->
            <path d="M -8 0 L -14 -4 M -11 -4 L -18 -8 M -14 -8 L -21 -12 M -17 -12 L -24 -16 M -20 -16 L -26 -19"
                  fill="none" stroke="#c9a050" stroke-width="1" stroke-linecap="round" opacity=".8"/>
            <circle cx="-28" cy="-22" r="1.5" fill="#d4a84b"/>
          </g>
          <g class="antenna a-r">
            <path d="M 4 5 C 12 -5, 22 -14, 28 -22"

  </div>

  <div class="plaque">
    Moth × Gondola
    <small>a night-canal transit · propeller &amp; limbs desynced by design</small>
  </div>
</div>

<script>
/* Light JS: stamp a few more shore lamps + ensure reduced-motion respect.
   No network. No frameworks. */
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    document.querySelectorAll('.vehicle-wrap, .paddle-wheel, .wing-l, .wing-r, .antenna, .steer-arm, .legs, .hull-group, .layer, .water::before')
      .forEach(function (el) {
        el.style.animation = 'none';
      });
    // ::before cannot be selected; freeze water scroll via class
    document.querySelector('.water').classList.add('frozen');
    var s = document.createElement('style');
    s.textContent = '.water.frozen::before{animation:none}';
    document.head.appendChild(s);
  }

  // Soft canvas-free "moon dust" near vehicle path using existing sparks only.
  // Count DOM layers for a console self-check (evidence for response.md).
  var layers = document.querySelectorAll('.stage > .layer').length;
  var hasSvg = !!document.querySelector('svg');
  var hasWheel = !!document.querySelector('.paddle-wheel');
  var hasWings = !!document.querySelector('.wing-l') && !!document.querySelector('.wing-r');
  console.info('[moth-gondola] layers=' + layers, 'svg=' + hasSvg, 'wheel=' + hasWheel, 'wings=' + hasWings);
})();
</script>
