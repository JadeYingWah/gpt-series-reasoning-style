<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pangolin Streetcar · SVG014</title>
<!--
  GEOMETRY / MOTION NOTES (also mirrored in notes.md)

  World model
  - Camera is fixed; the streetcar+pangolin group holds near screen center-right
    and the world scrolls leftward to imply rightward travel.
  - Ground speed S = 1.0 (normalized). Layers use different multipliers.

  Parallax / depth (3 layers, plus sky gradient)
  1. FAR  skyline silhouettes     speed = 0.18  (slow)
  2. MID  shopfronts / poles / trees  speed = 0.45
  3. NEAR road curb + dashed lane  speed = 1.00  (matches vehicle ground contact)
  Extra: floating dust motes at 0.7 for atmospheric depth.

  Vehicle kinematics
  - Streetcar advances right. Wheel rotation is CLOCKWISE when moving right
    (top of wheel goes forward-right, bottom rolls left against ground).
  - Angular velocity: ω = v / r. Two rear + two front wheels share phase base;
    radii differ slightly so periods differ, which looks more mechanical.
  - Pantograph spark flickers independently (electrical, not kinematic).
  - Body has a subtle vertical bob (suspension) at 0.55 Hz, amplitude 1.2px.

  Pangolin relative motion (NOT locked to vehicle translation)
  1. Head: nods + slight yaw while looking down the track (phase ≠ body bob).
  2. Left arm (near): steers — elbow flexes, forearm rotates ±12° around
     wheel hub; claw tips lag one frame via CSS animation-delay.
  3. Right arm (far, partially occluded): counter-phase elbow bend.
  4. Tail: long scaly tail sways side-to-side (sine, period 2.4s) and
     tip curls independently; tail base also bobs opposite to body bob.
  5. Ear / neck scales: tiny breath motion.
  - Head/tail/arm periods are mutually irrational-ish vs wheel spin so they
    never re-sync into a single locked loop.

  Style
  - Night / dusk city, warm streetcar lamps vs cool sky. No pure white bg.
  - Pangolin: overlapping keratin scale tiles, long snout, dark eye, claws.
-->
<style>
  :root {
    --ink: #1a1620;
    --dusk-deep: #1b1a35;
    --dusk-mid: #3d2b5a;
    --dusk-warm: #c45c3e;
    --dusk-glow: #f0a060;
    --car-body: #8b2e3a;
    --car-body-dark: #5c1c28;
    --car-trim: #e8c878;
    --car-window: #7ec8e3;
    --scale-base: #6b5344;
    --scale-hi: #a8896a;
    --scale-dark: #3d2e24;
    --lamp: #ffd88a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #120f22;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    min-height: 420px;
  }
  svg#scene {
    display: block;
    width: 100%; height: 100%;
  }
  /* ---- sky / scene base ---- */
  .sky { fill: url(#skyGrad); }
  .stars circle { fill: #fff8e8; animation: twinkle 3.2s ease-in-out infinite; }
  .stars circle:nth-child(odd) { animation-duration: 4.1s; animation-delay: -1.2s; }
  .stars circle:nth-child(3n) { animation-duration: 2.6s; animation-delay: -0.7s; }
  @keyframes twinkle {
    0%,100% { opacity: 0.25; }
    50% { opacity: 0.95; }
  }

  /* ---- parallax groups: JS translates X ---- */
  .layer { will-change: transform; }

  /* ---- wheel spin: clockwise for rightward travel ---- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: spin-cw 0.55s linear infinite;
  }
  .wheel-spin.slow { animation-duration: 0.72s; }
  @keyframes spin-cw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---- vehicle body suspension bob ---- */
  .car-bob {
    animation: bob 1.82s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(1.2px); }
  }

  /* ---- pangolin head: nod + micro-yaw (different period from bob) ---- */
  .pg-head {
    transform-box: fill-box;
    transform-origin: 18% 78%;
    animation: head-nod 2.35s ease-in-out infinite;
  }
  @keyframes head-nod {
    0%   { transform: rotate(0deg) translateY(0); }
    28%  { transform: rotate(-3.5deg) translateY(0.6px); }
    55%  { transform: rotate(2.2deg) translateY(-0.4px); }
    78%  { transform: rotate(-1.4deg) translateY(0.2px); }
    100% { transform: rotate(0deg) translateY(0); }
  }

  /* ---- near arm steering (forearm around elbow) ---- */
  .arm-near {
    transform-box: fill-box;
    transform-origin: 12% 20%;
    animation: steer-near 1.45s ease-in-out infinite;
  }
  @keyframes steer-near {
    0%,100% { transform: rotate(-8deg); }
    40%     { transform: rotate(10deg); }
    70%     { transform: rotate(-4deg); }
  }
  .arm-far {
    transform-box: fill-box;
    transform-origin: 80% 18%;
    animation: steer-far 1.45s ease-in-out infinite;
  }
  @keyframes steer-far {
    0%,100% { transform: rotate(6deg); }
    45%     { transform: rotate(-9deg); }
    75%     { transform: rotate(3deg); }
  }
  .claw-lag {
    animation: claw-lag 1.45s ease-in-out infinite;
  }
  .claw-lag.b { animation-delay: -0.08s; }
  .claw-lag.c { animation-delay: -0.16s; }
  @keyframes claw-lag {
    0%,100% { transform: translateY(0); }
    40%     { transform: translateY(1.2px); }
  }

  /* ---- tail sway (period independent of wheels/head) ---- */
  .pg-tail {
    transform-box: fill-box;
    transform-origin: 0% 55%;
    animation: tail-sway 2.72s ease-in-out infinite;
  }
  .pg-tail-mid {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: tail-sway 2.72s ease-in-out infinite;
    animation-delay: -0.28s;
  }
  .pg-tail-tip {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: tail-curl 1.91s ease-in-out infinite;
  }
  @keyframes tail-sway {
    0%,100% { transform: rotate(0deg) translateY(0); }
    35%     { transform: rotate(7deg) translateY(0.5px); }
    65%     { transform: rotate(-5deg) translateY(-0.3px); }
  }
  @keyframes tail-curl {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(-16deg); }
  }

  /* ---- pantograph spark flicker ---- */
  .spark {
    animation: spark 0.18s steps(2) infinite;
  }
  @keyframes spark {
    0%,49% { opacity: 1; }
    50%,100% { opacity: 0.15; }
  }

  /* ---- lamp glow pulse ---- */
  .lamp-glow {
    animation: lamp-pulse 2.1s ease-in-out infinite;
  }
  @keyframes lamp-pulse {
    0%,100% { opacity: 0.55; }
    50%     { opacity: 0.85; }
  }

  /* ---- window warm light flicker ---- */
  .win-light {
    animation: win-flick 3.4s ease-in-out infinite;
  }
  .win-light:nth-child(2) { animation-delay: -1.1s; }
  .win-light:nth-child(3) { animation-delay: -2.3s; }
  @keyframes win-flick {
    0%,100% { opacity: 0.75; }
    40%     { opacity: 1; }
    62%     { opacity: 0.55; }
  }

  /* ---- speed lines (near layer accents) ---- */
  .speed-line {
    animation: whoosh 0.7s linear infinite;
    opacity: 0;
  }
  .speed-line:nth-child(2) { animation-delay: 0.18s; }
  .speed-line:nth-child(3) { animation-delay: 0.36s; }
  .speed-line:nth-child(4) { animation-delay: 0.52s; }
  @keyframes whoosh {
    0%   { opacity: 0; transform: translateX(40px); }
    20%  { opacity: 0.7; }
    100% { opacity: 0; transform: translateX(-180px); }
  }

  /* ---- dust motes ---- */
  .dust {
    animation: dust-drift linear infinite;
    opacity: 0.35;
  }
  @keyframes dust-drift {
    from { transform: translateX(0); opacity: 0; }
    15%  { opacity: 0.4; }
    85%  { opacity: 0.25; }
    to   { transform: translateX(-220px); opacity: 0; }
  }

  /* ---- breath (chest scales) ---- */
  .pg-chest {
    transform-box: fill-box;
    transform-origin: 50% 60%;
    animation: breath 3.1s ease-in-out infinite;
  }
  @keyframes breath {
    0%,100% { transform: scale(1, 1); }
    50%     { transform: scale(1.015, 1.04); }
  }

  /* ---- eye blink ---- */
  .pg-eye-lid {
    animation: blink 5.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    94%, 97%      { transform: scaleY(1); }
  }

  /* ---- caption ---- */
  #hud {
    position: absolute;
    left: 16px; bottom: 12px;
    color: #f0d9b8;
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.7;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #hud strong { color: #ffd88a; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A pangolin driving a red streetcar to the right at dusk">
    <defs>

        <stop offset="0%"  stop-color="#1b1a35"/>

        <stop offset="100%" stop-color="#c45c3e"/>

      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a2438"/>
        <stop offset="100%" stop-color="#1a1620"/>
      </linearGradient>
      <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">

      </radialGradient>
      <radialGradient id="headlamp" cx="50%" cy="50%" r="50%">

        <stop offset="45%" stop-color="#8b6b4a"/>
        <stop offset="100%" stop-color="#4a3424"/>
      </linearGradient>
      <linearGradient id="scaleGrad2" x1="0" y1="0" x2="0.2" y2="1">

        <stop offset="100%" stop-color="#3d2e24"/>

      </filter>

        <feGaussianBlur stdDeviation="0.6"/>
      </filter>

      <!-- reusable scale tile -->
      <symbol id="scale" viewBox="0 0 20 18">
        <path d="M2,2 Q10,0 18,4 Q16,14 10,17 Q4,14 2,2 Z" fill="url(#scaleGrad)" stroke="#2a1e14" stroke-width="0.6"/>

      </symbol>
      <symbol id="scaleDark" viewBox="0 0 20 18">
        <path d="M2,2 Q10,0 18,4 Q16,14 10,17 Q4,14 2,2 Z" fill="url(#scaleGrad2)" stroke="#2a1e14" stroke-width="0.6"/>
      </symbol>
      <symbol id="wheelRim" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" fill="#1a1620" stroke="#4a4258" stroke-width="2"/>
        <circle cx="20" cy="20" r="12" fill="none" stroke="#6b6278" stroke-width="1.5"/>
        <!-- spokes for rotation visibility -->
        <line x1="20" y1="4" x2="20" y2="36" stroke="#8a8098" stroke-width="1.4"/>
        <line x1="4" y1="20" x2="36" y2="20" stroke="#8a8098" stroke-width="1.4"/>
        <line x1="8" y1="8" x2="32" y2="32" stroke="#8a8098" stroke-width="1.2"/>
        <line x1="32" y1="8" x2="8" y2="32" stroke="#8a8098" stroke-width="1.2"/>
        <circle cx="20" cy="20" r="4" fill="#c4b48a" stroke="#5c5240" stroke-width="1"/>
        <!-- tread notch to make CW rotation obvious -->
        <rect x="18" y="1" width="4" height="5" rx="1" fill="#ffd88a"/>
      </symbol>
    </defs>

    <!-- SKY -->

    <!-- distant sun / moon glow -->

    <!-- STARS -->

      <circle cx="340" cy="36" r="1.1"/><circle cx="480" cy="70" r="0.8"/>
      <circle cx="620" cy="30" r="1.3"/><circle cx="760" cy="88" r="0.9"/>

      <circle cx="150" cy="130" r="0.7"/><circle cx="550" cy="110" r="0.8"/>
      <circle cx="850" cy="120" r="0.7"/><circle cx="1100" cy="40" r="1.1"/>
    </g>

    <!-- ========== LAYER FAR: skyline ========== -->
    <g class="layer" id="layerFar" opacity="0.55">
      <!-- tiled skyline strip, width ~1600, JS wraps -->

        <g transform="translate(0,0)">

          <rect x="145" y="300" width="90" height="180" fill="#221d36"/>

          <rect x="310" y="270" width="100" height="210" fill="#261f40"/>
          <rect x="420" y="250" width="60" height="230" fill="#2a2248"/>
          <rect x="490" y="300" width="80" height="180" fill="#221d38"/>
          <rect x="580" y="230" width="52" height="250" fill="#2e2652"/>
          <rect x="650" y="280" width="110" height="200" fill="#241f3c"/>
          <rect x="780" y="210" width="45" height="270" fill="#322a58"/>
          <rect x="840" y="260" width="95" height="220" fill="#261f42"/>
          <rect x="950" y="290" width="70" height="190" fill="#2a2446"/>
          <rect x="1040" y="235" width="58" height="245" fill="#2e2650"/>
          <rect x="1110" y="275" width="90" height="205" fill="#241f3a"/>
          <rect x="1210" y="250" width="50" height="230" fill="#2a2248"/>
          <rect x="1270" y="300" width="100" height="180" fill="#221d38"/>
          <rect x="1380" y="240" width="65" height="240" fill="#2e2652"/>
          <rect x="1460" y="280" width="85" height="200" fill="#261f42"/>
          <rect x="1555" y="260" width="70" height="220" fill="#2a2446"/>
          <!-- sparse far windows -->
          <g fill="#f0c070" opacity="0.35">
            <rect x="20" y="300" width="4" height="6"/><rect x="40" y="340" width="4" height="6"/>
            <rect x="95" y="270" width="4" height="6"/><rect x="110" y="310" width="4" height="6"/>

            <rect x="1400" y="270" width="4" height="6"/><rect x="1480" y="310" width="4" height="6"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ========== LAYER MID: shops, poles, trees ========== -->

      <g id="midTiles">
        <!-- shop row -->
        <g>
          <!-- shop 1 -->

<script>
(function () {
  'use strict';

  // Parallax scroll: world moves left; vehicle is in a fixed reference frame.
  // Far = 0.18x, Mid = 0.45x, Near = 1.0x, Dust = 0.7x, Speed accents CSS-driven.
  var TILE = 1620;          // wrap width for tiles (slightly > viewBox 1200)
  var FAR_SPEED  = 0.18;
  var MID_SPEED  = 0.45;
  var NEAR_SPEED = 1.00;
  var DUST_SPEED = 0.70;

  // world scroll unit per frame at 60fps ≈ 2.6 px/frame for near layer
  var PX_PER_SEC_NEAR = 160;

  var far  = document.getElementById('layerFar');
  var mid  = document.getElementById('layerMid');
  var near = document.getElementById('layerNear');
  var dust = document.getElementById('layerDust');

  var offFar = 0, offMid = 0, offNear = 0, offDust = 0;
  var last = performance.now();
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function wrap(v) {
    // keep offsets in (-TILE, 0]
    while (v <= -TILE) v += TILE;
    while (v > 0) v -= TILE;
    return v;
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!reduced) {
      var step = PX_PER_SEC_NEAR * dt;
      offNear = wrap(offNear - step * NEAR_SPEED);
      offFar  = wrap(offFar  - step * FAR_SPEED);
      offMid  = wrap(offMid  - step * MID_SPEED);
      offDust = wrap(offDust - step * DUST_SPEED);

      far.setAttribute('transform',  'translate(' + offFar.toFixed(2) + ',0)');
      mid.setAttribute('transform',  'translate(' + offMid.toFixed(2) + ',0)');
      near.setAttribute('transform', 'translate(' + offNear.toFixed(2) + ',0)');
      dust.setAttribute('transform', 'translate(' + offDust.toFixed(2) + ',0)');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Ensure tile content is wide enough: duplicate far/mid/near content once if needed.
  // (Content was authored ~1620px wide; we also clone children once for seamless wrap.)
  function ensureTileWidth(groupId) {
    var g = document.getElementById(groupId);
    if (!g) return;
    var kids = Array.prototype.slice.call(g.children);
    // measure approximate content extent via getBBox if available
    try {
      var bb = g.getBBox();
      if (bb.width < TILE) {
        kids.forEach(function (child) {
          var clone = child.cloneNode(true);
          clone.setAttribute('transform', 'translate(' + TILE + ',0)');
          g.appendChild(clone);
        });
      }
    } catch (e) { /* getBBox may fail if not rendered yet */ }
  }
  // Defer until layout
  requestAnimationFrame(function () {
    ensureTileWidth('farTiles');
    ensureTileWidth('midTiles');
    ensureTileWidth('nearTiles');
  });
})();
</script>
