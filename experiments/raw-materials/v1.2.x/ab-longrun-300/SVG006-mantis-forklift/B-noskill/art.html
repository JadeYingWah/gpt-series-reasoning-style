<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mantis Forklift · SVG006</title>
<!--
  Self-consistency (see notes.md):
  - Vehicle advances RIGHT; ground/parallax scroll LEFT; wheels rotate CLOCKWISE.
  - Mantis appendages (forelegs, antennae, abdomen, mid-legs) animate relative to rigid chassis.
  - Background layers L0–L3 with distinct parallax speeds.
  - Single file, no CDN, no network requests. SVG + CSS/JS only.
-->
<style>
  :root {
    --ink: #0d1b1e;
    --sky-top: #1a2740;
    --sky-mid: #c45c38;
    --sky-bot: #f0a35a;
    --ground: #2a2420;
    --ground2: #3a322c;
    --chassis: #e8a31c;
    --chassis-dark: #b87a10;
    --chassis-deep: #7a4e08;
    --mant: #6fbe44;
    --mant-dark: #3d7a28;
    --mant-deep: #2a5518;
    --eye: #1a1a12;
    --eye-glint: #f5f0c8;
    --metal: #6a7378;
    --metal-dark: #3d4448;
    --accent: #ff6b35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, #4a3560 35%, var(--sky-mid) 62%, var(--sky-bot) 100%);
  }

  .hud {
    position: absolute;
    z-index: 20;
    top: 16px;
    left: 16px;
    color: rgba(255,235,200,0.92);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: rgba(10,14,16,0.45);
    border: 1px solid rgba(255,180,80,0.25);
    padding: 8px 12px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
    pointer-events: none;
    user-select: none;
  }
  .hud strong { color: var(--chassis); font-weight: 700; letter-spacing: 0.14em; }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }

  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- Parallax scroll helpers ---------- */
  @keyframes scrollLeftFar {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes scrollLeftMid {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes scrollLeftNear {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes scrollLeftFore {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  .p-far  { animation: scrollLeftFar  48s linear infinite; }
  .p-mid  { animation: scrollLeftMid  18s linear infinite; }
  .p-near { animation: scrollLeftNear 7s  linear infinite; }
  .p-fore { animation: scrollLeftFore 4.2s linear infinite; }

  /* ---------- Wheels: clockwise = moving right ---------- */
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel-spin {
    animation: spinCW 1.1s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* ---------- Mantis appendages (relative to chassis) ---------- */
  @keyframes forelegL {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    40%      { transform: rotate(-7deg) translateY(-3px); }
    70%      { transform: rotate(4deg) translateY(2px); }
  }
  @keyframes forelegR {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    35%      { transform: rotate(6deg) translateY(2px); }
    65%      { transform: rotate(-5deg) translateY(-3px); }
  }
  .foreleg-l {
    animation: forelegL 1.6s ease-in-out infinite;
    transform-origin: 40% 20%;
    transform-box: fill-box;
  }
  .foreleg-r {
    animation: forelegR 1.6s ease-in-out infinite;
    transform-origin: 60% 20%;
    transform-box: fill-box;
  }

  @keyframes antennaL {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(9deg); }
  }
  @keyframes antennaR {
    0%, 100% { transform: rotate(2deg); }
    55%      { transform: rotate(-10deg); }
  }
  .antenna-l {
    animation: antennaL 2.2s ease-in-out infinite;
    transform-origin: 90% 100%;
    transform-box: fill-box;
  }
  .antenna-r {
    animation: antennaR 2.5s ease-in-out infinite;
    transform-origin: 10% 100%;
    transform-box: fill-box;
  }

  @keyframes abdomenSway {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    30%      { transform: rotate(2.5deg) translateY(2px); }
    65%      { transform: rotate(-2deg) translateY(-1px); }
  }
  .abdomen {
    animation: abdomenSway 2.0s ease-in-out infinite;
    transform-origin: 0% 50%;
    transform-box: fill-box;
  }

  @keyframes midLegs {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(2px) rotate(-2deg); }
  }
  .mid-legs {
    animation: midLegs 1.9s ease-in-out infinite;
    transform-origin: 50% 0%;
    transform-box: fill-box;
  }

  @keyframes headBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    45%      { transform: translateY(-1.5px) rotate(1.2deg); }
  }
  .head {
    animation: headBob 1.35s ease-in-out infinite;
    transform-origin: 50% 100%;
    transform-box: fill-box;
  }

  @keyframes bodyBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(1.2px); }
  }
  .driver-bob {
    animation: bodyBob 0.55s ease-in-out infinite;
  }

  /* Exhaust puffs */
  @keyframes puff {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.6); }
    100% { opacity: 0;    transform: translate(-48px,-22px) scale(1.8); }
  }
  .puff {
    animation: puff 1.4s ease-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .puff:nth-child(2) { animation-delay: 0.45s; }
  .puff:nth-child(3) { animation-delay: 0.9s; }

  /* Cargo bounce on forks */
  @keyframes cargoJitter {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    40%      { transform: translateY(-0.8px) rotate(0.3deg); }
    70%      { transform: translateY(0.4px) rotate(-0.2deg); }
  }
  .cargo { animation: cargoJitter 0.9s ease-in-out infinite; }

  /* Work light pulse */
  @keyframes lampPulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }
  .lamp-glow { animation: lampPulse 1.8s ease-in-out infinite; }

  /* Soft dust under wheels */
  @keyframes dustDrift {
    0%   { opacity: 0.35; transform: translate(0,0) scale(1); }
    100% { opacity: 0;    transform: translate(-20px,-6px) scale(1.4); }
  }
  .dust {
    animation: dustDrift 1.1s ease-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
</style>
</head>

<script>
/* Minimal JS: only enhancement. Core animation is pure CSS.
   No network requests. Guards against missing elements. */
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  if (!stage) return;

  // Subtle parallax depth on pointer move (optional, desktop nicety)
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    // Leave CSS loops as-is; user preference respected for pointer layer only.
    return;
  }

  var svg = stage.querySelector('svg.scene');
  if (!svg) return;

  var max = 8;
  function onMove(e) {
    var r = stage.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width - 0.5;
    var ny = (e.clientY - r.top) / r.height - 0.5;
    // translate far layers opposite, near layers slight
    var far = svg.querySelector('.p-far');
    var mid = svg.querySelector('.p-mid');
    if (far) far.style.translate = (-nx * max * 0.3) + 'px ' + (-ny * max * 0.15) + 'px';
    if (mid) mid.style.translate = (-nx * max * 0.6) + 'px ' + (-ny * max * 0.25) + 'px';
  }
  function onLeave() {
    var far = svg.querySelector('.p-far');
    var mid = svg.querySelector('.p-mid');
    if (far) far.style.translate = '';
    if (mid) mid.style.translate = '';
  }

  stage.addEventListener('pointermove', onMove);
  stage.addEventListener('pointerleave', onLeave);

  // Document title pulse for tab visibility (tiny touch, no deps)
  if (document.hidden) {
    document.title = '⏸ Mantis Forklift';
