<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Line · Owl Subway</title>
<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a2744;
    --sky-bot: #2a3a5c;
    --far-skyline: #152038;
    --mid-skyline: #1e2d4a;
    --near-tunnel: #121a2e;
    --rail: #3a4a66;
    --train-body: #c8d4e8;
    --train-accent: #e8a020;
    --train-stripe: #2a6fdb;
    --owl-body: #c4a574;
    --owl-belly: #e8d4a8;
    --owl-wing: #8b6914;
    --owl-eye: #f0c040;
    --window-glow: #7ec8e3;
    --headlight: #fff6c8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05080f;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    display: block;
  }

  /* ===== Parallax layers (translate via CSS keyframes; SVG holds geometry) ===== */
  .layer-far  { animation: scroll-far  48s linear infinite; }
  .layer-mid  { animation: scroll-mid  24s linear infinite; }
  .layer-near { animation: scroll-near 12s linear infinite; }
  .layer-rail { animation: scroll-rail  8s linear infinite; }

  @keyframes scroll-far  { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-mid  { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-near { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-rail { from { transform: translateX(0); }    to { transform: translateX(-800px); } }

  /* Train bob (vertical micro-bounce from rail imperfection) */
  #train-group {
    animation: train-bob 0.55s ease-in-out infinite alternate;
    transform-origin: 520px 390px;
  }
  @keyframes train-bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-2.5px); }
  }

  /* Headlight pulse */
  #headlight-glow {
    animation: lamp-pulse 1.8s ease-in-out infinite alternate;
  }
  @keyframes lamp-pulse {
    from { opacity: 0.55; }
    to   { opacity: 0.9; }
  }

  /* Window interior glow flicker */
  .win-glow {
    animation: win-flicker 2.4s ease-in-out infinite alternate;
  }
  .win-glow:nth-child(2n) { animation-delay: -0.8s; }
  .win-glow:nth-child(3n) { animation-delay: -1.4s; }
  @keyframes win-flicker {
    from { opacity: 0.75; }
    to   { opacity: 0.95; }
  }

  /* ===== Wheels: rotate CLOCKWISE when train moves RIGHT ===== */
  .wheel {
    animation: wheel-spin 0.9s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes wheel-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== Owl independent appendages ===== */

  /* Wings / arms on throttle — independent of train body bob */
  #owl-wing-l {
    animation: wing-flap-l 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 90% 20%;
  }
  #owl-wing-r {
    animation: wing-flap-r 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 10% 20%;
  }
  @keyframes wing-flap-l {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(-8deg) translateY(1.5px); }
  }
  @keyframes wing-flap-r {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(6deg) translateY(1px); }
  }

  /* Head scan — looks ahead / down at controls, independent of wings & train bob */
  #owl-head {
    animation: head-scan 3.2s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  @keyframes head-scan {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25%      { transform: rotate(-6deg) translateY(-1px); }
    55%      { transform: rotate(4deg) translateY(0.5px); }
    75%      { transform: rotate(-2deg) translateY(0); }
  }

  /* Ear tufts sway — third independent motion */
  #tuft-l { animation: tuft-sway 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  #tuft-r { animation: tuft-sway 1.6s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes tuft-sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-7deg); }
  }

  /* Eye blink */
  #owl-eyes {
    animation: blink 4.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.08); }
  }

  /* Tail feathers flick */
  #owl-tail {
    animation: tail-flick 1.1s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }
  @keyframes tail-flick {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(5deg); }
  }

  /* Speed lines behind train */
  .speed-line {
    animation: speed-dash 0.45s linear infinite;
  }
  .speed-line:nth-child(2) { animation-delay: 0.12s; }
  .speed-line:nth-child(3) { animation-delay: 0.24s; }
  @keyframes speed-dash {
    from { opacity: 0.55; transform: translateX(0); }
    to   { opacity: 0;    transform: translateX(-40px); }
  }

  /* Track ties flash (rails scrolling) */
  .tie {
    animation: tie-pass 0.8s linear infinite;
  }
  @keyframes tie-pass {
    from { opacity: 0.85; }
    to   { opacity: 0.55; }
  }

  /* Stars twinkle */
  .star { animation: twinkle 2.8s ease-in-out infinite; }
  .star:nth-child(3n)   { animation-delay: 0.6s; }
  .star:nth-child(3n+1) { animation-delay: 1.2s; }
  .star:nth-child(3n+2) { animation-delay: 1.8s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }

  /* Tunnel arch pulse when train "enters" — subtle ambient */
  #tunnel-vignette {
    animation: vignette-breathe 6s ease-in-out infinite alternate;
  }
  @keyframes vignette-breathe {
    from { opacity: 0.35; }
    to   { opacity: 0.55; }
  }
</style>
</head>

<!--
  Motion self-consistency notes (also in notes.md):

  1. Travel direction: RIGHT.
     - Headlight beam points right.
     - Speed lines trail left (translateX negative).
     - Cab (streamlined nose) is on the right end of the consist.

  2. Wheels: CSS rotate 0→360deg = CLOCKWISE.
     Clockwise rotation at ground contact produces rightward locomotion.

  3. Parallax (all layers scroll LEFT when world moves past a right-moving train):
     - layer-far  : 48s / 800px  — slowest (distant skyline)
     - layer-mid  : 24s / 800px  — medium  (city / stations)
     - layer-near : 12s / 800px  — faster  (tunnel walls / poles / fence)
     - layer-rail :  8s / 800px  — fastest (ties, rails, ballast)
     Ratios approximate 1 : 2 : 4 : 6 depth inverse.

  4. Owl independent appendages (NOT locked to train bob):
     - #owl-wing-l / #owl-wing-r : 0.7s flap, opposite phases; claws on throttle & dial
     - #owl-head : 3.2s scan (looks ahead then down at instruments)
     - #tuft-l / #tuft-r : 1.6s sway, reverse phase
     - #owl-eyes : 4.5s blink
     - #owl-tail : 1.1s flick
     Train body itself only has a subtle 0.55s vertical bob (rail imperfection).

  5. Relative motion guarantees:
     - Wings move while train bobs (different period 0.7s vs 0.55s, different axis)
     - Head rotates independently of wings (3.2s vs 0.7s)
     - Tufts reverse-phase against each other
     - Wheels spin in place (rotation about hub) while chassis bobs vertically
-->
