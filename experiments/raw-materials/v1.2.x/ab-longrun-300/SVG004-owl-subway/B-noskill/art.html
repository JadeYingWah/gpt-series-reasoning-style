<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owl Subway — Night Line</title>
<style>
  /* ============================================================
     Owl × Subway — single-file scene
     No external resources. All CSS/JS inline.
     ============================================================ */
  :root {
    --ink: #0b1020;
    --sky-a: #0d1430;
    --sky-b: #1a2750;
    --sky-c: #2a3a6a;
    --far: #121a38;
    --mid: #1a2450;
    --near: #243060;
    --track: #3a4678;
    --sleeper: #4a5688;
    --rail: #9aa8d0;
    --train-body: #e8eef8;
    --train-band: #3d6ef0;
    --train-dark: #2a4a9a;
    --glass: #7ec8ff;
    --glass-deep: #1a3a70;
    --owl-body: #c4a574;
    --owl-belly: #e8d4a8;
    --owl-feather: #8b6b3a;
    --owl-eye: #ffe566;
    --owl-pupil: #1a1420;
    --beak: #f0a040;
    --claw: #d09040;
    --glow: #ffd86a;
    --signal: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: min(100vw, 1280px);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }

  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- parallax layers (CSS transform driven by JS) ---------- */
  .layer {
    will-change: transform;
  }

  /* ---------- wheel rotation: forward = clockwise for rightward motion ---------- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-cw 0.55s linear infinite;
  }
  @keyframes spin-cw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* secondary drive gear (slightly different period for visual interest) */
  .gear-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-ccw 0.38s linear infinite;
  }
  @keyframes spin-ccw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* ---------- owl relative motion (NOT locked to train translation) ---------- */
  /* head bob + slight sway */
  .owl-head {
    transform-box: fill-box;
    transform-origin: 50% 85%;
    animation: head-bob 1.6s ease-in-out infinite;
  }
  @keyframes head-bob {
    0%, 100% { transform: rotate(-4deg) translateY(0px); }
    50%      { transform: rotate(5deg)  translateY(-3px); }
  }

  /* wing flap — independent of train body */
  .owl-wing-l {
    transform-box: fill-box;
    transform-origin: 90% 30%;
    animation: wing-flap-l 0.7s ease-in-out infinite;
  }
  .owl-wing-r {
    transform-box: fill-box;
    transform-origin: 10% 30%;
    animation: wing-flap-r 0.7s ease-in-out infinite;
  }
  @keyframes wing-flap-l {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    40%      { transform: rotate(-18deg) scaleY(0.88); }
    70%      { transform: rotate(6deg)  scaleY(1.04); }
  }
  @keyframes wing-flap-r {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    40%      { transform: rotate(18deg)  scaleY(0.88); }
    70%      { transform: rotate(-6deg) scaleY(1.04); }
  }

  /* tail feathers twitch */
  .owl-tail {
    transform-box: fill-box;
    transform-origin: 20% 20%;
    animation: tail-twitch 1.1s ease-in-out infinite;
  }
  @keyframes tail-twitch {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-8deg); }
  }

  /* body micro-bounce relative to cabin */
  .owl-body-group {
    animation: body-bounce 0.55s ease-in-out infinite;
  }
  @keyframes body-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  /* claw grip pulse on control lever */
  .owl-claw {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: claw-grip 0.9s ease-in-out infinite;
  }
  @keyframes claw-grip {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(8deg); }
  }

  /* ---------- train body sway (subtle vertical bounce from suspension) ---------- */
  .train-bounce {
    animation: train-bounce 0.55s ease-in-out infinite;
  }
  @keyframes train-bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.5px); }
  }

  /* ---------- track sleeper scroll (matches rightward travel) ---------- */
  .sleepers {
    animation: sleeper-scroll 0.55s linear infinite;
  }
  @keyframes sleeper-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }

  /* ---------- signal light pulse ---------- */
  .signal-glow {
    animation: signal-pulse 2s ease-in-out infinite;
  }
  @keyframes signal-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.45; }
  }

  /* ---------- window light flicker ---------- */
  .win-light {
    animation: win-flicker 3.2s ease-in-out infinite;
  }
  .win-light:nth-child(odd) { animation-delay: -1.1s; }
  .win-light:nth-child(3n)  { animation-delay: -2.0s; }
  @keyframes win-flicker {
    0%, 100% { opacity: 0.92; }
    40%      { opacity: 0.7; }
    60%      { opacity: 1; }
  }

  /* ---------- speed streaks ---------- */
  .streak {
    animation: streak-fly 0.7s linear infinite;
  }
  @keyframes streak-fly {
    from { transform: translateX(0); opacity: 0; }
    15%  { opacity: 0.85; }
    to   { transform: translateX(-420px); opacity: 0; }
  }

  /* ---------- smoke / exhaust puffs from roof vent ---------- */
  .puff {
    animation: puff-rise 1.8s ease-out infinite;
    opacity: 0;
  }
  .puff:nth-child(2) { animation-delay: 0.6s; }
  .puff:nth-child(3) { animation-delay: 1.2s; }
  @keyframes puff-rise {
    0%   { transform: translate(0,0) scale(0.4); opacity: 0; }
    20%  { opacity: 0.35; }
    100% { transform: translate(-50px,-40px) scale(1.6); opacity: 0; }
  }

  /* ---------- HUD caption ---------- */
  .hud {
    position: absolute;
    left: 18px;
    bottom: 14px;
    color: rgba(220, 230, 255, 0.75);
    font-size: clamp(11px, 1.4vw, 14px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .hud strong {
    color: var(--glow);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage" aria-label="Owl driving a subway train to the right">
  <!--
    ============================================================
    Geometry & motion coherence notes (also mirrored in notes.md)
    ============================================================
    1. Forward direction = right (+X). Train is drawn facing right;
       nose cone, windshield rake, and headlight aim all point +X.
    2. Wheels: CSS spin-cw (clockwise) so the contact patch at the
       rail surface moves backward (-X) relative to the train —
       physically consistent with rightward travel. Period 0.55s.
    3. Drive gear under the chassis spins counter-clockwise via a
       meshing visual (period 0.38s) — reads as a geared coupling.
    4. Sleepers (rail ties) translate -80px over 0.55s — same period
       as one wheel revolution, so ground scroll and wheel rotation
       are phase-locked in perceived speed.
    5. Owl relative motion (NOT body-locked translation):
         a) Head: independent rotate/bob (1.6s)
         b) Wings L/R: independent flap (0.7s)
         c) Tail: independent twitch (1.1s)
         d) Body micro-bounce (0.55s, same period as wheel — suspension feel)
         e) Claw on lever: grip pulse (0.9s)
       At least 5 independent limb/appendage DOFs vs the train body.
    6. Parallax / depth (3 layers):
         L0 far  : sky gradient + stars + distant skyline silhouette
         L1 mid   : mid buildings + elevated pillars receding
         L2 near  : track, sleepers, signal poles, foreground weeds
       JS drives tiny horizontal offsets on L0/L1 relative to camera
       drift; L2 sleepers use pure CSS scroll. Plus CSS speed streaks
       as a 4th depth cue in front of the train.
    7. Exhaust puffs drift backward (-X) and up — consistent with
       rightward motion and roof vent placement.
  -->

  <svg class="scene" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img">
    <defs>
      <!-- sky gradient -->

        <stop offset="78%"  stop-color="#243568"/>
        <stop offset="100%" stop-color="#3a4a78"/>

      <!-- moon glow -->
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff6c8" stop-opacity="0.95"/>

        <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="moonCore" cx="40%" cy="40%" r="55%">

      <!-- train body metal -->

        <stop offset="40%"  stop-color="#d8e0f0"/>
        <stop offset="100%" stop-color="#a8b6d0"/>
      </linearGradient>

      <!-- band / livery -->

        <stop offset="0%"   stop-color="#2a52c8"/>
        <stop offset="50%"  stop-color="#4a7cf0"/>
        <stop offset="100%" stop-color="#2a52c8"/>
      </linearGradient>

      <!-- glass -->
      <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#a8e0ff"/>
        <stop offset="50%"  stop-color="#3a7ad0"/>
        <stop offset="100%" stop-color="#1a3a78"/>
      </linearGradient>

      <!-- headlight -->
      <radialGradient id="beamGrad" cx="0%" cy="50%" r="100%">
        <stop offset="0%"   stop-color="#fff4b0" stop-opacity="0.9"/>
        <stop offset="40%"  stop-color="#ffd86a" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ffd86a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="lampGrad" cx="40%" cy="40%" r="60%">
        <stop offset="0%"   stop-color="#fffce0"/>
        <stop offset="60%"  stop-color="#ffd84a"/>
        <stop offset="100%" stop-color="#d0a020"/>
      </radialGradient>

      <!-- owl body -->
      <radialGradient id="owlBodyGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0%"   stop-color="#d4b888"/>
        <stop offset="55%"  stop-color="#c4a574"/>
        <stop offset="100%" stop-color="#8b6b3a"/>
      </radialGradient>
      <radialGradient id="owlBellyGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%"   stop-color="#f0e0b8"/>
        <stop offset="100%" stop-color="#d4b888"/>
      </radialGradient>

      <!-- track metal -->
      <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#c8d0e8"/>
        <stop offset="40%"  stop-color="#8a96b8"/>

      </linearGradient>

      <!-- pillar shadow -->

        <stop offset="0%"   stop-color="#2a3660"/>
        <stop offset="50%"  stop-color="#3a4878"/>
        <stop offset="100%" stop-color="#1e2848"/>
      </linearGradient>

      <!-- clip for train interior -->
      <clipPath id="cabClip">
        <rect x="720" y="250" width="140" height="110" rx="14"/>
      </clipPath>

      <!-- star sparkle filter -->
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

<script>
(function () {
  'use strict';

  /*
    Parallax driver:
    - Layers have data-depth attributes (0..1).
    - A slow camera drift (sinusoidal) plus a constant "scroll sense"
      offset each layer by depth * drift.
    - Sleepers already CSS-scroll; this only nudges far/mid for depth.
    - Also applies a tiny mouse parallax for interactive depth.
  */

  var far  = document.getElementById('layer-far');
  var mid  = document.getElementById('layer-mid');
  var near = document.getElementById('layer-near');
  if (!far || !mid || !near) return;

  var mouseX = 0, mouseY = 0;
  var targetMX = 0, targetMY = 0;
  var t0 = performance.now();

  // Constant forward "world scroll" sense: layers drift left slowly
  // so the train reads as moving right even beyond CSS sleeper scroll.
  var SCROLL_SPEED = 12; // px per second baseline

  window.addEventListener('pointermove', function (e) {
    var r = document.querySelector('.stage').getBoundingClientRect();
    targetMX = ((e.clientX - r.left) / r.width - 0.5) * 2;   // -1..1
    targetMY = ((e.clientY - r.top) / r.height - 0.5) * 2;
  }, { passive: true });

  function frame(now) {
    var t = (now - t0) / 1000;

    // ease mouse
    mouseX += (targetMX - mouseX) * 0.06;
    mouseY += (targetMY - mouseY) * 0.06;

    // world scroll offset (leftward = train appears to go right)
    var scroll = -((t * SCROLL_SPEED) % 1280);

    // gentle idle sway
    var sway = Math.sin(t * 0.35) * 6;

    var layers = [
      { el: far,  depth: 0.05 },
      { el: mid,  depth: 0.18 },
      { el: near, depth: 0.55 }
    ];

    for (var i = 0; i < layers.length; i++) {
      var L = layers[i];
      var dx = scroll * L.depth + mouseX * 18 * L.depth + sway * L.depth;
      var dy = mouseY * 10 * L.depth;
      L.el.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')');
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // ---------- static coherence assertions (dev aid, no console required) ----------
  // Verify critical animated classes exist in DOM.
  var checks = {
    wheels: document.querySelectorAll('.wheel-spin').length,
    owlHead: document.querySelectorAll('.owl-head').length,
    owlWings: document.querySelectorAll('.owl-wing-l, .owl-wing-r').length,
    owlTail: document.querySelectorAll('.owl-tail').length,
    sleepers: document.querySelectorAll('.sleepers').length,
    streaks: document.querySelectorAll('.streak').length
  };
  // expose for automated inspection
  window.__OWL_SUBWAY_CHECKS__ = checks;
})();
</script>
