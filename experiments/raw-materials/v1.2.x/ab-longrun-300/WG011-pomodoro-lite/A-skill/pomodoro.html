<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1b19;
      --muted: #6b6560;
      --accent: #c2412d;
      --accent-soft: #f3d6d0;
      --card: #fffdf8;
      --ok: #2f6f4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid #e6e0d4;
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 10px 30px rgba(28, 27, 25, 0.06);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .display {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-size: 4rem;
      font-weight: 650;
      line-height: 1;
      margin: 8px 0 12px;
      letter-spacing: 0.04em;
    }
    .display.done { color: var(--accent); }
    .status {
      text-align: center;
      min-height: 1.4em;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .status.done {
      color: var(--accent);
      font-weight: 600;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      appearance: none;
      border: 1px solid #d7d0c4;
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 12px 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #faf7f1; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: #a93624; }
    .config {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      padding-top: 14px;
      border-top: 1px solid #eee7db;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d7d0c4;
      border-radius: 8px;
      font-size: 1rem;
      background: #fff;
      color: var(--ink);
    }
    input[type="number"]:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .err {
      grid-column: 1 / -1;
      color: var(--accent);
      font-size: 0.82rem;
      min-height: 1.1em;
    }
    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card" id="app">
    <h1>极简番茄钟</h1>
    <p class="sub">单文件 · 无外链 · 本地运行</p>

    <div class="display" id="display" aria-live="polite">25:00</div>
    <div class="status" id="status">准备就绪</div>

    <div class="controls">
      <button type="button" id="btnStart" class="primary">开始</button>
      <button type="button" id="btnPause">暂停</button>
      <button type="button" id="btnReset">重置</button>
    </div>

    <div class="config">
      <div>
        <label for="minutes">时长（分钟，1–60 整数）</label>
        <input id="minutes" type="number" min="1" max="60" step="1" value="25" />
      </div>
      <button type="button" id="btnApply">应用时长</button>
      <div class="err" id="errMsg" role="alert"></div>
    </div>

    <p class="hint">
      提示：到点状态文案变为「时间到」，并尝试播放提示音（Web Audio，无外部音频文件）。
      浏览器自动播放策略可能导致无声音，属正常现象。
    </p>
  </main>

  <script>
    (function () {
      "use strict";

      // ---- 可被审查/Node 核对的纯逻辑 ----
      var MIN_MINUTES = 1;
      var MAX_MINUTES = 60;
      var DEFAULT_MINUTES = 25;

      /**
       * 校验用户输入的分钟数。
       * @param {string|number} raw
       * @returns {{ok: true, minutes: number} | {ok: false, error: string}}
       */
      function parseMinutes(raw) {
        if (raw === null || raw === undefined || raw === "") {
          return { ok: false, error: "请输入 1–60 的整数分钟" };
        }
        var n = Number(raw);
        if (!Number.isFinite(n) || !Number.isInteger(n)) {
          return { ok: false, error: "必须是整数" };
        }
        if (n < MIN_MINUTES || n > MAX_MINUTES) {
          return { ok: false, error: "范围需在 1–60 分钟" };
        }
        return { ok: true, minutes: n };
      }

      /**
       * 剩余秒数 → mm:ss（mm 可超过 59，本任务最大 60）
       * @param {number} totalSeconds
       * @returns {string}
       */
      function formatTime(totalSeconds) {
        var s = Math.max(0, Math.floor(totalSeconds));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r;
      }

      /**
       * 计时器状态机（与 DOM 解耦，便于源码审查）
       * states: idle | running | paused | done
       */
      function createTimer(totalSeconds, onTick, onDone) {
        var remaining = totalSeconds;
        var state = "idle";
        var handle = null;
        var endsAt = 0;

        function clearHandle() {
          if (handle !== null) {
            clearInterval(handle);
            handle = null;
          }
        }

        function tick() {
          var now = Date.now();
          remaining = Math.max(0, Math.round((endsAt - now) / 1000));
          onTick(remaining, state);
          if (remaining <= 0) {
            clearHandle();
            state = "done";
            onTick(0, state);
            if (typeof onDone === "function") onDone();
          }
        }

        return {
          getState: function () { return state; },
          getRemaining: function () { return remaining; },
          getTotal: function () { return totalSeconds; },
          setTotal: function (seconds) {
            if (state === "running") return false;
            totalSeconds = seconds;
            remaining = seconds;
            state = "idle";
            clearHandle();
            onTick(remaining, state);
            return true;
          },
          start: function () {
            if (state === "running") return false;
            if (state === "done") return false;
            state = "running";
            endsAt = Date.now() + remaining * 1000;
            clearHandle();
            handle = setInterval(tick, 200);
            tick();
            return true;
          },
          pause: function () {
            if (state !== "running") return false;
            clearHandle();
            remaining = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
            state = "paused";
            onTick(remaining, state);
            return true;
          },
          reset: function () {
            clearHandle();
            remaining = totalSeconds;
            state = "idle";
            onTick(remaining, state);
            return true;
          }
        };
      }

      /**
       * 提示音：Web Audio，无外部文件。失败静默。
       */
      function beep() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          var ctx = new Ctx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(ctx.destination);
          var t = ctx.currentTime;
          osc.start(t);
          gain.gain.setValueAtTime(0.08, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
          osc.stop(t + 0.65);
          osc.onended = function () {
            try { ctx.close(); } catch (e) { /* ignore */ }
          };
        } catch (e) { /* 自动播放限制等，静默 */ }
      }

      // ---- UI 绑定 ----
      var display = document.getElementById("display");
      var statusEl = document.getElementById("status");
      var btnStart = document.getElementById("btnStart");
      var btnPause = document.getElementById("btnPause");
      var btnReset = document.getElementById("btnReset");
      var minutesInput = document.getElementById("minutes");
      var btnApply = document.getElementById("btnApply");
      var errMsg = document.getElementById("errMsg");

      var STATUS_IDLE = "准备就绪";
      var STATUS_RUNNING = "计时中";
      var STATUS_PAUSED = "已暂停";
      var STATUS_DONE = "时间到";

      function statusText(state) {
        if (state === "running") return STATUS_RUNNING;
        if (state === "paused") return STATUS_PAUSED;
        if (state === "done") return STATUS_DONE;
        return STATUS_IDLE;
      }

      function render(remaining, state) {
        display.textContent = formatTime(remaining);
        statusEl.textContent = statusText(state);
        if (state === "done") {
          display.classList.add("done");
          statusEl.classList.add("done");
        } else {
          display.classList.remove("done");
          statusEl.classList.remove("done");
        }
        btnStart.disabled = state === "running" || state === "done";
        btnPause.disabled = state !== "running";
        minutesInput.disabled = state === "running";
        btnApply.disabled = state === "running";
      }

      var timer = createTimer(DEFAULT_MINUTES * 60, render, function () {
        beep();
      });
      render(timer.getRemaining(), timer.getState());

      btnStart.addEventListener("click", function () {
        timer.start();
      });

      btnPause.addEventListener("click", function () {
        timer.pause();
      });

      btnReset.addEventListener("click", function () {
        timer.reset();
        errMsg.textContent = "";
      });

      btnApply.addEventListener("click", function () {
        var parsed = parseMinutes(minutesInput.value);
        if (!parsed.ok) {
          errMsg.textContent = parsed.error;
          return;
        }
        errMsg.textContent = "";
        timer.reset();
        timer.setTotal(parsed.minutes * 60);
        // setTotal 已 reset 到 idle 并 onTick
      });

      minutesInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") btnApply.click();
      });

      // 暴露纯函数与工厂，便于 Node/源码审查（浏览器环境无副作用）
      if (typeof window !== "undefined") {
        window.__pomodoroLite = {
          parseMinutes: parseMinutes,
          formatTime: formatTime,
          createTimer: createTimer,
          MIN_MINUTES: MIN_MINUTES,
          MAX_MINUTES: MAX_MINUTES
        };
      }

      // CommonJS 导出（Node 静态抽取或 eval 核对用）
      if (typeof module !== "undefined" && module.exports) {
        module.exports = {
          parseMinutes: parseMinutes,
          formatTime: formatTime,
          createTimer: createTimer,
          MIN_MINUTES: MIN_MINUTES,
          MAX_MINUTES: MAX_MINUTES
        };
      }
    })();
  </script>
</body>
</html>
