<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gecko Monorail · SVG010</title>
<style>
  :root {
    --ink: #0b1220;
    --night: #0a1428;
    --sky-deep: #07101f;
    --sky-mid: #122848;
    --sky-glow: #1a3a62;
    --city-far: #0d1b33;
    --city-mid: #132a4a;
    --city-near: #0a1628;
    --rail: #1e3348;
    --rail-top: #3d5a78;
    --train-body: #1b2a40;
    --train-shell: #2a3f5c;
    --train-accent: #e8a84a;
    --train-glow: #ffd27a;
    --cabin-light: #ffe0a0;
    --gecko-skin: #6fbf73;
    --gecko-belly: #c8e6a0;
    --gecko-dark: #3d7a48;
    --gecko-eye: #f0c040;
    --window-blue: #7ec8e8;
    --speed-line: #8ec8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--sky-deep);
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #hud {
    position: fixed;
    left: 14px;
    bottom: 12px;
    color: #8aa0b8;
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0.75;
  }
  #hud strong { color: var(--train-accent); font-weight: 600; }
</style>
</head>
<body>
<!--
  Self-consistency notes (also mirrored in notes.md):
  1. Vehicle motion: train group translates right; track sleepers, guideway marks,
     and mag-pad underglow scroll LEFT relative to camera → forward-right.
     Wheel/pad rotation is clockwise (top moves right) matching rightward travel.
  2. Gecko appendages independent of hull:
     - Head + eyes micro-look / blink (not locked to hull bob)
     - Front arms steer lever (wrist pivot + lever swing, phase-offset)
     - Tail sway (sine, lagging hull pitch)
     - Hind foot tap on floor plate (phase-shifted from arm)
  3. Parallax layers (back→front):
     L0 sky gradient + stars (slowest), L1 distant skyline, L2 mid towers + windows,
     L3 monorail guideway + train (primary), L4 near poles/signs blur (fastest),
     plus L5 foreground vignette / speed streaks.
-->
<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="A gecko driving a monorail train toward the right at dusk">
  <defs>
    <!-- Sky -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="38%" stop-color="#0a1428"/>
      <stop offset="62%" stop-color="#1a3358"/>
      <stop offset="82%" stop-color="#3a5a7a"/>
      <stop offset="100%" stop-color="#c47a4a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#ffb060" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#e07040" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trainShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5578"/>
      <stop offset="45%" stop-color="#243a55"/>
      <stop offset="100%" stop-color="#141f30"/>
    </linearGradient>
    <linearGradient id="trainNose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2a40"/>
      <stop offset="55%" stop-color="#2e4a6a"/>
      <stop offset="100%" stop-color="#5a8aaa"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a9a"/>
      <stop offset="30%" stop-color="#2a4258"/>
      <stop offset="100%" stop-color="#0c1520"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8b0"/>
      <stop offset="100%" stop-color="#e0a050"/>
    </linearGradient>
    <linearGradient id="geckoSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd48a"/>
      <stop offset="55%" stop-color="#5aaa60"/>
      <stop offset="100%" stop-color="#2f6a3a"/>
    </linearGradient>
    <radialGradient id="cabinGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#ffe0a0" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#e09040" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="farBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="nearBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cabClip">
      <rect x="430" y="268" width="175" height="88" rx="8"/>
    </clipPath>
    <clipPath id="trainClip">
      <path d="M300,380 L300,250 Q300,230 325,228 L620,228 Q660,228 700,250 L740,280 Q755,292 755,310 L755,360 Q755,380 735,380 Z"/>
    </clipPath>
  </defs>

  <!-- ========== L0 SKY ========== -->
  <g id="L0-sky">
    <rect x="0" y="0" width="1280" height="720" fill="url(#skyGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#sunGlow)"/>
    <!-- stars -->
    <g id="stars" fill="#c8d8f0">
      <circle cx="80" cy="40" r="1.2" opacity="0.9"/>
      <circle cx="160" cy="90" r="0.9" opacity="0.6"/>
      <circle cx="240" cy="30" r="1.4" opacity="0.8"/>
      <circle cx="320" cy="70" r="0.8" opacity="0.5"/>
      <circle cx="410" cy="45" r="1.1" opacity="0.7"/>
      <circle cx="500" cy="100" r="0.7" opacity="0.45"/>
      <circle cx="580" cy="25" r="1.3" opacity="0.85"/>
      <circle cx="670" cy="60" r="0.9" opacity="0.55"/>
      <circle cx="760" cy="35" r="1.0" opacity="0.7"/>
      <circle cx="850" cy="80" r="1.5" opacity="0.9"/>
      <circle cx="940" cy="48" r="0.8" opacity="0.5"/>
      <circle cx="1030" cy="95" r="1.1" opacity="0.65"/>
      <circle cx="1120" cy="30" r="1.2" opacity="0.8"/>
      <circle cx="1200" cy="70" r="0.9" opacity="0.55"/>
      <circle cx="1250" cy="50" r="1.0" opacity="0.7"/>
    </g>
    <!-- moon -->
    <circle cx="1120" cy="95" r="28" fill="#e8f0ff" opacity="0.18" filter="url(#softBlur)"/>
    <circle cx="1120" cy="95" r="16" fill="#f0f4ff" opacity="0.55"/>
  </g>

  <!-- ========== L1 FAR SKYLINE (slow parallax) ========== -->
  <g id="L1-far" filter="url(#farBlur)" opacity="0.55">
    <g id="L1-scroll">
      <!-- repeated city silhouette -->
      <g fill="#0d1b33">
        <rect x="0" y="480" width="40" height="120"/>
        <rect x="50" y="450" width="30" height="150"/>
        <rect x="90" y="500" width="50" height="100"/>
        <rect x="150" y="430" width="35" height="170"/>
        <rect x="195" y="470" width="28" height="130"/>
        <rect x="235" y="440" width="45" height="160"/>
        <rect x="290" y="490" width="32" height="110"/>
        <rect x="330" y="420" width="28" height="180"/>
        <rect x="370" y="460" width="50" height="140"/>
        <rect x="430" y="400" width="36" height="200"/>
        <rect x="475" y="480" width="30" height="120"/>
        <rect x="515" y="440" width="42" height="160"/>
        <rect x="565" y="470" width="28" height="130"/>
        <rect x="605" y="410" width="38" height="190"/>
        <rect x="650" y="490" width="45" height="110"/>
        <rect x="705" y="430" width="32" height="170"/>
        <rect x="745" y="460" width="50" height="140"/>
        <rect x="805" y="400" width="30" height="200"/>
        <rect x="845" y="480" width="40" height="120"/>
        <rect x="895" y="440" width="28" height="160"/>
        <rect x="935" y="470" width="48" height="130"/>
        <rect x="990" y="420" width="35" height="180"/>
        <rect x="1035" y="490" width="30" height="110"/>
        <rect x="1075" y="450" width="42" height="150"/>
        <rect x="1125" y="400" width="36" height="200"/>
        <rect x="1170" y="470" width="28" height="130"/>
        <rect x="1208" y="430" width="40" height="170"/>
        <rect x="1255" y="480" width="35" height="120"/>
      </g>
      <!-- antenna / towers -->
      <g stroke="#1a3050" stroke-width="2" fill="none">
        <line x1="160" y1="430" x2="160" y2="390"/>
        <line x1="448" y1="400" x2="448" y2="350"/>
        <line x1="820" y1="400" x2="820" y2="355"/>
        <line x1="1142" y1="400" x2="1142" y2="360"/>
      </g>
      <g fill="#3a6080">
        <circle cx="160" cy="388" r="2"/>
        <circle cx="448" cy="348" r="2.5"/>
        <circle cx="820" cy="353" r="2"/>
        <circle cx="1142" cy="358" r="2"/>
      </g>
    </g>
  </g>

  <!-- ========== L2 MID CITY (medium parallax) ========== -->
  <g id="L2-mid" filter="url(#softBlur)" opacity="0.85">
    <g id="L2-scroll">
      <g fill="#132a4a">
        <!-- block A -->
        <rect x="-20" y="500" width="70" height="140"/>

        <rect x="125" y="520" width="40" height="120"/>
        <rect x="175" y="440" width="80" height="200"/>

        <rect x="400" y="500" width="45" height="140"/>
        <rect x="455" y="450" width="75" height="190"/>
        <rect x="540" y="510" width="40" height="130"/>
        <rect x="590" y="430" width="60" height="210"/>
        <rect x="660" y="490" width="55" height="150"/>
        <rect x="725" y="410" width="70" height="230"/>
        <rect x="805" y="480" width="48" height="160"/>
        <rect x="865" y="440" width="85" height="200"/>
        <rect x="960" y="500" width="42" height="140"/>
        <rect x="1010" y="455" width="68" height="185"/>
        <rect x="1088" y="420" width="52" height="220"/>
        <rect x="1150" y="490" width="60" height="150"/>
        <rect x="1220" y="460" width="50" height="180"/>
      </g>
      <!-- lit windows -->
      <g fill="#e8a84a" opacity="0.75">
        <rect x="70" y="475" width="6" height="8"/><rect x="85" y="475" width="6" height="8"/>
        <rect x="70" y="500" width="6" height="8"/><rect x="100" y="520" width="6" height="8"/>
        <rect x="190" y="455" width="7" height="9"/><rect x="210" y="455" width="7" height="9"/>
        <rect x="230" y="480" width="7" height="9"/><rect x="190" y="510" width="7" height="9"/>
        <rect x="340" y="435" width="6" height="8"/><rect x="355" y="460" width="6" height="8"/>
        <rect x="370" y="490" width="6" height="8"/>
        <rect x="470" y="465" width="7" height="9"/><rect x="495" y="490" width="7" height="9"/>
        <rect x="515" y="515" width="7" height="9"/>
        <rect x="605" y="445" width="6" height="8"/><rect x="625" y="475" width="6" height="8"/>
        <rect x="740" y="425" width="7" height="9"/><rect x="765" y="455" width="7" height="9"/>
        <rect x="785" y="490" width="7" height="9"/><rect x="740" y="520" width="7" height="9"/>
        <rect x="880" y="455" width="7" height="9"/><rect x="910" y="480" width="7" height="9"/>
        <rect x="935" y="510" width="7" height="9"/>
        <rect x="1025" y="470" width="6" height="8"/><rect x="1045" y="500" width="6" height="8"/>
        <rect x="1105" y="435" width="7" height="9"/><rect x="1125" y="470" width="7" height="9"/>
        <rect x="1165" y="505" width="6" height="8"/><rect x="1235" y="480" width="6" height="8"/>
      </g>
      <!-- cool window accents -->
      <g fill="#7ec8e8" opacity="0.5">
        <rect x="80" y="540" width="5" height="7"/>
        <rect x="220" y="545" width="5" height="7"/>
        <rect x="480" y="540" width="5" height="7"/>
        <rect x="615" y="530" width="5" height="7"/>
        <rect x="755" y="550" width="5" height="7"/>
        <rect x="895" y="535" width="5" height="7"/>
        <rect x="1115" y="520" width="5" height="7"/>
      </g>
      <!-- rooftop beacons -->
      <g fill="#ff6060">
        <circle cx="95" cy="458" r="2.5" opacity="0.9"/>
        <circle cx="205" cy="438" r="2.5" opacity="0.7"/>
        <circle cx="355" cy="418" r="2.5" opacity="0.85"/>
        <circle cx="490" cy="448" r="2.5" opacity="0.65"/>
        <circle cx="620" cy="428" r="2.5" opacity="0.9"/>
        <circle cx="758" cy="408" r="2.5" opacity="0.7"/>
        <circle cx="905" cy="438" r="2.5" opacity="0.85"/>
        <circle cx="1112" cy="418" r="2.5" opacity="0.75"/>
      </g>
    </g>
  </g>

  <!-- ========== GUIDEWAY / TRACK (near-primary) ========== -->
  <g id="L3-guideway">
    <!-- distant pylon band -->
    <rect x="0" y="560" width="1280" height="160" fill="#0a1628"/>
    <!-- main elevated rail -->
    <rect x="0" y="530" width="1280" height="22" fill="url(#railGrad)"/>
    <rect x="0" y="528" width="1280" height="6" fill="#3d5a78" fill-opacity="0.9"/>
    <rect x="0" y="528" width="1280" height="4" fill="#6a8aaa" opacity="0.35"/>
    <rect x="0" y="550" width="1280" height="8" fill="#0c1520"/>
    <!-- mag-strip under rail -->
    <rect x="0" y="558" width="1280" height="4" fill="#3a6a90" opacity="0.4"/>
    <!-- scrolling sleepers / markers (LEFTWARD = forward-right of train) -->
    <g id="sleepers" fill="#1a2a3a">
      <rect x="0" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="80" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="160" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="240" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="320" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="400" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="480" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="560" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="640" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="720" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="800" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="880" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="960" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="1040" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="1120" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="1200" y="554" width="14" height="3" opacity="0.7"/>
      <rect x="1280" y="554" width="14" height="3" opacity="0.7"/>
    </g>
    <!-- pylons -->
    <g fill="#0e1a2a">
      <path d="M100,552 L100,720 L140,720 L140,552 Z"/>
      <path d="M380,552 L380,720 L420,720 L420,552 Z"/>
      <path d="M660,552 L660,720 L700,720 L700,552 Z"/>
      <path d="M940,552 L940,720 L980,720 L980,552 Z"/>
      <path d="M1180,552 L1180,720 L1220,720 L1220,552 Z"/>
    </g>
    <g fill="#1a2e44" opacity="0.6">
      <rect x="108" y="580" width="24" height="4"/>
      <rect x="388" y="580" width="24" height="4"/>
      <rect x="668" y="580" width="24" height="4"/>
      <rect x="948" y="580" width="24" height="4"/>
      <rect x="1188" y="580" width="24" height="4"/>
    </g>
  </g>

  <!-- ========== TRAIN GROUP (primary subject) ========== -->
  <g id="train-root">
    <!-- hull bob (subtle vertical, independent of limbs) -->
    <g id="train-bob">
      <!-- underglow / mag pads -->
      <g id="mag-pads">
        <ellipse cx="380" cy="522" rx="28" ry="6" fill="#4aa0d0" opacity="0.35" filter="url(#softBlur)"/>
        <ellipse cx="500" cy="522" rx="28" ry="6" fill="#4aa0d0" opacity="0.35" filter="url(#softBlur)"/>
        <ellipse cx="620" cy="522" rx="28" ry="6" fill="#4aa0d0" opacity="0.35" filter="url(#softBlur)"/>
        <!-- pad bodies -->
        <g fill="#1a3048" stroke="#3a6088" stroke-width="1.5">
          <rect x="358" y="508" width="44" height="14" rx="4"/>
          <rect x="478" y="508" width="44" height="14" rx="4"/>
          <rect x="598" y="508" width="44" height="14" rx="4"/>
        </g>
        <!-- spinning rim marks (clockwise, top-right for rightward travel) -->
        <g id="wheel-spins" stroke="#7ec8e8" stroke-width="1.8" fill="none" opacity="0.85">
          <g class="wheel-rot" data-tx="380" data-ty="515" transform="translate(380,515)">
            <circle r="7" cx="0" cy="0"/>
            <path d="M0,-7 L0,7 M-7,0 L7,0" stroke-width="1.5" opacity="0.7"/>
            <circle r="2" fill="#a0d8f0" stroke="none"/>
          </g>
          <g class="wheel-rot" data-tx="500" data-ty="515" transform="translate(500,515)">
            <circle r="7" cx="0" cy="0"/>
            <path d="M0,-7 L0,7 M-7,0 L7,0" stroke-width="1.5" opacity="0.7"/>
            <circle r="2" fill="#a0d8f0" stroke="none"/>
          </g>
          <g class="wheel-rot" data-tx="620" data-ty="515" transform="translate(620,515)">
            <circle r="7" cx="0" cy="0"/>
            <path d="M0,-7 L0,7 M-7,0 L7,0" stroke-width="1.5" opacity="0.7"/>
            <circle r="2" fill="#a0d8f0" stroke="none"/>
          </g>
        </g>
      </g>

      <!-- train body shadow -->
      <ellipse cx="530" cy="528" rx="220" ry="10" fill="#000" opacity="0.35" filter="url(#softBlur)"/>

      <!-- main hull -->
      <path d="M300,380 L300,250 Q300,230 325,228 L620,228 Q660,228 700,250 L740,280 Q755,292 755,310 L755,360 Q755,380 735,380 Z"
            fill="url(#trainShell)" stroke="#0a1520" stroke-width="2.5"/>
      <!-- nose cone (front = right) -->
      <path d="M700,250 L740,280 Q755,292 755,310 L755,360 Q755,380 735,380 L700,380 Z"
            fill="url(#trainNose)" stroke="#0a1520" stroke-width="2"/>
      <!-- nose windshield -->
      <path d="M708,268 L742,292 Q750,300 750,312 L750,348 Q750,358 740,358 L708,358 Z"
            fill="#1a4058" stroke="#5a8aaa" stroke-width="1.5" opacity="0.9"/>
      <path d="M715,275 L738,295 L738,320 L715,320 Z" fill="#7ec8e8" opacity="0.15"/>
      <!-- headlight beam -->
      <g id="headlight" opacity="0.9">
        <ellipse cx="752" cy="320" rx="10" ry="7" fill="#ffe090" filter="url(#glowSoft)"/>
        <path d="M760,318 L900,300 L900,340 L760,322 Z" fill="#ffd27a" opacity="0.12" filter="url(#softBlur)"/>
      </g>
      <!-- accent stripe -->
      <rect x="310" y="370" width="430" height="8" fill="#e8a84a" opacity="0.9"/>
      <rect x="310" y="362" width="430" height="3" fill="#ffd27a" opacity="0.35"/>
      <!-- door panel -->
      <rect x="330" y="280" width="36" height="90" rx="3" fill="#1a2a3c" stroke="#3a5a78" stroke-width="1.5"/>
      <line x1="348" y1="285" x2="348" y2="365" stroke="#3a5a78" stroke-width="1"/>
      <!-- rear (left) hatch -->
      <rect x="305" y="250" width="20" height="50" rx="2" fill="#0e1828" opacity="0.6"/>

      <!-- cabin window (gecko compartment) -->
      <rect x="430" y="268" width="175" height="88" rx="8" fill="#0a1828" stroke="#5a8aaa" stroke-width="2"/>
      <g clip-path="url(#cabClip)">
        <rect x="430" y="268" width="175" height="88" fill="url(#cabinGlow)"/>
        <!-- dashboard -->
        <rect x="430" y="340" width="175" height="28" fill="#1a2838"/>
        <g fill="#e8a84a" opacity="0.85">
          <rect x="445" y="348" width="8" height="5" rx="1"/>
          <rect x="458" y="348" width="8" height="5" rx="1"/>
          <rect x="471" y="348" width="8" height="5" rx="1"/>
        </g>
        <g fill="#7ec8e8" opacity="0.7">
          <rect x="490" y="348" width="6" height="5" rx="1"/>
          <rect x="500" y="348" width="6" height="5" rx="1"/>
        </g>
        <circle cx="560" cy="352" r="4" fill="#60e080" opacity="0.8"/>
        <circle cx="575" cy="352" r="4" fill="#e06060" opacity="0.7"/>

        <!-- ===== GECKO (inside cabin, relative motion parts) ===== -->
        <!-- tail (behind body, sways independently) -->
        <g id="gecko-tail" transform="translate(455,320)">
          <path d="M0,0 Q-25,8 -40,5 Q-55,2 -62,12 Q-70,25 -55,28 Q-40,30 -25,18 Q-10,8 0,5 Z"
                fill="url(#geckoSkin)" stroke="#2a5a35" stroke-width="1.2"/>
          <!-- toe pads on tail tip -->
          <circle cx="-58" cy="18" r="2.5" fill="#a8e090" opacity="0.7"/>
        </g>

        <!-- body / torso -->
        <g id="gecko-body">
          <ellipse cx="500" cy="310" rx="28" ry="22" fill="url(#geckoSkin)" stroke="#2a5a35" stroke-width="1.5"/>
          <ellipse cx="505" cy="318" rx="16" ry="12" fill="#c8e6a0" opacity="0.55"/>

          <ellipse cx="512" cy="312" rx="8" ry="6" fill="#a0d878" opacity="0.4"/>
        </g>

        <!-- head group (micro-look, independent) -->
        <g id="gecko-head" transform="translate(528,292)">
          <!-- neck -->
          <ellipse cx="-8" cy="8" rx="10" ry="8" fill="#5aaa60" stroke="#2a5a35" stroke-width="1"/>
          <!-- skull -->
          <ellipse cx="10" cy="0" rx="22" ry="16" fill="url(#geckoSkin)" stroke="#2a5a35" stroke-width="1.5"/>
          <!-- snout -->
          <ellipse cx="28" cy="4" rx="12" ry="9" fill="#6fbf73" stroke="#2a5a35" stroke-width="1"/>
          <!-- nostril -->
          <circle cx="36" cy="2" r="1.5" fill="#2a5a35"/>
          <!-- smile -->
          <path d="M22,10 Q30,14 36,8" fill="none" stroke="#2a5a35" stroke-width="1.2" stroke-linecap="round"/>
          <!-- eye (large gecko eye with lid) -->
          <g id="gecko-eye">
            <ellipse cx="14" cy="-2" rx="10" ry="11" fill="#f0d060" stroke="#2a5a35" stroke-width="1.2"/>
            <ellipse cx="16" cy="-2" rx="5" ry="7" fill="#1a2010"/>
            <circle cx="18" cy="-5" r="2" fill="#fff" opacity="0.7"/>
            <!-- eyelid for blink -->
            <ellipse id="eyelid" cx="14" cy="-2" rx="11" ry="0" fill="#5aaa60"/>
          </g>
          <!-- crest / scales -->
          <path d="M0,-12 Q8,-18 16,-14" fill="none" stroke="#3d7a48" stroke-width="1.5" stroke-linecap="round"/>
          <!-- ear hole -->
          <circle cx="0" cy="2" r="2" fill="#2a5a35" opacity="0.6"/>
        </g>

        <!-- front arms (steer lever — independent swing) -->
        <g id="gecko-arm-F">
          <!-- upper arm -->
          <g transform="translate(515,300)">
            <path d="M0,0 Q18,8 28,18" fill="none" stroke="#5aaa60" stroke-width="7" stroke-linecap="round"/>
            <path d="M0,0 Q18,8 28,18" fill="none" stroke="#8fd48a" stroke-width="3" stroke-linecap="round"/>
            <!-- hand + gecko toe pads -->
            <g transform="translate(28,18)">
              <ellipse cx="0" cy="0" rx="6" ry="4" fill="#5aaa60"/>
              <circle cx="-4" cy="2" r="2.2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.6"/>
              <circle cx="0" cy="3.5" r="2.2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.6"/>
              <circle cx="4" cy="2" r="2.2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.6"/>
            </g>
          </g>
        </g>

        <!-- steer lever (moves with arm) -->
        <g id="steer-lever" transform="translate(548,318)">
          <rect x="-3" y="-28" width="6" height="30" rx="2" fill="#3a5068"/>
          <circle cx="0" cy="-30" r="6" fill="#e8a84a" stroke="#8a6020" stroke-width="1.5"/>
        </g>

        <!-- hind leg (foot tap, independent phase) -->
        <g id="gecko-leg-H" transform="translate(480,325)">
          <path d="M0,0 Q-8,12 -4,20" fill="none" stroke="#4a9a50" stroke-width="8" stroke-linecap="round"/>
          <g transform="translate(-4,22)">
            <ellipse cx="0" cy="0" rx="7" ry="4" fill="#4a9a50"/>
            <circle cx="-5" cy="2" r="2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.5"/>
            <circle cx="-1" cy="3.5" r="2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.5"/>
            <circle cx="3" cy="3" r="2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.5"/>
            <circle cx="6" cy="1" r="2" fill="#a8e090" stroke="#3d7a48" stroke-width="0.5"/>
          </g>
        </g>

        <!-- seat back -->
        <rect x="448" y="280" width="14" height="50" rx="3" fill="#1a3040" opacity="0.7"/>
      </g>
      <!-- window frame highlight -->
      <rect x="430" y="268" width="175" height="88" rx="8" fill="none" stroke="#8ec8f0" stroke-width="1.2" opacity="0.4"/>

      <!-- passenger windows (rear) -->
      <g>
        <rect x="320" y="270" width="40" height="28" rx="4" fill="#1a4058" stroke="#3a5a78" stroke-width="1.5" opacity="0.85"/>
        <rect x="328" y="276" width="18" height="10" fill="#ffe0a0" opacity="0.12"/>
      </g>
      <!-- roof detail -->
      <rect x="340" y="222" width="200" height="10" rx="3" fill="#1a2a40"/>
      <rect x="360" y="218" width="40" height="6" rx="2" fill="#2a3f5c"/>
      <!-- pantograph / collector on roof -->
      <g id="collector" stroke="#5a7a9a" stroke-width="2" fill="none">
        <line x1="500" y1="222" x2="500" y2="200"/>
        <line x1="485" y1="200" x2="515" y2="200"/>
        <line x1="490" y1="200" x2="480" y2="192"/>
        <line x1="510" y1="200" x2="520" y2="192"/>
      </g>
      <!-- catenary wire above -->
      <line x1="0" y1="190" x2="1280" y2="190" stroke="#3a5a78" stroke-width="1.5" opacity="0.5"/>
      <line x1="0" y1="192" x2="1280" y2="192" stroke="#6a8aaa" stroke-width="0.6" opacity="0.3"/>

      <!-- side number / logo -->
      <text x="360" y="330" fill="#8ec8f0" font-size="11" font-family="Consolas,monospace" opacity="0.7" letter-spacing="1">GX-07</text>
    </g>
  </g>

  <!-- ========== L4 NEAR FOREGROUND (fastest parallax) ========== -->
  <g id="L4-near" opacity="0.9">
    <g id="L4-scroll">
      <!-- near poles whipping by -->
      <g fill="#050a12" filter="url(#nearBlur)">
        <rect x="40" y="200" width="18" height="520"/>
        <rect x="320" y="180" width="16" height="540"/>
        <rect x="600" y="210" width="20" height="510"/>
        <rect x="900" y="190" width="16" height="530"/>
        <rect x="1180" y="200" width="18" height="520"/>
      </g>
      <!-- signal lights on poles -->
      <g filter="url(#nearBlur)">
        <circle cx="49" cy="220" r="6" fill="#e04040" opacity="0.85"/>
        <circle cx="328" cy="200" r="5" fill="#40c060" opacity="0.7"/>
        <circle cx="610" cy="230" r="6" fill="#e0c040" opacity="0.8"/>
        <circle cx="908" cy="210" r="5" fill="#e04040" opacity="0.75"/>
        <circle cx="1189" cy="220" r="6" fill="#40c060" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- ========== SPEED STREAKS (motion cue, rightward travel) ========== -->
  <g id="speed-lines" stroke="#8ec8f0" stroke-linecap="round" opacity="0.35">
    <line class="streak" x1="0" y1="240" x2="40" y2="240" stroke-width="1.5"/>
    <line class="streak" x1="0" y1="300" x2="55" y2="300" stroke-width="1"/>
    <line class="streak" x1="0" y1="380" x2="35" y2="380" stroke-width="1.2"/>
    <line class="streak" x1="0" y1="450" x2="50" y2="450" stroke-width="1"/>
    <line class="streak" x1="0" y1="500" x2="30" y2="500" stroke-width="1.4"/>
  </g>

  <!-- ========== VIGNETTE ========== -->
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#vig)" pointer-events="none"/>
</svg>

<div id="hud"><strong>GX-07</strong> · gecko monorail · dusk line · right-bound</div>

<script>
(function () {
  "use strict";
  var t0 = performance.now();

  // ---- parallax scroll: clone layer once for seamless wrap ----
  function prepScroll(id, span) {
    var el = document.getElementById(id);
    if (!el) return null;
    var clone = el.cloneNode(true);
    clone.removeAttribute("id");
    clone.setAttribute("transform", "translate(" + span + ",0)");
    var parent = el.parentNode;
    var wrap = document.createElementNS("http://www.w3.org/2000/svg", "g");
    wrap.setAttribute("id", id + "-wrap");
    parent.insertBefore(wrap, el);
    wrap.appendChild(el);
    wrap.appendChild(clone);
    return { wrap: wrap, span: span };
  }

  // Layer speeds (px/s) — all scroll LEFT so train reads as moving RIGHT.
  var sFar     = prepScroll("L1-scroll",  1280); // ~18
  var sMid     = prepScroll("L2-scroll",  1280); // ~42
  var sNear    = prepScroll("L4-scroll",  1280); // ~160
  var sSleepers = prepScroll("sleepers",    80); // ~280

  var wheelRots = document.querySelectorAll(".wheel-rot");
  var streaks   = document.querySelectorAll(".streak");

  var head   = document.getElementById("gecko-head");
  var eyelid = document.getElementById("eyelid");
  var tail   = document.getElementById("gecko-tail");
  var armF   = document.getElementById("gecko-arm-F");
  var legH   = document.getElementById("gecko-leg-H");
  var lever  = document.getElementById("steer-lever");
  var bob    = document.getElementById("train-bob");

  var headBase = { x: 528, y: 292 };
  var tailBase = { x: 455, y: 320 };

  function loop(now) {
    var t = (now - t0) / 1000;

    // --- mag-pad wheels: clockwise (top moves right) = rightward travel ---
    var wheelDeg = (t * 420) % 360;
    for (var i = 0; i < wheelRots.length; i++) {
      var g = wheelRots[i];
      var tx = g.getAttribute("data-tx");
      var ty = g.getAttribute("data-ty");
      g.setAttribute("transform", "translate(" + tx + "," + ty + ") rotate(" + wheelDeg + ")");
    }

    // --- guideway sleepers scroll left ---
    if (sSleepers) {
      sSleepers.wrap.setAttribute("transform",
        "translate(" + (-((t * 280) % 80)) + ",0)");
    }

    // --- background parallax (far slow → near fast) ---
    if (sFar)  sFar.wrap.setAttribute("transform",
      "translate(" + (-((t * 18)  % 1280)) + ",0)");
    if (sMid)  sMid.wrap.setAttribute("transform",
      "translate(" + (-((t * 42)  % 1280)) + ",0)");
    if (sNear) sNear.wrap.setAttribute("transform",
      "translate(" + (-((t * 160) % 1280)) + ",0)");

    // --- speed streaks ---
    for (var s = 0; s < streaks.length; s++) {
      var speed = 400 + s * 70;
      var x = 1320 - ((t * speed + s * 200) % 1400);
      streaks[s].setAttribute("transform", "translate(" + x + ",0)");
    }

    // --- hull bob: small vertical + pitch about cabin center ---
    var bobY = Math.sin(t * 3.2) * 2.5;
    var bobR = Math.sin(t * 3.2 + 0.4) * 0.6;
    if (bob) {
      bob.setAttribute("transform",
        "translate(530,300) rotate(" + bobR + ") translate(-530," + (-300 + bobY) + ")");
    }

    // --- head micro-look (own phase, not hull-locked) ---
    var headLook = Math.sin(t * 1.7) * 5;
    var headNod  = Math.sin(t * 2.3 + 0.8) * 2;
    if (head) {
      head.setAttribute("transform",
        "translate(" + (headBase.x + headLook * 0.3) + "," + (headBase.y + headNod) +
        ") rotate(" + (headLook * 0.6) + ")");
    }

    // --- blink every ~2.7s ---
    var blinkCycle = t % 2.7;
    var lidRY = 0;
    if (blinkCycle < 0.12) {
      lidRY = (blinkCycle / 0.12) * 11;
    } else if (blinkCycle < 0.24) {
      lidRY = (1 - (blinkCycle - 0.12) / 0.12) * 11;
    }
    if (eyelid) eyelid.setAttribute("ry", lidRY.toFixed(2));

    // --- tail sway (lagging phase vs hull) ---
    var tailSwing = Math.sin(t * 2.8 - 0.6) * 12;
    var tailY     = Math.sin(t * 2.8 - 0.9) * 3;
    if (tail) {
      tail.setAttribute("transform",
        "translate(" + tailBase.x + "," + (tailBase.y + tailY) +
        ") rotate(" + tailSwing + ")");
    }

    // --- front arm steers lever (phase-offset from tail & hull) ---
    var armAng = Math.sin(t * 3.5) * 10;
    if (armF) {
      armF.setAttribute("transform",
        "rotate(" + armAng + " 515 300) translate(" + (armAng * 0.15) + " " + (armAng * 0.08) + ")");
    }
    if (lever) {
      var leverAng = Math.sin(t * 3.5 + 0.15) * 8;
      lever.setAttribute("transform", "translate(548,318) rotate(" + leverAng + ")");
    }

    // --- hind foot tap (near opposite phase of arm) ---
    var tap = Math.sin(t * 3.5 + Math.PI) * 4;
    if (legH) {
      legH.setAttribute("transform",
        "translate(480," + (325 + Math.min(0, tap) * 0.5) + ") rotate(" + (tap * 0.5) + " 480 325)");
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
