<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gecko Monorail · Neon Dusk Line</title>
<!--
  Self-contained creative scene — no CDN, no network, no frameworks.
  Subject: gecko conductor piloting a monorail toward frame-right.
  Motion notes mirror notes.md (geometry / parallax / appendages).
-->
<style>
  :root {
    --night: #07141f;
    --deep: #0d2436;
    --dusk: #1a3d55;
    --ember: #c45a28;
    --gold: #f0a04b;
    --lime: #7cb518;
    --lime-deep: #4f8a0e;
    --belly: #f0d060;
    --neon: #3de7e7;
    --pink: #ff4f9a;
    --steel: #8a9ba8;
    --body-shell: #e8eef2;
    --ink: #0a1218;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--night);
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at 50% 30%, #163248 0%, var(--night) 70%);
  }

  .frame {
    position: relative;
    width: min(100vw, 160vh);
    height: min(100vh, 62.5vw);
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(61, 231, 231, 0.18),
      0 30px 80px rgba(0, 0, 0, 0.55),
      0 0 90px rgba(61, 231, 231, 0.08);
  }

  svg#scene {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--night);
  }

  /* ---------- Parallax lanes (seamless dual-strip scroll) ---------- */
  @keyframes scroll-far   { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-mid   { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-near  { from { transform: translateX(0); }    to { transform: translateX(-800px); } }
  @keyframes scroll-rail  { from { transform: translateX(0); }    to { transform: translateX(-800px); } }

  .p-far   { animation: scroll-far  48s linear infinite; }
  .p-mid   { animation: scroll-mid  22s linear infinite; }
  .p-near  { animation: scroll-near 11s linear infinite; }
  .p-rail  { animation: scroll-rail  6s linear infinite; }

  /* Train advances conceptually to the right; world scrolls left under it. */
  .train-root {
    transform-box: fill-box;
    transform-origin: 50% 80%;
    animation: train-bob 2.4s ease-in-out infinite;
  }
  @keyframes train-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(4px); }
  }

  /* ---------- Gecko appendages (NOT locked to train translation) ---------- */
  .gecko-tail {
    transform-box: fill-box;
    transform-origin: 8% 50%;
    animation: tail-sway 1.7s ease-in-out infinite;
  }
  @keyframes tail-sway {
    0%, 100% { transform: rotate(-7deg) skewX(0deg); }
    50%      { transform: rotate(9deg) skewX(-3deg); }
  }

  .gecko-arm-l {
    transform-box: fill-box;
    transform-origin: 90% 20%;
    animation: arm-stir 1.15s ease-in-out infinite;
  }
  @keyframes arm-stir {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(12deg) translateY(-3px); }
  }

  .gecko-arm-r {
    transform-box: fill-box;
    transform-origin: 10% 20%;
    animation: arm-wave 2.1s ease-in-out infinite;
  }
  @keyframes arm-wave {
    0%, 100% { transform: rotate(4deg); }
    35%      { transform: rotate(-28deg) translateY(-6px); }
    70%      { transform: rotate(18deg); }
  }

  .gecko-head {
    transform-box: fill-box;
    transform-origin: 50% 85%;
    animation: head-nod 3.3s ease-in-out infinite;
  }
  @keyframes head-nod {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    40%      { transform: rotate(4deg) translateY(2px); }
    70%      { transform: rotate(-5deg) translateY(-2px); }
  }

  .gecko-leg-back {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: leg-tap 0.95s ease-in-out infinite;
  }
  @keyframes leg-tap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-8deg) translateY(2px); }
  }

  .eye-lid {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    transform: scaleY(0);
  }
  .eye-lid.blink {
    animation: blink 0.18s ease-in-out;
  }
  @keyframes blink {
    0%, 100% { transform: scaleY(0); }
    40%, 60% { transform: scaleY(1); }
  }

  .tongue {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    transform: scaleX(0);
    opacity: 0;
  }
  .tongue.flick {
    animation: tongue-flick 0.55s ease-out;
  }
  @keyframes tongue-flick {
    0%   { transform: scaleX(0); opacity: 0; }
    30%  { transform: scaleX(1); opacity: 1; }
    70%  { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(0); opacity: 0; }
  }

  /* ---------- Propulsion: rail wheels + thruster glow (forward = +X) ---------- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: spin-cw 0.55s linear infinite;
  }
  @keyframes spin-cw {
    to { transform: rotate(360deg); }
  }

  .thruster-core {
    animation: thruster-pulse 0.45s ease-in-out infinite;
  }
  @keyframes thruster-pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .thrust-stream {
    animation: stream-shift 0.35s linear infinite;
  }
  @keyframes stream-shift {
    from { transform: translateX(0); }
    to   { transform: translateX(-24px); }
  }

  .window-glow {
    animation: window-flicker 4.2s ease-in-out infinite;
  }
  @keyframes window-flicker {
    0%, 100% { opacity: 0.85; }
    48%      { opacity: 1; }
    52%      { opacity: 0.72; }
  }

  .star {
    animation: twinkle 3.8s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  .caption-bar {
    position: absolute;
    left: 18px;
    bottom: 14px;
    display: flex;
    gap: 14px;
    align-items: baseline;
    color: rgba(232, 238, 242, 0.78);
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.04em;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  .caption-bar .line-name {
    font-size: clamp(14px, 2.2vh, 22px);
    font-style: italic;
    color: var(--neon);
  }
  .caption-bar .dest {
    font-size: clamp(11px, 1.5vh, 14px);
    opacity: 0.75;
    font-family: system-ui, 'Segoe UI', sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce) {
    .p-far, .p-mid, .p-near, .p-rail,
    .train-root, .gecko-tail, .gecko-arm-l, .gecko-arm-r,
    .gecko-head, .gecko-leg-back, .wheel-spin, .thruster-core,
    .thrust-stream, .window-glow, .star {
      animation: none !important;
    }
  }
</style>
</head>

<script>
(function () {
  var lids = document.querySelectorAll('.eye-lid');
  var tongue = document.getElementById('tongue');

  function blink() {
    for (var i = 0; i < lids.length; i++) {
      lids[i].classList.remove('blink');
      // reflow to restart animation
      void lids[i].getBoundingClientRect();
      lids[i].classList.add('blink');
    }
    scheduleBlink();
  }

  function scheduleBlink() {
    var delay = 2200 + Math.random() * 3800;
    setTimeout(blink, delay);
  }

  function flickTongue() {
    if (!tongue) return;
    tongue.classList.remove('flick');
    void tongue.getBoundingClientRect();
    tongue.classList.add('flick');
    setTimeout(flickTongue, 5000 + Math.random() * 9000);
  }

  // Respect reduced motion: skip autonomous micro-anim scheduling
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    scheduleBlink();
    setTimeout(flickTongue, 3000);
  }
})();
</script>
