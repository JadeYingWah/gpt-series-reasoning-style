<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dolphin Trolleybus · SVG009</title>
<style>
  /* ========== self-contained: no external fonts / CDN / network ========== */
  :root {
    --sky-top: #0b1d36;
    --sky-mid: #1a3a5c;
    --sky-low: #e07a5f;
    --sky-glow: #f2cc8f;
    --ink: #0d1b2a;
    --bus-body: #2a9d8f;
    --bus-dark: #1f7a70;
    --bus-accent: #e9c46a;
    --bus-window: #a8dadc;
    --dolphin: #6c8ebf;
    --dolphin-light: #a8c0d6;
    --dolphin-belly: #e8eef5;
    --road: #1b2430;
    --road-mark: #f4e8c1;
    --wire: #c9d4de;
    --neon: #ff6b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06101c;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
  }

  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute;
    left: 18px;
    top: 16px;
    z-index: 20;
    color: #e8f1f8;
    background: rgba(8, 18, 32, 0.55);
    border: 1px solid rgba(168, 213, 230, 0.25);
    border-radius: 10px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
    font-size: 12px;
    line-height: 1.55;
    letter-spacing: 0.02em;
    max-width: min(340px, 70vw);
  }
  .hud strong { color: #f2cc8f; font-weight: 600; }
  .hud .tag {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(42, 157, 143, 0.35);
    border: 1px solid rgba(42, 157, 143, 0.6);
    font-size: 10px;
    text-transform: uppercase;
  }

  .badge {
    position: absolute;
    right: 16px;
    bottom: 14px;
    z-index: 20;
    color: rgba(232, 241, 248, 0.7);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ---------- Parallax scroll helpers (CSS animation on SVG groups) ---------- */
  @keyframes drift-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes drift-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-1800px); }
  }
  @keyframes drift-near {
    from { transform: translateX(0); }
    to   { transform: translateX(-2400px); }
  }
  @keyframes drift-road {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }

  .layer-far  { animation: drift-far  48s linear infinite; }
  .layer-mid  { animation: drift-mid  28s linear infinite; }
  .layer-near { animation: drift-near 16s linear infinite; }
  .layer-road { animation: drift-road  6s linear infinite; }

  /* Wheels: clockwise = vehicle advances to the right */
  @keyframes spin-wheel {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin-wheel 0.9s linear infinite;
  }

  /* Trolley poles: slight spring against wire */
  @keyframes pole-sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-1.6deg); }
  }
  .pole {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: pole-sway 1.8s ease-in-out infinite;
  }
  .pole-b { animation-delay: -0.35s; }

  /* Bus body: gentle chassis bob (vehicle frame only) */
  @keyframes bus-bob {
    0%, 100% { transform: translateY(0); }
    25%      { transform: translateY(-1.5px); }
    50%      { transform: translateY(0.8px); }
    75%      { transform: translateY(-0.6px); }
  }
  .bus-chassis {
    transform-box: fill-box;
    transform-origin: center;
    animation: bus-bob 1.1s ease-in-out infinite;
  }

  /* Dolphin body: independent of chassis — slight vertical bob + micro lean */
  @keyframes dolphin-bob {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    30%      { transform: translate(0.6px, -3.2px) rotate(-0.8deg); }
    60%      { transform: translate(-0.4px, 1.6px) rotate(0.5deg); }
  }
  .dolphin-torso {
    transform-box: fill-box;
    transform-origin: 50% 80%;
    animation: dolphin-bob 1.65s ease-in-out infinite;
  }

  /* Right flipper on steering wheel — rotates with wheel-ish path (different rate) */
  @keyframes flipper-steer {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-18deg); }
    50%      { transform: rotate(4deg); }
    75%      { transform: rotate(-12deg); }
  }
  .flipper-r {
    transform-box: fill-box;
    transform-origin: 85% 20%;
    animation: flipper-steer 1.35s ease-in-out infinite;
  }

  /* Left flipper: free wave — completely different phase & amplitude */
  @keyframes flipper-wave {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20%      { transform: rotate(-28deg) translateY(-2px); }
    45%      { transform: rotate(12deg) translateY(1px); }
    70%      { transform: rotate(-16deg) translateY(-1px); }
  }
  .flipper-l {
    transform-box: fill-box;
    transform-origin: 90% 30%;
    animation: flipper-wave 2.05s ease-in-out infinite;
    animation-delay: -0.6s;
  }

  /* Tail flukes: vertical flap, third independent rhythm */
  @keyframes tail-flap {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    35%      { transform: rotate(14deg) translateY(-4px); }
    70%      { transform: rotate(-10deg) translateY(2px); }
  }
  .tail {
    transform-box: fill-box;
    transform-origin: 100% 50%;
    animation: tail-flap 1.15s ease-in-out infinite;
    animation-delay: -0.2s;
  }

  /* Dorsal fin micro-flick */
  @keyframes dorsal-flick {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3deg); }
  }
  .dorsal {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: dorsal-flick 2.4s ease-in-out infinite;
  }

  /* Blowhole puff */
  @keyframes puff {
    0%   { opacity: 0; transform: translate(0,0) scale(0.4); }
    15%  { opacity: 0.85; }
    100% { opacity: 0; transform: translate(18px,-42px) scale(1.8); }
  }
  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 3.2s ease-out infinite;
  }
  .puff-b { animation-delay: -1.6s; }

  /* Headlight glow pulse */
  @keyframes lamp {
    0%, 100% { opacity: 0.75; }
    50%      { opacity: 1; }
  }
  .lamp-glow { animation: lamp 2.2s ease-in-out infinite; }

  /* Wire spark / current dash */
  @keyframes current {
    from { stroke-dashoffset: 40; }
    to   { stroke-dashoffset: 0; }
  }
  .wire-current {
    stroke-dasharray: 6 14;
    animation: current 0.55s linear infinite;
  }

  /* Star twinkle */
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }
  .star { animation: twinkle 3s ease-in-out infinite; }
  .star:nth-child(2n) { animation-duration: 4.2s; animation-delay: -1s; }
  .star:nth-child(3n) { animation-duration: 2.6s; animation-delay: -0.5s; }

  /* Bubble trail from bus */
  @keyframes bubble-rise {
    0%   { opacity: 0; transform: translate(0,0) scale(0.5); }
    20%  { opacity: 0.7; }
    100% { opacity: 0; transform: translate(-70px, -55px) scale(1.3); }
  }
  .bubble {
    transform-box: fill-box;
    transform-origin: center;
    animation: bubble-rise 2.8s ease-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .layer-far, .layer-mid, .layer-near, .layer-road,
    .wheel, .pole, .bus-chassis, .dolphin-torso,
    .flipper-r, .flipper-l, .tail, .dorsal, .puff,
    .lamp-glow, .wire-current, .star, .bubble {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<!--
  SVG009 · dolphin × trolleybus
  Self-consistency notes (also mirrored in notes.md):

  1) Forward direction = screen RIGHT.
     - Wheels use spin-wheel 0→360deg (clockwise) which is the correct
       rotation for rightward ground travel (contact point moves backward).
     - Road dashes + curb + skyline layers translate LEFT via drift-* keyframes,
       reinforcing relative motion to the right.
     - Trolley poles lean slightly rearward (left) against the overhead wires,
       matching forward travel.

  2) Dolphin appendages vs vehicle — NOT locked together:
     - .bus-chassis  bob period 1.10s
     - .dolphin-torso bob period 1.65s (different amplitude & phase)
     - .flipper-r (steering) 1.35s ease-in-out, origin at shoulder
     - .flipper-l (free wave) 2.05s, delayed -0.6s, larger amplitude
     - .tail flukes 1.15s, delayed -0.2s, vertical flap
     - .dorsal 2.4s micro-flick
     Five independent rhythms on the dolphin vs one chassis rhythm →
     at least two appendages always out of phase with the bus body.

  3) Parallax depth (3+ layers):
     L0 sky gradient + stars (static / near-static glow)
     L1 far skyline  drift 48s / 1200px
     L2 mid buildings + wires  drift 28s / 1800px
     L3 near street furniture  drift 16s / 2400px
     L4 road surface dashes    drift 6s / 800px
     Faster foreground = classic parallax.

  4) No external resources. All CSS/JS/SVG inline. Zero network requests.
-->
<div class="stage" id="stage">
  <div class="hud">
    <div><span class="tag">SVG009</span><strong>dolphin × trolleybus</strong></div>
    <div>Route 7 · Harbor Line · heading <strong>→ east</strong></div>
    <div>Click stage to honk / boost current.</div>
  </div>
  <div class="badge">single-file · no CDN · CSS+SVG</div>

    <defs>

      <!-- sea-sky band (surreal underwater sky) -->

      </linearGradient>

      <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">

        <stop offset="55%" stop-color="#f2cc8f"/>

      <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3db8a8"/>
        <stop offset="45%" stop-color="#2a9d8f"/>
        <stop offset="100%" stop-color="#1f7a70"/>
      </linearGradient>

      <linearGradient id="busRoof" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e9c46a"/>
        <stop offset="100%" stop-color="#c9a227"/>
      </linearGradient>

      <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d4f1f4"/>
        <stop offset="50%" stop-color="#a8dadc"/>
        <stop offset="100%" stop-color="#7ec8cc"/>
      </linearGradient>

      <linearGradient id="dolphinSkin" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#8fadcc"/>
        <stop offset="55%" stop-color="#6c8ebf"/>

      <linearGradient id="dolphinBelly" x1="0" y1="0" x2="0" y2="1">

      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">

        <stop offset="40%" stop-color="#1b2430"/>
        <stop offset="100%" stop-color="#121820"/>
      </linearGradient>

      <linearGradient id="headBeam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
      </linearGradient>

      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <filter id="tinyBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.2"/>
      </filter>

      <!-- wheel spoke group reused -->
      <g id="wheelArt">
        <circle r="52" fill="#1a222d" stroke="#2f3b4c" stroke-width="4"/>
        <circle r="38" fill="#243040" stroke="#3d4d63" stroke-width="2"/>
        <circle r="12" fill="#e9c46a" stroke="#b8892a" stroke-width="2"/>

        <g stroke="#5a6d86" stroke-width="3" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="-36"/>
          <line x1="0" y1="12"  x2="0" y2="36"/>
          <line x1="-12" y1="0" x2="-36" y2="0"/>
          <line x1="12" y1="0"  x2="36" y2="0"/>
          <line x1="-8.5" y1="-8.5" x2="-25.5" y2="-25.5"/>
          <line x1="8.5" y1="8.5"   x2="25.5" y2="25.5"/>
          <line x1="8.5" y1="-8.5"  x2="25.5" y2="-25.5"/>
          <line x1="-8.5" y1="8.5"  x2="-25.5" y2="25.5"/>
        </g>
        <!-- tire tread marks -->
        <circle r="46" fill="none" stroke="#0d1218" stroke-width="6" stroke-dasharray="10 6"/>
      </g>
    </defs>

    <!-- ========== L0 SKY ========== -->

    <!-- ========== L1 FAR SKYLINE ========== -->

<script>
/* Interactivity: honk + current boost. No network, no deps. */
(function () {
  var stage = document.getElementById('stage');
  var svg = stage.querySelector('svg');
  var wires = svg.querySelectorAll('.wire-current');
  var baseDur = [];

  wires.forEach(function (w) {
    baseDur.push(getComputedStyle(w).animationDuration);
  });

  var honkFlash = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  honkFlash.setAttribute('opacity', '0');
  honkFlash.innerHTML =
    '<text x="1200" y="360" text-anchor="middle" font-size="42" font-weight="700" ' +
    'fill="#f2cc8f" font-family="Segoe UI, sans-serif" filter="url(#softGlow)">HONK!</text>';
  // place near front of bus (hero at 620,390; nose ~+540 → ~1160)
  honkFlash.setAttribute('transform', 'translate(0,0)');
  svg.appendChild(honkFlash);

  var t = 0;
  stage.addEventListener('click', function () {
    // boost wire current briefly
    wires.forEach(function (w, i) {
      w.style.animationDuration = '0.18s';
      w.style.stroke = '#b8fff5';
    });
    // honk flash
    honkFlash.setAttribute('opacity', '1');
    clearTimeout(t);
    t = setTimeout(function () {
      wires.forEach(function (w, i) {
        w.style.animationDuration = baseDur[i];
        w.style.stroke = '';
      });
      honkFlash.setAttribute('opacity', '0');
    }, 700);
  });
})();
</script>
