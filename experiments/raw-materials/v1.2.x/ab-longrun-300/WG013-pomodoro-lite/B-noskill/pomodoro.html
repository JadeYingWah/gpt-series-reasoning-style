<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --fg: #1c1b19;
      --muted: #6b6560;
      --card: #ffffff;
      --accent: #c45c26;
      --accent-soft: #f3e2d6;
      --border: #e4dfd6;
      --ok: #2f6f4e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --fg: #f2efe8;
        --muted: #a39c92;
        --card: #1f1d1a;
        --accent: #e08a55;
        --accent-soft: #3a2a20;
        --border: #2e2b27;
        --ok: #7dba96;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .status {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      min-height: 1.4em;
    }
    .status.done {
      color: var(--ok);
      font-weight: 600;
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(48px, 14vw, 64px);
      font-weight: 650;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1;
      margin: 8px 0 22px;
      font-family: "SF Mono", "Cascadia Mono", Consolas, monospace;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      border-radius: 10px;
      padding: 10px 16px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      min-width: 88px;
    }
    button:hover:not(:disabled) { background: var(--accent-soft); }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.05); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .config {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
    .config label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      width: 72px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-variant-numeric: tabular-nums;
    }
    .hint {
      margin: 12px 0 0;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <h1 id="title">极简番茄钟</h1>
    <p class="status" id="status" aria-live="polite">就绪</p>
    <div class="display" id="display" role="timer" aria-live="off">25:00</div>

    <div class="controls">
      <button type="button" class="primary" id="toggleBtn">开始</button>
      <button type="button" id="resetBtn">重置</button>
    </div>

    <div class="config">
      <label for="minutesInput">时长（分钟）</label>
      <input
        id="minutesInput"
        type="number"
        min="1"
        max="60"
        step="1"
        value="25"
        inputmode="numeric"
        aria-describedby="minutesHint"
      />
      <button type="button" id="applyBtn">应用</button>
    </div>
    <p class="hint" id="minutesHint">范围 1–60 的正整数；运行中不可修改</p>
  </main>

  <script>
    "use strict";

    /**
     * 极简番茄钟核心逻辑（无外部依赖）。
     * 状态机: idle / running / paused / done
     */
    var DEFAULT_MINUTES = 25;
    var MIN_MINUTES = 1;
    var MAX_MINUTES = 60;

    var state = {
      mode: "idle",          // idle | running | paused | done
      durationMs: DEFAULT_MINUTES * 60 * 1000,
      remainingMs: DEFAULT_MINUTES * 60 * 1000,
      endAtMs: null,         // running 时的目标时间戳
      timerId: null
    };

    var displayEl = document.getElementById("display");
    var statusEl = document.getElementById("status");
    var toggleBtn = document.getElementById("toggleBtn");
    var resetBtn = document.getElementById("resetBtn");
    var minutesInput = document.getElementById("minutesInput");
    var applyBtn = document.getElementById("applyBtn");

    function clampMinutes(n) {
      if (!Number.isInteger(n)) return null;
      if (n < MIN_MINUTES || n > MAX_MINUTES) return null;
      return n;
    }

    function parseMinutes(raw) {
      if (raw == null || raw === "") return null;
      var n = Number(raw);
      if (!Number.isFinite(n)) return null;
      // 允许 "25" / "25.0" 这类整数值，禁止小数与非整
      if (!Number.isInteger(n)) return null;
      return clampMinutes(n);
    }

    function formatClock(ms) {
      if (ms < 0) ms = 0;
      var totalSec = Math.ceil(ms / 1000);
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }

    function setStatus(text, done) {
      statusEl.textContent = text;
      if (done) statusEl.classList.add("done");
      else statusEl.classList.remove("done");
    }

    function render() {
      displayEl.textContent = formatClock(state.remainingMs);

      if (state.mode === "idle") {
        toggleBtn.textContent = "开始";
        toggleBtn.disabled = false;
        resetBtn.disabled = true;
        minutesInput.disabled = false;
        applyBtn.disabled = false;
      } else if (state.mode === "running") {
        toggleBtn.textContent = "暂停";
        toggleBtn.disabled = false;
        resetBtn.disabled = false;
        minutesInput.disabled = true;
        applyBtn.disabled = true;
      } else if (state.mode === "paused") {
        toggleBtn.textContent = "继续";
        toggleBtn.disabled = false;
        resetBtn.disabled = false;
        minutesInput.disabled = true;
        applyBtn.disabled = true;
      } else if (state.mode === "done") {
        toggleBtn.textContent = "开始";
        toggleBtn.disabled = true; // 先重置或改时长再开
        resetBtn.disabled = false;
        minutesInput.disabled = false;
        applyBtn.disabled = false;
      }
    }

    function clearTick() {
      if (state.timerId != null) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function tick() {
      if (state.mode !== "running") return;
      var now = Date.now();
      state.remainingMs = state.endAtMs - now;
      if (state.remainingMs <= 0) {
        state.remainingMs = 0;
        state.mode = "done";
        clearTick();
        state.endAtMs = null;
        displayEl.textContent = "00:00";
        setStatus("时间到", true);
        beep();
        render();
        return;
      }
      displayEl.textContent = formatClock(state.remainingMs);
    }

    function start() {
      if (state.mode !== "idle" && state.mode !== "paused") return;
      if (state.remainingMs <= 0) return;
      state.mode = "running";
      state.endAtMs = Date.now() + state.remainingMs;
      clearTick();
      state.timerId = setInterval(tick, 200); // 200ms 轮询，抗节流漂移
      setStatus("运行中", false);
      render();
      tick();
    }

    function pause() {
      if (state.mode !== "running") return;
      state.remainingMs = Math.max(0, state.endAtMs - Date.now());
      state.mode = "paused";
      clearTick();
      state.endAtMs = null;
      setStatus("已暂停", false);
      render();
    }

    function reset() {
      clearTick();
      state.mode = "idle";
      state.endAtMs = null;
      state.remainingMs = state.durationMs;
      setStatus("就绪", false);
      render();
    }

    function applyDuration() {
      if (state.mode === "running" || state.mode === "paused") {
        setStatus("运行/暂停中不可改时长，请先重置", false);
        return;
      }
      var minutes = parseMinutes(minutesInput.value);
      if (minutes == null) {
        setStatus("请输入 1–60 的正整数分钟", false);
        minutesInput.focus();
        return;
      }
      state.durationMs = minutes * 60 * 1000;
      state.remainingMs = state.durationMs;
      state.mode = "idle";
      state.endAtMs = null;
      clearTick();
      setStatus("已设为 " + minutes + " 分钟", false);
      render();
    }

    /**
     * Web Audio 振荡器短提示音。
     * 若浏览器策略/不支持导致失败则静默忽略（降级为纯视觉「时间到」）。
     */
    function beep() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        var ctx = new AC();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
        osc.onended = function () {
          try { ctx.close(); } catch (e) { /* ignore */ }
        };
      } catch (e) {
        // 静默失败：状态文案「时间到」仍保证可见
      }
    }

    toggleBtn.addEventListener("click", function () {
      if (state.mode === "running") pause();
      else if (state.mode === "idle" || state.mode === "paused") start();
    });

    resetBtn.addEventListener("click", reset);
    applyBtn.addEventListener("click", applyDuration);

    minutesInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        applyDuration();
      }
    });

    // 初始渲染
    render();
  </script>
</body>
</html>
