<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Puffin Bulldozer · SVG011</title>
<!--
  Geometry / motion notes (also mirrored in notes.md):
  1) Tread contact marks scroll right→left at vehicle ground speed;
     vehicle advances right → tread bottom surface must appear to move
     leftward relative to the chassis (rolling without slip).
  2) Puffin appendages with relative motion vs chassis:
     - wings (both) flap / grip the control levers
     - head bobs slightly (neck pivot)
     - tail feathers fan with vibration
  3) Parallax layers (back→front):
     far sky + sun, mid dunes/hills, near scrub + ground streaks.
     Each layer translates leftward; near layer is fastest.
-->
<style>
  :root {
    --ink: #1a1f2e;
    --sand: #e8c87a;
    --sand-deep: #c9953e;
    --sky-top: #4a7ab5;
    --sky-mid: #7eb3e8;
    --sky-low: #f4d9a0;
    --puffin-beak: #f26b2b;
    --puffin-beak-tip: #d4451a;
    --dozer-body: #e8a020;
    --dozer-dark: #b87410;
    --dozer-mid: #d49218;
    --track: #2a2e38;
    --metal: #6a7280;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1f2e;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #stage {
    width: min(100vw, 1400px);
    height: min(72vh, 720px);
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  svg#scene {
    width: 100%;
    height: 100%;
    display: block;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-low) 78%);
  }
  /* ---------- vehicle bob (whole machine + rider) ---------- */
  #dozer-rig {
    transform-box: fill-box;
    transform-origin: 50% 80%;
    animation: chassisBob 0.55s ease-in-out infinite;
  }
  @keyframes chassisBob {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(0.4px, -1.6px) rotate(0.25deg); }
    50%      { transform: translate(0, 0.6px) rotate(-0.15deg); }
    75%      { transform: translate(-0.3px, -1.2px) rotate(0.2deg); }
  }

  /* ---------- tracks / treads ---------- */
  /* Contact surface slides LEFT (vehicle moves RIGHT). */
  .tread-belt {
    animation: beltScroll 0.7s linear infinite;
  }
  @keyframes beltScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-28px); }
  }
  .road-wheel {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    /* forward (rightward) drive → clockwise on screen */
    animation: wheelSpin 0.7s linear infinite;
  }
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- puffin relative motion ---------- */
  #puffin-root {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: riderBounce 0.55s ease-in-out infinite;
  }
  @keyframes riderBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5px); }
  }
  #puffin-head {
    transform-box: fill-box;
    transform-origin: 50% 90%;
    animation: headBob 1.1s ease-in-out infinite;
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(-3deg) translateY(0); }
    50%      { transform: rotate(4deg) translateY(-1.5px); }
  }
  .wing-left {
    transform-box: fill-box;
    transform-origin: 90% 30%;
    animation: wingL 0.55s ease-in-out infinite;
  }
  .wing-right {
    transform-box: fill-box;
    transform-origin: 10% 30%;
    animation: wingR 0.55s ease-in-out infinite;
  }
  @keyframes wingL {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(12deg); }
  }
  @keyframes wingR {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-10deg); }
  }
  #puffin-tail {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: tailFan 0.35s ease-in-out infinite;
  }
  @keyframes tailFan {
    0%, 100% { transform: rotate(0deg) scaleX(1); }
    50%      { transform: rotate(-6deg) scaleX(0.92); }
  }

  /* ---------- parallax loops ---------- */
  /* Each layer is drawn twice (A+B) and slid left; seamless tile. */
  .parallax-far  { animation: slideFar 48s linear infinite; }
  .parallax-mid  { animation: slideMid 28s linear infinite; }
  .parallax-near { animation: slideNear 12s linear infinite; }
  @keyframes slideFar  { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @keyframes slideMid  { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @keyframes slideNear { from { transform: translateX(0); } to { transform: translateX(-1400px); } }

  /* dust puffs */
  .dust {
    animation: dustPuff 0.7s linear infinite;
    opacity: 0;
  }
  .dust:nth-child(2) { animation-delay: 0.18s; }
  .dust:nth-child(3) { animation-delay: 0.36s; }
  .dust:nth-child(4) { animation-delay: 0.54s; }
  @keyframes dustPuff {
    0%   { opacity: 0.7; transform: translate(0,0) scale(0.4); }
    70%  { opacity: 0.25; }
    100% { opacity: 0; transform: translate(-70px, -28px) scale(1.6); }
  }

  /* exhaust smoke */
  .smoke {
    animation: smokeUp 1.6s ease-out infinite;
    opacity: 0;
  }
  .smoke:nth-child(2) { animation-delay: 0.5s; }
  .smoke:nth-child(3) { animation-delay: 1.0s; }
  @keyframes smokeUp {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.3); }
    100% { opacity: 0; transform: translate(8px, -55px) scale(1.8); }
  }

  /* blade scrape shimmer */
  #blade-edge {
    animation: bladeGlint 2.2s ease-in-out infinite;
  }
  @keyframes bladeGlint {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A puffin driving a yellow bulldozer to the right across a sunlit coastal dune">
  <defs>
    <!-- gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3d6fa8"/>
      <stop offset="45%" stop-color="#7eb3e8"/>
      <stop offset="78%" stop-color="#f0d09a"/>
      <stop offset="100%" stop-color="#e8b86a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6c8"/>
      <stop offset="100%" stop-color="#ffc85a"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9e6a"/>
      <stop offset="100%" stop-color="#5f7348"/>
    </linearGradient>
    <linearGradient id="duneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="55%" stop-color="#d4a84e"/>
      <stop offset="100%" stop-color="#b88830"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c040"/>
      <stop offset="45%" stop-color="#e8a020"/>
      <stop offset="100%" stop-color="#c87a10"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8cdd6"/>
      <stop offset="50%" stop-color="#8a929e"/>
      <stop offset="100%" stop-color="#5a6270"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a404c"/>
      <stop offset="100%" stop-color="#1a1e26"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a40"/>
      <stop offset="50%" stop-color="#f26b2b"/>
      <stop offset="100%" stop-color="#d4451a"/>
    </linearGradient>
    <radialGradient id="cheekGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8dce4"/>
    </radialGradient>
    <!-- track pattern (grouser bars) -->
    <pattern id="treadPattern" width="28" height="36" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="28" height="36" fill="none"/>
      <rect x="2" y="4"  width="8" height="28" rx="2" fill="#4a5260" opacity="0.85"/>
      <rect x="14" y="8" width="6" height="20" rx="2" fill="#3a4250" opacity="0.7"/>
    </pattern>
    <!-- clip for track belt -->
    <clipPath id="trackClip">
      <path d="M 520 520
               Q 520 470 570 460
               L 720 460
               Q 780 460 780 500
               L 780 540
               Q 780 575 730 575
               L 560 575
               Q 520 575 520 540 Z"/>
    </clipPath>
    <!-- soft ground shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ===================== SKY + SUN (static base) ===================== -->
  <rect width="1400" height="720" fill="url(#skyGrad)"/>
  <circle cx="1120" cy="160" r="78" fill="url(#sunGrad)" opacity="0.95"/>
  <circle cx="1120" cy="160" r="110" fill="#ffd87a" opacity="0.18"/>
  <circle cx="1120" cy="160" r="150" fill="#ffd87a" opacity="0.08"/>
  <!-- static birds (far, tiny) -->
  <g stroke="#2a3344" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M 200 120 q 8 -8 16 0"/>
    <path d="M 240 145 q 6 -6 12 0"/>
    <path d="M 180 160 q 7 -7 14 0"/>
    <path d="M 980 90 q 8 -8 16 0"/>
  </g>

  <!-- ===================== FAR PARALLAX: distant hills ===================== -->
  <g class="parallax-far">
    <!-- tile A -->
    <g>
      <path d="M0 420 Q120 340 280 390 T560 370 T840 400 T1120 360 T1400 390 L1400 520 L0 520 Z"
            fill="#6a8a9a" opacity="0.55"/>
      <path d="M80 410 Q200 350 340 400 T620 385 T900 410 T1180 375 T1400 400"
            fill="none" stroke="#5a7a8a" stroke-width="3" opacity="0.3"/>
    </g>
    <!-- tile B (duplicate for seamless loop) -->
    <g transform="translate(1400,0)">
      <path d="M0 420 Q120 340 280 390 T560 370 T840 400 T1120 360 T1400 390 L1400 520 L0 520 Z"
            fill="#6a8a9a" opacity="0.55"/>
      <path d="M80 410 Q200 350 340 400 T620 385 T900 410 T1180 375 T1400 400"
            fill="none" stroke="#5a7a8a" stroke-width="3" opacity="0.3"/>
    </g>
  </g>

  <!-- ===================== MID PARALLAX: coastal dunes / scrub ===================== -->
  <g class="parallax-mid">
    <g>
      <!-- mid hill band -->
      <path d="M0 480
               C 100 430, 200 450, 320 440
               C 460 428, 560 460, 700 450
               C 860 438, 980 470, 1120 455
               C 1240 442, 1320 460, 1400 450
               L1400 720 L0 720 Z"
            fill="url(#hillGrad)"/>
      <!-- distant trees / shrubs -->
      <g fill="#4a6a3a">
        <ellipse cx="140" cy="455" rx="28" ry="22"/>
        <ellipse cx="168" cy="462" rx="18" ry="14"/>
        <ellipse cx="480" cy="445" rx="32" ry="24"/>
        <ellipse cx="510" cy="452" rx="20" ry="16"/>
        <ellipse cx="860" cy="452" rx="30" ry="22"/>
        <ellipse cx="1180" cy="448" rx="36" ry="26"/>
        <ellipse cx="1210" cy="455" rx="22" ry="16"/>
      </g>
      <!-- tiny cottage -->
      <g transform="translate(640,420)">
        <rect x="0" y="10" width="36" height="22" fill="#c4b8a0"/>
        <polygon points="0,10 18,-4 36,10" fill="#8a4a3a"/>
        <rect x="14" y="18" width="8" height="14" fill="#5a4030"/>
      </g>
    </g>
    <g transform="translate(1400,0)">
      <path d="M0 480
               C 100 430, 200 450, 320 440
               C 460 428, 560 460, 700 450
               C 860 438, 980 470, 1120 455
               C 1240 442, 1320 460, 1400 450
               L1400 720 L0 720 Z"
            fill="url(#hillGrad)"/>
      <g fill="#4a6a3a">
        <ellipse cx="140" cy="455" rx="28" ry="22"/>
        <ellipse cx="168" cy="462" rx="18" ry="14"/>
        <ellipse cx="480" cy="445" rx="32" ry="24"/>
        <ellipse cx="510" cy="452" rx="20" ry="16"/>
        <ellipse cx="860" cy="452" rx="30" ry="22"/>
        <ellipse cx="1180" cy="448" rx="36" ry="26"/>
        <ellipse cx="1210" cy="455" rx="22" ry="16"/>
      </g>
      <g transform="translate(640,420)">
        <rect x="0" y="10" width="36" height="22" fill="#c4b8a0"/>
        <polygon points="0,10 18,-4 36,10" fill="#8a4a3a"/>
        <rect x="14" y="18" width="8" height="14" fill="#5a4030"/>
      </g>
    </g>
  </g>

  <!-- ===================== NEAR GROUND ===================== -->
  <g class="parallax-near">
    <g>
      <!-- dune / sand floor -->
      <path d="M0 520
               C 180 500, 360 530, 540 515
               C 740 498, 920 530, 1100 512
               C 1240 500, 1340 520, 1400 515
               L1400 720 L0 720 Z"
            fill="url(#duneGrad)"/>
      <!-- sand texture streaks -->
      <g stroke="#b88830" stroke-width="2" opacity="0.35" fill="none" stroke-linecap="round">
        <path d="M40 560 q80 -8 160 0 t160 4"/>
        <path d="M420 590 q90 -10 180 2 t180 -4"/>
        <path d="M100 640 q120 -12 240 0 t240 6"/>
        <path d="M700 620 q100 -8 200 2"/>
        <path d="M1000 570 q80 -6 160 4 t140 -2"/>
      </g>
      <!-- near scrub bushes -->
      <g>
        <g transform="translate(80,500)">
          <ellipse cx="0" cy="0" rx="34" ry="22" fill="#5a7a3a"/>
          <ellipse cx="18" cy="6" rx="20" ry="14" fill="#6a8a4a"/>
          <ellipse cx="-14" cy="4" rx="16" ry="12" fill="#4a6a2e"/>
        </g>
        <g transform="translate(520,495)">
          <ellipse cx="0" cy="0" rx="40" ry="26" fill="#4a7038"/>
          <ellipse cx="22" cy="8" rx="24" ry="16" fill="#5a8040"/>
          <ellipse cx="-18" cy="6" rx="18" ry="13" fill="#3a6028"/>
        </g>
        <g transform="translate(980,505)">
          <ellipse cx="0" cy="0" rx="30" ry="20" fill="#5a7a3a"/>
          <ellipse cx="16" cy="5" rx="18" ry="12" fill="#6a8a4a"/>
        </g>
        <g transform="translate(1280,498)">
          <ellipse cx="0" cy="0" rx="36" ry="24" fill="#4a7038"/>
          <ellipse cx="20" cy="7" rx="22" ry="15" fill="#5a8040"/>
        </g>
      </g>
      <!-- ground speed streaks (foreground rocks / debris) -->
      <g fill="#a07830" opacity="0.7">
        <ellipse cx="200" cy="600" rx="10" ry="4"/>
        <ellipse cx="360" cy="630" rx="8" ry="3"/>
        <ellipse cx="640" cy="610" rx="12" ry="4"/>
        <ellipse cx="900" cy="640" rx="9" ry="3"/>
        <ellipse cx="1140" cy="605" rx="11" ry="4"/>
      </g>
    </g>
    <g transform="translate(1400,0)">
      <path d="M0 520
               C 180 500, 360 530, 540 515
               C 740 498, 920 530, 1100 512
               C 1240 500, 1340 520, 1400 515
               L1400 720 L0 720 Z"
            fill="url(#duneGrad)"/>
      <g stroke="#b88830" stroke-width="2" opacity="0.35" fill="none" stroke-linecap="round">
        <path d="M40 560 q80 -8 160 0 t160 4"/>
        <path d="M420 590 q90 -10 180 2 t180 -4"/>
        <path d="M100 640 q120 -12 240 0 t240 6"/>
        <path d="M700 620 q100 -8 200 2"/>
        <path d="M1000 570 q80 -6 160 4 t140 -2"/>
      </g>
      <g>
        <g transform="translate(80,500)">
          <ellipse cx="0" cy="0" rx="34" ry="22" fill="#5a7a3a"/>
          <ellipse cx="18" cy="6" rx="20" ry="14" fill="#6a8a4a"/>
          <ellipse cx="-14" cy="4" rx="16" ry="12" fill="#4a6a2e"/>
        </g>
        <g transform="translate(520,495)">
          <ellipse cx="0" cy="0" rx="40" ry="26" fill="#4a7038"/>
          <ellipse cx="22" cy="8" rx="24" ry="16" fill="#5a8040"/>
          <ellipse cx="-18" cy="6" rx="18" ry="13" fill="#3a6028"/>
        </g>
        <g transform="translate(980,505)">
          <ellipse cx="0" cy="0" rx="30" ry="20" fill="#5a7a3a"/>
          <ellipse cx="16" cy="5" rx="18" ry="12" fill="#6a8a4a"/>
        </g>
        <g transform="translate(1280,498)">
          <ellipse cx="0" cy="0" rx="36" ry="24" fill="#4a7038"/>
          <ellipse cx="20" cy="7" rx="22" ry="15" fill="#5a8040"/>
        </g>
      </g>
      <g fill="#a07830" opacity="0.7">
        <ellipse cx="200" cy="600" rx="10" ry="4"/>
        <ellipse cx="360" cy="630" rx="8" ry="3"/>
        <ellipse cx="640" cy="610" rx="12" ry="4"/>
        <ellipse cx="900" cy="640" rx="9" ry="3"/>
        <ellipse cx="1140" cy="605" rx="11" ry="4"/>
      </g>
    </g>
  </g>

  <!-- ground contact shadow (static-ish under vehicle) -->
  <ellipse cx="680" cy="575" rx="200" ry="18" fill="#6a4a20" opacity="0.35" filter="url(#softShadow)"/>

  <!-- ===================== BULLDOZER + PUFFIN ===================== -->
  <g id="dozer-rig">
    <!-- ===== TRACK ASSEMBLY ===== -->
    <g id="track-assembly">
      <!-- outer track housing -->
      <path d="M 520 520
               Q 520 470 570 460
               L 720 460
               Q 780 460 780 500
               L 780 540
               Q 780 575 730 575
               L 560 575
               Q 520 575 520 540 Z"
            fill="url(#trackGrad)" stroke="#12151c" stroke-width="3"/>

      <!-- scrolling tread pattern inside clip -->
      <g clip-path="url(#trackClip)">
        <g class="tread-belt">
          <!-- pattern duplicated horizontally for continuous scroll -->
          <rect x="480" y="450" width="400" height="140" fill="url(#treadPattern)"/>
          <rect x="880" y="450" width="400" height="140" fill="url(#treadPattern)"/>
        </g>
      </g>

      <!-- road wheels (spin clockwise = forward) -->
      <g class="road-wheel">
        <circle cx="560" cy="530" r="28" fill="#2a303c" stroke="#4a5260" stroke-width="3"/>
        <circle cx="560" cy="530" r="10" fill="#8a92a0"/>
        <!-- spokes to show rotation -->
        <line x1="560" y1="510" x2="560" y2="550" stroke="#6a7280" stroke-width="3"/>
        <line x1="540" y1="530" x2="580" y2="530" stroke="#6a7280" stroke-width="3"/>
      </g>
      <g class="road-wheel" style="animation-delay:-0.2s">
        <circle cx="640" cy="530" r="28" fill="#2a303c" stroke="#4a5260" stroke-width="3"/>
        <circle cx="640" cy="530" r="10" fill="#8a92a0"/>
        <line x1="640" y1="510" x2="640" y2="550" stroke="#6a7280" stroke-width="3"/>
        <line x1="620" y1="530" x2="660" y2="530" stroke="#6a7280" stroke-width="3"/>
      </g>
      <g class="road-wheel" style="animation-delay:-0.4s">
        <circle cx="720" cy="530" r="28" fill="#2a303c" stroke="#4a5260" stroke-width="3"/>
        <circle cx="720" cy="530" r="10" fill="#8a92a0"/>
        <line x1="720" y1="510" x2="720" y2="550" stroke="#6a7280" stroke-width="3"/>
        <line x1="700" y1="530" x2="740" y2="530" stroke="#6a7280" stroke-width="3"/>
      </g>
      <!-- idler / sprocket (front-right smaller visual emphasis) -->
      <circle cx="760" cy="500" r="18" fill="#3a4250" stroke="#5a6270" stroke-width="2"/>
      <circle cx="760" cy="500" r="6" fill="#9aa2b0"/>
      <!-- rear idler -->
      <circle cx="540" cy="500" r="16" fill="#3a4250" stroke="#5a6270" stroke-width="2"/>
      <circle cx="540" cy="500" r="5" fill="#9aa2b0"/>
    </g>

    <!-- ===== REAR CHASSIS / ENGINE DECK ===== -->
    <!-- main body block -->
    <rect x="600" y="390" width="200" height="90" rx="10" fill="url(#bodyGrad)" stroke="#9a6010" stroke-width="2.5"/>
    <!-- engine hood (rear, left side of image) -->
    <rect x="560" y="400" width="70" height="70" rx="8" fill="var(--dozer-dark)" stroke="#8a5808" stroke-width="2"/>
    <!-- engine grille lines -->
    <g stroke="#6a4008" stroke-width="2" opacity="0.7">
      <line x1="570" y1="415" x2="620" y2="415"/>
      <line x1="570" y1="425" x2="620" y2="425"/>
      <line x1="570" y1="435" x2="620" y2="435"/>
      <line x1="570" y1="445" x2="620" y2="445"/>
    </g>
    <!-- exhaust stack -->
    <g>
      <rect x="580" y="340" width="14" height="65" rx="3" fill="#4a5260" stroke="#2a303c" stroke-width="1.5"/>
      <rect x="576" y="332" width="22" height="12" rx="3" fill="#3a4250"/>
      <!-- smoke -->
      <g transform="translate(587,330)">
        <circle class="smoke" cx="0" cy="0" r="8" fill="#b0b8c4"/>
        <circle class="smoke" cx="2" cy="0" r="7" fill="#c0c8d4"/>
        <circle class="smoke" cx="-2" cy="0" r="9" fill="#a8b0bc"/>
      </g>
    </g>
    <!-- fuel tank / side panel with rivets -->
    <rect x="650" y="400" width="90" height="40" rx="4" fill="var(--dozer-mid)" stroke="#9a6010" stroke-width="1.5"/>
    <g fill="#8a5808" opacity="0.6">
      <circle cx="660" cy="410" r="2"/>
      <circle cx="680" cy="410" r="2"/>
      <circle cx="700" cy="410" r="2"/>
      <circle cx="720" cy="410" r="2"/>
      <circle cx="660" cy="430" r="2"/>
      <circle cx="680" cy="430" r="2"/>
      <circle cx="700" cy="430" r="2"/>

<script>
/* Light interaction: click / tap boosts engine (temporarily speeds all loops).
   Pure enhancement — page works without JS. */
(function () {
  var svg = document.getElementById('scene');
  if (!svg) return;
  var boosted = false;
  var root = document.documentElement;

  function setSpeed(mult) {
    root.style.setProperty('--loop-mult', mult);
    // Directly poke animation durations via a class on <body>
    if (mult < 1) {
      document.body.classList.add('turbo');
    } else {
      document.body.classList.remove('turbo');
    }
  }

  /* Turbo styles injected once */
  var style = document.createElement('style');
  style.textContent = [
    'body.turbo .tread-belt { animation-duration: 0.35s !important; }',
    'body.turbo .road-wheel { animation-duration: 0.35s !important; }',
    'body.turbo #dozer-rig { animation-duration: 0.28s !important; }',
    'body.turbo #puffin-root { animation-duration: 0.28s !important; }',
    'body.turbo #puffin-head { animation-duration: 0.55s !important; }',
    'body.turbo .wing-left, body.turbo .wing-right { animation-duration: 0.28s !important; }',
    'body.turbo .parallax-far { animation-duration: 24s !important; }',
    'body.turbo .parallax-mid { animation-duration: 14s !important; }',
    'body.turbo .parallax-near { animation-duration: 6s !important; }',
    'body.turbo .dust { animation-duration: 0.35s !important; }',
    'body.turbo .smoke { animation-duration: 0.8s !important; }',
  ].join('\n');
  document.head.appendChild(style);

  var turboTimer = null;
  function boost() {
    document.body.classList.add('turbo');
    clearTimeout(turboTimer);
    turboTimer = setTimeout(function () {
      document.body.classList.remove('turbo');
    }, 2200);
  }
  svg.addEventListener('click', boost);
  svg.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') boost();
  });
  svg.setAttribute('tabindex', '0');
})();
</script>
