<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Narwhal Hovercraft · Arctic Dash</title>
<style>
  :root {
    --sky-top: #0b1035;
    --sky-mid: #1a2a5e;
    --sky-low: #2d4a7a;
    --aurora-a: #3dffa8;
    --aurora-b: #5ec8ff;
    --aurora-c: #b388ff;
    --ice: #c8e7f5;
    --ice-deep: #6a9bb8;
    --hull: #1e6f8c;
    --hull-dark: #0f3d52;
    --hull-light: #3da8c9;
    --accent: #ff8a3d;
    --accent-hot: #ffc14d;
    --skirt: #2a4860;
    --skin: #5b8fad;
    --skin-light: #7eb3d0;
    --tusk: #f0e6c8;
    --foam: rgba(220, 245, 255, 0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050814;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 420px;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }

  .sky-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 70% 15%, rgba(94, 200, 255, 0.18), transparent 55%),
      linear-gradient(180deg,
        var(--sky-top) 0%,
        var(--sky-mid) 38%,
        var(--sky-low) 62%,
        #1a3048 78%,
        #0d1a28 100%);
    z-index: 0;
  }

  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------- Parallax layers (z-index depth) ---------- */
  .layer-stars  { z-index: 1; animation: drift-x 80s linear infinite; }
  .layer-aurora { z-index: 2; animation: drift-x 55s linear infinite, aurora-sway 12s ease-in-out infinite; }
  .layer-far    { z-index: 3; animation: drift-x 36s linear infinite; }
  .layer-mid    { z-index: 4; animation: drift-x 18s linear infinite; }
  .layer-water  { z-index: 5; }
  .layer-near   { z-index: 6; animation: drift-x 7s linear infinite; }
  .layer-craft  { z-index: 7; }
  .layer-fx     { z-index: 8; }

  /* Content moves LEFT so craft (facing right) appears to advance rightward */
  @keyframes drift-x {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  @keyframes aurora-sway {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  /* ---------- Scene content containers (doubled for seamless loop) ---------- */
  .strip {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
  }

  .strip > svg {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
  }

  .strip > svg.a { left: 0; }
  .strip > svg.b { left: 50%; }

  /* ---------- Craft rig ---------- */
  .craft-rig {
    position: absolute;
    left: 18%;
    top: 52%;
    width: min(520px, 62vw);
    height: auto;
    transform: translateY(-50%);
    filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.45));
  }

  .craft-body {
    animation: hover-bob 1.6s ease-in-out infinite;
    transform-origin: 50% 70%;
  }

  @keyframes hover-bob {
    0%   { transform: translateY(0) rotate(-0.4deg); }
    50%  { transform: translateY(-7px) rotate(0.5deg); }
    100% { transform: translateY(0) rotate(-0.4deg); }
  }

  .skirt-left,
  .skirt-right,
  .skirt-mid {
    animation: skirt-flutter 0.55s ease-in-out infinite;
  }
  .skirt-right { animation-delay: -0.18s; }
  .skirt-mid   { animation-delay: -0.36s; }

  @keyframes skirt-flutter {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(2.5px) scaleY(0.92); }
  }

  .prop-blades {
    animation: prop-spin 0.28s linear infinite;
    transform-origin: 78px 88px;
  }

  @keyframes prop-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .air-stream {
    animation: stream-pulse 0.45s ease-in-out infinite;
  }
  @keyframes stream-pulse {
    0%, 100% { opacity: 0.25; transform: translateX(0); }
    50%      { opacity: 0.7;  transform: translateX(-8px); }
  }

  /* ---------- Narwhal relative motion (independent of hull lock) ---------- */
  .n-body {
    animation: n-bob 1.15s ease-in-out infinite;
    transform-origin: 50% 60%;
  }
  @keyframes n-bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-3.5px) rotate(1.2deg); }
  }

  .n-tail {
    animation: n-tail-swish 0.7s ease-in-out infinite;
    transform-origin: 92% 48%;
  }
  @keyframes n-tail-swish {
    0%, 100% { transform: rotate(-10deg) translateY(0); }
    50%      { transform: rotate(14deg) translateY(2px); }
  }

  .n-flipper-far {
    animation: n-flip-far 0.9s ease-in-out infinite;
    transform-origin: 80% 20%;
  }
  @keyframes n-flip-far {
    0%, 100% { transform: rotate(8deg); }
    50%      { transform: rotate(-18deg); }
  }

  .n-flipper-near {
    animation: n-flip-near 0.9s ease-in-out infinite;
    animation-delay: -0.45s;
    transform-origin: 20% 30%;
  }
  @keyframes n-flip-near {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(22deg); }
  }

  .n-tusk {
    animation: n-tusk-nod 1.15s ease-in-out infinite;
    transform-origin: 18% 70%;
  }
  @keyframes n-tusk-nod {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(4deg); }
  }

  .n-blink {
    animation: blink 4.2s step-end infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { opacity: 1; }
    94%, 96%      { opacity: 0.05; }
  }

  /* ---------- Wake / spray particles ---------- */
  .wake-dot {
    animation: wake-rush 1.1s linear infinite;
  }
  @keyframes wake-rush {
    0%   { opacity: 0; transform: translateX(0) scale(0.4); }
    15%  { opacity: 0.85; }
    100% { opacity: 0; transform: translateX(-140px) scale(1.15); }
  }

  .hud {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 20;
    color: rgba(200, 230, 245, 0.55);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  .speed-lines line {
    animation: speed-dash 0.6s linear infinite;
  }
  @keyframes speed-dash {
    0%   { opacity: 0; stroke-dashoffset: 40; }
    30%  { opacity: 0.6; }
    100% { opacity: 0; stroke-dashoffset: -20; }
  }
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="A narwhal pilots a hovercraft speeding right across an arctic sea under aurora">
  <div class="sky-gradient"></div>

  <!-- ========== LAYER 1: Stars (farthest parallax) ========== -->
  <div class="layer layer-stars">
    <div class="strip">
      <svg class="a" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="#e8f4ff">
          <circle cx="80" cy="60" r="1.4" opacity="0.9"/><circle cx="200" cy="110" r="1" opacity="0.6"/>
          <circle cx="340" cy="40" r="1.6" opacity="0.85"/><circle cx="480" cy="90" r="1.1" opacity="0.5"/>
          <circle cx="610" cy="30" r="1.3" opacity="0.75"/><circle cx="740" cy="120" r="1.5" opacity="0.8"/>
          <circle cx="880" cy="55" r="1" opacity="0.55"/><circle cx="1020" cy="100" r="1.7" opacity="0.9"/>
          <circle cx="1120" cy="45" r="1.2" opacity="0.7"/><circle cx="150" cy="180" r="1" opacity="0.45"/>
          <circle cx="420" cy="160" r="1.3" opacity="0.65"/><circle cx="690" cy="200" r="1.1" opacity="0.5"/>
          <circle cx="950" cy="170" r="1.4" opacity="0.7"/><circle cx="280" cy="240" r="0.9" opacity="0.4"/>
          <circle cx="560" cy="250" r="1.2" opacity="0.55"/><circle cx="830" cy="230" r="1" opacity="0.45"/>
          <circle cx="1100" cy="210" r="1.3" opacity="0.6"/><circle cx="60" cy="280" r="1.1" opacity="0.4"/>
          <circle cx="1000" cy="300" r="1" opacity="0.35"/><circle cx="250" cy="80" r="0.8" opacity="0.5"/>
        </g>
        <!-- faint distant moon -->
        <circle cx="980" cy="90" r="22" fill="#dfe9f5" opacity="0.12"/>
        <circle cx="972" cy="84" r="18" fill="#1a2a5e" opacity="0.35"/>
      </svg>
      <svg class="b" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g fill="#e8f4ff">
          <circle cx="80" cy="60" r="1.4" opacity="0.9"/><circle cx="200" cy="110" r="1" opacity="0.6"/>
          <circle cx="340" cy="40" r="1.6" opacity="0.85"/><circle cx="480" cy="90" r="1.1" opacity="0.5"/>
          <circle cx="610" cy="30" r="1.3" opacity="0.75"/><circle cx="740" cy="120" r="1.5" opacity="0.8"/>
          <circle cx="880" cy="55" r="1" opacity="0.55"/><circle cx="1020" cy="100" r="1.7" opacity="0.9"/>
          <circle cx="1120" cy="45" r="1.2" opacity="0.7"/><circle cx="150" cy="180" r="1" opacity="0.45"/>
          <circle cx="420" cy="160" r="1.3" opacity="0.65"/><circle cx="690" cy="200" r="1.1" opacity="0.5"/>
          <circle cx="950" cy="170" r="1.4" opacity="0.7"/><circle cx="280" cy="240" r="0.9" opacity="0.4"/>
          <circle cx="560" cy="250" r="1.2" opacity="0.55"/><circle cx="830" cy="230" r="1" opacity="0.45"/>
          <circle cx="1100" cy="210" r="1.3" opacity="0.6"/><circle cx="60" cy="280" r="1.1" opacity="0.4"/>
          <circle cx="1000" cy="300" r="1" opacity="0.35"/><circle cx="250" cy="80" r="0.8" opacity="0.5"/>
        </g>
        <circle cx="980" cy="90" r="22" fill="#dfe9f5" opacity="0.12"/>
        <circle cx="972" cy="84" r="18" fill="#1a2a5e" opacity="0.35"/>
      </svg>
    </div>
  </div>

  <!-- ========== LAYER 2: Aurora ribbons ========== -->
  <div class="layer layer-aurora">
    <div class="strip">
      <svg class="a" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="ag1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3dffa8" stop-opacity="0"/>
            <stop offset="35%" stop-color="#3dffa8" stop-opacity="0.35"/>
            <stop offset="70%" stop-color="#5ec8ff" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="ag2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#7af0d0" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
          </linearGradient>
          <filter id="aurora-blur" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>
        <path d="M0,140 C180,80 320,200 500,120 C680,40 820,180 1000,100 C1100,70 1160,110 1200,90 L1200,160 C1040,200 900,120 760,170 C600,230 420,100 260,160 C140,200 60,170 0,190 Z"
              fill="url(#ag1)" filter="url(#aurora-blur)"/>
        <path d="M0,200 C200,150 360,240 560,180 C760,120 900,230 1100,170 C1160,155 1180,165 1200,160 L1200,220 C1050,250 920,190 780,230 C620,280 440,170 280,220 C160,255 60,230 0,250 Z"
              fill="url(#ag2)" filter="url(#aurora-blur)"/>
      </svg>
      <svg class="b" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="ag1b" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3dffa8" stop-opacity="0"/>
            <stop offset="35%" stop-color="#3dffa8" stop-opacity="0.35"/>
            <stop offset="70%" stop-color="#5ec8ff" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="ag2b" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#7af0d0" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#b388ff" stop-opacity="0"/>
          </linearGradient>
          <filter id="aurora-blur-b" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>
        <path d="M0,140 C180,80 320,200 500,120 C680,40 820,180 1000,100 C1100,70 1160,110 1200,90 L1200,160 C1040,200 900,120 760,170 C600,230 420,100 260,160 C140,200 60,170 0,190 Z"
              fill="url(#ag1b)" filter="url(#aurora-blur-b)"/>
        <path d="M0,200 C200,150 360,240 560,180 C760,120 900,230 1100,170 C1160,155 1180,165 1200,160 L1200,220 C1050,250 920,190 780,230 C620,280 440,170 280,220 C160,255 60,230 0,250 Z"
              fill="url(#ag2b)" filter="url(#aurora-blur-b)"/>
      </svg>
    </div>
  </div>

  <!-- ========== LAYER 3: Far icebergs / mountains ========== -->
  <div class="layer layer-far">
    <div class="strip">
      <svg class="a" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="bergA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8eb8d4"/>
            <stop offset="55%" stop-color="#5a8eae"/>
            <stop offset="100%" stop-color="#2a4a66"/>
          </linearGradient>
          <linearGradient id="bergB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a8cfe0"/>
            <stop offset="40%" stop-color="#6a9bb8"/>
            <stop offset="100%" stop-color="#1e3a50"/>
          </linearGradient>
        </defs>
        <!-- distant berg cluster 1 -->
        <path d="M0,420 L40,360 L90,380 L140,300 L200,340 L250,280 L310,360 L360,330 L420,400 L420,420 Z" fill="url(#bergA)" opacity="0.55"/>
        <path d="M140,300 L175,330 L200,340 L250,280 L280,320 L250,300 Z" fill="#d4eef8" opacity="0.5"/>
        <!-- distant berg cluster 2 -->
        <path d="M480,410 L540,340 L600,370 L680,290 L760,350 L820,310 L900,390 L900,410 Z" fill="url(#bergB)" opacity="0.5"/>
        <path d="M680,290 L720,330 L760,350 L820,310 L850,340 L820,320 L760,340 Z" fill="#e0f2fa" opacity="0.45"/>
        <!-- distant berg cluster 3 -->
        <path d="M960,420 L1020,350 L1080,380 L1140,320 L1200,370 L1200,420 Z" fill="url(#bergA)" opacity="0.48"/>
        <path d="M1140,320 L1170,350 L1200,370 L1200,350 L1160,335 Z" fill="#d4eef8" opacity="0.4"/>
        <!-- horizon haze -->
        <rect x="0" y="400" width="1200" height="30" fill="url(#horizonFade)" opacity="0.3"/>
        <defs>
          <linearGradient id="horizonFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0.4"/>
          </linearGradient>
        </defs>
      </svg>
      <svg class="b" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="bergAb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8eb8d4"/>
            <stop offset="55%" stop-color="#5a8eae"/>
            <stop offset="100%" stop-color="#2a4a66"/>
          </linearGradient>
          <linearGradient id="bergBb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a8cfe0"/>
            <stop offset="40%" stop-color="#6a9bb8"/>
            <stop offset="100%" stop-color="#1e3a50"/>
          </linearGradient>
        </defs>
        <path d="M0,420 L40,360 L90,380 L140,300 L200,340 L250,280 L310,360 L360,330 L420,400 L420,420 Z" fill="url(#bergAb)" opacity="0.55"/>
        <path d="M140,300 L175,330 L200,340 L250,280 L280,320 L250,300 Z" fill="#d4eef8" opacity="0.5"/>
        <path d="M480,410 L540,340 L600,370 L680,290 L760,350 L820,310 L900,390 L900,410 Z" fill="url(#bergBb)" opacity="0.5"/>
        <path d="M680,290 L720,330 L760,350 L820,310 L850,340 L820,320 L760,340 Z" fill="#e0f2fa" opacity="0.45"/>
        <path d="M960,420 L1020,350 L1080,380 L1140,320 L1200,370 L1200,420 Z" fill="url(#bergAb)" opacity="0.48"/>
        <path d="M1140,320 L1170,350 L1200,370 L1200,350 L1160,335 Z" fill="#d4eef8" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- ========== LAYER 4: Mid ice floes ========== -->
  <div class="layer layer-mid">
    <div class="strip">
      <svg class="a" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="floe" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c8e7f5"/>
            <stop offset="100%" stop-color="#7aadca"/>
          </linearGradient>
        </defs>
        <!-- mid-distance floes sitting near waterline ~455 -->
        <ellipse cx="100" cy="458" rx="70" ry="10" fill="url(#floe)" opacity="0.7"/>
        <ellipse cx="160" cy="462" rx="40" ry="7" fill="#9ec8dc" opacity="0.55"/>
        <ellipse cx="380" cy="455" rx="90" ry="12" fill="url(#floe)" opacity="0.65"/>
        <ellipse cx="460" cy="460" rx="35" ry="6" fill="#a8d0e4" opacity="0.5"/>
        <ellipse cx="700" cy="458" rx="55" ry="9" fill="url(#floe)" opacity="0.6"/>
        <ellipse cx="920" cy="452" rx="80" ry="11" fill="url(#floe)" opacity="0.7"/>
        <ellipse cx="1000" cy="460" rx="45" ry="7" fill="#9ec8dc" opacity="0.5"/>
        <ellipse cx="1140" cy="456" rx="60" ry="8" fill="url(#floe)" opacity="0.55"/>
        <!-- tiny berg tips poking up -->
        <path d="M300,450 L320,420 L340,450 Z" fill="#d0eaf5" opacity="0.7"/>
        <path d="M820,448 L845,415 L870,448 Z" fill="#d0eaf5" opacity="0.65"/>
      </svg>
      <svg class="b" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="floeb" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c8e7f5"/>
            <stop offset="100%" stop-color="#7aadca"/>
          </linearGradient>
        </defs>
        <ellipse cx="100" cy="458" rx="70" ry="10" fill="url(#floeb)" opacity="0.7"/>
        <ellipse cx="160" cy="462" rx="40" ry="7" fill="#9ec8dc" opacity="0.55"/>
        <ellipse cx="380" cy="455" rx="90" ry="12" fill="url(#floeb)" opacity="0.65"/>
        <ellipse cx="460" cy="460" rx="35" ry="6" fill="#a8d0e4" opacity="0.5"/>
        <ellipse cx="700" cy="458" rx="55" ry="9" fill="url(#floeb)" opacity="0.6"/>
        <ellipse cx="920" cy="452" rx="80" ry="11" fill="url(#floeb)" opacity="0.7"/>
        <ellipse cx="1000" cy="460" rx="45" ry="7" fill="#9ec8dc" opacity="0.5"/>
        <ellipse cx="1140" cy="456" rx="60" ry="8" fill="url(#floeb)" opacity="0.55"/>
        <path d="M300,450 L320,420 L340,450 Z" fill="#d0eaf5" opacity="0.7"/>
        <path d="M820,448 L845,415 L870,448 Z" fill="#d0eaf5" opacity="0.65"/>
      </svg>
    </div>
  </div>

  <!-- ========== LAYER 5: Water body (static + internal wave anim) ========== -->
  <div class="layer layer-water">
    <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">
      <defs>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a4a68"/>
          <stop offset="30%" stop-color="#0f3048"/>
          <stop offset="100%" stop-color="#061420"/>
        </linearGradient>
        <linearGradient id="waterSheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5ec8ff" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#5ec8ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- water surface -->
      <path d="M0,455 Q80,448 160,455 T320,455 T480,455 T640,455 T800,455 T960,455 T1120,455 T1280,455 L1280,700 L0,700 Z"
            fill="url(#waterGrad)"/>
      <!-- animated surface highlights -->
      <g opacity="0.35">
        <path d="M0,458 Q100,450 200,458 T400,458 T600,458 T800,458 T1000,458 T1200,458"
              fill="none" stroke="#7ec8e8" stroke-width="1.5">
          <animate attributeName="d"
            values="M0,458 Q100,450 200,458 T400,458 T600,458 T800,458 T1000,458 T1200,458;
                    M0,458 Q100,466 200,458 T400,458 T600,458 T800,458 T1000,458 T1200,458;
                    M0,458 Q100,450 200,458 T400,458 T600,458 T800,458 T1000,458 T1200,458"
            dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M0,480 Q150,472 300,480 T600,480 T900,480 T1200,480"
              fill="none" stroke="#3a8aaa" stroke-width="1.2" opacity="0.6">

<!--
  ========== GEOMETRY & MOTION NOTES (self-consistency) ==========

  DIRECTION:
  - Craft nose / headlight / tusk all point RIGHT (+X).
  - Background layers translate LEFT (drift-x to -50%), so relative motion
    is craft advancing rightward across the landscape.
  - Propeller is mounted at the REAR (left side of the hull). Its axis is
    along the craft's longitudinal axis. Blades spin; air-stream streaks
    extend further LEFT (backward), matching thrust that drives the craft
    RIGHT. This is Newton-3 consistent: fan accelerates air aft → craft
    pushed forward.

  PROPULSION (no wheels/tracks — this is a hovercraft):
  - Lift: cushion mist + skirt flutter under the hull (air cushion).
  - Thrust: rear ducted propeller, CSS rotation 360° / 0.28s, plus
    .air-stream paths animating leftward.
  - Skirt pleats (.skirt-left/mid/right) flutter on independent phase
    offsets (0 / -0.18s / -0.36s) so the bag breathes rather than
    vibrating as one rigid piece.

  NARWHAL RELATIVE MOTION (≥2 independent appendages, not body-locked):
  1. .n-tail   — tail flukes swish ±10–14° at 0.7s, origin at fluke root.
  2. .n-flipper-near — pectoral flipper paddles ±6–22° at 0.9s.
  3. .n-flipper-far  — far flipper counter-phase.
  4. .n-tusk   — tusk nods ±2–4° at hull-independent 1.15s.
  5. .n-body   — torso bobs/rotates at 1.15s vs hull bob at 1.6s
     (different period → non-synchronous, not a single rigid translate).
  6. Scarf streamer SVG-animate at 0.8s (another independent phase).

  PARALLAX (≥2 layers, implemented as 5 moving + 1 water + 1 fx):
  - Stars      : 80s / full width  (farthest, slowest)
  - Aurora     : 55s
  - Far bergs  : 36s
  - Mid floes  : 18s
  - Near foam  : 7s   (fastest ground plane)
  Each strip is 200% width with two identical SVG tiles (a/b) so the
  translateX(-50%) loop is seamless. Craft is position:fixed relative
  to viewport (does not parallax), reinforcing “we ride with the craft”.

  NO EXTERNAL RESOURCES:
  - Single HTML file, inline CSS + SVG only.
  - No fonts, images, scripts, or CDN references.
-->
