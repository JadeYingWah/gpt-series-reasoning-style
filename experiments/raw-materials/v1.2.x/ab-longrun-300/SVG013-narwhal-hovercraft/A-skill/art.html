<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Narwhal Courier · Arctic Hover Express</title>
<!--
  SVG013-narwhal-hovercraft
  Geometry / motion self-consistency (see also notes.md):
  - Forward direction: RIGHT (+X). Thruster blades rotate CW when viewed from
    starboard so thrust pushes craft forward-right. Skirt spray trails LEFT.
  - Parallax layers (far → near, scroll speed ascending):
    L0 stars/aurora, L1 far icebergs, L2 mid floes, L3 water body,
    L4 foreground mist, L5 craft+narwhal (hero).
  - Relative motion vs vehicle:
    * narwhal torso bob (phase-offset from hull bob)
    * pectoral flippers flap independently
    * tail flukes sway left-right (not locked to hull)
    * tusk slight nod, eye blink timer
    * hull pitch/roll + thruster spin + skirt pulse (vehicle-local)
-->
<style>
  :root {
    --ink: #0b1a2e;
    --deep: #071422;
    --sea: #0d3a55;
    --sea2: #145a7a;
    --ice: #cfeef8;
    --ice2: #9fd4e8;
    --aurora: #5dffb0;
    --aurora2: #7a6cff;
    --aurora3: #ff6ad5;
    --hull: #1c2b3d;
    --hull2: #2f4258;
    --accent: #ffd166;
    --glass: #9be7ff;
    --skin: #4a6f8a;
    --skin2: #6a94b0;
    --belly: #d7eef8;
    --tusk: #f4f0e6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--deep);
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ice);
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% 0%, #132a44 0%, #0a1828 45%, #050d16 100%);
  }

  svg#scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- UI chrome ---------- */
  .hud {
    position: absolute;
    left: 18px; top: 16px;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
  }
  .hud h1 {
    font-size: clamp(16px, 2.2vw, 22px);
    font-weight: 700;
    letter-spacing: .04em;
    background: linear-gradient(90deg, #e8fbff, #9be7ff 40%, #b8a7ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud p {
    margin-top: 4px;
    font-size: clamp(11px, 1.4vw, 13px);
    opacity: .72;
    letter-spacing: .02em;
  }

  .badge {
    position: absolute;
    right: 18px; top: 16px;
    z-index: 10;
    pointer-events: none;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 6px 10px;
    border: 1px solid rgba(155, 231, 255, .35);
    border-radius: 999px;
    background: rgba(7, 20, 34, .45);
    backdrop-filter: blur(6px);
    color: #b8e8ff;
  }

  .hint {
    position: absolute;
    left: 50%; bottom: 18px;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 12px;
    letter-spacing: .04em;
    opacity: .55;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ---------- SVG animation classes ---------- */

  /* L0 aurora ribbons — slow drift + opacity breathe */
  @keyframes auroraDrift {
    0%   { transform: translateX(0) skewX(0deg); }
    50%  { transform: translateX(-40px) skewX(2deg); }
    100% { transform: translateX(0) skewX(0deg); }
  }
  @keyframes auroraGlow {
    0%, 100% { opacity: .45; }
    50%      { opacity: .85; }
  }
  .aurora-a { animation: auroraDrift 18s ease-in-out infinite, auroraGlow 7s ease-in-out infinite; }
  .aurora-b { animation: auroraDrift 24s ease-in-out infinite reverse, auroraGlow 9s ease-in-out infinite 1s; }
  .aurora-c { animation: auroraDrift 21s ease-in-out infinite, auroraGlow 11s ease-in-out infinite .5s; }

  @keyframes twinkle {
    0%, 100% { opacity: .25; }
    50%      { opacity: .95; }
  }
  .star { animation: twinkle 3.5s ease-in-out infinite; }

  /* Parallax cloud / iceberg drift (CSS fallback; JS also drives transform) */
  @keyframes scrollFar {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes scrollMid {
    from { transform: translateX(0); }
    to   { transform: translateX(-1600px); }
  }
  @keyframes scrollNear {
    from { transform: translateX(0); }
    to   { transform: translateX(-2200px); }
  }
  @keyframes scrollWater {
    from { transform: translateX(0); }
    to   { transform: translateX(-800px); }
  }
  @keyframes scrollMist {
    from { transform: translateX(0); }
    to   { transform: translateX(-2600px); }
  }

  #layer-far  { animation: scrollFar  48s linear infinite; }
  #layer-mid  { animation: scrollMid  32s linear infinite; }
  #layer-near { animation: scrollNear 20s linear infinite; }
  #layer-water{ animation: scrollWater 14s linear infinite; }
  #layer-mist { animation: scrollMist 10s linear infinite; }

  /* Water sparkle */
  @keyframes sparkle {
    0%, 100% { opacity: .15; transform: scaleX(1); }
    50%      { opacity: .7;  transform: scaleX(1.3); }
  }
  .spark { animation: sparkle 2.8s ease-in-out infinite; }

  /* ---- Vehicle group: hull bob + slight pitch (NOT pure translation) ---- */
  @keyframes hullBob {
    0%   { transform: translateY(0)   rotate(0.4deg); }
    25%  { transform: translateY(-5px) rotate(-0.6deg); }
    50%  { transform: translateY(1px)  rotate(0.2deg); }
    75%  { transform: translateY(-3px) rotate(-0.35deg); }
    100% { transform: translateY(0)   rotate(0.4deg); }
  }
  #craft {
    transform-origin: 400px 360px;
    animation: hullBob 2.4s ease-in-out infinite;
  }

  /* Thruster spin — CW from starboard → thrust toward +X (right) */
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  #propeller {
    transform-origin: 118px 0px; /* relative to thruster group */
    animation: spinCW 0.55s linear infinite;
  }

  /* Skirt pulse — hover cushion breathing */
  @keyframes skirtPulse {
    0%, 100% { transform: scaleY(1)    translateY(0); opacity: .9; }
    50%      { transform: scaleY(1.08) translateY(2px); opacity: 1; }
  }
  #skirt {
    transform-origin: center bottom;
    animation: skirtPulse 1.1s ease-in-out infinite;
  }

  /* Cushion glow */
  @keyframes cushionGlow {
    0%, 100% { opacity: .35; }
    50%      { opacity: .75; }
  }
  #cushion-glow { animation: cushionGlow 1.1s ease-in-out infinite; }

  /* Exhaust / thrust cone flicker */
  @keyframes thrustFlicker {
    0%, 100% { opacity: .55; transform: scaleX(1); }
    40%      { opacity: .9;  transform: scaleX(1.15); }
    70%      { opacity: .4;  transform: scaleX(0.85); }
  }
  #thrust-flame {
    transform-origin: left center;
    animation: thrustFlicker 0.28s ease-in-out infinite;
  }

  /* ---- NARWHAL relative motions (phase-offset from hull) ---- */
  @keyframes narwhalBob {
    0%   { transform: translateY(0)   rotate(-0.8deg); }
    30%  { transform: translateY(-6px) rotate(0.5deg); }
    60%  { transform: translateY(2px)  rotate(-0.3deg); }
    100% { transform: translateY(0)   rotate(-0.8deg); }
  }
  #narwhal-body {
    transform-origin: 200px 40px;
    animation: narwhalBob 1.9s ease-in-out infinite; /* different period than hull 2.4s */
  }

  /* Pectoral flippers — independent flap */
  @keyframes flipperL {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-28deg); }
  }
  @keyframes flipperR {
    0%, 100% { transform: rotate(8deg); }
    50%      { transform: rotate(32deg); }
  }
  #flipper-far {
    transform-origin: 150px 55px;
    animation: flipperL 1.35s ease-in-out infinite;
  }
  #flipper-near {
    transform-origin: 155px 48px;
    animation: flipperR 1.35s ease-in-out infinite 0.25s;
  }

  /* Tail flukes — lateral sway, NOT locked to hull */
  @keyframes tailSway {
    0%   { transform: rotate(-14deg) translateX(0); }
    50%  { transform: rotate(12deg)  translateX(-4px); }
    100% { transform: rotate(-14deg) translateX(0); }
  }
  #tail {
    transform-origin: 40px 50px;
    animation: tailSway 1.6s ease-in-out infinite;
  }

  /* Tusk nod — subtle */
  @keyframes tuskNod {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(3deg); }
  }
  #tusk {
    transform-origin: 0px 20px;
    animation: tuskNod 2.1s ease-in-out infinite;
  }

  /* Eye blink — lid open (scaleY 0) almost always, closed (scaleY 1) briefly */
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    95%, 97%      { transform: scaleY(1); }
  }
  #eye-lid {
    transform-origin: center center;
    animation: blink 4.2s linear infinite;
  }

  /* Spray particles from skirt — trail LEFT (opposite of forward RIGHT) */
  @keyframes sprayL {
    0%   { opacity: .85; transform: translate(0, 0) scale(1); }
    100% { opacity: 0;   transform: translate(-70px, 18px) scale(1.6); }
  }
  .spray {
    animation: sprayL 0.9s linear infinite;
  }
  .spray:nth-child(1) { animation-delay: 0s;    animation-duration: .85s; }
  .spray:nth-child(2) { animation-delay: .15s;  animation-duration: 1.0s; }
  .spray:nth-child(3) { animation-delay: .3s;   animation-duration: .75s; }
  .spray:nth-child(4) { animation-delay: .05s;  animation-duration: .95s; }
  .spray:nth-child(5) { animation-delay: .4s;   animation-duration: .8s;  }
  .spray:nth-child(6) { animation-delay: .22s;  animation-duration: 1.05s;}
  .spray:nth-child(7) { animation-delay: .48s;  animation-duration: .9s;  }

  /* Wake streaks under craft — move left as craft advances right */
  @keyframes wakeLeft {
    from { transform: translateX(0); opacity: .55; }
    to   { transform: translateX(-180px); opacity: 0; }
  }
  .wake { animation: wakeLeft 1.4s linear infinite; }

  /* Cabin light pulse */
  @keyframes cabinPulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: .95; }
  }
  #cabin-light { animation: cabinPulse 3s ease-in-out infinite; }

  /* Antenna tip beacon */
  @keyframes beacon {
    0%, 100% { opacity: .3; r: 3; }
    50%      { opacity: 1;  r: 4.5; }
  }
  #beacon-dot { animation: beacon 1.2s ease-in-out infinite; }

  /* Speed lines */
  @keyframes speedLine {
    0%   { opacity: 0; transform: translateX(40px); }
    20%  { opacity: .5; }
    100% { opacity: 0; transform: translateX(-120px); }
  }
  .speed { animation: speedLine 1.1s linear infinite; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="hud">
    <h1>NARWHAL COURIER</h1>
    <p>Arctic Hover Express · Route N-013</p>
  </div>
  <div class="badge">SVG · self-contained</div>
  <div class="hint">拖动/点击画面可微调视角 · prefers-reduced-motion 已尊重</div>

  <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-label="A narwhal piloting a hovercraft across arctic waters, moving right">
    <defs>
      <!-- Gradients -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#0a1628"/>
        <stop offset="40%" stop-color="#0f2740"/>
        <stop offset="100%" stop-color="#0a1c2e"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#0d3a55"/>
        <stop offset="50%" stop-color="#0a2a42"/>
        <stop offset="100%" stop-color="#061822"/>
      </linearGradient>
      <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#5dffb0" stop-opacity="0"/>
        <stop offset="30%"  stop-color="#5dffb0" stop-opacity=".7"/>
        <stop offset="60%"  stop-color="#7a6cff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#7a6cff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#ff6ad5" stop-opacity="0"/>
        <stop offset="40%"  stop-color="#ff6ad5" stop-opacity=".55"/>
        <stop offset="75%"  stop-color="#5dffb0" stop-opacity=".4"/>
        <stop offset="100%" stop-color="#5dffb0" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="iceGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#e8f7ff"/>
        <stop offset="55%" stop-color="#a8d4ea"/>
        <stop offset="100%" stop-color="#5a8aaa"/>
      </linearGradient>
      <linearGradient id="iceFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#6a9bb8"/>
        <stop offset="100%" stop-color="#2a4a62"/>
      </linearGradient>
      <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#3d556e"/>
        <stop offset="45%" stop-color="#24384d"/>
        <stop offset="100%" stop-color="#152233"/>
      </linearGradient>
      <linearGradient id="skirtGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#4a6a82"/>
        <stop offset="100%" stop-color="#1a2c3c"/>
      </linearGradient>
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#9be7ff" stop-opacity=".95"/>
        <stop offset="50%" stop-color="#4ec4e8" stop-opacity=".75"/>
        <stop offset="100%" stop-color="#1a4a6a" stop-opacity=".9"/>
      </linearGradient>
      <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#6a94b0"/>
        <stop offset="55%" stop-color="#4a6f8a"/>
        <stop offset="100%" stop-color="#3a5870"/>
      </linearGradient>
      <linearGradient id="bellyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#e8f6fc"/>
        <stop offset="100%" stop-color="#b8d8e8"/>
      </linearGradient>
      <linearGradient id="tuskGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%"  stop-color="#fff8ec"/>
        <stop offset="50%" stop-color="#e8dcc8"/>
        <stop offset="100%" stop-color="#c4b49a"/>
      </linearGradient>
      <radialGradient id="cushion" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#7aeeff" stop-opacity=".7"/>
        <stop offset="55%"  stop-color="#3ab0d0" stop-opacity=".25"/>
        <stop offset="100%" stop-color="#0a3040" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="thrustGlow" cx="0%" cy="50%" r="80%">
        <stop offset="0%"   stop-color="#ffd166" stop-opacity=".9"/>
        <stop offset="40%"  stop-color="#ff8c42" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#fff2b0" stop-opacity=".95"/>
        <stop offset="40%"  stop-color="#ffd166" stop-opacity=".45"/>
        <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="mistBlur" x="-20%" y="-50%" width="140%" height="200%">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
      <filter id="tinyBlur" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>

      <!-- Reusable iceberg silhouettes for tiling -->
      <symbol id="bergFar" viewBox="0 0 200 90">
        <path d="M0 90 L20 55 L45 70 L70 30 L95 55 L120 20 L150 50 L175 40 L200 90 Z" fill="url(#iceFar)"/>
      </symbol>
      <symbol id="bergMid" viewBox="0 0 240 110">
        <path d="M0 110 L15 70 L40 85 L65 35 L90 60 L120 15 L150 55 L180 40 L210 75 L240 110 Z" fill="url(#iceGrad)" opacity=".85"/>
      </symbol>
      <symbol id="floe" viewBox="0 0 160 50">
        <path d="M0 40 Q20 10 50 18 Q80 5 110 22 Q140 8 160 35 L160 50 L0 50 Z" fill="#b8dcec" opacity=".55"/>
      </symbol>
    </defs>

    <!-- ========== SKY ========== -->
    <rect width="1200" height="700" fill="url(#skyGrad)"/>

    <!-- ========== L0 · STARS ========== -->
    <g id="layer-stars" opacity=".9">
      <!-- generated-ish static stars with staggered twinkle -->
      <circle class="star" cx="40"  cy="30"  r="1.2" fill="#fff" style="animation-delay:0s"/>
      <circle class="star" cx="110" cy="70"  r="1"   fill="#cfe" style="animation-delay:.4s"/>
      <circle class="star" cx="180" cy="25"  r="1.4" fill="#fff" style="animation-delay:.8s"/>
      <circle class="star" cx="260" cy="90"  r=".9"  fill="#def" style="animation-delay:1.2s"/>
      <circle class="star" cx="330" cy="40"  r="1.1" fill="#fff" style="animation-delay:.2s"/>
      <circle class="star" cx="400" cy="15"  r="1.3" fill="#eff" style="animation-delay:1.5s"/>
      <circle class="star" cx="480" cy="80"  r="1"   fill="#fff" style="animation-delay:.6s"/>
      <circle class="star" cx="550" cy="35"  r="1.2" fill="#cdf" style="animation-delay:1.0s"/>
      <circle class="star" cx="620" cy="60"  r=".8"  fill="#fff" style="animation-delay:1.8s"/>
      <circle class="star" cx="700" cy="20"  r="1.5" fill="#fff" style="animation-delay:.3s"/>
      <circle class="star" cx="780" cy="75"  r="1"   fill="#eef" style="animation-delay:1.1s"/>
      <circle class="star" cx="850" cy="45"  r="1.2" fill="#fff" style="animation-delay:.7s"/>
      <circle class="star" cx="920" cy="18"  r="1.1" fill="#cdf" style="animation-delay:1.4s"/>
      <circle class="star" cx="1000" cy="55" r="1.3" fill="#fff" style="animation-delay:.1s"/>
      <circle class="star" cx="1080" cy="30" r="1"   fill="#fff" style="animation-delay:.9s"/>
      <circle class="star" cx="1150" cy="70" r="1.2" fill="#eef" style="animation-delay:1.6s"/>
      <circle class="star" cx="90"  cy="110" r=".9"  fill="#fff" style="animation-delay:.5s"/>
      <circle class="star" cx="450" cy="110" r="1"   fill="#cfe" style="animation-delay:1.3s"/>
      <circle class="star" cx="820" cy="100" r=".8"  fill="#fff" style="animation-delay:.25s"/>
      <circle class="star" cx="1050" cy="95" r="1.1" fill="#fff" style="animation-delay:1.7s"/>
    </g>

    <!-- ========== L0 · AURORA ========== -->
    <g id="layer-aurora" opacity=".85">
      <path class="aurora-a" filter="url(#softGlow)"
        d="M-50 120 C150 40, 300 160, 480 90 S800 30, 1000 100 S1180 140, 1250 80 L1250 160 C1100 200, 900 120, 700 150 S350 200, 150 140 S-20 170, -50 150 Z"
        fill="url(#auroraA)"/>
      <path class="aurora-b" filter="url(#softGlow)"
        d="M-40 160 C180 90, 340 190, 520 130 S860 80, 1040 150 S1200 180, 1260 130 L1260 200 C1120 240, 920 170, 720 190 S360 240, 160 180 S-10 210, -40 190 Z"
        fill="url(#auroraB)" opacity=".7"/>
      <path class="aurora-c" filter="url(#softGlow)"
        d="M-30 100 C200 50, 360 130, 540 70 S820 40, 1020 95 S1180 120, 1250 70 L1250 120 C1100 150, 880 95, 680 110 S320 150, 120 105 S-5 130, -30 115 Z"
        fill="url(#auroraA)" opacity=".45"/>
    </g>

    <!-- ========== L1 · FAR ICEBERGS (parallax slow) ========== -->
    <!-- Tile width 1200, group duplicated for seamless loop -->
    <g id="layer-far">
      <g id="far-tile-a">
        <use href="#bergFar" x="0"   y="280" width="280" height="120"/>
        <use href="#bergFar" x="260" y="300" width="220" height="95" opacity=".8"/>
        <use href="#bergFar" x="460" y="270" width="300" height="130" opacity=".9"/>
        <use href="#bergFar" x="720" y="295" width="240" height="100" opacity=".75"/>
        <use href="#bergFar" x="920" y="275" width="300" height="120" opacity=".85"/>
      </g>
      <g id="far-tile-b" transform="translate(1200,0)">
        <use href="#bergFar" x="0"   y="280" width="280" height="120"/>
        <use href="#bergFar" x="260" y="300" width="220" height="95" opacity=".8"/>
        <use href="#bergFar" x="460" y="270" width="300" height="130" opacity=".9"/>
        <use href="#bergFar" x="720" y="295" width="240" height="100" opacity=".75"/>
        <use href="#bergFar" x="920" y="275" width="300" height="120" opacity=".85"/>
      </g>
    </g>

    <!-- ========== L2 · MID FLOES ========== -->
    <g id="layer-mid">
      <g id="mid-tile-a">
        <use href="#bergMid" x="40"  y="340" width="260" height="120"/>
        <use href="#bergMid" x="320" y="360" width="200" height="95" opacity=".7"/>
        <use href="#bergMid" x="540" y="335" width="280" height="125" opacity=".85"/>
        <use href="#floe"    x="180" y="420" width="140" height="45" opacity=".5"/>
        <use href="#floe"    x="600" y="430" width="160" height="50" opacity=".45"/>
        <use href="#bergMid" x="820" y="350" width="240" height="110" opacity=".8"/>
      </g>
      <g id="mid-tile-b" transform="translate(1600,0)">
        <use href="#bergMid" x="40"  y="340" width="260" height="120"/>
        <use href="#bergMid" x="320" y="360" width="200" height="95" opacity=".7"/>
        <use href="#bergMid" x="540" y="335" width="280" height="125" opacity=".85"/>
        <use href="#floe"    x="180" y="420" width="140" height="45" opacity=".5"/>
        <use href="#floe"    x="600" y="430" width="160" height="50" opacity=".45"/>

<script>
(function () {
  'use strict';

  // Respect reduced motion: if user prefers less motion, skip JS parallax extras
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Parallax pointer tilt (depth cue on mouse/touch) ----------
  var svg = document.getElementById('scene');
  var hero = document.getElementById('hero');
  var layers = {
    stars: document.getElementById('layer-stars'),
    aurora: document.getElementById('layer-aurora'),
    far: document.getElementById('layer-far'),
    mid: document.getElementById('layer-mid'),
    water: document.getElementById('layer-water'),
    near: document.getElementById('layer-near'),
    mist: document.getElementById('layer-mist')
  };

  // Depth factors (higher = more response to pointer)
  var depth = {
    stars: 4,
    aurora: 6,
    far: 10,
    mid: 16,
    water: 8,
    near: 28,
    mist: 36,
    hero: 12
  };

  var targetX = 0, targetY = 0;
  var curX = 0, curY = 0;
  var baseHero = { x: 480, y: 400 };

  function onPointer(clientX, clientY) {
    var w = window.innerWidth || 1;
    var h = window.innerHeight || 1;
    // normalized -1..1
    targetX = ((clientX / w) - 0.5) * 2;
    targetY = ((clientY / h) - 0.5) * 2;
  }

  window.addEventListener('mousemove', function (e) {
    if (reduce) return;
    onPointer(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (reduce || !e.touches || !e.touches[0]) return;
    onPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', function () {
    targetX = 0; targetY = 0;
  });

  function applyLayer(el, k) {
    if (!el) return;
    var ox = (-curX * depth[k]).toFixed(2);
    var oy = (-curY * depth[k] * 0.45).toFixed(2);
    // Preserve existing CSS animation by using a wrapper transform via style on a data attr
    // CSS animations own `transform`; we instead nudge via translate on a child if needed.
    // For simplicity, set CSS variable consumed... fallback: filter not needed.
    // Use SVG transform attribute ONLY when not conflicting: we apply via a small
    // translate on the group's style using `translate` property (composited separately in modern browsers).
    el.style.translate = ox + 'px ' + oy + 'px';
  }

  var raf = null;
  function tick() {
    // smooth follow
    curX += (targetX - curX) * 0.06;
    curY += (targetY - curY) * 0.06;

    applyLayer(layers.stars, 'stars');
    applyLayer(layers.aurora, 'aurora');
    applyLayer(layers.far, 'far');
    applyLayer(layers.mid, 'mid');
    applyLayer(layers.water, 'water');
    applyLayer(layers.near, 'near');
    applyLayer(layers.mist, 'mist');

    if (hero) {
      var hx = (-curX * depth.hero).toFixed(2);
      var hy = (-curY * depth.hero * 0.5).toFixed(2);
      hero.setAttribute('transform',
        'translate(' + (baseHero.x + parseFloat(hx)) + ',' + (baseHero.y + parseFloat(hy)) + ')');
    }

    raf = requestAnimationFrame(tick);
  }

  if (!reduce) {
    raf = requestAnimationFrame(tick);
  }

  // ---------- Occasional thruster "boost" pulse via JS (extra life) ----------
  var flame = document.getElementById('thrust-flame');
  var boostTimer = null;
  function scheduleBoost() {
    if (reduce) return;
    var delay = 4000 + Math.random() * 6000;
    boostTimer = setTimeout(function () {
      if (flame) {
        flame.style.filter = 'url(#softGlow) brightness(1.4)';
        flame.style.opacity = '1';
        setTimeout(function () {
          flame.style.filter = '';
          flame.style.opacity = '';
        }, 280);
      }
      scheduleBoost();
    }, delay);
  }
  scheduleBoost();

  // ---------- Click / tap: temporary speed nudge (visual only) ----------
  var craft = document.getElementById('craft');
  document.getElementById('stage').addEventListener('click', function () {
    if (reduce || !craft) return;
    craft.style.transition = 'none';
    // quick pitch-up "gun it"
    craft.style.transform = 'translateY(-10px) rotate(-1.5deg)';
    setTimeout(function () {
      craft.style.transform = '';
    }, 220);
  });

  // ---------- Console self-check helpers (for automated verification) ----------
  window.__NARWHAL_DEBUG__ = {
    version: 'SVG013-1.0.0',
    layers: function () {
      return Object.keys(layers).filter(function (k) { return !!layers[k]; });
    },
    hasSvg: function () { return !!svg; },
    hasCraft: function () { return !!craft; },
    hasPropeller: function () { return !!document.getElementById('propeller'); },
    hasTail: function () { return !!document.getElementById('tail'); },
    hasFlippers: function () {
      return !!(document.getElementById('flipper-far') && document.getElementById('flipper-near'));
    },
    reduceMotion: reduce,
    getComputedAnimations: function (id) {
      var el = document.getElementById(id);
      if (!el) return null;
      var cs = getComputedStyle(el);
      return {
        animationName: cs.animationName,
        animationDuration: cs.animationDuration,
        animationIterationCount: cs.animationIterationCount
      };
    }
  };
})();
</script>
