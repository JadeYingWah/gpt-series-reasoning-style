<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>METRO OWL · Line 7 Eastbound</title>
<!--
  SVG018-owl-subway · A-skill
  主题：猫头鹰驾驶地铁，画面右侧前进
  场景：蓝调时刻高架线 · CITY ELEVATED · LINE 7 EASTBOUND
  约束：单文件 / 无外链 / 附肢相对运动 / ≥2 层视差
-->
<style>
  :root{
    --ink:#0b1224;
    --sky:#15203a;
    --far:#1c2b4d;
    --mid:#243656;
    --near:#1a2740;
    --cream:#f3efe6;
    --stripe:#ff6b35;
    --stripe-deep:#e85a28;
    --rail:#8b97ad;
    --rail-dark:#3d4a62;
    --window:#7dd3fc;
    --warm:#ffd166;
    --amber:#f4a261;
    --owl-body:#c4a574;
    --owl-belly:#f0e6d0;
    --owl-dark:#5c4033;
    --owl-eye:#ff9f1c;
    --cyan:#5eead4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  #stage{
    width:100%;
    height:100%;
    display:block;
    background:var(--ink);
  }

  /* ========== 视差层：世界相对列车左移 ========== */
  .layer-far{animation:scroll-far 64s linear infinite}
  .layer-mid{animation:scroll-mid 32s linear infinite}
  .layer-near{animation:scroll-near 16s linear infinite}
  .layer-rail{animation:scroll-rail 10s linear infinite}

  @keyframes scroll-far{
    0%{transform:translateX(0)}
    100%{transform:translateX(-900px)}
  }
  @keyframes scroll-mid{
    0%{transform:translateX(0)}
    100%{transform:translateX(-900px)}
  }
  @keyframes scroll-near{
    0%{transform:translateX(0)}
    100%{transform:translateX(-900px)}
  }
  @keyframes scroll-rail{
    0%{transform:translateX(0)}
    100%{transform:translateX(-900px)}
  }

  /* ========== 列车车体：仅竖直微颠 ========== */
  #train-group{
    animation:train-bob 0.62s ease-in-out infinite;
    transform-origin:600px 420px;
  }
  @keyframes train-bob{
    0%,100%{transform:translateY(0)}
    40%{transform:translateY(-2.8px)}
    70%{transform:translateY(1.4px)}
  }

  /* ========== 车轮：顺时针（向右前进） ========== */
  .wheel-spin{
    animation:wheel-spin 0.9s linear infinite;
  }
  .wheel-spin-rear{
    animation:wheel-spin 1.05s linear infinite;
  }
  @keyframes wheel-spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
  }

  /* ========== Owl 附肢（相对车体独立） ========== */
  #owl-head{
    animation:head-scan 3.6s ease-in-out infinite;
    transform-origin:720px 318px;
  }
  #owl-wing-l{
    animation:wing-l 0.78s ease-in-out infinite;
    transform-origin:700px 350px;
  }
  #owl-wing-r{
    animation:wing-r 0.78s ease-in-out infinite;
    transform-origin:742px 348px;
  }
  #tuft-l{
    animation:tuft-l 1.7s ease-in-out infinite;
    transform-origin:708px 292px;
  }
  #tuft-r{
    animation:tuft-r 1.7s ease-in-out infinite;
    transform-origin:732px 292px;
  }
  #owl-eyes{
    animation:blink 5.1s ease-in-out infinite;
    transform-origin:720px 322px;
  }
  #owl-tail{
    animation:tail-flick 1.15s ease-in-out infinite;
    transform-origin:710px 378px;
  }
  #owl-crest{
    animation:crest-puff 2.4s ease-in-out infinite;
    transform-origin:720px 300px;
  }

  @keyframes head-scan{
    0%,100%{transform:rotate(-4deg)}
    35%{transform:rotate(6deg)}
    65%{transform:rotate(2deg)}
  }
  @keyframes wing-l{
    0%,100%{transform:rotate(0deg) translateY(0)}
    50%{transform:rotate(-11deg) translateY(2px)}
  }
  @keyframes wing-r{
    0%,100%{transform:rotate(0deg) translateY(0)}
    50%{transform:rotate(9deg) translateY(1px)}
  }
  @keyframes tuft-l{
    0%,100%{transform:rotate(-6deg)}
    50%{transform:rotate(10deg)}
  }
  @keyframes tuft-r{
    0%,100%{transform:rotate(7deg)}
    50%{transform:rotate(-9deg)}
  }
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(0.08)}
  }
  @keyframes tail-flick{
    0%,100%{transform:rotate(-3deg)}
    50%{transform:rotate(8deg)}
  }
  @keyframes crest-puff{
    0%,100%{transform:scaleY(1)}
    50%{transform:scaleY(1.08)}
  }

  /* ========== 灯光 / 氛围 ========== */
  #headlight-beam{
    animation:beam-pulse 2.2s ease-in-out infinite;
    transform-origin:1040px 392px;
  }
  @keyframes beam-pulse{
    0%,100%{opacity:0.55}
    50%{opacity:0.9}
  }
  .win-glow{
    animation:win-flicker 3.4s ease-in-out infinite;
  }
  .win-glow-b{
    animation:win-flicker 4.1s ease-in-out infinite;
    animation-delay:-1.2s;
  }
  @keyframes win-flicker{
    0%,100%{opacity:0.75}
    40%{opacity:1}
    60%{opacity:0.55}
  }
  #cab-lamp{
    animation:lamp-pulse 1.8s ease-in-out infinite;
  }
  @keyframes lamp-pulse{
    0%,100%{opacity:0.85}
    50%{opacity:1}
  }
  .star{
    animation:twinkle 3s ease-in-out infinite;
  }
  .star-b{animation:twinkle 4.2s ease-in-out infinite;animation-delay:-1s}
  @keyframes twinkle{
    0%,100%{opacity:0.25}
    50%{opacity:0.95}
  }

  /* 速度拖尾：向左 = 前进向右 */
  #speed-lines{
    animation:speed-dash 0.55s linear infinite;
  }
  @keyframes speed-dash{
    0%{transform:translateX(0);opacity:0.85}
    100%{transform:translateX(-28px);opacity:0}
  }

  /* 车顶受电弓微颤 */
  #pantograph{
    animation:panto-shake 0.45s ease-in-out infinite;
    transform-origin:860px 268px;
  }
  @keyframes panto-shake{
    0%,100%{transform:rotate(-1.2deg)}
    50%{transform:rotate(1.4deg)}
  }

  /* 地面接触阴影呼吸 */
  #ground-shadow{
    animation:shadow-breathe 0.62s ease-in-out infinite;
  }
  @keyframes shadow-breathe{
    0%,100%{opacity:0.35}
    40%{opacity:0.22}
  }
</style>
