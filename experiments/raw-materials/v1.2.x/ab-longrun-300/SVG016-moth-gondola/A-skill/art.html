<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moth Gondola · 月夜贡多拉</title>
<!--
  SVG016 · moth piloting gondola, advancing to the right
  Direction: moonlit Venice canal night — ivory moth on black gondola
  Motion model: world scrolls LEFT (relative wind) ⇒ gondola advances RIGHT
  Parallax: far sky/palazzo 0.22x · mid facade/lamps 0.50x · near poles/ripple 1.0x
  Moth relative motion: wings + antennae + legs + abdomen independent of hull
-->
<style>
  :root {
    --night:     #0a0e1a;
    --dusk:      #1a2340;
    --stone:     #3d4560;
    --stone-lt:  #6b7394;
    --ivory:     #f2e8d5;
    --moth-body: #c9a86c;
    --moth-dark: #6b4a28;
    --moth-wing: #e8d5a8;
    --moth-spot: #8b3a3a;
    --gondola:   #0d0d12;
    --gondola-hi:#2a2a38;
    --gold:      #d4a84b;
    --amber:     #f0b040;
    --canal:     #0c1828;
    --water-hi:  #1e3a58;
    --moon:      #f5f0e0;
    --moon-glow: #c8d8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--night);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── reduced motion ─────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    .scroll-far,
    .scroll-mid,
    .scroll-near,
    .wing-l,
    .wing-r,
    .antenna-l,
    .antenna-r,
    .leg-front,
    .leg-mid,
    .leg-rear,
    .abdomen-sway,
    .moth-bob,
    .hull-bob,
    .oar-stroke,
    .oar-blade,
    .water-ripple,
    .lantern-flicker,
    .moon-halo,
    .reflection-wobble {
      animation: none !important;
    }
  }

  /* ── parallax scroll groups (duplicated tiles inside SVG) ── */
  .scroll-far  { animation: scrollX 32s linear infinite; }
  .scroll-mid  { animation: scrollX 16s linear infinite; }
  .scroll-near { animation: scrollX 8s  linear infinite; }

  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }

  /* ── gondola hull gentle bob (relative to water, not world) ── */
  .hull-bob {
    animation: hullBob 2.6s ease-in-out infinite;
    transform-origin: 600px 420px;
  }
  @keyframes hullBob {
    0%, 100% { transform: translateY(0) rotate(-0.4deg); }
    50%      { transform: translateY(4px) rotate(0.6deg); }
  }

  /* ── moth body micro-bob on hull ── */
  .moth-bob {
    animation: mothBob 2.1s ease-in-out infinite;
    transform-origin: 600px 340px;
  }
  @keyframes mothBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* ── independent wing flap (asymmetric periods) ── */
  .wing-l {
    transform-origin: 590px 320px;
    transform-box: fill-box;
    animation: wingFlapL 0.72s ease-in-out infinite;
  }
  .wing-r {
    transform-origin: 610px 320px;
    transform-box: fill-box;
    animation: wingFlapR 0.72s ease-in-out infinite;
  }
  @keyframes wingFlapL {
    0%, 100% { transform: rotate(-6deg) scaleY(1); }
    40%      { transform: rotate(28deg) scaleY(0.55); }
    70%      { transform: rotate(10deg) scaleY(0.85); }
  }
  @keyframes wingFlapR {
    0%, 100% { transform: rotate(4deg) scaleY(1); }
    35%      { transform: rotate(-26deg) scaleY(0.55); }
    65%      { transform: rotate(-8deg) scaleY(0.85); }
  }

  /* ── independent antenna twitch ── */
  .antenna-l {
    transform-origin: 618px 300px;
    transform-box: fill-box;
    animation: antTwitchL 1.4s ease-in-out infinite;
  }
  .antenna-r {
    transform-origin: 622px 300px;
    transform-box: fill-box;
    animation: antTwitchR 1.7s ease-in-out infinite;
  }
  @keyframes antTwitchL {
    0%, 100% { transform: rotate(-3deg); }
    30%      { transform: rotate(8deg); }
    60%      { transform: rotate(-6deg); }
  }
  @keyframes antTwitchR {
    0%, 100% { transform: rotate(2deg); }
    40%      { transform: rotate(-9deg); }
    75%      { transform: rotate(5deg); }
  }

  /* ── independent legs (grip / adjust) ── */
  .leg-front {
    transform-origin: 608px 350px;
    transform-box: fill-box;
    animation: legFront 1.9s ease-in-out infinite;
  }
  .leg-mid {
    transform-origin: 598px 352px;
    transform-box: fill-box;
    animation: legMid 2.3s ease-in-out infinite;
  }
  .leg-rear {
    transform-origin: 588px 350px;
    transform-box: fill-box;
    animation: legRear 2.05s ease-in-out infinite;
  }
  @keyframes legFront {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(6deg) translateY(1px); }
  }
  @keyframes legMid {
    0%, 100% { transform: rotate(0deg); }
    45%      { transform: rotate(-5deg); }
  }
  @keyframes legRear {
    0%, 100% { transform: rotate(0deg); }
    55%      { transform: rotate(4deg) translateY(-1px); }
  }

  /* ── abdomen sway (not locked to hull) ── */
  .abdomen-sway {
    transform-origin: 585px 345px;
    transform-box: fill-box;
    animation: abdomenSway 2.8s ease-in-out infinite;
  }
  @keyframes abdomenSway {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(7deg); }
  }

  /* ── oar stroke (gondolier motion) ── */
  .oar-stroke {
    transform-origin: 680px 400px;
    transform-box: fill-box;
    animation: oarStroke 3.2s ease-in-out infinite;
  }
  @keyframes oarStroke {
    0%   { transform: rotate(-8deg); }
    25%  { transform: rotate(12deg); }
    50%  { transform: rotate(18deg); }
    75%  { transform: rotate(2deg); }
    100% { transform: rotate(-8deg); }
  }
  .oar-blade {
    transform-origin: center;
    transform-box: fill-box;
    animation: oarBlade 3.2s ease-in-out infinite;
  }
  @keyframes oarBlade {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-15deg); }
    50%      { transform: rotate(-5deg); }
    75%      { transform: rotate(8deg); }
  }

  /* ── water & lanterns ── */
  .water-ripple {
    animation: ripple 4s ease-in-out infinite;
  }
  @keyframes ripple {
    0%, 100% { opacity: 0.25; transform: scaleX(1); }
    50%      { opacity: 0.5;  transform: scaleX(1.04); }
  }
  .lantern-flicker {
    animation: flicker 1.8s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    40%      { opacity: 0.7; }
    60%      { opacity: 0.95; }
  }
  .moon-halo {
    animation: halo 6s ease-in-out infinite;
  }
  @keyframes halo {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.55; }
  }
  .reflection-wobble {
    animation: reflWob 3.5s ease-in-out infinite;
  }
  @keyframes reflWob {
    0%, 100% { opacity: 0.2; transform: scaleY(1); }
    50%      { opacity: 0.35; transform: scaleY(1.08); }
  }
</style>
</head>

    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">

  <!-- ═══════════════ MID FACADE / LAMPS (0.50×) ═══════════════ -->
