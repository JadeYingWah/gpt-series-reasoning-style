<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f1e7;
      --fg: #2b2a28;
      --muted: #6b6560;
      --accent: #d35400;
      --card: #fffdf8;
      --border: #e6ddd0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b19;
        --fg: #f2ebe0;
        --muted: #a39b90;
        --accent: #e67e22;
        --card: #262421;
        --border: #3a3630;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .status {
      min-height: 1.4em;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .status.done {
      color: var(--accent);
      font-weight: 600;
    }
    .display {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.5rem, 14vw, 4.75rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 8px 0 20px;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      min-width: 88px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .config {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }
    label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      font-size: 1rem;
      text-align: center;
    }
    .hint {
      width: 100%;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main class="card" aria-label="番茄钟">
    <h1>番茄钟</h1>
    <p id="status" class="status" aria-live="polite">准备开始</p>
    <div id="display" class="display" role="timer" aria-live="off">25:00</div>
    <div class="controls">
      <button id="startPause" class="primary" type="button">开始</button>
      <button id="reset" type="button">重置</button>
    </div>
    <div class="config">
      <label for="minutes">时长（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" value="25" />
      <button id="apply" type="button">应用</button>
      <p class="hint">整数 1–60。运行中可点「重置」后再改时长。</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var MIN_MINUTES = 1;
      var MAX_MINUTES = 60;
      var TICK_MS = 250;

      var displayEl = document.getElementById("display");
      var statusEl = document.getElementById("status");
      var startPauseBtn = document.getElementById("startPause");
      var resetBtn = document.getElementById("reset");
      var minutesInput = document.getElementById("minutes");
      var applyBtn = document.getElementById("apply");

      var configuredMinutes = 25;
      var totalSeconds = configuredMinutes * 60;
      var remainingMs = totalSeconds * 1000;
      var running = false;
      var finished = false;
      var endAtMs = 0; // wall-clock target when running
      var timerId = null;

      function clampInt(n, min, max) {
        n = Math.floor(Number(n));
        if (!isFinite(n)) return null;
        if (n < min || n > max) return null;
        return n;
      }

      function formatTime(ms) {
        if (ms < 0) ms = 0;
        var totalSec = Math.ceil(ms / 1000);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return (m < 10 ? "0" + m : String(m)) + ":" + (s < 10 ? "0" + s : String(s));
      }

      function setStatus(text, isDone) {
        statusEl.textContent = text;
        if (isDone) statusEl.classList.add("done");
        else statusEl.classList.remove("done");
      }

      function render() {
        displayEl.textContent = formatTime(remainingMs);
        startPauseBtn.textContent = running ? "暂停" : "开始";
        startPauseBtn.disabled = finished;
        applyBtn.disabled = running;
        minutesInput.disabled = running;
      }

      function stopTicking() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function finish() {
        stopTicking();
        running = false;
        finished = true;
        remainingMs = 0;
        setStatus("时间到", true);
        render();
        beep();
      }

      function tick() {
        remainingMs = endAtMs - Date.now();
        if (remainingMs <= 0) {
          finish();
          return;
        }
        render();
      }

      function start() {
        if (finished || running) return;
        if (remainingMs <= 0) {
          remainingMs = totalSeconds * 1000;
        }
        running = true;
        finished = false;
        endAtMs = Date.now() + remainingMs;
        setStatus("专注中…", false);
        stopTicking();
        timerId = setInterval(tick, TICK_MS);
        render();
      }

      function pause() {
        if (!running) return;
        remainingMs = Math.max(0, endAtMs - Date.now());
        running = false;
        stopTicking();
        setStatus("已暂停", false);
        render();
      }

      function reset() {
        stopTicking();
        running = false;
        finished = false;
        remainingMs = totalSeconds * 1000;
        setStatus("准备开始", false);
        render();
      }

      function applyDuration() {
        if (running) return;
        var minutes = clampInt(minutesInput.value, MIN_MINUTES, MAX_MINUTES);
        if (minutes === null) {
          setStatus("请输入 1–60 的整数分钟", false);
          minutesInput.value = String(configuredMinutes);
          return;
        }
        configuredMinutes = minutes;
        totalSeconds = configuredMinutes * 60;
        minutesInput.value = String(configuredMinutes);
        reset();
        setStatus("已设置为 " + configuredMinutes + " 分钟", false);
      }

      function beep() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.value = 0.0001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          var now = ctx.currentTime;
          gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.5);
          osc.onended = function () {
            try { ctx.close(); } catch (e) { /* ignore */ }
          };
        } catch (e) {
          // Audio may be blocked until user gesture; timer state still shows 时间到.
        }
      }

      startPauseBtn.addEventListener("click", function () {
        if (running) pause();
        else start();
      });
      resetBtn.addEventListener("click", reset);
      applyBtn.addEventListener("click", applyDuration);
      minutesInput.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") applyDuration();
      });

      // Export pure helpers for Node source-check / unit tests.
      window.__pomodoroLite = {
        formatTime: formatTime,
        clampInt: clampInt,
        getState: function () {
          return {
            configuredMinutes: configuredMinutes,
            totalSeconds: totalSeconds,
            remainingMs: remainingMs,
            running: running,
            finished: finished
          };
        },
        // Test hooks (not used by UI):
        _setRemainingMs: function (ms) { remainingMs = ms; },
        _finish: finish
      };

      render();
    })();
  </script>
</body>
</html>
