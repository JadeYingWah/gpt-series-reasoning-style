<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beetle Cable-Car · 甲虫缆车</title>
<!--
  SVG008-beetle-cable-car · A-skill
  Self-consistency notes (also mirrored in notes.md):
  1. Forward motion = +X (right). Cable car body and beetle cabin drift right
     continuously; cable sheaves rotate CW when the car moves right.
  2. Beetle limbs (mid/hind legs + antennae) animate on independent cycles
     relative to the rigid cabin, not locked to the vehicle translation.
  3. Parallax layers (back→front): sky/stars → far peaks → mid ridge/trees
     → near rocks/snow → cable system. Speeds increase toward the camera.
-->
<style>
  :root {
    --bg-top: #0b1026;
    --bg-mid: #1a2744;
    --bg-low: #3d2a4a;
    --peak-far: #1e2a4a;
    --peak-mid: #2a3a5c;
    --peak-near: #1a2438;
    --cable: #c9d4e0;
    --car-body: #c45c26;
    --car-body-dark: #8a3a14;
    --car-glass: #7ec8e3;
    --car-trim: #f0c14a;
    --beetle-shell: #2d5a27;
    --beetle-shell-hi: #6b9e3a;
    --beetle-belly: #c4a35a;
    --beetle-eye: #1a1a1a;
    --snow: #e8eef6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  svg#scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------- sky twinkle ---------- */
  .star {
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .star:nth-child(3n) { animation-duration: 2.1s; animation-delay: 0.4s; }
  .star:nth-child(3n+1) { animation-duration: 4.0s; animation-delay: 1.1s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* ---------- parallax cloud drift (JS also shifts groups) ---------- */
  .cloud {
    animation: cloud-drift 28s linear infinite;
  }
  @keyframes cloud-drift {
    from { transform: translateX(0); }
    to   { transform: translateX(80px); }
  }

  /* ---------- cable car group: slight vertical sway while advancing ---------- */
  #car-rig {
    animation: car-advance 12s linear infinite;
  }
  @keyframes car-advance {
    0%   { transform: translateX(-40px); }
    100% { transform: translateX(40px); }
  }

  #car-sway {
    transform-origin: 400px 120px;
    animation: sway 2.8s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }

  /* ---------- cable sheave / pulley spin: CW when moving right ---------- */
  .sheave {
    transform-origin: center;
    transform-box: fill-box;
    animation: spin-cw 0.9s linear infinite;
  }
  @keyframes spin-cw {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* small trailing sheaves under cabin */
  .sheave-sm {
    transform-origin: center;
    transform-box: fill-box;
    animation: spin-cw 0.55s linear infinite;
  }

  /* ---------- beetle limbs: independent of cabin translation ---------- */
  /* foreleg reach / grip on lever */
  .leg-fore {
    transform-origin: 0px 0px;
    transform-box: fill-box;
    animation: leg-fore 1.1s ease-in-out infinite;
  }
  @keyframes leg-fore {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-18deg); }
  }

  /* mid legs: alternating step cycle (left delayed) */
  .leg-mid-l {
    transform-origin: 100% 0%;
    transform-box: fill-box;
    animation: step-mid 0.7s ease-in-out infinite;
  }
  .leg-mid-r {
    transform-origin: 0% 0%;
    transform-box: fill-box;
    animation: step-mid 0.7s ease-in-out infinite;
    animation-delay: -0.35s;
  }
  @keyframes step-mid {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    40%      { transform: rotate(14deg) translateY(2px); }
    70%      { transform: rotate(-8deg) translateY(0); }
  }

  /* hind legs kick slightly slower (different phase vs mid) */
  .leg-hind-l {
    transform-origin: 100% 0%;
    transform-box: fill-box;
    animation: step-hind 0.85s ease-in-out infinite;
  }
  .leg-hind-r {
    transform-origin: 0% 0%;
    transform-box: fill-box;
    animation: step-hind 0.85s ease-in-out infinite;
    animation-delay: -0.42s;
  }
  @keyframes step-hind {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg); }
  }

  /* antennae: lag + whip (not synced to body) */
  .antenna {
    transform-origin: 0% 100%;
    transform-box: fill-box;
    animation: ant-wave 1.6s ease-in-out infinite;
  }
  .antenna.r { animation-delay: -0.25s; }
  @keyframes ant-wave {
    0%, 100% { transform: rotate(0deg) skewX(0deg); }
    30%      { transform: rotate(10deg) skewX(4deg); }
    60%      { transform: rotate(-6deg) skewX(-3deg); }
  }

  /* mandibles nudge when "steering" */
  .mandible {
    transform-origin: 100% 50%;
    transform-box: fill-box;
    animation: mandible 1.4s ease-in-out infinite;
  }
  .mandible.r { transform-origin: 0% 50%; animation-delay: -0.2s; }
  @keyframes mandible {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(6deg); }
  }

  /* wing-case shimmer (elytra) — subtle pulse, not a walk cycle */
  .elytra {
    animation: elytra-glow 3.5s ease-in-out infinite;
  }
  @keyframes elytra-glow {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.88; }
  }

  /* headlamp flicker */
  .lamp {
    animation: lamp-flicker 0.35s steps(2) infinite;
  }
  @keyframes lamp-flicker {
    0%   { opacity: 0.85; }
    50%  { opacity: 1; }
    100% { opacity: 0.9; }
  }

  /* snow particles near camera */
  .flake {
    animation: flake-fall linear infinite;
  }
  @keyframes flake-fall {
    0%   { transform: translateY(0); opacity: 0; }
    10%  { opacity: 0.85; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(420px); opacity: 0; }
  }

  .caption {
    position: absolute;
    left: 50%;
    bottom: 3.5vh;
    transform: translateX(-50%);
    color: #d8e0ee;
    font-size: clamp(12px, 1.6vw, 16px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.72;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(126, 200, 227, 0.35);
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-label="A beetle driving a cable car to the right">
    <defs>
      <!-- sky gradient -->
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#070b1c"/>
        <stop offset="45%" stop-color="#152040"/>
        <stop offset="78%" stop-color="#3a2850"/>
        <stop offset="100%" stop-color="#6b3a48"/>
      </linearGradient>
      <!-- mountain shades -->
      <linearGradient id="farPeak" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a5a80"/>
        <stop offset="100%" stop-color="#1a2438"/>
      </linearGradient>
      <linearGradient id="midPeak" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5a6a90"/>
        <stop offset="100%" stop-color="#243048"/>
      </linearGradient>
      <linearGradient id="nearPeak" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a3448"/>
        <stop offset="100%" stop-color="#0e141f"/>
      </linearGradient>
      <!-- car body -->
      <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e07030"/>
        <stop offset="55%" stop-color="#c45c26"/>
        <stop offset="100%" stop-color="#8a3a14"/>
      </linearGradient>
      <!-- glass -->
      <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#a8dcec"/>
        <stop offset="50%" stop-color="#5ba8c4"/>
        <stop offset="100%" stop-color="#2a6a88"/>
      </linearGradient>
      <!-- beetle shell -->
      <radialGradient id="shellGrad" cx="40%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#8fbf4a"/>
        <stop offset="40%" stop-color="#3d7a2e"/>
        <stop offset="100%" stop-color="#1a3d14"/>
      </radialGradient>
      <linearGradient id="cableGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8f0f8"/>
        <stop offset="100%" stop-color="#6a7a8a"/>
      </linearGradient>
      <!-- lamp cone -->
      <linearGradient id="lampCone" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#ffe9a0" stop-opacity="0"/>
      </linearGradient>
      <!-- soft filter for distant layers -->
      <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur stdDeviation="0.8"/>
      </filter>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- ========== L0: SKY ========== -->
    <rect width="1000" height="600" fill="url(#skyGrad)"/>

    <!-- stars (parallax: almost static) -->
    <g id="layer-stars" opacity="0.9">
      <circle class="star" cx="60" cy="40" r="1.4" fill="#fff"/>
      <circle class="star" cx="140" cy="90" r="1.1" fill="#d0e8ff"/>
      <circle class="star" cx="220" cy="30" r="1.6" fill="#fff"/>
      <circle class="star" cx="310" cy="70" r="1.0" fill="#ffe"/>
      <circle class="star" cx="400" cy="25" r="1.3" fill="#fff"/>
      <circle class="star" cx="480" cy="95" r="1.5" fill="#c8e0ff"/>
      <circle class="star" cx="560" cy="48" r="1.1" fill="#fff"/>
      <circle class="star" cx="640" cy="80" r="1.7" fill="#fff"/>
      <circle class="star" cx="720" cy="35" r="1.2" fill="#e8f0ff"/>
      <circle class="star" cx="800" cy="100" r="1.0" fill="#fff"/>
      <circle class="star" cx="880" cy="55" r="1.4" fill="#fff"/>
      <circle class="star" cx="940" cy="20" r="1.3" fill="#d8f0ff"/>
      <circle class="star" cx="100" cy="130" r="0.9" fill="#fff"/>
      <circle class="star" cx="350" cy="120" r="1.1" fill="#fff"/>
      <circle class="star" cx="700" cy="140" r="0.8" fill="#fff"/>
      <circle class="star" cx="850" cy="110" r="1.2" fill="#fff"/>
    </g>

    <!-- moon -->
    <g id="layer-moon">
      <circle cx="860" cy="90" r="36" fill="#f5f0d8" opacity="0.92"/>
      <circle cx="872" cy="82" r="30" fill="#070b1c" opacity="0.35"/>
      <circle cx="860" cy="90" r="42" fill="#f5f0d8" opacity="0.08" filter="url(#glow)"/>
    </g>

    <!-- high clouds — slow drift (L1 parallax, very slow) -->
    <g id="layer-clouds" class="cloud" opacity="0.35">
      <ellipse cx="180" cy="120" rx="70" ry="14" fill="#4a5878"/>
      <ellipse cx="220" cy="115" rx="40" ry="10" fill="#5a6888"/>
      <ellipse cx="620" cy="100" rx="90" ry="16" fill="#3a4868"/>
      <ellipse cx="670" cy="95" rx="50" ry="11" fill="#4a5878"/>
    </g>

    <!-- ========== L1: FAR PEAKS (slowest terrain) ========== -->
    <g id="layer-far-peaks" filter="url(#soft)">
      <polygon points="0,340 80,200 160,280 240,160 320,260 400,180 480,250 560,150 640,240 720,170 800,260 880,190 1000,300 1000,600 0,600"
               fill="url(#farPeak)"/>
      <!-- snow caps on far peaks -->
      <polygon points="240,160 220,210 260,210" fill="#c8d4e8" opacity="0.55"/>
      <polygon points="560,150 540,200 580,200" fill="#c8d4e8" opacity="0.6"/>
      <polygon points="880,190 860,230 900,230" fill="#c8d4e8" opacity="0.45"/>
    </g>

    <!-- ========== L2: MID RIDGE + TREES ========== -->
    <g id="layer-mid">
      <polygon points="0,420 100,300 200,380 300,290 420,360 540,270 660,350 780,280 900,340 1000,310 1000,600 0,600"
               fill="url(#midPeak)"/>
      <!-- mid snow -->
      <polygon points="300,290 275,340 325,340" fill="#d0dae8" opacity="0.5"/>
      <polygon points="540,270 515,320 565,320" fill="#d0dae8" opacity="0.55"/>
      <!-- conifer silhouettes on mid ridge -->
      <g fill="#1a2830" opacity="0.85">
        <polygon points="90,400 75,400 82,360 70,360 82,320 95,360 82,360 90,400"/>
        <polygon points="180,390 168,390 174,355 164,355 174,318 185,355 174,355 180,390"/>
        <polygon points="360,370 348,370 354,338 344,338 354,305 364,338 354,338 360,370"/>
        <polygon points="470,385 458,385 464,352 454,352 464,318 474,352 464,352 470,385"/>
        <polygon points="700,360 688,360 694,328 684,328 694,295 704,328 694,328 700,360"/>
        <polygon points="820,375 808,375 814,342 804,342 814,308 824,342 814,342 820,375"/>
        <polygon points="950,355 938,355 944,322 934,322 944,288 954,322 944,322 950,355"/>
      </g>
    </g>

    <!-- ========== L3: NEAR ROCKS / SNOW FLOOR ========== -->
    <g id="layer-near">
      <path d="M0,500 C120,460 200,490 320,470 C450,448 520,500 650,480 C780,460 880,500 1000,475 L1000,600 L0,600 Z"
            fill="url(#nearPeak)"/>
      <path d="M0,520 C150,495 280,530 420,505 C560,480 700,530 1000,500 L1000,600 L0,600 Z"
            fill="#0a0e16" opacity="0.55"/>
      <!-- snow patches -->
      <ellipse cx="180" cy="530" rx="50" ry="10" fill="#d8e4f0" opacity="0.35"/>
      <ellipse cx="520" cy="545" rx="70" ry="12" fill="#d8e4f0" opacity="0.28"/>
      <ellipse cx="860" cy="525" rx="55" ry="10" fill="#d8e4f0" opacity="0.32"/>
      <!-- near boulders -->
      <ellipse cx="80" cy="540" rx="36" ry="22" fill="#1a2030"/>
      <ellipse cx="250" cy="555" rx="28" ry="16" fill="#141c28"/>
      <ellipse cx="740" cy="548" rx="40" ry="20" fill="#182030"/>
      <ellipse cx="940" cy="540" rx="32" ry="18" fill="#121820"/>
    </g>

    <!-- snowfall (nearest parallax particles) -->
    <g id="layer-snow" fill="#e8f0ff">
      <circle class="flake" cx="40"  cy="0" r="1.5" style="animation-duration:7s;animation-delay:0s"/>
      <circle class="flake" cx="120" cy="0" r="1.2" style="animation-duration:8.5s;animation-delay:1.2s"/>
      <circle class="flake" cx="200" cy="0" r="1.8" style="animation-duration:6.2s;animation-delay:0.4s"/>
      <circle class="flake" cx="300" cy="0" r="1.1" style="animation-duration:9s;animation-delay:2.1s"/>
      <circle class="flake" cx="400" cy="0" r="1.6" style="animation-duration:7.4s;animation-delay:0.8s"/>
      <circle class="flake" cx="520" cy="0" r="1.3" style="animation-duration:8.1s;animation-delay:1.6s"/>
      <circle class="flake" cx="640" cy="0" r="1.7" style="animation-duration:6.8s;animation-delay:0.2s"/>
      <circle class="flake" cx="760" cy="0" r="1.2" style="animation-duration:9.2s;animation-delay:2.8s"/>
      <circle class="flake" cx="860" cy="0" r="1.5" style="animation-duration:7.7s;animation-delay:1.0s"/>
      <circle class="flake" cx="960" cy="0" r="1.4" style="animation-duration:8.8s;animation-delay:0.5s"/>
      <circle class="flake" cx="80"  cy="0" r="1.0" style="animation-duration:10s;animation-delay:3.2s"/>
      <circle class="flake" cx="580" cy="0" r="1.1" style="animation-duration:9.5s;animation-delay:2.4s"/>
    </g>

    <!-- ========== CABLE SYSTEM (mid-depth, above car) ========== -->
    <g id="layer-cable">
      <!-- main cable: gentle sag toward center -->
      <path d="M0,90 Q250,130 500,105 T1000,95"
            fill="none" stroke="url(#cableGrad)" stroke-width="3.2" opacity="0.9"/>
      <!-- secondary haul rope slightly below -->
      <path d="M0,118 Q300,155 600,125 T1000,110"
            fill="none" stroke="#8a98a8" stroke-width="1.6" opacity="0.55"/>

      <!-- distant pylon left -->
      <g id="pylon-left" opacity="0.7">
        <rect x="118" y="130" width="10" height="220" fill="#2a3440"/>
        <polygon points="110,130 140,130 128,100 122,100" fill="#2a3440"/>
        <rect x="100" y="122" width="48" height="6" fill="#3a4654"/>
        <circle class="sheave" cx="112" cy="118" r="7" fill="none" stroke="#c0c8d0" stroke-width="2"/>
        <circle class="sheave" cx="136" cy="118" r="7" fill="none" stroke="#c0c8d0" stroke-width="2"/>
        <line x1="123" y1="350" x2="100" y2="420" stroke="#2a3440" stroke-width="4"/>
        <line x1="123" y1="350" x2="150" y2="420" stroke="#2a3440" stroke-width="4"/>
      </g>

      <!-- distant pylon right -->
      <g id="pylon-right" opacity="0.65">
        <rect x="780" y="120" width="10" height="230" fill="#2a3440"/>
        <polygon points="772,120 802,120 790,90 784,90" fill="#2a3440"/>
        <rect x="762" y="112" width="48" height="6" fill="#3a4654"/>
        <circle class="sheave" cx="774" cy="108" r="7" fill="none" stroke="#c0c8d0" stroke-width="2"/>
        <circle class="sheave" cx="798" cy="108" r="7" fill="none" stroke="#c0c8d0" stroke-width="2"/>
        <line x1="785" y1="350" x2="762" y2="420" stroke="#2a3440" stroke-width="4"/>
        <line x1="785" y1="350" x2="812" y2="420" stroke="#2a3440" stroke-width="4"/>
      </g>
    </g>

    <!-- ========== CAR RIG: the beetle cable-car (foreground subject) ========== -->
    <g id="car-rig">
      <g id="car-sway">
        <!-- hanger arm up to cable -->
        <line x1="400" y1="105" x2="400" y2="175" stroke="#6a7888" stroke-width="5"/>
        <!-- grip housing on cable -->
        <rect x="382" y="96" width="36" height="18" rx="4" fill="#4a5868"/>
        <circle class="sheave" cx="392" cy="104" r="6" fill="none" stroke="#d0d8e0" stroke-width="2"/>
        <circle class="sheave" cx="408" cy="104" r="6" fill="none" stroke="#d0d8e0" stroke-width="2"/>

        <!-- cabin outer shell -->
        <g id="cabin">
          <!-- roof -->
          <path d="M320,190 Q400,160 480,190 L470,205 Q400,180 330,205 Z"
                fill="url(#carBody)" stroke="#5a280c" stroke-width="1.5"/>
          <!-- body -->
          <rect x="318" y="200" width="164" height="130" rx="14"
                fill="url(#carBody)" stroke="#5a280c" stroke-width="2"/>
          <!-- trim stripe -->
          <rect x="318" y="250" width="164" height="8" fill="var(--car-trim)" opacity="0.85"/>
          <!-- side window (large) -->
          <rect x="340" y="215" width="100" height="70" rx="6"
                fill="url(#glassGrad)" stroke="#3a6070" stroke-width="2" opacity="0.92"/>
          <!-- window shine -->
          <path d="M350,220 L370,220 L345,280 L330,280 Z" fill="#fff" opacity="0.18"/>
          <!-- front window (right side, facing travel) -->
          <path d="M445,215 L472,222 L472,278 L445,285 Z"
                fill="url(#glassGrad)" stroke="#3a6070" stroke-width="1.5" opacity="0.85"/>
          <!-- door line -->
          <line x1="390" y1="205" x2="390" y2="320" stroke="#5a280c" stroke-width="1.5" opacity="0.5"/>
          <!-- door handle -->
          <rect x="398" y="268" width="12" height="4" rx="1" fill="#f0c14a"/>
          <!-- bottom skirt -->
          <rect x="318" y="318" width="164" height="16" rx="4" fill="#6a2e10"/>
          <!-- headlamp on right (direction of travel) -->
          <g class="lamp" filter="url(#glow)">
            <circle cx="478" cy="250" r="7" fill="#ffe9a0"/>
            <circle cx="478" cy="250" r="3.5" fill="#fff8d0"/>
          </g>
          <!-- lamp beam -->
          <polygon points="485,245 560,230 560,270 485,255" fill="url(#lampCone)" class="lamp"/>
          <!-- rear lamp (left) -->
          <circle cx="322" cy="250" r="4" fill="#ff4444" opacity="0.9"/>
          <!-- number plate -->
          <rect x="455" y="300" width="22" height="12" rx="2" fill="#e8e0c8"/>
          <text x="466" y="309" font-size="7" text-anchor="middle" fill="#333" font-family="monospace">BX-08</text>

          <!-- undercarriage sheaves (drive wheels) — spin CW with rightward motion -->
          <g id="drive-sheaves">
            <circle class="sheave-sm" cx="345" cy="340" r="12" fill="#2a3038" stroke="#8a98a8" stroke-width="3"/>
            <circle class="sheave-sm" cx="345" cy="340" r="4" fill="#c0c8d0"/>
            <line x1="345" y1="330" x2="345" y2="350" stroke="#c0c8d0" stroke-width="1.5" opacity="0.7"/>
            <line x1="335" y1="340" x2="355" y2="340" stroke="#c0c8d0" stroke-width="1.5" opacity="0.7"/>

            <circle class="sheave-sm" cx="400" cy="344" r="14" fill="#2a3038" stroke="#9aa8b8" stroke-width="3"/>
            <circle class="sheave-sm" cx="400" cy="344" r="5" fill="#d0d8e0"/>
            <line x1="400" y1="332" x2="400" y2="356" stroke="#d0d8e0" stroke-width="1.5" opacity="0.7"/>
            <line x1="388" y1="344" x2="412" y2="344" stroke="#d0d8e0" stroke-width="1.5" opacity="0.7"/>

            <circle class="sheave-sm" cx="455" cy="340" r="12" fill="#2a3038" stroke="#8a98a8" stroke-width="3"/>
            <circle class="sheave-sm" cx="455" cy="340" r="4" fill="#c0c8d0"/>
            <line x1="455" y1="330" x2="455" y2="350" stroke="#c0c8d0" stroke-width="1.5" opacity="0.7"/>
            <line x1="445" y1="340" x2="465" y2="340" stroke="#c0c8d0" stroke-width="1.5" opacity="0.7"/>

          <!-- eyes -->

<script>
/**
 * Parallax + procedural motion (no external assets).
 * Layers move leftward relative to the viewer when the car advances rightward,
 * at different rates → depth. Sky barely moves; near ground moves fastest.
 */
(function () {
  const layers = [
    { el: document.getElementById('layer-stars'),     speed: 0.04 },
    { el: document.getElementById('layer-clouds'),    speed: 0.12 },
    { el: document.getElementById('layer-far-peaks'), speed: 0.22 },
    { el: document.getElementById('layer-mid'),       speed: 0.45 },
    { el: document.getElementById('layer-near'),      speed: 0.85 },
    { el: document.getElementById('layer-snow'),      speed: 0.35 },
  ];

  // Cable car also advances along X (CSS keyframes do micro-sway; JS adds loop wrap)
  const carRig = document.getElementById('car-rig');
  const carSway = document.getElementById('car-sway');

  let t0 = performance.now();
  let carX = 0;
  const CAR_SPEED = 22; // px/s along +X visual sense; parallax layers counter-scroll

  function frame(now) {
    const dt = Math.min(0.05, (now - t0) / 1000);
    t0 = now;
    carX += CAR_SPEED * dt;

    // parallax: background slides opposite to travel (rightward car → leftward bg)
    for (const L of layers) {
      if (!L.el) continue;
      // wrap within a tile width so layers loop seamlessly
      const offset = -((carX * L.speed) % 200);
      L.el.setAttribute('transform', 'translate(' + offset.toFixed(2) + ',0)');
    }

    // keep cabin roughly centered with a gentle longitudinal drift
    const drift = Math.sin(now / 4000) * 18;
    carRig.setAttribute('transform', 'translate(' + drift.toFixed(2) + ',0)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Optional: pause CSS animations when tab hidden (saves battery)
  document.addEventListener('visibilitychange', function () {
    const play = document.visibilityState === 'visible' ? 'running' : 'paused';
    document.querySelectorAll('.star,.cloud,.sheave,.sheave-sm,.leg-fore,.leg-mid-l,.leg-mid-r,.leg-hind-l,.leg-hind-r,.antenna,.mandible,.elytra,.lamp,.flake')
      .forEach(function (n) { n.style.animationPlayState = play; });
    if (carSway) carSway.style.animationPlayState = play;
  });
})();
</script>
