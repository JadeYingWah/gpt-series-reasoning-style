<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Beetle Cable-Car · SVG008</title>

<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a2744;
    --sky-horizon: #3d2a4a;
    --sky-glow: #c45c3a;
    --cable: #2a2030;
    --cabin-body: #1e3a5f;
    --cabin-light: #f0c75e;
    --shell: #1a4d3a;
    --shell-hi: #2f8f6b;
    --shell-dark: #0d2a20;
    --eye: #f5e6a8;
    --leg: #3d2817;
    --tower: #1a1520;
    --far-mtn: #152038;
    --mid-mtn: #1e2a48;
    --near-mtn: #141828;
    --snow: #c8d4e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--sky-top);
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  svg.scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  /* ========== 前进方向：右 ========== */
  /* 背景视差层向左滚动 = 载具相对世界向右前进 */
  @keyframes parallax-far  {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  @keyframes parallax-mid {
    from { transform: translateX(0); }
    to   { transform: translateX(-2400px); }
  }
  @keyframes parallax-near {
    from { transform: translateX(0); }
    to   { transform: translateX(-3600px); }
  }
  @keyframes parallax-tower {
    from { transform: translateX(0); }
    to   { transform: translateX(-4000px); }
  }
  .layer-far  { animation: parallax-far   80s linear infinite; }
  .layer-mid  { animation: parallax-mid   50s linear infinite; }
  .layer-near { animation: parallax-near  32s linear infinite; }
  .layer-tower{ animation: parallax-tower 28s linear infinite; }

  /* ========== 缆车整体轻微上下颠簸（吊挂摆动） ========== */
  @keyframes cabin-sway {
    0%   { transform: rotate(-1.2deg) translateY(0px); }
    25%  { transform: rotate(0.6deg)  translateY(3px); }
    50%  { transform: rotate(1.4deg)  translateY(1px); }
    75%  { transform: rotate(-0.4deg) translateY(4px); }
    100% { transform: rotate(-1.2deg) translateY(0px); }
  }
  .cabin-group {
    transform-origin: 640px 140px; /* 吊挂点（滑轮中心） */
    animation: cabin-sway 3.6s ease-in-out infinite;
    /* 可选指针微调（由 JS 写入；默认为 0，与 sway 动画叠加） */
    rotate: var(--extra-tilt, 0deg);
  }

  /* ========== 滑轮旋转：向右前进 → 顺时针 ========== */
  @keyframes pulley-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .pulley-wheel {
    transform-origin: 640px 140px;
    animation: pulley-spin 1.1s linear infinite;
  }

  /* ========== 车厢底部小导轮：同样顺时针 ========== */
  @keyframes guide-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .guide-wheel {
    animation: guide-spin 0.7s linear infinite;
  }

  /* ========== 甲虫身体相对车厢的独立微动 ========== */
  /* 不是整车锁死平移：躯干在车厢内上下起伏 */
  @keyframes beetle-torso-bob {
    0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
    30%      { transform: translate(1px, 2px) rotate(0.5deg); }
    60%      { transform: translate(-0.5px, 1px) rotate(-0.4deg); }
  }
  .beetle-torso {
    transform-origin: 560px 300px;
    animation: beetle-torso-bob 1.8s ease-in-out infinite;
  }

  /* ========== 触角：左右独立摆动（附肢 1） ========== */
  @keyframes antenna-left {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-18deg); }
    70%      { transform: rotate(10deg); }
  }
  @keyframes antenna-right {
    0%, 100% { transform: rotate(0deg); }
    35%      { transform: rotate(14deg); }
    65%      { transform: rotate(-12deg); }
  }
  .antenna-l {
    transform-origin: 520px 268px;
    animation: antenna-left 2.1s ease-in-out infinite;
  }
  .antenna-r {
    transform-origin: 528px 262px;
    animation: antenna-right 1.7s ease-in-out infinite;
  }

  /* ========== 前足踩踏控制杆（附肢 2） ========== */
  @keyframes foreleg-left-step {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-22deg); }
  }
  @keyframes foreleg-right-step {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(16deg); }
  }
  .foreleg-l {
    transform-origin: 545px 310px;
    animation: foreleg-left-step 1.4s ease-in-out infinite;
  }
  .foreleg-r {
    transform-origin: 555px 305px;
    animation: foreleg-right-step 1.4s ease-in-out infinite 0.7s;
  }

  /* ========== 中足轻扶窗框（附肢 3，附加） ========== */
  @keyframes midleg-sway {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(6deg) translateY(1px); }
  }
  .midleg-l {
    transform-origin: 575px 318px;
    animation: midleg-sway 2.0s ease-in-out infinite 0.3s;
  }

  /* ========== 鞘翅轻微开合（呼吸/颠簸反馈） ========== */
  @keyframes elytra-twitch {
    0%, 85%, 100% { transform: translateY(0) rotate(0deg); }
    90%           { transform: translateY(-2px) rotate(-1.5deg); }
  }
  .elytra-group {
    transform-origin: 590px 290px;
    animation: elytra-twitch 4.5s ease-in-out infinite;
  }

  /* ========== 鞘翅金属光泽扫过 ========== */
  @keyframes sheen {
    0%   { opacity: 0; transform: translateX(-40px); }
    40%  { opacity: 0.55; }
    100% { opacity: 0; transform: translateX(50px); }
  }
  .shell-sheen {
    animation: sheen 5.5s ease-in-out infinite;
  }

  /* ========== 头部微转（相对躯干再独立） ========== */
  @keyframes head-glance {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-4deg); }
    70%      { transform: rotate(2deg); }
  }
  .beetle-head {
    transform-origin: 525px 280px;
    animation: head-glance 3.2s ease-in-out infinite;
  }

  /* ========== 星星闪烁 ========== */
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }
  .star-a { animation: twinkle 2.4s ease-in-out infinite; }
  .star-b { animation: twinkle 3.1s ease-in-out infinite 0.5s; }
  .star-c { animation: twinkle 1.8s ease-in-out infinite 1.1s; }

  /* ========== 月晕 ========== */
  @keyframes moon-glow {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50%      { opacity: 0.55; transform: scale(1.06); }
  }
  .moon-halo {
    transform-origin: 980px 90px;
    animation: moon-glow 6s ease-in-out infinite;
  }

  /* ========== 车厢灯芯闪 ========== */
  @keyframes lamp-flicker {
    0%, 100% { opacity: 0.85; }
    10% { opacity: 0.6; }
    12% { opacity: 0.95; }
    55% { opacity: 0.7; }
    58% { opacity: 1; }
  }
  .cabin-lamp { animation: lamp-flicker 2.8s ease-in-out infinite; }

  /* ========== 主缆轻微颤动 ========== */
  @keyframes cable-vibrate {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(1.2px); }
  }
  .main-cable {
    animation: cable-vibrate 0.9s ease-in-out infinite;
  }

  /* 无障碍：尊重减少动态 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<div class="stage" aria-label="甲虫驾驶缆车向右行进的黄昏山景">
<svg class="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Beetle Cable-Car</title>
  <desc>一只甲虫驾驶着缆车，沿主缆向画面右侧前进，背景为黄昏山峦多层视差。</desc>

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#070c1c"/>
      <stop offset="35%" stop-color="#0f1a38"/>
      <stop offset="62%" stop-color="#2a2850"/>
      <stop offset="82%" stop-color="#5a3558"/>
      <stop offset="100%" stop-color="#c45c3a"/>
    </linearGradient>
    <!-- 远山雪线 -->
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eef8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a8b8d0" stop-opacity="0.15"/>
    </linearGradient>
    <!-- 车厢金属 -->
    <linearGradient id="cabinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a5a8a"/>
      <stop offset="45%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2438"/>
    </linearGradient>
    <!-- 鞘翅渐变 -->
    <linearGradient id="shellGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"  stop-color="#3aad82"/>
      <stop offset="40%" stop-color="#1a6b4d"/>
      <stop offset="100%" stop-color="#0a2a1c"/>
    </linearGradient>
    <linearGradient id="shellGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4ecf9a"/>
      <stop offset="50%" stop-color="#1f7a55"/>
      <stop offset="100%" stop-color="#0c3020"/>
    </linearGradient>
    <!-- 窗玻璃反光 -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec8e8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#f0c75e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1a3040" stop-opacity="0.45"/>

    <!-- 月亮 -->
    <radialGradient id="moonGrad" cx="50%" cy="45%" r="50%">

    <!-- 塔架 -->

    <!-- 重复用的远山轮廓（可平铺） -->
    <symbol id="mtn-far" viewBox="0 0 400 160" overflow="visible">
      <path d="M0,160 L40,90 L70,120 L110,50 L150,100 L180,70 L220,110 L260,40 L300,95 L340,60 L370,100 L400,80 L400,160 Z"
            fill="#152038"/>

    <symbol id="mtn-mid" viewBox="0 0 500 140" overflow="visible">
      <path d="M0,140 L50,70 L90,100 L140,35 L190,90 L240,55 L280,95 L330,25 L380,80 L430,50 L470,90 L500,70 L500,140 Z"
            fill="#1e2a48"/>
      <path d="M140,35 L158,68 L122,68 Z" fill="#6a7890" opacity="0.35"/>
      <path d="M330,25 L350,62 L310,62 Z" fill="#6a7890" opacity="0.4"/>
    </symbol>
    <symbol id="mtn-near" viewBox="0 0 600 120" overflow="visible">
      <path d="M0,120 L60,50 L100,80 L160,20 L220,75 L280,40 L340,85 L400,15 L460,70 L520,35 L560,75 L600,55 L600,120 Z"
            fill="#141828"/>

    <symbol id="tower" viewBox="0 0 80 220" overflow="visible">

      <line x1="14" y1="170" x2="66" y2="170" stroke="#2a2438" stroke-width="2"/>
      <!-- 滑轮组横梁 -->
      <rect x="10" y="8" width="60" height="14" rx="2" fill="#3a3048"/>
      <circle cx="22" cy="15" r="6" fill="#4a4060" stroke="#1a1520" stroke-width="1.5"/>
      <circle cx="58" cy="15" r="6" fill="#4a4060" stroke="#1a1520" stroke-width="1.5"/>

    <!-- 云朵 -->
    <symbol id="cloud" viewBox="0 0 200 50" overflow="visible">
      <ellipse cx="50" cy="30" rx="40" ry="16" fill="#3a3858" opacity="0.45"/>
      <ellipse cx="90" cy="25" rx="50" ry="18" fill="#4a4068" opacity="0.4"/>
      <ellipse cx="140" cy="30" rx="35" ry="14" fill="#3a3858" opacity="0.45"/>
    </symbol>
  </defs>

  <!-- ============ 天空底 ============ -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>

  <!-- 星空 -->
  <g fill="#e8ecf8">
    <circle class="star-a" cx="80"  cy="50"  r="1.4"/>
    <circle class="star-b" cx="160" cy="90"  r="1.0"/>
    <circle class="star-c" cx="240" cy="40"  r="1.5"/>
    <circle class="star-a" cx="320" cy="110" r="0.9"/>
    <circle class="star-b" cx="400" cy="55"  r="1.3"/>
    <circle class="star-c" cx="480" cy="75"  r="1.1"/>
    <circle class="star-a" cx="560" cy="30"  r="1.6"/>
    <circle class="star-b" cx="700" cy="95"  r="1.0"/>
    <circle class="star-c" cx="780" cy="45"  r="1.4"/>
    <circle class="star-a" cx="900" cy="120" r="0.8"/>
    <circle class="star-b" cx="1050" cy="60" r="1.2"/>
    <circle class="star-c" cx="1120" cy="35" r="1.5"/>
    <circle class="star-a" cx="1180" cy="80" r="1.0"/>
    <circle class="star-b" cx="50"  cy="140" r="0.7"/>
    <circle class="star-c" cx="200" cy="160" r="1.1"/>
    <circle class="star-a" cx="350" cy="70"  r="0.9"/>
    <circle class="star-b" cx="650" cy="50"  r="1.3"/>
    <circle class="star-c" cx="850" cy="100" r="0.8"/>
    <circle class="star-a" cx="1000" cy="140" r="1.0"/>
  </g>

  <!-- 月亮 -->
  <g class="moon-halo">
    <circle cx="980" cy="90" r="48" fill="url(#moonHalo)"/>
  </g>
  <circle cx="980" cy="90" r="28" fill="url(#moonGrad)"/>
  <circle cx="992" cy="82" r="6" fill="#d8c888" opacity="0.35"/>
  <circle cx="970" cy="98" r="4" fill="#d8c888" opacity="0.3"/>

  <!-- ============ 视差层 1：远山（最慢） ============ -->
  <g class="layer-far">
    <use href="#mtn-far" x="0"   y="340" width="400" height="160"/>
    <use href="#mtn-far" x="380" y="330" width="420" height="170"/>
    <use href="#mtn-far" x="780" y="345" width="400" height="155"/>
    <use href="#mtn-far" x="1160" y="335" width="410" height="165"/>
    <use href="#mtn-far" x="1540" y="340" width="400" height="160"/>
    <use href="#mtn-far" x="1920" y="328" width="420" height="172"/>
    <use href="#mtn-far" x="2320" y="338" width="400" height="162"/>
    <use href="#mtn-far" x="2700" y="342" width="400" height="158"/>
    <!-- 远云 -->
    <use href="#cloud" x="100"  y="200" width="200" height="50" opacity="0.5"/>
    <use href="#cloud" x="500"  y="170" width="180" height="45" opacity="0.4"/>
    <use href="#cloud" x="900"  y="210" width="220" height="50" opacity="0.45"/>
    <use href="#cloud" x="1400" y="180" width="190" height="48" opacity="0.4"/>

  </g>

  <!-- ============ 视差层 2：中山（中速） ============ -->
  <g class="layer-mid">
    <use href="#mtn-mid" x="0"    y="380" width="500" height="140"/>
    <use href="#mtn-mid" x="480"  y="375" width="520" height="145"/>
    <use href="#mtn-mid" x="980"  y="382" width="500" height="138"/>
    <use href="#mtn-mid" x="1460" y="378" width="510" height="142"/>

  </g>

  <!-- ============ 视差层 3：近山（较快） ============ -->
  <g class="layer-near">
    <use href="#mtn-near" x="0"    y="420" width="600" height="120"/>
    <use href="#mtn-near" x="580"  y="415" width="620" height="125"/>

  </g>

  <!-- ============ 视差层 4：塔架（最快背景） ============ -->
  <g class="layer-tower">
    <use href="#tower" x="120"  y="100" width="80" height="220"/>
    <use href="#tower" x="720"  y="95"  width="85" height="230"/>
    <use href="#tower" x="1320" y="100" width="80" height="220"/>
    <use href="#tower" x="1920" y="98"  width="82" height="225"/>
    <use href="#tower" x="2520" y="100" width="80" height="220"/>
    <use href="#tower" x="3120" y="96"  width="84" height="228"/>
    <use href="#tower" x="3720" y="100" width="80" height="220"/>
  </g>

  <!-- ============ 主缆（横贯画面，轻微颤动） ============ -->
  <g class="main-cable">
    <!-- 主承重缆 -->
    <path d="M0,132 C200,128 400,136 600,130 C800,124 1000,134 1200,128"
          fill="none" stroke="#1a1420" stroke-width="5" stroke-linecap="round"/>
    <path d="M0,132 C200,128 400,136 600,130 C800,124 1000,134 1200,128"
          fill="none" stroke="#3a3048" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- 辅助缆 -->
    <path d="M0,148 C200,145 400,152 600,146 C800,140 1000,150 1200,144"
          fill="none" stroke="#1a1420" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- ============ 地面雾气（近景氛围） ============ -->
  <ellipse cx="200" cy="560" rx="180" ry="30" fill="#0a1020" opacity="0.35"/>
  <ellipse cx="600" cy="580" rx="220" ry="35" fill="#0a1020" opacity="0.3"/>
  <ellipse cx="1000" cy="570" rx="200" ry="32" fill="#0a1020" opacity="0.32"/>

  <!-- ============ 缆车总成 ============ -->
  <!--
    运动自洽：
    1. 滑轮 pulley-wheel 顺时针旋转 → 与向右前进一致（触缆侧线速度向右）
    2. 背景层向左视差 → 世界相对载具向左 = 载具向右
    3. 甲虫触角 / 前足 / 中足 / 头部 相对车厢有独立动画（非整车锁死）
  -->
  <g class="cabin-group">

    <!-- 吊挂臂（连接滑轮与车厢） -->
    <g>
      <rect x="632" y="150" width="16" height="90" rx="3" fill="#2a3548"/>
      <rect x="636" y="155" width="8" height="80" fill="#3a4860" opacity="0.5"/>
      <!-- 侧撑 -->
      <line x1="640" y1="170" x2="600" y2="230" stroke="#2a3548" stroke-width="4" stroke-linecap="round"/>
      <line x1="640" y1="170" x2="680" y2="230" stroke="#2a3548" stroke-width="4" stroke-linecap="round"/>
    </g>

<script>
/* 无网络依赖。仅用于：指针位置微调视差强度（可选交互，不影响静态合规） */
(function () {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }
  var stage = document.querySelector('.stage');
  if (!stage) return;
  stage.addEventListener('pointermove', function (e) {
    var x = e.clientX / window.innerWidth; // 0..1
    var tilt = (x - 0.5) * 2; // -1..1
    var car = document.querySelector('.cabin-group');
    if (car) {
      // 微调旋转中心附近的额外倾斜，不覆盖 CSS 动画
      car.style.setProperty('--extra-tilt', (tilt * 0.6).toFixed(2) + 'deg');
    }
  }, { passive: true });
})();
</script>
