<title>SVG003 · Crab Snowplow</title>
<!--
  SVG003-crab-snowplow — 几何 / 运动自洽说明（与 notes.md 同步）

  1. 前进方向：整体与镜头均向画面右侧推进（车头在右，雪铲朝右）。
  2. 车轮旋转：侧视、车头朝右时，前进 = 顺时针旋转（CSS rotate + 视觉辐条方向一致）。
  3. 履带式雪痕：地面雪纹向左飘，暗示相对地面的前进。
  4. crab 附肢相对载具（≥2 处，非锁死平移）：
     - 眼柄：独立 sine 摆动（左右异相），与车身 bob 不同相。
     - 左/右螯：轻微夹持/抖动，相对方向盘有微位移。
     - 步足：相对底盘的摆动相位错开，不与车身刚体同步。
     - 触角：慢速摇摆。
  5. 背景视差（≥2 层）：
     L1 星空/极光 — 最慢
     L2 远山 — 慢
     L3 中景针叶林 — 中
     L4 地面雪原 + 车体 — 基准
     L5 前景雪丘/雪尘 — 最快
  6. 无 CDN / 无外链 / 无框架 / 无网络请求；纯 HTML+CSS+内联 SVG。
-->
<style>
  :root {
    --sky-top: #0b1026;
    --sky-mid: #1a2744;
    --sky-low: #3d4f6f;
    --snow: #d7e6f5;
    --snow-deep: #a8c0d8;
    --crab: #e85d3a;
    --crab-dark: #b33a22;
    --crab-shell: #f07850;
    --truck: #1f3d4a;
    --truck-hi: #2d5a6e;
    --plow: #d4a017;
    --plow-dark: #8a680c;
    --beacon: #ffb020;
    --window: #7ec8e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #060914;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  svg.scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .hud {
    position: absolute;
    left: 16px; bottom: 12px;
    color: rgba(200, 220, 240, 0.55);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }

  /* ── parallax helpers ── */
  .layer { will-change: transform; }

  /* ── vehicle body bob ── */
  @keyframes bodyBob {
    0%   { transform: translateY(0px) rotate(0deg); }
    25%  { transform: translateY(-2.2px) rotate(0.15deg); }
    50%  { transform: translateY(0px) rotate(0deg); }
    75%  { transform: translateY(-1.4px) rotate(-0.12deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }
  .vehicle-bob {
    animation: bodyBob 0.55s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }

  /* ── wheels: clockwise = rightward travel ── */
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel {
    animation: spinCW 0.45s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .wheel.rear { animation-duration: 0.5s; }

  /* ── plow blade micro-jitter ── */
  @keyframes plowJitter {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    20%  { transform: translateY(0.6px) rotate(0.25deg); }
    45%  { transform: translateY(-0.4px) rotate(-0.15deg); }
    70%  { transform: translateY(0.3px) rotate(0.1deg); }
  }
  .plow-blade {
    animation: plowJitter 0.28s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 15% 50%;
  }

  /* ── crab eye stalks: independent phase ── */
  @keyframes eyeWobbleL {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(8deg); }
  }
  @keyframes eyeWobbleR {
    0%, 100% { transform: rotate(7deg); }
    50%      { transform: rotate(-5deg); }
  }
  .eye-stalk-l {
    animation: eyeWobbleL 1.1s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .eye-stalk-r {
    animation: eyeWobbleR 0.85s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  @keyframes pupilNudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(1.2px); }
  }
  .pupils { animation: pupilNudge 1.6s ease-in-out infinite; }

  /* ── claws gripping wheel ── */
  @keyframes clawGripL {
    0%, 100% { transform: rotate(0deg) translate(0,0); }
    35%      { transform: rotate(-3deg) translate(0.6px, 0.4px); }
    70%      { transform: rotate(1.5deg) translate(-0.3px, -0.2px); }
  }
  @keyframes clawGripR {
    0%, 100% { transform: rotate(0deg) translate(0,0); }
    40%      { transform: rotate(2.5deg) translate(-0.5px, 0.3px); }
    75%      { transform: rotate(-1.2deg) translate(0.4px, -0.3px); }
  }
  .claw-l {
    animation: clawGripL 0.72s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 80% 30%;
  }
  .claw-r {
    animation: clawGripR 0.62s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: 20% 30%;
  }

  /* ── walking legs (relative to vehicle) ── */
  @keyframes legSwing1 {
    0%, 100% { transform: rotate(-4deg); }
    50%      { transform: rotate(7deg); }
  }
  @keyframes legSwing2 {
    0%, 100% { transform: rotate(5deg); }
    50%      { transform: rotate(-6deg); }
  }
  @keyframes legSwing3 {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(6deg); }
  }
  .leg-a {
    animation: legSwing1 0.9s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 0%;
  }
  .leg-b {
    animation: legSwing2 0.75s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 0%;
  }
  .leg-c {
    animation: legSwing3 1.05s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 0%;
  }

  /* ── antennae ── */
  @keyframes antennaWave {
    0%, 100% { transform: rotate(-10deg); }
    50%      { transform: rotate(12deg); }
  }
  .ant-l {
    animation: antennaWave 1.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 100%;
  }
  .ant-r {
    animation: antennaWave 1.25s ease-in-out infinite reverse;
    transform-box: fill-box; transform-origin: 50% 100%;
  }

  /* ── beacon flash ── */
  @keyframes beaconPulse {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }
  .beacon-glow {
    animation: beaconPulse 0.7s ease-in-out infinite;
  }

  /* ── exhaust puffs ── */
  @keyframes puff {
    0%   { opacity: 0.55; transform: translate(0,0) scale(0.6); }
    60%  { opacity: 0.28; transform: translate(-28px,-18px) scale(1.15); }
    100% { opacity: 0;    transform: translate(-55px,-38px) scale(1.5); }
  }
  .puff1 { animation: puff 1.4s ease-out infinite; }
  .puff2 { animation: puff 1.4s ease-out infinite 0.45s; }
  .puff3 { animation: puff 1.4s ease-out infinite 0.9s; }

  /* ── snow spray from plow ── */
  @keyframes spray {
    0%   { opacity: 0.85; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0;   transform: translate(-40px, -50px) scale(1.3); }
  }
  .s1 { animation: spray 0.7s ease-out infinite; }
  .s2 { animation: spray 0.7s ease-out infinite 0.12s; }
  .s3 { animation: spray 0.7s ease-out infinite 0.24s; }
  .s4 { animation: spray 0.7s ease-out infinite 0.36s; }
  .s5 { animation: spray 0.7s ease-out infinite 0.48s; }
  .s6 { animation: spray 0.7s ease-out infinite 0.58s; }

  /* ── falling snow (JS-assisted, also CSS fallback) ── */
  @keyframes snowFall {
    0%   { transform: translate(0, -20px); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translate(-30px, 720px); opacity: 0.15; }
  }
  .flake { animation: snowFall linear infinite; }

  /* ── ground snow texture drift ── */
  @keyframes groundDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  .ground-drift {
    animation: groundDrift 3.2s linear infinite;
  }

  /* ── mid trees scroll ── */
  @keyframes midScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-400px); }
  }
  .mid-scroll {
    animation: midScroll 14s linear infinite;
  }

  /* ── far mountains scroll ── */
  @keyframes farScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-300px); }
  }
  .far-scroll {
    animation: farScroll 36s linear infinite;
  }

  /* ── aurora shimmer ── */
  @keyframes aurora {
    0%, 100% { opacity: 0.35; transform: translateY(0); }
    50%      { opacity: 0.7;  transform: translateY(-8px); }
  }
  .aurora-a { animation: aurora 5s ease-in-out infinite; }
  .aurora-b { animation: aurora 6.5s ease-in-out infinite 1s; }

  /* ── star twinkle ── */
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }
  .star { animation: twinkle ease-in-out infinite; }

  /* ── headlight beam ── */
  @keyframes beam {
    0%, 100% { opacity: 0.18; }
    50%      { opacity: 0.32; }
  }
  .headlight-beam {
    animation: beam 2s ease-in-out infinite;
  }
</style>
</head>
