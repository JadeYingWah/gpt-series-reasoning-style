<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>极简番茄钟</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --card: #fffdf8;
      --ink: #2b241c;
      --muted: #7a6f63;
      --accent: #c45c26;
      --accent-soft: #f3d9c7;
      --ok: #2f6f4e;
      --warn: #b33a3a;
      --border: #e4d8c8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #fff8ec 0%, transparent 45%),
        radial-gradient(circle at bottom right, #efe3d2 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
    }

    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 24px;
      box-shadow: 0 18px 40px rgba(74, 54, 36, 0.08);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
    }

    .status {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status.running { color: var(--accent); }
    .status.done { color: var(--ok); font-weight: 600; }
    .status.paused { color: var(--warn); }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.5rem, 12vw, 4.5rem);
      line-height: 1;
      text-align: center;
      letter-spacing: 0.04em;
      margin: 12px 0 20px;
      user-select: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    button:active:not(:disabled) { transform: translateY(1px); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: #a84a1c;
      border-color: #a84a1c;
    }

    .config {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    label {
      font-size: 0.92rem;
      color: var(--muted);
    }

    input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      text-align: center;
      color: var(--ink);
      background: #fff;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .error {
      margin-top: 8px;
      color: var(--warn);
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="card" id="app">
    <header>
      <h1>极简番茄钟</h1>
      <div class="status" id="status" data-state="idle">就绪</div>
    </header>

    <div class="timer" id="display" aria-live="polite">25:00</div>

    <div class="controls">
      <button type="button" id="startBtn" class="primary">开始</button>
      <button type="button" id="pauseBtn" disabled>暂停</button>
      <button type="button" id="resetBtn">重置</button>
    </div>

    <div class="config">
      <label for="minutes">时长（1–60 分钟）</label>
      <input
        id="minutes"
        type="number"
        min="1"
        max="60"
        step="1"
        value="25"
        inputmode="numeric"
      />
    </div>

    <div class="error" id="error" role="alert"></div>
    <p class="hint">
      结束后状态文案变为「时间到」，并尝试用 Web Audio 播放提示音；若浏览器拦截或不支持，则静默结束。
    </p>
  </main>

  <script>
    "use strict";

    /**
     * 番茄钟核心状态机（可被源码审查 / Node 抽离核对）
     *
     * state: idle | running | paused | done
     * remainingSeconds: 剩余秒数
     * totalSeconds: 本轮总时长（秒）
     */
    const Pomodoro = {
      DEFAULT_MINUTES: 25,
      MIN_MINUTES: 1,
      MAX_MINUTES: 60,

      state: "idle",
      remainingSeconds: 25 * 60,
      totalSeconds: 25 * 60,
      deadlineTs: null,
      timerId: null,
      onTick: null,
      onComplete: null,

      /** 将分钟数规范化为 1–60 的正整数；非法值返回 null */
      normalizeMinutes(value) {
        const n = Math.trunc(Number(value));
        if (!Number.isFinite(n)) return null;
        if (n < this.MIN_MINUTES || n > this.MAX_MINUTES) return null;
        return n;
      },

      /** 秒 → mm:ss */
      format(seconds) {
        const s = Math.max(0, Math.floor(seconds));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      },

      /** 设置时长（分钟）；仅在非 running 时允许改总时长 */
      setDuration(minutes) {
        const m = this.normalizeMinutes(minutes);
        if (m === null) {
          return { ok: false, error: "时长必须是 1–60 的正整数" };
        }
        if (this.state === "running") {
          return { ok: false, error: "运行中不可修改时长，请先暂停或重置" };
        }
        this.totalSeconds = m * 60;
        this.remainingSeconds = this.totalSeconds;
        this.deadlineTs = null;
        this.state = "idle";
        this._clearTimer();
        this._emit();
        return { ok: true, minutes: m, seconds: this.totalSeconds };
      },

      start() {
        if (this.state === "running") {
          return { ok: true, state: this.state };
        }
        if (this.state === "done" || this.remainingSeconds <= 0) {
          // 结束后再开始：从当前配置的总时长重新计
          this.remainingSeconds = this.totalSeconds;
        }
        this.state = "running";
        this.deadlineTs = Date.now() + this.remainingSeconds * 1000;
        this._armTimer();
        this._emit();
        return { ok: true, state: this.state, remaining: this.remainingSeconds };
      },

      pause() {
        if (this.state !== "running") {
          return { ok: false, error: "当前不在计时中" };
        }
        this._syncFromDeadline();
        this._clearTimer();
        this.state = "paused";
        this._emit();
        return { ok: true, state: this.state, remaining: this.remainingSeconds };
      },

      reset() {
        this._clearTimer();
        this.deadlineTs = null;
        this.remainingSeconds = this.totalSeconds;
        this.state = "idle";
        this._emit();
        return { ok: true, state: this.state, remaining: this.remainingSeconds };
      },

      /** 用 deadline 对齐剩余时间（防 setInterval 漂移） */
      _syncFromDeadline() {
        if (this.deadlineTs == null) return;
        const ms = this.deadlineTs - Date.now();
        this.remainingSeconds = ms <= 0 ? 0 : Math.ceil(ms / 1000);
      },

      _armTimer() {
        this._clearTimer();
        this.timerId = setInterval(() => {
          this._syncFromDeadline();
          if (this.remainingSeconds <= 0) {
            this.remainingSeconds = 0;
            this._clearTimer();
            this.deadlineTs = null;
            this.state = "done";
            this._emit();
            if (typeof this.onComplete === "function") this.onComplete();
            return;
          }
          this._emit();
        }, 250);
      },

      _clearTimer() {
        if (this.timerId != null) {
          clearInterval(this.timerId);
          this.timerId = null;
        }
      },

      _emit() {
        if (typeof this.onTick === "function") {
          this.onTick({
            state: this.state,
            remainingSeconds: this.remainingSeconds,
            totalSeconds: this.totalSeconds,
            display: this.format(this.remainingSeconds),
          });
        }
      },
    };

    // ---- UI wiring ----
    const el = {
      display: document.getElementById("display"),
      status: document.getElementById("status"),
      startBtn: document.getElementById("startBtn"),
      pauseBtn: document.getElementById("pauseBtn"),
      resetBtn: document.getElementById("resetBtn"),
      minutes: document.getElementById("minutes"),
      error: document.getElementById("error"),
    };

    const STATUS_TEXT = {
      idle: "就绪",
      running: "计时中",
      paused: "已暂停",
      done: "时间到",
    };

    function showError(msg) {
      el.error.textContent = msg || "";
    }

    function render(view) {
      el.display.textContent = view.display;
      el.status.textContent = STATUS_TEXT[view.state] || view.state;
      el.status.dataset.state = view.state;

      el.startBtn.disabled = view.state === "running";
      el.pauseBtn.disabled = view.state !== "running";

      // done 后允许改时长；running 时锁定输入
      el.minutes.disabled = view.state === "running";
    }

    /** 尝试 Web Audio beep；失败则静默（不阻断 UI） */
    function tryBeep() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return false;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
        osc.onended = () => {
          try { ctx.close(); } catch (_) { /* ignore */ }
        };
        return true;
      } catch (_) {
        return false;
      }
    }

    Pomodoro.onTick = render;
    Pomodoro.onComplete = () => {
      tryBeep();
      showError("");
    };

    el.startBtn.addEventListener("click", () => {
      showError("");
      Pomodoro.start();
    });

    el.pauseBtn.addEventListener("click", () => {
      showError("");
      Pomodoro.pause();
    });

    el.resetBtn.addEventListener("click", () => {
      showError("");
      Pomodoro.reset();
    });

    el.minutes.addEventListener("change", () => {
      const result = Pomodoro.setDuration(el.minutes.value);
      if (!result.ok) {
        showError(result.error);
        // 恢复显示为当前有效时长
        el.minutes.value = String(Pomodoro.totalSeconds / 60);
        return;
      }
      showError("");
      el.minutes.value = String(result.minutes);
    });

    // 初次渲染
    render({
      state: Pomodoro.state,
      remainingSeconds: Pomodoro.remainingSeconds,
      totalSeconds: Pomodoro.totalSeconds,
      display: Pomodoro.format(Pomodoro.remainingSeconds),
    });

    // 供源码审查 / 控制台手动核对（非 CDN，纯本地）
    window.Pomodoro = Pomodoro;
  </script>
</body>
</html>
