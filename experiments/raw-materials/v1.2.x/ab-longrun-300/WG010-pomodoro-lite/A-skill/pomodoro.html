<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>番茄钟</title>
  <style>
    /* Design tokens — warm desk-timer, not dark/neon default */
    :root {
      --paper: #f3ede4;
      --surface: #fffdf9;
      --ink: #2c241c;
      --muted: #8a7e70;
      --tomato: #c23b22;
      --tomato-deep: #9a2e1a;
      --track: #e5d9c8;
      --sage: #5c7a5e;
      --amber: #b8860b;
      --border: #e0d4c3;
      --shadow: 0 12px 40px rgba(44, 36, 28, 0.08);
      --radius: 20px;
      font-family: "Segoe UI", "Iowan Old Style", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(194, 59, 34, 0.06), transparent 55%),
        var(--paper);
      color: var(--ink);
      padding: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.25rem 2rem 1.75rem;
      width: min(100%, 360px);
      text-align: center;
    }

    .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    /* Signature: ring + digits as one instrument face */
    .dial {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 1.1rem;
    }

    .dial svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .dial .track {
      fill: none;
      stroke: var(--track);
      stroke-width: 8;
    }

    .dial .progress {
      fill: none;
      stroke: var(--tomato);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
    }

    .dial.is-done .progress { stroke: var(--tomato-deep); }
    .dial.is-paused .progress { stroke: var(--amber); }
    .dial.is-running .progress { stroke: var(--tomato); }

    .dial-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    #display {
      font-family: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
      font-size: 3.1rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    #status {
      min-height: 1.35em;
      font-size: 0.88rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    #status.running { color: var(--sage); }
    #status.paused  { color: var(--amber); }
    #status.done    { color: var(--tomato); font-weight: 700; letter-spacing: 0.12em; }

    .controls {
      display: flex;
      gap: 0.55rem;
      justify-content: center;
      margin: 0 0 1.35rem;
    }

    button {
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0.7rem 1.15rem;
      min-width: 5.5rem;
      min-height: 44px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    button:focus-visible {
      outline: 2px solid var(--tomato);
      outline-offset: 3px;
    }

    button:active:not(:disabled) { transform: scale(0.97); }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      background: var(--tomato);
      color: #fff;
      border-color: var(--tomato);
    }

    button.primary:hover:not(:disabled) {
      background: var(--tomato-deep);
      border-color: var(--tomato-deep);
    }

    button.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--border);
    }

    button.ghost:hover:not(:disabled) {
      border-color: var(--muted);
      background: rgba(44, 36, 28, 0.03);
    }

    .config {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 0.55rem;
      font-size: 0.88rem;
      color: var(--muted);
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .config label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #minutes {
      width: 4.4rem;
      font: inherit;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      padding: 0.45rem 0.5rem;
      min-height: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      text-align: center;
    }

    #minutes:focus-visible {
      outline: 2px solid var(--tomato);
      outline-offset: 2px;
      border-color: var(--tomato);
    }

    #minutes:disabled { opacity: 0.45; }

    #apply {
      min-width: auto;
      min-height: 40px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--ink);
    }

    #apply:hover:not(:disabled) {
      border-color: var(--tomato);
      color: var(--tomato);
    }

    #apply:disabled { opacity: 0.4; }

    .hint {
      margin-top: 0.9rem;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.85;
      line-height: 1.45;
    }

    @media (prefers-reduced-motion: reduce) {
      button, .dial .progress { transition: none; }
      button:active:not(:disabled) { transform: none; }
    }

    @media (max-width: 380px) {
      .card { padding: 1.5rem 1.1rem 1.25rem; }
      .dial { width: 190px; height: 190px; }
      #display { font-size: 2.55rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Focus · 专注</p>

    <div class="dial" id="dial" aria-hidden="true">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <circle class="track" cx="110" cy="110" r="100" />
        <circle class="progress" id="ring" cx="110" cy="110" r="100" />
      </svg>
      <div class="dial-face">
        <div id="display" aria-live="polite">25:00</div>
        <div id="status" role="status">就绪</div>
      </div>
    </div>

    <!-- accessible name for the dial region -->
    <p class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">
      倒计时显示
    </p>

    <div class="controls">
      <button id="startPause" class="primary" type="button">开始</button>
      <button id="reset" class="ghost" type="button">重置</button>
    </div>

    <div class="config">
      <label for="minutes">时长（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" value="25" inputmode="numeric" />
      <button id="apply" type="button">应用</button>
    </div>

    <p class="hint">1–60 正整数 · 结束时显示「时间到」并尝试播放提示音</p>
  </main>

  <script>
    "use strict";

    /* ========== Pure core — Node-checkable, no DOM ========== */
    const PomodoroCore = {
      /** Validate minutes: integer 1..60, else null. */
      parseMinutes(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return null;
        if (!Number.isInteger(n)) return null;
        if (n < 1 || n > 60) return null;
        return n;
      },

      /** Format seconds as MM:SS (clamped at 0). */
      format(seconds) {
        const s = Math.max(0, Math.floor(seconds));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
      },

      /**
       * Create a countdown controller.
       * @param {number} minutes 1..60
       * @param {{onTick?: (remaining:number)=>void, onDone?: ()=>void, now?: ()=>number}} [hooks]
       */
      create(minutes, hooks) {
        hooks = hooks || {};
        const totalSeconds = minutes * 60;
        const now = hooks.now || function () { return Date.now(); };
        let remaining = totalSeconds;
        let running = false;
        let endAt = null;
        let intervalId = null;

        function stopInterval() {
          if (intervalId !== null) {
            clearInterval(intervalId);
            intervalId = null;
          }
        }

        function tick() {
          if (!running) return;
          remaining = Math.max(0, Math.ceil((endAt - now()) / 1000));
          if (hooks.onTick) hooks.onTick(remaining);
          if (remaining <= 0) {
            running = false;
            endAt = null;
            stopInterval();
            if (hooks.onDone) hooks.onDone();
          }
        }

        return {
          get remaining() { return remaining; },
          get running() { return running; },
          get totalSeconds() { return totalSeconds; },

          start() {
            if (running || remaining <= 0) return false;
            running = true;
            endAt = now() + remaining * 1000;
            tick();
            if (running && intervalId === null) {
              intervalId = setInterval(tick, 200);
            }
            return true;
          },

          pause() {
            if (!running) return false;
            remaining = Math.max(0, Math.ceil((endAt - now()) / 1000));
            running = false;
            endAt = null;
            stopInterval();
            if (hooks.onTick) hooks.onTick(remaining);
            return true;
          },

          reset() {
            stopInterval();
            running = false;
            endAt = null;
            remaining = totalSeconds;
            if (hooks.onTick) hooks.onTick(remaining);
            return remaining;
          },

          destroy() {
            stopInterval();
            running = false;
            endAt = null;
          },
        };
      },
    };

    /* Node extraction hook */
    if (typeof module !== "undefined" && module.exports) {
      module.exports = PomodoroCore;
    }
    if (typeof window !== "undefined") {
      window.PomodoroCore = PomodoroCore;
    }

    /* ========== DOM wiring (browser only) ========== */
    (function bootstrap() {
      if (typeof document === "undefined") return;

      var $ = function (id) { return document.getElementById(id); };
      var display = $("display");
      var statusEl = $("status");
      var dial = $("dial");
      var ring = $("ring");
      var startPauseBtn = $("startPause");
      var resetBtn = $("reset");
      var minutesInput = $("minutes");
      var applyBtn = $("apply");

      var RADIUS = 100;
      var CIRCUMFERENCE = 2 * Math.PI * RADIUS;
      ring.style.strokeDasharray = String(CIRCUMFERENCE);
      ring.style.strokeDashoffset = "0";

      var minutes = PomodoroCore.parseMinutes(minutesInput.value) || 25;
      minutesInput.value = String(minutes);

      var timer = null;
      var finished = false;

      function beep() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return false;
          var ctx = new Ctx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(ctx.destination);
          var t = ctx.currentTime;
          osc.start(t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
          osc.stop(t + 0.75);
          osc.onended = function () {
            try { ctx.close(); } catch (e) { /* ignore */ }
          };
          return true;
        } catch (e) {
          return false;
        }
      }

      function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || "";
      }

      function setDialState(state) {
        dial.classList.remove("is-running", "is-paused", "is-done");
        if (state) dial.classList.add(state);
      }

      function updateRing(remaining, total) {
        var ratio = total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 0;
        ring.style.strokeDashoffset = String(CIRCUMFERENCE * (1 - ratio));
      }

      function render(remaining) {
        display.textContent = PomodoroCore.format(remaining);
        if (timer) updateRing(remaining, timer.totalSeconds);
      }

      function setConfigEnabled(enabled) {
        minutesInput.disabled = !enabled;
        applyBtn.disabled = !enabled;
      }

      function createTimer() {
        if (timer) timer.destroy();
        finished = false;
        timer = PomodoroCore.create(minutes, {
          onTick: function (remaining) {
            render(remaining);
          },
          onDone: function () {
            finished = true;
            setStatus("时间到", "done");
            setDialState("is-done");
            startPauseBtn.textContent = "开始";
            startPauseBtn.disabled = true;
            minutesInput.disabled = false;
            applyBtn.disabled = false;
            updateRing(0, timer.totalSeconds);
            beep();
          },
        });
        render(timer.remaining);
      }

      startPauseBtn.addEventListener("click", function () {
        if (!timer || finished) return;
        if (timer.running) {
          timer.pause();
          startPauseBtn.textContent = "开始";
          setStatus("已暂停", "paused");
          setDialState("is-paused");
          setConfigEnabled(true);
        } else {
          var started = timer.start();
          if (started) {
            startPauseBtn.textContent = "暂停";
            setStatus("进行中", "running");
            setDialState("is-running");
            setConfigEnabled(false);
          }
        }
      });

      resetBtn.addEventListener("click", function () {
        createTimer();
        startPauseBtn.textContent = "开始";
        startPauseBtn.disabled = false;
        setStatus("就绪", "");
        setDialState(null);
        setConfigEnabled(true);
      });

      applyBtn.addEventListener("click", function () {
        var parsed = PomodoroCore.parseMinutes(minutesInput.value);
        if (parsed === null) {
          setStatus("请输入 1–60 的正整数", "paused");
          minutesInput.value = String(minutes);
          return;
        }
        minutes = parsed;
        createTimer();
        startPauseBtn.textContent = "开始";
        startPauseBtn.disabled = false;
        setStatus("就绪 · " + minutes + " 分钟", "");
        setDialState(null);
        setConfigEnabled(true);
      });

      minutesInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") applyBtn.click();
      });

      createTimer();
    })();
  </script>
</body>
</html>
