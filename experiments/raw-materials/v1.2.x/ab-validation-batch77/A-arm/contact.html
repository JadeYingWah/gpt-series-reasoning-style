<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="联系我 - 发送消息、查看联系方式与社交媒体">
    <title>联系我 - 个人作品集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">跳到主要内容</a>

    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-container">
            <a href="index.html" class="logo" aria-label="返回首页">Portfolio</a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">首页</a></li>
                <li><a href="projects.html">项目</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="contact.html" class="active" aria-current="page">联系</a></li>
            </ul>
            <button class="hamburger" aria-label="切换导航菜单" aria-expanded="false" aria-controls="navMenu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <main id="main-content">
        <section class="page-header">
            <h1>联系我</h1>
            <p>有项目合作或任何问题，欢迎随时联系</p>
        </section>

        <section aria-labelledby="contact-form-title">
            <h2 id="contact-form-title" style="display: none;">联系表单</h2>
            <form class="contact-form" id="contactForm" novalidate aria-label="联系表单">
                <div class="form-group">
                    <label for="name">姓名 <span aria-hidden="true" style="color: #f5576c;">*</span></label>
                    <input type="text" id="name" name="name" required aria-required="true" aria-describedby="name-error" autocomplete="name">
                    <p class="error-message" id="name-error" role="alert">请输入至少2个字符的姓名</p>
                </div>

                <div class="form-group">
                    <label for="email">邮箱 <span aria-hidden="true" style="color: #f5576c;">*</span></label>
                    <input type="email" id="email" name="email" required aria-required="true" aria-describedby="email-error" autocomplete="email">
                    <p class="error-message" id="email-error" role="alert">请输入有效的邮箱地址</p>
                </div>

                <div class="form-group">
                    <label for="subject">主题</label>
                    <input type="text" id="subject" name="subject" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="message">消息 <span aria-hidden="true" style="color: #f5576c;">*</span></label>
                    <textarea id="message" name="message" required aria-required="true" aria-describedby="message-error"></textarea>
                    <p class="error-message" id="message-error" role="alert">请输入至少10个字符的消息内容</p>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1rem;">发送消息</button>
            </form>

            <div class="contact-info" role="list">
                <div class="contact-info-item" role="listitem">
                    <h3>📧 邮箱</h3>
                    <p><a href="mailto:hello@example.com" style="color: var(--text-secondary);">hello@example.com</a></p>
                </div>
                <div class="contact-info-item" role="listitem">
                    <h3>📱 电话</h3>
                    <p>+86 138-0000-0000</p>
                </div>
                <div class="contact-info-item" role="listitem">
                    <h3>📍 地址</h3>
                    <p>中国 · 上海</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="footer-content">
            <p>&copy; <span id="currentYear">2026</span> Portfolio. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="GitHub 主页">GitHub</a>
                <a href="#" aria-label="Twitter 主页">Twitter</a>
                <a href="#" aria-label="LinkedIn 主页">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
