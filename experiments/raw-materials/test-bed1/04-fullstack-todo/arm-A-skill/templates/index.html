<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2f3542; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.6rem; }
  form { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; padding: 10px 12px; border: 1px solid #dcdde1; border-radius: 8px; font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: #3742fa; color: #fff; font-size: 1rem; cursor: pointer; }
  button:hover { background: #2f3542; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px 14px; margin-top: 8px; }
  li span { word-break: break-all; }
  .del { background: #e84118; padding: 4px 10px; font-size: 0.85rem; }
  .del:hover { background: #c23616; }
  .empty { color: #a4b0be; text-align: center; padding: 16px 0; }
  .error { color: #e84118; margin: 8px 0 0; min-height: 1.2em; }
</style>
</head>
<body>
<h1>待办清单</h1>
<form id="add-form">
  <input type="text" id="todo-input" placeholder="输入待办事项…" autocomplete="off">
  <button type="submit">添加</button>
</form>
<p class="error" id="error"></p>
<ul id="todo-list"></ul>
<p class="empty" id="empty">暂无待办，添加一条试试</p>

<script>
const listEl = document.getElementById("todo-list");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");
const inputEl = document.getElementById("todo-input");

function showError(msg) {
  errorEl.textContent = msg;
}

function render(todos) {
  listEl.innerHTML = "";
  emptyEl.style.display = todos.length ? "none" : "block";
  for (const todo of todos) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.textContent = todo.title;               // textContent 防注入
    const del = document.createElement("button");
    del.textContent = "删除";
    del.className = "del";
    del.addEventListener("click", () => removeTodo(todo.id));
    li.append(span, del);
    listEl.append(li);
  }
}

async function loadTodos() {
  try {
    const res = await fetch("/api/todos");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data.todos);
  } catch (err) {
    showError("加载待办失败，请确认后端已启动");
  }
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  showError("");
  const title = inputEl.value.trim();
  if (!title) { showError("内容不能为空"); return; }
  try {
    const res = await fetch("/api/todos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.error || "添加失败");
      return;
    }
    inputEl.value = "";
    await loadTodos();                            // 重新拉取，页面与后端保持一致
  } catch (err) {
    showError("网络错误，添加失败");
  }
});

async function removeTodo(id) {
  try {
    await fetch("/api/todos/" + id, { method: "DELETE" });
    await loadTodos();
  } catch (err) {
    showError("删除失败，请重试");
  }
}

loadTodos();
</script>
</body>
</html>
