[project]
name = "gitlite"
version = "1.0.0"
description = "A minimal Git-like version control tool with its own content-addressed object store (learning project)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GitLite Contributors" }]
keywords = ["git", "version-control", "education", "cli"]

[project.scripts]
gitlite = "gitlite.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gitlite*"]
