<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>协作白板</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🖍️ 协作白板</div>

    <div class="toolbar" id="toolbar">
      <button class="tool active" data-tool="select"  title="选择/移动 (V)">🖱️ 选择</button>
      <button class="tool" data-tool="rect"    title="矩形 (R)">▭ 矩形</button>
      <button class="tool" data-tool="ellipse" title="圆形 (O)">◯ 圆形</button>
      <button class="tool" data-tool="arrow"   title="箭头 (A)">➡ 箭头</button>
      <button class="tool" data-tool="text"    title="文字 (T)">T 文字</button>
      <span class="sep"></span>
      <label class="field" title="描边颜色">
        🎨 <input type="color" id="strokeColor" value="#1e88e5" />
      </label>
      <label class="field" title="填充颜色（选透明则不填充）">
        🪣 <input type="color" id="fillColor" value="#ffffff" />
        <input type="checkbox" id="fillEnabled" title="启用填充" />
      </label>
      <label class="field" title="线宽">
        粗细
        <input type="range" id="strokeWidth" min="1" max="12" step="1" value="2" />
        <span id="strokeWidthLabel">2</span>
      </label>
      <span class="sep"></span>
      <button id="undoBtn" title="撤销 (Ctrl+Z)">↩ 撤销</button>
      <button id="redoBtn" title="重做 (Ctrl+Y)">↪ 重做</button>
      <button id="clearBtn" title="清空白板">🗑 清空</button>
      <button id="exportBtn" title="导出 PNG">💾 PNG</button>
    </div>

    <div class="room-box">
      <span id="roomTag" class="room-tag">房间：…</span>
      <button id="copyLinkBtn" title="复制邀请链接">🔗 分享</button>
      <span id="connState" class="conn-state">连接中…</span>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <div class="panel">
        <h3>我的身份</h3>
        <input type="text" id="nameInput" maxlength="24" placeholder="输入昵称" />
        <div id="meSwatch" class="swatch"></div>
      </div>
      <div class="panel">
        <h3>在线成员 <span id="userCount">0</span></h3>
        <ul id="userList" class="user-list"></ul>
      </div>
      <div class="panel hint">
        <h3>提示</h3>
        <p>选择工具下可拖动图形、按 Delete 删除。</p>
        <p>快捷键：V 选择 / R 矩形 / O 圆形 / A 箭头 / T 文字；Ctrl+Z 撤销、Ctrl+Y 重做。</p>
      </div>
    </aside>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="board"></canvas>
      <input type="text" id="textEditor" class="text-editor" maxlength="500"
             placeholder="输入文字，回车确认" />
      <div id="cursorLayer" class="cursor-layer"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
