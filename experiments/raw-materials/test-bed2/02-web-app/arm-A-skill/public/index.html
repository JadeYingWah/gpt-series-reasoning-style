<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协作白板</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 16L16 8"/><path d="M12.5 8H16v3.5"/></svg>
      <span>协作白板</span>
    </div>
    <div class="sep"></div>

    <div class="tools">
      <button class="tbtn active" data-tool="select" title="选择 / 移动 (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l7 17 2.4-7.1L21.5 11z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tbtn" data-tool="rect" title="矩形 (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tbtn" data-tool="ellipse" title="圆形 (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="tbtn" data-tool="arrow" title="箭头 (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L18 6"/><path d="M11 6h7v7"/></svg>
      </button>
      <button class="tbtn" data-tool="text" title="文字 (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V5h14v1"/><path d="M12 5v14"/><path d="M9 19h6"/></svg>
      </button>
      <button class="tbtn" data-tool="pencil" title="画笔 (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1L20 7.5 16.5 4 5 15.5 4 20z"/></svg>
      </button>
    </div>
    <div class="sep"></div>

    <div class="swatches" id="swatches"></div>
    <input type="color" id="custom-color" value="#1e293b" title="自定义颜色">
    <div class="sep"></div>

    <label class="ctl">粗细
      <input type="range" id="stroke-width" min="1" max="20" step="1" value="3">
      <span id="stroke-val" class="val">3</span>
    </label>
    <label class="ctl">字号
      <select id="font-size">
        <option value="18">18</option>
        <option value="24">24</option>
        <option value="28" selected>28</option>
        <option value="36">36</option>
        <option value="48">48</option>
      </select>
    </label>
    <div class="sep"></div>

    <button class="tbtn" id="btn-undo" title="撤销 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="tbtn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
    <button class="tbtn danger" id="btn-clear" title="清空画板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
    </button>

    <div class="spacer"></div>

    <div class="online" id="online" title="">
      <span class="dot"></span><span id="online-count">1</span>&nbsp;在线
    </div>
    <button class="btn-share" id="btn-share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.4 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.42-1.4"/></svg>
      分享
    </button>
    <div class="conn" id="conn">
      <span class="conn-dot" id="status-dot"></span><span id="status-text">连接中…</span>
    </div>
  </header>

  <main class="canvas-wrap" id="canvas-wrap">
    <canvas id="board"></canvas>
    <textarea id="text-editor" hidden spellcheck="false" placeholder="输入文字，Enter 确认，Shift+Enter 换行"></textarea>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
