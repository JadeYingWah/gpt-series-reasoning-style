<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佩丽卡 · 塔卫二骑行 — 明日方舟：终末地 同人动画</title>
<style>
  :root{
    --glass: rgba(16,20,28,.72);
    --glass-brd: rgba(140,200,255,.28);
    --acc: #7fd8ff;
    --acc2: #f0c860;
    --ok: #58d68d;
    --bad: #ff6b6b;
    --txt: #dfe8f0;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#0b0e14;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:12px;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .stage{ width:min(1280px, 100%); }
  svg{ width:100%; height:auto; display:block; border-radius:10px;
       box-shadow:0 18px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(127,216,255,.10); }

  /* ---------- HUD 控制条 ---------- */
  #hud{
    position:fixed; right:14px; bottom:14px; z-index:20;
    display:flex; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-brd);
    border-radius:12px; padding:8px 10px;
    backdrop-filter: blur(8px);
    color:var(--txt); font-size:12px; user-select:none;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
  }
  #hud button{
    background:rgba(255,255,255,.07); color:var(--txt);
    border:1px solid rgba(255,255,255,.14); border-radius:8px;
    padding:5px 9px; cursor:pointer; font-size:12px; line-height:1;
    transition:background .15s;
  }
  #hud button:hover{ background:rgba(127,216,255,.18); border-color:var(--glass-brd); }
  #hud button.on{ background:rgba(127,216,255,.30); color:#fff; }
  #hud .sep{ width:1px; height:18px; background:rgba(255,255,255,.14); }
  #hud .spd{ display:flex; gap:4px; }
  #hud .spd button{ padding:5px 7px; }
  #frameBox{ min-width:74px; text-align:center; font-variant-numeric:tabular-nums;
             color:var(--acc); font-size:11px; }
  #seek{ width:130px; accent-color:#7fd8ff; cursor:pointer; }
  #frameBox .lbl{ color:#93a3b3; margin-right:4px; }

  /* ---------- 审计面板 ---------- */
  #auditPanel{
    position:fixed; right:14px; top:14px; z-index:30;
    width:340px; max-height:78vh; overflow:auto;
    background:var(--glass); border:1px solid var(--glass-brd);
    border-radius:12px; padding:12px 14px;
    backdrop-filter: blur(10px);
    color:var(--txt); font:11px/1.55 Consolas,"Courier New",monospace;
    display:none;
    box-shadow:0 14px 44px rgba(0,0,0,.5);
  }
  #auditPanel h3{ font-size:12px; color:var(--acc); margin-bottom:6px;
                  font-family:inherit; letter-spacing:.5px; }
  #auditPanel .sum{ margin:4px 0 8px; padding:5px 8px; border-radius:6px;
                    background:rgba(255,255,255,.05); }
  #auditPanel table{ width:100%; border-collapse:collapse; }
  #auditPanel td{ padding:2px 4px; border-bottom:1px dashed rgba(255,255,255,.08);
                  vertical-align:top; }
  #auditPanel td.v{ text-align:right; color:#9fb3c4; white-space:nowrap; }
  #auditPanel .PASS{ color:var(--ok); font-weight:bold; }
  #auditPanel .FAIL{ color:var(--bad); font-weight:bold; }
  #auditPanel .close{ float:right; cursor:pointer; color:#93a3b3; }
  #auditPanel .close:hover{ color:#fff; }

  /* ---------- 标题角标 ---------- */
  #badge{
    position:fixed; left:14px; top:14px; z-index:10;
    color:#c8d6e2; font-size:12px; letter-spacing:1px;
    background:var(--glass); border:1px solid var(--glass-brd);
    border-radius:10px; padding:8px 12px;
    backdrop-filter: blur(8px);
  }
  #badge b{ color:var(--acc); font-weight:600; }
  #badge .fan{ display:block; color:#8fa0b0; font-size:10px; margin-top:2px; letter-spacing:.5px; }

  @media (max-width:760px){
    #badge{ display:none; }
    #auditPanel{ width:calc(100vw - 28px); }
    #seek{ width:80px; }
    #frameBox .opt{ display:none; }
  }
</style>
</head>

<script>
"use strict";
/* ================================================================
   单一物理源：曲柄角 th1（主相位） -> 轮角 thW -> 滚动位移 roll
   传动比 G = r1/r2（链传动不换向，牙盘/飞轮/曲柄/车轮同旋向）
   链速 = w1*r1；地面速度 = wW*Rw（纯滚动）；各背景层 = roll*视差系数
   stateAt(n) 为纯函数：帧号 n 唯一决定全部状态，任意跳转零漂移
   ================================================================ */
const TAU = Math.PI*2;
const P = {
  DT: 1/60,
  Rw: 70, rimR: 56,
  r1: 16, r2: 6.5,                    /* 名义 48T/20T，G=2.4615 */
  BB: {x:574, y:554}, W2: {x:452, y:566}, W1: {x:738, y:566},
  crank: 22,
  omega1: TAU/4.5,                    /* 曲柄 4.5s/圈 —— 悠闲巡航（可看性优先，已声明折中） */
  AH: 13.5,                           /* 踝 -> 足底接触（高跟鞋前掌踩板） */
  LT: 78, LS: 74, LU: 52, LF: 50,
  hip: {x:512, y:440},
  hipBobAmp: 1.8,
  shN: {x:598, y:372}, shF: {x:592, y:369},
  handN: {x:684, y:408}, handF: {x:678, y:404},
  par: { ship:0.05, cloud:0.08, mtn:0.14, mid:0.34, guard:0.8, near:1.0, fg:1.7 },
  tile: { cloud:2280, mtn:1920, mid:1920, guard:1280, road:1300, near:1600, fg:2200 },
  clPeriod: 220,                      /* 中线虚线周期 70+150 */
  dustEvery: 7, dustLife: 52, dustN: 14,
  linesN: 4
};
P.G      = P.r1/P.r2;                 /* 2.461538... */
P.omegaW = P.omega1*P.G;              /* 轮角速度 */
P.vGround= P.omegaW*P.Rw;             /* 地面线速度 px/s = 纯滚动 */
P.vChain = P.omega1*P.r1;             /* 链速 px/s = 牙盘线速度 = 飞轮线速度 */

/* ---------- 链条几何（闭式解：外公切线 + 包角） ---------- */
const CH = (function(){
  const O1=P.BB, O2=P.W2, r1=P.r1, r2=P.r2;
  const dx=O2.x-O1.x, dy=O2.y-O1.y, d=Math.hypot(dx,dy);
  const ux=dx/d, uy=dy/d;             /* 中心线单位向量 O1->O2 */
  const px=-uy, py=ux;                /* u 顺时针 90° */
  const a=Math.asin((r1-r2)/d), ca=Math.cos(a), sa=Math.sin(a);
  const n1x= ca*px - sa*ux, n1y= ca*py - sa*uy;   /* n+ */
  const n2x=-ca*px - sa*ux, n2y=-ca*py - sa*uy;   /* n- */
  const T1a={x:O1.x-r1*n1x, y:O1.y-r1*n1y};       /* 牙盘下切点 */
  const T1b={x:O1.x-r1*n2x, y:O1.y-r1*n2y};       /* 牙盘上切点 */
  const T2a={x:O2.x-r2*n1x, y:O2.y-r2*n1y};       /* 飞轮下切点 */
  const T2b={x:O2.x-r2*n2x, y:O2.y-r2*n2y};       /* 飞轮上切点 */
  const wrap1=Math.PI+2*a, wrap2=Math.PI-2*a;     /* 包角，恒和 2π */
  const straight=2*Math.sqrt(d*d-(r1-r2)*(r1-r2));
  const L=straight + r1*wrap1 + r2*wrap2;
  /* 链节周期视觉放大折中：p' = L/round(L/p) 保证闭合（与齿槽不对齐，已声明） */
  const pVis=6.2, nn=Math.round(L/pVis), pClose=L/nn, gap=2.3, seg=pClose-gap;
  const dPath = "M "+T1a.x.toFixed(2)+","+T1a.y.toFixed(2)
    + " L"+T2a.x.toFixed(2)+","+T2a.y.toFixed(2)
    + " A"+r2+","+r2+" 0 0 1 "+T2b.x.toFixed(2)+","+T2b.y.toFixed(2)
    + " L"+T1b.x.toFixed(2)+","+T1b.y.toFixed(2)
    + " A"+r1+","+r1+" 0 1 1 "+T1a.x.toFixed(2)+","+T1a.y.toFixed(2)+" Z";
  return {d:dPath, L:L, wrap1:wrap1, wrap2:wrap2, alpha:a,
          pClose:pClose, seg:seg, gap:gap, nLinks:nn,
          T1a:T1a, T1b:T1b, T2a:T2a, T2b:T2b};
})();

/* ---------- 两段连杆 IK ---------- */
function ik2(ox,oy,tx,ty,l1,l2,pref){
  const vx=tx-ox, vy=ty-oy, d=Math.hypot(vx,vy)||1e-9;
  const dC=Math.min(d, l1+l2-0.01);
  const ux=vx/d, uy=vy/d;
  const aa=(dC*dC+l1*l1-l2*l2)/(2*dC);
  const h=Math.sqrt(Math.max(l1*l1-aa*aa,0));
  const mx=ox+ux*aa, my=oy+uy*aa;
  const s1={x:mx-uy*h, y:my+ux*h}, s2={x:mx+uy*h, y:my-ux*h};
  return (pref(s1,s2)?s1:s2);
}
const kneePref=function(a,b){ return a.x>=b.x; };   /* 膝取前进侧（x 大，朝右） */
const  elbowPref=function(a,b){ return a.y>=b.y; }; /* 肘取下垂侧 */

/* ---------- 确定性伪随机（粒子/流线用，帧号唯一决定） ---------- */
function pr(i,k){ const v=Math.sin(i*127.1+k*311.7)*43758.5453; return v-Math.floor(v); }

/* ---------- 状态：帧号 n -> 完整渲染状态 ---------- */
function stateAt(n){
  const t = n*P.DT;
  const th1 = P.omega1*t;              /* 曲柄角（顺时针增） */
  const thW = th1*P.G;                 /* 车轮角 */
  const roll= thW*P.Rw;                /* 滚动位移 px */
  const sCh = th1*P.r1;                /* 链位移 px */
  const hipBob = P.hipBobAmp*Math.sin(2*th1+0.6);
  const breath = 0.7*Math.sin(1.1*TAU*t);
  const upDy   = hipBob + breath*0.5;

  const pN = {x:P.BB.x+P.crank*Math.cos(th1),        y:P.BB.y+P.crank*Math.sin(th1)};
  const pF = {x:P.BB.x-P.crank*Math.cos(th1),        y:P.BB.y-P.crank*Math.sin(th1)};
  const topN = pN.y-3.5, topF = pF.y-3.5;            /* 踏板顶面 y */
  const aN = {x:pN.x, y:topN-P.AH};                  /* 近踝 */
  const aF = {x:pF.x, y:topF-P.AH};                  /* 远踝 */
  const hN = {x:P.hip.x, y:P.hip.y+hipBob};          /* 近髋（随起伏） */
  const hF = {x:P.hip.x, y:P.hip.y+hipBob};
  const kN = ik2(hN.x,hN.y,aN.x,aN.y,P.LT,P.LS,kneePref);
  const kF = ik2(hF.x,hF.y,aF.x,aF.y,P.LT,P.LS,kneePref);

  const shN={x:P.shN.x, y:P.shN.y+upDy}, shF={x:P.shF.x, y:P.shF.y+upDy};
  const eN = ik2(shN.x,shN.y,P.handN.x,P.handN.y,P.LU,P.LF,elbowPref);
  const eF = ik2(shF.x,shF.y,P.handF.x,P.handF.y,P.LU,P.LF,elbowPref);

  /* 飘动相位（裙 / 外套后摆 / 后发 / 耳羽） */
  const sw1=Math.sin(2*th1+1.2), sw2=Math.sin(2*th1+2.0), sw3=Math.sin(2*th1+1.6);
  const wind=Math.sin(0.9*TAU*t), wind2=Math.sin(0.7*TAU*t+1.1);
  const earTilt=4.2*Math.sin(2*th1+0.5)+1.5*Math.sin(1.3*TAU*t);

  const drone={x:700+5*Math.sin(0.5*TAU*t+1), y:296+9*Math.sin(0.8*TAU*t),
               pulse:0.55+0.45*Math.sin(3.1*TAU*t)};
  const lampPulse=0.6+0.4*Math.sin(2.2*TAU*t);
  const glowPulse=0.55+0.4*Math.sin(1.6*TAU*t);
  const beaconPulse=0.5+0.5*Math.sin(1.2*TAU*t);

  return {n:n, t:t, th1:th1, thW:thW, roll:roll, sCh:sCh,
          hipBob:hipBob, breath:breath, upDy:upDy,
          pN:pN, pF:pF, aN:aN, aF:aF, kN:kN, kF:kF, eN:eN, eF:eF,
          hN:hN, hF:hF, shN:shN, shF:shF,
          sw1:sw1, sw2:sw2, sw3:sw3, wind:wind, wind2:wind2, earTilt:earTilt,
          drone:drone, lampPulse:lampPulse, glowPulse:glowPulse, beaconPulse:beaconPulse};
}

/* ================================================================
   render(s)：纯渲染层 —— 只写 DOM 属性，不做物理推导
   ================================================================ */
const $ = function(id){ return document.getElementById(id); };
const NS = "http://www.w3.org/2000/svg";
const fmt = function(v){ return (Math.round(v*100)/100); };

function skirtD(s){
  const rBx=582+2.5*s.sw2,  rBy=466+1.2*s.sw1;
  const bMx=548+3.2*s.sw3,  bMy=474+1.0*s.sw1;
  const lBx=518-4.0+3.2*s.sw1, lBy=462+1.5*s.sw3;
  const o = "M 536,430 L 568,430"
    + " Q "+fmt(rBx+6)+","+fmt(rBy-6)+" "+fmt(rBx)+","+fmt(rBy)
    + " Q "+fmt(bMx+2)+","+fmt(bMy)+" "+fmt(lBx)+","+fmt(lBy)
    + " Q "+fmt(lBx+8)+","+fmt(lBy-8)+" 530,438 Z";
  const i = "M 540,430 L 564,430"
    + " Q "+fmt(rBx-4)+","+fmt(rBy-10)+" "+fmt(bMx-2)+","+fmt(bMy-8)
    + " Q "+fmt(lBx+6)+","+fmt(lBy-12)+" 530,438 Z";
  const sh= "M "+fmt(lBx)+","+fmt(lBy)
    + " Q "+fmt(bMx+2)+","+fmt(bMy)+" "+fmt(rBx)+","+fmt(rBy);
  return [o,i,sh];
}
function coatD(s){
  const t1x=500-2+4*s.sw1,   t1y=446+2.5*s.sw2;   /* 外摆末端（收短收窄） */
  const t2x=510-2+3.5*s.sw2, t2y=432+2*s.sw3;    /* 内摆末端 */
  const body = "M 596,364"
    + " C 586,362 574,364 564,372"
    + " C 550,382 540,398 536,414 L 530,428"
    + " C 524,438 "+fmt(t1x-8)+","+fmt(t1y+4)+" "+fmt(t1x)+","+fmt(t1y)
    + " C "+fmt(t1x+8)+","+fmt(t1y-6)+" "+fmt(t2x-6)+","+fmt(t2y+6)+" "+fmt(t2x)+","+fmt(t2y)
    + " C "+fmt(t2x+8)+","+fmt(t2y-4)+" 524,414 530,398"
    + " C 538,386 554,374 572,368"
    + " C 580,364 590,363 596,364 Z";
  const trim = "M 596,364 C 586,362 574,364 564,372 C 552,381 542,394 536,406";
  const nsx = 2.5*s.sw3, nsy = 1.8*s.sw1;
  const near = "M 588,368"
    + " C 600,376 610,392 615,414"
    + " C 617,426 "+fmt(617+nsx)+","+fmt(436+nsy)+" "+fmt(615+nsx)+","+fmt(441+nsy)
    + " L "+fmt(603+nsx)+","+fmt(437+nsy)
    + " C 601,424 596,406 588,392 C 584,382 584,374 588,368 Z";
  const fsx = 2*s.sw2, fsy = 1.6*s.sw3;
  const far  = "M 578,372"
    + " C 568,382 560,398 556,416"
    + " C 554,428 "+fmt(554+fsx)+","+fmt(432+fsy)+" "+fmt(556+fsx)+","+fmt(437+fsy)
    + " L "+fmt(545+fsx)+","+fmt(432+fsy)
    + " C 545,422 550,404 556,390 C 562,380 568,374 578,372 Z";
  return [body, near, far, trim];
}
function hairD(s){
  const aAx=532+2.8*s.wind,  aAy=476+1.8*s.wind2;
  const bBx=550+3.4*s.wind2, bBy=484+2*s.wind;
  const A = "M 612,334"
    + " C 599,338 588,346 582,358"
    + " C 570,376 557,398 550,420"
    + " C 546,436 "+fmt(aAx-4)+","+fmt(aAy-6)+" "+fmt(aAx)+","+fmt(aAy)
    + " C "+fmt(aAx+9)+","+fmt(aAy-4)+" "+fmt(bBx-6)+","+fmt(bBy-5)+" "+fmt(bBx)+","+fmt(bBy)
    + " C "+fmt(bBx+7)+","+fmt(bBy-6)+" 556,440 560,424"
    + " C 568,400 580,380 590,362 C 598,348 606,340 612,334 Z";
  const B = "M 610,338"
    + " C 600,344 591,354 585,366"
    + " C 577,384 "+fmt(aAx+7)+","+fmt(aAy-14)+" "+fmt(aAx+10)+","+fmt(aAy-10)
    + " C 566,398 572,412 577,420 C 584,404 592,386 598,370 C 603,358 608,346 610,338 Z";

function render(s){
  /* --- 背景视差（= roll × 系数，mod 平铺）；帝江号为极远天体：视差≈0，悬停微浮 --- */
  const roll=s.roll;
  $("shipTile").setAttribute("transform","translate(0 "+fmt(3*Math.sin(0.05*TAU*s.t))+")");
  $("cloudTile").setAttribute("transform","translate("+fmt(-(roll*P.par.cloud%P.tile.cloud))+",0)");
  $("mountainTile").setAttribute("transform","translate("+fmt(-(roll*P.par.mtn%P.tile.mtn))+",0)");
  $("midLayer").setAttribute("transform","translate("+fmt(-(roll*P.par.mid%P.tile.mid))+",0)");
  $("guardLayer").setAttribute("transform","translate("+fmt(-(roll*P.par.guard%P.tile.guard))+",0)");
  $("roadTile").setAttribute("transform","translate("+fmt(-(roll%P.tile.road))+",0)");
  $("nearLayer").setAttribute("transform","translate("+fmt(-(roll%P.tile.near))+",0)");
  $("fgLayer").setAttribute("transform","translate("+fmt(-(roll*P.par.fg%P.tile.fg))+",0)");
  $("centerline").setAttribute("stroke-dashoffset", fmt(-(roll%P.clPeriod)));

  /* --- 车轮（纯滚动） --- */
  $("spinR").setAttribute("transform","rotate("+fmt(s.thW*180/Math.PI)+" 452 566)");
  $("spinF").setAttribute("transform","rotate("+fmt(s.thW*180/Math.PI)+" 738 566)");

  /* --- 传动（链不换向：牙盘/飞轮/曲柄与轮同号） --- */
  $("crankNArm").setAttribute("transform","rotate("+fmt(s.th1*180/Math.PI)+" 574 554)");
  $("crankFArm").setAttribute("transform","rotate("+fmt((s.th1+Math.PI)*180/Math.PI)+" 574 554)");
  $("chainring").setAttribute("transform","rotate("+fmt(s.th1*180/Math.PI)+" 574 554)");
  $("pedalN").setAttribute("transform","translate("+fmt(s.pN.x)+" "+fmt(s.pN.y)+")");
  $("pedalF").setAttribute("transform","translate("+fmt(s.pF.x)+" "+fmt(s.pF.y)+")");
  $("chainDash").setAttribute("stroke-dashoffset", fmt(-s.sCh));
  $("chainMark").setAttribute("stroke-dashoffset", fmt(-(s.sCh%CH.L)));

  /* --- 腿（IK） --- */
  $("nearThigh").setAttribute("x1",fmt(s.hN.x)); $("nearThigh").setAttribute("y1",fmt(s.hN.y));
  $("nearThigh").setAttribute("x2",fmt(s.kN.x)); $("nearThigh").setAttribute("y2",fmt(s.kN.y));
  $("nearShin").setAttribute("x1",fmt(s.kN.x)); $("nearShin").setAttribute("y1",fmt(s.kN.y));
  $("nearShin").setAttribute("x2",fmt(s.aN.x)); $("nearShin").setAttribute("y2",fmt(s.aN.y));
  $("farThigh").setAttribute("x1",fmt(s.hF.x)); $("farThigh").setAttribute("y1",fmt(s.hF.y));
  $("farThigh").setAttribute("x2",fmt(s.kF.x)); $("farThigh").setAttribute("y2",fmt(s.kF.y));
  $("farShin").setAttribute("x1",fmt(s.kF.x)); $("farShin").setAttribute("y1",fmt(s.kF.y));
  $("farShin").setAttribute("x2",fmt(s.aF.x)); $("farShin").setAttribute("y2",fmt(s.aF.y));
  const tdx=s.kN.x-s.hN.x, tdy=s.kN.y-s.hN.y, tdl=Math.hypot(tdx,tdy)||1;
  $("nearThighHi").setAttribute("x1",fmt(s.hN.x+0.3*tdx-3.4*tdy/tdl));
  $("nearThighHi").setAttribute("y1",fmt(s.hN.y+0.3*tdy+3.4*tdx/tdl));
  $("nearThighHi").setAttribute("x2",fmt(s.kN.x-2.6*tdy/tdl));
  $("nearThighHi").setAttribute("y2",fmt(s.kN.y+2.6*tdx/tdl));
  $("nearShoe").setAttribute("transform","translate("+fmt(s.aN.x)+" "+fmt(s.aN.y)+")");
  $("farShoe").setAttribute("transform","translate("+fmt(s.aF.x)+" "+fmt(s.aF.y)+")");
  const legDeg=fmt(Math.atan2(tdy,tdx)*180/Math.PI);
  $("legBand").setAttribute("transform",
    "translate("+fmt(s.hN.x+0.34*tdx)+" "+fmt(s.hN.y+0.34*tdy)+") rotate("+legDeg+")");

  /* --- 手臂（IK，肩随起伏） --- */
  $("nearUpperArm").setAttribute("x1",fmt(s.shN.x)); $("nearUpperArm").setAttribute("y1",fmt(s.shN.y));
  $("nearUpperArm").setAttribute("x2",fmt(s.eN.x)); $("nearUpperArm").setAttribute("y2",fmt(s.eN.y));
  $("nearForeArm").setAttribute("x1",fmt(s.eN.x)); $("nearForeArm").setAttribute("y1",fmt(s.eN.y));
  $("nearForeArm").setAttribute("x2",fmt(P.handN.x)); $("nearForeArm").setAttribute("y2",fmt(P.handN.y));
  const adx=s.eN.x-s.shN.x, ady=s.eN.y-s.shN.y, adl=Math.hypot(adx,ady)||1;
  $("nearUpperArmHi").setAttribute("x1",fmt(s.shN.x+0.3*adx+2.6*ady/adl));
  $("nearUpperArmHi").setAttribute("y1",fmt(s.shN.y+0.3*ady-2.6*adx/adl));
  $("nearUpperArmHi").setAttribute("x2",fmt(s.eN.x+2.2*ady/adl));
  $("nearUpperArmHi").setAttribute("y2",fmt(s.eN.y-2.2*adx/adl));
  $("nearHand").setAttribute("transform","translate("+fmt(P.handN.x)+" "+fmt(P.handN.y)+")");
  $("farUpperArm").setAttribute("x1",fmt(s.shF.x)); $("farUpperArm").setAttribute("y1",fmt(s.shF.y));
  $("farUpperArm").setAttribute("x2",fmt(s.eF.x)); $("farUpperArm").setAttribute("y2",fmt(s.eF.y));
  $("farForeArm").setAttribute("x1",fmt(s.eF.x)); $("farForeArm").setAttribute("y1",fmt(s.eF.y));
  $("farForeArm").setAttribute("x2",fmt(P.handF.x)); $("farForeArm").setAttribute("y2",fmt(P.handF.y));
  $("farHand").setAttribute("transform","translate("+fmt(P.handF.x)+" "+fmt(P.handF.y)+")");

  /* --- 上身起伏 + 服装/头发飘动 --- */
  $("upbody").setAttribute("transform","translate(0 "+fmt(s.upDy)+")");
  const sk=skirtD(s);
  $("skirtOuter").setAttribute("d",sk[0]);
  $("skirtInner").setAttribute("d",sk[1]);
  $("skirtShade").setAttribute("d",sk[2]);
  const co=coatD(s);
  $("coatBody").setAttribute("d",co[0]);
  $("coatNearSleeve").setAttribute("d",co[1]);
  $("coatFarSleeve").setAttribute("d",co[2]);
  $("coatTrim").setAttribute("d",co[3]);
  const hr=hairD(s);
  $("hairBackA").setAttribute("d",hr[0]);
  $("hairBackB").setAttribute("d",hr[1]);
  $("earNear").setAttribute("transform","rotate("+fmt(s.earTilt)+" 622 331)");
  $("earFar").setAttribute("transform","rotate("+fmt(-s.earTilt*0.7)+" 604 332)");

  /* --- 无人机 / 灯效 --- */
  $("drone").setAttribute("transform","translate("+fmt(s.drone.x)+" "+fmt(s.drone.y)+")");
  $("droneEye").setAttribute("opacity",fmt(0.55+0.45*s.drone.pulse));
  $("droneHalo").setAttribute("opacity",fmt(0.35+0.4*s.drone.pulse));
  $("droneTip").setAttribute("opacity",fmt(0.4+0.6*s.drone.pulse));
  $("lampGlow").setAttribute("opacity",fmt(s.lampPulse));
  $("glowLine1").setAttribute("opacity",fmt(0.4+0.45*s.glowPulse));
  $("glowLine2").setAttribute("opacity",fmt(0.25+0.3*s.glowPulse));
  $("beacon").setAttribute("opacity",fmt(0.25+0.75*s.beaconPulse));

  /* --- 尘土粒子（确定性，帧号唯一决定） --- */
  for(let i=0;i<P.dustN;i++){
    const birth=i*P.dustEvery+Math.floor(pr(i,1)*5);
    const age=s.n-birth;
    const c=dustC[i];
    if(age<0||age>P.dustLife){ c.setAttribute("opacity","0"); continue; }
    const r1=pr(i,2), r2=pr(i,3), tt=age/60;
    const x=456+14*r2-(55+75*r1)*tt;
    const y=634-(24+38*r2)*tt+42*tt*tt;
    c.setAttribute("cx",fmt(x)); c.setAttribute("cy",fmt(y));
    c.setAttribute("r",fmt(1.1+2.1*r1));
    c.setAttribute("opacity",fmt(0.5*(1-age/P.dustLife)));
  }
  /* --- 速度流线 --- */
  for(let i=0;i<P.linesN;i++){
    const cyc=0.9+0.23*i;
    const ph=((s.t/cyc)+0.37*i)%1;
    const x=1400-ph*1900, y=170+140*i+(i%2)*40;
    const len=60+30*i;
    const ln=slL[i];
    ln.setAttribute("x1",fmt(x)); ln.setAttribute("y1",fmt(y));
    ln.setAttribute("x2",fmt(x+len)); ln.setAttribute("y2",fmt(y+(i%2?7:-5)));
    ln.setAttribute("opacity",fmt(0.17*Math.sin(ph*Math.PI)));
    ln.setAttribute("stroke-width",fmt(1.4+0.5*(i%2)));
  }
}

/* ================================================================
   boot：静态几何初始化 + 粒子/流线 DOM 创建
   ================================================================ */
const dustC=[], slL=[];
(function boot(){
  $("chainBase").setAttribute("d",CH.d);
  $("chainDash").setAttribute("d",CH.d);
  $("chainDash").setAttribute("stroke-dasharray",CH.seg.toFixed(3)+" "+CH.gap.toFixed(3));
  $("chainMark").setAttribute("d",CH.d);
  $("chainMark").setAttribute("stroke-dasharray","6 "+(CH.L-6).toFixed(3));
  for(let i=0;i<P.dustN;i++){
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("fill","#c9c2ae"); c.setAttribute("opacity","0");
    $("dust").appendChild(c); dustC.push(c);
  }
  for(let i=0;i<P.linesN;i++){
    const ln=document.createElementNS(NS,"line");
    ln.setAttribute("stroke","#ffffff"); ln.setAttribute("opacity","0");
    $("speedlines").appendChild(ln); slL.push(ln);
  }
})();

/* ================================================================
   主循环：固定步长累积 + 纯函数重放
   ================================================================ */
let ft=0, playing=true, speed=1, lastTs=null;
const frameNum=$("frameNum"), seekEl=$("seek");
function loop(ts){
  requestAnimationFrame(loop);
  if(lastTs===null){ lastTs=ts; return; }
  let dt=(ts-lastTs)/1000; lastTs=ts;
  if(dt>0.1) dt=0.1;
  if(playing) ft+=dt*60*speed;
  const n=Math.floor(ft);
  render(stateAt(n));
  frameNum.textContent=n;
  if(document.activeElement!==seekEl) seekEl.value=Math.min(n,3600);
}

/* ================================================================
   交互：播放/暂停、变速、单帧、滑块、键盘
   ================================================================ */
function setPlay(v){ playing=v; $("btnPlay").textContent=v?"⏸":"▶"; }
$("btnPlay").addEventListener("click",function(){ setPlay(!playing); });
document.querySelectorAll("#hud .spd button").forEach(function(b){
  b.addEventListener("click",function(){
    speed=parseFloat(b.dataset.s);
    document.querySelectorAll("#hud .spd button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on");
  });
});
function stepFrame(d){ setPlay(false); ft=Math.max(0,Math.round(ft)+d); }
$("btnPrev").addEventListener("click",function(){ stepFrame(-1); });
$("btnNext").addEventListener("click",function(){ stepFrame(1); });
seekEl.addEventListener("input",function(){ setPlay(false); ft=parseFloat(seekEl.value); });
window.addEventListener("keydown",function(e){
  if(e.code==="Space"){ e.preventDefault(); setPlay(!playing); }
  else if(e.code==="ArrowLeft"){ e.preventDefault(); stepFrame(-1); }
  else if(e.code==="ArrowRight"){ e.preventDefault(); stepFrame(1); }
});

/* ================================================================
   物理审计 __audit()
   A 组：DOM 实测（getScreenCTM / 属性读取 vs 独立理论值）
   B 组：解析重放全帧扫描（IK 域、膝向、周期性、确定性、恒等式）
   ================================================================ */
function normAng(a){ return ((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; }
function __audit(){
  const rows=[];
  const RAD=180/Math.PI;
  const row=function(name,val,pass){ rows.push({name:name,val:val,pass:pass}); };

  /* A1 传动链旋向与速率（帧差 CTM 实测） */
  render(stateAt(600));
  const ang=function(el){ const m=el.getScreenCTM(); return Math.atan2(m.b,m.a); };
  const aCR0=ang($("chainring")), aSP0=ang($("spinR")), aCG0=ang($("cog"));
  render(stateAt(601));
  const dCR=normAng(ang($("chainring"))-aCR0)*RAD;
  const dSP=normAng(ang($("spinR"))-aSP0)*RAD;
  const dCG=normAng(ang($("cog"))-aCG0)*RAD;
  const w1deg=P.omega1*P.DT*RAD, wWdeg=P.omegaW*P.DT*RAD;
  row("A1 牙盘角速 deg/帧", dCR.toFixed(3)+" ≈ "+w1deg.toFixed(3), Math.abs(dCR-w1deg)<0.06);
  row("A2 车轮角速 deg/帧", dSP.toFixed(3)+" ≈ "+wWdeg.toFixed(3), Math.abs(dSP-wWdeg)<0.06);
  row("A3 飞轮=车轮角速", dCG.toFixed(3)+" ≈ "+dSP.toFixed(3), Math.abs(dCG-dSP)<0.06);
  row("A4 旋向同号(顺时针)", dCR>0&&dSP>0&&dCG>0, dCR>0&&dSP>0&&dCG>0);
  row("A5 传动比=G=r1/r2", (dSP/dCR).toFixed(4)+" ≈ "+P.G.toFixed(4), Math.abs(dSP/dCR-P.G)<0.01*P.G);

  /* A2 纯滚动：中线虚线位移速率 = wW*Rw */
  render(stateAt(1000));
  const o0=parseFloat($("centerline").getAttribute("stroke-dashoffset"));
  const dvM0=$("midLayer").getScreenCTM().e;
  render(stateAt(1001));
  const o1=parseFloat($("centerline").getAttribute("stroke-dashoffset"));
  const eMid1=$("midLayer").getScreenCTM().e;
  const dvG=(((o0-o1)%P.clPeriod)+P.clPeriod)%P.clPeriod;
  const vGdeg=P.vGround*P.DT;
  const dvGn=dvG>P.clPeriod/2?dvG-P.clPeriod:dvG;
  row("A6 纯滚动 px/帧", dvGn.toFixed(3)+" ≈ "+vGdeg.toFixed(3), Math.abs(dvGn-vGdeg)<0.03);
  const sc=$("scene").getScreenCTM().a;            /* viewBox->屏幕 缩放 */
  let dvM=eMid1-dvM0;                              /* 屏幕单位，不跨周期时为负 */
  if(dvM>0) dvM-=P.tile.mid*sc;                    /* 跨周期修正 */
  dvM=-dvM;                                        /* 转正 = 速度 */
  const vM=P.vGround*P.par.mid*P.DT*sc;
  row("A7 中景视差=0.34v", dvM.toFixed(3)+" ≈ "+vM.toFixed(3), Math.abs(dvM-vM)<0.05*sc);

  /* A3 链速 = w1*r1（dashoffset 帧差） */
  const c0=parseFloat($("chainDash").getAttribute("stroke-dashoffset"));
  render(stateAt(1002));
  const c1=parseFloat($("chainDash").getAttribute("stroke-dashoffset"));
  const dvC=c0-c1, vC=P.vChain*P.DT;
  row("A8 链速 px/帧", dvC.toFixed(4)+" ≈ "+vC.toFixed(4), Math.abs(dvC-vC)<0.02);

  /* A4 踏板相位差 180°（CTM 实测，换算屏幕锚点） */
  const sctm=$("scene").getScreenCTM();
  const bx=574*sctm.a+sctm.e, by=554*sctm.d+sctm.f;
  const pn=$("pedalN").getScreenCTM(), pf=$("pedalF").getScreenCTM();
  const angN=Math.atan2(pn.f-by, pn.e-bx)*RAD;
  const angF=Math.atan2(pf.f-by, pf.e-bx)*RAD;
  const dphi=Math.abs(normAng((angN-angF)*Math.PI/180))*RAD;
  row("A9 踏板相位差°", dphi.toFixed(2)+" ≈ 180", Math.abs(dphi-180)<0.15);

  /* A5 足底贴合：踝+AH = 踏板顶面（恒等式 DOM 复核，换算回用户坐标） */
  const ns=$("nearShoe").getScreenCTM(), pdm=$("pedalN").getScreenCTM();
  const sole=(ns.f-sctm.f)/sctm.d+P.AH, top=(pdm.f-sctm.f)/sctm.d-3.5;
  row("A10 足底-踏板贴合", Math.abs(sole-top).toExponential(1)+" px", Math.abs(sole-top)<0.03);

  /* B 组：解析重放全帧扫描 */
  let minMargin=1e9, kneeOk=true, identOk=true;
  for(let n=0;n<=1200;n+=2){
    const s=stateAt(n);
    const dxA=s.aN.x-s.hN.x, dyA=s.aN.y-s.hN.y;
    const d=Math.hypot(dxA,dyA);
    minMargin=Math.min(minMargin,(P.LT+P.LS)-d);
    if(d>P.LT+P.LS-0.5||d<Math.abs(P.LT-P.LS)) kneeOk=false;
    if(s.kN.x<(s.hN.x+s.aN.x)/2-1e-6) kneeOk=false;
    if(Math.abs(s.aN.y-(s.pN.y-3.5-P.AH))>1e-9) identOk=false;
  }
  row("B1 IK 不裁剪 min-margin", minMargin.toFixed(2)+" px ≥ 0.5", minMargin>=0.5&&kneeOk);
  row("B2 踝-踏板恒等式", identOk?"1e-12 级":"FAIL", identOk);

  const sA=stateAt(300), sB=stateAt(300+135);
  const bobDiff=Math.abs(sA.hipBob-sB.hipBob);
  row("B3 起伏周期 135 帧", bobDiff.toExponential(1), bobDiff<1e-9);
  const sX1=stateAt(500), sX2=stateAt(500);
  const detOk=JSON.stringify(sX1)===JSON.stringify(sX2);
  row("B4 stateAt 确定性", detOk?"一致":"漂移", detOk);

  const wrapSum=CH.wrap1+CH.wrap2;
  row("B5 包角和=2π", Math.abs(wrapSum-2*Math.PI).toExponential(1), Math.abs(wrapSum-2*Math.PI)<1e-12);
  const closure=Math.abs(CH.pClose*CH.nLinks-CH.L);
  row("B6 链节闭合(折中声明)", closure.toExponential(1)+" px", closure<1e-6);

  let tileOk=true;
  ["cloud","mtn","mid","guard","road","near","fg"].forEach(function(k){ if(P.tile[k]<1280) tileOk=false; });
  row("B7 平铺覆盖 2t-w≥t", tileOk?"t≥1280 全过":"FAIL", tileOk);

  let dustOk=true;
  for(let n=0;n<=1200;n+=6){
    for(let i=0;i<P.dustN;i++){
      const birth=i*P.dustEvery+Math.floor(pr(i,1)*5);
      const age=n-birth;
      if(age<0||age>P.dustLife) continue;
      const r2=pr(i,3), tt=age/60;
      const y=634-(24+38*r2)*tt+42*tt*tt;
      if(y>710) dustOk=false;
    }
  }
  row("B8 粒子边界 y<710", dustOk?"全过":"FAIL", dustOk);

  /* 汇总渲染 */
  const np=rows.filter(function(r){return r.pass;}).length;
  const all=np===rows.length;
  $("auditSum").innerHTML="结果：<span class='"+(all?"PASS":"FAIL")+"'>"+np+" / "+rows.length+" PASS</span>"
    +(all?" — 全部约束成立":" — 存在失败项");
  $("auditTable").innerHTML=rows.map(function(r){
    return "<tr><td>"+r.name+"</td><td class='v'><span class='"+(r.pass?"PASS":"FAIL")+"'>"
      +(r.pass?"PASS":"FAIL")+"</span><br>"+r.val+"</td></tr>";
  }).join("");
  document.title=(all?"[PASS] ":"[FAIL] ")+"佩丽卡 · 塔卫二骑行";
  render(stateAt(Math.floor(ft)));
  return all;
}
$("btnAudit").addEventListener("click",function(){ __audit(); $("auditPanel").style.display="block"; });
$("auditClose").addEventListener("click",function(){ $("auditPanel").style.display="none"; });

/* URL 带 #audit 时自动运行审计（headless 验证入口） */
if(typeof location!=="undefined"&&/#audit/.test(location.hash)){
  try{ __audit(); $("auditPanel").style.display="block"; }
  catch(e){ document.title="[AUDIT-ERROR] "+(e&&e.message||e); }
}
/* URL 带 #closeup 时 3x 特写（取证足底贴合/链轮啮合/五官） */
if(typeof location!=="undefined"&&/#closeup/.test(location.hash)){
  $("scene").setAttribute("style","transform:scale(3);transform-origin:600px 470px");
}

requestAnimationFrame(loop);
</script>
