/* 两段连杆解析 IK：返回关节点（sign 决定弯曲方向） */
function ik(hx, hy, fx, fy, l1, l2, sign){
  let dx = fx-hx, dy = fy-hy, d = Math.hypot(dx,dy);
  d = Math.min(d, l1+l2-0.6); d = Math.max(d, Math.abs(l1-l2)+0.6);
  const ux = dx/d, uy = dy/d;
  const a  = (l1*l1 - l2*l2 + d*d) / (2*d);
  const h  = Math.sqrt(Math.max(0, l1*l1 - a*a));
  return { x: hx + ux*a + uy*h*sign, y: hy + uy*a - ux*h*sign };
}

/* 循环层：内容生成器 + 双份拼接实现无缝滚动 */
function makeLoop(gid, period, builder){
  const g = $(gid);
  let html = "";
  for(let rep=0; rep<2; rep++){
    html += `<g transform="translate(${rep*period},0)">` + builder(period) + `</g>`;
  }
  g.innerHTML = html;
  return g;
}

/* ============ 车轮构建 ============ */
function buildWheel(gid, cx, cy){
  let spokes = "";
  for(let i=0;i<16;i++){
    const a = i*22.5*Math.PI/180;
    const x2 = cx + Math.sin(a)*(WHEEL_R-7), y2 = cy - Math.cos(a)*(WHEEL_R-7);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#9a9aa4" stroke-width="${i===0?2.6:1.8}" opacity="${i===0?0.95:0.78}"/>`;
  }
  $(gid).innerHTML = `
    <circle cx="${cx}" cy="${cy}" r="${WHEEL_R}" fill="none" stroke="#1f1f27" stroke-width="9.5"/>
    <circle cx="${cx}" cy="${cy}" r="${WHEEL_R-1}" fill="none" stroke="#383842" stroke-width="1.4" opacity="0.7"/>
    <circle cx="${cx}" cy="${cy}" r="41" fill="none" stroke="#8a8a94" stroke-width="30" opacity="0.19"/>
    <circle cx="${cx}" cy="${cy}" r="${WHEEL_R-11}" fill="none" stroke="#e8e4dc" stroke-width="4.5"/>
    <g data-spin="1">${spokes}</g>
    <circle cx="${cx}" cy="${cy}" r="9" fill="#f5852e"/><circle cx="${cx}" cy="${cy}" r="3.4" fill="#2b2c33"/>`;
}

const el = {

  hairBack:$("hairBack"), coatBack:$("coatBack"), coatBackIn:$("coatBackIn"), skirtBack:$("skirtBack"),
  earF:$("earF"), earB:$("earB"),
  uarmN:$("uarmN"), farmN:$("farmN"), gloveN:$("gloveN"),
  uarmF:$("uarmF"), farmF:$("farmF"), gloveF:$("gloveF"),
  shadow:$("shadow"), center:$("centerline"),
  eyeOpen:$("eyeOpen"), eyeClosed:$("eyeClosed"),
  speedTxt:$("speedTxt"), speedArc:$("speedArc"),
  tailLight:$("tailLight"),
  elevLamp:$("elevLamp"), elevGlow:$("elevGlow")
};

let last = performance.now(), t = 0, wheelA = 0, crankA = 0, dist = 0;
let nextBlink = 2.4, blinkT = -1;
const chainPhase = {top:0, bot:0};

function setLine(l, x1,y1,x2,y2){
  l.setAttribute("x1",x1.toFixed(1)); l.setAttribute("y1",y1.toFixed(1));
  l.setAttribute("x2",x2.toFixed(1)); l.setAttribute("y2",y2.toFixed(1));
}

function frame(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.05) dt = 0.05;
  t += dt;

  /* --- 传动 --- */
  const wW = SPEED / WHEEL_R;
  const wC = wW * RATIO;
  wheelA += wW * dt;
  crankA += wC * dt;
  dist   += SPEED * dt;

  /* --- 车轮 / 牙盘 / 链条 --- */
  el.spinR.setAttribute("transform", `rotate(${(wheelA*57.2958%360).toFixed(2)} ${RW.x} ${RW.y})`);
  el.spinF.setAttribute("transform", `rotate(${(wheelA*57.2958%360).toFixed(2)} ${FW.x} ${FW.y})`);
  el.chainring.setAttribute("transform", `rotate(${(crankA*57.2958%360).toFixed(2)} ${BB.x} ${BB.y})`);
  const chainV = wC * 30 * dt;
  chainPhase.top -= chainV; chainPhase.bot += chainV;
  el.chainTop.setAttribute("stroke-dashoffset", chainPhase.top.toFixed(1));
  el.chainBot.setAttribute("stroke-dashoffset", chainPhase.bot.toFixed(1));

  /* --- 踏板与腿（IK） --- */
  const bob = Math.sin(crankA*2)*2.3 + Math.sin(t*1.1)*0.4;   // 踩踏起伏 + 呼吸
  const hipY = HIP.y + bob;
  const cranks = [
    {a: crankA,          leg:"N"},
    {a: crankA + Math.PI, leg:"F"}
  ];
  cranks.forEach(c=>{
    const fx = BB.x + Math.cos(c.a)*CRANK;
    const fy = BB.y + Math.sin(c.a)*CRANK;
    const ankleX = fx + 2, ankleY = fy - 13;
    const k = ik(HIP.x, hipY, ankleX, ankleY, LEG1, LEG2, +1);
    if(c.leg === "N"){
      setLine(el.thighN, HIP.x, hipY, k.x, k.y);
      setLine(el.shinN, k.x, k.y, ankleX, ankleY);
      // 腿环：大腿 62% 处
      const gx = HIP.x + (k.x-HIP.x)*0.62, gy = hipY + (k.y-hipY)*0.62;
      const nx = -(k.y-hipY), ny = (k.x-HIP.x);
      const nl = Math.hypot(nx,ny)||1;
      setLine(el.garterN, gx-nx/nl*9, gy-ny/nl*9, gx+nx/nl*9, gy+ny/nl*9);
      el.shoeN.setAttribute("transform", `translate(${ankleX.toFixed(1)},${ankleY.toFixed(1)}) rotate(${(Math.sin(c.a)*4).toFixed(1)})`);
      el.pedalN.setAttribute("x", (fx-19).toFixed(1));
      el.pedalN.setAttribute("y", (fy-3).toFixed(1));
      el.crankN.setAttribute("x2", fx.toFixed(1)); el.crankN.setAttribute("y2", fy.toFixed(1));
    } else {
      setLine(el.thighF, HIP.x, hipY, k.x, k.y);
      setLine(el.shinF, k.x, k.y, ankleX, ankleY);
      el.shoeF.setAttribute("transform", `translate(${ankleX.toFixed(1)},${ankleY.toFixed(1)}) rotate(${(Math.sin(c.a)*4).toFixed(1)})`);
      el.pedalF.setAttribute("x", (fx-18).toFixed(1));
      el.pedalF.setAttribute("y", (fy-2.5).toFixed(1));
      el.crankF.setAttribute("x2", fx.toFixed(1)); el.crankF.setAttribute("y2", fy.toFixed(1));
    }
  });

  /* --- 身体 / 头 / 羽耳 --- */
  el.rider.setAttribute("transform", `translate(0,${bob.toFixed(2)})`);
  el.head.setAttribute("transform", `rotate(${(Math.sin(crankA*2-0.7)*1.6).toFixed(2)} 778 410)`);
  el.earF.setAttribute("transform", `rotate(${(Math.sin(t*3.1)*5).toFixed(1)} 801 346)`);
  el.earB.setAttribute("transform", `rotate(${(Math.sin(t*3.1+1.2)*5).toFixed(1)} 769 352)`);

  /* --- 手臂（IK，肘朝后下） --- */
  const shX = SHO.x + 1, shY = SHO.y + bob;
  const kN = ik(shX, shY, GRIP.x+3, GRIP.y+1, ARM1, ARM2, -1);
  setLine(el.uarmN, shX, shY, kN.x, kN.y);
  setLine(el.farmN, kN.x, kN.y, GRIP.x+3, GRIP.y+1);
  el.gloveN.setAttribute("transform", `translate(${GRIP.x+3},${GRIP.y+1})`);
  const shFX = SHO.x - 5, shFY = SHO.y + 3 + bob;
  const kF = ik(shFX, shFY, GRIP.x-4, GRIP.y+2, ARM1, ARM2, -1);
  setLine(el.uarmF, shFX, shFY, kF.x, kF.y);
  setLine(el.farmF, kF.x, kF.y, GRIP.x-4, GRIP.y+2);
  el.gloveF.setAttribute("cx", GRIP.x-4); el.gloveF.setAttribute("cy", GRIP.y+2);

  /* --- 后发（骨架点 + 渐进摆动，白→黑渐变） --- */
  const s1 = Math.sin(t*2.6), s2 = Math.sin(t*2.6-1.1), s3 = Math.sin(t*1.9+0.8);
  const sA = s1*3, sB = s1*6.5 + s3*4, sC = s2*12 + s3*6, sD = s2*18 + s1*5;
  el.hairBack.setAttribute("d",
    `M 789 344
     C 783 370, 773 ${398+sA}, ${758+sA} ${432+sA}
     C ${741+sB} ${468+sB}, ${716+sC} ${510+sC}, ${696+sD} ${552+sD}
     C ${690+sD} ${566+sC}, ${699+sC} ${575+sB}, ${714+sC} ${570+sB}
     C ${728+sB} ${563+sB}, ${736+sB} ${542+sB}, ${744+sB} ${512+sB}
     C ${751+sA} ${482+sA}, ${756+sA} ${448+sA}, ${762+sA} ${416+sA}
     C 768 390, 775 362, 781 346 Z`);

  /* --- 外套后摆（半脱披肩背面） --- */
  const c1 = Math.sin(t*3.0+0.5), c2 = Math.sin(t*3.0+1.3);
  const f1 = c1*4, f2 = c1*8 + c2*3, f3 = c2*11;
  el.coatBack.setAttribute("d",
    `M 766 410
     C 756 428, ${742+f2} ${458+f1}, ${726+f3} ${492+f2}
     L ${718+f3} ${504+f3}
     C ${730+f2} ${508+f2}, ${748+f1} ${490+f1}, ${760+f1} ${462+f1}
     C 768 440, 772 424, 772 414 Z`);
  el.coatBackIn.setAttribute("d",
    `M ${760+f1} ${462+f1}
     C ${750+f2} ${478+f2}, ${738+f3} ${490+f3}, ${726+f3} ${498+f3}
     L ${724+f3} ${505+f3}
     C ${740+f2} ${498+f2}, ${752+f1} ${484+f1}, ${764} ${456+f1} Z`);

  /* --- 连衣裙后摆（飘动） --- */
  const k1 = Math.sin(t*3.4+1.9), k2 = Math.sin(t*3.4+2.7);
  const g1 = k1*4, g2 = k1*8 + k2*3;
  el.skirtBack.setAttribute("d",
    `M 742 528
     C 726 ${548+g1}, ${706+g2} ${566+g2}, ${692+g2} ${584+g2}
     C ${688+g2} ${590+g2}, ${698+g2} ${594+g2}, ${708+g1} ${588+g1}
     C 726 ${576+g1}, 742 ${560+g1}, 754 544 Z`);

  /* --- 眨眼 --- */
  if(t > nextBlink){ blinkT = t; nextBlink = t + rnd(2.6,4.6); }
  const blinking = blinkT > 0 && (t - blinkT) < 0.13;
  el.eyeOpen.setAttribute("visibility", blinking ? "hidden" : "visible");
  el.eyeClosed.setAttribute("visibility", blinking ? "visible" : "hidden");

  /* --- 视差层 --- */
  loops.forEach(L=>{
    const off = -((dist * L.p) % L.period);
    L.g.setAttribute("transform", `translate(${off.toFixed(1)},0)`);
  });
  el.center.setAttribute("stroke-dashoffset", (dist % 156).toFixed(1));

  /* --- 云 / 鸟 / 烟 / 天梯灯 --- */
  clouds.forEach(c=>{
    c.x -= c.v*dt;
    if(c.x < -260) { c.x = 1850; c.y = rnd(120,420); }
    c.el.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y.toFixed(1)})`);
  });
  birds.forEach(b=>{
    b.x -= b.v*dt;
    if(b.x < -60){ b.x = 1680; b.y = rnd(140,320); }
    const flap = Math.sin(t*9 + b.ph)*8;
    const ls = b.el.querySelectorAll("line");
    ls[0].setAttribute("x1", -4); ls[0].setAttribute("y1", 0);
    ls[0].setAttribute("x2", -14); ls[0].setAttribute("y2", (-flap).toFixed(1));
    ls[1].setAttribute("x1", 4); ls[1].setAttribute("y1", 0);
    ls[1].setAttribute("x2", 14); ls[1].setAttribute("y2", (-flap).toFixed(1));
    b.el.setAttribute("transform", `translate(${b.x.toFixed(1)},${b.y.toFixed(1)})`);
  });
  smokes.forEach(s=>{
    const p = (t*0.11 + s.off) % 1;
    const sx = s.src.x0 + 8, sy = s.src.top;
    s.el.setAttribute("cx", (sx + Math.sin(p*5)*10 + p*55).toFixed(1));
    s.el.setAttribute("cy", (sy - p*85).toFixed(1));
    s.el.setAttribute("rx", (6 + p*16).toFixed(1));
    s.el.setAttribute("ry", (4.5 + p*11).toFixed(1));
    s.el.setAttribute("opacity", ((1-p)*0.25).toFixed(2));
  });
  const lampO = 0.5 + Math.sin(t*2.2)*0.25 + Math.sin(t*7.7)*0.1;
  el.elevLamp.setAttribute("opacity", lampO.toFixed(2));
  el.elevGlow.setAttribute("opacity", (lampO*0.55).toFixed(2));
  el.tailLight.setAttribute("opacity", Math.sin(t*3.2) > 0.2 ? "1" : "0.3");

  /* --- 粒子 --- */
  dust.forEach(d=>{
    if(d.from){
      d.life -= dt;
      if(d.life <= 0){ d.x = RW.x - rnd(0,30); d.y = GROUND-3; d.life = rnd(0.5,1.1); d.o = rnd(0.2,0.4); }
      d.x -= SPEED*0.9*dt; d.y += d.s*dt*0.4; d.o -= dt*0.4;
      if(d.o < 0) d.o = 0;
    } else {
      d.x -= SPEED*d.v*dt; d.y += d.s*dt;
      if(d.x < -20){ d.x = 1640; d.y = rnd(560,860); }
      if(d.y < 540 || d.y > 880) d.s *= -1;
    }
    d.el.setAttribute("cx", d.x.toFixed(1));
    d.el.setAttribute("cy", d.y.toFixed(1));
    d.el.setAttribute("opacity", Math.max(0,d.o).toFixed(2));
  });

  /* --- 阴影 / HUD --- */
  const shScale = 1 - bob*0.012;
  el.shadow.setAttribute("ry", (15*shScale).toFixed(1));
  el.shadow.setAttribute("opacity", (0.9 - bob*0.03).toFixed(2));
  const spd = 24.2 + Math.sin(t*0.9)*0.5 + Math.sin(t*2.3)*0.2;
  el.speedTxt.textContent = spd.toFixed(1) + " km/h";
  const frac = (spd-18)/14;
  const a0 = Math.PI*0.75, a1 = Math.PI*2.25, aa = a0 + (a1-a0)*Math.min(1,Math.max(0,frac));
  const cx0 = 1330+196+0, cy0 = 826+23;
  el.speedArc.setAttribute("d",
    `M ${(cx0+Math.cos(a0)*14).toFixed(1)} ${(cy0+Math.sin(a0)*14).toFixed(1)}
     A 14 14 0 ${(aa-a0)>Math.PI?1:0} 1 ${(cx0+Math.cos(aa)*14).toFixed(1)} ${(cy0+Math.sin(aa)*14).toFixed(1)}`);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
