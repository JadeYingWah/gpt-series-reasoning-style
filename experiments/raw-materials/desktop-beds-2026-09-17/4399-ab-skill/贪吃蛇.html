<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇 - 4399小游戏合集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: linear-gradient(135deg, #1a2f1a, #0d1f0d);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", sans-serif; color: #cfe8cf;
  }
  h1 { color: #7ecb7e; margin-bottom: 8px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  #hud { display: flex; gap: 24px; margin-bottom: 10px; font-size: 18px; }
  #hud b { color: #ffd76e; }
  #stage { position: relative; border-radius: 12px; overflow: hidden;
           box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 0 4px #2f5230; }
  canvas { display: block; background: #142414; }
  #overlay {
    position: absolute; inset: 0; background: rgba(8,16,8,.82);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 40px; color: #9ee89e; font-weight: bold; }
  #overlay .sub { font-size: 17px; line-height: 1.9; color: #bcdcbc; }
  #overlay button {
    padding: 12px 44px; font-size: 22px; border: none; border-radius: 30px;
    background: linear-gradient(180deg, #7ecb7e, #4a9e4a); color: #0d1f0d;
    font-weight: bold; cursor: pointer; font-family: inherit;
  }
  #overlay button:hover { filter: brightness(1.1); }
  #tips { margin-top: 12px; font-size: 14px; color: #6f9a6f; }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div id="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
    <span>速度 <b id="speed">1</b></span>
  </div>
  <div id="stage">
    <canvas id="cv" width="520" height="520"></canvas>
    <div id="overlay">
      <div class="big" id="ovTitle">准备好了吗？</div>
      <div class="sub" id="ovSub">方向键 / WASD 控制方向<br>空格 暂停 · 吃到 🍎 得 10 分，撞墙或咬到自己结束</div>
      <button id="btnStart">开始游戏</button>
    </div>
  </div>
  <div id="tips">提示：蛇越长速度越快，稳住别贪快！</div>

<script>
"use strict";
// ---------- 常量 ----------
const COLS = 20, ROWS = 20, CELL = 26;
const BASE_MS = 150, MIN_MS = 70;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovSub = document.getElementById("ovSub");
const btnStart = document.getElementById("btnStart");

// ---------- 状态（顶层 let，可被外部读取） ----------
let state = "start";          // start | playing | paused | over
let snake = [];               // [{x,y}] 头在前
let dir = { x: 1, y: 0 };     // 当前方向
let nextDir = { x: 1, y: 0 }; // 下一方向（tick 时应用，防反向自杀）
let food = { x: 10, y: 10 };
let score = 0;
let best = 0;
let tickMs = BASE_MS;
let acc = 0, lastT = 0;

// ---------- 最高分（file:// 下 localStorage 可能受限，兜底内存） ----------
let mem = {};
try { best = parseInt(localStorage.getItem("snake_best") || "0", 10) || 0; } catch (e) { best = 0; }
function saveBest() {
  try { localStorage.setItem("snake_best", String(best)); } catch (e) { mem.snake_best = best; }
}
document.getElementById("best").textContent = best;

// ---------- 游戏逻辑 ----------
function reset() {
  snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
  score = 0; tickMs = BASE_MS; acc = 0;
  spawnFood();
  updateHud();
}
function spawnFood() {
  const free = [];
  const taken = new Set(snake.map(s => s.x + "," + s.y));
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (!taken.has(x + "," + y)) free.push({ x, y });
  if (free.length === 0) return; // 满屏=通关，由 tick 判定
  food = free[Math.floor(Math.random() * free.length)];
}
function speedLevel() { return Math.floor((BASE_MS - tickMs) / 10) + 1; }
function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("best").textContent = best;
  document.getElementById("speed").textContent = speedLevel();
}
function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
  // 咬到自己（尾巴即将移走的格子不算）
  const body = snake.slice(0, snake.length - 1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    tickMs = Math.max(MIN_MS, BASE_MS - Math.floor(score / 50) * 10);
    if (snake.length >= COLS * ROWS) { state = "over"; showOverlay("🏆 通关！", "你填满了整个棋盘，不可思议！得分 " + score); saveBest(); updateHud(); return; }
    spawnFood();
  } else {
    snake.pop();
  }
  updateHud();
}
function gameOver() {
  state = "over";
  if (score > best) { best = score; saveBest(); }
  updateHud();
  showOverlay("💀 游戏结束", "本局得分 <b style='color:#ffd76e'>" + score + "</b>　最高分 " + best + "<br>按 空格 或点按钮再来一局");
}
function showOverlay(title, sub) {
  ovTitle.innerHTML = title; ovSub.innerHTML = sub;
  btnStart.textContent = state === "start" ? "开始游戏" : "再来一局";
  overlay.classList.remove("hidden");
}

// ---------- 绘制 ----------
function draw() {
  // 棋盘底
  ctx.fillStyle = "#142414"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = "rgba(255,255,255,.03)"; ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
  }
  // 食物
  ctx.font = (CELL - 4) + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("🍎", food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
  // 蛇
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = i / Math.max(1, snake.length - 1);
    const g = Math.round(200 - t * 90), r = Math.round(60 + t * 40);
    ctx.fillStyle = "rgb(" + r + "," + g + ",80)";
    const pad = i === 0 ? 1 : 2.5;
    roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 7);
    ctx.fill();
  }
  // 蛇头眼睛
  if (snake.length) {
    const h = snake[0];
    const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
    const fx = dir.x * 4, fy = dir.y * 4;          // 沿运动方向前移
    const px = -dir.y * 4, py = dir.x * 4;         // 垂直方向分眼
    const e1x = cx + fx + px, e1y = cy + fy + py;
    const e2x = cx + fx - px, e2y = cy + fy - py;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(e1x, e1y, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x, e2y, 3, 0, 7); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(e1x + dir.x, e1y + dir.y, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(e2x + dir.x, e2y + dir.y, 1.5, 0, 7); ctx.fill();
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 主循环 ----------
function loop(t) {
  const dt = Math.min(100, t - lastT); lastT = t;
  if (state === "playing") {
    acc += dt;
    while (acc >= tickMs) { acc -= tickMs; if (state === "playing") tick(); }
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- 输入 ----------
const DIRS = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  KeyW: { x: 0, y: -1 }, KeyS: { x: 0, y: 1 }, KeyA: { x: -1, y: 0 }, KeyD: { x: 1, y: 0 }
};
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "playing") { state = "paused"; showOverlay("⏸ 暂停中", "按 空格 继续"); btnStart.textContent = "继续"; }
    else if (state === "paused") { state = "playing"; overlay.classList.add("hidden"); }
    else if (state === "over" || state === "start") start();
    return;
  }
  const d = DIRS[e.code];
  if (d && state === "playing") {
    e.preventDefault();
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }
});
btnStart.addEventListener("click", () => {
  if (state === "paused") { state = "playing"; overlay.classList.add("hidden"); }
  else start();
});
function start() {
  reset(); state = "playing"; overlay.classList.add("hidden");
}

// ---------- 启动 ----------
reset();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
</script>
</body>
</html>
