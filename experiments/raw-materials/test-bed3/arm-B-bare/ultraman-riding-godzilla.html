<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIJU RIDER — 奥特曼骑乘哥斯拉</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05071a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); display: block; }

  /* ---------- keyframes ---------- */
  @keyframes scrollX { to { transform: translateX(-1600px); } }
  @keyframes gzBob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes riderBob{ 0% { transform: translateY(0); } 35% { transform: translateY(-11px); } 60% { transform: translateY(3px); } 80% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
  @keyframes step    { 0% { transform: rotate(0deg); } 25% { transform: rotate(19deg); } 50% { transform: rotate(0deg); } 75% { transform: rotate(-14deg); } 100% { transform: rotate(0deg); } }
  @keyframes armSw   { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
  @keyframes tailSway{ 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
  @keyframes headNod { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes jaw     { 0%,7% { transform: rotate(0deg); } 13% { transform: rotate(25deg); } 24% { transform: rotate(20deg); } 30%,100% { transform: rotate(0deg); } }
  @keyframes throat  { 0%,7% { opacity: 0; } 13% { opacity: 1; } 24% { opacity: .9; } 30%,100% { opacity: 0; } }
  @keyframes shock   { 0%,12% { transform: scale(.2); opacity: 0; } 16% { opacity: .75; } 30% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes finPulse{ from { opacity: .55; } to { opacity: 1; } }
  @keyframes twk     { from { opacity: .22; } to { opacity: 1; } }
  @keyframes ember   { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-34px,-150px); opacity: 0; } }
  @keyframes puff    { 0% { transform: translate(0,0) scale(.5); opacity: 0; } 12% { opacity: .5; } 100% { transform: translate(-54px,-16px) scale(1.7); opacity: 0; } }
  @keyframes timerP  { from { opacity: .5; } to { opacity: 1; } }
  @keyframes starSpin{ to { transform: rotate(360deg); } }
  @keyframes fistPu  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  @keyframes ringX   { 0% { transform: scale(.25); opacity: .9; } 80% { transform: scale(2); opacity: 0; } 100% { transform: scale(2); opacity: 0; } }
  @keyframes shadowP { 0%,100% { transform: scaleX(1); opacity: .34; } 50% { transform: scaleX(.93); opacity: .26; } }
  @keyframes dashMove{ to { stroke-dashoffset: -350px; } }
  @keyframes blink   { 0%,58% { opacity: 1; } 60%,64% { opacity: .15; } 66%,100% { opacity: 1; } }

  /* ---------- animation bindings ---------- */
  .scrollFar    { animation: scrollX 70s linear infinite; }
  .scrollMid    { animation: scrollX 26s linear infinite; }
  .scrollGround { animation: scrollX 9s  linear infinite; }
  .scrollFore   { animation: scrollX 4.5s linear infinite; }
  .gzBob        { animation: gzBob 2s ease-in-out infinite; }
  .rider        { animation: riderBob 2s ease-in-out infinite; }
  #gzNearLeg    { animation: step 2s ease-in-out infinite; transform-origin: 856px 640px; }
  #gzFarLeg     { animation: step 2s ease-in-out -1s infinite; transform-origin: 756px 636px; }
  #gzNearArm    { animation: armSw 2s ease-in-out infinite; transform-origin: 948px 496px; }
  #gzFarArm     { animation: armSw 2s ease-in-out -1s infinite; transform-origin: 918px 490px; }
  #gzTail       { animation: tailSway 4.2s ease-in-out infinite; transform-origin: 692px 586px; }
  #gzHead       { animation: headNod 3.4s ease-in-out infinite; transform-origin: 1002px 436px; }
  #gzJaw        { animation: jaw 6.4s ease-in-out infinite; transform-origin: 996px 452px; }
  .throatGlow   { animation: throat 6.4s ease-in-out infinite; }
  #shock        { animation: shock 6.4s ease-out infinite; transform-origin: 1222px 462px; }
  .fins         { animation: finPulse 1.8s ease-in-out infinite alternate; }
  .star         { animation: twk var(--d, 2.4s) ease-in-out var(--dl, 0s) infinite alternate; }
  .ember        { animation: ember 3s linear infinite; }
  .puffA        { animation: puff 2s ease-out .9s infinite; transform-origin: 890px 778px; }
  .puffB        { animation: puff 2s ease-out 1.9s infinite; transform-origin: 770px 778px; }
  .timerCore    { animation: timerP 1.2s ease-in-out infinite alternate; }
  #fistStar     { animation: starSpin 6s linear infinite; transform-origin: 818px 213px; }
  #fistStarW    { animation: fistPu 1s ease-in-out infinite alternate; transform-origin: 818px 213px; }
  .ring         { animation: ringX 1.6s ease-out infinite; transform-origin: 818px 213px; }
  .ring.r2      { animation-delay: -.8s; }
  #shadow       { animation: shadowP 2s ease-in-out infinite; transform-origin: 800px 788px; }
  .dashline     { animation: dashMove 1.2s linear infinite; }
  .blink        { animation: blink 2.4s linear infinite; }

  .cap1 { font: 800 28px 'Segoe UI', system-ui, sans-serif; letter-spacing: 10px; fill: #93a5e0; opacity: .8; }
  .cap2 { font: 500 15px 'Segoe UI', system-ui, sans-serif; letter-spacing: 5px; fill: #6d7cb4; opacity: .8; }
</style>
</head>
<body>

    </filter>
