<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奥特曼骑哥斯拉 · 午夜巡游 2D动画</title>
<style>
  html,body{margin:0;padding:0;background:#02030a;min-height:100vh;display:grid;place-items:center;}
  svg{display:block;width:min(96vw,1280px);height:auto;border-radius:18px;
      box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 1px rgba(140,170,255,.14);}
  .anim{transform-origin:0 0;}

  /* ===== 无限横向滚动（视差层） ===== */
  @keyframes scrollX{to{transform:translateX(-1600px);}}
  .s-clouds{animation:scrollX 80s linear infinite;}
  .s-far{animation:scrollX 46s linear infinite;}
  .s-mid{animation:scrollX 26s linear infinite;}
  .s-road{animation:scrollX 9s linear infinite;}
  .s-fg{animation:scrollX 5.5s linear infinite;}

  /* ===== 哥斯拉行走循环（2.2s = 一步） ===== */
  @keyframes bobA{0%,50%,100%{transform:translate(-6px,0);}25%,75%{transform:translate(6px,-9px);}}
  .bobA{animation:bobA 2.2s ease-in-out infinite;}
  @keyframes thigh{
    0%{transform:rotate(-20deg);}20%{transform:rotate(10deg);}40%{transform:rotate(26deg);}
    50%{transform:rotate(16deg);}65%{transform:rotate(-10deg);}82%{transform:rotate(-22deg);}
    100%{transform:rotate(-20deg);}}
  @keyframes shin{
    0%{transform:rotate(8deg);}20%{transform:rotate(4deg);}40%{transform:rotate(30deg);}
    50%{transform:rotate(55deg);}62%{transform:rotate(40deg);}74%{transform:rotate(14deg);}
    100%{transform:rotate(8deg);}}
  .legA .th{animation:thigh 2.2s ease-in-out infinite;}
  .legA .sh{animation:shin 2.2s ease-in-out infinite;}
  .legB .th{animation:thigh 2.2s ease-in-out infinite;animation-delay:-1.1s;}
  .legB .sh{animation:shin 2.2s ease-in-out infinite;animation-delay:-1.1s;}
  @keyframes tail1{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(1deg);}}
  @keyframes tail2{0%,100%{transform:rotate(-13deg);}50%{transform:rotate(1deg);}}
  @keyframes tail3{0%,100%{transform:rotate(-11deg);}50%{transform:rotate(7deg);}}
  @keyframes tail4{0%,100%{transform:rotate(-9deg);}50%{transform:rotate(13deg);}}
  @keyframes tail5{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(20deg);}}
  .t1{animation:tail1 2.2s ease-in-out infinite;}
  .t2{animation:tail2 2.2s ease-in-out infinite;animation-delay:.12s;}
  .t3{animation:tail3 2.2s ease-in-out infinite;animation-delay:.24s;}
  .t4{animation:tail4 2.2s ease-in-out infinite;animation-delay:.36s;}
  .t5{animation:tail5 2.2s ease-in-out infinite;animation-delay:.48s;}
  @keyframes headB{0%,100%{transform:rotate(-2deg);}30%{transform:rotate(2.6deg);}
    60%{transform:rotate(-1deg);}80%{transform:rotate(1.8deg);}}
  .headB{animation:headB 2.2s ease-in-out infinite;animation-delay:-.2s;}
  @keyframes jaw{0%,55%,100%{transform:rotate(0);}25%{transform:rotate(6.5deg);}}
  .jaw{animation:jaw 2.2s ease-in-out infinite;animation-delay:-.6s;}
  @keyframes arm{0%{transform:rotate(6deg);}30%{transform:rotate(-8deg);}60%{transform:rotate(4deg);}100%{transform:rotate(6deg);}}
  .armA{animation:arm 2.2s ease-in-out infinite;animation-delay:-1.1s;}
  .armB{animation:arm 2.2s ease-in-out infinite;}
  @keyframes glowP{0%,100%{opacity:.55;}50%{opacity:1;}}
  .glowP{animation:glowP 2.2s ease-in-out infinite;}
  @keyframes mouthG{0%,100%{opacity:.25;}50%{opacity:.6;}}
  .mouthGlow{animation:mouthG 2.2s ease-in-out infinite;}
  @keyframes shadP{0%,50%,100%{transform:scale(1);}25%,75%{transform:scale(1.035);}}
  .shadP{animation:shadP 2.2s ease-in-out infinite;}
  @keyframes puff{0%{opacity:0;transform:scale(.3);}10%{opacity:.5;transform:scale(.65);}
    60%,100%{opacity:0;transform:translate(0,-34px) scale(1.9);}}
  .puff{animation:puff 2.2s ease-out infinite;}
  .puff2{animation-delay:-1.1s;}

  /* ===== 奥特曼（次级动作，相位滞后） ===== */
  @keyframes uBob{0%,50%,100%{transform:translateY(0) rotate(-1.2deg);}
    25%,75%{transform:translateY(-13px) rotate(1.4deg);}}
  .uBob{animation:uBob 2.2s ease-in-out infinite;animation-delay:-.4s;}
  @keyframes fistW{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(7deg);}}
  .uFist{animation:fistW 2.2s ease-in-out infinite;animation-delay:-.55s;}
  @keyframes grabW{0%,100%{transform:rotate(4deg);}50%{transform:rotate(-4deg);}}
  .uGrab{animation:grabW 2.2s ease-in-out infinite;animation-delay:-.15s;}
  @keyframes dang{0%,100%{transform:rotate(-11deg);}50%{transform:rotate(9deg);}}
  .uLegs{animation:dang 2.2s ease-in-out infinite;animation-delay:-.25s;}
  @keyframes headU{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  .uHead{animation:headU 2.2s ease-in-out infinite;animation-delay:-.6s;}
  @keyframes timerP{0%,100%{opacity:.55;}50%{opacity:1;}}
  .uTimer{animation:timerP 1.1s ease-in-out infinite;}

  /* ===== 环境点缀 ===== */
  @keyframes tw{0%,100%{opacity:.15;}50%{opacity:1;}}
  .tw{animation:tw 2.6s ease-in-out infinite;}
  @keyframes blinkL{0%,100%{opacity:1;}50%{opacity:.05;}}
  .blinkL{animation:blinkL 1.6s steps(1) infinite;}
  @keyframes shootK{0%,100%{opacity:0;transform:translate(0,0);}2%{opacity:1;}
    10%{opacity:0;transform:translate(-300px,132px);}}
  .shoot{animation:shootK 9s linear infinite;}
  @keyframes flickW{0%,42%,50%,58%,100%{opacity:.9;}46%{opacity:.25;}54%{opacity:.3;}}
  .flickW{animation:flickW 7s linear infinite;}
  @keyframes shakeC{0%,9%,50%,59%,100%{transform:translateY(0);}3%{transform:translateY(4px);}
    53%{transform:translateY(4px);}}
  .shake{animation:shakeC 2.2s linear infinite;}

  .glowC{filter:drop-shadow(0 0 7px rgba(125,235,255,.85));}
  .glowY{filter:drop-shadow(0 0 5px rgba(255,240,170,.9));}
  .glowB{filter:drop-shadow(0 0 7px rgba(70,215,255,.9));}
  .ttl{font:600 30px "Segoe UI",system-ui,sans-serif;letter-spacing:8px;fill:#e6eeff;opacity:.92;}
  .ttl2{font:500 15px "Segoe UI","Microsoft YaHei",system-ui,sans-serif;letter-spacing:5px;fill:#9db4e2;opacity:.85;}
</style>
</head>
