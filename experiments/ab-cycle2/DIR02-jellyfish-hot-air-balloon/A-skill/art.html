<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>气球驾驶员水母 · 昼夜穿越</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(circle at 50% 38%,#141a38 0%,#05060d 72%);
    display:grid;place-items:center;
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#9fb0d8;
  }
  .stage{width:min(100vmin,860px);height:min(100vmin,860px)}
  svg.scene{width:100%;height:100%;display:block}

  /* ===== 天空昼夜循环：12s ===== */
  @keyframes skyDusk {0%{opacity:1}28%{opacity:0}72%{opacity:0}100%{opacity:1}}
  @keyframes skyNight{0%{opacity:0}28%{opacity:1}60%{opacity:1}82%{opacity:0}100%{opacity:0}}
  @keyframes skyDawn {0%{opacity:0}60%{opacity:0}80%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .sky-dusk {animation:skyDusk 12s linear infinite}
  .sky-night{animation:skyNight 12s linear infinite}
  .sky-dawn {animation:skyDawn 12s linear infinite}

  /* ===== 视差层：远 20s / 中 12s / 近 7s ===== */
  .p-far,.p-mid,.p-near{transform-box:view-box}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-680px)}}
  .p-far {animation:drift 20s linear infinite}
  .p-mid {animation:drift 12s linear infinite}
  .p-near{animation:drift 7s  linear infinite}

  /* ===== 载具：升降 6s + 摇摆 10s ===== */
  @keyframes float{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
  @keyframes sway {0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.9deg)}}
  .float{transform-box:view-box;animation:float 6s ease-in-out infinite}
  .sway {transform-box:view-box;transform-origin:340px 240px;animation:sway 10s ease-in-out infinite}

  /* ===== 伞盖呼吸：4s ===== */
  @keyframes bellPulse{0%,100%{transform:scale(1,1)}40%{transform:scale(1.08,.92)}68%{transform:scale(.96,1.05)}}
  .bell{transform-box:view-box;transform-origin:340px 344px;animation:bellPulse 4s ease-in-out infinite}

  /* ===== 伞盖生物光晕：4s ===== */
  @keyframes glowPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
  .glow{transform-box:view-box;transform-origin:340px 374px;animation:glowPulse 4s ease-in-out infinite}

  /* ===== 燃烧火焰：0.5s ===== */
  @keyframes flameFlick{0%,100%{transform:scale(1,1);opacity:.92}35%{transform:scale(.86,1.16);opacity:1}70%{transform:scale(1.07,.93);opacity:.85}}
  .flame{transform-box:view-box;transform-origin:340px 326px;animation:flameFlick .5s ease-in-out infinite}

  /* ===== 帆布徽记呼吸：6s ===== */
  @keyframes motifPulse{0%,100%{opacity:.2}50%{opacity:.46}}
  .motif{animation:motifPulse 6s ease-in-out infinite}

  /* ===== 星闪：3s ===== */
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  .star{animation:twinkle 3s ease-in-out infinite}

  /* ===== 月亮辉光：15s ===== */
  @keyframes moonGlow{0%,100%{opacity:.8}50%{opacity:1}}
  .moon{animation:moonGlow 15s ease-in-out infinite}
</style>
</head>
<body>
<div class="stage">
<svg class="scene" viewBox="0 0 680 680" preserveAspectRatio="xMidYMid meet"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">气球驾驶员水母 · 昼夜穿越</title>
  <desc id="dsc">一只戴护目镜的水母坐在热气球吊篮里，用垂下的触手当缰绳牵动气球。背景为黄昏到夜再到黎明的十二秒循环，含三层不同速度的视差。</desc>

  <defs>
    <!-- 天空三层梯度 -->
    <linearGradient id="skyDuskG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2a5e"/>
      <stop offset="52%" stop-color="#7b4a70"/>
      <stop offset="100%" stop-color="#f2a563"/>
    </linearGradient>
    <linearGradient id="skyNightG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05081a"/>
      <stop offset="55%" stop-color="#0f1836"/>
      <stop offset="100%" stop-color="#1d2a55"/>
    </linearGradient>
    <linearGradient id="skyDawnG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3f7d"/>
      <stop offset="55%" stop-color="#a06a9a"/>
      <stop offset="100%" stop-color="#ffd7a0"/>
    </linearGradient>

    <!-- 帆布球囊：哑光暖布，左上受光 -->
    <radialGradient id="envG" cx="35%" cy="27%" r="82%">
      <stop offset="0%"   stop-color="#f3cf95"/>
      <stop offset="45%"  stop-color="#d89a55"/>
      <stop offset="100%" stop-color="#96562a"/>
    </radialGradient>

    <!-- 水母伞盖：半透明荧光 -->
    <radialGradient id="bellG" cx="42%" cy="32%" r="74%">
      <stop offset="0%"   stop-color="#ffeafc"/>
      <stop offset="55%"  stop-color="#e0a6f5"/>
      <stop offset="100%" stop-color="#a163d2"/>
    </radialGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(255,190,255,.55)"/>
      <stop offset="60%"  stop-color="rgba(190,120,235,.22)"/>
      <stop offset="100%" stop-color="rgba(160,90,210,0)"/>
    </radialGradient>

    <!-- 触手：自上而下由亮到暗 -->
    <linearGradient id="tentG" gradientUnits="userSpaceOnUse" x1="0" y1="390" x2="0" y2="570">
      <stop offset="0%"   stop-color="#f6d4ff"/>
      <stop offset="100%" stop-color="#a869cf"/>
    </linearGradient>

    <!-- 火焰 & 月亮 & 吊篮 -->
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ff6b2c"/>
      <stop offset="55%"  stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#fff3b0"/>
    </linearGradient>
    <radialGradient id="moonG" cx="40%" cy="36%" r="70%">
      <stop offset="0%"   stop-color="#fffdf2"/>
      <stop offset="100%" stop-color="#e6dcb4"/>
    </radialGradient>
    <linearGradient id="basketG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ac7439"/>
      <stop offset="100%" stop-color="#573717"/>
    </linearGradient>

    <clipPath id="basketClip">
      <path d="M284 412 L396 412 L384 478 L296 478 Z"/>
    </clipPath>

    <!-- 视差层瓦片：每片宽 680，复制一份偏移 +680 实现无缝循环 -->
    <path id="hillsFar" fill="#141b36"
      d="M0 664 Q96 596 196 642 Q258 610 322 650 Q402 604 472 648 Q552 616 622 654 Q654 640 680 658 L680 680 L0 680 Z"/>
    <path id="hillsNear" fill="#1e2748"
      d="M0 678 Q118 640 238 670 Q358 632 478 668 Q578 642 680 674 L680 680 L0 680 Z"/>
    <g id="midTile" fill="#c8d2f2" opacity="0.5">
      <ellipse cx="70" cy="350" rx="72" ry="22"/>
      <ellipse cx="120" cy="338" rx="48" ry="26"/>
      <ellipse cx="28" cy="360" rx="34" ry="16"/>
      <ellipse cx="210" cy="470" rx="60" ry="18"/>
      <ellipse cx="168" cy="482" rx="38" ry="14"/>
      <ellipse cx="520" cy="330" rx="76" ry="22"/>
      <ellipse cx="570" cy="318" rx="50" ry="26"/>
      <ellipse cx="640" cy="344" rx="36" ry="16"/>
      <ellipse cx="470" cy="470" rx="58" ry="18"/>
      <ellipse cx="512" cy="482" rx="36" ry="14"/>
    </g>
    <g id="nearTile" fill="#e8eeff" opacity="0.62">
      <ellipse cx="120" cy="566" rx="96" ry="28"/>
      <ellipse cx="180" cy="552" rx="60" ry="30"/>
      <ellipse cx="60" cy="578" rx="46" ry="20"/>
      <ellipse cx="430" cy="612" rx="110" ry="30"/>
      <ellipse cx="500" cy="596" rx="66" ry="32"/>
      <ellipse cx="370" cy="624" rx="52" ry="22"/>
      <ellipse cx="640" cy="556" rx="80" ry="24"/>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect x="0" y="0" width="680" height="680" fill="#101a3e"/>

  <g class="sky-dusk"><rect x="0" y="0" width="680" height="680" fill="url(#skyDuskG)"/></g>

  <g class="sky-night">
    <rect x="0" y="0" width="680" height="680" fill="url(#skyNightG)"/>
    <circle class="moon" cx="540" cy="112" r="46" fill="url(#moonG)" opacity=".22"/>
    <circle cx="540" cy="112" r="30" fill="url(#moonG)"/>
    <circle cx="528" cy="104" r="6" fill="#e9dfb6" opacity=".5"/>
    <circle cx="552" cy="122" r="9" fill="#e9dfb6" opacity=".35"/>
    <circle cx="546" cy="98"  r="4" fill="#e9dfb6" opacity=".4"/>
    <g fill="#eef3ff">
      <circle class="star" cx="60"  cy="72"  r="1.8"/>
      <circle class="star" cx="112" cy="40"  r="1.3" style="animation-delay:-.4s"/>
      <circle class="star" cx="170" cy="96"  r="2.1" style="animation-delay:-1.1s"/>
      <circle class="star" cx="232" cy="50"  r="1.4" style="animation-delay:-2.0s"/>
      <circle class="star" cx="300" cy="30"  r="1.9" style="animation-delay:-.8s"/>
      <circle class="star" cx="392" cy="44"  r="1.3" style="animation-delay:-1.6s"/>
      <circle class="star" cx="452" cy="86"  r="2.2" style="animation-delay:-.2s"/>
      <circle class="star" cx="612" cy="42"  r="1.5" style="animation-delay:-2.4s"/>
      <circle class="star" cx="578" cy="76"  r="1.9" style="animation-delay:-1.3s"/>
      <circle class="star" cx="644" cy="112" r="1.3" style="animation-delay:-.6s"/>
      <circle class="star" cx="80"  cy="152" r="1.6" style="animation-delay:-1.9s"/>
      <circle class="star" cx="150" cy="182" r="2.0" style="animation-delay:-.9s"/>
      <circle class="star" cx="600" cy="176" r="1.4" style="animation-delay:-2.2s"/>
      <circle class="star" cx="660" cy="152" r="1.8" style="animation-delay:-.3s"/>
      <circle class="star" cx="50"  cy="232" r="1.5" style="animation-delay:-1.5s"/>
      <circle class="star" cx="622" cy="242" r="1.7" style="animation-delay:-1.0s"/>
    </g>
  </g>

  <g class="sky-dawn"><rect x="0" y="0" width="680" height="680" fill="url(#skyDawnG)"/></g>

  <!-- 远景 20s -->
  <g class="p-far">
    <use href="#hillsFar"/><use href="#hillsFar" x="680"/>
    <use href="#hillsNear"/><use href="#hillsNear" x="680"/>
  </g>
  <!-- 中景云 12s -->
  <g class="p-mid">
    <use href="#midTile"/><use href="#midTile" x="680"/>
  </g>
  <!-- 近景云 7s -->
  <g class="p-near">
    <use href="#nearTile"/><use href="#nearTile" x="680"/>
  </g>

  <!-- ================= 主体：气球 + 水母 ================= -->
  <g class="float">
  <g class="sway">

    <!-- 球囊（载具） -->
    <path d="M340 52 C258 52 214 116 214 188 C214 254 264 308 316 324 Q340 336 364 324 C416 308 466 254 466 188 C466 116 422 52 340 52 Z"
          fill="url(#envG)" stroke="#7a4522" stroke-width="2"/>
    <!-- 分瓣缝线 -->
    <g fill="none" stroke="#8a5228" stroke-width="1.4" opacity=".55">
      <path d="M340 52 Q148 189 340 326"/>
      <path d="M340 52 Q212 189 340 326"/>
      <path d="M340 52 Q276 189 340 326"/>
      <path d="M340 52 Q404 189 340 326"/>
      <path d="M340 52 Q468 189 340 326"/>
      <path d="M340 52 Q532 189 340 326"/>
    </g>
    <ellipse cx="286" cy="140" rx="34" ry="52" fill="#ffffff" opacity=".16" transform="rotate(-24 286 140)"/>

    <!-- 帆布徽记：与主体呼应而不混淆（扁平线描 + 低不透明度） -->
    <g class="motif">
      <circle cx="340" cy="236" r="50" fill="#ffe6ff" opacity=".07"/>
      <circle cx="340" cy="236" r="50" fill="none" stroke="#ffe6ff" stroke-width="1.6" opacity=".5"/>
      <path d="M322 252 Q340 228 358 252" fill="none" stroke="#ffe6ff" stroke-width="2.4" stroke-linecap="round"/>
      <g fill="none" stroke="#ffe6ff" stroke-width="1.8" stroke-linecap="round">
        <path d="M328 252 V262"/><path d="M336 252 V266"/>
        <path d="M344 252 V266"/><path d="M352 252 V262"/>
      </g>
    </g>

    <!-- 吊索 -->
    <g stroke="#6f4a26" stroke-width="2" opacity=".92">
      <line x1="320" y1="326" x2="283" y2="406"/>
      <line x1="332" y1="330" x2="314" y2="406"/>
      <line x1="348" y1="330" x2="366" y2="406"/>
      <line x1="360" y1="326" x2="397" y2="406"/>
    </g>

    <!-- 吊篮内腔 -->
    <rect x="288" y="400" width="104" height="14" rx="4" fill="#2c1a0c"/>

    <!-- 燃烧器 + 火焰（0.5s） -->
    <rect x="329" y="326" width="22" height="12" rx="3" fill="#727c8c" stroke="#3d4653" stroke-width="2"/>
    <g class="flame">
      <path d="M340 294 C352 312 350 324 340 328 C330 324 328 312 340 294 Z" fill="url(#flameG)"/>
      <path d="M340 308 C346 318 345 325 340 328 C335 325 334 318 340 308 Z" fill="#fff6c2" opacity=".85"/>
    </g>

    <!-- 水母（主体，伞盖呼吸 4s） -->
    <ellipse class="glow" cx="340" cy="374" rx="74" ry="56" fill="url(#glowG)"/>
    <g class="bell">
      <path d="M284 398 C284 358 308 338 340 338 C372 338 396 358 396 398 Q384 412 372 398 Q360 412 348 398 Q336 412 324 398 Q312 412 300 398 Q288 412 284 398 Z"
            fill="url(#bellG)" opacity=".86" stroke="#f6d9ff" stroke-width="1.4"/>
      <ellipse cx="312" cy="356" rx="14" ry="7" fill="#ffffff" opacity=".34" transform="rotate(-18 312 356)"/>
      <!-- 护目镜 -->
      <path d="M285 370 Q340 360 395 370" fill="none" stroke="#3b2b57" stroke-width="3.2" opacity=".85"/>
      <circle cx="316" cy="370" r="13" fill="#cfeaff" stroke="#3b2b57" stroke-width="3.2"/>
      <circle cx="364" cy="370" r="13" fill="#cfeaff" stroke="#3b2b57" stroke-width="3.2"/>
      <path d="M329 370 H351" stroke="#3b2b57" stroke-width="3.2"/>
      <circle cx="320" cy="370" r="4" fill="#241a3a"/>
      <circle cx="368" cy="370" r="4" fill="#241a3a"/>
      <circle cx="311.5" cy="364" r="3" fill="#ffffff" opacity=".95"/>
      <circle cx="359.5" cy="364" r="3" fill="#ffffff" opacity=".95"/>
      <path d="M332 386 Q340 393 348 386" fill="none" stroke="#3b2b57" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="302" cy="384" rx="7" ry="4" fill="#ff9ecb" opacity=".5"/>
      <ellipse cx="378" cy="384" rx="7" ry="4" fill="#ff9ecb" opacity=".5"/>
    </g>

    <!-- 吊篮前面板 -->
    <path d="M284 412 L396 412 L384 478 L296 478 Z" fill="url(#basketG)"/>
    <g clip-path="url(#basketClip)" stroke="#4a2f14" stroke-width="1.3" opacity=".38">
      <path d="M278 424 H402"/><path d="M278 436 H402"/><path d="M278 448 H402"/>
      <path d="M278 460 H402"/><path d="M278 472 H402"/>
      <path d="M306 406 V480"/><path d="M322 406 V480"/><path d="M340 406 V480"/>
      <path d="M358 406 V480"/><path d="M374 406 V480"/>
    </g>
    <rect x="278" y="406" width="124" height="13" rx="6.5" fill="#9a6634" stroke="#5e3a17" stroke-width="2"/>

    <!-- 触手：7 条 / 3 组独立周期（3s、4.5s、5.5s），旋转心即附着点 -->
    <g fill="none" stroke="url(#tentG)" stroke-linecap="round">
      <path stroke-width="4.2" d="M296 400 C286 436 298 460 282 494 C272 518 286 538 276 564">
        <animateTransform attributeName="transform" type="rotate"
          values="-6 296 400; 6 296 400; -6 296 400" keyTimes="0;.5;1"
          dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="3.2" d="M310 400 C303 430 314 454 307 482 C300 510 311 530 304 552">
        <animateTransform attributeName="transform" type="rotate"
          values="5 310 400; -5 310 400; 5 310 400" keyTimes="0;.5;1"
          dur="4.5s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="3.2" d="M324 400 C319 426 328 448 322 472 C316 496 326 514 320 534">
        <animateTransform attributeName="transform" type="rotate"
          values="-7 324 400; 7 324 400; -7 324 400" keyTimes="0;.5;1"
          dur="3s" begin="-.4s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="3.2" d="M340 400 C336 430 345 454 340 482 C334 510 343 528 338 550">
        <animateTransform attributeName="transform" type="rotate"
          values="6 340 400; -6 340 400; 6 340 400" keyTimes="0;.5;1"
          dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="3.2" d="M356 400 C361 426 352 448 358 472 C364 496 354 514 360 534">
        <animateTransform attributeName="transform" type="rotate"
          values="-7 356 400; 7 356 400; -7 356 400" keyTimes="0;.5;1"
          dur="3s" begin="-2.2s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="3.2" d="M370 400 C377 430 366 454 373 482 C380 510 369 530 376 552">
        <animateTransform attributeName="transform" type="rotate"
          values="5 370 400; -5 370 400; 5 370 400" keyTimes="0;.5;1"
          dur="4.5s" begin="-2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
      <path stroke-width="4.2" d="M384 400 C394 436 382 460 398 494 C408 518 394 538 404 564">
        <animateTransform attributeName="transform" type="rotate"
          values="-6 384 400; 6 384 400; -6 384 400" keyTimes="0;.5;1"
          dur="5.5s" begin="-3.1s" repeatCount="indefinite" calcMode="spline" keySplines=".42 0 .58 1;.42 0 .58 1"/>
      </path>
    </g>

    <!-- 缰绳：两条长触手穿过固定于吊篮的黄铜环 -->
    <g stroke="#7a5a3a" stroke-width="1.6" fill="none" opacity=".9">
      <path d="M297 478 L276 512"/>
      <path d="M383 478 L404 512"/>
    </g>
    <circle cx="276" cy="512" r="8" fill="none" stroke="#c9a227" stroke-width="2.8"/>
    <circle cx="404" cy="512" r="8" fill="none" stroke="#c9a227" stroke-width="2.8"/>

  </g>
  </g>
</svg>
</div>
</body>
</html>
