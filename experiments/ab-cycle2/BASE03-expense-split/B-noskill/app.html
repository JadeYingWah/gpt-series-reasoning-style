<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聚餐 AA 分摊计算器</title>
<style>
  :root{
    --bg:#0f1720; --card:#ffffff; --ink:#16202b; --muted:#64748b;
    --line:#e3e8ef; --accent:#2f6fed; --ok:#0f8a4d; --warn:#a86b00; --err:#c0392b;
    --okbg:#e9f7ef; --warnbg:#fdf4e3; --errbg:#fdecea;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 64px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#0f1720 0%,#1b2735 320px,#eef2f7 320px,#eef2f7 100%);
    color:var(--ink);
  }
  .wrap{max-width:720px;margin:0 auto}
  header h1{color:#fff;font-size:22px;margin:0 0 4px}
  header p{color:#9fb0c3;font-size:13px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:18px;box-shadow:0 6px 20px rgba(15,23,32,.18);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .hint{font-weight:400;color:var(--muted);font-size:12px}
  input[type=text]{
    width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);
    border-radius:8px;outline:none;background:#fbfcfe;font-variant-numeric:tabular-nums;
  }
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  button{
    padding:9px 16px;font-size:14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;cursor:pointer;color:var(--ink);
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:hover{filter:brightness(.97)}
  #status{margin-top:16px;padding:11px 13px;border-radius:8px;font-size:14px;
          line-height:1.5;border:1px solid transparent;white-space:pre-wrap;word-break:break-word}
  #status.ok{background:var(--okbg);border-color:#bfe6cf;color:var(--ok)}
  #status.warn{background:var(--warnbg);border-color:#f0dcb0;color:var(--warn)}
  #status.error{background:var(--errbg);border-color:#f5c6c0;color:var(--err)}
  #status.idle{background:#f1f5f9;border-color:var(--line);color:var(--muted)}
  .result{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
  .big{font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:12px;
      font-variant-numeric:tabular-nums}
  .kv .k{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;
        font-variant-numeric:tabular-nums}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:600;background:#fafbfd}
  td:last-child,th:last-child{text-align:right}
  .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
         background:#eef2f7;color:var(--muted);margin-left:6px}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>聚餐 AA 分摊计算器</h1>
    <p>离线可用 · 单文件 · 无外部依赖 —— 输入即算，分位精确到「分」</p>
  </header>

  <div class="card">
    <div class="grid">
      <div>
        <label for="amount">总金额（元） <span class="hint">支持小数、千分位、￥符号</span></label>
        <input id="amount" type="text" inputmode="decimal" autocomplete="off"
               placeholder="例如 1234.567" value="100">
      </div>
      <div>
        <label for="people">人数 <span class="hint">正整数</span></label>
        <input id="people" type="text" inputmode="numeric" autocomplete="off"
               placeholder="例如 3" value="3">
      </div>
    </div>
    <div class="row">
      <button class="primary" id="fill">填入示例</button>
      <button id="reset">重置</button>
      <button id="clear">清空输入</button>
    </div>

    <div id="status" class="idle">请输入总金额与人数，结果会实时更新。</div>
  </div>

  <div class="card" id="resultCard">
    <div class="big" id="perHead">—<small>元 / 人</small></div>
    <div class="kv" id="kv"></div>
    <div class="note" id="explain"></div>
    <div id="tableBox"></div>
  </div>

  <div class="card">
    <strong style="font-size:13px">余数（分位）处理规则</strong>
    <div class="note">
      1. 先把总金额规整到 <b>2 位小数</b>（四舍五入），再换算成整数「分」。<br>
      2. 人均 = <code>总分 ÷ 人数</code> 取 <b>向下取整</b>，得到基础份额。<br>
      3. 余下的若干分，按顺序 <b>每人 +1 分</b> 分给前 N 位，直到分完。<br>
      4. 因此：<b>合计永远恰好等于总金额</b>，不产生多收/少收；相邻两人最多相差 0.01 元。
    </div>
  </div>
</div>

<script>
"use strict";
/*__LOGIC_START__*/
/* 全角 -> 半角，去干扰字符，得到纯数字串 */
function sanitizeNumeric(raw) {
  if (raw === null || raw === undefined) return "";
  var s = String(raw);
  // 全角数字/符号转半角
  s = s.replace(/[\uFF10-\uFF19]/g, function (c) {
    return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
  });
  s = s.replace(/\uFF0E/g, ".").replace(/\uFF0C/g, ",");
  s = s.replace(/[,\s\u00A0_]/g, "");            // 千分位、空格、下划线
  s = s.replace(/[¥￥$€£]/g, "");                 // 货币符号
  s = s.replace(/元|块/g, "");
  return s;
}

/* 解析金额：返回 {ok, value, rounded, note} */
function parseAmount(raw) {
  var s = sanitizeNumeric(raw);
  if (s === "") return { ok: false, reason: "empty", value: NaN };
  if (s.length > 60) return { ok: false, reason: "toolong", value: NaN };
  if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return { ok: false, reason: "nan", value: NaN };
  var v = Number(s);                       // 不用 parseFloat，避免 "12abc" 式截断
  if (!isFinite(v)) return { ok: false, reason: "nan", value: NaN };
  if (v < 0) return { ok: false, reason: "negative", value: v };
  if (v > 1e12) return { ok: false, reason: "toobig", value: v };
  var rounded = Math.round(v * 100) / 100;
  var note = (Math.abs(rounded - v) > 1e-9)
    ? "输入金额含超过 2 位小数，已四舍五入规整为 " + rounded.toFixed(2) + " 元。"
    : "";
  return { ok: true, value: rounded, raw: v, rounded: rounded, note: note };
}

/* 解析人数：返回 {ok, value, reason, note} */
function parsePeople(raw) {
  var s = sanitizeNumeric(raw);
  if (s === "") return { ok: false, reason: "empty", value: NaN };
  if (!/^\d+$/.test(s)) return { ok: false, reason: "notint", value: NaN };
  if (s.length > 12) return { ok: false, reason: "toolong", value: NaN };
  var v = Number(s);
  if (!isFinite(v)) return { ok: false, reason: "nan", value: NaN };
  if (v === 0) return { ok: false, reason: "zero", value: 0 };
  if (v > 100000) return { ok: false, reason: "toomany", value: v };
  return { ok: true, value: v };
}

/* 核心：分摊计算。永不抛异常。 */
function splitBill(rawAmount, rawPeople) {
  try {
    var a = parseAmount(rawAmount);
    var p = parsePeople(rawPeople);
    var notes = [];

    if (!a.ok) {
      var amsg = {
        empty: "请输入总金额。",
        nan: "总金额无法识别，请只填写数字（可含小数点）。",
        toolong: "总金额位数过长，无法计算，请检查输入。",
        negative: "总金额不能为负数。",
        toobig: "总金额超出可计算范围（上限 1 万亿元）。"
      }[a.reason] || "总金额无效。";
      return { ok: false, level: "error", message: amsg, notes: notes };
    }
    if (!p.ok) {
      var pmsg = {
        empty: "请输入人数。",
        notint: "人数必须是正整数（不支持小数或非数字字符）。",
        zero: "人数必须大于 0，当前为 0。",
        toolong: "人数位数过长，无法计算。",
        toomany: "人数超过 100000，超出可计算范围。",
        nan: "人数无法识别。"
      }[p.reason] || "人数无效。";
      return { ok: false, level: "error", message: pmsg, notes: notes };
    }

    if (a.note) notes.push(a.note);

    var totalCents = Math.round(a.value * 100);
    var people = p.value;
    var baseCents = Math.floor(totalCents / people);
    var remainderCents = totalCents - baseCents * people;

    var shares = new Array(people);
    for (var i = 0; i < people; i++) shares[i] = (i < remainderCents) ? baseCents + 1 : baseCents;

    var sum = people * baseCents + remainderCents;
    var level = notes.length ? "warn" : "ok";
    var msg = "计算完成：每人 " + (baseCents / 100).toFixed(2) + " 元";
    if (remainderCents > 0) {
      msg += "，其中前 " + remainderCents + " 人各多摊 0.01 元（共 " +
             a.value.toFixed(2) + " 元，分位已精确分配）。";
    } else {
      msg += "（可整除，无余数）。";
    }

    return {
      ok: true, level: level, message: msg, notes: notes,
      total: a.value, people: people,
      basePay: baseCents / 100,
      maxPay: (baseCents + (remainderCents > 0 ? 1 : 0)) / 100,
      remainderCents: remainderCents,
      remainderAmount: remainderCents / 100,
      sharesCents: shares,
      sumCents: sum,
      totalCents: totalCents
    };
  } catch (e) {
    return { ok: false, level: "error", message: "计算出现异常，已安全拦截：" + (e && e.message ? e.message : "未知错误"), notes: [] };
  }
}
/*__LOGIC_END__*/

/* ---------------- UI ---------------- */
(function () {
  var $amount = document.getElementById("amount");
  var $people = document.getElementById("people");
  var $status = document.getElementById("status");
  var $perHead = document.getElementById("perHead");
  var $kv = document.getElementById("kv");
  var $explain = document.getElementById("explain");
  var $tableBox = document.getElementById("tableBox");

  function setStatus(level, text) {
    $status.className = level;
    $status.textContent = text;
  }
  function money(cents) { return (cents / 100).toFixed(2); }

  function render() {
    try {
      var r = splitBill($amount.value, $people.value);

      if (!r.ok) {
        setStatus("error", "⚠ " + r.message);
        $perHead.innerHTML = "—<small>元 / 人</small>";
        $kv.textContent = "";
        $explain.textContent = "";
        $tableBox.textContent = "";
        return;
      }

      var extra = r.notes.length ? "\n" + r.notes.join("\n") : "";
      var icon = r.level === "ok" ? "✓ " : (r.level === "warn" ? "ℹ " : "⚠ ");
      setStatus(r.level, icon + r.message + extra);
      $perHead.innerHTML = r.basePay.toFixed(2) + "<small>元 / 人</small>";

      var kv = document.createElement("div");
      kv.className = "kv";
      function row(k, v) {
        var a = document.createElement("div"); a.className = "k"; a.textContent = k;
        var b = document.createElement("div"); b.textContent = v;
        kv.appendChild(a); kv.appendChild(b);
      }
      row("总金额", r.total.toFixed(2) + " 元");
      row("人数", r.people + " 人");
      row("余数", r.remainderCents > 0
        ? r.remainderCents + " 分（" + r.remainderAmount.toFixed(2) + " 元），分给前 " + r.remainderCents + " 人"
        : "0 分（可整除）");
      row("实际合计", (r.sumCents / 100).toFixed(2) + " 元" +
        (r.sumCents === r.totalCents ? "（与总金额一致 ✓）" : "（不一致 ✗）"));
      $kv.textContent = "";
      $kv.appendChild(kv);

      $explain.textContent = r.remainderCents > 0
        ? "分摊方式：基础份额 " + r.basePay.toFixed(2) + " 元，前 " + r.remainderCents +
          " 人各多 0.01 元，即 " + r.maxPay.toFixed(2) + " 元；其余人 " + r.basePay.toFixed(2) +
          " 元。相邻两人最多相差 0.01 元。"
        : "分摊方式：总金额可被人数整除，每人 " + r.basePay.toFixed(2) + " 元。";

      $tableBox.textContent = "";
      if (r.people <= 30) {
        var t = document.createElement("table");
        var thead = document.createElement("thead");
        thead.innerHTML = "<tr><th>成员</th><th>应付（元）</th><th>备注</th></tr>";
        t.appendChild(thead);
        var tb = document.createElement("tbody");
        for (var i = 0; i < r.people; i++) {
          var tr = document.createElement("tr");
          var c1 = document.createElement("td"); c1.textContent = "第 " + (i + 1) + " 人";
          var c2 = document.createElement("td"); c2.textContent = money(r.sharesCents[i]);
          var c3 = document.createElement("td");
          c3.innerHTML = (r.sharesCents[i] !== r.sharesCents[0])
            ? "<span class='badge'>+0.01 余数</span>" : "";
          tr.appendChild(c1); tr.appendChild(c2); tr.appendChild(c3);
          tb.appendChild(tr);
        }
        t.appendChild(tb);
        $tableBox.appendChild(t);
      } else {
        var p = document.createElement("div");
        p.className = "note";
        p.textContent = "人数较多（" + r.people + " 人），仅展示汇总：前 " +
          r.remainderCents + " 人付 " + r.maxPay.toFixed(2) + " 元，其余 " +
          (r.people - r.remainderCents) + " 人付 " + r.basePay.toFixed(2) + " 元（明细表省略）。";
        $tableBox.appendChild(p);
      }
    } catch (e) {
      setStatus("error", "⚠ 界面渲染异常，已安全拦截：" + (e && e.message ? e.message : "未知错误"));
    }
  }

  $amount.addEventListener("input", render);
  $people.addEventListener("input", render);
  $amount.addEventListener("change", render);
  $people.addEventListener("change", render);

  document.getElementById("fill").addEventListener("click", function () {
    $amount.value = "1234.567";
    $people.value = "7";
    render();
  });
  document.getElementById("reset").addEventListener("click", function () {
    $amount.value = "100";
    $people.value = "3";
    render();
  });
  document.getElementById("clear").addEventListener("click", function () {
    $amount.value = "";
    $people.value = "";
    render();
  });

  // 全局兜底：任何未捕获错误都不让页面崩
  window.addEventListener("error", function (ev) {
    try { setStatus("error", "⚠ 运行期异常已拦截：" + (ev.message || "未知错误")); } catch (_) {}
  });

  render();
})();
</script>
</body>
</html>
