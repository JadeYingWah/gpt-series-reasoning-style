<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>响应式验收 harness</title>
<style>
 body{margin:0;padding:14px;background:#e9edf5;color:#111;
      font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
 h1{font-size:15px;margin:0 0 10px;}
 .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:nowrap;}
 figure{margin:0;background:#fff;border:1px solid #b9c3d4;border-radius:8px;padding:8px;}
 figcaption{font-size:11px;color:#445;margin-bottom:6px;font-weight:600;}
 iframe{border:1px solid #d33;display:block;background:#0f1420;}
</style></head><body>
<h1>响应式验收：白底红框浮层为 _probe.html 内测得的真实布局视口数据（iframe 内布局视口 = 指定宽度）</h1>
<div class="row">
  <figure>
    <figcaption>如果框宽 390px（<code>_probe.html</code> 预填 1000 元 / 7 人）</figcaption>
    <iframe src="_probe.html" width="390" height="1180" style="width:390px;height:1180px"></iframe>
  </figure>
  <figure>
    <figcaption>如果框宽 480px（<code>_probe.html</code> 预填 1000 元 / 7 人）</figcaption>
    <iframe src="_probe.html" width="480" height="1180" style="width:480px;height:1180px"></iframe>
  </figure>
  <figure>
    <figcaption>如果框宽 760px（<code>_probe.html</code> 预填 1000 元 / 7 人）</figcaption>
    <iframe src="_probe.html" width="760" height="940" style="width:760px;height:940px"></iframe>
  </figure>
</div>
</body></html>
