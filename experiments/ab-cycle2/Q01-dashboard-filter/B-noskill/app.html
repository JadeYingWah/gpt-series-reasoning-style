<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>销售看板 · 内嵌数据版</title>
<style>
  :root{
    --bg:#f4f6fa;
    --surface:#ffffff;
    --ink:#141a24;
    --ink-2:#4a5568;
    --ink-3:#8a94a6;
    --line:#e2e6ee;
    --brand:#2f5bd8;
    --brand-soft:#e8eefe;
    --ok:#12805c;
    --warn:#b4530a;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,26,36,.06),0 8px 24px rgba(20,26,36,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:15px/1.55 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}

  /* ---------- 标题区 ---------- */
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  header.top h1{font-size:22px;line-height:1.3;margin:0 0 4px;letter-spacing:.2px}
  header.top p{margin:0;color:var(--ink-3);font-size:13px}
  .badge{
    font-size:12px;color:var(--brand);background:var(--brand-soft);
    border:1px solid #cfdcff;border-radius:999px;padding:4px 10px;white-space:nowrap;
  }

  /* ---------- 通用面板 ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px;
  }
  .panel-title{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-size:14px;font-weight:700;letter-spacing:.3px;margin:0 0 14px;
  }
  .panel-title .hint{font-weight:400;font-size:12px;color:var(--ink-3)}

  /* ---------- 筛选区 ---------- */
  .filter-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filter-label{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
  .chip{
    font:inherit;font-size:13px;line-height:1;
    background:#fff;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
    max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .chip:hover{border-color:#c3cde0;background:#fafbfe}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .chip[aria-pressed="true"]:hover{background:#2649b5}
  .chip:focus-visible{outline:3px solid #b9caff;outline-offset:1px}
  .btn{
    font:inherit;font-size:13px;background:#fff;color:var(--ink-2);
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn:hover{border-color:#c3cde0;background:#fafbfe}
  .btn:focus-visible{outline:3px solid #b9caff;outline-offset:1px}
  .status{
    margin-top:12px;font-size:12.5px;color:var(--ink-3);
    border-top:1px dashed var(--line);padding-top:10px;
  }
  .status b{color:var(--ink-2)}
  .status .warn{color:var(--warn)}

  /* ---------- 数字卡 ---------- */
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:20px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px;min-width:0;
    transition:border-color .2s,transform .2s;
  }
  .card .k{font-size:12.5px;color:var(--ink-3);letter-spacing:.4px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .v{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.5px;font-variant-numeric:tabular-nums;word-break:break-all}
  .card .sub{margin-top:6px;font-size:12px;color:var(--ink-3);min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card.is-empty .v{color:var(--ink-3)}
  .card.accent{border-color:#cfdcff;background:linear-gradient(180deg,#f7f9ff,#fff)}
  .card.accent .v{color:var(--brand)}

  /* ---------- 图表 ---------- */
  .chart-box{position:relative;display:flex;gap:12px}
  .y-axis{
    width:52px;flex:none;display:flex;flex-direction:column;justify-content:space-between;
    height:240px;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;
  }
  .y-axis span{transform:translateY(-50%)}
  .y-axis span:first-child{transform:translateY(0)}
  .y-axis span:last-child{transform:translateY(-100%)}
  .plot{position:relative;flex:1;min-width:0;height:240px}
  .grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between}
  .grid i{display:block;height:1px;background:var(--line)}
  .grid i:first-child{background:#ccd4e2}
  .bars{position:absolute;inset:0;display:flex;align-items:stretch;gap:6px;padding:0 4px}
  .col{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
    cursor:default;border-radius:8px;padding:0 2px;transition:background .15s;
  }
  .col:hover,.col:focus-visible{background:#f2f5fd;outline:none}
  .col-val{
    font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;
    margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .track{flex:1;width:100%;display:flex;align-items:flex-end}
  .bar{
    width:100%;max-width:72px;margin:0 auto;border-radius:6px 6px 2px 2px;
    background:linear-gradient(180deg,#4f79e8,#2f5bd8);
    transition:filter .15s;
  }
  .col:hover .bar{filter:brightness(1.12)}
  .x-axis{display:flex;gap:6px;padding:8px 4px 0;margin-left:64px}
  .x-axis span{
    flex:1 1 0;min-width:0;text-align:center;font-size:11.5px;color:var(--ink-3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- 空态 ---------- */
  .empty{
    border:1px dashed #c8d2e4;background:linear-gradient(180deg,#fbfcff,#fff);
    border-radius:12px;padding:34px 20px;text-align:center;color:var(--ink-2);
  }
  .empty .ico{font-size:24px;line-height:1;margin-bottom:10px;color:var(--ink-3)}
  .empty h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
  .empty p{margin:0 auto;font-size:13px;color:var(--ink-3);max-width:48ch}

  .err{
    display:none;background:#fdf3f2;border:1px solid #f3c9c4;color:#9b2c1f;
    border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:20px;
  }
  footer.foot{color:var(--ink-3);font-size:12px;text-align:center;margin-top:8px}

  @media (max-width:720px){
    .cards{grid-template-columns:1fr}
    .y-axis{width:44px}
    .x-axis{margin-left:56px}
    .card .v{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>销售看板</h1>
      <p>数据内嵌于本文件 · 离线可运行 · 无外部请求</p>
    </div>
    <span class="badge">样本数据（演示用）</span>
  </header>

  <div class="err" id="errBox" role="alert"></div>

  <!-- 筛选区 -->
  <section class="panel" aria-labelledby="filterTitle">
    <h2 class="panel-title" id="filterTitle">地区筛选 <span class="hint">点击地区可多选 / 取消；清空后即为空态</span></h2>
    <div class="filter-row">
      <span class="filter-label" id="regionLabel">地区</span>
      <div class="chips" id="chips" role="group" aria-labelledby="regionLabel"></div>
      <button class="btn" id="btnAll" type="button">全选</button>
      <button class="btn" id="btnNone" type="button">清空</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>

  <!-- 数字卡 -->
  <section class="cards" id="cards" aria-label="总览指标"></section>

  <!-- 图表 -->
  <section class="panel" aria-labelledby="chartTitle">
    <h2 class="panel-title" id="chartTitle">月度销售额 <span class="hint" id="chartHint"></span></h2>
    <div id="chartWrap">
      <div class="chart-box">
        <div class="y-axis" id="yAxis" aria-hidden="true"></div>
        <div class="plot">
          <div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="bars" id="bars"></div>
        </div>
      </div>
      <div class="x-axis" id="xAxis" aria-hidden="true"></div>
    </div>
    <div id="emptyState"></div>
  </section>

  <footer class="foot">纯前端单文件演示 · 无网络依赖</footer>
</div>

<!-- ================= 纯逻辑层（无 DOM 依赖，可独立提取测试） ================= -->
<script>
/*<<CORE>>*/
var RAW_ORDERS = [
  { id:"SO-1001", region:"华东", month:"2026-01", amount:128600, customer:"星海科技有限公司" },

  { id:"SO-1020", region:"华东", month:"2026-05", amount:176800, customer:"合肥智算中心" },
  { id:"SO-1021", region:"华北", month:"2026-05", amount:105300, customer:"太原重装" },
  { id:"SO-1022", region:"东北", month:"2026-05", amount:47700,  customer:"长春汽配" },
  { id:"SO-1023", region:"华南", month:"2026-05", amount:91200,  customer:"厦门海丝" },

  { id:"SO-1024", region:"华东", month:"2026-06", amount:149700, customer:"上海临港智造" },
  { id:"SO-1025", region:"华南", month:"2026-06", amount:126400, customer:"东莞精工" },
  { id:"SO-1026", region:"西南", month:"2026-06", amount:63800,  customer:"昆明云通" },
  { id:"SO-1027", region:"东北", month:"2026-06", amount:52400,  customer:"哈尔滨电气" },
  { id:"SO-1028", region:"华北", month:"2026-06", amount:87400,  customer:"保定输变电" }
];

/* 合法月份：YYYY-MM，且月份 01-12 */
function isMonthKey(m){
  return typeof m === "string" && /^\d{4}-(0[1-9]|1[0-2])$/.test(m);
}
/* 合法金额：有限、非负数字（容忍数字字符串） */
function toAmount(a){
  if (typeof a === "number") return isFinite(a) && a >= 0 ? a : null;
  if (typeof a === "string" && a.trim() !== "") {
    var n = Number(a.trim());
    return isFinite(n) && n >= 0 ? n : null;
  }
  return null;
}
/* 清洗：丢弃结构非法/金额非法/月份非法的记录，返回 {orders, dropped} */
function sanitizeOrders(raw){
  var out = [], dropped = 0;
  if (!Array.isArray(raw)) return { orders: out, dropped: dropped };
  for (var i = 0; i < raw.length; i++){
    var r = raw[i];
    if (!r || typeof r !== "object" || Array.isArray(r)){ dropped++; continue; }
    var amt = toAmount(r.amount);
    var region = typeof r.region === "string" ? r.region.trim() : "";
    if (amt === null || region === "" || !isMonthKey(r.month)){ dropped++; continue; }
    out.push({
      id: typeof r.id === "string" ? r.id : "",
      region: region,
      month: r.month,
      amount: amt,
      customer: typeof r.customer === "string" ? r.customer : ""
    });
  }
  return { orders: out, dropped: dropped };
}
/* 地区清单：去重 + 稳定排序 */
function listRegions(orders){
  if (!Array.isArray(orders)) return [];
  var seen = Object.create(null), out = [];
  for (var i = 0; i < orders.length; i++){
    var g = orders[i] && orders[i].region;
    if (typeof g === "string" && g !== "" && !seen[g]){ seen[g] = 1; out.push(g); }
  }
  return out.sort(function(a, b){ return a.localeCompare(b, "zh-Hans-CN"); });
}
/* 筛选：selected 为 null/非数组 => 视为全部；空数组 => 空结果 */
function filterOrders(orders, selected){
  if (!Array.isArray(orders)) return [];
  if (!Array.isArray(selected)) return orders.filter(function(o){ return !!o; });
  if (selected.length === 0) return [];
  var set = Object.create(null);
  for (var i = 0; i < selected.length; i++) set[selected[i]] = 1;
  return orders.filter(function(o){ return !!o && set[o.region] === 1; });
}
/* 总览：总销售额 / 订单数 / 客单价（跳过无法取到合法金额的记录） */
function computeSummary(orders){
  var EMPTY = { total:0, orders:0, avg:0, isEmpty:true };
  if (!Array.isArray(orders) || orders.length === 0) return EMPTY;
  var total = 0, n = 0;
  for (var i = 0; i < orders.length; i++){
    var o = orders[i];
    var a = o ? toAmount(o.amount) : null;
    if (a === null) continue;
    total += a; n++;
  }
  if (n === 0) return EMPTY;
  return { total: total, orders: n, avg: total / n, isEmpty: false };
}
/* 按月聚合：返回 [{month,label,amount}]，按月份升序；非法月份记录被跳过 */
function groupByMonth(orders){
  if (!Array.isArray(orders)) return [];
  var acc = Object.create(null), keys = [];
  for (var i = 0; i < orders.length; i++){
    var o = orders[i];
    if (!o || !isMonthKey(o.month)) continue;
    if (!acc[o.month]){ acc[o.month] = 0; keys.push(o.month); }
    acc[o.month] += toAmount(o.amount) || 0;
  }
  keys.sort();
  return keys.map(function(k){
    return { month:k, label: Number(k.slice(5, 7)) + "月", amount: acc[k] };
  });
}
/* 坐标轴上限：取整到好看的刻度（4 段） */
function niceMax(v){
  if (typeof v !== "number" || !isFinite(v) || v <= 0) return 0;
  var exp = Math.pow(10, Math.floor(Math.log10(v)));
  var f = v / exp;
  var step = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return step * exp;
}
/* 金额格式：¥12,345.60；非法值返回 "—" */
function formatMoney(n, digits){
  var d = typeof digits === "number" ? digits : 2;
  if (typeof n !== "number" || !isFinite(n)) return "—";
  var neg = n < 0, x = Math.abs(n);
  var s = x.toFixed(d).split(".");
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-¥" : "¥") + s.join(".");
}
/* 紧凑金额：用于柱顶标签 */
function formatCompact(n){
  if (typeof n !== "number" || !isFinite(n)) return "—";
  if (Math.abs(n) >= 10000) return "¥" + (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
  return "¥" + Math.round(n);
}
/* 数值安全钳制：用于把任意输入变成可用的百分比/高度 */
function safePct(part, whole){
  if (typeof part !== "number" || !isFinite(part)) return 0;
  if (typeof whole !== "number" || !isFinite(whole) || whole <= 0) return 0;
  var p = (part / whole) * 100;
  if (!isFinite(p) || p < 0) return 0;
  return Math.min(100, p);
}
/*<</CORE>>*/
</script>

<!-- ================= 渲染层 ================= -->
<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }

  var state = { selected: [] };

  function setError(msg){
    var box = $("errBox");
    if (!box) return;
    if (msg){ box.textContent = "页面渲染出现异常：" + msg; box.style.display = "block"; }
    else { box.textContent = ""; box.style.display = "none"; }
  }

  function renderChips(regions){
    var box = $("chips");
    box.textContent = "";
    regions.forEach(function(r){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = r;
      b.title = r;                       // 超长文本：悬停可见全称
      b.setAttribute("aria-pressed", state.selected.indexOf(r) >= 0 ? "true" : "false");
      b.addEventListener("click", function(){
        var i = state.selected.indexOf(r);
        if (i >= 0) state.selected.splice(i, 1); else state.selected.push(r);
        safeRender();
      });
      box.appendChild(b);
    });
  }

  function renderCards(s){
    var host = $("cards");
    host.textContent = "";
    var items = [
      { k:"总销售额", v: s.isEmpty ? formatMoney(0) : formatMoney(s.total), sub: s.isEmpty ? "当前筛选无数据" : "共 " + s.orders + " 笔订单合计", accent:true },
      { k:"订单数",   v: String(s.orders), sub: s.isEmpty ? "当前筛选无数据" : "按地区筛选后的记录条数", accent:false },
      { k:"客单价",   v: s.isEmpty ? formatMoney(0) : formatMoney(s.avg), sub: s.isEmpty ? "当前筛选无数据" : "总销售额 ÷ 订单数", accent:false }
    ];
    items.forEach(function(it){
      var c = document.createElement("article");
      c.className = "card" + (it.accent ? " accent" : "") + (s.isEmpty ? " is-empty" : "");
      var k = document.createElement("div"); k.className = "k"; k.textContent = it.k;
      var v = document.createElement("div"); v.className = "v"; v.textContent = it.v; v.title = it.v;
      var sub = document.createElement("div"); sub.className = "sub"; sub.textContent = it.sub;
      c.appendChild(k); c.appendChild(v); c.appendChild(sub);
      host.appendChild(c);
    });
  }

  function renderChart(rows){
    var bars = $("bars"), yAxis = $("yAxis"), xAxis = $("xAxis");
    var wrap = $("chartWrap"), emptyHost = $("emptyState");
    bars.textContent = ""; yAxis.textContent = ""; xAxis.textContent = "";
    var hint = $("chartHint");

    if (!rows || rows.length === 0){
      wrap.style.display = "none";
      hint.textContent = "";
      emptyHost.textContent = "";
      var e = document.createElement("div");
      e.className = "empty";
      var ico = document.createElement("div"); ico.className = "ico"; ico.textContent = "◍";
      var h = document.createElement("h3"); h.textContent = "没有符合条件的数据";
      var p = document.createElement("p");
      p.textContent = "当前未选择任何地区（或所选地区没有订单记录）。请在上方「地区筛选」中至少选择一个地区，或点击「全选」查看全部数据。";
      e.appendChild(ico); e.appendChild(h); e.appendChild(p);
      emptyHost.appendChild(e);
      return;
    }

    emptyHost.textContent = "";
    wrap.style.display = "";

    var max = 0;
    rows.forEach(function(r){ if (r.amount > max) max = r.amount; });
    var top = niceMax(max) || max || 1;
    hint.textContent = "纵轴上限 " + formatCompact(top) + " · 共 " + rows.length + " 个月";

    for (var g = 4; g >= 0; g--){
      var s = document.createElement("span");
      s.textContent = formatCompact(top * g / 4);
      yAxis.appendChild(s);
    }

    rows.forEach(function(r){
      var col = document.createElement("div");
      col.className = "col";
      col.tabIndex = 0;
      col.title = r.month + "：" + formatMoney(r.amount);   // 超长文本走 title，不撑破布局

      var val = document.createElement("div"); val.className = "col-val"; val.textContent = formatCompact(r.amount);
      var track = document.createElement("div"); track.className = "track";
      var bar = document.createElement("div"); bar.className = "bar";
      bar.style.height = safePct(r.amount, top).toFixed(2) + "%";
      track.appendChild(bar);
      col.appendChild(val); col.appendChild(track);
      bars.appendChild(col);

      var x = document.createElement("span"); x.textContent = r.label; x.title = r.month;
      xAxis.appendChild(x);
    });
  }

  function render(){
    var clean = sanitizeOrders(RAW_ORDERS);
    var orders = clean.orders;
    var regions = listRegions(orders);

    // 首次进入：默认全选
    if (!state.inited){
      state.selected = regions.slice();
      state.inited = true;
    }
    // 数据里已不存在的地区从选择中剔除（防止脏状态）
    state.selected = state.selected.filter(function(r){ return regions.indexOf(r) >= 0; });

    renderChips(regions);

    var picked = filterOrders(orders, state.selected);
    var summary = computeSummary(picked);

    renderCards(summary);
    renderChart(groupByMonth(picked));

    var st = $("status");
    st.textContent = "";
    function span(text, cls){
      var s = document.createElement("span");
      if (cls) s.className = cls;
      s.textContent = text;
      return s;
    }
    function strong(text){
      var b = document.createElement("b");
      b.textContent = text;
      return b;
    }
    st.appendChild(document.createTextNode("已选地区："));
    st.appendChild(strong(state.selected.length ? state.selected.join("、") : "（无）"));
    st.appendChild(document.createTextNode(" · 命中订单 "));
    st.appendChild(strong(String(picked.length)));
    st.appendChild(document.createTextNode(" 条 / 全部 "));
    st.appendChild(strong(String(orders.length)));
    st.appendChild(document.createTextNode(" 条 · 内嵌原始记录 " + RAW_ORDERS.length + " 条"));
    if (clean.dropped > 0){
      st.appendChild(span(" · 已忽略 " + clean.dropped + " 条非法记录", "warn"));
    }
  }

  /* 所有渲染入口统一兜底：任何异常都转为可见提示，不产生未捕获异常 */
  function safeRender(){
    try { render(); setError(null); }
    catch (err){
      setError((err && err.message) ? err.message : String(err));
      if (window.console && console.error) console.error(err);
    }
  }

  function bind(){
    $("btnAll").addEventListener("click", function(){
      state.selected = listRegions(sanitizeOrders(RAW_ORDERS).orders);
      safeRender();
    });
    $("btnNone").addEventListener("click", function(){
      state.selected = [];
      safeRender();
    });
  }

  try {
    bind();
    safeRender();
  } catch (err){
    setError((err && err.message) ? err.message : String(err));
    if (window.console && console.error) console.error(err);
  }
})();
</script>
</body>
</html>
