<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>单位换算 · 长度 / 重量 / 温度</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1b2333; --muted:#5d6b85;
    --line:#dfe5f0; --accent:#2f5fe0; --accent-soft:#e8eeff;
    --ok:#0f7b52; --warn:#8a5a00; --warn-bg:#fff6e0;
    --err:#b3261e; --err-bg:#fdecea; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh; padding:28px 16px 56px;
    font:16px/1.6 "Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:640px}
  h1{font-size:1.5rem; margin:0 0 4px; letter-spacing:.01em}
  .sub{margin:0 0 20px; color:var(--muted); font-size:.9rem}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
        padding:20px; box-shadow:0 1px 2px rgba(27,35,51,.05), 0 8px 24px rgba(27,35,51,.05)}

  .tabs{display:flex; gap:6px; background:#eef1f8; padding:5px; border-radius:12px; margin-bottom:20px}
  .tab{flex:1; appearance:none; border:0; background:transparent; color:var(--muted);
       font:inherit; font-weight:600; padding:9px 6px; border-radius:9px; cursor:pointer;
       transition:background .15s, color .15s, box-shadow .15s}
  .tab:hover{color:var(--ink); background:rgba(255,255,255,.7)}
  .tab[aria-pressed="true"]{background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(27,35,51,.12)}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  label{display:block; font-size:.82rem; font-weight:600; color:var(--muted); margin-bottom:6px}
  .field{margin-bottom:16px}
  input[type=text],select{
    width:100%; font:inherit; color:var(--ink); background:#fbfcfe;
    border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  input[type=text]{font-size:1.35rem; font-variant-numeric:tabular-nums; letter-spacing:.01em}
  select{cursor:pointer}
  input[type=text]:hover,select:hover{border-color:#c4cfe4}
  input[type=text]:focus,select:focus{outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); background:#fff}
  input[aria-invalid="true"]{border-color:var(--err); box-shadow:0 0 0 3px var(--err-bg)}
  input[aria-invalid="true"]:focus{border-color:var(--err); box-shadow:0 0 0 3px var(--err-bg)}

  .row{display:flex; gap:10px; align-items:flex-end}
  .row .field{flex:1; margin-bottom:0}
  .swap{flex:0 0 auto; width:44px; height:44px; border-radius:10px; cursor:pointer;
        border:1px solid var(--line); background:#fbfcfe; color:var(--muted);
        font-size:1.15rem; line-height:1; transition:all .15s}
  .swap:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
  .swap:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .result{margin-top:20px; padding:16px; border-radius:12px; background:#f7f9fe;
          border:1px solid var(--line); transition:background .25s, border-color .25s}
  .result.flash{background:var(--accent-soft); border-color:#c3d2f7}
  .result .cap{font-size:.78rem; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
  .out{font-size:2rem; font-weight:700; font-variant-numeric:tabular-nums;
       word-break:break-all; line-height:1.25; margin-top:2px}
  .out .unit{font-size:1rem; font-weight:600; color:var(--muted); margin-left:6px}

  .msg{margin:12px 0 0; font-size:.88rem; min-height:1.4em; color:var(--muted)}
  .msg.error{color:var(--err); background:var(--err-bg); border-radius:8px; padding:8px 10px}
  .msg.warn{color:var(--warn); background:var(--warn-bg); border-radius:8px; padding:8px 10px}
  .msg.hint{color:var(--muted)}
  .formula{margin:14px 0 0; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
  .tips{margin-top:18px; font-size:.82rem; color:var(--muted)}
  .tips kbd{background:#eef1f8; border:1px solid var(--line); border-bottom-width:2px;
            border-radius:5px; padding:1px 6px; font:600 .78rem/1.4 inherit; color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>单位换算</h1>
  <p class="sub">长度 / 重量 / 温度 · 输入即换算，无需点击按钮 · 完全离线</p>

  <div class="card">
    <div class="tabs" id="tabs" role="group" aria-label="换算类别">
      <button type="button" class="tab" data-cat="length" aria-pressed="true">长度</button>
      <button type="button" class="tab" data-cat="weight" aria-pressed="false">重量</button>
      <button type="button" class="tab" data-cat="temp" aria-pressed="false">温度</button>
    </div>

    <div class="field">
      <label for="valueInput" id="inputLabel">数值（米）</label>
      <input id="valueInput" type="text" inputmode="decimal" autocomplete="off"
             spellcheck="false" placeholder="例如 1" value="1" aria-describedby="msg">
    </div>

    <div class="row">
      <div class="field">
        <label for="fromUnit">从</label>
        <select id="fromUnit"></select>
      </div>
      <button type="button" class="swap" id="swapBtn" title="交换单位" aria-label="交换源单位与目标单位">⇄</button>
      <div class="field">
        <label for="toUnit">到</label>
        <select id="toUnit"></select>
      </div>
    </div>

    <div class="result" id="resultBox" role="group" aria-label="换算结果">
      <div class="cap">换算结果</div>
      <div class="out" aria-live="polite"><span id="outValue">—</span><span class="unit" id="outUnit"></span></div>
    </div>

    <p class="msg hint" id="msg" role="status" aria-live="polite"></p>
    <p class="formula" id="formula"></p>
  </div>

  <p class="tips">键盘操作：<kbd>Tab</kbd> 依次切换「类别 → 数值 → 源单位 → 交换 → 目标单位」，
    下拉框用 <kbd>↑</kbd><kbd>↓</kbd> 选择，按钮用 <kbd>Enter</kbd> 或 <kbd>空格</kbd> 触发。</p>
</main>

<script>
/* 纯计算逻辑：不依赖 DOM，可被外部脚本原样提取复算（见 verify/core-tests.mjs） */
/* ==== CORE-LOGIC-START ==== */
(function (root) {
  'use strict';

  var CATEGORIES = {
    length: {
      id: 'length', label: '长度', base: '米', allowNegative: false,
      units: [
        { id: 'mm', name: '毫米', sym: 'mm', factor: 0.001 },
        { id: 'cm', name: '厘米', sym: 'cm', factor: 0.01 },
        { id: 'm',  name: '米',   sym: 'm',  factor: 1 },
        { id: 'km', name: '千米', sym: 'km', factor: 1000 },
        { id: 'in', name: '英寸', sym: 'in', factor: 0.0254 },
        { id: 'ft', name: '英尺', sym: 'ft', factor: 0.3048 },
        { id: 'mi', name: '英里', sym: 'mi', factor: 1609.344 }
      ]
    },
    weight: {
      id: 'weight', label: '重量', base: '千克', allowNegative: false,
      units: [
        { id: 'mg', name: '毫克', sym: 'mg', factor: 0.000001 },
        { id: 'g',  name: '克',   sym: 'g',  factor: 0.001 },
        { id: 'kg', name: '千克', sym: 'kg', factor: 1 },
        { id: 't',  name: '吨',   sym: 't',  factor: 1000 },
        { id: 'oz', name: '盎司', sym: 'oz', factor: 0.028349523125 },
        { id: 'lb', name: '磅',   sym: 'lb', factor: 0.45359237 }
      ]
    },
    temp: {
      id: 'temp', label: '温度', base: '摄氏度', allowNegative: true, special: 'temp',
      units: [
        { id: 'c', name: '摄氏度', sym: '°C' },
        { id: 'f', name: '华氏度', sym: '°F' },
        { id: 'k', name: '开尔文', sym: 'K' }
      ]
    }
  };

  var ABS_ZERO_C = -273.15;

  function toCelsius(fromId, v) {
    if (fromId === 'c') return v;
    if (fromId === 'f') return (v - 32) * 5 / 9;
    if (fromId === 'k') return v - 273.15;
    throw new Error('unknown temperature unit: ' + fromId);
  }

  function fromCelsius(toId, c) {
    if (toId === 'c') return c;
    if (toId === 'f') return c * 9 / 5 + 32;
    if (toId === 'k') return c + 273.15;
    throw new Error('unknown temperature unit: ' + toId);
  }

  function findUnit(cat, uid) {
    var us = CATEGORIES[cat] ? CATEGORIES[cat].units : [];
    for (var i = 0; i < us.length; i++) { if (us[i].id === uid) return us[i]; }
    return null;
  }

  /* 纯换算：入参为已通过校验的数值 */
  function convertRaw(cat, fromId, toId, value) {
    if (cat === 'temp') return fromCelsius(toId, toCelsius(fromId, value));
    var f = findUnit(cat, fromId), t = findUnit(cat, toId);
    if (!f || !t) throw new Error('unknown unit: ' + fromId + ' -> ' + toId);
    return value * f.factor / t.factor;
  }

  var NUM_RE = /^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/;
  var MAX_INPUT_CHARS = 60;

  function preview(text) {
    return text.length > 12 ? text.slice(0, 12) + '…' : text;
  }

  /* 校验 + 判定：返回 {status, value, level, message}
     status: ok | empty | invalid   level: ok | hint | warn | error */
  function evaluate(cat, fromId, raw) {
    var cfg = CATEGORIES[cat];
    if (!cfg) {
      return { status: 'invalid', value: null, level: 'error', message: '未知的换算类别。' };
    }
    var text = (raw == null ? '' : String(raw)).trim();
    if (text === '') {
      return { status: 'empty', value: null, level: 'hint', message: '请输入数值，结果会自动换算。' };
    }
    if (text.length > MAX_INPUT_CHARS) {
      return { status: 'invalid', value: null, level: 'error',
               message: '输入过长（最多 ' + MAX_INPUT_CHARS + ' 个字符），请输入一个普通数字。' };
    }
    if (!NUM_RE.test(text)) {
      return { status: 'invalid', value: null, level: 'error',
               message: '“' + preview(text) + '”不是有效数字。可输入如 1、-2.5、.5、1e3 的形式。' };
    }
    var v = Number(text);
    if (!isFinite(v)) {
      return { status: 'invalid', value: null, level: 'error', message: '数值超出可计算范围，请换一个较小的数字。' };
    }
    if (!cfg.allowNegative && v < 0) {
      return { status: 'invalid', value: null, level: 'error',
               message: cfg.label + '不能为负值，请输入 0 或正数。' };
    }
    if (cat === 'temp' && toCelsius(fromId, v) < ABS_ZERO_C) {
      return { status: 'ok', value: v, level: 'warn',
               message: '该值低于绝对零度（' + ABS_ZERO_C + ' °C），物理上不存在，此处仅作算术换算。' };
    }
    return { status: 'ok', value: v, level: 'ok', message: '' };
  }

  /* 精度：最多 8 位有效数字，去掉浮点噪声与无意义的长小数 */
  function formatValue(x) {
    if (typeof x !== 'number' || !isFinite(x)) return '—';
    if (x === 0) return '0';
    var abs = Math.abs(x);
    if (abs >= 1e15 || abs < 1e-6) {
      return x.toExponential(5).replace(/\.?0+e/, 'e');
    }
    return String(Number(x.toPrecision(8)));
  }

  root.UnitCore = {
    CATEGORIES: CATEGORIES,
    ABS_ZERO_C: ABS_ZERO_C,
    MAX_INPUT_CHARS: MAX_INPUT_CHARS,
    toCelsius: toCelsius,
    fromCelsius: fromCelsius,
    findUnit: findUnit,
    convertRaw: convertRaw,
    evaluate: evaluate,
    formatValue: formatValue
  };
})(typeof window !== 'undefined' ? window : globalThis);
/* ==== CORE-LOGIC-END ==== */
</script>

<script>
(function () {
  'use strict';
  var C = window.UnitCore;
  var $ = function (id) { return document.getElementById(id); };

  var tabsBox = $('tabs'), input = $('valueInput'), inputLabel = $('inputLabel');
  var fromSel = $('fromUnit'), toSel = $('toUnit'), swapBtn = $('swapBtn');
  var outValue = $('outValue'), outUnit = $('outUnit'), msg = $('msg'), formula = $('formula');
  var resultBox = $('resultBox');

  var state = {
    cat: 'length',
    from: { length: 'm', weight: 'kg', temp: 'c' },
    to:   { length: 'cm', weight: 'lb', temp: 'f' }
  };

  function unitById(cat, id) { return C.findUnit(cat, id); }

  function fillSelect(sel, cat, selectedId) {
    var cfg = C.CATEGORIES[cat];
    sel.textContent = '';
    cfg.units.forEach(function (u) {
      var opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.name + '（' + u.sym + '）';
      if (u.id === selectedId) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function setMsg(text, level) {
    msg.textContent = text || '';
    msg.className = 'msg ' + (level || 'hint');
  }

  function flash() {
    resultBox.classList.add('flash');
    setTimeout(function () { resultBox.classList.remove('flash'); }, 220);
  }

  function render(animate) {
    var cat = state.cat;
    var fromId = state.from[cat], toId = state.to[cat];
    var res = C.evaluate(cat, fromId, input.value);

    inputLabel.textContent = '数值（' + C.CATEGORIES[cat].label + '）';

    if (res.status === 'ok') {
      var out;
      try {
        out = C.convertRaw(cat, fromId, toId, res.value);
      } catch (e) {
        outValue.textContent = '—';
        outUnit.textContent = '';
        input.setAttribute('aria-invalid', 'true');
        setMsg('换算失败：' + e.message, 'error');
        formula.textContent = '';
        return;
      }
      outValue.textContent = C.formatValue(out);
      outUnit.textContent = unitById(cat, toId).sym;
      input.setAttribute('aria-invalid', res.level === 'warn' ? 'false' : 'false');
      setMsg(res.message, res.level === 'warn' ? 'warn' : 'hint');
      if (animate) flash();
    } else {
      outValue.textContent = '—';
      outUnit.textContent = '';
      input.setAttribute('aria-invalid', res.status === 'invalid' ? 'true' : 'false');
      setMsg(res.message, res.status === 'empty' ? 'hint' : 'error');
    }

    var f = unitById(cat, fromId), t = unitById(cat, toId);
    if (f && t) {
      var one = C.formatValue(C.convertRaw(cat, fromId, toId, 1));
      formula.textContent = '换算关系：1 ' + f.sym + ' = ' + one + ' ' + t.sym +
        (cat === 'temp' ? '' : '　（基准：' + C.CATEGORIES[cat].base + '）');
    }
  }

  function switchCategory(cat) {
    if (!C.CATEGORIES[cat] || cat === state.cat) return;
    state.cat = cat;
    Array.prototype.forEach.call(tabsBox.querySelectorAll('.tab'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.cat === cat));
    });
    fillSelect(fromSel, cat, state.from[cat]);
    fillSelect(toSel, cat, state.to[cat]);
    render(true);
  }

  tabsBox.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.tab') : null;
    if (btn) switchCategory(btn.dataset.cat);
  });

  input.addEventListener('input', function () { render(true); });

  fromSel.addEventListener('change', function () {
    state.from[state.cat] = fromSel.value; render(true);
  });
  toSel.addEventListener('change', function () {
    state.to[state.cat] = toSel.value; render(true);
  });

  swapBtn.addEventListener('click', function () {
    var cat = state.cat;
    var tmp = state.from[cat];
    state.from[cat] = state.to[cat];
    state.to[cat] = tmp;
    fillSelect(fromSel, cat, state.from[cat]);
    fillSelect(toSel, cat, state.to[cat]);
    render(true);
    fromSel.focus();
  });

  /* 初始化 */
  Array.prototype.forEach.call(tabsBox.querySelectorAll('.tab'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat));
  });
  fillSelect(fromSel, state.cat, state.from[state.cat]);
  fillSelect(toSel, state.cat, state.to[state.cat]);
  render(false);
})();
</script>

<script>
(function () {
  var R = [];
  var pageErrors = [];
  window.addEventListener('error', function (e) { pageErrors.push('error: ' + (e.message || e.type)); });
  window.addEventListener('unhandledrejection', function (e) { pageErrors.push('rejection: ' + e.reason); });
  var $ = function (id) { return document.getElementById(id); };
  var outText = function () { return $('outValue').textContent; };
  var outUnit = function () { return $('outUnit').textContent; };
  var msgCls  = function () { return $('msg').className; };
  var msgTxt  = function () { return $('msg').textContent; };
  function rec(name, ok, detail) { R.push({ name: name, ok: !!ok, detail: String(detail == null ? '' : detail) }); }
  function type(v) {
    var el = $('valueInput');
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function pick(sel, v) {
    var el = $(sel);
    el.value = v;
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
  function cat(id) {
    document.querySelector('.tab[data-cat="' + id + '"]').click();
  }
  try {
    /* --- 初始状态 --- */
    rec('初始：长度 1 m -> cm 显示 100', outText() === '100', outText() + ' / ' + outUnit());
    rec('初始：结果带单位 cm', outUnit() === 'cm', outUnit());
    rec('初始：长度 tab aria-pressed=true',
        document.querySelector('.tab[data-cat="length"]').getAttribute('aria-pressed') === 'true');

    /* --- 输入即换算（无计算按钮） --- */
    type('2.5');
    rec('输入即换算：2.5 m -> cm = 250', outText() === '250', outText());
    type('0');
    rec('零边界：0 m -> cm = 0', outText() === '0', outText());
    type('1');
    pick('fromUnit', 'in'); pick('toUnit', 'cm');
    rec('小数精度：1 in -> cm = 2.54', outText() === '2.54', outText());
    rec('换算关系行随单位更新', $('formula').textContent.indexOf('2.54') >= 0, $('formula').textContent);

    /* --- 交互反馈 --- */
    pick('fromUnit', 'm'); pick('toUnit', 'cm'); type('3');
    rec('输入后结果区有 flash 反馈类', $('resultBox').classList.contains('flash'),
        $('resultBox').className);

    /* --- 非法输入 --- */
    type('abc');
    rec('字母输入：输出为 —', outText() === '—', outText());
    rec('字母输入：提示为 error 级', msgCls() === 'msg error', msgCls());
    rec('字母输入：提示含「不是有效数字」', msgTxt().indexOf('不是有效数字') >= 0, msgTxt());
    rec('字母输入：aria-invalid=true', $('valueInput').getAttribute('aria-invalid') === 'true',
        $('valueInput').getAttribute('aria-invalid'));
    type('');
    rec('空输入：输出为 —', outText() === '—', outText());
    rec('空输入：提示为 hint 级（非报错）', msgCls() === 'msg hint', msgCls());
    rec('空输入：提示引导输入', msgTxt().indexOf('请输入') >= 0, msgTxt());
    type('9'.repeat(300));
    rec('超长 300 字符：被拦截且不崩', outText() === '—' && msgTxt().indexOf('过长') >= 0, msgTxt().slice(0, 40));
    rec('超长输入后页面仍可继续换算', (function () { type('4'); return outText() === '400'; })(), outText());
    type('-5');
    rec('负数长度：输出为 —', outText() === '—', outText());
    rec('负数长度：提示含「不能为负值」', msgTxt().indexOf('不能为负值') >= 0, msgTxt());

    /* --- 交换按钮 --- */
    type('100');
    var f0 = $('fromUnit').value, t0 = $('toUnit').value;
    $('swapBtn').click();
    rec('交换：from/to 互换', $('fromUnit').value === t0 && $('toUnit').value === f0,
        f0 + '->' + t0 + ' 变 ' + $('fromUnit').value + '->' + $('toUnit').value);
    rec('交换：结果同步重算（100 cm -> m = 1）', outText() === '1', outText());
    rec('交换：焦点移到源单位下拉框（键盘可达）', document.activeElement === $('fromUnit'),
        document.activeElement && document.activeElement.id);

    /* --- 切到重量 --- */
    cat('weight');
    rec('切重量：长度 tab 取消选中',
        document.querySelector('.tab[data-cat="length"]').getAttribute('aria-pressed') === 'false');
    rec('切重量：重量 tab 选中',
        document.querySelector('.tab[data-cat="weight"]').getAttribute('aria-pressed') === 'true');
    rec('切重量：源单位下拉框已重建为重量单位',
        $('fromUnit').options.length === 6 && $('fromUnit').value === 'kg',
        $('fromUnit').options.length + ' 项，值=' + $('fromUnit').value);
    rec('切重量：标签同步为「重量」', $('inputLabel').textContent.indexOf('重量') >= 0,
        $('inputLabel').textContent);
    type('1');
    rec('重量换算：1 kg -> lb = 2.2046226', outText() === '2.2046226', outText());
    type('-1');
    rec('负数重量：被拦截', outText() === '—' && msgTxt().indexOf('不能为负值') >= 0, msgTxt());
    pick('fromUnit', 'oz'); pick('toUnit', 'g'); type('1');
    rec('重量换算：1 oz -> g = 28.349523', outText() === '28.349523', outText());

    /* --- 切到温度 --- */
    cat('temp');
    rec('切温度：源单位下拉框为 摄氏度/华氏度/开尔文',
        $('fromUnit').options.length === 3 && $('fromUnit').value === 'c' && $('toUnit').value === 'f',
        $('fromUnit').value + '->' + $('toUnit').value);
    type('0');
    rec('温度 0 °C -> °F = 32', outText() === '32', outText());
    type('100');
    rec('温度 100 °C -> °F = 212', outText() === '212', outText());
    type('-40');
    rec('温度负值 -40 °C -> °F = -40', outText() === '-40', outText());
    rec('温度负值：不是错误提示', msgCls() !== 'msg error', msgCls());
    type('37');
    rec('温度 37 °C -> °F = 98.6', outText() === '98.6', outText());
    pick('fromUnit', 'k'); pick('toUnit', 'c'); type('0');
    rec('温度 0 K -> °C = -273.15', outText() === '-273.15', outText());
    pick('toUnit', 'f'); type('0');
    rec('温度 0 K -> °F = -459.67', outText() === '-459.67', outText());
    pick('fromUnit', 'f'); pick('toUnit', 'c'); type('32');
    rec('温度 32 °F -> °C = 0', outText() === '0', outText());
    pick('fromUnit', 'c'); pick('toUnit', 'k'); type('-300');
    rec('低于绝对零度：仍给出算术结果但不阻断', outText() === '-26.85', outText());
    rec('低于绝对零度：给出 warn 级提示', msgCls() === 'msg warn', msgCls());
    rec('低于绝对零度：提示说明物理无意义', msgTxt().indexOf('绝对零度') >= 0, msgTxt());

    /* --- 键盘可达结构 --- */
    var focusables = Array.prototype.slice.call(
      document.querySelectorAll('button, input, select, a[href], [tabindex]')
    ).filter(function (el) { return el.tabIndex >= 0 && !el.disabled; });
    var ids = focusables.map(function (el) { return el.id || el.dataset.cat || el.tagName; });
    rec('可聚焦元素顺序为 类别 -> 数值 -> 源单位 -> 交换 -> 目标单位',
        ids.join(',').indexOf('length,weight,temp,valueInput,fromUnit,swapBtn,toUnit') === 0,
        ids.join(','));
    rec('可聚焦元素均为原生控件且 tabIndex >= 0',
        focusables.every(function (el) { return el.tabIndex >= 0; }), focusables.length + ' 个');

    /* --- 无「计算」按钮 --- */
    var btns = Array.prototype.slice.call(document.querySelectorAll('button'));
    rec('按钮总数 = 4（3 类别 + 1 交换）', btns.length === 4, String(btns.length));
    rec('不存在「计算」按钮',
        btns.every(function (b) { return b.textContent.indexOf('计算') < 0; }),
        btns.map(function (b) { return b.textContent.trim(); }).join('|'));
    rec('输入框为文本类型且无 change 才触发的限制（支持 input 即时触发）',
        $('valueInput').tagName === 'INPUT' && $('valueInput').getAttribute('type') === 'text',
        $('valueInput').getAttribute('type'));

    /* --- 无未捕获异常 --- */
    rec('全程无未捕获异常/未处理拒绝', pageErrors.length === 0, pageErrors.join(' ; '));

    var pass = R.filter(function (r) { return r.ok; }).length;
    var payload = JSON.stringify({ total: R.length, pass: pass, fail: R.length - pass, rows: R });
    var b64 = btoa(unescape(encodeURIComponent(payload)));
    var pre = document.createElement('pre');
    pre.id = '__report';
    pre.textContent = b64;
    document.body.appendChild(pre);
    document.title = (R.length - pass === 0 ? 'ALLPASS' : 'FAILED') + ' ' + pass + '/' + R.length;
  } catch (e) {
    var pre2 = document.createElement('pre');
    pre2.id = '__report';
    pre2.textContent = 'FATAL ' + (e && e.message);
    document.body.appendChild(pre2);
  }
})();
</script>
</body>
</html>
