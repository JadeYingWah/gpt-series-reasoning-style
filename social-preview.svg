<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">GPT-Series Reasoning Style · 交付验收纪律层</title>
  <desc id="banner-desc">Minimal bilingual banner: the five-face forget/think rhythm, "says done" turned into "proves done", backed by 233 A/B experiments. Version line v1.4.x, MIT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#171233"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thinkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="180" cy="100" rx="460" ry="280" fill="url(#glowP)"/>
  <ellipse cx="1110" cy="560" rx="480" ry="300" fill="url(#glowC)"/>

  <!-- sparse decorations -->
  <circle cx="1090" cy="90" r="2.5" fill="#22D3EE" opacity="0.4"/>
  <circle cx="1210" cy="180" r="2" fill="#A78BFA" opacity="0.5"/>
  <circle cx="70" cy="540" r="2.5" fill="#A78BFA" opacity="0.4"/>
  <circle cx="380" cy="600" r="2" fill="#22D3EE" opacity="0.3"/>

  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <!-- top row -->
    <text x="94" y="64" font-size="18" font-weight="600" letter-spacing="4" fill="#22D3EE" opacity="0.92">AGENT SKILL</text>
    <text x="1186" y="64" text-anchor="end" font-size="18" letter-spacing="1" fill="#94A3B8">v1.4.x · MIT</text>

    <!-- title + bilingual tagline -->
    <text x="640" y="142" text-anchor="middle" font-size="54" font-weight="800" fill="#F1F5F9" letter-spacing="0.5">GPT-Series Reasoning Style</text>
    <text x="640" y="200" text-anchor="middle" font-size="30"><tspan fill="#94A3B8">把「说做完了」变成</tspan><tspan fill="#C4B5FD" font-weight="700">「证明做完了」</tspan></text>
    <text x="640" y="242" text-anchor="middle" font-size="21" fill="#64748B">Turn "says done" into "proves done".</text>

    <!-- five-face rhythm: big forget/think characters only -->
    <g text-anchor="middle">
      <!-- face 1: forget / plan -->
      <rect x="244" y="300" width="112" height="112" rx="24" fill="#131A31" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.9"/>
      <text x="300" y="370" font-size="44" font-weight="800" fill="#22D3EE">忘</text>
      <!-- face 2: think / plan -->
      <rect x="414" y="300" width="112" height="112" rx="24" fill="url(#thinkGrad)" stroke="#C4B5FD" stroke-width="1.5" stroke-opacity="0.55"/>
      <text x="470" y="370" font-size="44" font-weight="800" fill="#FBBF24">想</text>
      <!-- face 3: forget / do -->
      <rect x="584" y="300" width="112" height="112" rx="24" fill="#131A31" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.9"/>
      <text x="640" y="370" font-size="44" font-weight="800" fill="#22D3EE">忘</text>
      <!-- face 4: forget / review -->
      <rect x="754" y="300" width="112" height="112" rx="24" fill="#131A31" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.9"/>
      <text x="810" y="370" font-size="44" font-weight="800" fill="#22D3EE">忘</text>
      <!-- face 5: think / review -->
      <rect x="924" y="300" width="112" height="112" rx="24" fill="url(#thinkGrad)" stroke="#C4B5FD" stroke-width="1.5" stroke-opacity="0.55"/>
      <text x="980" y="370" font-size="44" font-weight="800" fill="#FBBF24">想</text>
    </g>

    <!-- flow arrows -->
    <g stroke="#22D3EE" stroke-width="2" opacity="0.7">
      <line x1="364" y1="356" x2="392" y2="356"/>
      <line x1="534" y1="356" x2="562" y2="356"/>
      <line x1="704" y1="356" x2="732" y2="356"/>
      <line x1="874" y1="356" x2="902" y2="356"/>
    </g>
    <g fill="#22D3EE" opacity="0.7">
      <polygon points="392,349 404,356 392,363"/>
      <polygon points="562,349 574,356 562,363"/>
      <polygon points="732,349 744,356 732,363"/>
      <polygon points="902,349 914,356 902,363"/>
    </g>

    <!-- tiny bilingual phase labels -->
    <g text-anchor="middle" font-size="15" fill="#8FA3BF">
      <text x="300" y="452">规划 Plan</text>
      <text x="470" y="452">规划 Plan</text>
      <text x="640" y="452">执行 Do</text>
      <text x="810" y="452">审查 Review</text>
      <text x="980" y="452">审查 Review</text>
    </g>

    <!-- experiments badge -->
    <rect x="430" y="512" width="420" height="40" rx="20" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="640" y="538" text-anchor="middle" font-size="19" font-weight="600" fill="#22D3EE">233 次 A/B 实验 · 233 A/B Experiments</text>
  </g>
</svg>
